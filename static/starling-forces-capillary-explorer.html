<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starling Forces Capillary Explorer | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 660px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .slider-row { display:flex; align-items:center; gap:10px; margin: 0.8rem 0; }
  .slider-row input[type=range] { flex:1; accent-color:#2d6a4f; }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; }
  .readout b { color:#2d6a4f; }
  svg text { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Starling Forces Capillary Explorer</h3>
  <div class="subtitle">Drag the slider to move a marker along the capillary, from the arterial end to the venous end. Watch hydrostatic and oncotic pressure — and net fluid movement — change with position.</div>
  <svg id="svgArea" viewBox="0 0 560 200" width="100%"></svg>
  <div class="slider-row">
    <span style="font-size:0.8rem; font-weight:600;">Arterial end</span>
    <input type="range" id="posSlider" min="0" max="100" value="0" step="1">
    <span style="font-size:0.8rem; font-weight:600;">Venous end</span>
  </div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById('svgArea');
  var slider = document.getElementById('posSlider');
  var readout = document.getElementById('readout');

  var oncoticPressure = 25;
  function hydrostaticAt(pos){
    return 36 - (36-15) * (pos/100);
  }

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function render(){
    svg.innerHTML = '';
    var pos = parseFloat(slider.value);
    var capX = 40, capY = 80, capW = 480, capH = 40;

    svg.appendChild(el('rect', {x: capX, y: capY, width: capW, height: capH, fill:'#fde8e8', stroke:'#dc2626', 'stroke-width':2, rx: capH/2}));
    svg.appendChild(el('text', {x: capX-5, y: capY-10, 'font-size':12, 'font-weight':700, fill:'#dc2626'})).textContent = 'Arterial end';
    var vLabel = el('text', {x: capX+capW-70, y: capY-10, 'font-size':12, 'font-weight':700, fill:'#1d70a2'});
    vLabel.textContent = 'Venous end';
    svg.appendChild(vLabel);

    var markerX = capX + (pos/100)*capW;
    svg.appendChild(el('line', {x1: markerX, y1: capY-15, x2: markerX, y2: capY+capH+15, stroke:'#1a472a', 'stroke-width':2, 'stroke-dasharray':'4,3'}));
    svg.appendChild(el('circle', {cx: markerX, cy: capY+capH/2, r: 7, fill:'#1a472a'}));

    var hydro = hydrostaticAt(pos);
    var net = hydro - oncoticPressure;

    var arrowY1 = capY+capH+35, arrowLen = 30;
    if (net > 0){
      svg.appendChild(el('line', {x1: markerX, y1: capY+capH+8, x2: markerX, y2: capY+capH+8+arrowLen, stroke:'#b45309', 'stroke-width':3, 'marker-end':'url(#arrowOut)'}));
      var lab1 = el('text', {x: markerX, y: capY+capH+8+arrowLen+16, 'font-size':11, fill:'#b45309', 'text-anchor':'middle', 'font-weight':700});
      lab1.textContent = 'Net filtration (' + net.toFixed(1) + ' mmHg out)';
      svg.appendChild(lab1);
    } else {
      svg.appendChild(el('line', {x1: markerX, y1: capY+capH+8+arrowLen, x2: markerX, y2: capY+capH+8, stroke:'#1d70a2', 'stroke-width':3, 'marker-end':'url(#arrowIn)'}));
      var lab2 = el('text', {x: markerX, y: capY+capH+8+arrowLen+16, 'font-size':11, fill:'#1d70a2', 'text-anchor':'middle', 'font-weight':700});
      lab2.textContent = 'Net reabsorption (' + Math.abs(net).toFixed(1) + ' mmHg in)';
      svg.appendChild(lab2);
    }

    var defs = el('defs', {});
    var markerOut = el('marker', {id:'arrowOut', markerWidth:8, markerHeight:8, refX:4, refY:8, orient:'auto'});
    markerOut.appendChild(el('path', {d:'M0,0 L8,0 L4,8 Z', fill:'#b45309'}));
    defs.appendChild(markerOut);
    var markerIn = el('marker', {id:'arrowIn', markerWidth:8, markerHeight:8, refX:4, refY:0, orient:'auto'});
    markerIn.appendChild(el('path', {d:'M0,8 L8,8 L4,0 Z', fill:'#1d70a2'}));
    defs.appendChild(markerIn);
    svg.insertBefore(defs, svg.firstChild);

    readout.innerHTML = 'At this position: <b>hydrostatic pressure</b> = ' + hydro.toFixed(1) + ' mmHg, <b>oncotic pressure</b> = ' + oncoticPressure + ' mmHg → ' +
      (net > 0 ? '<b>net filtration</b> (fluid pushed out of the capillary)' : '<b>net reabsorption</b> (fluid drawn back into the capillary)') + '.';
  }

  slider.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Transcriptional Processing Animator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #playBtn { display: block; margin: 0 auto 10px; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 10px 24px; font-size: 0.85rem; cursor: pointer; }
  #playBtn:hover { background: #1a472a; }
  #geneSvg { width: 100%; height: 140px; background: #f8fafc; border-radius: 14px; }
  #stageNote { text-align: center; margin-top: 10px; font-size: 0.84rem; color: #4b5563; min-height: 40px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Co-Transcriptional RNA Processing</h3>
  <div class="subtitle">Click Play: RNA Pol II moves along the gene, the 5' cap appears right after initiation, splicing removes an intron mid-transcription, and the poly(A) tail is added after cleavage.</div>
  <button id="playBtn">Play</button>
  <svg id="geneSvg" viewBox="0 0 420 140"></svg>
  <div id="stageNote">Click Play to start transcription.</div>
</div>
<script>
(function(){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('geneSvg');
  var note = document.getElementById('stageNote');
  var timer = null;
  var geneStart = 20, geneEnd = 380;
  var intronStart = 160, intronEnd = 220;

  function reset(){
    if (timer) clearTimeout(timer);
    svg.innerHTML = '';
    var line = document.createElementNS(ns,'line');
    line.setAttribute('x1',geneStart);line.setAttribute('y1',70);line.setAttribute('x2',geneEnd);line.setAttribute('y2',70);
    line.setAttribute('stroke','#cbd5e1');line.setAttribute('stroke-width','6');
    svg.appendChild(line);
    var intron = document.createElementNS(ns,'rect');
    intron.setAttribute('x',intronStart);intron.setAttribute('y',66);intron.setAttribute('width',intronEnd-intronStart);intron.setAttribute('height',8);
    intron.setAttribute('fill','#fca5a5');
    svg.appendChild(intron);
    note.textContent = 'Click Play to start transcription.';
  }

  function polSvg(x){
    var g = document.createElementNS(ns,'g');
    var c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',x);c.setAttribute('cy',70);c.setAttribute('r',12);c.setAttribute('fill','#7c3aed');c.setAttribute('id','polDot');
    g.appendChild(c);
    svg.appendChild(g);
  }

  function play(){
    reset();
    var pos = geneStart;
    var capAdded = false, splicedShown = false, polyAAdded = false;
    var transcript = document.createElementNS(ns,'line');
    transcript.setAttribute('id','transcriptLine');
    transcript.setAttribute('x1',geneStart);transcript.setAttribute('y1',110);transcript.setAttribute('x2',geneStart);transcript.setAttribute('y2',110);
    transcript.setAttribute('stroke','#166534');transcript.setAttribute('stroke-width','4');
    svg.appendChild(transcript);
    polSvg(pos);

    function step(){
      pos += 12;
      if (pos > geneEnd) pos = geneEnd;
      document.getElementById('polDot').setAttribute('cx', pos);
      document.getElementById('transcriptLine').setAttribute('x2', pos);

      if (!capAdded && pos > geneStart + 15){
        capAdded = true;
        var cap = document.createElementNS(ns,'circle');
        cap.setAttribute('cx',geneStart);cap.setAttribute('cy',110);cap.setAttribute('r',6);cap.setAttribute('fill','#fbbf24');
        svg.appendChild(cap);
        note.textContent = "5' cap added immediately after initiation begins.";
      } else if (pos > intronEnd && !splicedShown){
        splicedShown = true;
        var splice = document.createElementNS(ns,'rect');
        splice.setAttribute('x',intronStart);splice.setAttribute('y',104);splice.setAttribute('width',intronEnd-intronStart);splice.setAttribute('height',12);
        splice.setAttribute('fill','#fee2e2');splice.setAttribute('stroke','#dc2626');splice.setAttribute('stroke-dasharray','3 2');
        svg.appendChild(splice);
        note.textContent = 'Spliceosome removes the intron mid-transcription (lariat excised, exons ligated).';
      } else if (pos >= geneEnd && !polyAAdded){
        polyAAdded = true;
        var polyA = document.createElementNS(ns,'rect');
        polyA.setAttribute('x',geneEnd);polyA.setAttribute('y',106);polyA.setAttribute('width',30);polyA.setAttribute('height',8);
        polyA.setAttribute('fill','#a78bfa');
        svg.appendChild(polyA);
        note.textContent = 'Transcript cleaved at the poly(A) signal; poly(A) tail added — mature mRNA complete.';
      } else if (!splicedShown){
        note.textContent = 'RNA Pol II elongating — approaching the intron.';
      }

      if (pos < geneEnd){
        timer = setTimeout(step, 120);
      }
    }
    timer = setTimeout(step, 200);
  }

  document.getElementById('playBtn').addEventListener('click', play);
  reset();
})();
</script>
</body>
</html>

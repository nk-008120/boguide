<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxonomic Hierarchy Explorer | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .ranks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.2rem; }
  .rank-btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    font-size: 0.8rem;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    text-align: center;
    line-height: 1.2;
  }
  .rank-btn .r { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: #94a3b8; }
  .rank-btn.active { background: #1d70a2; border-color: #1d70a2; color: #fff; }
  .rank-btn.active .r { color: #d7ecfb; }
  .panel {
    background: #f1f5f9;
    border-radius: 14px;
    padding: 14px 16px;
  }
  .panel h4 { margin: 0 0 4px 0; font-size: 1.05rem; color: #1a472a; }
  .panel .desc { font-size: 0.85rem; color: #334155; margin-bottom: 10px; }
  .siblings-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; margin-bottom: 6px; }
  .siblings { display: flex; flex-wrap: wrap; gap: 6px; }
  .sib-chip {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: #475569;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Taxonomic Hierarchy Explorer</h3>
  <div class="subtitle">Click each rank to see where <em>Homo sapiens</em> sits, what distinguishes that rank, and its sibling taxa at the same level.</div>
  <div class="ranks" id="ranks"></div>
  <div class="panel" id="panel"></div>
</div>
<script>
(function(){
  var data = [
    { rank: 'Domain', value: 'Eukarya', desc: 'Distinguishes cellular organization type — a membrane-bound nucleus and internal compartmentalization, as opposed to the prokaryotic domains.', siblings: ['Bacteria', 'Archaea'] },
    { rank: 'Kingdom', value: 'Animalia', desc: 'Multicellular, heterotrophic by ingestion, no cell wall — distinguished from the other eukaryotic kingdoms by nutrition mode and cell structure.', siblings: ['Plantae', 'Fungi', 'Protista (informal)'] },
    { rank: 'Phylum', value: 'Chordata', desc: 'Defined by the notochord, dorsal hollow nerve cord, pharyngeal slits, and post-anal tail present at some life stage.', siblings: ['Arthropoda', 'Mollusca', 'Annelida', 'Echinodermata'] },
    { rank: 'Class', value: 'Mammalia', desc: 'Hair, mammary glands, differentiated teeth, a single lower jawbone, and three middle-ear ossicles distinguish this class from other tetrapods.', siblings: ['Aves', 'Amphibia', 'Sauropsida (Reptilia)'] },
    { rank: 'Order', value: 'Primates', desc: 'Forward-facing eyes with stereoscopic vision, opposable thumbs, and a large brain-to-body ratio relative to other mammalian orders.', siblings: ['Carnivora', 'Rodentia', 'Chiroptera'] },
    { rank: 'Family', value: 'Hominidae', desc: 'The great apes — distinguished from other primate families by absence of a tail and specific dental/cranial features.', siblings: ['Cercopithecidae (Old World monkeys)', 'Hylobatidae (gibbons)'] },
    { rank: 'Genus', value: 'Homo', desc: 'Obligate bipedalism, a markedly enlarged brain relative to other Hominidae genera, and habitual tool use.', siblings: ['Pan (chimpanzees)', 'Gorilla', 'Pongo (orangutans)'] },
    { rank: 'Species', value: 'sapiens', desc: 'The specific epithet — combined with the genus, forms the full binomial <em>Homo sapiens</em>. Distinguished from other (mostly extinct) <em>Homo</em> species by specific cranial and skeletal features.', siblings: ['H. erectus (extinct)', 'H. neanderthalensis (extinct)', 'H. habilis (extinct)'] }
  ];
  var ranksEl = document.getElementById('ranks');
  var panel = document.getElementById('panel');
  var active = 0;

  function render(){
    ranksEl.innerHTML = '';
    data.forEach(function(d, i){
      var btn = document.createElement('div');
      btn.className = 'rank-btn' + (i === active ? ' active' : '');
      btn.innerHTML = '<span class="r">' + d.rank + '</span>' + d.value;
      btn.addEventListener('click', function(){ active = i; render(); });
      ranksEl.appendChild(btn);
    });
    var d = data[active];
    panel.innerHTML = '<h4>' + d.rank + ': ' + d.value + '</h4>' +
      '<div class="desc">' + d.desc + '</div>' +
      '<div class="siblings-label">Sibling taxa at this rank</div>' +
      '<div class="siblings">' + d.siblings.map(function(s){ return '<span class="sib-chip">' + s + '</span>'; }).join('') + '</div>';
  }

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endocrine Axis Builder | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle-row { display:flex; gap:8px; margin-bottom: 1rem; }
  .toggle-btn {
    flex: 1; padding: 8px 6px; border-radius: 999px; border: 2px solid #cbd5e1;
    background: #f8fafc; font-size: 0.78rem; font-weight: 600; cursor: pointer; color:#475569;
  }
  .toggle-btn.active { background:#1d70a2; border-color:#1d70a2; color:#fff; }
  .chain { display:flex; align-items:center; gap:6px; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .fixed-node {
    background:#f1f5f9; border-radius:10px; padding:8px 10px; font-size:0.78rem; font-weight:700; color:#334155;
  }
  .arrow { color:#94a3b8; }
  .blank {
    min-width: 110px; min-height: 34px; border: 2px dashed #cbd5e1; border-radius: 10px;
    display:flex; align-items:center; justify-content:center; font-size:0.78rem; color:#94a3b8; padding: 4px 8px;
    text-align:center;
  }
  .blank.correct { border-color:#166534; background:#dcfce7; color:#166534; font-weight:700; }
  .blank.dragover { border-color:#1d70a2; background:#eef6fb; }
  .tray { display:flex; flex-wrap:wrap; gap:8px; padding: 12px; background:#f8fafc; border-radius:14px; min-height: 50px; }
  .tile {
    background:#fff; border:2px solid #2d6a4f; color:#2d6a4f; border-radius:999px; padding:6px 14px;
    font-size:0.78rem; font-weight:700; cursor:grab; user-select:none;
  }
  .tile.dragging { opacity: 0.4; }
  .status { margin-top: 0.8rem; font-size: 0.82rem; text-align:center; color:#4b5563; min-height: 20px; }
  .status.done { color:#166534; font-weight:700; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Endocrine Axis Builder</h3>
  <div class="subtitle">Drag each tile into the correct blank to reconstruct the axis. Wrong drops snap back to the tray.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" data-axis="hpa">HPA axis</button>
    <button class="toggle-btn" data-axis="hpt">HPT axis</button>
    <button class="toggle-btn" data-axis="gh">GH axis</button>
  </div>
  <div class="chain" id="chain"></div>
  <div class="tray" id="tray"></div>
  <div class="status" id="status"></div>
</div>
<script>
(function(){
  var axes = {
    hpa: {
      blanks: ['Releasing hormone', 'Tropic hormone', 'Peripheral gland', 'Peripheral hormone'],
      answers: ['CRH', 'ACTH', 'Adrenal cortex', 'Cortisol'],
      distractors: ['TRH', 'GH', 'Thyroid gland']
    },
    hpt: {
      blanks: ['Releasing hormone', 'Tropic hormone', 'Peripheral gland', 'Peripheral hormone'],
      answers: ['TRH', 'TSH', 'Thyroid gland', 'Thyroid hormone'],
      distractors: ['CRH', 'ACTH', 'IGF-1']
    },
    gh: {
      blanks: ['Releasing hormone', 'Tropic hormone', 'Peripheral gland', 'Peripheral hormone'],
      answers: ['GHRH', 'GH', 'Liver', 'IGF-1'],
      distractors: ['TRH', 'Cortisol', 'Adrenal cortex']
    }
  };

  var chainEl = document.getElementById('chain');
  var trayEl = document.getElementById('tray');
  var statusEl = document.getElementById('status');
  var toggleBtns = document.querySelectorAll('.toggle-btn');
  var currentAxis = 'hpa';
  var filled = 0;

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildChain(axisKey){
    var axis = axes[axisKey];
    chainEl.innerHTML = '';
    var fixedLabels = ['Hypothalamus', null, 'Anterior pituitary', null, null, null];
    var slotIdx = 0;
    axis.blanks.forEach(function(blankLabel, i){
      var fixed = document.createElement('div');
      fixed.className = 'fixed-node';
      if (i === 0){ fixed.textContent = 'Hypothalamus'; chainEl.appendChild(fixed); appendArrow(); }
      var blank = document.createElement('div');
      blank.className = 'blank';
      blank.textContent = blankLabel;
      blank.dataset.answer = axis.answers[i];
      blank.dataset.index = i;
      attachDropHandlers(blank);
      chainEl.appendChild(blank);
      if (i === 0){
        appendArrow();
        var pit = document.createElement('div');
        pit.className = 'fixed-node';
        pit.textContent = 'Anterior pituitary';
        chainEl.appendChild(pit);
        appendArrow();
      } else if (i < axis.blanks.length - 1){
        appendArrow();
      }
    });
  }

  function appendArrow(){
    var arrow = document.createElement('div');
    arrow.className = 'arrow';
    arrow.textContent = '→';
    chainEl.appendChild(arrow);
  }

  function attachDropHandlers(blank){
    blank.addEventListener('dragover', function(e){
      e.preventDefault();
      if (!blank.classList.contains('correct')) blank.classList.add('dragover');
    });
    blank.addEventListener('dragleave', function(){
      blank.classList.remove('dragover');
    });
    blank.addEventListener('drop', function(e){
      e.preventDefault();
      blank.classList.remove('dragover');
      if (blank.classList.contains('correct')) return;
      var word = e.dataTransfer.getData('text/plain');
      var tileId = e.dataTransfer.getData('text/tile-id');
      var tile = document.getElementById(tileId);
      if (word === blank.dataset.answer){
        blank.textContent = word;
        blank.classList.add('correct');
        if (tile) tile.remove();
        filled++;
        checkDone();
      } else {
        blank.classList.add('dragover');
        setTimeout(function(){ blank.classList.remove('dragover'); }, 300);
      }
    });
  }

  function checkDone(){
    var axis = axes[currentAxis];
    if (filled >= axis.blanks.length){
      statusEl.textContent = 'Axis complete!';
      statusEl.classList.add('done');
    }
  }

  function buildTray(axisKey){
    trayEl.innerHTML = '';
    var axis = axes[axisKey];
    var words = shuffle(axis.answers.concat(axis.distractors));
    words.forEach(function(word, i){
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = word;
      tile.draggable = true;
      tile.id = 'tile-' + axisKey + '-' + i;
      tile.addEventListener('dragstart', function(e){
        e.dataTransfer.setData('text/plain', word);
        e.dataTransfer.setData('text/tile-id', tile.id);
        tile.classList.add('dragging');
      });
      tile.addEventListener('dragend', function(){
        tile.classList.remove('dragging');
      });
      trayEl.appendChild(tile);
    });
  }

  function loadAxis(axisKey){
    currentAxis = axisKey;
    filled = 0;
    statusEl.textContent = '';
    statusEl.classList.remove('done');
    buildChain(axisKey);
    buildTray(axisKey);
  }

  toggleBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      toggleBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      loadAxis(btn.dataset.axis);
    });
  });

  loadAxis('hpa');
})();
</script>
</body>
</html>

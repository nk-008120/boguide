<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy System Recruitment | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .scrub-row { display:flex; align-items:center; gap:10px; margin-top: 0.6rem; }
  .scrub-row input[type=range] { flex:1; accent-color:#2d6a4f; }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.82rem; margin-top: 0.8rem; }
  .readout b { color:#2d6a4f; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Energy System Recruitment During Maximal Effort</h3>
  <div class="subtitle">Drag the time marker across a simulated maximal effort and see which of the three ATP-regenerating systems dominates at each moment.</div>
  <div id="plot" style="width:100%; height:380px;"></div>
  <div class="scrub-row">
    <span style="font-size:0.8rem; font-weight:600; color:#334155;">Time into effort:</span>
    <input type="range" id="timeSlider" min="0" max="100" value="5" step="1">
  </div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var tMax = 180;
  var N = 200;
  var t = [], atpPCr = [], glycolysis = [], oxidative = [];
  for (var i=0;i<N;i++){
    var tt = i/(N-1)*tMax;
    t.push(tt);
    var pcr = 100 * Math.exp(-tt/4);
    var glyc = 90 * (1 - Math.exp(-tt/6)) * Math.exp(-tt/50);
    var oxid = 70 * (1 - Math.exp(-tt/25));
    atpPCr.push(pcr);
    glycolysis.push(glyc);
    oxidative.push(oxid);
  }

  var plotDiv = document.getElementById('plot');
  var slider = document.getElementById('timeSlider');
  var readout = document.getElementById('readout');

  function traces(){
    return [
      {x:t, y:atpPCr, name:'ATP-PCr system', mode:'lines', fill:'tozeroy', stackgroup:'one', line:{color:'#e67e22'}},
      {x:t, y:glycolysis, name:'Anaerobic glycolysis', mode:'lines', fill:'tonexty', stackgroup:'one', line:{color:'#dc2626'}},
      {x:t, y:oxidative, name:'Oxidative phosphorylation', mode:'lines', fill:'tonexty', stackgroup:'one', line:{color:'#1d70a2'}}
    ];
  }

  function markerShape(){
    var tt = parseFloat(slider.value)/100*tMax;
    return [{type:'line', x0:tt, x1:tt, y0:0, y1:260, xref:'x', yref:'y', line:{color:'#b91c1c', width:2}}];
  }

  function dominantSystem(tt){
    var idx = Math.min(N-1, Math.round(tt/tMax*(N-1)));
    var vals = {'ATP-PCr system': atpPCr[idx], 'Anaerobic glycolysis': glycolysis[idx], 'Oxidative phosphorylation': oxidative[idx]};
    var best = 'ATP-PCr system', bestVal = -1;
    for (var k in vals){ if (vals[k] > bestVal){ bestVal = vals[k]; best = k; } }
    return best;
  }

  function render(){
    var layout = {
      xaxis: {title:'Time into effort (seconds)', range:[0,tMax], gridcolor:'#e9ecef'},
      yaxis: {title:'Relative ATP contribution', range:[0,260], gridcolor:'#e9ecef'},
      shapes: markerShape(),
      legend: {orientation:'h', y:-0.2},
      margin: {t:20, l:55, r:20, b:45},
      plot_bgcolor:'#ffffff', paper_bgcolor:'#ffffff'
    };
    Plotly.react(plotDiv, traces(), layout, {responsive:true, displayModeBar:false});
    updateReadout();
  }

  function updateReadout(){
    var tt = parseFloat(slider.value)/100*tMax;
    var dom = dominantSystem(tt);
    readout.innerHTML = '<b>t = ' + tt.toFixed(0) + ' s</b> — Dominant system right now: <b>' + dom + '</b>.';
  }

  slider.addEventListener('input', function(){
    Plotly.relayout(plotDiv, {shapes: markerShape()});
    updateReadout();
  });

  render();
})();
</script>
</body>
</html>

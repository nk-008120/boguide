<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominance Relationship Comparator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .modes, .crosses { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .mode-btn, .cross-btn {
    background: #f1f5f9;
    color: #334155;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-btn.active { background: #2d6a4f; color: #fff; }
  .cross-btn.active { background: #1d70a2; color: #fff; }
  .layout { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; margin-top: 1rem; }
  .grid-panel { flex: 0 0 auto; }
  .parent-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.85rem; font-weight: 600; }
  .offspring-grid { display: grid; grid-template-columns: repeat(2, 70px); gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .swatch { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #94a3b8; overflow: hidden; position: relative; }
  .swatch-label { font-size: 0.7rem; margin-top: 4px; color: #334155; font-weight: 600; }
  .half { position: absolute; top: 0; bottom: 0; width: 50%; }
  .results { flex: 1; min-width: 220px; }
  .readout { background: #f1f5f9; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; font-size: 0.9rem; }
  .readout b { color: #1d70a2; }
  .note { font-size: 0.82rem; color: #4b5563; margin-top: 10px; }
  .legend { font-size: 0.78rem; color: #4b5563; margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; margin-right: 12px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; border: 1px solid #94a3b8; display:inline-block; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Dominance Relationship Comparator</h3>
  <div class="subtitle">Pick a dominance mode and a cross, and see how the heterozygote actually looks — and how that changes the phenotype ratio.</div>
  <div class="modes">
    <button class="mode-btn active" id="modeComplete">Complete Dominance</button>
    <button class="mode-btn" id="modeIncomplete">Incomplete Dominance</button>
    <button class="mode-btn" id="modeCodom">Codominance</button>
  </div>
  <div class="crosses">
    <button class="cross-btn active" id="crossAAaa">AA × aa</button>
    <button class="cross-btn" id="crossAaAa">Aa × Aa</button>
    <button class="cross-btn" id="crossAaaa">Aa × aa</button>
  </div>

  <div class="layout">
    <div class="grid-panel">
      <div class="offspring-grid" id="grid"></div>
    </div>
    <div class="results">
      <div class="readout" id="phenoReadout">Phenotype ratio: —</div>
      <div class="note" id="explainNote"></div>
      <div class="legend">
        <span><span class="dot" style="background:#d9534f;"></span>A allele (red)</span>
        <span><span class="dot" style="background:#fefcf5;"></span>a allele (white)</span>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var mode = 'complete';
  var cross = 'AAaa';
  var modeBtns = { complete: document.getElementById('modeComplete'), incomplete: document.getElementById('modeIncomplete'), codom: document.getElementById('modeCodom') };
  var crossBtns = { AAaa: document.getElementById('crossAAaa'), AaAa: document.getElementById('crossAaAa'), Aaaa: document.getElementById('crossAaaa') };
  var crossParents = { AAaa: ['AA','aa'], AaAa: ['Aa','Aa'], Aaaa: ['Aa','aa'] };
  var grid = document.getElementById('grid');
  var phenoReadout = document.getElementById('phenoReadout');
  var explainNote = document.getElementById('explainNote');

  Object.keys(modeBtns).forEach(function(k){
    modeBtns[k].addEventListener('click', function(){
      mode = k;
      Object.keys(modeBtns).forEach(function(kk){ modeBtns[kk].classList.toggle('active', kk===k); });
      render();
    });
  });
  Object.keys(crossBtns).forEach(function(k){
    crossBtns[k].addEventListener('click', function(){
      cross = k;
      Object.keys(crossBtns).forEach(function(kk){ crossBtns[kk].classList.toggle('active', kk===k); });
      render();
    });
  });

  function gametesForLocus(genotype){
    if (genotype[0] === genotype[1]) return [genotype[0]];
    return [genotype[0], genotype[1]];
  }
  function combine(a,b){
    if (a === 'A' && b === 'A') return 'AA';
    if (a === 'a' && b === 'a') return 'aa';
    return 'Aa';
  }
  function gcd(a,b){ return b === 0 ? a : gcd(b, a % b); }
  function ratioString(counts){
    var keys = Object.keys(counts);
    var vals = keys.map(function(k){ return counts[k]; });
    var g = vals.reduce(function(a,b){ return gcd(a,b); });
    return keys.map(function(k){ return (counts[k]/g) + ' ' + k; }).join(' : ');
  }

  function swatchHtml(genotype){
    if (mode === 'complete'){
      var color = genotype.indexOf('A') !== -1 ? '#d9534f' : '#fefcf5';
      return '<div class="swatch" style="background:' + color + ';"></div>';
    }
    if (mode === 'incomplete'){
      var c;
      if (genotype === 'AA') c = '#d9534f';
      else if (genotype === 'aa') c = '#fefcf5';
      else c = '#f0a8a2';
      return '<div class="swatch" style="background:' + c + ';"></div>';
    }

    if (genotype === 'AA') return '<div class="swatch" style="background:#d9534f;"></div>';
    if (genotype === 'aa') return '<div class="swatch" style="background:#fefcf5;"></div>';
    return '<div class="swatch"><div class="half" style="left:0;background:#d9534f;"></div><div class="half" style="right:0;background:#fefcf5;"></div></div>';
  }

  function phenoLabel(genotype){
    if (mode === 'complete'){
      return genotype.indexOf('A') !== -1 ? 'Dominant phenotype' : 'Recessive phenotype';
    }
    if (mode === 'incomplete'){
      if (genotype === 'AA') return 'Red';
      if (genotype === 'aa') return 'White';
      return 'Pink (blend)';
    }
    if (genotype === 'AA') return 'Red only';
    if (genotype === 'aa') return 'White only';
    return 'Red + White (both)';
  }

  function render(){
    var parents = crossParents[cross];
    var g1 = gametesForLocus(parents[0]);
    var g2 = gametesForLocus(parents[1]);
    grid.innerHTML = '';
    var phenoCounts = {};
    g1.forEach(function(a){
      g2.forEach(function(b){
        var geno = combine(a,b);
        var label = phenoLabel(geno);
        phenoCounts[label] = (phenoCounts[label] || 0) + 1;
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = swatchHtml(geno) + '<div class="swatch-label">' + geno + '</div>';
        grid.appendChild(cell);
      });
    });
    phenoReadout.innerHTML = 'Phenotype ratio: <b>' + ratioString(phenoCounts) + '</b>';
    if (mode === 'complete'){
      explainNote.textContent = 'Aa looks identical to AA — the heterozygote is indistinguishable from the dominant homozygote.';
    } else if (mode === 'incomplete'){
      explainNote.textContent = 'Aa produces a new, intermediate blended phenotype (pink) — distinct from both homozygotes.';
    } else {
      explainNote.textContent = 'Aa shows both parental phenotypes simultaneously and distinguishably, not a blend.';
    }
  }

  render();
})();
</script>
</body>
</html>

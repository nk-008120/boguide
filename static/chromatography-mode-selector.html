<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatography Mode Selector | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #goal { font-weight: 700; margin-bottom: 10px; padding: 10px; background: #f1f5f9; border-radius: 10px; font-size: 0.9rem; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .choice {
    flex: 1; min-width: 150px; padding: 10px; text-align: center; border-radius: 10px;
    border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; font-size: 0.82rem; font-weight: 600;
  }
  .choice:hover { border-color: #94a3b8; }
  .choice.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
  .choice.wrong { background: #fee2e2; border-color: #f87171; color: #991b1b; }
  #anim { height: 90px; background: #f8fafc; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 10px; }
  #anim .particle { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #2d6a4f; top: 38px; left: 8px; transition: left 1.4s ease; }
  #feedback { min-height: 44px; font-size: 0.85rem; color: #4b5563; }
  #nextBtn { margin-top: 8px; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 8px 18px; font-size: 0.82rem; cursor: pointer; }
  #nextBtn:hover { background: #1a472a; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Choose the Right Chromatography Mode</h3>
  <div class="subtitle">Given a purification goal, pick the correct technique and watch the separation animate.</div>
  <div id="goal"></div>
  <div class="choices" id="choices"></div>
  <div id="anim"><div class="particle" id="particle"></div></div>
  <div id="feedback"></div>
  <button id="nextBtn">Next scenario &rarr;</button>
</div>
<script>
(function(){
  var scenarios = [
    { goal: 'Isolate a His-tagged recombinant protein from a crude bacterial lysate in one step.', correct: 'Affinity',
      explain: 'Affinity chromatography exploits the engineered His-tag binding a Ni2+ resin with high specificity — the most direct single-step purification when a tag/epitope is available.' },
    { goal: 'Estimate a protein’s native molecular weight while keeping it folded and active.', correct: 'Size-exclusion',
      explain: 'Size-exclusion (gel filtration) separates by native size without denaturing the sample — larger molecules elute first, bypassing the porous beads.' },
    { goal: 'Separate two proteins of similar size that differ mainly in net surface charge.', correct: 'Ion-exchange',
      explain: 'Ion-exchange chromatography binds proteins by net charge to an oppositely-charged resin, eluting them with a salt gradient roughly in order of charge magnitude.' }
  ];
  var options = ['Affinity', 'Size-exclusion', 'Ion-exchange'];
  var idx = 0;
  var goalEl = document.getElementById('goal');
  var choicesEl = document.getElementById('choices');
  var feedback = document.getElementById('feedback');
  var particle = document.getElementById('particle');

  function render(){
    var s = scenarios[idx];
    goalEl.textContent = 'Goal: ' + s.goal;
    feedback.textContent = '';
    particle.style.left = '8px';
    choicesEl.innerHTML = '';
    options.forEach(function(opt){
      var btn = document.createElement('div');
      btn.className = 'choice';
      btn.textContent = opt;
      btn.addEventListener('click', function(){
        var already = choicesEl.querySelector('.correct, .wrong');
        if (already) return;
        if (opt === s.correct){
          btn.classList.add('correct');
          feedback.innerHTML = '<b>Correct.</b> ' + s.explain;
          particle.style.left = '260px';
        } else {
          btn.classList.add('wrong');
          Array.prototype.forEach.call(choicesEl.children, function(c){
            if (c.textContent === s.correct) c.classList.add('correct');
          });
          feedback.innerHTML = '<b>Not quite.</b> ' + s.explain;
        }
      });
      choicesEl.appendChild(btn);
    });
  }

  document.getElementById('nextBtn').addEventListener('click', function(){
    idx = (idx + 1) % scenarios.length;
    render();
  });

  render();
})();
</script>
</body>
</html>

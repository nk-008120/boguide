<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Wall Layer Builder | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .layout { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
  .toggles { flex: 0 0 220px; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f5f9;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .toggle-row input { cursor: pointer; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .diagram { flex: 1; min-width: 260px; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: #334155;
    margin-top: 10px;
    min-height: 3.2em;
  }
  .shared { color: #1d70a2; font-weight: 700; }
  .cellspecific { color: #b45309; font-weight: 700; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Cell Wall Layer Builder</h3>
  <div class="subtitle">Toggle each layer on/off to see which are shared between adjacent cells and which belong to one cell only.</div>
  <div class="layout">
    <div class="toggles">
      <label class="toggle-row"><input type="checkbox" id="chkLamella" checked><span class="swatch" style="background:#c9a86a"></span>Middle lamella</label>
      <label class="toggle-row"><input type="checkbox" id="chkPrimary" checked><span class="swatch" style="background:#8fbf8a"></span>Primary wall</label>
      <label class="toggle-row"><input type="checkbox" id="chkSecondary"><span class="swatch" style="background:#5a7d4f"></span>Secondary wall</label>
      <label class="toggle-row"><input type="checkbox" id="chkPlasmo"><span class="swatch" style="background:#7fb8e0"></span>Plasmodesmata</label>
      <div class="note" id="note">All layers shown. The middle lamella sits between and is shared by both cells; primary and secondary walls are each deposited by, and belong to, one specific cell.</div>
    </div>
    <div class="diagram">
      <svg id="wallSvg" viewBox="0 0 260 240" width="260" height="240">
        <rect x="10" y="10" width="100" height="220" fill="#eef6ec"/>
        <rect x="150" y="10" width="100" height="220" fill="#eef6ec"/>
        <text x="60" y="26" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Cell A</text>
        <text x="200" y="26" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Cell B</text>
        <g id="secondaryLayers">
          <rect x="94" y="10" width="10" height="220" fill="#5a7d4f"/>
          <rect x="156" y="10" width="10" height="220" fill="#5a7d4f"/>
        </g>
        <g id="primaryLayers">
          <rect x="104" y="10" width="10" height="220" fill="#8fbf8a"/>
          <rect x="146" y="10" width="10" height="220" fill="#8fbf8a"/>
        </g>
        <g id="lamellaLayer">
          <rect x="114" y="10" width="32" height="220" fill="#c9a86a"/>
        </g>
        <g id="plasmoLayer">
          <rect x="94" y="55" width="72" height="10" fill="#7fb8e0"/>
          <rect x="94" y="115" width="72" height="10" fill="#7fb8e0"/>
          <rect x="94" y="175" width="72" height="10" fill="#7fb8e0"/>
        </g>
      </svg>
    </div>
  </div>
</div>
<script>
(function(){
  var chkLamella = document.getElementById('chkLamella');
  var chkPrimary = document.getElementById('chkPrimary');
  var chkSecondary = document.getElementById('chkSecondary');
  var chkPlasmo = document.getElementById('chkPlasmo');
  var note = document.getElementById('note');
  var secondaryLayers = document.getElementById('secondaryLayers');
  var primaryLayers = document.getElementById('primaryLayers');
  var lamellaLayer = document.getElementById('lamellaLayer');
  var plasmoLayer = document.getElementById('plasmoLayer');
  var notes = {
    lamella: 'The middle lamella is pectin-rich and <span class="shared">shared between both cells</span> — it is the layer that separates when cells "let go" of each other, as in fruit softening or leaf abscission.',
    primary: 'The primary wall is thin and flexible, deposited while each cell is still growing. Each cell deposits its <span class="cellspecific">own primary wall</span> — Cell A\'s primary wall is a distinct structure from Cell B\'s, even though they sit right next to each other.',
    secondary: 'The secondary wall is deposited internal to the primary wall after growth stops, often lignified. Like the primary wall, it is <span class="cellspecific">cell-specific</span> — only cells requiring extra strength (e.g. sclerenchyma, xylem conducting cells) deposit one at all.',
    plasmo: 'Plasmodesmata are cytoplasmic channels, lined with plasma membrane, that cross the entire wall stack to connect the cytoplasm of neighboring cells directly — the physical basis of the symplast pathway.'
  };
  function update(){
    secondaryLayers.style.display = chkSecondary.checked ? '' : 'none';
    primaryLayers.style.display = chkPrimary.checked ? '' : 'none';
    lamellaLayer.style.display = chkLamella.checked ? '' : 'none';
    plasmoLayer.style.display = chkPlasmo.checked ? '' : 'none';
    var parts = [];
    if (chkLamella.checked) parts.push(notes.lamella);
    if (chkPrimary.checked) parts.push(notes.primary);
    if (chkSecondary.checked) parts.push(notes.secondary);
    if (chkPlasmo.checked) parts.push(notes.plasmo);
    note.innerHTML = parts.length ? parts[parts.length-1] : 'No layers shown — toggle one on to see its structural role.';
  }
  chkLamella.addEventListener('change', update);
  chkPrimary.addEventListener('change', update);
  chkSecondary.addEventListener('change', update);
  chkPlasmo.addEventListener('change', update);
  update();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetacean Fossil Series Timeline Explorer | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.4rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #track { position: relative; height: 90px; margin: 0 20px; }
  #track .line { position: absolute; top: 40px; left: 0; right: 0; height: 4px; background: #cbd5e1; border-radius: 2px; }
  .node {
    position: absolute;
    top: 24px;
    width: 36px;
    height: 36px;
    margin-left: -18px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #1d70a2;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #1d70a2;
    transition: transform 0.15s, background 0.15s, color 0.15s;
  }
  .node:hover { transform: scale(1.12); }
  .node.active { background: #1d70a2; color: #fff; transform: scale(1.15); }
  .node-label {
    position: absolute;
    top: 66px;
    width: 90px;
    margin-left: -45px;
    text-align: center;
    font-size: 0.75rem;
    font-style: italic;
    color: #334155;
  }
  #info {
    background: #f8fafc;
    border-radius: 16px;
    padding: 1rem 1.2rem;
    margin-top: 1.6rem;
    min-height: 120px;
  }
  #info h4 { margin: 0 0 6px 0; color: #1a472a; }
  #info .date { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }
  #info .changes { font-size: 0.9rem; line-height: 1.5; }
  #info .changes b { color: #1d70a2; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Cetacean Fossil Series Timeline Explorer</h3>
  <div class="subtitle">Click each taxon to see the specific skeletal changes accumulated at that step of the terrestrial-mammal-to-whale transition.</div>
  <div id="track"><div class="line"></div></div>
  <div id="info"></div>
</div>
<script>
(function(){
  var taxa = [
    {
      name: 'Pakicetus',
      date: '~50 mya',
      changes: 'Fully <b>terrestrial, four-legged</b> mammal. Ear bone structure (involucrum) is the first and only skeletal clue linking it to whales — externally it looked like a land-dwelling hoofed carnivore.'
    },
    {
      name: 'Ambulocetus',
      date: '~50–48 mya',
      changes: '<b>Semi-aquatic</b>: robust limbs still capable of walking on land, but large hind feet suited to paddling. Likely hunted like a crocodile, ambushing prey near water.'
    },
    {
      name: 'Rodhocetus',
      date: '~48–41 mya',
      changes: 'More committed to water: <b>hip bones no longer fused to the backbone</b>, reducing the ability to support weight on land and improving aquatic propulsion. Nostrils shifted slightly further back on the skull.'
    },
    {
      name: 'Modern whale',
      date: '~40 mya–present',
      changes: '<b>Hind limbs vestigial or absent</b> internally, forelimbs modified into flippers, nostrils migrated fully to the top of the skull as a blowhole, tail bears horizontal flukes for propulsion.'
    }
  ];

  var track = document.getElementById('track');
  var info = document.getElementById('info');
  var nodeEls = [];

  taxa.forEach(function(t, i){
    var pct = (i / (taxa.length - 1)) * 100;
    var node = document.createElement('div');
    node.className = 'node';
    node.style.left = pct + '%';
    node.textContent = i + 1;
    node.addEventListener('click', function(){ select(i); });
    track.appendChild(node);
    nodeEls.push(node);

    var label = document.createElement('div');
    label.className = 'node-label';
    label.style.left = pct + '%';
    label.textContent = t.name;
    track.appendChild(label);
  });

  function select(i){
    nodeEls.forEach(function(n, idx){ n.classList.toggle('active', idx === i); });
    var t = taxa[i];
    info.innerHTML = '<h4>' + t.name + '</h4><div class="date">' + t.date + '</div><div class="changes">' + t.changes + '</div>';
  }

  select(0);
})();
</script>
</body>
</html>

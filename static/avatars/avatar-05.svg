<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="100" fill="#e0f0e8"/>
  <g transform="translate(100,100)">
    <!-- Frog face -->
    <ellipse cx="0" cy="8" rx="38" ry="30" fill="#5cb85c"/>
    <!-- Eyes (on top) -->
    <circle cx="-20" cy="-18" r="14" fill="#5cb85c"/>
    <circle cx="20" cy="-18" r="14" fill="#5cb85c"/>
    <circle cx="-20" cy="-20" r="10" fill="white"/>
    <circle cx="20" cy="-20" r="10" fill="white"/>
    <circle cx="-18" cy="-20" r="5" fill="#2a2a2a"/>
    <circle cx="22" cy="-20" r="5" fill="#2a2a2a"/>
    <circle cx="-16" cy="-22" r="1.5" fill="white"/>
    <circle cx="24" cy="-22" r="1.5" fill="white"/>
    <!-- Mouth -->
    <path d="M-22,12 Q0,26 22,12" fill="none" stroke="#3a8a3a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nostrils -->
    <circle cx="-6" cy="2" r="2" fill="#3a8a3a"/>
    <circle cx="6" cy="2" r="2" fill="#3a8a3a"/>
  </g>
</svg>
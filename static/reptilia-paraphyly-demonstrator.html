<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>"Reptilia" Paraphyly Demonstrator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .toggle-btn {
    padding: 8px 18px;
    border-radius: 999px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    color: #475569;
  }
  .toggle-btn.active { background: #1d70a2; border-color: #1d70a2; color: #fff; }
  svg { display: block; margin: 0 auto; }
  .leaf-dot { stroke-width: 2; }
  .leaf-dot.shaded { fill: #2d6a4f; stroke: #1a472a; }
  .leaf-dot.excluded { fill: #fff; stroke: #d9534f; stroke-width: 3; stroke-dasharray: 4,3; }
  .leaf-dot.neutral { fill: #cbd5e1; stroke: #94a3b8; }
  .leaf-label { font-size: 13px; font-weight: 600; fill: #334155; }
  .leaf-label.excluded-label { fill: #d9534f; font-style: italic; }
  #caption {
    margin-top: 14px;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  #caption.warn { background: #fee2e2; color: #991b1b; }
  #caption.ok { background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>"Reptilia" Paraphyly Demonstrator</h3>
  <div class="subtitle">Same amniote tree, two different groupings. Toggle between the traditional Linnaean grouping and its monophyletic replacement.</div>
  <div class="toggle">
    <button class="toggle-btn active" data-mode="traditional">Traditional "Reptilia"</button>
    <button class="toggle-btn" data-mode="sauropsida">Sauropsida</button>
  </div>
  <svg id="svg" width="440" height="360" viewBox="0 0 440 360"></svg>
  <div id="caption"></div>
</div>
<script>
(function(){
  var leaves = {
    Mammal: { x: 380, y: 50 },
    Lizard: { x: 380, y: 120 },
    Turtle: { x: 380, y: 190 },
    Crocodilian: { x: 380, y: 260 },
    Bird: { x: 380, y: 330 }
  };
  var nodes = {
    n4: { x: 300, y: (260 + 330) / 2, c: ['Crocodilian', 'Bird'] },
    n3: { x: 230, y: null, c: ['Turtle', 'n4'] },
    n2: { x: 160, y: null, c: ['Lizard', 'n3'] },
    n1: { x: 90, y: null, c: ['Mammal', 'n2'] }
  };
  function pos(id){ return leaves[id] || nodes[id]; }
  nodes.n3.y = (pos('Turtle').y + pos('n4').y) / 2;
  nodes.n2.y = (pos('Lizard').y + pos('n3').y) / 2;
  nodes.n1.y = (pos('Mammal').y + pos('n2').y) / 2;

  var modes = {
    traditional: {
      shaded: ['Lizard', 'Turtle', 'Crocodilian'],
      excluded: ['Bird'],
      caption: '<b>Traditional "Reptilia"</b> = Lizard + Turtle + Crocodilian. This excludes Bird, even though Bird descends from within this same ancestral lineage (nested inside Archosauria, alongside Crocodilian). Excluding a nested descendant based only on a superficial trait (feathers, endothermy) — not on ancestry — is exactly what makes this group <b>paraphyletic</b>, not a valid clade.',
      class: 'warn'
    },
    sauropsida: {
      shaded: ['Lizard', 'Turtle', 'Crocodilian', 'Bird'],
      excluded: [],
      caption: '<b>Sauropsida</b> = Lizard + Turtle + Crocodilian + Bird — the full set of descendants of one common ancestor. This is a true clade: <b>monophyletic</b>, and the modern cladistic replacement for "Reptilia." Under this grouping, "reptile" and "bird" aren’t separate classes at all — Aves is a clade nested inside Sauropsida.',
      class: 'ok'
    }
  };

  var svg = document.getElementById('svg');
  var svgns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(svgns, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function draw(mode){
    var m = modes[mode];
    svg.innerHTML = '';
    function fork(nodeId){
      var node = nodes[nodeId];
      var c1 = pos(node.c[0]), c2 = pos(node.c[1]);
      svg.appendChild(el('line', { x1: node.x, y1: c1.y, x2: node.x, y2: c2.y, stroke: '#94a3b8', 'stroke-width': 2 }));
      svg.appendChild(el('line', { x1: node.x, y1: c1.y, x2: c1.x, y2: c1.y, stroke: '#94a3b8', 'stroke-width': 2 }));
      svg.appendChild(el('line', { x1: node.x, y1: c2.y, x2: c2.x, y2: c2.y, stroke: '#94a3b8', 'stroke-width': 2 }));
      node.c.forEach(function(cid){ if (nodes[cid]) fork(cid); });
    }
    svg.appendChild(el('line', { x1: 30, y1: nodes.n1.y, x2: nodes.n1.x, y2: nodes.n1.y, stroke: '#94a3b8', 'stroke-width': 2 }));
    fork('n1');
    Object.keys(leaves).forEach(function(name){
      var p = leaves[name];
      var shaded = m.shaded.indexOf(name) !== -1;
      var excluded = m.excluded.indexOf(name) !== -1;
      var cls = 'leaf-dot ' + (shaded ? 'shaded' : (excluded ? 'excluded' : 'neutral'));
      svg.appendChild(el('circle', { class: cls, cx: p.x, cy: p.y, r: 11 }));
      var t = el('text', { class: 'leaf-label' + (excluded ? ' excluded-label' : ''), x: p.x + 20, y: p.y + 5 });
      t.textContent = name + (excluded ? ' (excluded)' : '');
      svg.appendChild(t);
    });
    var caption = document.getElementById('caption');
    caption.innerHTML = m.caption;
    caption.className = m.class;
  }

  var buttons = document.querySelectorAll('.toggle-btn');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      buttons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      draw(btn.dataset.mode);
    });
  });

  draw('traditional');
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Fertilization Click-Through | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
    text-align: center;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
    text-align: left;
  }
  .btn {
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn:disabled { background: #cbd5e1; cursor: default; }
  .btn.secondary { background: #94a3b8; }
  .label-pop { opacity: 0; transition: opacity 0.3s; font-weight: 700; }
  .label-pop.show { opacity: 1; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.83rem;
    text-align: left;
    margin-top: 10px;
    min-height: 4.5em;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Double Fertilization</h3>
  <div class="subtitle">Grow the pollen tube into the embryo sac, then trigger the two simultaneous fusion events.</div>
  <svg id="fertSvg" viewBox="0 0 260 160" width="260" height="160">
    <ellipse cx="150" cy="80" rx="90" ry="55" fill="#f1e6c8" stroke="#c9a86a" stroke-width="2"/>
    <ellipse cx="150" cy="80" rx="65" ry="38" fill="#dcecd6" stroke="#5a7d4f" stroke-width="1.5"/>
    <circle cx="120" cy="65" r="10" fill="#7fb8e0" id="eggCell"/>
    <text x="120" y="68" text-anchor="middle" font-size="7" fill="#1e293b">egg</text>
    <circle cx="150" cy="80" r="12" fill="#f6d375" id="polarNuclei"/>
    <text x="150" y="83" text-anchor="middle" font-size="7" fill="#1e293b">polar nuclei</text>
    <circle cx="118" cy="80" r="6" fill="#a7d3a0"/>
    <text x="118" y="83" text-anchor="middle" font-size="6" fill="#1e293b">syn</text>
    <circle cx="128" cy="52" r="6" fill="#a7d3a0"/>
    <text x="128" y="55" text-anchor="middle" font-size="6" fill="#1e293b">syn</text>
    <rect x="0" y="72" width="20" height="16" fill="#eef6ec"/>
    <text x="10" y="65" text-anchor="middle" font-size="7" fill="#334155">micropyle</text>
    <path id="tube" d="M0 80 L0 80" stroke="#4c8c3f" stroke-width="3" fill="none"/>
    <circle id="sperm1" cx="0" cy="80" r="4" fill="#334155" opacity="0"/>
    <circle id="sperm2" cx="0" cy="80" r="4" fill="#334155" opacity="0"/>
    <text class="label-pop" id="zygoteLabel" x="120" y="40" text-anchor="middle" font-size="9" fill="#1d70a2">Zygote (2n)</text>
    <text class="label-pop" id="endospermLabel" x="150" y="120" text-anchor="middle" font-size="9" fill="#b45309">Primary endosperm nucleus (3n)</text>
  </svg>
  <div>
    <button class="btn" id="growBtn">Grow pollen tube &amp; fertilize</button>
    <button class="btn secondary" id="resetBtn">Reset</button>
  </div>
  <div class="note" id="note">The pollen tube has not yet entered the micropyle. Click "Grow pollen tube" to begin.</div>
</div>
<script>
(function(){
  var growBtn = document.getElementById('growBtn');
  var resetBtn = document.getElementById('resetBtn');
  var note = document.getElementById('note');
  var tube = document.getElementById('tube');
  var sperm1 = document.getElementById('sperm1');
  var sperm2 = document.getElementById('sperm2');
  var zygoteLabel = document.getElementById('zygoteLabel');
  var endospermLabel = document.getElementById('endospermLabel');
  var eggCell = document.getElementById('eggCell');
  var polarNuclei = document.getElementById('polarNuclei');
  var running = false;
  var timers = [];

  function reset(){
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
    tube.setAttribute('d', 'M0 80 L0 80');
    sperm1.setAttribute('opacity', '0');
    sperm1.setAttribute('cx', '0');
    sperm2.setAttribute('opacity', '0');
    sperm2.setAttribute('cx', '0');
    zygoteLabel.classList.remove('show');
    endospermLabel.classList.remove('show');
    eggCell.setAttribute('fill', '#7fb8e0');
    polarNuclei.setAttribute('fill', '#f6d375');
    growBtn.disabled = false;
    running = false;
    note.textContent = 'The pollen tube has not yet entered the micropyle. Click "Grow pollen tube" to begin.';
  }

  function grow(){
    if (running) return;
    running = true;
    growBtn.disabled = true;
    note.textContent = 'The pollen tube grows through the micropyle toward the embryo sac, carrying two sperm cells.';
    var progress = 0;
    var t1 = setInterval(function(){
      progress += 5;
      var x = progress * 1.5;
      tube.setAttribute('d', 'M0 80 L' + Math.min(x,130) + ' 80');
      if (progress >= 90){
        clearInterval(t1);
        sperm1.setAttribute('opacity', '1');
        sperm2.setAttribute('opacity', '1');
        sperm1.setAttribute('cx', '130');
        sperm2.setAttribute('cx', '130');
        var t2 = setTimeout(function(){
          sperm1.setAttribute('cx', '120');
          sperm1.setAttribute('cy', '65');
          sperm2.setAttribute('cx', '150');
          sperm2.setAttribute('cy', '80');
          var t3 = setTimeout(function(){
            eggCell.setAttribute('fill', '#1d70a2');
            polarNuclei.setAttribute('fill', '#b45309');
            zygoteLabel.classList.add('show');
            endospermLabel.classList.add('show');
            note.innerHTML = '<b>Double fertilization complete.</b> One sperm fused with the egg cell to form the diploid <b>zygote</b>; the other fused simultaneously with the two polar nuclei in the central cell to form the triploid <b>primary endosperm nucleus</b> — two fertilization events from one pollen tube.';
          }, 500);
          timers.push(t3);
        }, 400);
        timers.push(t2);
      }
    }, 40);
    timers.push(t1);
  }

  growBtn.addEventListener('click', grow);
  resetBtn.addEventListener('click', reset);
})();
</script>
</body>
</html>

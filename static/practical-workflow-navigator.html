<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBO Practical Workflow Navigator | BiOGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #5b21b6; font-weight: 700; font-size: 1.1rem; }
  .subtitle {
    font-size: 0.82rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #8965c4;
    padding-left: 12px;
    line-height: 1.5;
  }
  .workflow-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .wf-tab {
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    border: 1.5px solid #d1d5db;
    background: #f8fafc;
    color: #475569;
    transition: all 0.15s;
  }
  .wf-tab:hover { border-color: #8965c4; color: #8965c4; }
  .wf-tab.active { background: #8965c4; color: #fff; border-color: #8965c4; }
  .wf-tab .tag {
    font-size: 0.65rem;
    font-weight: 400;
    opacity: 0.8;
  }
  .pipeline {
    display: flex;
    gap: 0;
    align-items: stretch;
    margin: 16px 0;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .step-card {
    flex: 1;
    min-width: 110px;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
    position: relative;
    transition: all 0.25s;
    cursor: pointer;
  }
  .step-card.active {
    background: #f5f3ff;
    border-color: #8965c4;
    box-shadow: 0 4px 12px rgba(137,101,196,0.15);
    transform: translateY(-3px);
  }
  .step-card.completed {
    border-color: #86efac;
    background: #f0fdf4;
  }
  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #e2e8f0;
    color: #64748b;
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 6px;
    transition: all 0.2s;
  }
  .step-card.active .step-num { background: #8965c4; color: #fff; }
  .step-card.completed .step-num { background: #22c55e; color: #fff; }
  .step-icon { font-size: 1.4rem; margin-bottom: 4px; }
  .step-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #334155;
    line-height: 1.3;
  }
  .step-arrow {
    display: flex;
    align-items: center;
    color: #cbd5e1;
    font-size: 1.2rem;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .step-card.active + .step-arrow { color: #8965c4; }
  .detail-panel {
    background: #f8fafc;
    border-radius: 14px;
    padding: 16px;
    margin-top: 8px;
    min-height: 120px;
  }
  .detail-panel h4 {
    margin: 0 0 8px;
    color: #5b21b6;
    font-size: 0.92rem;
  }
  .detail-panel p {
    font-size: 0.82rem;
    line-height: 1.6;
    color: #374151;
    margin: 0 0 8px;
  }
  .detail-panel .data-flow {
    background: #f5f3ff;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.78rem;
    color: #5b21b6;
    margin-top: 8px;
  }
  .detail-panel .data-flow strong { color: #3b0764; }
  .nav-btns {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
  }
  .nav-btn {
    padding: 7px 16px;
    border-radius: 10px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
    border: 1.5px solid #d1d5db;
    background: #fff;
    color: #334155;
    font-weight: 500;
    transition: all 0.15s;
  }
  .nav-btn:hover:not(:disabled) { border-color: #8965c4; color: #8965c4; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.primary { background: #8965c4; color: #fff; border-color: #8965c4; }
  .nav-btn.primary:hover { background: #7c3aed; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>IBO Practical Workflow Navigator</h3>
  <div class="subtitle">Click through each of the four major IBO practical workflow patterns step by step. Each step shows what technique is active and what data flows to the next step.</div>

  <div class="workflow-tabs" id="wfTabs"></div>
  <div class="pipeline" id="pipeline"></div>
  <div class="detail-panel" id="detailPanel"></div>
  <div class="nav-btns">
    <button class="nav-btn" id="prevBtn" type="button" disabled>Previous</button>
    <button class="nav-btn primary" id="nextBtn" type="button">Next Step</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  var WORKFLOWS = [
    {
      id: 'A',
      label: 'Purify, Quantify, Assay',
      tag: '2018, 2023',
      steps: [
        {
          icon: '🧪',
          label: 'Ni-NTA Chromatography',
          title: 'Step 1: Purify the His-tagged protein',
          desc: 'Load clarified bacterial lysate onto a Ni-NTA column. The His-tag binds nickel. Wash with low-imidazole buffer to remove contaminants, then elute with high-imidazole buffer into fractions.',
          dataFlow: 'Output: Elution fractions (tubes 1, 2, 3) containing purified protein at unknown concentration'
        },
        {
          icon: '📊',
          label: 'Bradford Assay',
          title: 'Step 2: Measure protein concentration',
          desc: 'Prepare a BSA standard curve (0--0.6 mg/mL). Add Bradford reagent to standards and elution fractions. Read A595. Interpolate from the standard curve. Multiply by dilution factor.',
          dataFlow: 'Output: Protein concentration in each fraction (mg/mL). Pick the fraction with the highest concentration for the activity assay.'
        },
        {
          icon: '⚙️',
          label: 'Activity Assay',
          title: 'Step 3: Measure enzyme activity',
          desc: 'Use the best fraction in a functional assay. In 2018 this was gel retardation (EMSA); in 2023 it was a diaphorase colorimetric assay. Monitor absorbance change over time to get the initial rate.',
          dataFlow: 'Output: Enzyme activity (U/mL) = (delta-A x V_total) / (epsilon x V_enzyme x delta-t)'
        },
        {
          icon: '🎯',
          label: 'Specific Activity',
          title: 'Step 4: Calculate specific activity',
          desc: 'Divide total activity by total protein to get specific activity. This is the key quality metric for your purification -- higher specific activity means purer enzyme.',
          dataFlow: 'Output: Specific activity (U/mg) = Activity / [protein]. Compare to literature values to assess purification success.'
        }
      ]
    },
    {
      id: 'B',
      label: 'Genotype, Phenotype, Pathway',
      tag: '2015',
      steps: [
        {
          icon: '✂️',
          label: 'Restriction / PCR',
          title: 'Step 1: Identify the genotype',
          desc: 'Use restriction enzyme digestion or PCR with gene-specific primers to determine which gene carries a mutation. Different-sized bands on the gel tell you which allele is present.',
          dataFlow: 'Output: Gel band pattern identifies the mutated gene (e.g., ARO7 deletion gives 300 bp instead of 500 bp)'
        },
        {
          icon: '🧫',
          label: 'Auxotrophy Test',
          title: 'Step 2: Determine the phenotype',
          desc: 'Spot yeast mutants on plates with different amino acid supplements. Record growth (+) or no growth (-) on each medium. Growth on Tyr+Phe but not Trp points to a block in the Tyr/Phe branch.',
          dataFlow: 'Output: Growth pattern on supplemented media -- tells you which metabolites bypass the block'
        },
        {
          icon: '🗺️',
          label: 'Pathway Mapping',
          title: 'Step 3: Map the blocked step',
          desc: 'Combine genotype (which gene is mutated) with phenotype (which supplements rescue growth) to identify exactly which enzymatic step is blocked in the biosynthetic pathway.',
          dataFlow: 'Output: The specific enzyme deficiency -- e.g., ARO7 (chorismate mutase) is blocked, cutting off the Tyr/Phe branch from chorismate'
        }
      ]
    },
    {
      id: 'C',
      label: 'Clinical, Kinetics, Inheritance',
      tag: '2017',
      steps: [
        {
          icon: '🩸',
          label: 'Haematology',
          title: 'Step 1: Characterise the anaemia',
          desc: 'Calculate MCV, MCH, and MCHC from the complete blood count. These indices tell you if the red cells are too small (microcytic), too large (macrocytic), or lack haemoglobin (hypochromic).',
          dataFlow: 'Output: Red cell indices classify the anaemia type -- normocytic normochromic in PK deficiency (unlike iron-deficiency which is microcytic hypochromic)'
        },
        {
          icon: '📈',
          label: 'PK Kinetics',
          title: 'Step 2: Quantify enzyme deficiency',
          desc: 'Run the pyruvate kinase coupled assay (PK/LDH) at multiple substrate concentrations. Plot v0 vs [S] for the Michaelis-Menten curve. Extract Km and Vmax using Hanes-Woolf linearisation.',
          dataFlow: 'Output: Km and Vmax for the patient vs. normal control -- patient shows reduced Vmax and/or altered Km'
        },
        {
          icon: '🧬',
          label: 'Pedigree Analysis',
          title: 'Step 3: Determine inheritance',
          desc: 'Analyse the family pedigree with genetic markers. PK deficiency is autosomal recessive -- affected individuals are homozygous, carriers are heterozygous with ~50% activity.',
          dataFlow: 'Output: Inheritance pattern confirmed as autosomal recessive; carrier status of family members identified'
        }
      ]
    },
    {
      id: 'D',
      label: 'Modifier Effects',
      tag: '2022',
      steps: [
        {
          icon: '⏱️',
          label: 'Baseline ADH',
          title: 'Step 1: Measure baseline activity',
          desc: 'Run the standard ADH assay: ethanol + NAD+ in buffer, add enzyme, monitor A340 increase. Calculate the initial rate from the linear portion of the progress curve.',
          dataFlow: 'Output: Baseline ADH activity (U/mL) -- this is your 100% reference for comparing modifier effects'
        },
        {
          icon: '🧪',
          label: 'Add Modifiers',
          title: 'Step 2: Pre-incubate with modifiers',
          desc: 'Pre-incubate aliquots of ADH with EDTA (metal chelator targeting Zn2+) or PCMB (cysteine modifier targeting -SH groups). Allow 10-15 minutes for the modifier to act before assaying.',
          dataFlow: 'Output: Modified enzyme samples ready for re-assay. EDTA strips zinc; PCMB blocks cysteines.'
        },
        {
          icon: '📉',
          label: 'Re-assay Activity',
          title: 'Step 3: Measure modified activity',
          desc: 'Run the same ADH assay on the modified samples. Calculate activity and express as a percentage of baseline. EDTA typically causes ~57% decrease; PCMB ~34% decrease.',
          dataFlow: 'Output: % activity remaining after each modifier -- quantifies the contribution of each residue type to catalysis'
        },
        {
          icon: '🔬',
          label: 'Deduce Mechanism',
          title: 'Step 4: Interpret the active site',
          desc: 'EDTA inhibits more strongly because Zn2+ is essential for substrate polarisation and transition-state stabilisation. PCMB inhibits less because only some cysteines are catalytically critical. Together, this maps the active-site architecture.',
          dataFlow: 'Output: Active site requires both Zn2+ (catalytic metal, chelated by EDTA) and cysteine residues (coordinate Zn2+, modified by PCMB)'
        }
      ]
    }
  ];

  var currentWf = 0;
  var currentStep = 0;

  function renderTabs() {
    var html = '';
    WORKFLOWS.forEach(function(wf, i) {
      html += '<button class="wf-tab' + (i === currentWf ? ' active' : '') + '" data-idx="' + i + '" type="button">' +
        wf.id + ': ' + wf.label + ' <span class="tag">(' + wf.tag + ')</span></button>';
    });
    document.getElementById('wfTabs').innerHTML = html;
  }

  function renderPipeline() {
    var wf = WORKFLOWS[currentWf];
    var html = '';
    wf.steps.forEach(function(step, i) {
      if (i > 0) {
        html += '<div class="step-arrow">▶</div>';
      }
      var cls = 'step-card';
      if (i === currentStep) cls += ' active';
      else if (i < currentStep) cls += ' completed';
      html += '<div class="' + cls + '" data-step="' + i + '">' +
        '<div class="step-num">' + (i + 1) + '</div>' +
        '<div class="step-icon">' + step.icon + '</div>' +
        '<div class="step-label">' + step.label + '</div></div>';
    });
    document.getElementById('pipeline').innerHTML = html;
  }

  function renderDetail() {
    var step = WORKFLOWS[currentWf].steps[currentStep];
    var html = '<h4>' + step.title + '</h4>' +
      '<p>' + step.desc + '</p>' +
      '<div class="data-flow"><strong>Data flow:</strong> ' + step.dataFlow + '</div>';
    document.getElementById('detailPanel').innerHTML = html;

    var total = WORKFLOWS[currentWf].steps.length;
    document.getElementById('prevBtn').disabled = currentStep === 0;
    var nextBtn = document.getElementById('nextBtn');
    if (currentStep >= total - 1) {
      nextBtn.textContent = 'Done';
      nextBtn.disabled = true;
    } else {
      nextBtn.textContent = 'Next Step';
      nextBtn.disabled = false;
    }
  }

  function renderAll() {
    renderTabs();
    renderPipeline();
    renderDetail();
  }

  document.getElementById('wfTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.wf-tab');
    if (!btn) return;
    currentWf = parseInt(btn.getAttribute('data-idx'));
    currentStep = 0;
    renderAll();
  });

  document.getElementById('pipeline').addEventListener('click', function(e) {
    var card = e.target.closest('.step-card');
    if (!card) return;
    currentStep = parseInt(card.getAttribute('data-step'));
    renderPipeline();
    renderDetail();
  });

  document.getElementById('prevBtn').addEventListener('click', function() {
    if (currentStep > 0) { currentStep--; renderPipeline(); renderDetail(); }
  });

  document.getElementById('nextBtn').addEventListener('click', function() {
    if (currentStep < WORKFLOWS[currentWf].steps.length - 1) { currentStep++; renderPipeline(); renderDetail(); }
  });

  renderAll();
})();
</script>
</body>
</html>

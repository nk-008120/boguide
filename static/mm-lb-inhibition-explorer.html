<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM/LB Inhibition Explorer | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .modebtns { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .modebtns button { flex: 1; min-width: 100px; padding: 8px; border-radius: 10px; border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; font-size: 0.78rem; font-weight: 700; }
  .modebtns button.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .slider-row label { min-width: 70px; font-size: 0.8rem; font-weight: 700; }
  .slider-row input[type=range] { flex: 1; accent-color: #2d6a4f; }
  .slider-row .val { min-width: 60px; text-align: right; font-size: 0.8rem; color: #2d6a4f; font-weight: 700; }
  .plots { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1rem; }
  .plotbox { flex: 1; min-width: 300px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Enzyme Inhibition: MM &amp; Lineweaver-Burk Explorer</h3>
  <div class="subtitle">Toggle inhibition mode, adjust [I], K_I, and K_I', and watch both plots redraw live — the whole point of this topic is seeing how the curves shift.</div>
  <div class="modebtns">
    <button id="btnComp" class="active">Competitive</button>
    <button id="btnUncomp">Uncompetitive</button>
    <button id="btnNoncomp">Non-competitive</button>
    <button id="btnMixed">Mixed</button>
  </div>
  <div class="slider-row"><label>[I]</label><input type="range" id="iSlider" min="0" max="20" step="0.5" value="5"><span class="val" id="iVal">5.0</span></div>
  <div class="slider-row"><label>K_I</label><input type="range" id="kiSlider" min="1" max="20" step="0.5" value="5"><span class="val" id="kiVal">5.0</span></div>
  <div class="slider-row" id="kiPrimeRow"><label>K_I'</label><input type="range" id="kiPrimeSlider" min="1" max="20" step="0.5" value="5"><span class="val" id="kiPrimeVal">5.0</span></div>
  <div class="plots">
    <div class="plotbox" id="mmPlot"></div>
    <div class="plotbox" id="lbPlot"></div>
  </div>
</div>
<script>
(function(){
  var Vmax = 100, Km = 10;
  var mode = 'competitive';
  var gd1, gd2;

  function appKmVmax(I, KI, KIp){
    if (mode === 'competitive'){
      return { km: Km * (1 + I/KI), vmax: Vmax };
    } else if (mode === 'uncompetitive'){
      var f = 1 + I/KIp;
      return { km: Km / f, vmax: Vmax / f };
    } else if (mode === 'noncompetitive'){
      var f2 = 1 + I/KI;
      return { km: Km, vmax: Vmax / f2 };
    } else {
      return { km: Km * (1 + I/KI) / (1 + I/KIp), vmax: Vmax / (1 + I/KIp) };
    }
  }

  function buildData(){
    var I = parseFloat(document.getElementById('iSlider').value);
    var KI = parseFloat(document.getElementById('kiSlider').value);
    var KIp = parseFloat(document.getElementById('kiPrimeSlider').value);
    var uninhibited = { km: Km, vmax: Vmax };
    var inhibited = appKmVmax(I, KI, KIp);

    var sVals = [];
    for (var s = 0.5; s <= 50; s += 0.5){ sVals.push(s); }
    var vUninhibited = sVals.map(function(s){ return uninhibited.vmax * s / (uninhibited.km + s); });
    var vInhibited = sVals.map(function(s){ return inhibited.vmax * s / (inhibited.km + s); });

    var invS = sVals.map(function(s){ return 1/s; });
    var invVUninhibited = vUninhibited.map(function(v){ return 1/v; });
    var invVInhibited = vInhibited.map(function(v){ return 1/v; });

    return { sVals: sVals, vUninhibited: vUninhibited, vInhibited: vInhibited, invS: invS, invVUninhibited: invVUninhibited, invVInhibited: invVInhibited };
  }

  function render(){
    var d = buildData();
    var mmData = [
      { x: d.sVals, y: d.vUninhibited, mode: 'lines', name: 'No inhibitor', line: {color:'#94a3b8'} },
      { x: d.sVals, y: d.vInhibited, mode: 'lines', name: 'With inhibitor', line: {color:'#d9534f'} }
    ];
    var mmLayout = { title: 'Michaelis-Menten', xaxis: {title:'[S]'}, yaxis: {title:'v', range:[0,110]}, margin:{t:40,b:40,l:50,r:10}, height: 300 };
    var lbData = [
      { x: d.invS.slice(0,20), y: d.invVUninhibited.slice(0,20), mode: 'lines', name: 'No inhibitor', line: {color:'#94a3b8'} },
      { x: d.invS.slice(0,20), y: d.invVInhibited.slice(0,20), mode: 'lines', name: 'With inhibitor', line: {color:'#d9534f'} }
    ];
    var lbLayout = { title: 'Lineweaver-Burk', xaxis: {title:'1/[S]'}, yaxis: {title:'1/v'}, margin:{t:40,b:40,l:50,r:10}, height: 300 };

    if (!gd1){
      Plotly.newPlot('mmPlot', mmData, mmLayout, {displayModeBar:false}).then(function(g){ gd1 = g; });
      Plotly.newPlot('lbPlot', lbData, lbLayout, {displayModeBar:false}).then(function(g){ gd2 = g; });
    } else {
      Plotly.react('mmPlot', mmData, mmLayout, {displayModeBar:false});
      Plotly.react('lbPlot', lbData, lbLayout, {displayModeBar:false});
    }
  }

  function setMode(m, btn){
    mode = m;
    document.querySelectorAll('.modebtns button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('kiPrimeRow').style.display = (m === 'uncompetitive' || m === 'mixed') ? 'flex' : 'none';
    document.getElementById('kiSlider').closest('.slider-row').style.display = (m === 'uncompetitive') ? 'none' : 'flex';
    render();
  }

  document.getElementById('btnComp').addEventListener('click', function(){ setMode('competitive', this); });
  document.getElementById('btnUncomp').addEventListener('click', function(){ setMode('uncompetitive', this); });
  document.getElementById('btnNoncomp').addEventListener('click', function(){ setMode('noncompetitive', this); });
  document.getElementById('btnMixed').addEventListener('click', function(){ setMode('mixed', this); });

  ['iSlider','kiSlider','kiPrimeSlider'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      document.getElementById(id.replace('Slider','Val')).textContent = parseFloat(this.value).toFixed(1);
      render();
    });
  });

  render();
})();
</script>
</body>
</html>

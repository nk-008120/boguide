<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monocot vs. Dicot Root Stele Toggle | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
    text-align: center;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
    text-align: left;
  }
  .toggle-row { display: flex; justify-content: center; gap: 0; margin-bottom: 1rem; }
  .toggle-btn {
    border: 2px solid #2d6a4f;
    background: #fff;
    color: #2d6a4f;
    padding: 9px 22px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn:first-child { border-radius: 999px 0 0 999px; }
  .toggle-btn:last-child { border-radius: 0 999px 999px 0; }
  .toggle-btn.active { background: #2d6a4f; color: #fff; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    text-align: left;
    min-height: 4em;
  }
  .legend { font-size: 0.75rem; color: #64748b; margin-top: 10px; text-align: left; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Monocot vs. Dicot Root Stele</h3>
  <div class="subtitle">Toggle between the two stele types to see the structural contrast as a direct swap.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" id="dicotBtn">Dicot (actinostele)</button>
    <button class="toggle-btn" id="monocotBtn">Monocot (ring + pith)</button>
  </div>
  <svg id="steleSvg" viewBox="0 0 220 220" width="220" height="220">
    <circle cx="110" cy="110" r="100" fill="#eef6ec" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="110" cy="110" r="80" fill="#dcecd6"/>
    <g id="steleGroup"></g>
  </svg>
  <div class="note" id="note"></div>
  <div class="legend">
    <span><span class="sw" style="background:#c9a86a"></span>Xylem</span>
    <span><span class="sw" style="background:#7fb8e0"></span>Phloem</span>
    <span><span class="sw" style="background:#f1e6c8"></span>Pith</span>
  </div>
</div>
<script>
(function(){
  var dicotBtn = document.getElementById('dicotBtn');
  var monocotBtn = document.getElementById('monocotBtn');
  var note = document.getElementById('note');
  var steleGroup = document.getElementById('steleGroup');

  function dicotSvg(){
    var arms = 4;
    var cx = 110, cy = 110, outerR = 42, innerR = 8;
    var star = 'M';
    for (var i = 0; i < arms * 2; i++){
      var r = i % 2 === 0 ? outerR : innerR;
      var ang = Math.PI * i / arms;
      var x = cx + r * Math.sin(ang);
      var y = cy - r * Math.cos(ang);
      star += x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      if (i === 0) star = star.replace('M', 'M');
    }
    star += 'Z';
    var html = '<path d="' + star.replace('M', 'M').replace(/ (?=\d)/, ' L ') + '" fill="#c9a86a" stroke="#8a6d3b" stroke-width="1.5"/>';

    for (var j = 0; j < arms; j++){
      var ang2 = Math.PI * (2*j+1) / arms;
      var px = cx + 30 * Math.sin(ang2);
      var py = cy - 30 * Math.cos(ang2);
      html += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="7" fill="#7fb8e0"/>';
    }
    return html;
  }

  function monocotSvg(){
    var cx = 110, cy = 110;
    var html = '<circle cx="'+cx+'" cy="'+cy+'" r="55" fill="#f1e6c8"/>';
    var n = 8;
    for (var i = 0; i < n; i++){
      var ang = 2 * Math.PI * i / n;
      var xx = cx + 55 * Math.sin(ang);
      var yy = cy - 55 * Math.cos(ang);
      var xp = cx + 68 * Math.sin(ang + Math.PI/n);
      var yp = cy - 68 * Math.cos(ang + Math.PI/n);
      html += '<circle cx="'+xx.toFixed(1)+'" cy="'+yy.toFixed(1)+'" r="9" fill="#c9a86a" stroke="#8a6d3b" stroke-width="1"/>';
      html += '<circle cx="'+xp.toFixed(1)+'" cy="'+yp.toFixed(1)+'" r="6" fill="#7fb8e0"/>';
    }
    return html;
  }

  function showDicot(){
    dicotBtn.classList.add('active');
    monocotBtn.classList.remove('active');
    steleGroup.innerHTML = dicotSvg();
    note.innerHTML = '<b>Dicot actinostele</b> — xylem forms a solid, star-shaped core with a small number of arms (diarch–hexarch), phloem occupying the bays between arms. Pith is absent or minimal, since the xylem core fills most of the center.';
  }

  function showMonocot(){
    monocotBtn.classList.add('active');
    dicotBtn.classList.remove('active');
    steleGroup.innerHTML = monocotSvg();
    note.innerHTML = '<b>Monocot stele</b> — xylem and phloem alternate in a ring around a large, prominent central pith, with more numerous (polyarch) xylem poles than a typical dicot root.';
  }

  dicotBtn.addEventListener('click', showDicot);
  monocotBtn.addEventListener('click', showMonocot);
  showDicot();
})();
</script>
</body>
</html>

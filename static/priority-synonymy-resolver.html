<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priority & Synonymy Resolver | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .step-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 6px; }
  .scenario { background: #f1f5f9; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.5; }
  .choices { display: flex; gap: 10px; margin-bottom: 12px; }
  .choice-btn {
    flex: 1;
    padding: 12px 10px;
    border-radius: 12px;
    border: 2px solid #cbd5e1;
    background: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    color: #334155;
  }
  .choice-btn:hover { border-color: #1d70a2; }
  .choice-btn.correct { background: #dcfce7; border-color: #86efac; color: #166534; }
  .choice-btn.wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
  .choice-btn:disabled { cursor: default; }
  .feedback { font-size: 0.85rem; background: #eaf2f8; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: none; }
  .feedback.show { display: block; }
  #nextBtn, #resetBtn {
    display: none;
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #nextBtn.show, #resetBtn.show { display: inline-block; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Priority &amp; Synonymy Resolver</h3>
  <div class="subtitle">Work through two naming disputes and resolve each using the rules from this page.</div>
  <div class="step-label" id="stepLabel">Scenario 1 of 2</div>
  <div class="scenario" id="scenarioText"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button id="nextBtn">Next scenario →</button>
  <button id="resetBtn">Start over</button>
</div>
<script>
(function(){
  var scenarios = [
    {
      text: 'A beetle species is independently described and named <b>"Carabus fastus"</b> in 1889, then independently described and named <b>"Carabus ornatus"</b> in 1901 by a taxonomist unaware of the earlier publication. Both names refer to the same species. Applying the principle of priority, which name is valid?',
      choices: ['Carabus fastus (1889)', 'Carabus ornatus (1901)'],
      correct: 0,
      feedback: [
        'Correct. The principle of priority states the earliest validly published name takes precedence. <b>Carabus fastus</b> (1889) is the senior synonym and remains valid; <b>Carabus ornatus</b> (1901) becomes a junior synonym — invalid as a name, but retained in the literature as a cross-reference.',
        'Not quite. The principle of priority states the <b>earliest</b> validly published name takes precedence, not the most recent. <b>Carabus fastus</b> (1889) is the senior synonym; <b>Carabus ornatus</b> (1901) becomes a junior synonym.'
      ]
    },
    {
      text: 'A cultivated plant’s technically senior name, <b>"Rosa priora"</b>, was published in 1850 in an obscure regional journal and is almost unknown today. The junior name, <b>"Rosa vulgaris"</b> (1875), is the name used in every textbook and by gardeners worldwide. According to the rules covered on this page, which mechanism could let the widely-used junior name remain valid despite strict priority?',
      choices: ['Nothing — priority is absolute and cannot be overridden', 'A nomen conservandum petition to the governing nomenclature code'],
      correct: 1,
      feedback: [
        'Not quite. Priority is the default rule, but it is not absolute — the codes include a specific exception mechanism for exactly this situation.',
        'Correct. Both the ICZN and ICN include a <b>nomen conservandum</b> ("conserved name") mechanism, letting a taxonomic authority formally override strict priority when a junior synonym is so widely used that switching to the technically-senior name would cause more confusion than it resolves.'
      ]
    }
  ];
  var idx = 0;
  var answered = false;
  var stepLabel = document.getElementById('stepLabel');
  var scenarioText = document.getElementById('scenarioText');
  var choicesEl = document.getElementById('choices');
  var feedback = document.getElementById('feedback');
  var nextBtn = document.getElementById('nextBtn');
  var resetBtn = document.getElementById('resetBtn');

  function render(){
    var s = scenarios[idx];
    answered = false;
    stepLabel.textContent = 'Scenario ' + (idx + 1) + ' of ' + scenarios.length;
    scenarioText.innerHTML = s.text;
    feedback.className = 'feedback';
    feedback.innerHTML = '';
    nextBtn.className = '';
    resetBtn.className = '';
    choicesEl.innerHTML = '';
    s.choices.forEach(function(choiceText, i){
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choiceText;
      btn.addEventListener('click', function(){
        if (answered) return;
        answered = true;
        var isCorrect = i === s.correct;
        btn.classList.add(isCorrect ? 'correct' : 'wrong');
        if (!isCorrect){
          choicesEl.children[s.correct].classList.add('correct');
        }
        Array.prototype.forEach.call(choicesEl.children, function(c){ c.disabled = true; });
        feedback.innerHTML = s.feedback[isCorrect ? 0 : 1];
        feedback.className = 'feedback show';
        if (idx < scenarios.length - 1){
          nextBtn.className = 'show';
        } else {
          resetBtn.className = 'show';
        }
      });
      choicesEl.appendChild(btn);
    });
  }

  nextBtn.addEventListener('click', function(){
    idx++;
    render();
  });
  resetBtn.addEventListener('click', function(){
    idx = 0;
    render();
  });

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical Identification Decision Tree | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .question { font-size: 0.92rem; font-weight: 700; color: #1a472a; margin-bottom: 12px; }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .opt-btn:hover { background: #e2e8f0; }
  .result {
    background: #dcfce7;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 0.9rem;
    color: #166534;
    font-weight: 600;
    margin-top: 6px;
  }
  .breadcrumb { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
  .btn.secondary {
    background: #94a3b8;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Practical Identification Decision Tree</h3>
  <div class="subtitle">Start from what parts of the specimen you actually have, and follow the fastest applicable check.</div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="stepArea"></div>
</div>
<script>
(function(){
  var breadcrumb = document.getElementById('breadcrumb');
  var stepArea = document.getElementById('stepArea');
  var trail = [];

  var tree = {
    start: {
      question: 'What part of the specimen is available?',
      options: [
        { label: 'A flower', next: 'flower' },
        { label: 'A leaf (no cross-section needed)', next: 'leaf' },
        { label: 'A stem, can cross-section it', next: 'stem' },
        { label: 'A root, can cross-section it', next: 'root' }
      ]
    },
    flower: {
      question: 'Count the floral parts (e.g. petals) — are they in multiples of 3, or of 4/5?',
      options: [
        { label: 'Multiples of 3 (trimerous)', result: 'Monocot — trimerous floral merosity.' },
        { label: 'Multiples of 4 or 5 (tetramerous/pentamerous)', result: 'Dicot — tetramerous/pentamerous floral merosity.' }
      ]
    },
    leaf: {
      question: 'What venation pattern does the leaf show?',
      options: [
        { label: 'Parallel veins running the leaf\'s length', result: 'Monocot — parallel venation.' },
        { label: 'Branching, net-like (reticulate) veins', result: 'Dicot — reticulate venation.' }
      ]
    },
    stem: {
      question: 'In cross-section, are the vascular bundles in one ring, or scattered?',
      options: [
        { label: 'Single ring, clear cortex/pith split (eustele)', result: 'Dicot — eustele arrangement.' },
        { label: 'Scattered throughout the ground tissue (atactostele)', result: 'Monocot — atactostele arrangement.' }
      ]
    },
    root: {
      question: 'In cross-section, is there a large central pith?',
      options: [
        { label: 'Yes — xylem/phloem alternate in a ring around it', result: 'Monocot — ring stele with central pith.' },
        { label: 'No — xylem forms a solid star-shaped core', result: 'Dicot — actinostele, little/no pith.' }
      ]
    }
  };

  function render(nodeKey){
    var node = tree[nodeKey];
    var html = '<div class="question">' + node.question + '</div>';
    stepArea.innerHTML = html;
    node.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){
        trail.push(opt.label);
        breadcrumb.textContent = trail.join(' → ');
        if (opt.result){
          showResult(opt.result);
        } else {
          render(opt.next);
        }
      });
      stepArea.appendChild(btn);
    });
  }

  function showResult(text){
    stepArea.innerHTML = '<div class="result">' + text + '</div>';
    var restart = document.createElement('button');
    restart.className = 'btn secondary';
    restart.textContent = 'Start over';
    restart.addEventListener('click', function(){
      trail = [];
      breadcrumb.textContent = '';
      render('start');
    });
    stepArea.appendChild(restart);
  }

  render('start');
})();
</script>
</body>
</html>

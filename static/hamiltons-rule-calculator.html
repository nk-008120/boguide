<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamilton's Rule Calculator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .relRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .relBtn {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 0.76rem;
    cursor: pointer;
  }
  .relBtn.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
  label { font-size: 0.85rem; font-weight: 600; color: #334155; display:block; margin-bottom: 6px; margin-top: 12px; }
  input[type=range] { width: 100%; }
  .formula {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 14px;
    margin-top: 16px;
    font-size: 1.0rem;
    text-align: center;
    font-family: 'Georgia', serif;
  }
  .verdict { margin-top: 10px; text-align: center; font-size: 0.95rem; font-weight: 700; padding: 10px; border-radius: 10px; }
  .verdict.favored { background: #dcfce7; color: #166534; }
  .verdict.notfavored { background: #fee2e2; color: #991b1b; }
  .verdict.borderline { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Hamilton's Rule Calculator</h3>
  <div class="subtitle">Pick a relationship (sets relatedness r), then set the act's benefit to the recipient and cost to the actor — see whether the act is predicted to be favored by selection.</div>

  <div class="relRow" id="relRow"></div>

  <label for="benefitSlider">Benefit to recipient (B): <span id="benefitVal">3</span></label>
  <input type="range" id="benefitSlider" min="0" max="10" step="0.5" value="3">

  <label for="costSlider">Cost to actor (C): <span id="costSlider_val">2</span></label>
  <input type="range" id="costSlider" min="0" max="10" step="0.5" value="2">

  <div class="formula" id="formula">r × B = 0.50 × 3.0 = <b>1.50</b> &nbsp;|&nbsp; C = <b>2.00</b></div>
  <div class="verdict" id="verdict"></div>
</div>
<script>
(function(){
  var relationships = [
    { id: 'full-sib', label: 'Full sibling', r: 0.5 },
    { id: 'parent-offspring', label: 'Parent-offspring', r: 0.5 },
    { id: 'half-sib', label: 'Half-sibling', r: 0.25 },
    { id: 'cousin', label: 'Cousin', r: 0.125 },
    { id: 'haplo-sister', label: 'Haplodiploid full sister', r: 0.75 },
    { id: 'unrelated', label: 'Unrelated', r: 0 }
  ];
  var currentR = 0.5;
  var relRow = document.getElementById('relRow');
  var benefitSlider = document.getElementById('benefitSlider');
  var costSlider = document.getElementById('costSlider');
  var benefitVal = document.getElementById('benefitVal');
  var costValLabel = document.getElementById('costSlider_val');
  var formula = document.getElementById('formula');
  var verdict = document.getElementById('verdict');

  relationships.forEach(function(rel){
    var btn = document.createElement('button');
    btn.className = 'relBtn' + (rel.id === 'full-sib' ? ' active' : '');
    btn.textContent = rel.label + ' (r=' + rel.r + ')';
    btn.dataset.id = rel.id;
    btn.addEventListener('click', function(){
      currentR = rel.r;
      Array.prototype.forEach.call(relRow.children, function(c){
        c.classList.toggle('active', c.dataset.id === rel.id);
      });
      update();
    });
    relRow.appendChild(btn);
  });

  function update(){
    var B = parseFloat(benefitSlider.value);
    var C = parseFloat(costSlider.value);
    benefitVal.textContent = B.toFixed(1);
    costValLabel.textContent = C.toFixed(1);

    var rB = currentR * B;
    formula.innerHTML = 'r × B = ' + currentR.toFixed(2) + ' × ' + B.toFixed(1) + ' = <b>' + rB.toFixed(2) + '</b> &nbsp;|&nbsp; C = <b>' + C.toFixed(2) + '</b>';

    if (Math.abs(rB - C) < 0.05){
      verdict.className = 'verdict borderline';
      verdict.textContent = 'rB ≈ C — right at the threshold, neither favored nor selected against.';
    } else if (rB > C){
      verdict.className = 'verdict favored';
      verdict.textContent = 'rB > C — the altruistic act is predicted to be favored by selection.';
    } else {
      verdict.className = 'verdict notfavored';
      verdict.textContent = 'rB < C — the altruistic act is predicted to be selected against.';
    }
  }

  benefitSlider.addEventListener('input', update);
  costSlider.addEventListener('input', update);
  update();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Amplification Cascade Animator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #stages { display: flex; justify-content: space-between; margin-bottom: 1rem; }
  .stagebox { flex: 1; text-align: center; padding: 8px 4px; margin: 0 3px; border-radius: 10px; background: #f8fafc; border: 2px solid #e2e8f0; transition: 0.2s; }
  .stagebox.active { background: #dcfce7; border-color: #22c55e; }
  .stagebox .name { font-size: 0.72rem; font-weight: 700; }
  .stagebox .count { font-size: 1.1rem; font-weight: 700; color: #2d6a4f; margin-top: 3px; }
  #activateBtn { display: block; margin: 0 auto; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 10px 24px; font-size: 0.85rem; cursor: pointer; }
  #activateBtn:hover { background: #1a472a; }
  #note { text-align: center; margin-top: 10px; font-size: 0.82rem; color: #64748b; min-height: 20px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>One Ligand, Thousands of Molecules Activated</h3>
  <div class="subtitle">Click "Ligand binds" and watch each downstream stage activate in sequence, with a running molecule count showing the amplification.</div>
  <div id="stages">
    <div class="stagebox" id="s0"><div class="name">Receptor</div><div class="count" id="c0">0</div></div>
    <div class="stagebox" id="s1"><div class="name">G-protein</div><div class="count" id="c1">0</div></div>
    <div class="stagebox" id="s2"><div class="name">2nd messenger</div><div class="count" id="c2">0</div></div>
    <div class="stagebox" id="s3"><div class="name">Kinase</div><div class="count" id="c3">0</div></div>
    <div class="stagebox" id="s4"><div class="name">Target proteins</div><div class="count" id="c4">0</div></div>
  </div>
  <button id="activateBtn">Ligand binds</button>
  <div id="note"></div>
</div>
<script>
(function(){
  var counts = [1, 1, 10, 10, 100];
  var mult = [1, 1, 10, 1, 10];
  var note = document.getElementById('note');
  var btn = document.getElementById('activateBtn');
  var timers = [];

  function reset(){
    for (var i = 0; i < 5; i++){
      document.getElementById('s' + i).classList.remove('active');
      document.getElementById('c' + i).textContent = '0';
    }
    note.textContent = '';
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
  }

  btn.addEventListener('click', function(){
    reset();
    var running = 1;
    for (var i = 0; i < 5; i++){
      (function(i){
        var t = setTimeout(function(){
          document.getElementById('s' + i).classList.add('active');
          running = running * mult[i];
          document.getElementById('c' + i).textContent = running;
          if (i === 4){
            note.textContent = 'One ligand-binding event produced ' + running + ' activated target-protein molecules — that\'s the amplification.';
          }
        }, i * 500);
        timers.push(t);
      })(i);
    }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positive Feedback Loop Animator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle-row { display:flex; gap:8px; margin-bottom: 1rem; }
  .toggle-btn {
    flex: 1; padding: 8px 6px; border-radius: 999px; border: 2px solid #cbd5e1;
    background: #f8fafc; font-size: 0.8rem; font-weight: 600; cursor: pointer; color:#475569;
  }
  .toggle-btn.active { background:#1d70a2; border-color:#1d70a2; color:#fff; }
  .controls { display:flex; gap:10px; align-items:center; margin-top: 0.8rem; }
  button.step {
    background: #2d6a4f; color: #fff; border: none; border-radius: 999px;
    padding: 8px 18px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  button.secondary { background:#f1f5f9; color:#334155; border:none; border-radius:999px; padding:8px 18px; font-size:0.85rem; font-weight:600; cursor:pointer; }
  .intensity-label { font-size:0.8rem; color:#6b7280; margin-left:auto; }
  svg text { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Positive Feedback Loop Animator</h3>
  <div class="subtitle">Choose a process, then click through the loop. Unlike negative feedback, each pass around the loop intensifies rather than resets.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" data-mode="parturition">Parturition</button>
    <button class="toggle-btn" data-mode="milk">Milk ejection</button>
  </div>
  <svg id="svgArea" viewBox="0 0 480 360" width="100%"></svg>
  <div class="controls">
    <button class="step" id="stepBtn">Step</button>
    <button class="secondary" id="resetBtn">Reset</button>
    <span class="intensity-label" id="intensityLabel"></span>
  </div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById('svgArea');
  var toggleBtns = document.querySelectorAll('.toggle-btn');
  var stepBtn = document.getElementById('stepBtn');
  var resetBtn = document.getElementById('resetBtn');
  var intensityLabel = document.getElementById('intensityLabel');
  var mode = 'parturition';
  var stepIdx = 0; // 0..3 within one pass
  var passCount = 0;

  var loops = {
    parturition: [
      "Fetal head presses on cervix",
      "Cervical stretch signal to hypothalamus",
      "Oxytocin released from posterior pituitary",
      "Uterine contraction increases, pushing fetus further against cervix"
    ],
    milk: [
      "Infant suckles nipple",
      "Sensory signal to hypothalamus",
      "Oxytocin released from posterior pituitary",
      "Myoepithelial cells contract, ejecting milk — continued suckling sustains the loop"
    ]
  };

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function render(){
    svg.innerHTML = '';
    var steps = loops[mode];
    var cx = 240, cy = 180, r = 130;
    var positions = [
      {x:cx, y:cy-r}, {x:cx+r, y:cy}, {x:cx, y:cy+r}, {x:cx-r, y:cy}
    ];

    // draw loop arrows between positions
    for (var i=0;i<4;i++){
      var a = positions[i], b = positions[(i+1)%4];
      svg.appendChild(el('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:'#cbd5e1', 'stroke-width':2}));
    }

    // node circles with intensity-scaled size at the "current" and completed nodes
    steps.forEach(function(label, i){
      var pos = positions[i];
      var isPast = i < stepIdx;
      var isCurrent = i === stepIdx;
      var scale = 1 + passCount*0.18; // grows each completed pass
      var radius = (isPast || isCurrent) ? 34*scale : 30;
      var fill = isCurrent ? '#166534' : (isPast ? '#2d6a4f' : '#f1f5f9');
      var textColor = (isCurrent || isPast) ? '#fff' : '#64748b';
      svg.appendChild(el('circle', {cx:pos.x, cy:pos.y, r:radius, fill:fill, stroke:'#94a3b8', 'stroke-width': isCurrent?3:1}));
      var lines = wrapText(label, 16);
      lines.forEach(function(line, li){
        var t = el('text', {x:pos.x, y: pos.y - (lines.length-1)*6 + li*12 + 4, 'font-size':9.5, fill:textColor, 'text-anchor':'middle', 'font-weight':600});
        t.textContent = line;
        svg.appendChild(t);
      });
    });

    var title = el('text', {x:cx, y:20, 'font-size':13, 'font-weight':700, fill:'#1a472a', 'text-anchor':'middle'});
    title.textContent = (mode === 'parturition' ? 'Parturition' : 'Milk ejection reflex') + ' — pass ' + (passCount+1) + ', step ' + (stepIdx+1) + ' of 4';
    svg.appendChild(title);

    var note = el('text', {x:cx, y:345, 'font-size':10.5, fill:'#6b7280', 'text-anchor':'middle'});
    note.textContent = passCount === 0 ? 'Each completed pass intensifies the loop rather than resetting it.' : 'Intensity growing: pass ' + passCount + ' complete, nodes larger than the first pass.';
    svg.appendChild(note);

    intensityLabel.textContent = 'Completed passes: ' + passCount;
  }

  function wrapText(text, maxLen){
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    words.forEach(function(w){
      if ((cur + ' ' + w).trim().length > maxLen){
        lines.push(cur.trim());
        cur = w;
      } else {
        cur = (cur + ' ' + w).trim();
      }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  toggleBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      toggleBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.dataset.mode;
      stepIdx = 0; passCount = 0;
      render();
    });
  });

  stepBtn.addEventListener('click', function(){
    stepIdx++;
    if (stepIdx >= 4){
      stepIdx = 0;
      passCount++;
    }
    render();
  });

  resetBtn.addEventListener('click', function(){
    stepIdx = 0; passCount = 0;
    render();
  });

  render();
})();
</script>
</body>
</html>

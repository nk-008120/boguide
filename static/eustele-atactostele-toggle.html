<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eustele vs. Atactostele Toggle | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
    text-align: center;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
    text-align: left;
  }
  .toggle-row { display: flex; justify-content: center; gap: 0; margin-bottom: 1rem; }
  .toggle-btn {
    border: 2px solid #2d6a4f;
    background: #fff;
    color: #2d6a4f;
    padding: 9px 20px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn:first-child { border-radius: 999px 0 0 999px; }
  .toggle-btn:last-child { border-radius: 0 999px 999px 0; }
  .toggle-btn.active { background: #2d6a4f; color: #fff; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    text-align: left;
    min-height: 4.5em;
  }
  .legend { font-size: 0.75rem; color: #64748b; margin-top: 10px; text-align: left; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Eustele vs. Atactostele</h3>
  <div class="subtitle">Toggle between the two stem vascular bundle arrangements to see the contrast as a direct swap.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" id="eusteleBtn">Eustele (dicot)</button>
    <button class="toggle-btn" id="atactosteleBtn">Atactostele (monocot)</button>
  </div>
  <svg id="stemSvg" viewBox="0 0 220 220" width="220" height="220">
    <circle cx="110" cy="110" r="100" fill="#eef6ec" stroke="#94a3b8" stroke-width="1"/>
    <g id="groundGroup"></g>
    <g id="bundleGroup"></g>
  </svg>
  <div class="note" id="note"></div>
  <div class="legend">
    <span><span class="sw" style="background:#c9a86a"></span>Xylem</span>
    <span><span class="sw" style="background:#7fb8e0"></span>Phloem</span>
  </div>
</div>
<script>
(function(){
  var eusteleBtn = document.getElementById('eusteleBtn');
  var atactosteleBtn = document.getElementById('atactosteleBtn');
  var note = document.getElementById('note');
  var groundGroup = document.getElementById('groundGroup');
  var bundleGroup = document.getElementById('bundleGroup');
  var cx = 110, cy = 110;

  function bundleAt(x, y, sheath){
    var html = '';
    if (sheath) html += '<circle cx="'+x+'" cy="'+y+'" r="12" fill="none" stroke="#5a7d4f" stroke-width="2"/>';
    html += '<circle cx="'+x+'" cy="'+y+'" r="6" fill="#c9a86a"/>';
    html += '<path d="M '+(x+5)+' '+(y-6)+' A 8 8 0 0 1 '+(x+5)+' '+(y+6)+' Z" fill="#7fb8e0"/>';
    return html;
  }

  function showEustele(){
    eusteleBtn.classList.add('active');
    atactosteleBtn.classList.remove('active');
    groundGroup.innerHTML = '<circle cx="'+cx+'" cy="'+cy+'" r="80" fill="#dcecd6"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="45" fill="#f1e6c8"/>' +
      '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="9" fill="#334155">Pith</text>' +
      '<text x="'+cx+'" y="30" text-anchor="middle" font-size="9" fill="#334155">Cortex</text>';
    var n = 8, html = '';
    for (var i=0;i<n;i++){
      var ang = 2*Math.PI*i/n;
      var x = cx + 62*Math.sin(ang), y = cy - 62*Math.cos(ang);
      html += bundleAt(x, y, false);
    }
    bundleGroup.innerHTML = html;
    note.innerHTML = '<b>Eustele</b> — a limited number of open, collateral bundles arranged in a single ring, clearly separating an outer cortex from an inner pith. Pith rays (not shown individually here) connect pith to cortex between bundles.';
  }

  function showAtactostele(){
    atactosteleBtn.classList.add('active');
    eusteleBtn.classList.remove('active');
    groundGroup.innerHTML = '<circle cx="'+cx+'" cy="'+cy+'" r="80" fill="#dcecd6"/>' +
      '<text x="'+cx+'" y="30" text-anchor="middle" font-size="9" fill="#334155">Ground tissue</text>';
    var positions = [
      [110,60],[75,75],[145,75],[60,110],[160,110],[75,145],[145,145],[110,165],
      [95,95],[130,95],[95,130],[130,130],[110,110],[70,60],[150,60],[60,150],[160,150]
    ];
    var html = '';
    positions.forEach(function(p){
      html += bundleAt(p[0], p[1], true);
    });
    bundleGroup.innerHTML = html;
    note.innerHTML = '<b>Atactostele</b> — numerous closed collateral bundles, each wrapped in a sclerenchyma bundle sheath, scattered throughout the ground tissue with no organized ring — so there is no clean cortex/pith distinction the way a eustele has.';
  }

  eusteleBtn.addEventListener('click', showEustele);
  atactosteleBtn.addEventListener('click', showAtactostele);
  showEustele();
})();
</script>
</body>
</html>

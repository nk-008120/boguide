<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Trade-off Slider | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  svg { width: 100%; height: 260px; }
  .axis-label { font-size: 10px; fill: #64748b; }
  #investSlider { width: 100%; margin-top: 10px; }
  .readout { display: flex; justify-content: space-around; margin-top: 10px; font-size: 0.85rem; }
  .readout div { text-align: center; }
  .readout b { display: block; font-size: 1.1rem; }
  .benefit b { color: #1d70a2; }
  .cost b { color: #b91c1c; }
  .net b { color: #2d6a4f; }
  #note { font-size: 0.82rem; color: #4b5563; margin-top: 10px; text-align: center; min-height: 32px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Fitness Trade-off Slider</h3>
  <div class="subtitle">Slide a trait's investment level and watch mating-success benefit and survival cost move against each other.</div>
  <svg id="chart" viewBox="0 0 400 220" preserveAspectRatio="none">
    <polyline id="benefitLine" fill="none" stroke="#1d70a2" stroke-width="2.5"/>
    <polyline id="costLine" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
    <line id="equilLine" x1="0" y1="0" x2="0" y2="200" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <circle id="cursorDot" r="4" fill="#2d6a4f"/>
    <text x="200" y="215" class="axis-label" text-anchor="middle">Investment level in trait (e.g. ornament size) →</text>
  </svg>
  <input type="range" id="investSlider" min="0" max="100" step="1" value="30">
  <div class="readout">
    <div class="benefit">Mating benefit<b id="benefitVal">-</b></div>
    <div class="cost">Survival cost<b id="costVal">-</b></div>
    <div class="net">Net fitness<b id="netVal">-</b></div>
  </div>
  <div id="note"></div>
</div>
<script>
(function(){
  var W = 400, H = 200, PAD = 10;
  function benefit(x){ return 100 * (1 - Math.exp(-x/28)); }
  function cost(x){ return (x*x) / 55; }

  function toSvgY(v, maxV){ return H - (v / maxV) * (H - PAD); }

  var xs = [];
  for (var x = 0; x <= 100; x += 2){ xs.push(x); }
  var benefits = xs.map(benefit);
  var costs = xs.map(cost);
  var maxV = Math.max.apply(null, benefits.concat(costs));

  var benefitPts = xs.map(function(x, i){ return (x*4) + ',' + toSvgY(benefits[i], maxV); }).join(' ');
  var costPts = xs.map(function(x, i){ return (x*4) + ',' + toSvgY(costs[i], maxV); }).join(' ');
  document.getElementById('benefitLine').setAttribute('points', benefitPts);
  document.getElementById('costLine').setAttribute('points', costPts);

  var bestX = 0, bestNet = -Infinity;
  xs.forEach(function(x, i){
    var net = benefits[i] - costs[i];
    if (net > bestNet){ bestNet = net; bestX = x; }
  });
  var equilLine = document.getElementById('equilLine');
  equilLine.setAttribute('x1', bestX*4);
  equilLine.setAttribute('x2', bestX*4);

  var slider = document.getElementById('investSlider');
  var benefitVal = document.getElementById('benefitVal');
  var costVal = document.getElementById('costVal');
  var netVal = document.getElementById('netVal');
  var note = document.getElementById('note');
  var cursorDot = document.getElementById('cursorDot');

  function update(){
    var x = parseFloat(slider.value);
    var b = benefit(x), c = cost(x), net = b - c;
    benefitVal.textContent = b.toFixed(1);
    costVal.textContent = c.toFixed(1);
    netVal.textContent = net.toFixed(1);
    cursorDot.setAttribute('cx', x*4);
    cursorDot.setAttribute('cy', toSvgY(b, maxV));
    if (Math.abs(x - bestX) <= 3){
      note.innerHTML = '<b>Near the equilibrium</b> (~' + bestX + ') — marginal benefit ≈ marginal cost here, the trait value selection is expected to push toward.';
    } else if (x < bestX){
      note.textContent = 'Below equilibrium (~' + bestX + ') — increasing investment here would still raise net fitness.';
    } else {
      note.textContent = 'Above equilibrium (~' + bestX + ') — further investment costs more in survival than it gains in mating success.';
    }
  }

  slider.addEventListener('input', update);
  update();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dN/dS Calculator and Interpreter | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 1rem; }
  th, td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; }
  th { color: #64748b; font-weight: 600; font-size: 0.75rem; }
  .codon { font-family: 'Courier New', monospace; font-weight: 700; }
  .aa { color: #64748b; font-size: 0.78rem; }
  .classify-btns { display: flex; gap: 4px; justify-content: center; }
  .cbtn {
    padding: 4px 8px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc;
    font-size: 0.72rem; cursor: pointer; font-weight: 600; color: #475569;
  }
  .cbtn.chosen-syn { background: #1d70a2; border-color: #1d70a2; color: #fff; }
  .cbtn.chosen-nonsyn { background: #d9534f; border-color: #d9534f; color: #fff; }
  tr.correct-row { background: #f0fdf4; }
  tr.incorrect-row { background: #fef2f2; }
  #resultBox {
    background: #f8fafc;
    border-radius: 14px;
    padding: 1rem;
    font-size: 0.9rem;
  }
  #resultBox b { color: #1d70a2; }
  #checkBtn, #resetBtn {
    background: #2d6a4f; color: #fff; border: none; padding: 8px 20px;
    border-radius: 999px; font-size: 0.85rem; cursor: pointer; margin-right: 8px;
  }
  #resetBtn { background: #94a3b8; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>dN/dS Calculator and Interpreter</h3>
  <div class="subtitle">Classify each codon substitution as synonymous or nonsynonymous, then see the resulting dN/dS ratio and what it implies.</div>
  <table>
    <thead><tr><th>#</th><th>Ancestral</th><th>Derived</th><th>Classify</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div>
    <button id="checkBtn">Check my classification</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="resultBox" style="margin-top:1rem;"></div>
</div>
<script>
(function(){
  var code = {
    AAA:'Lys(K)', AAG:'Lys(K)', GGT:'Gly(G)', GGC:'Gly(G)', TTT:'Phe(F)', TTA:'Leu(L)',
    CAT:'His(H)', CAC:'His(H)', ATG:'Met(M)', ATA:'Ile(I)', GAA:'Glu(E)', GAT:'Asp(D)'
  };
  var pairs = [
    { anc: 'AAA', der: 'AAG' },
    { anc: 'GGT', der: 'GGC' },
    { anc: 'TTT', der: 'TTA' },
    { anc: 'CAT', der: 'CAC' },
    { anc: 'ATG', der: 'ATA' },
    { anc: 'GAA', der: 'GAT' }
  ];
  var truth = pairs.map(function(p){ return code[p.anc] === code[p.der] ? 'syn' : 'nonsyn'; });
  var chosen = pairs.map(function(){ return null; });

  var rowsEl = document.getElementById('rows');
  function render(){
    rowsEl.innerHTML = '';
    pairs.forEach(function(p, i){
      var tr = document.createElement('tr');
      tr.id = 'row' + i;
      tr.innerHTML = '<td>' + (i+1) + '</td>' +
        '<td class="codon">' + p.anc + '<div class="aa">' + code[p.anc] + '</div></td>' +
        '<td class="codon">' + p.der + '<div class="aa">' + code[p.der] + '</div></td>' +
        '<td><div class="classify-btns">' +
          '<button class="cbtn" data-i="' + i + '" data-c="syn">Synonymous</button>' +
          '<button class="cbtn" data-i="' + i + '" data-c="nonsyn">Nonsynonymous</button>' +
        '</div></td>';
      rowsEl.appendChild(tr);
    });
    rowsEl.querySelectorAll('.cbtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.dataset.i, 10);
        chosen[i] = btn.dataset.c;
        var row = document.getElementById('row' + i);
        row.querySelectorAll('.cbtn').forEach(function(b){ b.classList.remove('chosen-syn','chosen-nonsyn'); });
        btn.classList.add(btn.dataset.c === 'syn' ? 'chosen-syn' : 'chosen-nonsyn');
      });
    });
  }

  document.getElementById('checkBtn').addEventListener('click', function(){
    if (chosen.some(function(c){ return c === null; })){
      document.getElementById('resultBox').innerHTML = 'Classify all six pairs first.';
      return;
    }
    var dS = 0, dN = 0, correctCount = 0;
    pairs.forEach(function(p, i){
      var row = document.getElementById('row' + i);
      var isCorrect = chosen[i] === truth[i];
      row.classList.add(isCorrect ? 'correct-row' : 'incorrect-row');
      if (isCorrect) correctCount++;
      if (chosen[i] === 'syn') dS++; else dN++;
    });
    var ratio = dS === 0 ? Infinity : (dN/dS);
    var regime;
    if (ratio < 0.7) regime = '<b>purifying selection</b> (dN/dS &lt; 1 — nonsynonymous changes are being removed relative to synonymous ones)';
    else if (ratio > 1.4) regime = '<b>positive selection</b> (dN/dS &gt; 1 — nonsynonymous changes are more common than synonymous ones)';
    else regime = 'a pattern <b>consistent with neutral evolution</b> (dN/dS &asymp; 1 — no strong selective constraint on the protein sequence detected)';
    document.getElementById('resultBox').innerHTML =
      'You classified ' + correctCount + ' / 6 correctly (highlighted above).<br>' +
      'Based on <b>your</b> classification: dN = ' + dN + ', dS = ' + dS + ', dN/dS = ' + (ratio === Infinity ? '∞' : ratio.toFixed(2)) + '.<br>' +
      'This implies ' + regime + '.';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    chosen = pairs.map(function(){ return null; });
    document.getElementById('resultBox').innerHTML = '';
    render();
  });

  render();
})();
</script>
</body>
</html>

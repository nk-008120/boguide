<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hawk-Dove Payoff Simulator | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  label { font-size: 0.85rem; font-weight: 600; color: #334155; display:block; margin-bottom: 6px; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 10px; }
  .row > div { flex: 1; min-width: 220px; }
  .readout {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 0.92rem;
  }
  .readout b { color: #1d70a2; }
  #plot { width: 100%; height: 320px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Hawk-Dove Payoff Simulator</h3>
  <div class="subtitle">Set the value of the resource and the cost of losing an escalated fight — find where hawk and dove fitness cross (the ESS).</div>
  <div class="row">
    <div>
      <label for="vSlider">Resource value (V): <span id="vVal">4</span></label>
      <input type="range" id="vSlider" min="1" max="20" step="1" value="4">
    </div>
    <div>
      <label for="cSlider">Injury cost (C): <span id="cVal">10</span></label>
      <input type="range" id="cSlider" min="1" max="20" step="1" value="10">
    </div>
  </div>
  <div class="readout">
    ESS proportion of hawks (p*): <b id="essVal">40%</b>
  </div>
  <div id="plot"></div>
</div>
<script>
(function(){
  var vSlider = document.getElementById('vSlider');
  var cSlider = document.getElementById('cSlider');

  function fitness(p, V, C){
    var Whawk = p * (V - C) / 2 + (1 - p) * V;
    var Wdove = p * 0 + (1 - p) * (V / 2);
    return { hawk: Whawk, dove: Wdove };
  }

  function render(){
    var V = parseFloat(vSlider.value);
    var C = parseFloat(cSlider.value);
    document.getElementById('vVal').textContent = V;
    document.getElementById('cVal').textContent = C;

    var ps = [], hawkY = [], doveY = [];
    for (var p = 0; p <= 1; p += 0.02){
      var f = fitness(p, V, C);
      ps.push(p);
      hawkY.push(f.hawk);
      doveY.push(f.dove);
    }

    var pStar = V < C ? (V / C) : 1;
    document.getElementById('essVal').textContent = (pStar * 100).toFixed(0) + '%' + (V >= C ? ' (pure hawk — V ≥ C)' : '');

    Plotly.react('plot', [
      { x: ps, y: hawkY, mode: 'lines', name: 'Hawk fitness', line: { color: '#d9534f', width: 2.5 } },
      { x: ps, y: doveY, mode: 'lines', name: 'Dove fitness', line: { color: '#1d70a2', width: 2.5 } },
      { x: [pStar], y: [fitness(pStar, V, C).hawk], mode: 'markers', name: 'ESS', marker: { color: '#166534', size: 12 } }
    ], {
      margin: { t: 10, r: 15, l: 45, b: 40 },
      xaxis: { title: 'Proportion of hawks in population (p)', range: [0, 1] },
      yaxis: { title: 'Average fitness payoff' },
      legend: { orientation: 'h', y: -0.25 },
      font: { family: 'Inter, system-ui, sans-serif', size: 11 }
    }, { displayModeBar: false, responsive: true });
  }

  vSlider.addEventListener('input', render);
  cSlider.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>

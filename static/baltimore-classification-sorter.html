<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baltimore Classification Sorter | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #tray { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; min-height: 40px; }
  .chip {
    background: #eaf2f8;
    border: 2px solid #1d70a2;
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    color: #1d3557;
    cursor: grab;
    user-select: none;
    max-width: 220px;
  }
  .chip.dragging { opacity: 0.4; }
  .bins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bin {
    min-height: 90px;
    border-radius: 14px;
    border: 3px dashed #cbd5e1;
    padding: 8px;
    background: #f8fafc;
    transition: background 0.15s, border-color 0.15s;
  }
  .bin.over { background: #eef6ee; border-color: #2d6a4f; }
  .bin h4 { margin: 0 0 4px 0; text-align: center; color: #334155; font-size: 0.72rem; line-height: 1.3; }
  .placed {
    display: block;
    margin-bottom: 4px;
    padding: 4px 6px;
    border-radius: 8px;
    font-size: 0.68rem;
    font-weight: 700;
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
  }
  #score { text-align: center; font-size: 0.85rem; color: #4b5563; margin-top: 1rem; }
  #resetBtn {
    display: block;
    margin: 1rem auto 0;
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Baltimore Classification Sorter</h3>
  <div class="subtitle">Drag each virus into its correct Baltimore class based on the genome-type clue given.</div>
  <div id="tray"></div>
  <div class="bins" id="bins"></div>
  <div id="score">0 of 7 sorted</div>
  <button id="resetBtn">Reset</button>
</div>
<script>
(function(){
  var classes = [
    { id: 'I', label: 'I: dsDNA' },
    { id: 'II', label: 'II: ssDNA' },
    { id: 'III', label: 'III: dsRNA' },
    { id: 'IV', label: 'IV: +ssRNA' },
    { id: 'V', label: 'V: −ssRNA' },
    { id: 'VI', label: 'VI: +ssRNA reverse-transcribing' },
    { id: 'VII', label: 'VII: dsDNA reverse-transcribing' }
  ];
  var items = [
    { id: 'v1', label: 'Herpesvirus — double-stranded DNA genome', answer: 'I' },
    { id: 'v2', label: 'Parvovirus (e.g. B19) — single-stranded DNA genome', answer: 'II' },
    { id: 'v3', label: 'Rotavirus — segmented double-stranded RNA genome', answer: 'III' },
    { id: 'v4', label: 'Poliovirus — single-stranded RNA genome, directly translated by host ribosomes (positive-sense)', answer: 'IV' },
    { id: 'v5', label: 'Influenza virus — single-stranded RNA genome that must be transcribed before translation (negative-sense)', answer: 'V' },
    { id: 'v6', label: 'HIV — single-stranded RNA genome, reverse-transcribed into DNA', answer: 'VI' },
    { id: 'v7', label: 'Hepatitis B virus — double-stranded DNA genome, replicates via an RNA intermediate', answer: 'VII' }
  ];

  var tray = document.getElementById('tray');
  var binsHost = document.getElementById('bins');
  var scoreEl = document.getElementById('score');
  var placedCount = 0;
  var dragged = null;

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function makeChip(item){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.label;
    chip.draggable = true;
    chip.dataset.id = item.id;
    chip.addEventListener('dragstart', function(e){
      dragged = item;
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', function(){ chip.classList.remove('dragging'); });
    return chip;
  }

  function buildBins(){
    binsHost.innerHTML = '';
    classes.forEach(function(c){
      var bin = document.createElement('div');
      bin.className = 'bin';
      bin.dataset.answer = c.id;
      bin.innerHTML = '<h4>' + c.label + '</h4>';
      bin.addEventListener('dragover', function(e){ e.preventDefault(); bin.classList.add('over'); });
      bin.addEventListener('dragleave', function(){ bin.classList.remove('over'); });
      bin.addEventListener('drop', function(e){
        e.preventDefault();
        bin.classList.remove('over');
        if (!dragged) return;
        var item = dragged;
        if (item.answer === bin.dataset.answer){
          var entry = document.createElement('div');
          entry.className = 'placed';
          entry.textContent = item.label.split(' — ')[0];
          bin.appendChild(entry);
          var chipEl = tray.querySelector('[data-id="' + item.id + '"]');
          if (chipEl) chipEl.remove();
          placedCount++;
          scoreEl.textContent = placedCount + ' of ' + items.length + ' sorted';
        } else {
          var chipEl2 = tray.querySelector('[data-id="' + item.id + '"]');
          if (chipEl2){
            chipEl2.style.borderColor = '#d9534f';
            setTimeout(function(){ chipEl2.style.borderColor = '#1d70a2'; }, 700);
          }
        }
        dragged = null;
      });
      binsHost.appendChild(bin);
    });
  }

  function reset(){
    tray.innerHTML = '';
    placedCount = 0;
    scoreEl.textContent = '0 of ' + items.length + ' sorted';
    buildBins();
    shuffle(items.slice()).forEach(function(item){ tray.appendChild(makeChip(item)); });
  }

  document.getElementById('resetBtn').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>

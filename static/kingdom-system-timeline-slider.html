<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom System Timeline Slider | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #stageTitle { text-align: center; font-weight: 700; color: #1a472a; font-size: 1rem; margin-bottom: 4px; }
  #stageYear { text-align: center; font-size: 0.78rem; color: #94a3b8; margin-bottom: 12px; }
  input[type=range] { width: 100%; margin-bottom: 16px; }
  svg { display: block; margin: 0 auto; }
  .kbox { stroke-width: 2; rx: 8; }
  .kbox-label { font-size: 12px; font-weight: 700; text-anchor: middle; }
  #caption {
    margin-top: 14px;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Kingdom System Timeline Slider</h3>
  <div class="subtitle">Drag through the four historical classification systems and watch the top-level groups split and merge.</div>
  <div id="stageTitle"></div>
  <div id="stageYear"></div>
  <input type="range" id="slider" min="0" max="3" step="1" value="0">
  <svg id="svg" width="600" height="200" viewBox="0 0 600 200"></svg>
  <div id="caption"></div>
</div>
<script>
(function(){
  var palette = { Plantae: '#4ade80', Animalia: '#f97316', Monera: '#a78bfa', Protista: '#38bdf8', Fungi: '#facc15',
    Eubacteria: '#a78bfa', Archaebacteria: '#c084fc', Bacteria: '#a78bfa', Archaea: '#c084fc', Eukarya: '#1d70a2' };

  var stages = [
    {
      title: 'Two Kingdoms (Linnaeus, 18th century)',
      year: 'Baseline system',
      boxes: [
        { label: 'Plantae', x: 150, w: 140 },
        { label: 'Animalia', x: 310, w: 140 }
      ],
      caption: 'Only two kingdoms, sorted purely by whether an organism visibly moved and lacked a cell wall. Unicellular and microbial life didn’t fit either category cleanly.'
    },
    {
      title: 'Five Kingdoms (Whittaker, 1969)',
      year: '~200 years later',
      boxes: [
        { label: 'Monera', x: 40, w: 100 },
        { label: 'Protista', x: 150, w: 100 },
        { label: 'Fungi', x: 260, w: 100 },
        { label: 'Plantae', x: 370, w: 100 },
        { label: 'Animalia', x: 480, w: 100 }
      ],
      caption: 'Monera (all prokaryotes, unified) is split out, along with a catch-all Protista, and Fungi finally gets its own kingdom instead of being lumped with plants.'
    },
    {
      title: 'Six Kingdoms',
      year: 'Late 20th century',
      boxes: [
        { label: 'Eubacteria', x: 15, w: 100 },
        { label: 'Archaebacteria', x: 125, w: 120 },
        { label: 'Protista', x: 255, w: 90 },
        { label: 'Fungi', x: 355, w: 80 },
        { label: 'Plantae', x: 445, w: 70 },
        { label: 'Animalia', x: 525, w: 70 }
      ],
      caption: 'Monera is split into Eubacteria and Archaebacteria, once biochemical/genetic evidence showed these two prokaryote groups were at least as different from each other as either is from eukaryotes.'
    },
    {
      title: 'Three Domains (Woese, 1977)',
      year: 'Based on 16S/18S rRNA sequencing',
      boxes: [
        { label: 'Bacteria', x: 15, w: 130 },
        { label: 'Archaea', x: 165, w: 130 },
        { label: 'Eukarya', x: 315, w: 280, nested: ['Protista', 'Fungi', 'Plantae', 'Animalia'] }
      ],
      caption: 'A new rank <i>above</i> kingdom is introduced. rRNA data showed Archaea and Bacteria are not sister groups despite both being prokaryotic — Archaea is in several respects more similar to Eukarya. Eukarya now unifies the four former eukaryotic kingdoms as one domain.'
    }
  ];

  var svg = document.getElementById('svg');
  var svgns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(svgns, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function render(idx){
    var s = stages[idx];
    document.getElementById('stageTitle').textContent = s.title;
    document.getElementById('stageYear').textContent = s.year;
    document.getElementById('caption').innerHTML = s.caption;
    svg.innerHTML = '';
    s.boxes.forEach(function(b){
      var y = 60, h = 90;
      svg.appendChild(el('rect', { class: 'kbox', x: b.x, y: y, width: b.w, height: h, fill: palette[b.label] || '#cbd5e1', stroke: '#334155', rx: 8 }));
      svg.appendChild(el('text', { class: 'kbox-label', x: b.x + b.w/2, y: y + h/2 + 4, fill: '#1a2e22' })).textContent = b.label;
      if (b.nested){
        var nw = (b.w - 20) / b.nested.length;
        b.nested.forEach(function(n, i){
          var nx = b.x + 10 + i * nw;
          svg.appendChild(el('rect', { x: nx, y: y + h + 10, width: nw - 6, height: 30, fill: palette[n] || '#e2e8f0', stroke: '#94a3b8', rx: 5 }));
          svg.appendChild(el('text', { x: nx + (nw-6)/2, y: y + h + 30, 'font-size': 9, 'text-anchor': 'middle', fill: '#334155' })).textContent = n;
        });
      }
    });
  }

  document.getElementById('slider').addEventListener('input', function(){
    render(parseInt(this.value, 10));
  });

  render(0);
})();
</script>
</body>
</html>

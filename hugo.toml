[params]
  # Default social-share preview image (Open Graph/Twitter Card) for any
  # page that doesn't set its own via front-matter `images:` — see
  # content/bioclash/index.md and content/papers/_index.md for the two
  # sub-brand overrides.
  images = ["/og-default.png"]
  # Navbar settings
  [params.navbar]
    title = "BiOGuide"
    [params.navbar.logo]
      path = "/logo.png"
      width = 40
      height = 40
      alt = "BioGuide Logo"
  # Image zoom
  [params.imageZoom]
    enable = true
  [params.theme]
    default = "favourite"
    allowUserToggle = "True"
  # Footer
  [params.footer]
    copyright = "© 2026 BioGuide for IBO Vilnius"
  # Table of contents
  toc = true
  # Custom CSS (relative to static/ folder)
  custom_css = ["css/custom.css"]
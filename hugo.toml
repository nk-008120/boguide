[params]
  # og:site_name reads Site.Params.title specifically (not the top-level
  # Hugo `title` above, which only drives <title> tags) -- see
  # themes/hextra/layouts/_partials/opengraph.html.
  title = "BiOGuide"
  description = "Free Biology Olympiad preparation hub: study guides, practice papers, simulators, and training resources for IBO, USABO, and INBO."
  # Default social-share preview image (Open Graph/Twitter Card) for any
  # page that doesn't set its own via front-matter `images:` -- see
  # content/bioclash/index.md and content/papers/_index.md for the two
  # sub-brand overrides.
  images = ["/og-default.png"]
  # Navbar settings
  [params.navbar]
    title = "BiOGuide"
    [params.navbar.logo]
      path = "/logo.png"
      width = 40
      height = 40
      alt = "BiOGuide Logo"
  # Image zoom
  [params.imageZoom]
    enable = true
  [params.theme]
    default = "favourite"
    allowUserToggle = "True"
  # Footer
  [params.footer]
    copyright = "© 2026 BiOGuide for IBO Vilnius"
  # Table of contents
  toc = true
[params.notice]
  id = "ap01-2026"
  text = "BiOClash round AP-01, Animal Anatomy and Physiology, opens 27 November. Every BiOGuide account is already registered."
  linkText = "See how it works"
  link = "/bioclash/"
[params.mermaid]
  base = "https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist"
[params.analytics.umami]
  serverURL = "https://bioguide-umami-five.vercel.app"
  websiteID = "62899983-724a-4954-8e29-1355147fe293"
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newt/Snake Geographic Trait-Matching Map | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #map-wrap { position: relative; }
  #map-wrap svg { width: 100%; height: 300px; background: #eaf2f8; border-radius: 14px; }
  .pop-marker { cursor: pointer; }
  .pop-marker circle { fill: #fff; stroke: #1d70a2; stroke-width: 3; transition: r 0.15s; }
  .pop-marker.active circle { fill: #1d70a2; r: 12; }
  .pop-marker text { font-size: 9px; fill: #1e293b; font-weight: 700; text-anchor: middle; }
  #readout {
    display: flex; gap: 20px; margin-top: 1rem; background: #f8fafc; border-radius: 14px; padding: 1rem;
  }
  .readout-col { flex: 1; text-align: center; }
  .readout-col h4 { margin: 0 0 8px 0; font-size: 0.8rem; color: #334155; }
  .level-track { height: 90px; width: 30px; margin: 0 auto; background: #e2e8f0; border-radius: 8px; position: relative; overflow: hidden; }
  .level-fill { position: absolute; bottom: 0; left: 0; right: 0; transition: height 0.3s; }
  .level-fill.toxin { background: #d9534f; }
  .level-fill.resist { background: #1d70a2; }
  .level-val { font-size: 0.8rem; margin-top: 6px; color: #4b5563; }
  #summary { text-align: center; font-size: 0.82rem; color: #4b5563; margin-top: 10px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Newt/Snake Geographic Trait-Matching Map</h3>
  <div class="subtitle">Click each population along this stylized Pacific Northwest range to compare local newt toxicity against local garter snake resistance.</div>
  <div id="map-wrap">
    <svg viewBox="0 0 300 300" id="mapSvg"></svg>
  </div>
  <div id="readout">
    <div class="readout-col">
      <h4>Newt toxicity (TTX)</h4>
      <div class="level-track"><div class="level-fill toxin" id="toxinFill"></div></div>
      <div class="level-val" id="toxinVal"></div>
    </div>
    <div class="readout-col">
      <h4>Snake resistance</h4>
      <div class="level-track"><div class="level-fill resist" id="resistFill"></div></div>
      <div class="level-val" id="resistVal"></div>
    </div>
  </div>
  <div id="summary"></div>
</div>
<script>
(function(){
  var populations = [
    { name: 'Site A (north)', x: 150, y: 40, toxin: 25, resist: 22 },
    { name: 'Site B', x: 110, y: 90, toxin: 55, resist: 50 },
    { name: 'Site C', x: 170, y: 120, toxin: 90, resist: 85 },
    { name: 'Site D', x: 90, y: 170, toxin: 40, resist: 38 },
    { name: 'Site E', x: 190, y: 200, toxin: 70, resist: 68 },
    { name: 'Site F (south)', x: 140, y: 250, toxin: 15, resist: 18 }
  ];

  var svg = document.getElementById('mapSvg');
  populations.forEach(function(p, i){
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'pop-marker');
    g.id = 'marker-' + i;
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 9);
    g.appendChild(c);
    var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y - 14);
    t.textContent = p.name;
    g.appendChild(t);
    g.addEventListener('click', function(){ select(i); });
    svg.appendChild(g);
  });

  var maxLevel = 100;
  function select(i){
    document.querySelectorAll('.pop-marker').forEach(function(m, idx){ m.classList.toggle('active', idx === i); });
    var p = populations[i];
    document.getElementById('toxinFill').style.height = (p.toxin/maxLevel*100) + '%';
    document.getElementById('resistFill').style.height = (p.resist/maxLevel*100) + '%';
    document.getElementById('toxinVal').textContent = p.toxin + ' units';
    document.getElementById('resistVal').textContent = p.resist + ' units';
    var gap = Math.abs(p.toxin - p.resist);
    document.getElementById('summary').innerHTML = '<b>' + p.name + ':</b> toxicity and resistance differ by only ' + gap + ' units — ' +
      (gap <= 8 ? 'a tightly matched population, consistent with local coevolution.' : 'a larger mismatch than most sites — still broadly tracking each other, but less tightly matched here.');
  }

  select(2);
})();
</script>
</body>
</html>

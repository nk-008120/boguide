<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pericarp Layer Explorer Across Fruit Types | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
    text-align: center;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
    text-align: left;
  }
  .tabs { display: flex; justify-content: center; gap: 0; margin-bottom: 1rem; }
  .tab-btn {
    border: 2px solid #2d6a4f;
    background: #fff;
    color: #2d6a4f;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn:first-child { border-radius: 999px 0 0 999px; }
  .tab-btn:last-child { border-radius: 0 999px 999px 0; }
  .tab-btn.active { background: #2d6a4f; color: #fff; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    text-align: left;
    min-height: 5em;
  }
  .legend { font-size: 0.72rem; color: #64748b; margin-top: 10px; text-align: left; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Pericarp Layers Across Fruit Types</h3>
  <div class="subtitle">Switch fruit type to see how the same exocarp/mesocarp/endocarp plan looks completely different in each.</div>
  <div class="tabs">
    <button class="tab-btn active" id="berryBtn">Berry</button>
    <button class="tab-btn" id="drupeBtn">Drupe</button>
    <button class="tab-btn" id="pomeBtn">Pome</button>
  </div>
  <svg id="fruitSvg" viewBox="0 0 220 220" width="220" height="220"></svg>
  <div class="note" id="note"></div>
  <div class="legend">
    <span><span class="sw" style="background:#7fa838"></span>Exocarp</span>
    <span><span class="sw" style="background:#c73b3b"></span>Mesocarp</span>
    <span><span class="sw" style="background:#8a5a2b"></span>Endocarp</span>
    <span><span class="sw" style="background:#e8c88a"></span>Non-ovary flesh</span>
  </div>
</div>
<script>
(function(){
  var berryBtn = document.getElementById('berryBtn');
  var drupeBtn = document.getElementById('drupeBtn');
  var pomeBtn = document.getElementById('pomeBtn');
  var fruitSvg = document.getElementById('fruitSvg');
  var note = document.getElementById('note');
  var cx = 110, cy = 110;

  function seeds(n, r){
    var html = '';
    for (var i=0;i<n;i++){
      var ang = 2*Math.PI*i/n;
      var x = cx + r*Math.sin(ang), y = cy - r*Math.cos(ang);
      html += '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="6" ry="9" fill="#f6d375" stroke="#c99a1f" stroke-width="1"/>';
    }
    return html;
  }

  function showBerry(){
    setActive(berryBtn);
    fruitSvg.innerHTML =
      '<circle cx="'+cx+'" cy="'+cy+'" r="95" fill="#7fa838"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="#c73b3b"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="82" fill="#c73b3b"/>' +
      seeds(6, 45);
    note.innerHTML = '<b>Berry</b> (e.g. tomato, grape) — the entire pericarp is fleshy at maturity; exocarp, mesocarp, and endocarp are not sharply distinguishable from each other, all soft tissue surrounding the seeds.';
  }

  function showDrupe(){
    setActive(drupeBtn);
    fruitSvg.innerHTML =
      '<circle cx="'+cx+'" cy="'+cy+'" r="95" fill="#7fa838"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="#c73b3b"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="48" fill="#8a5a2b"/>' +
      seeds(1, 0);
    note.innerHTML = '<b>Drupe</b> (e.g. peach, cherry) — thin exocarp (skin), thick fleshy mesocarp (the edible flesh), and a hardened, stony endocarp enclosing a single seed (the "pit").';
  }

  function showPome(){
    setActive(pomeBtn);
    fruitSvg.innerHTML =
      '<circle cx="'+cx+'" cy="'+cy+'" r="95" fill="#e8c88a"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="38" fill="#7fa838"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="33" fill="#c73b3b"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="24" fill="#8a5a2b"/>' +
      seeds(5, 14);
    note.innerHTML = '<b>Pome</b> (e.g. apple, pear) — most of the edible flesh (tan outer ring) is derived from the floral receptacle/hypanthium, <b>not</b> the ovary wall. The true pericarp is compressed into the thin core (green/red/brown rings) immediately around the seeds — the part most people discard.';
  }

  function setActive(btn){
    [berryBtn,drupeBtn,pomeBtn].forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  }

  berryBtn.addEventListener('click', showBerry);
  drupeBtn.addEventListener('click', showDrupe);
  pomeBtn.addEventListener('click', showPome);
  showBerry();
})();
</script>
</body>
</html>

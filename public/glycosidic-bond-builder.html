<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glycosidic Bond Builder | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle-row { display: flex; gap: 8px; margin-bottom: 1rem; justify-content: center; }
  .toggle-row button {
    padding: 8px 20px; border-radius: 999px; border: 2px solid #e2e8f0; background: #f8fafc;
    cursor: pointer; font-size: 0.85rem; font-weight: 700;
  }
  .toggle-row button.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
  #buildBtn { display: block; margin: 0 auto 1rem; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 10px 24px; font-size: 0.85rem; cursor: pointer; }
  #buildBtn:hover { background: #1a472a; }
  #stage { height: 200px; background: #f8fafc; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #resultLabel { text-align: center; margin-top: 10px; font-size: 0.88rem; color: #4b5563; min-height: 40px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>&alpha; vs. &beta; Glycosidic Bond Builder</h3>
  <div class="subtitle">Pick a configuration, then click Build to link three glucose rings and see the resulting chain shape.</div>
  <div class="toggle-row">
    <button id="alphaBtn" class="active">&alpha;(1&rarr;4)</button>
    <button id="betaBtn">&beta;(1&rarr;4)</button>
  </div>
  <button id="buildBtn">Build chain</button>
  <div id="stage"><svg id="chainSvg" viewBox="0 0 400 160" width="380" height="152"></svg></div>
  <div id="resultLabel">Select a configuration and click Build.</div>
</div>
<script>
(function(){
  var mode = 'alpha';
  var alphaBtn = document.getElementById('alphaBtn');
  var betaBtn = document.getElementById('betaBtn');
  var svg = document.getElementById('chainSvg');
  var resultLabel = document.getElementById('resultLabel');
  var ns = 'http://www.w3.org/2000/svg';

  alphaBtn.addEventListener('click', function(){ mode = 'alpha'; alphaBtn.classList.add('active'); betaBtn.classList.remove('active'); });
  betaBtn.addEventListener('click', function(){ mode = 'beta'; betaBtn.classList.add('active'); alphaBtn.classList.remove('active'); });

  function ring(cx, cy, rotated){
    var g = document.createElementNS(ns, 'g');
    var hex = document.createElementNS(ns, 'polygon');
    var pts = [];
    for (var a = 0; a < 6; a++){
      var ang = (Math.PI/3)*a + (rotated ? Math.PI/6 : 0);
      pts.push((cx + 16*Math.cos(ang)).toFixed(1) + ',' + (cy + 16*Math.sin(ang)).toFixed(1));
    }
    hex.setAttribute('points', pts.join(' '));
    hex.setAttribute('fill', '#fde68a');
    hex.setAttribute('stroke', '#b45309');
    hex.setAttribute('stroke-width', '2');
    g.appendChild(hex);
    return g;
  }

  function build(){
    svg.innerHTML = '';
    var y = 80;
    var positions;
    var label;
    if (mode === 'alpha'){
      positions = [[60,y],[160,y],[260,y]];
      label = 'alpha(1→4): every linkage kinks the same direction → chain curls into a helix (like amylose/glycogen).';
    } else {
      positions = [[60,y],[160,y-26],[260,y]];
      label = 'beta(1→4): each glucose flips 180 degrees relative to its neighbour → chain extends straight (like cellulose).';
    }
    positions.forEach(function(p, i){
      svg.appendChild(ring(p[0], p[1], mode === 'beta' && i % 2 === 1));
    });
    for (var i = 0; i < positions.length - 1; i++){
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', positions[i][0] + 16);
      line.setAttribute('y1', positions[i][1]);
      line.setAttribute('x2', positions[i+1][0] - 16);
      line.setAttribute('y2', positions[i+1][1]);
      line.setAttribute('stroke', '#334155');
      line.setAttribute('stroke-width', '2');
      svg.appendChild(line);
    }
    resultLabel.textContent = label;
  }

  document.getElementById('buildBtn').addEventListener('click', build);
})();
</script>
</body>
</html>

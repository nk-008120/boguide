<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polygenic Trait Distribution Simulator | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .readout { background: #f1f5f9; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; font-size: 0.9rem; }
  .readout b { color: #1d70a2; }
  label { font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
  input[type=range] { width: 100%; }
  .note { font-size: 0.82rem; color: #4b5563; margin-top: 10px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Polygenic Trait Distribution Simulator</h3>
  <div class="subtitle">Adjust the number of contributing gene pairs and watch the F2 phenotype distribution shift from a few discrete classes toward a smooth bell curve.</div>
  <div class="readout" id="readout">Gene pairs (n): <b>1</b> &nbsp;|&nbsp; Phenotype classes: <b>3</b></div>
  <label for="nSlider">Number of contributing gene pairs (n)</label>
  <input type="range" id="nSlider" min="1" max="6" value="1" step="1">
  <div id="plotDiv" style="width:100%; height:340px;"></div>
  <div class="note" id="explainNote"></div>
</div>
<script>
(function(){
  function choose(n, k){
    if (k < 0 || k > n) return 0;
    var res = 1;
    for (var i = 0; i < k; i++){
      res = res * (n - i) / (i + 1);
    }
    return Math.round(res);
  }

  function distribution(n){
    var classes = 2 * n;
    var xs = [], ys = [];
    var total = Math.pow(4, n);
    for (var k = 0; k <= classes; k++){
      xs.push(k);
      ys.push(choose(classes, k) / total);
    }
    return { xs: xs, ys: ys, total: total };
  }

  var plotDiv = document.getElementById('plotDiv');
  var gd = null;

  function render(n){
    var d = distribution(n);
    var data = [{
      x: d.xs,
      y: d.ys,
      type: 'bar',
      marker: { color: '#2d6a4f' }
    }];
    var layout = {
      margin: { t: 20, r: 20, b: 50, l: 50 },
      xaxis: { title: 'Number of dominant ("effective") alleles' },
      yaxis: { title: 'Frequency', tickformat: '.0%' },
      font: { family: 'Inter, system-ui, sans-serif', size: 12, color: '#1e293b' }
    };
    if (!gd){
      Plotly.newPlot(plotDiv, data, layout, {displayModeBar:false}).then(function(g){ gd = g; });
    } else {
      Plotly.react(plotDiv, data, layout, {displayModeBar:false});
    }
    document.getElementById('readout').innerHTML = 'Gene pairs (n): <b>' + n + '</b> &nbsp;|&nbsp; Phenotype classes: <b>' + (2*n+1) + '</b>';
    var note;
    if (n === 1){
      note = 'With just one gene pair, this is an ordinary monohybrid cross: 3 classes in a 1:2:1 ratio — clearly discrete, not remotely bell-shaped.';
    } else if (n <= 3){
      note = 'With ' + n + ' gene pairs, the distribution already looks less discrete — more classes, and the extreme classes (all-dominant or all-recessive) are getting rarer.';
    } else {
      note = 'With ' + n + ' gene pairs (' + (2*n+1) + ' classes), the extreme classes are now vanishingly rare and the middle classes dominate — the distribution is starting to look like a smooth, continuous bell curve, exactly the pattern a truly polygenic trait like human height shows.';
    }
    document.getElementById('explainNote').textContent = note;
  }

  document.getElementById('nSlider').addEventListener('input', function(){
    render(parseInt(this.value, 10));
  });

  render(1);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O2-Hemoglobin Dissociation Curve Explorer | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .slider-panel { display:flex; flex-wrap:wrap; gap: 1.2rem; background:#f8fafc; padding: 0.8rem 1rem; border-radius:16px; margin-bottom: 0.8rem; }
  .slider-item { flex:1; min-width:160px; }
  .slider-item label { display:block; font-size:0.78rem; font-weight:700; color:#2d6a4f; margin-bottom:2px; }
  .slider-item input { width:100%; accent-color:#2d6a4f; }
  .presets { display:flex; gap:8px; margin-bottom: 0.6rem; }
  .presets button {
    background:#1d70a2; color:#fff; border:none; border-radius:999px; padding:6px 14px;
    font-size:0.78rem; font-weight:700; cursor:pointer;
  }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; }
  .readout b { color:#2d6a4f; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>O₂-Hemoglobin Dissociation Curve Explorer</h3>
  <div class="subtitle">Drag the CO₂/H⁺/temperature slider to shift the curve (Bohr effect) and drag the PO₂ marker to read off hemoglobin saturation at any partial pressure.</div>
  <div class="slider-panel">
    <div class="slider-item">
      <label>CO₂ / H⁺ / temperature level</label>
      <input type="range" id="bohrSlider" min="0" max="100" value="20">
    </div>
    <div class="slider-item">
      <label>PO₂ marker (mmHg)</label>
      <input type="range" id="po2Slider" min="0" max="100" value="100">
    </div>
  </div>
  <div class="presets">
    <button id="lungBtn">Jump to lung (PO₂ = 100)</button>
    <button id="tissueBtn">Jump to resting tissue (PO₂ = 40)</button>
  </div>
  <div id="plot" style="width:100%; height:380px;"></div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var plotDiv = document.getElementById('plot');
  var bohrSlider = document.getElementById('bohrSlider');
  var po2Slider = document.getElementById('po2Slider');
  var readout = document.getElementById('readout');

  function satCurve(po2, p50, n){
    return 100 * Math.pow(po2, n) / (Math.pow(p50, n) + Math.pow(po2, n));
  }

  function p50FromBohr(level){
    return 20 + (level/100)*20;
  }

  function curveXY(p50){
    var x=[], y=[];
    for (var i=0;i<=100;i++){
      x.push(i);
      y.push(satCurve(i, p50, 2.8));
    }
    return {x:x, y:y};
  }

  function render(){
    var level = parseFloat(bohrSlider.value);
    var p50 = p50FromBohr(level);
    var restingCurve = curveXY(20);
    var shiftedCurve = curveXY(p50);
    var po2 = parseFloat(po2Slider.value);
    var satAtMarker = satCurve(po2, p50, 2.8);

    var traces = [
      {x: restingCurve.x, y: restingCurve.y, name:'Resting reference curve', mode:'lines', line:{color:'#94a3b8', width:2, dash:'dot'}},
      {x: shiftedCurve.x, y: shiftedCurve.y, name:'Current curve (P50=' + p50.toFixed(0) + ')', mode:'lines', line:{color:'#dc2626', width:3}},
      {x:[po2], y:[satAtMarker], name:'Marker', mode:'markers', marker:{color:'#1a472a', size:12}}
    ];
    var layout = {
      xaxis: {title:'PO₂ (mmHg)', range:[0,100], gridcolor:'#e9ecef'},
      yaxis: {title:'% Hemoglobin saturation', range:[0,100], gridcolor:'#e9ecef'},
      shapes: [{type:'line', x0:po2, x1:po2, y0:0, y1:100, line:{color:'#1a472a', width:1, dash:'dash'}}],
      legend: {orientation:'h', y:-0.2},
      margin: {t:20, l:55, r:20, b:45},
      plot_bgcolor:'#ffffff', paper_bgcolor:'#ffffff'
    };
    Plotly.react(plotDiv, traces, layout, {responsive:true, displayModeBar:false});

    readout.innerHTML = 'At PO₂ = <b>' + po2 + ' mmHg</b> with P50 = <b>' + p50.toFixed(0) + ' mmHg</b>: hemoglobin saturation = <b>' + satAtMarker.toFixed(1) + '%</b>.' +
      (level > 40 ? ' The curve has shifted right (Bohr effect) — hemoglobin releases more O₂ at this PO₂ than it would at rest.' : '');
  }

  bohrSlider.addEventListener('input', render);
  po2Slider.addEventListener('input', render);
  document.getElementById('lungBtn').addEventListener('click', function(){ po2Slider.value = 100; render(); });
  document.getElementById('tissueBtn').addEventListener('click', function(){ po2Slider.value = 40; render(); });

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mating System Classifier | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .tray {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 44px;
    padding: 10px;
    background: #f8fafc;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px dashed #cbd5e1;
  }
  .chip {
    background: #eef2f6;
    border: 1px solid #94a3b8;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.8rem;
    cursor: grab;
    max-width: 320px;
  }
  .chip.dragging { opacity: 0.4; }
  .bins {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .bin {
    border-radius: 14px;
    padding: 10px;
    min-height: 90px;
    background: #f1f5f9;
    border: 2px dashed #cbd5e1;
    transition: background 0.15s, border-color 0.15s;
  }
  .bin.over { border-color: #2d6a4f; background: #ecfdf5; }
  .bin-title { font-size: 0.85rem; font-weight: 700; color: #1a472a; }
  .bin-sub { font-size: 0.72rem; color: #4b5563; margin-bottom: 6px; }
  .bin .chip.placed { cursor: default; background: #dcfce7; border-color: #166534; font-size: 0.76rem; margin-bottom: 6px; }
  .btn {
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.88rem;
    cursor: pointer;
    margin-top: 14px;
  }
  .note { font-size: 0.82rem; color: #4b5563; margin-top: 12px; min-height: 1.4em; }
  .warn { color: #b91c1c; font-weight: 600; }
  .ok { color: #166534; font-weight: 600; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Mating System Classifier</h3>
  <div class="subtitle">Drag each species scenario into the mating system it best matches.</div>
  <div class="tray" id="tray"></div>
  <div class="bins">
    <div class="bin" data-q="monogamy">
      <div class="bin-title">Monogamy</div>
      <div class="bin-sub">One male, one female</div>
    </div>
    <div class="bin" data-q="polygyny">
      <div class="bin-title">Polygyny</div>
      <div class="bin-sub">One male, multiple females</div>
    </div>
    <div class="bin" data-q="polyandry">
      <div class="bin-title">Polyandry</div>
      <div class="bin-sub">One female, multiple males</div>
    </div>
    <div class="bin" data-q="promiscuity">
      <div class="bin-title">Promiscuity</div>
      <div class="bin-sub">Multiple mates, no pair bond, either sex</div>
    </div>
  </div>
  <button class="btn" id="resetBtn">Reset</button>
  <div class="note" id="note">Drag all eight scenarios into their mating system.</div>
</div>
<script>
(function(){
  var items = [
    { id: 'm1', q: 'monogamy', text: 'Many songbird pairs raise chicks together season after season, both parents feeding nestlings.' },
    { id: 'm2', q: 'monogamy', text: 'Prairie voles form long-term pair bonds and share burrow and pup-rearing duties.' },
    { id: 'g1', q: 'polygyny', text: 'A male elephant seal defends a beach territory and mates with dozens of females in his harem.' },
    { id: 'g2', q: 'polygyny', text: 'A red deer stag gathers and defends a harem of hinds during the autumn rut.' },
    { id: 'a1', q: 'polyandry', text: 'Female phalaropes compete for mates while males alone incubate the eggs.' },
    { id: 'a2', q: 'polyandry', text: 'A male seahorse broods fertilized eggs in a pouch while females seek multiple mates.' },
    { id: 'p1', q: 'promiscuity', text: 'Chimpanzees mate with multiple partners across a breeding season, with no lasting pair bond.' },
    { id: 'p2', q: 'promiscuity', text: 'Bonobos mate with multiple partners of either sex, with no stable pair bonds.' }
  ];
  var tray = document.getElementById('tray');
  var bins = document.querySelectorAll('.bin');
  var note = document.getElementById('note');
  var placedCount = 0;

  function shuffled(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeChip(item){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.draggable = true;
    chip.id = item.id;
    chip.dataset.q = item.q;
    chip.textContent = item.text;
    chip.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('text/plain', item.id);
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', function(){
      chip.classList.remove('dragging');
    });
    return chip;
  }

  function build(){
    tray.innerHTML = '';
    placedCount = 0;
    note.textContent = 'Drag all eight scenarios into their mating system.';
    note.className = 'note';
    shuffled(items).forEach(function(item){
      tray.appendChild(makeChip(item));
    });
    bins.forEach(function(bin){
      var placed = bin.querySelectorAll('.chip.placed');
      placed.forEach(function(c){ c.remove(); });
      bin.classList.remove('over');
    });
  }

  bins.forEach(function(bin){
    bin.addEventListener('dragover', function(e){
      e.preventDefault();
      bin.classList.add('over');
    });
    bin.addEventListener('dragleave', function(){
      bin.classList.remove('over');
    });
    bin.addEventListener('drop', function(e){
      e.preventDefault();
      bin.classList.remove('over');
      var id = e.dataTransfer.getData('text/plain');
      var chip = document.getElementById(id);
      if (!chip) { return; }
      var droppedChip = chip;
      if (bin.dataset.q === droppedChip.dataset.q){
        droppedChip.classList.add('placed');
        droppedChip.draggable = false;
        droppedChip.textContent += ' ✓';
        bin.appendChild(droppedChip);
        placedCount++;
        if (placedCount === items.length){
          note.innerHTML = '<span class="ok">All eight sorted correctly.</span>';
        } else {
          note.textContent = placedCount + ' of ' + items.length + ' placed correctly.';
        }
      } else {
        note.innerHTML = '<span class="warn">Not this mating system — check who competes for whom and whether pair bonds form.</span>';
        setTimeout(function(){
          tray.appendChild(droppedChip);
        }, 350);
      }
    });
  });

  document.getElementById('resetBtn').addEventListener('click', build);

  build();
})();
</script>
</body>
</html>

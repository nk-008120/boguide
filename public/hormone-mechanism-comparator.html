<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hormone Mechanism Comparator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle-row { display:flex; gap:8px; margin-bottom: 1rem; }
  .toggle-btn {
    flex: 1; padding: 9px 6px; border-radius: 999px; border: 2px solid #cbd5e1;
    background: #f8fafc; font-size: 0.8rem; font-weight: 600; cursor: pointer; color:#475569;
  }
  .toggle-btn.active { background:#1d70a2; border-color:#1d70a2; color:#fff; }
  .stage { position: relative; height: 220px; background: #f1f5f9; border-radius: 16px; overflow: hidden; margin-bottom: 1rem; }
  .cell { position:absolute; left:20px; top:20px; right:20px; bottom:20px; border: 3px solid #94a3b8; border-radius: 100px/60px; background: #fff; }
  .membrane-label { position:absolute; left: 30px; top: 4px; font-size: 0.7rem; color:#64748b; }
  .hormone-dot { position:absolute; width: 18px; height:18px; border-radius:50%; background:#e67e22; transition: all 0.8s ease; opacity:0; }
  .receptor { position:absolute; width: 14px; height: 40px; background:#2d6a4f; border-radius:4px; opacity:0; transition: opacity 0.4s; }
  .nucleus { position:absolute; width:70px; height:70px; border-radius:50%; background:#dbeafe; border:2px solid #60a5fa; left:50%; top:50%; transform:translate(-50%,-50%); opacity:0; transition:opacity 0.4s; }
  .cascade-label { position:absolute; font-size:0.72rem; font-weight:700; color:#1a472a; opacity:0; transition:opacity 0.4s; background:#fff; padding:2px 6px; border-radius:6px; }
  .timer { text-align:center; font-size: 0.85rem; color:#334155; margin-bottom: 0.8rem; }
  .timer b { color:#b45309; }
  .controls { display:flex; gap: 10px; justify-content:center; }
  button.play {
    background: #2d6a4f; color:#fff; border:none; border-radius:999px; padding:8px 20px;
    font-size:0.85rem; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Hormone Mechanism Comparator</h3>
  <div class="subtitle">Pick a hormone class, then press Play to watch its specific signaling mechanism unfold on a generic target cell — timed to show the real speed difference.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" data-mode="lipid">Steroid/thyroid (lipid-soluble)</button>
    <button class="toggle-btn" data-mode="water">Peptide/amine (water-soluble)</button>
  </div>
  <div class="stage" id="stage">
    <div class="membrane-label">Extracellular fluid</div>
    <div class="cell">
      <div class="nucleus" id="nucleus"></div>
    </div>
    <div class="hormone-dot" id="hormoneDot" style="left:10px; top:95px;"></div>
    <div class="receptor" id="receptor" style="left:200px; top:85px;"></div>
    <div class="cascade-label" id="label1" style="left:230px; top:60px;"></div>
    <div class="cascade-label" id="label2" style="left:230px; top:170px;"></div>
  </div>
  <div class="timer" id="timer">Press Play to begin.</div>
  <div class="controls"><button class="play" id="playBtn">Play</button></div>
</div>
<script>
(function(){
  var toggleBtns = document.querySelectorAll('.toggle-btn');
  var mode = 'lipid';
  var playBtn = document.getElementById('playBtn');
  var timer = document.getElementById('timer');
  var hormoneDot = document.getElementById('hormoneDot');
  var receptor = document.getElementById('receptor');
  var nucleus = document.getElementById('nucleus');
  var label1 = document.getElementById('label1');
  var label2 = document.getElementById('label2');
  var timeouts = [];

  function clearTimeouts(){
    timeouts.forEach(function(t){ clearTimeout(t); });
    timeouts = [];
  }

  function reset(){
    clearTimeouts();
    hormoneDot.style.transition = 'none';
    hormoneDot.style.left = '10px';
    hormoneDot.style.top = '95px';
    hormoneDot.style.opacity = '1';
    receptor.style.opacity = '0';
    nucleus.style.opacity = '0';
    label1.style.opacity = '0'; label1.textContent = '';
    label2.style.opacity = '0'; label2.textContent = '';

    void hormoneDot.offsetWidth;
    hormoneDot.style.transition = 'all 0.8s ease';
  }

  function playLipid(){
    reset();
    timer.innerHTML = 'Hormone diffusing through the membrane...';
    timeouts.push(setTimeout(function(){
      hormoneDot.style.left = '260px';
      hormoneDot.style.top = '95px';
    }, 200));
    timeouts.push(setTimeout(function(){
      nucleus.style.opacity = '1';
      label1.style.left = '230px'; label1.style.top = '60px';
      label1.textContent = 'Intracellular receptor';
      label1.style.opacity = '1';
      timer.innerHTML = 'Binding intracellular receptor...';
    }, 1100));
    timeouts.push(setTimeout(function(){
      label2.style.left = '210px'; label2.style.top = '150px';
      label2.textContent = 'Hormone-receptor complex → DNA → transcription';
      label2.style.opacity = '1';
      timer.innerHTML = 'Altering gene transcription. <b>Onset: hours. Effect: sustained.</b>';
    }, 2000));
  }

  function playWater(){
    reset();
    timer.innerHTML = 'Hormone binding surface receptor...';
    timeouts.push(setTimeout(function(){
      hormoneDot.style.left = '190px';
      hormoneDot.style.top = '95px';
    }, 200));
    timeouts.push(setTimeout(function(){
      receptor.style.opacity = '1';
      label1.style.left = '230px'; label1.style.top = '60px';
      label1.textContent = 'Surface receptor + G-protein';
      label1.style.opacity = '1';
      timer.innerHTML = 'Activating second-messenger cascade...';
    }, 700));
    timeouts.push(setTimeout(function(){
      label2.style.left = '220px'; label2.style.top = '150px';
      label2.textContent = 'cAMP → protein kinase A → cell response';
      label2.style.opacity = '1';
      timer.innerHTML = 'Existing proteins modified directly. <b>Onset: seconds. Effect: brief.</b>';
    }, 1400));
  }

  toggleBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      toggleBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.dataset.mode;
      reset();
      timer.textContent = 'Press Play to begin.';
    });
  });

  playBtn.addEventListener('click', function(){
    if (mode === 'lipid') playLipid(); else playWater();
  });

  reset();
})();
</script>
</body>
</html>

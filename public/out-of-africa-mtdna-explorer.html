<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out-of-Africa Migration & mtDNA Diversity Explorer | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #plot-div { width: 100%; height: 340px; }
  #info {
    background: #f8fafc;
    border-radius: 14px;
    padding: 1rem 1.2rem;
    margin-top: 1rem;
    min-height: 70px;
    font-size: 0.88rem;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Out-of-Africa Migration &amp; mtDNA Diversity Explorer</h3>
  <div class="subtitle">Regions ordered by approximate migration distance from the African origin. Click a bar to see its approximate settlement date.</div>
  <div id="plot-div"></div>
  <div id="info">Click a bar on the chart to see details.</div>
</div>
<script>
(function(){
  var regions = [
    { name: 'Africa', distance: 0, diversity: 100, date: 'Origin — anatomically modern humans present by ~300,000 years ago.' },
    { name: 'Middle East', distance: 1, diversity: 78, date: 'Settled by ~70,000 years ago, the first step of dispersal out of Africa.' },
    { name: 'South Asia', distance: 2, diversity: 66, date: 'Settled by roughly 60,000–50,000 years ago.' },
    { name: 'Southeast Asia / Australia', distance: 3, diversity: 55, date: 'Settled by roughly 50,000–40,000 years ago, including an early sea crossing to Australia.' },
    { name: 'Europe', distance: 3, diversity: 52, date: 'Settled by roughly 45,000 years ago.' },
    { name: 'East Asia', distance: 4, diversity: 48, date: 'Settled by roughly 40,000–30,000 years ago.' },
    { name: 'Americas', distance: 5, diversity: 40, date: 'Settled last, by roughly 20,000–14,000 years ago via Beringia.' }
  ];

  var trace = {
    x: regions.map(function(r){ return r.name; }),
    y: regions.map(function(r){ return r.diversity; }),
    type: 'bar',
    marker: { color: regions.map(function(r){ return 'rgba(29,112,162,' + (0.4 + r.diversity/200) + ')'; }) },
    hovertemplate: '%{x}: %{y} (relative diversity)<extra></extra>'
  };
  var layout = {
    margin: { t: 10, r: 10, b: 70, l: 50 },
    xaxis: { tickangle: -30 },
    yaxis: { title: 'Relative mtDNA diversity', range: [0, 110] }
  };
  Plotly.newPlot('plot-div', [trace], layout, { responsive: true, displayModeBar: false }).then(function(gd){
    gd.on('plotly_click', function(data){
      var r = regions[data.points[0].pointIndex];
      document.getElementById('info').innerHTML = '<b>' + r.name + '</b> — relative mtDNA diversity: ' + r.diversity + '.<br>' + r.date;
    });
  });
})();
</script>
</body>
</html>

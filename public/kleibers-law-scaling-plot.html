<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kleiber's Law Scaling Plot | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .slider-row { display:flex; align-items:center; gap:10px; margin: 0.8rem 0; }
  .slider-row input[type=range] { flex:1; accent-color:#2d6a4f; }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; }
  .readout b { color:#2d6a4f; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Kleiber's Law Scaling Plot</h3>
  <div class="subtitle">Drag the slider to place a hypothetical new species by body mass (log scale) and read off its predicted basal metabolic rate from the 0.75-power-law regression line.</div>
  <div id="plot" style="width:100%; height:400px;"></div>
  <div class="slider-row">
    <span style="font-size:0.8rem; font-weight:600;">Hypothetical mass (kg, log scale):</span>
    <input type="range" id="massSlider" min="-2" max="4" value="0" step="0.05">
  </div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var knownSpecies = [
    {name:'Mouse', mass:0.02},
    {name:'Rat', mass:0.3},
    {name:'Rabbit', mass:2},
    {name:'Dog', mass:20},
    {name:'Human', mass:70},
    {name:'Horse', mass:500},
    {name:'Elephant', mass:5000}
  ];
  var k = 3.4; // proportionality constant so a 70kg human sits near ~90 (arbitrary relative units)
  function bmr(mass){ return k * Math.pow(mass, 0.75); }

  var plotDiv = document.getElementById('plot');
  var slider = document.getElementById('massSlider');
  var readout = document.getElementById('readout');

  function curvePoints(){
    var x=[], y=[];
    for (var lm=-2.2; lm<=3.8; lm+=0.05){
      var m = Math.pow(10, lm);
      x.push(m); y.push(bmr(m));
    }
    return {x:x, y:y};
  }

  function render(){
    var curve = curvePoints();
    var logMass = parseFloat(slider.value);
    var mass = Math.pow(10, logMass);
    var predictedBMR = bmr(mass);

    Plotly.react(plotDiv, [
      {x: curve.x, y: curve.y, name:'0.75-power-law regression', mode:'lines', line:{color:'#94a3b8', width:2, dash:'dash'}},
      {x: knownSpecies.map(function(s){return s.mass;}), y: knownSpecies.map(function(s){return bmr(s.mass);}),
        text: knownSpecies.map(function(s){return s.name;}), mode:'markers+text', textposition:'top center',
        name:'Known species', marker:{color:'#1a472a', size:8}, textfont:{size:9}},
      {x:[mass], y:[predictedBMR], name:'Your hypothetical species', mode:'markers', marker:{color:'#dc2626', size:14, symbol:'diamond'}}
    ], {
      xaxis: {title:'Body mass (kg, log scale)', type:'log', gridcolor:'#e9ecef'},
      yaxis: {title:'Relative basal metabolic rate', type:'log', gridcolor:'#e9ecef'},
      legend: {orientation:'h', y:-0.25},
      margin: {t:20, l:60, r:20, b:70},
      plot_bgcolor:'#ffffff', paper_bgcolor:'#ffffff'
    }, {responsive:true, displayModeBar:false});

    readout.innerHTML = 'Hypothetical mass = <b>' + mass.toFixed(mass<1?3:1) + ' kg</b> → predicted BMR ≈ <b>' + predictedBMR.toFixed(2) + '</b> relative units (BMR ∝ mass^0.75).';
  }

  slider.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>

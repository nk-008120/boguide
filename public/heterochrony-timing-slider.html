<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heterochrony Timing Slider | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #plot-div { width: 100%; height: 300px; }
  .row label { font-size: 0.85rem; font-weight: 600; display: flex; justify-content: space-between; }
  .row input[type=range] { width: 100%; }
  #verdict { margin-top: 1rem; font-size: 0.88rem; background: #f8fafc; border-radius: 12px; padding: 10px 14px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Heterochrony Timing Slider</h3>
  <div class="subtitle">Shift the developmental onset/offset earlier or later and see the predicted adult trait value at the (unchanged) ancestral adult age.</div>
  <div id="plot-div"></div>
  <div class="row">
    <label>Timing shift <span id="shiftVal">0 (ancestral timing)</span></label>
    <input type="range" id="shiftSlider" min="-40" max="40" step="2" value="0">
  </div>
  <div id="verdict"></div>
</div>
<script>
(function(){
  var ancestralAdultAge = 100;

  function traitCurve(age, shift){
    // logistic growth curve shifted by `shift` along the age axis
    var t = age - shift;
    return 100 / (1 + Math.exp(-(t-50)/12));
  }

  function ages(){
    var a = [];
    for (var x = 0; x <= 140; x += 2){ a.push(x); }
    return a;
  }

  function render(shift){
    var xs = ages();
    var ancestralY = xs.map(function(a){ return traitCurve(a, 0); });
    var shiftedY = xs.map(function(a){ return traitCurve(a, shift); });
    var ancestralAdultVal = traitCurve(ancestralAdultAge, 0);
    var shiftedAdultVal = traitCurve(ancestralAdultAge, shift);

    var traces = [
      { x: xs, y: ancestralY, mode: 'lines', line: { color: '#94a3b8', dash: 'dot', width: 2 }, name: 'Ancestral curve' },
      { x: xs, y: shiftedY, mode: 'lines', line: { color: '#2d6a4f', width: 2.5 }, name: 'Shifted (descendant) curve' },
      { x: [ancestralAdultAge], y: [shiftedAdultVal], mode: 'markers', marker: { size: 12, color: '#d9534f' }, name: 'Descendant value at ancestral adult age' }
    ];
    var layout = {
      margin: { t: 10, r: 10, b: 40, l: 50 },
      xaxis: { title: 'Age', range: [0, 140] },
      yaxis: { title: 'Trait value', range: [0, 105] },
      shapes: [{ type: 'line', x0: ancestralAdultAge, x1: ancestralAdultAge, y0: 0, y1: 105, line: { color: '#cbd5e1', dash: 'dash' } }],
      legend: { orientation: 'h', y: -0.25 }
    };
    Plotly.react('plot-div', traces, layout, { responsive: true, displayModeBar: false });

    var verdict = document.getElementById('verdict');
    if (shift === 0){
      verdict.innerHTML = 'No timing shift — descendant matches the ancestral adult value (' + ancestralAdultVal.toFixed(1) + ') at the ancestral adult age.';
    } else if (shift > 0){
      verdict.innerHTML = '<b>Peramorphosis:</b> development is shifted to run further/faster (shift = +' + shift + '), so at the ancestral adult age the descendant has <b>already exceeded</b> the ancestral adult value (' + shiftedAdultVal.toFixed(1) + ' vs. ' + ancestralAdultVal.toFixed(1) + ') — a more exaggerated adult trait.';
    } else {
      verdict.innerHTML = '<b>Paedomorphosis:</b> development is shifted to run later/slower (shift = ' + shift + '), so at the ancestral adult age the descendant is still <b>short of</b> the ancestral adult value (' + shiftedAdultVal.toFixed(1) + ' vs. ' + ancestralAdultVal.toFixed(1) + ') — a juvenile-like trait retained into the adult stage.';
    }
  }

  var slider = document.getElementById('shiftSlider');
  slider.addEventListener('input', function(){
    var shift = parseInt(slider.value, 10);
    document.getElementById('shiftVal').textContent = (shift === 0 ? '0 (ancestral timing)' : (shift > 0 ? '+' + shift : shift));
    render(shift);
  });

  render(0);
})();
</script>
</body>
</html>

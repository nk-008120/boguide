<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node/Internode/Bud Click-Through | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 620px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .layout { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .node-hit { cursor: pointer; }
  .node-hit:hover circle.stem-node { stroke: #2d6a4f; stroke-width: 3; }
  .node-hit.active circle.stem-node { stroke: #1a472a; stroke-width: 4; }
  .bud { opacity: 0; transition: opacity 0.2s; }
  .bud.show { opacity: 1; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    min-height: 5em;
    flex: 1;
    min-width: 220px;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Node, Internode &amp; Axillary Bud</h3>
  <div class="subtitle">Click a node (where a leaf attaches) to reveal its axillary bud.</div>
  <div class="layout">
    <svg id="stemSvg" viewBox="0 0 160 340" width="160" height="340">
      <rect x="70" y="10" width="20" height="320" fill="#a7d3a0" stroke="#5a7d4f" stroke-width="1"/>
      <text x="80" y="330" text-anchor="middle" font-size="10" fill="#334155" font-weight="600">Stem</text>

      <g class="node-hit" data-node="1">
        <line x1="90" y1="80" x2="140" y2="60" stroke="#4c8c3f" stroke-width="6" stroke-linecap="round"/>
        <circle class="stem-node" cx="80" cy="80" r="9" fill="#f6d375" stroke="#c99a1f" stroke-width="1.5"/>
        <ellipse class="bud" id="bud1" cx="90" cy="90" rx="6" ry="9" fill="#8fbf8a" stroke="#2d6a4f" stroke-width="1"/>
      </g>
      <text x="115" y="120" text-anchor="middle" font-size="9" fill="#64748b">Internode</text>

      <g class="node-hit" data-node="2">
        <line x1="70" y1="180" x2="20" y2="160" stroke="#4c8c3f" stroke-width="6" stroke-linecap="round"/>
        <circle class="stem-node" cx="80" cy="180" r="9" fill="#f6d375" stroke="#c99a1f" stroke-width="1.5"/>
        <ellipse class="bud" id="bud2" cx="70" cy="190" rx="6" ry="9" fill="#8fbf8a" stroke="#2d6a4f" stroke-width="1"/>
      </g>
      <text x="45" y="220" text-anchor="middle" font-size="9" fill="#64748b">Internode</text>

      <g class="node-hit" data-node="3">
        <line x1="90" y1="280" x2="140" y2="260" stroke="#4c8c3f" stroke-width="6" stroke-linecap="round"/>
        <circle class="stem-node" cx="80" cy="280" r="9" fill="#f6d375" stroke="#c99a1f" stroke-width="1.5"/>
        <ellipse class="bud" id="bud3" cx="90" cy="290" rx="6" ry="9" fill="#8fbf8a" stroke="#2d6a4f" stroke-width="1"/>
      </g>
    </svg>
    <div class="note" id="note">Click a yellow node to reveal the axillary bud sitting in that leaf's axil.</div>
  </div>
</div>
<script>
(function(){
  var note = document.getElementById('note');
  var nodeGroups = document.querySelectorAll('.node-hit');
  nodeGroups.forEach(function(g){
    g.addEventListener('click', function(){
      nodeGroups.forEach(function(o){
        o.classList.remove('active');
        var bud = o.querySelector('.bud');
        if (bud) bud.classList.remove('show');
      });
      g.classList.add('active');
      var bud = g.querySelector('.bud');
      if (bud) bud.classList.add('show');
      note.innerHTML = '<b>Node ' + g.getAttribute('data-node') + '</b>: a leaf attaches here, and in the angle between the leaf and the stem (the leaf axil) sits an <b>axillary bud</b> — a small dormant shoot apical meristem. Because it forms at the shoot apical meristem itself, at the stem\'s surface, any lateral branch it produces has an <b>exogenous</b> origin — the direct opposite of a root\'s pericycle-derived, endogenous lateral roots.';
    });
  });
})();
</script>
</body>
</html>

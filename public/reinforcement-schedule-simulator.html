<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinforcement Schedule Response-Rate Simulator | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .btn-toggle {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .btn-toggle.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
  .btn {
    background: #d9534f;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn.off { background: #94a3b8; }
  #plot { width: 100%; height: 340px; }
  .note { font-size: 0.82rem; color: #4b5563; margin-top: 8px; min-height: 2.2em; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Reinforcement Schedule Response-Rate Simulator</h3>
  <div class="subtitle">Compare cumulative response patterns across schedules, then stop reinforcement to see how quickly each one extinguishes.</div>
  <div class="row" id="scheduleRow"></div>
  <button class="btn off" id="extinctionBtn">Stop reinforcement at minute 10</button>
  <div id="plot"></div>
  <div class="note" id="note"></div>
</div>
<script>
(function(){
  var schedules = [
    { id: 'CRF', label: 'Continuous (CRF)' },
    { id: 'FR', label: 'Fixed-Ratio' },
    { id: 'VR', label: 'Variable-Ratio' },
    { id: 'FI', label: 'Fixed-Interval' },
    { id: 'VI', label: 'Variable-Interval' }
  ];
  var current = 'CRF';
  var extinctionOn = false;
  var row = document.getElementById('scheduleRow');
  var note = document.getElementById('note');

  schedules.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'btn-toggle' + (s.id === current ? ' active' : '');
    b.textContent = s.label;
    b.dataset.id = s.id;
    b.addEventListener('click', function(){
      current = s.id;
      Array.prototype.forEach.call(row.children, function(c){
        c.classList.toggle('active', c.dataset.id === current);
      });
      render();
    });
    row.appendChild(b);
  });

  document.getElementById('extinctionBtn').addEventListener('click', function(e){
    extinctionOn = !extinctionOn;
    e.target.textContent = extinctionOn ? 'Reinforcement stopped at minute 10 (click to resume)' : 'Stop reinforcement at minute 10';
    e.target.classList.toggle('off', !extinctionOn);
    render();
  });

  function slopeFor(id, t, minutesSinceExtStart){
    switch(id){
      case 'CRF': return 8;
      case 'FR':
        var phase = t % 3;
        return phase < 0.4 ? 0.5 : 9;
      case 'VR': return 10;
      case 'FI':
        var within = t % 4;
        return 2 + (within / 4) * 10;
      case 'VI': return 5;
    }
    return 5;
  }

  function extinctionDecay(id, minutesSinceExt){
    var halfLife = { CRF: 1.2, FR: 2.5, VR: 6, FI: 3, VI: 4 }[id];
    return Math.exp(-minutesSinceExt / halfLife);
  }

  function buildSeries(){
    var xs = [], ys = [];
    var cum = 0;
    var dt = 0.1;
    for (var t = 0; t <= 20; t += dt){
      var slope;
      if (extinctionOn && t > 10){
        var decay = extinctionDecay(current, t - 10);
        slope = slopeFor(current, t, t - 10) * decay;
      } else {
        slope = slopeFor(current, t, 0);
      }
      cum += slope * dt;
      xs.push(Number(t.toFixed(1)));
      ys.push(Number(cum.toFixed(2)));
    }
    return { xs: xs, ys: ys };
  }

  var notes = {
    CRF: 'Every response reinforced — fast initial learning, but the fastest extinction once reinforcement stops.',
    FR: 'Reinforced after a fixed number of responses — produces a "post-reinforcement pause" then a rapid burst, giving the stair-step pattern.',
    VR: 'Reinforced after an unpredictable number of responses — the highest, steadiest response rate, and the most resistant to extinction (the slot-machine effect).',
    FI: 'Reinforced for the first response after a fixed time — produces a "scalloped" pattern: slow right after reinforcement, speeding up as the end of the interval approaches.',
    VI: 'Reinforced for the first response after an unpredictable time — a slower but very steady response rate.'
  };

  function render(){
    var data = buildSeries();
    Plotly.react('plot', [{
      x: data.xs,
      y: data.ys,
      mode: 'lines',
      line: { color: '#1d70a2', width: 2.5 },
      name: current
    }], {
      margin: { t: 10, r: 15, l: 45, b: 40 },
      xaxis: { title: 'Time (minutes)' },
      yaxis: { title: 'Cumulative responses' },
      shapes: extinctionOn ? [{
        type: 'line', x0: 10, x1: 10, y0: 0, y1: 1, yref: 'paper',
        line: { color: '#d9534f', dash: 'dot', width: 1.5 }
      }] : [],
      font: { family: 'Inter, system-ui, sans-serif', size: 11 }
    }, { displayModeBar: false, responsive: true });
    note.textContent = notes[current] + (extinctionOn ? ' Dotted line marks when reinforcement stopped — watch how quickly the curve flattens after it.' : '');
  }

  render();
})();
</script>
</body>
</html>

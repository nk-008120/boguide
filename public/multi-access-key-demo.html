<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Access Key Demo | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .char-group { margin-bottom: 10px; }
  .char-group .glabel { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; margin-bottom: 5px; }
  .filter-chip {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    font-size: 0.78rem;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    margin: 0 6px 6px 0;
  }
  .filter-chip.active { background: #1d70a2; border-color: #1d70a2; color: #fff; }
  #candidateList { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .candidate {
    background: #eef6ee;
    border: 1px solid #86efac;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #166534;
  }
  #countLine { font-size: 0.82rem; color: #4b5563; margin-top: 10px; }
  #clearBtn {
    display: block;
    margin: 1rem auto 0;
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Multi-Access Key Demo</h3>
  <div class="subtitle">Toggle any characters you can observe, in any order. The candidate list filters live — leave a character untoggled if you can't observe it.</div>
  <div id="filters"></div>
  <div id="countLine"></div>
  <div id="candidateList"></div>
  <button id="clearBtn">Clear filters</button>
</div>
<script>
(function(){
  var organisms = [
    { name: 'Beetle', legs: '6', wings: 'present', body: '3' },
    { name: 'Ant', legs: '6', wings: 'absent', body: '3' },
    { name: 'Dragonfly', legs: '6', wings: 'present', body: '3' },
    { name: 'Spider', legs: '8', wings: 'absent', body: '2' },
    { name: 'Tick', legs: '8', wings: 'absent', body: '2' },
    { name: 'Woodlouse', legs: '14', wings: 'absent', body: 'many' },
    { name: 'Centipede', legs: 'many', wings: 'absent', body: 'many' },
    { name: 'Millipede', legs: 'many', wings: 'absent', body: 'many' }
  ];
  var characterDefs = [
    { id: 'legs', label: 'Leg count', values: ['6', '8', '14', 'many'] },
    { id: 'wings', label: 'Wings', values: ['present', 'absent'] },
    { id: 'body', label: 'Body regions', values: ['2', '3', 'many'] }
  ];

  var activeFilters = {}; // charId -> value

  var filtersHost = document.getElementById('filters');
  characterDefs.forEach(function(def){
    var group = document.createElement('div');
    group.className = 'char-group';
    var label = document.createElement('div');
    label.className = 'glabel';
    label.textContent = def.label;
    group.appendChild(label);
    def.values.forEach(function(val){
      var chip = document.createElement('span');
      chip.className = 'filter-chip';
      chip.textContent = def.label + ': ' + val;
      chip.dataset.char = def.id;
      chip.dataset.val = val;
      chip.addEventListener('click', function(){
        if (activeFilters[def.id] === val){
          delete activeFilters[def.id];
          chip.classList.remove('active');
        } else {
          Array.prototype.forEach.call(group.querySelectorAll('.filter-chip'), function(c){ c.classList.remove('active'); });
          activeFilters[def.id] = val;
          chip.classList.add('active');
        }
        update();
      });
      group.appendChild(chip);
    });
    filtersHost.appendChild(group);
  });

  function update(){
    var matches = organisms.filter(function(o){
      return Object.keys(activeFilters).every(function(charId){
        return o[charId] === activeFilters[charId];
      });
    });
    document.getElementById('countLine').textContent = matches.length + ' of ' + organisms.length + ' candidates match' +
      (Object.keys(activeFilters).length === 0 ? ' (no filters active).' : '.');
    var list = document.getElementById('candidateList');
    list.innerHTML = '';
    matches.forEach(function(o){
      var el = document.createElement('div');
      el.className = 'candidate';
      el.textContent = o.name;
      list.appendChild(el);
    });
  }

  document.getElementById('clearBtn').addEventListener('click', function(){
    activeFilters = {};
    Array.prototype.forEach.call(filtersHost.querySelectorAll('.filter-chip'), function(c){ c.classList.remove('active'); });
    update();
  });

  update();
})();
</script>
</body>
</html>

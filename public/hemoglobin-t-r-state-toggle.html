<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemoglobin T-State/R-State Toggle | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 620px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #toggleBtn { display: block; margin: 0 auto 10px; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 10px 24px; font-size: 0.85rem; cursor: pointer; }
  #toggleBtn:hover { background: #1a472a; }
  #hbSvg { width: 100%; height: 200px; background: #f8fafc; border-radius: 14px; transition: 0.4s; }
  #stateLabel { text-align: center; margin-top: 10px; font-size: 0.95rem; font-weight: 700; }
  #stateDesc { text-align: center; margin-top: 6px; font-size: 0.82rem; color: #4b5563; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Hemoglobin T-State &harr; R-State</h3>
  <div class="subtitle">Click to trigger the conformational shift and watch the salt bridges break and reform.</div>
  <button id="toggleBtn">Bind O2 (trigger T -&gt; R shift)</button>
  <svg id="hbSvg" viewBox="0 0 300 200"></svg>
  <div id="stateLabel"></div>
  <div id="stateDesc"></div>
</div>
<script>
(function(){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('hbSvg');
  var isR = false;

  var subunitPositionsT = [[90,70],[210,70],[90,130],[210,130]];
  var subunitPositionsR = [[100,80],[200,80],[100,120],[200,120]];
  var saltBridges = [[0,2],[1,3],[0,1]];

  function render(){
    svg.innerHTML = '';
    var pos = isR ? subunitPositionsR : subunitPositionsT;
    if (!isR){
      saltBridges.forEach(function(pair){
        var a = pos[pair[0]], b = pos[pair[1]];
        var l = document.createElementNS(ns,'line');
        l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);
        l.setAttribute('stroke','#d9534f');l.setAttribute('stroke-width','2');l.setAttribute('stroke-dasharray','4 3');
        svg.appendChild(l);
      });
    }
    pos.forEach(function(p, i){
      var c = document.createElementNS(ns,'circle');
      c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',26);
      c.setAttribute('fill', isR ? '#fca5a5' : '#93c5fd');
      c.setAttribute('stroke', isR ? '#dc2626' : '#1d70a2'); c.setAttribute('stroke-width','2');
      svg.appendChild(c);
      if (isR){
        var o2 = document.createElementNS(ns,'circle');
        o2.setAttribute('cx',p[0]);o2.setAttribute('cy',p[1]-30);o2.setAttribute('r',5);o2.setAttribute('fill','#166534');
        svg.appendChild(o2);
      }
    });
  }

  document.getElementById('toggleBtn').addEventListener('click', function(){
    isR = !isR;
    render();
    var label = document.getElementById('stateLabel');
    var desc = document.getElementById('stateDesc');
    if (isR){
      label.textContent = 'R (relaxed) state — high O2 affinity';
      desc.textContent = 'O2 binding pulls heme iron into the porphyrin plane, breaking the 8 inter-subunit salt bridges and propagating the conformational shift cooperatively to all four subunits.';
      this.textContent = 'Release O2 (trigger R -> T shift)';
    } else {
      label.textContent = 'T (tense) state — low O2 affinity';
      desc.textContent = 'Deoxy-Hb is held in this state by salt bridges (dashed red lines) between subunits, keeping O2 affinity low.';
      this.textContent = 'Bind O2 (trigger T -> R shift)';
    }
  });

  render();
  document.getElementById('stateLabel').textContent = 'T (tense) state — low O2 affinity';
  document.getElementById('stateDesc').textContent = 'Deoxy-Hb is held in this state by salt bridges (dashed red lines) between subunits, keeping O2 affinity low.';
})();
</script>
</body>
</html>

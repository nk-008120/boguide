<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Damage-to-Pathway Matcher | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #lesion { font-weight: 700; padding: 10px; background: #f1f5f9; border-radius: 10px; margin-bottom: 10px; font-size: 0.88rem; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .choice { flex: 1; min-width: 110px; padding: 8px; text-align: center; border-radius: 10px; border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; font-size: 0.78rem; font-weight: 700; }
  .choice.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
  .choice.wrong { background: #fee2e2; border-color: #f87171; color: #991b1b; }
  #anim { min-height: 60px; background: #f8fafc; border-radius: 10px; padding: 10px; font-size: 0.82rem; color: #4b5563; }
  #nextBtn { margin-top: 10px; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 8px 18px; font-size: 0.82rem; cursor: pointer; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Which Repair Pathway Fixes This?</h3>
  <div class="subtitle">Read the lesion description, choose the correct pathway, then watch its mechanism summarised.</div>
  <div id="lesion"></div>
  <div class="choices" id="choices"></div>
  <div id="anim">Select an answer to see the mechanism.</div>
  <button id="nextBtn">Next lesion &rarr;</button>
</div>
<script>
(function(){
  var options = ['MMR', 'BER', 'NER', 'NHEJ/HR'];
  var lesions = [
    { text: 'A replication error slips past proofreading, leaving a mispaired but otherwise normal-looking base pair.', correct: 'MMR',
      anim: 'Mismatch repair scans new DNA, distinguishes new (unmethylated) strand from template, and corrects the mispair.' },
    { text: 'A cytosine has spontaneously deaminated to uracil — a small, single-base chemical change.', correct: 'BER',
      anim: 'Base excision repair: a glycosylase excises the damaged base, APE1 cuts the abasic site, polymerase fills the gap, ligase seals it.' },
    { text: 'UV light has fused two adjacent thymines into a bulky, helix-distorting dimer.', correct: 'NER',
      anim: 'Nucleotide excision repair: the distortion is recognised, a whole surrounding segment is excised, and the gap is filled using the intact strand as template.' },
    { text: 'Both strands of the double helix are severed at the same location.', correct: 'NHEJ/HR',
      anim: 'Double-strand break: NHEJ directly ligates the ends (fast, error-prone, any cell-cycle phase); HR uses the sister chromatid for high-fidelity repair (S/G2 only).' }
  ];
  var idx = 0;
  var lesionEl = document.getElementById('lesion');
  var choicesEl = document.getElementById('choices');
  var anim = document.getElementById('anim');

  function render(){
    var l = lesions[idx];
    lesionEl.textContent = 'Lesion: ' + l.text;
    anim.textContent = 'Select an answer to see the mechanism.';
    choicesEl.innerHTML = '';
    options.forEach(function(opt){
      var btn = document.createElement('div');
      btn.className = 'choice';
      btn.textContent = opt;
      btn.addEventListener('click', function(){
        if (choicesEl.querySelector('.correct, .wrong')) return;
        if (opt === l.correct){
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
          Array.prototype.forEach.call(choicesEl.children, function(c){ if (c.textContent === l.correct) c.classList.add('correct'); });
        }
        anim.textContent = l.anim;
      });
      choicesEl.appendChild(btn);
    });
  }

  document.getElementById('nextBtn').addEventListener('click', function(){ idx = (idx+1) % lesions.length; render(); });
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homology vs. Analogy Structure Sorter | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #tray {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 1.2rem;
    min-height: 46px;
  }
  .chip {
    background: #eaf2f8;
    border: 2px solid #1d70a2;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #1d3557;
    cursor: grab;
    user-select: none;
  }
  .chip.dragging { opacity: 0.4; }
  .bins { display: flex; gap: 1rem; }
  .bin {
    flex: 1;
    min-height: 180px;
    border-radius: 16px;
    border: 3px dashed #cbd5e1;
    padding: 12px;
    background: #f8fafc;
    transition: background 0.15s, border-color 0.15s;
  }
  .bin.over { background: #eef6ee; border-color: #2d6a4f; }
  .bin h4 { margin: 0 0 8px 0; text-align: center; color: #334155; font-size: 0.95rem; }
  .bin .placed {
    display: block;
    margin-bottom: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .placed.correct { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .placed.wrong { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .explain { font-weight: 400; font-size: 0.8rem; margin-top: 4px; display: block; }
  #score { text-align: center; font-size: 0.9rem; color: #4b5563; margin-top: 1rem; }
  #resetBtn {
    display: block;
    margin: 1rem auto 0;
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Homology vs. Analogy Structure Sorter</h3>
  <div class="subtitle">Drag each structure pair into the bin it belongs in. Homology = shared ancestry; analogy = convergent evolution under similar selective pressure.</div>
  <div id="tray"></div>
  <div class="bins">
    <div class="bin" id="bin-homologous" data-answer="homologous"><h4>Homologous</h4></div>
    <div class="bin" id="bin-analogous" data-answer="analogous"><h4>Analogous</h4></div>
  </div>
  <div id="score">0 of 6 sorted</div>
  <button id="resetBtn">Reset</button>
</div>
<script>
(function(){
  var items = [
    { id: 'i1', label: 'Human arm & bat wing', answer: 'homologous', explain: 'Same pentadactyl bone pattern (humerus, radius/ulna, digits) inherited from a shared tetrapod ancestor.' },
    { id: 'i2', label: 'Insect wing & bird wing', answer: 'analogous', explain: 'Independent origins (cuticular outgrowth vs. modified forelimb) converging on flight function.' },
    { id: 'i3', label: 'Whale flipper & cat leg', answer: 'homologous', explain: 'Both retain the same underlying tetrapod forelimb skeleton despite very different uses.' },
    { id: 'i4', label: 'Shark fin & dolphin fin', answer: 'analogous', explain: 'Superficially similar swimming shape, but a shark fin has no tetrapod-limb skeleton at all — convergence, not shared ancestry.' },
    { id: 'i5', label: 'Butterfly wing & bird wing', answer: 'analogous', explain: 'Both fly, but a butterfly wing is a scaled cuticular membrane, structurally unrelated to a feathered forelimb.' },
    { id: 'i6', label: 'Human arm & whale flipper', answer: 'homologous', explain: 'Grasping vs. swimming, yet the same bone arrangement persists — evidence of common descent.' }
  ];
  var tray = document.getElementById('tray');
  var bins = [document.getElementById('bin-homologous'), document.getElementById('bin-analogous')];
  var scoreEl = document.getElementById('score');
  var placedCount = 0;
  var dragged = null;

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function makeChip(item){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.label;
    chip.draggable = true;
    chip.dataset.id = item.id;
    chip.addEventListener('dragstart', function(e){
      dragged = item;
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', function(){ chip.classList.remove('dragging'); });
    return chip;
  }

  function reset(){
    tray.innerHTML = '';
    bins.forEach(function(b){
      b.querySelectorAll('.placed').forEach(function(p){ p.remove(); });
    });
    placedCount = 0;
    scoreEl.textContent = '0 of ' + items.length + ' sorted';
    shuffle(items.slice()).forEach(function(item){ tray.appendChild(makeChip(item)); });
  }

  bins.forEach(function(bin){
    bin.addEventListener('dragover', function(e){
      e.preventDefault();
      bin.classList.add('over');
    });
    bin.addEventListener('dragleave', function(){ bin.classList.remove('over'); });
    bin.addEventListener('drop', function(e){
      e.preventDefault();
      bin.classList.remove('over');
      if (!dragged) return;
      var correct = dragged.answer === bin.dataset.answer;
      var entry = document.createElement('div');
      var item = dragged;
      entry.className = 'placed ' + (correct ? 'correct' : 'wrong');
      entry.innerHTML = item.label + (correct ? ' ✓' : ' ✗ (try again elsewhere)') + '<span class="explain">' + item.explain + '</span>';
      bin.appendChild(entry);
      var chipEl = tray.querySelector('[data-id="' + item.id + '"]');
      if (chipEl) chipEl.remove();
      if (correct){
        placedCount++;
        scoreEl.textContent = placedCount + ' of ' + items.length + ' sorted';
      } else {
        setTimeout(function(){
          tray.appendChild(makeChip(item));
          entry.remove();
        }, 1600);
      }
      dragged = null;
    });
  });

  document.getElementById('resetBtn').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>

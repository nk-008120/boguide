<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haplodiploidy Relatedness Pedigree | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .node { cursor: pointer; }
  .node circle { stroke-width: 2.5; transition: stroke 0.15s, fill 0.15s; }
  .node.selected circle { stroke: #2d6a4f; fill: #dcfce7; }
  .node text { font-size: 10px; font-weight: 600; fill: #334155; pointer-events: none; }
  .readout {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 14px;
    font-size: 0.9rem;
    min-height: 3.2em;
  }
  .readout b { color: #1d70a2; }
  .btn {
    background: #94a3b8;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Haplodiploidy Relatedness Pedigree</h3>
  <div class="subtitle">Click any two individuals to see their computed relatedness coefficient and why.</div>
  <svg id="pedigreeSvg" viewBox="0 0 400 260" width="100%" height="260">
    <line x1="120" y1="60" x2="280" y2="60" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="200" y1="60" x2="200" y2="110" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="110" x2="320" y2="110" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="110" x2="80" y2="170" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="200" y1="110" x2="200" y2="170" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="320" y1="110" x2="320" y2="170" stroke="#cbd5e1" stroke-width="2"/>

    <g class="node" data-id="queen" transform="translate(120,60)">
      <circle r="22" fill="#fde68a" stroke="#92400e"/>
      <text text-anchor="middle" y="4">Queen</text>
    </g>
    <g class="node" data-id="drone-father" transform="translate(280,60)">
      <circle r="22" fill="#bfdbfe" stroke="#1d4ed8"/>
      <text text-anchor="middle" y="-2">Drone</text>
      <text text-anchor="middle" y="9">(father)</text>
    </g>
    <g class="node" data-id="daughterA" transform="translate(80,170)">
      <circle r="20" fill="#f1f5f9" stroke="#334155"/>
      <text text-anchor="middle" y="4">Daughter A</text>
    </g>
    <g class="node" data-id="daughterB" transform="translate(200,170)">
      <circle r="20" fill="#f1f5f9" stroke="#334155"/>
      <text text-anchor="middle" y="4">Daughter B</text>
    </g>
    <g class="node" data-id="son" transform="translate(320,170)">
      <circle r="20" fill="#bfdbfe" stroke="#1d4ed8"/>
      <text text-anchor="middle" y="4">Son</text>
    </g>
  </svg>
  <div class="readout" id="readout">Click the Queen, then Daughter A, to see their relatedness.</div>
  <button class="btn" id="clearBtn">Clear selection</button>
</div>
<script>
(function(){
  var pairs = {
    'queen|daughterA': { r: 0.5, reason: 'Standard diploid mother-daughter relatedness: the daughter inherits exactly half her genome from the queen.' },
    'queen|daughterB': { r: 0.5, reason: 'Standard diploid mother-daughter relatedness: the daughter inherits exactly half her genome from the queen.' },
    'queen|son': { r: 0.5, reason: 'The haploid son develops from an unfertilized egg, so his entire genome is one random half of the queen\'s diploid genome — the same 0.5 relatedness as any mother-offspring pair.' },
    'drone-father|daughterA': { r: 1.0, reason: 'Because the father is haploid, every one of his sperm carries his entire genome unchanged — every daughter gets 100% of his genes, giving a relatedness of 1.0 (not the usual 0.5).' },
    'drone-father|daughterB': { r: 1.0, reason: 'Because the father is haploid, every one of his sperm carries his entire genome unchanged — every daughter gets 100% of his genes, giving a relatedness of 1.0 (not the usual 0.5).' },
    'drone-father|son': { r: 0, reason: 'Sons develop only from the queen\'s unfertilized eggs — they have no father at all, so father-son relatedness is undefined/zero here.' },
    'daughterA|daughterB': { r: 0.75, reason: 'Full sisters share 100% of their paternal genes (identical haploid genome from the father) plus, on average, 50% of their maternal genes — (1.0 + 0.5) / 2 = 0.75, higher than the standard diploid sibling value of 0.5.' },
    'daughterA|son': { r: 0.25, reason: 'A daughter and her brother share no paternal genes (the son has no father contribution to compare) and only the usual 50% chance of sharing a given maternal allele — averaging to 0.25, lower than the sister-sister value.' },
    'daughterB|son': { r: 0.25, reason: 'A daughter and her brother share no paternal genes (the son has no father contribution to compare) and only the usual 50% chance of sharing a given maternal allele — averaging to 0.25, lower than the sister-sister value.' },
    'queen|drone-father': { r: null, reason: 'These are mates, not blood relatives within this pedigree — relatedness isn\'t the relevant measure for this pair.' }
  };

  var selected = [];
  var readout = document.getElementById('readout');
  var nodes = document.querySelectorAll('.node');

  function keyFor(a, b){
    var direct = a + '|' + b;
    var reverse = b + '|' + a;
    if (pairs[direct]) { return direct; }
    if (pairs[reverse]) { return reverse; }
    return null;
  }

  function labelFor(id){
    var map = { queen: 'Queen', 'drone-father': 'Drone (father)', daughterA: 'Daughter A', daughterB: 'Daughter B', son: 'Son' };
    return map[id] || id;
  }

  function handleClick(node){
    var id = node.dataset.id;
    if (selected.length === 2){
      selected.forEach(function(n){ n.classList.remove('selected'); });
      selected = [];
    }
    if (selected.indexOf(node) !== -1) { return; }
    node.classList.add('selected');
    selected.push(node);

    if (selected.length === 1){
      readout.innerHTML = 'Selected <b>' + labelFor(id) + '</b> — now click a second individual.';
    } else if (selected.length === 2){
      var idA = selected[0].dataset.id, idB = selected[1].dataset.id;
      var key = keyFor(idA, idB);
      var info = key ? pairs[key] : null;
      if (!info || info.r === null){
        readout.innerHTML = '<b>' + labelFor(idA) + '</b> and <b>' + labelFor(idB) + '</b>: ' + (info ? info.reason : 'No defined relatedness for this pair.');
      } else {
        readout.innerHTML = '<b>' + labelFor(idA) + '</b> and <b>' + labelFor(idB) + '</b>: relatedness r = <b>' + info.r + '</b>. ' + info.reason;
      }
    }
  }

  nodes.forEach(function(node){
    node.addEventListener('click', function(){ handleClick(node); });
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    selected.forEach(function(n){ n.classList.remove('selected'); });
    selected = [];
    readout.textContent = 'Click the Queen, then Daughter A, to see their relatedness.';
  });
})();
</script>
</body>
</html>

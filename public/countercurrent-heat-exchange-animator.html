<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countercurrent Heat Exchange Animator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle-row { display:flex; gap:8px; margin-bottom: 1rem; }
  .toggle-btn {
    flex: 1; padding: 8px 6px; border-radius: 999px; border: 2px solid #cbd5e1;
    background: #f8fafc; font-size: 0.8rem; font-weight: 600; cursor: pointer; color:#475569;
  }
  .toggle-btn.active { background:#1d70a2; border-color:#1d70a2; color:#fff; }
  .controls { display:flex; gap:10px; align-items:center; margin-top:0.8rem; }
  button.step { background:#2d6a4f; color:#fff; border:none; border-radius:999px; padding:8px 18px; font-size:0.85rem; font-weight:600; cursor:pointer; }
  button.secondary { background:#f1f5f9; color:#334155; border:none; border-radius:999px; padding:8px 18px; font-size:0.85rem; font-weight:600; cursor:pointer; }
  .readout { margin-top:0.8rem; background:#eef2e6; border-radius:12px; padding:10px 14px; font-size:0.85rem; }
  svg text { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Countercurrent Heat Exchange Animator</h3>
  <div class="subtitle">Compare a limb with countercurrent heat exchange (artery and vein running side by side) against a control limb without it. Click "Step" to watch heat diffuse from artery to vein along the limb.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" data-mode="counter">With countercurrent exchange</button>
    <button class="toggle-btn" data-mode="none">No countercurrent exchange (control)</button>
  </div>
  <svg id="svgArea" viewBox="0 0 480 240" width="100%"></svg>
  <div class="controls">
    <button class="step" id="stepBtn">Step</button>
    <button class="secondary" id="resetBtn">Reset</button>
  </div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById('svgArea');
  var toggleBtns = document.querySelectorAll('.toggle-btn');
  var mode = 'counter';
  var step = 0;
  var maxStep = 5;
  var segments = 6;

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function tempColor(temp){
    var r = Math.round(255*temp + 200*(1-temp));
    var g = Math.round(100*(1-Math.abs(temp-0.5)*2));
    var b = Math.round(255*(1-temp) + 100*temp);
    return 'rgb(' + Math.min(255,r) + ',' + Math.min(255,g) + ',' + Math.min(255,b) + ')';
  }

  function computeTemps(){
    var arteryTemp = [], veinTemp = [];
    for (var i=0;i<segments;i++){ arteryTemp.push(1.0); veinTemp.push(0.0); }
    if (mode === 'counter'){
      var exchangeAmount = Math.min(1, step/maxStep) * 0.75;
      for (var j=0;j<segments;j++){
        var a0 = 1.0 - (j/(segments-1))*0.15;
        var v0 = 0.0 + (j/(segments-1))*0.15;
        arteryTemp[j] = a0 - exchangeAmount*(a0 - v0)*0.9;
        veinTemp[j] = v0 + exchangeAmount*(a0 - v0)*0.9;
      }
    } else {
      for (var k=0;k<segments;k++){
        arteryTemp[k] = 1.0;
        veinTemp[k] = 0.0;
      }
    }
    return {artery: arteryTemp, vein: veinTemp};
  }

  function render(){
    svg.innerHTML = '';
    var temps = computeTemps();
    var segW = 60, startX = 40, arteryY = 80, veinY = 140;

    svg.appendChild(el('text', {x:20, y:40, 'font-size':12, 'font-weight':700, fill:'#334155'})).textContent = 'Core';
    svg.appendChild(el('text', {x:400, y:40, 'font-size':12, 'font-weight':700, fill:'#334155'})).textContent = 'Extremity';

    for (var i=0;i<segments;i++){
      var x = startX + i*segW;
      svg.appendChild(el('rect', {x:x, y:arteryY, width:segW-4, height:24, fill: tempColor(temps.artery[i]), stroke:'#94a3b8'}));
      svg.appendChild(el('rect', {x:x, y:veinY, width:segW-4, height:24, fill: tempColor(temps.vein[i]), stroke:'#94a3b8'}));
    }
    svg.appendChild(el('text', {x:20, y:arteryY+16, 'font-size':11, fill:'#334155', 'text-anchor':'end'})).textContent = 'Artery';
    svg.appendChild(el('text', {x:20, y:veinY+16, 'font-size':11, fill:'#334155', 'text-anchor':'end'})).textContent = 'Vein';

    var heatLost = mode === 'counter'
      ? Math.round((1 - temps.artery[segments-1]) * 100) + '% of core heat retained by exchange before reaching the extremity'
      : 'Full core temperature reaches the extremity — maximal heat loss there';
    var lossLabel = el('text', {x:240, y:200, 'font-size':11.5, fill:'#1a472a', 'text-anchor':'middle', 'font-weight':600});
    lossLabel.textContent = heatLost;
    svg.appendChild(lossLabel);

    var title = el('text', {x:240, y:20, 'font-size':13, 'font-weight':700, fill:'#1a472a', 'text-anchor':'middle'});
    title.textContent = (mode === 'counter' ? 'With countercurrent exchange' : 'No countercurrent exchange (control)') + ' — step ' + step + ' of ' + maxStep;
    svg.appendChild(title);

    document.getElementById('readout').innerHTML = mode === 'counter'
      ? 'Heat progressively transfers from the warm artery to the adjacent cool vein along the limb, so the extremity receives much cooler blood and the returning venous blood is pre-warmed before reaching the core.'
      : 'Without countercurrent exchange, warm arterial blood reaches the extremity undiminished and loses its heat directly to the environment there.';
  }

  toggleBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      toggleBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.dataset.mode;
      step = 0;
      render();
    });
  });

  document.getElementById('stepBtn').addEventListener('click', function(){
    if (step < maxStep) step++;
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    step = 0;
    render();
  });

  render();
})();
</script>
</body>
</html>

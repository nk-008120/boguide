<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop of Henle Length Comparator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 620px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .slider-row { display:flex; align-items:center; gap:10px; margin: 0.8rem 0; }
  .slider-row input[type=range] { flex:1; accent-color:#2d6a4f; }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; }
  .readout b { color:#2d6a4f; }
  svg text { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Loop of Henle Length Comparator</h3>
  <div class="subtitle">Drag the slider to adjust the loop of Henle's relative length, from a short-loop generic mammal to a kangaroo-rat-like elongated loop, and see how maximum urine concentration changes.</div>
  <svg id="svgArea" viewBox="0 0 400 220" width="100%"></svg>
  <div class="slider-row">
    <span style="font-size:0.8rem; font-weight:600;">Short loop</span>
    <input type="range" id="lenSlider" min="0" max="100" value="20">
    <span style="font-size:0.8rem; font-weight:600;">Kangaroo-rat-length loop</span>
  </div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById('svgArea');
  var slider = document.getElementById('lenSlider');
  var readout = document.getElementById('readout');

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function maxConcentration(pct){
    return Math.round(300 + pct/100 * 3900);
  }

  function render(){
    svg.innerHTML = '';
    var pct = parseFloat(slider.value);
    var cortexY = 30, medullaBottom = 30 + 150*(pct/100 * 0.85 + 0.15);
    var leftX = 160, rightX = 220, width = 30;

    svg.appendChild(el('rect', {x:20, y:cortexY, width:360, height:12, fill:'#fde68a', opacity:0.5}));
    svg.appendChild(el('text', {x:24, y:cortexY-4, 'font-size':10, fill:'#92400e'})).textContent = 'Cortex';

    svg.appendChild(el('rect', {x:20, y:cortexY+12, width:360, height: medullaBottom-cortexY-12, fill:'#dbeafe', opacity:0.5}));
    svg.appendChild(el('text', {x:24, y:cortexY+26, 'font-size':10, fill:'#1e40af'})).textContent = 'Medulla';

    var topY = cortexY + 20;
    var bottomY = topY + (medullaBottom - topY - 10);
    var path = 'M ' + leftX + ' ' + topY + ' L ' + leftX + ' ' + bottomY + ' Q ' + ((leftX+rightX)/2) + ' ' + (bottomY+18) + ' ' + rightX + ' ' + bottomY + ' L ' + rightX + ' ' + topY;
    svg.appendChild(el('path', {d: path, fill:'none', stroke:'#dc2626', 'stroke-width':4, 'stroke-linecap':'round'}));

    var depthLabel = el('text', {x: (leftX+rightX)/2, y: bottomY+35, 'font-size':10, fill:'#334155', 'text-anchor':'middle'});
    depthLabel.textContent = 'Loop depth: ' + Math.round(pct) + '% of maximum';
    svg.appendChild(depthLabel);

    var conc = maxConcentration(pct);
    var concLabel = el('text', {x:200, y:20, 'font-size':13, 'font-weight':700, fill:'#1a472a', 'text-anchor':'middle'});
    concLabel.textContent = 'Max urine concentration: ' + conc + ' mOsm/L';
    svg.appendChild(concLabel);

    var animalLabel = pct < 15 ? 'Beaver-like (short loop, aquatic)' : pct < 55 ? 'Rabbit-like (intermediate loop)' : 'Kangaroo-rat-like (elongated loop)';
    readout.innerHTML = '<b>' + animalLabel + '</b> — maximum urine concentration ≈ <b>' + conc + ' mOsm/L</b> (blood osmolarity is ~300 mOsm/L). A longer loop builds a steeper countercurrent gradient, allowing far more concentrated urine.';
  }

  slider.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>

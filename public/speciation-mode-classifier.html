<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speciation Mode Classifier | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #scenario {
    background: #f8fafc;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: #1d3557;
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt-btn {
    padding: 10px 12px;
    border-radius: 10px;
    border: 2px solid #cbd5e1;
    background: #fff;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    color: #334155;
    text-align: left;
  }
  .opt-btn[disabled] { cursor: default; }
  .opt-btn.correct { background: #dcfce7; border-color: #86efac; color: #166534; }
  .opt-btn.wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
  #feedback { margin-top: 1rem; font-size: 0.85rem; line-height: 1.5; min-height: 40px; }
  #footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
  #nextBtn {
    background: #2d6a4f; color: #fff; border: none; padding: 8px 20px;
    border-radius: 999px; font-size: 0.85rem; cursor: pointer;
  }
  #nextBtn[disabled] { background: #cbd5e1; cursor: not-allowed; }
  #score { font-size: 0.85rem; color: #4b5563; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Speciation Mode Classifier</h3>
  <div class="subtitle">Classify each scenario into its geographic mode of speciation.</div>
  <div id="scenario"></div>
  <div class="options" id="options"></div>
  <div id="feedback"></div>
  <div id="footer">
    <span id="score"></span>
    <button id="nextBtn" disabled>Next scenario</button>
  </div>
</div>
<script>
(function(){
  var modes = ['Allopatric (vicariance)', 'Allopatric (peripatric)', 'Parapatric', 'Sympatric'];
  var scenarios = [
    {
      text: 'A mountain range slowly rises over the range of a large, widespread bird population, splitting it into two roughly equal halves that can no longer make contact.',
      answer: 'Allopatric (vicariance)',
      explain: 'A physical barrier splits a large population evenly — the gene-flow block is total physical separation, with both resulting populations large enough that selection (not drift) tends to dominate their divergence.'
    },
    {
      text: 'A handful of insects are blown off course by a storm and found a new population on a remote, previously uncolonized island.',
      answer: 'Allopatric (peripatric)',
      explain: 'Total physical separation again, but this time from a tiny founding group at the periphery of the ancestral range — drift (via the founder effect) plays an outsized role here.'
    },
    {
      text: 'A plant population evolves heavy-metal tolerance across a narrow contamination gradient, while remaining in continuous, partial contact with non-tolerant plants just meters away.',
      answer: 'Parapatric',
      explain: 'No full separation — divergence happens across a continuous environmental gradient (a cline) at a shared boundary, with gene flow only partially homogenizing the difference.'
    },
    {
      text: 'A fly population diverges by host-plant preference, with the two emerging groups fully overlapping in geographic range and never physically separated at all.',
      answer: 'Sympatric',
      explain: 'No geographic barrier of any kind — the gene-flow-limiting factor here is behavioral (mating preferentially on the same host plant an individual developed on), operating entirely within a shared range.'
    }
  ];

  var order = [];
  var idx = 0;
  var correctCount = 0;
  var answered = false;
  var finished = false;

  var scenarioEl = document.getElementById('scenario');
  var optionsEl = document.getElementById('options');
  var feedbackEl = document.getElementById('feedback');
  var scoreEl = document.getElementById('score');
  var nextBtn = document.getElementById('nextBtn');

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function loadScenario(){
    answered = false;
    nextBtn.disabled = true;
    feedbackEl.innerHTML = '';
    var s = scenarios[order[idx]];
    scenarioEl.textContent = s.text;
    optionsEl.innerHTML = '';
    modes.forEach(function(m){
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = m;
      btn.addEventListener('click', function(){ chooseAnswer(m, s, btn); });
      optionsEl.appendChild(btn);
    });
    scoreEl.textContent = 'Score: ' + correctCount + ' / ' + idx;
  }

  function chooseAnswer(chosen, s, btn){
    if (answered) return;
    answered = true;
    var allBtns = optionsEl.querySelectorAll('.opt-btn');
    allBtns.forEach(function(b){ b.disabled = true; if (b.textContent === s.answer) b.classList.add('correct'); });
    var correct = chosen === s.answer;
    if (!correct){ btn.classList.add('wrong'); } else { correctCount++; }
    feedbackEl.innerHTML = (correct ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + s.explain;
    nextBtn.disabled = false;
    scoreEl.textContent = 'Score: ' + correctCount + ' / ' + (idx + 1);
  }

  nextBtn.addEventListener('click', function(){
    if (finished){
      idx = 0; correctCount = 0; finished = false;
      order = shuffle([0,1,2,3]);
      nextBtn.textContent = 'Next scenario';
      loadScenario();
      return;
    }
    idx++;
    if (idx >= order.length){
      finished = true;
      scenarioEl.textContent = 'All scenarios complete!';
      optionsEl.innerHTML = '';
      feedbackEl.innerHTML = 'Final score: ' + correctCount + ' / ' + scenarios.length + '.';
      nextBtn.textContent = 'Restart';
      nextBtn.disabled = false;
      return;
    }
    loadScenario();
  });

  order = shuffle([0,1,2,3]);
  loadScenario();
})();
</script>
</body>
</html>

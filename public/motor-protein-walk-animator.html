<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Protein Walk Animator | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .motorbtns { display: flex; gap: 8px; justify-content: center; margin-bottom: 1rem; }
  .motorbtns button { padding: 8px 16px; border-radius: 999px; border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; font-size: 0.82rem; font-weight: 700; }
  .motorbtns button.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
  #track { background: #f8fafc; border-radius: 14px; padding: 10px; }
  #note { text-align: center; margin-top: 10px; font-size: 0.84rem; color: #4b5563; min-height: 20px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Motor Protein Walk</h3>
  <div class="subtitle">Select a motor and watch it step along its filament toward its characteristic end, carrying cargo.</div>
  <div class="motorbtns">
    <button id="btnMyosin" class="active">Myosin (actin)</button>
    <button id="btnKinesin">Kinesin (MT, plus-end)</button>
    <button id="btnDynein">Dynein (MT, minus-end)</button>
  </div>
  <div id="track"><svg id="trackSvg" viewBox="0 0 400 90" width="100%" height="90"></svg></div>
  <div id="note"></div>
</div>
<script>
(function(){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('trackSvg');
  var note = document.getElementById('note');
  var motors = {
    myosin: { color: '#d9534f', dir: 1, label: 'toward the plus (barbed) end', filamentLabel: 'Actin filament' },
    kinesin: { color: '#1d70a2', dir: 1, label: 'toward the plus end (outward, anterograde)', filamentLabel: 'Microtubule' },
    dynein: { color: '#7c3aed', dir: -1, label: 'toward the minus end (inward, retrograde)', filamentLabel: 'Microtubule' }
  };
  var current = 'myosin';
  var timer = null;

  function buildTrack(){
    svg.innerHTML = '';
    var line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', 20); line.setAttribute('y1', 45); line.setAttribute('x2', 380); line.setAttribute('y2', 45);
    line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '6'); line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
    var minusLabel = document.createElementNS(ns, 'text');
    minusLabel.setAttribute('x', 20); minusLabel.setAttribute('y', 70); minusLabel.setAttribute('font-size','11'); minusLabel.setAttribute('fill','#64748b');
    minusLabel.textContent = '- end';
    svg.appendChild(minusLabel);
    var plusLabel = document.createElementNS(ns, 'text');
    plusLabel.setAttribute('x', 365); plusLabel.setAttribute('y', 70); plusLabel.setAttribute('font-size','11'); plusLabel.setAttribute('fill','#64748b');
    plusLabel.textContent = '+ end';
    svg.appendChild(plusLabel);

    var m = motors[current];
    var motor = document.createElementNS(ns, 'circle');
    motor.setAttribute('id', 'motorDot');
    motor.setAttribute('cy', 45);
    motor.setAttribute('r', 10);
    motor.setAttribute('fill', m.color);
    motor.setAttribute('cx', m.dir === 1 ? 40 : 360);
    svg.appendChild(motor);
    var cargo = document.createElementNS(ns, 'circle');
    cargo.setAttribute('id', 'cargoDot');
    cargo.setAttribute('cy', 30);
    cargo.setAttribute('r', 6);
    cargo.setAttribute('fill', '#fbbf24');
    cargo.setAttribute('cx', m.dir === 1 ? 40 : 360);
    svg.appendChild(cargo);
  }

  function animate(){
    if (timer) clearTimeout(timer);
    buildTrack();
    var m = motors[current];
    var motorDot = document.getElementById('motorDot');
    var cargoDot = document.getElementById('cargoDot');
    var start = m.dir === 1 ? 40 : 360;
    var end = m.dir === 1 ? 360 : 40;
    var steps = 20;
    var i = 0;
    note.textContent = m.filamentLabel + ' — moving ' + m.label + '.';
    function step(){
      i++;
      var x = start + (end - start) * (i / steps);
      motorDot.setAttribute('cx', x);
      cargoDot.setAttribute('cx', x);
      if (i < steps){
        timer = setTimeout(step, 60);
      } else {
        note.textContent = m.filamentLabel + ' — reached the ' + (m.dir === 1 ? 'plus' : 'minus') + ' end.';
      }
    }
    timer = setTimeout(step, 60);
  }

  document.getElementById('btnMyosin').addEventListener('click', function(){ setActive('myosin', this); });
  document.getElementById('btnKinesin').addEventListener('click', function(){ setActive('kinesin', this); });
  document.getElementById('btnDynein').addEventListener('click', function(){ setActive('dynein', this); });

  function setActive(key, btn){
    current = key;
    document.querySelectorAll('.motorbtns button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    animate();
  }

  buildTrack();
  animate();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C3 vs. C4 (Kranz) Toggle | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 580px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
    text-align: center;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
    text-align: left;
  }
  .toggle-row { display: flex; justify-content: center; gap: 0; margin-bottom: 1rem; }
  .toggle-btn {
    border: 2px solid #2d6a4f;
    background: #fff;
    color: #2d6a4f;
    padding: 9px 20px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn:first-child { border-radius: 999px 0 0 999px; }
  .toggle-btn:last-child { border-radius: 0 999px 999px 0; }
  .toggle-btn.active { background: #2d6a4f; color: #fff; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    text-align: left;
    min-height: 4.5em;
  }
  .legend { font-size: 0.75rem; color: #64748b; margin-top: 10px; text-align: left; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>C3 vs. C4 (Kranz) Vein Cross-Section</h3>
  <div class="subtitle">Toggle to see the bundle sheath enlarge and the mesophyll reorganize radially in C4 (Kranz) anatomy.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" id="c3Btn">C3</button>
    <button class="toggle-btn" id="c4Btn">C4 (Kranz)</button>
  </div>
  <svg id="veinSvg" viewBox="0 0 220 220" width="220" height="220">
    <circle cx="110" cy="110" r="100" fill="#eef6ec" stroke="#94a3b8" stroke-width="1"/>
    <g id="mesophyllGroup"></g>
    <g id="sheathGroup"></g>
    <g id="veinGroup"></g>
  </svg>
  <div class="note" id="note"></div>
  <div class="legend">
    <span><span class="sw" style="background:#4c8c3f"></span>Mesophyll</span>
    <span><span class="sw" style="background:#2d6a4f"></span>Bundle sheath</span>
    <span><span class="sw" style="background:#c9a86a"></span>Xylem</span>
    <span><span class="sw" style="background:#7fb8e0"></span>Phloem</span>
  </div>
</div>
<script>
(function(){
  var c3Btn = document.getElementById('c3Btn');
  var c4Btn = document.getElementById('c4Btn');
  var note = document.getElementById('note');
  var mesophyllGroup = document.getElementById('mesophyllGroup');
  var sheathGroup = document.getElementById('sheathGroup');
  var veinGroup = document.getElementById('veinGroup');
  var cx = 110, cy = 110;

  function veinCore(){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="#c9a86a"/>' +
      '<path d="M '+(cx+7)+' '+(cy-7)+' A 10 10 0 0 1 '+(cx+7)+' '+(cy+7)+' Z" fill="#7fb8e0"/>';
  }

  function showC3(){
    c3Btn.classList.add('active');
    c4Btn.classList.remove('active');
    sheathGroup.innerHTML = '<circle cx="'+cx+'" cy="'+cy+'" r="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>';
    var html = '';
    for (var i=0;i<26;i++){
      var x = 20 + (i % 13) * 14 + (Math.floor(i/13) * 7);
      var y = 20 + Math.floor(i/13) * 160;
      html += '<circle cx="'+x+'" cy="'+y+'" r="5" fill="#4c8c3f"/>';
    }
    mesophyllGroup.innerHTML = html;
    veinGroup.innerHTML = veinCore();
    note.innerHTML = '<b>C3 (ordinary) anatomy</b> — mesophyll is organized in the usual palisade/spongy layers with no chloroplast specialization by position. The bundle sheath (dashed outline) is ordinary, not enlarged.';
  }

  function showC4(){
    c4Btn.classList.add('active');
    c3Btn.classList.remove('active');
    sheathGroup.innerHTML = '<circle cx="'+cx+'" cy="'+cy+'" r="34" fill="#2d6a4f"/>';
    var html = '';
    var n = 14;
    for (var i=0;i<n;i++){
      var ang = 2*Math.PI*i/n;
      var x = cx + 55*Math.sin(ang);
      var y = cy - 55*Math.cos(ang);
      html += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="#4c8c3f"/>';
      html += '<line x1="'+(cx+38*Math.sin(ang)).toFixed(1)+'" y1="'+(cy-38*Math.cos(ang)).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#4c8c3f" stroke-width="2" opacity="0.4"/>';
    }
    mesophyllGroup.innerHTML = html;
    veinGroup.innerHTML = veinCore();
    note.innerHTML = '<b>C4 (Kranz) anatomy</b> — an enlarged, chloroplast-rich bundle sheath (solid dark green ring) forms a tight "wreath" directly around the vein, with mesophyll cells arranged radially around that ring. This spatial arrangement physically separates initial CO₂ fixation (mesophyll) from the Calvin cycle (bundle sheath), suppressing photorespiration.';
  }

  c3Btn.addEventListener('click', showC3);
  c4Btn.addEventListener('click', showC4);
  showC3();
})();
</script>
</body>
</html>

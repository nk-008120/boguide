<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Potential Voltage-Clamp Simulator | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 780px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggles { display:flex; gap: 14px; margin-bottom: 0.6rem; font-size: 0.82rem; }
  .toggles label { display:flex; align-items:center; gap: 6px; font-weight:600; cursor:pointer; }
  .scrub-row { display:flex; align-items:center; gap:10px; margin-top: 0.6rem; }
  .scrub-row input[type=range] { flex:1; accent-color:#2d6a4f; }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.82rem; margin-top: 0.8rem; }
  .readout b { color:#2d6a4f; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Action Potential Voltage-Clamp Simulator</h3>
  <div class="subtitle">Toggle the Na⁺/K⁺ conductance traces on or off, then drag the time marker to see exactly which channels are open, closed, or inactivated at each phase.</div>
  <div class="toggles">
    <label><input type="checkbox" id="showNa" checked> Na⁺ conductance</label>
    <label><input type="checkbox" id="showK" checked> K⁺ conductance</label>
  </div>
  <div id="plot" style="width:100%; height:380px;"></div>
  <div class="scrub-row">
    <span style="font-size:0.8rem; font-weight:600; color:#334155;">Time:</span>
    <input type="range" id="timeSlider" min="0" max="100" value="0" step="1">
  </div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var N = 200, tMax = 6;
  var t = [], voltage = [], naCond = [], kCond = [];
  for (var i=0;i<N;i++){
    var tt = i/(N-1)*tMax;
    t.push(tt);
    var v, na, k;
    if (tt < 1){
      v = -70; na = 0.02; k = 0.05;
    } else if (tt < 1.4){
      var p = (tt-1)/0.4;
      v = -70 + p*100;
      na = 0.02 + p*0.95;
      k = 0.05 + p*0.15;
    } else if (tt < 2.0){
      var p2 = (tt-1.4)/0.6;
      v = 30 - p2*100;
      na = 0.97*(1-p2) + 0.02*p2;
      k = 0.2 + p2*0.75;
    } else if (tt < 2.8){
      var p3 = (tt-2.0)/0.8;
      v = -70 - p3*15;
      na = 0.02;
      k = 0.95 - p3*0.4;
    } else {
      var p4 = Math.min(1, (tt-2.8)/1.5);
      v = -85 + p4*15;
      na = 0.02;
      k = 0.55 - p4*0.5;
    }
    voltage.push(v);
    naCond.push(na*100);
    kCond.push(k*100);
  }

  function phaseLabel(tt){
    if (tt < 1) return {phase: 'Resting', na: 'Closed', k: 'Closed (leak only)'};
    if (tt < 1.4) return {phase: 'Depolarization', na: 'Open (activated)', k: 'Beginning to open'};
    if (tt < 2.0) return {phase: 'Repolarization', na: 'Inactivated', k: 'Open'};
    if (tt < 2.8) return {phase: 'Hyperpolarization', na: 'Inactivated → resetting', k: 'Still open, closing slowly'};
    return {phase: 'Return to rest', na: 'Reset (closed, available)', k: 'Closing'};
  }

  var plotDiv = document.getElementById('plot');
  var showNa = document.getElementById('showNa');
  var showK = document.getElementById('showK');
  var slider = document.getElementById('timeSlider');
  var readout = document.getElementById('readout');

  function traces(){
    var arr = [{
      x: t, y: voltage, name: 'Membrane voltage (mV)', mode:'lines',
      line: {color:'#1a472a', width: 3}, yaxis: 'y'
    }];
    if (showNa.checked){
      arr.push({x:t, y:naCond, name:'Na⁺ conductance (%)', mode:'lines', line:{color:'#e67e22', width:2, dash:'dot'}, yaxis:'y2'});
    }
    if (showK.checked){
      arr.push({x:t, y:kCond, name:'K⁺ conductance (%)', mode:'lines', line:{color:'#1d70a2', width:2, dash:'dot'}, yaxis:'y2'});
    }
    return arr;
  }

  function markerShape(){
    var tt = parseFloat(slider.value)/100*tMax;
    return [{
      type:'line', x0:tt, x1:tt, y0:-100, y1:40, xref:'x', yref:'y',
      line:{color:'#b91c1c', width:2, dash:'solid'}
    }];
  }

  function render(){
    var layout = {
      xaxis: {title:'Time (ms)', range:[0,tMax], gridcolor:'#e9ecef'},
      yaxis: {title:'Membrane voltage (mV)', range:[-100,40], gridcolor:'#e9ecef'},
      yaxis2: {title:'Conductance (%)', overlaying:'y', side:'right', range:[0,105], showgrid:false},
      shapes: markerShape(),
      legend: {orientation:'h', y:-0.2},
      margin: {t:20, l:55, r:55, b:45},
      plot_bgcolor:'#ffffff', paper_bgcolor:'#ffffff'
    };
    Plotly.react(plotDiv, traces(), layout, {responsive:true, displayModeBar:false});
    updateReadout();
  }

  function updateReadout(){
    var tt = parseFloat(slider.value)/100*tMax;
    var info = phaseLabel(tt);
    readout.innerHTML = '<b>t = ' + tt.toFixed(2) + ' ms</b> — Phase: <b>' + info.phase + '</b>. Na⁺ channels: <b>' + info.na + '</b>. K⁺ channels: <b>' + info.k + '</b>.';
  }

  showNa.addEventListener('change', render);
  showK.addEventListener('change', render);
  slider.addEventListener('input', function(){
    Plotly.relayout(plotDiv, {shapes: markerShape()});
    updateReadout();
  });

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Species Map Explorer | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .instructions { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }
  svg { display: block; margin: 0 auto; }
  .pop-dot { cursor: pointer; }
  .pop-dot circle { fill: #94a3b8; stroke: #475569; stroke-width: 2; transition: fill 0.15s; }
  .pop-dot:hover circle { fill: #1d70a2; }
  .pop-dot.selected circle { fill: #2d6a4f; stroke: #1a472a; }
  .pop-label { font-size: 11px; fill: #334155; font-weight: 600; text-anchor: middle; }
  #result {
    margin-top: 14px;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    min-height: 20px;
    line-height: 1.5;
  }
  #result.yes { background: #dcfce7; color: #166534; }
  #result.no { background: #fee2e2; color: #991b1b; }
  #resetBtn {
    display: block;
    margin: 12px auto 0;
    background: #2d6a4f;
    color: #fff;
    border: none;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Ring Species Map Explorer</h3>
  <div class="subtitle">A chain of neighboring salamander populations forms a ring around a central valley. Click any two populations to test whether they interbreed.</div>
  <div class="instructions" id="instructions">Click a population to select it, then click a second to test interbreeding.</div>
  <svg id="svg" width="480" height="380" viewBox="0 0 480 380"></svg>
  <div id="result">Select two populations above.</div>
  <button id="resetBtn">Reset selection</button>
</div>
<script>
(function(){
  var n = 8;
  var cx = 240, cy = 190, r = 140;

  var startAngle = -225;
  var sweep = 270;
  var pops = [];
  for (var i = 0; i < n; i++){
    var angle = (startAngle + (sweep * i / (n - 1))) * Math.PI / 180;
    pops.push({
      id: i,
      label: 'Pop ' + (i + 1),
      x: cx + r * Math.cos(angle),
      y: cy + r * Math.sin(angle)
    });
  }

  var svg = document.getElementById('svg');
  var resultEl = document.getElementById('result');
  var instructions = document.getElementById('instructions');
  var selected = [];
  var svgns = 'http://www.w3.org/2000/svg';

  function el(tag, attrs){
    var e = document.createElementNS(svgns, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  function drawChain(){
    for (var i = 0; i < n - 1; i++){
      var line = el('line', {
        x1: pops[i].x, y1: pops[i].y, x2: pops[i+1].x, y2: pops[i+1].y,
        stroke: '#cbd5e1', 'stroke-width': 3
      });
      svg.appendChild(line);
    }
    var gapLine = el('line', {
      x1: pops[0].x, y1: pops[0].y, x2: pops[n-1].x, y2: pops[n-1].y,
      stroke: '#e2e8f0', 'stroke-width': 2, 'stroke-dasharray': '4,4'
    });
    svg.appendChild(gapLine);
  }

  function drawPops(){
    pops.forEach(function(p){
      var g = el('g', { class: 'pop-dot', 'data-id': p.id });
      var circle = el('circle', { cx: p.x, cy: p.y, r: 14 });
      var label = el('text', { class: 'pop-label', x: p.x, y: p.y + 30 });
      label.textContent = p.label;
      g.appendChild(circle);
      g.appendChild(label);
      g.addEventListener('click', function(){ onClick(p); });
      svg.appendChild(g);
    });
  }

  function refreshSelectedStyle(){
    Array.prototype.forEach.call(svg.querySelectorAll('.pop-dot'), function(g){
      var id = parseInt(g.getAttribute('data-id'), 10);
      g.classList.toggle('selected', selected.indexOf(id) !== -1);
    });
  }

  function onClick(p){
    if (selected.indexOf(p.id) !== -1){
      selected = [];
      refreshSelectedStyle();
      instructions.textContent = 'Click a population to select it, then click a second to test interbreeding.';
      resultEl.className = '';
      resultEl.textContent = 'Select two populations above.';
      return;
    }
    selected.push(p.id);
    if (selected.length === 1){
      refreshSelectedStyle();
      instructions.textContent = pops[p.id].label + ' selected. Now click a second population.';
      return;
    }
    refreshSelectedStyle();
    var a = selected[0], b = selected[1];
    var diff = Math.abs(a - b);
    var chainAdjacent = diff === 1;
    if (chainAdjacent){
      resultEl.className = 'yes';
      resultEl.innerHTML = '<b>' + pops[a].label + ' and ' + pops[b].label + ' interbreed successfully.</b> Every chain-adjacent pair along this ring can interbreed — that’s true of every neighboring pair you test.';
    } else if ((a === 0 && b === n - 1) || (a === n - 1 && b === 0)){
      resultEl.className = 'no';
      resultEl.innerHTML = '<b>' + pops[a].label + ' and ' + pops[b].label + ' do NOT interbreed</b> — even though they are geographically close (the two ends of the ring meet here), they are separated by the full chain of accumulated differences and behave as distinct species where they meet. This is the ring species paradox: the biological species concept gives a contradictory answer depending which populations you compare.';
    } else {
      resultEl.className = '';
      resultEl.innerHTML = '<b>' + pops[a].label + ' and ' + pops[b].label + ' never actually encounter each other in the wild</b> — they are separated by several intervening populations along the ring, so interbreeding was never geographically possible between them to begin with. Only chain-adjacent populations, and the two ends of the ring where it closes, are ones that actually meet. Try two <em>adjacent</em> populations, or the two end populations (Pop 1 and Pop 8).';
    }
    instructions.textContent = 'Click "Reset selection" to try another pair.';
  }

  drawChain();
  drawPops();

  document.getElementById('resetBtn').addEventListener('click', function(){
    selected = [];
    refreshSelectedStyle();
    instructions.textContent = 'Click a population to select it, then click a second to test interbreeding.';
    resultEl.className = '';
    resultEl.textContent = 'Select two populations above.';
  });
})();
</script>
</body>
</html>

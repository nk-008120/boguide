<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monocot/Dicot Feature-by-Feature Toggle | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab-btn {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active { background: #1a472a; color: #fff; border-color: #1a472a; }
  .center { text-align: center; }
  .toggle-row { display: flex; justify-content: center; margin-bottom: 10px; }
  .toggle-btn {
    border: 2px solid #2d6a4f;
    background: #fff;
    color: #2d6a4f;
    padding: 8px 18px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn:first-child { border-radius: 999px 0 0 999px; }
  .toggle-btn:last-child { border-radius: 0 999px 999px 0; }
  .toggle-btn.active { background: #2d6a4f; color: #fff; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    min-height: 3.5em;
    margin-top: 8px;
    text-align: left;
  }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Monocot / Dicot Feature-by-Feature Toggle</h3>
  <div class="subtitle">Pick a structure, then toggle monocot/dicot to see that one contrast in isolation.</div>
  <div class="tabs" id="tabs"></div>
  <div class="center">
    <div class="toggle-row">
      <button class="toggle-btn active" id="dicotBtn">Dicot</button>
      <button class="toggle-btn" id="monocotBtn">Monocot</button>
    </div>
    <svg id="featSvg" viewBox="0 0 200 160" width="200" height="160">
      <circle cx="100" cy="80" r="70" fill="#eef6ec" stroke="#94a3b8" stroke-width="1"/>
      <g id="featGroup"></g>
    </svg>
  </div>
  <div class="note" id="note"></div>
</div>
<script>
(function(){
  var tabsData = ['root','stem','leaf','flower','pollen'];
  var tabLabels = { root: 'Root', stem: 'Stem', leaf: 'Leaf', flower: 'Flower', pollen: 'Pollen' };
  var currentTab = 'root';
  var currentType = 'dicot';
  var tabsEl = document.getElementById('tabs');
  var dicotBtn = document.getElementById('dicotBtn');
  var monocotBtn = document.getElementById('monocotBtn');
  var featGroup = document.getElementById('featGroup');
  var note = document.getElementById('note');
  var cx = 100, cy = 80;

  var draws = {
    root: {
      dicot: function(){ return '<circle cx="'+cx+'" cy="'+cy+'" r="24" fill="#c9a86a"/><circle cx="'+cx+'" cy="'+cy+'" r="45" fill="none" stroke="#5a7d4f" stroke-width="1" stroke-dasharray="2,2"/>'; },
      monocot: function(){ return '<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="#f1e6c8"/>' + ringBundles(cx,cy,42,8); }
    },
    stem: {
      dicot: function(){ return '<circle cx="'+cx+'" cy="'+cy+'" r="24" fill="#f1e6c8"/>' + ringBundles(cx,cy,42,8); },
      monocot: function(){ return scatterBundles(); }
    },
    leaf: {
      dicot: function(){ return reticulateVeins(); },
      monocot: function(){ return parallelVeins(); }
    },
    flower: {
      dicot: function(){ return petals(5); },
      monocot: function(){ return petals(3); }
    },
    pollen: {
      dicot: function(){ return '<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="#dcecd6" stroke="#5a7d4f" stroke-width="2"/>' +
        '<line x1="'+(cx-15)+'" y1="'+(cy-20)+'" x2="'+(cx-15)+'" y2="'+(cy+20)+'" stroke="#2d6a4f" stroke-width="3"/>' +
        '<line x1="'+cx+'" y1="'+(cy-24)+'" x2="'+cx+'" y2="'+(cy+24)+'" stroke="#2d6a4f" stroke-width="3"/>' +
        '<line x1="'+(cx+15)+'" y1="'+(cy-20)+'" x2="'+(cx+15)+'" y2="'+(cy+20)+'" stroke="#2d6a4f" stroke-width="3"/>'; },
      monocot: function(){ return '<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="#dcecd6" stroke="#5a7d4f" stroke-width="2"/>' +
        '<line x1="'+cx+'" y1="'+(cy-26)+'" x2="'+cx+'" y2="'+(cy+26)+'" stroke="#2d6a4f" stroke-width="4"/>'; }
    }
  };

  var facts = {
    root: { dicot: 'Dicot root: solid, star-shaped <b>actinostele</b>, few xylem poles, little/no pith.', monocot: 'Monocot root: xylem/phloem alternate in a ring around a large central <b>pith</b>, more numerous (polyarch) xylem poles.' },
    stem: { dicot: 'Dicot stem: <b>eustele</b> — bundles in a single ring, open, clear cortex/pith distinction.', monocot: 'Monocot stem: <b>atactostele</b> — closed bundles scattered through ground tissue, no clean cortex/pith distinction.' },
    leaf: { dicot: 'Dicot leaf: <b>reticulate (net)</b> venation, pinnate or palmate.', monocot: 'Monocot leaf: <b>parallel</b> venation running the length of the blade.' },
    flower: { dicot: 'Dicot flower: typically <b>tetramerous or pentamerous</b> (parts in multiples of 4 or 5).', monocot: 'Monocot flower: typically <b>trimerous</b> (parts in multiples of 3).' },
    pollen: { dicot: 'Dicot (eudicot) pollen: typically <b>tricolpate</b> — three pore/slit-shaped apertures.', monocot: 'Monocot pollen: typically <b>monosulcate</b> — a single, elongated furrow-shaped aperture.' }
  };

  function ringBundles(cx,cy,r,n){
    var html = '';
    for (var i=0;i<n;i++){
      var ang = 2*Math.PI*i/n;
      var x = cx + r*Math.sin(ang), y = cy - r*Math.cos(ang);
      html += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6" fill="#c9a86a"/>';
    }
    return html;
  }
  function scatterBundles(){
    var pts = [[100,40],[70,55],[130,55],[55,80],[145,80],[70,105],[130,105],[100,120],[85,75],[115,75],[85,90],[115,90]];
    var html = '<circle cx="'+cx+'" cy="'+cy+'" r="45" fill="#dcecd6"/>';
    pts.forEach(function(p){ html += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#c9a86a" stroke="#5a7d4f" stroke-width="1"/>'; });
    return html;
  }
  function reticulateVeins(){
    return '<path d="M100 30 L100 130 M100 60 L70 40 M100 60 L130 40 M100 90 L65 75 M100 90 L135 75 M100 110 L75 105 M100 110 L125 105" stroke="#2d6a4f" stroke-width="2" fill="none"/>';
  }
  function parallelVeins(){
    return '<path d="M65 30 L65 130 M85 25 L85 135 M100 22 L100 138 M115 25 L115 135 M135 30 L135 130" stroke="#2d6a4f" stroke-width="2" fill="none"/>';
  }
  function petals(n){
    var html = '';
    for (var i=0;i<n;i++){
      var ang = 2*Math.PI*i/n;
      var x = cx + 34*Math.sin(ang), y = cy - 34*Math.cos(ang);
      html += '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="12" ry="20" fill="#e8927c" transform="rotate('+(ang*180/Math.PI)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>';
    }
    html += '<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="#f6d375"/>';
    return html;
  }

  function render(){
    featGroup.innerHTML = draws[currentTab][currentType]();
    note.innerHTML = facts[currentTab][currentType];
    dicotBtn.classList.toggle('active', currentType === 'dicot');
    monocotBtn.classList.toggle('active', currentType === 'monocot');
    Array.prototype.forEach.call(tabsEl.children, function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-tab') === currentTab);
    });
  }

  tabsData.forEach(function(t){
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (t === currentTab ? ' active' : '');
    btn.textContent = tabLabels[t];
    btn.setAttribute('data-tab', t);
    btn.addEventListener('click', function(){
      currentTab = t;
      render();
    });
    tabsEl.appendChild(btn);
  });

  dicotBtn.addEventListener('click', function(){ currentType = 'dicot'; render(); });
  monocotBtn.addEventListener('click', function(){ currentType = 'monocot'; render(); });

  render();
})();
</script>
</body>
</html>

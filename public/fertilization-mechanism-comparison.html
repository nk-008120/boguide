<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fertilization Mechanism Comparison | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 620px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  .tab-btn {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active { background: #1a472a; color: #fff; border-color: #1a472a; }
  .diagram { text-align: center; margin-bottom: 10px; }
  .note {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    min-height: 4.5em;
  }
  .water-needed { color: #1d70a2; font-weight: 700; }
  .water-free { color: #166534; font-weight: 700; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Fertilization Mechanism Comparison</h3>
  <div class="subtitle">Click each lineage to see its fertilization mechanism — and exactly where the water dependence is removed.</div>
  <div class="tabs" id="tabs"></div>
  <div class="diagram">
    <svg id="fertSvg" viewBox="0 0 260 120" width="260" height="120"></svg>
  </div>
  <div class="note" id="note"></div>
</div>
<script>
(function(){
  var lineages = [
    {
      key: 'bryophyte', label: 'Bryophytes',
      draw: function(){
        return '<rect x="10" y="10" width="240" height="100" fill="#dcecd6"/>' +
          waterLines() +
          '<circle cx="60" cy="60" r="8" fill="#4c8c3f"/><text x="60" y="90" text-anchor="middle" font-size="8">antheridium</text>' +
          '<circle cx="200" cy="60" r="8" fill="#e8927c"/><text x="200" y="90" text-anchor="middle" font-size="8">archegonium</text>' +
          '<circle id="spermDot" cx="75" cy="60" r="4" fill="#334155"/>';
      },
      note: 'Fertilization <span class="water-needed">requires liquid water</span>: flagellated sperm swim from the antheridium to the archegonium through a surface water film. This ties bryophyte reproduction to consistently moist habitats.'
    },
    {
      key: 'pteridophyte', label: 'Pteridophytes (ferns)',
      draw: function(){
        return '<rect x="10" y="10" width="240" height="100" fill="#dcecd6"/>' +
          waterLines() +
          '<circle cx="60" cy="60" r="8" fill="#4c8c3f"/><text x="60" y="90" text-anchor="middle" font-size="8">antheridium</text>' +
          '<circle cx="200" cy="60" r="8" fill="#e8927c"/><text x="200" y="90" text-anchor="middle" font-size="8">archegonium</text>' +
          '<circle id="spermDot" cx="75" cy="60" r="4" fill="#334155"/>' +
          '<text x="130" y="25" text-anchor="middle" font-size="8" fill="#334155">(on the free-living prothallus)</text>';
      },
      note: 'Still <span class="water-needed">requires liquid water</span>: flagellated sperm swim from antheridium to archegonium — same mechanism as bryophytes, just now happening on a separate, free-living gametophyte (prothallus) rather than one attached to the sporophyte.'
    },
    {
      key: 'gymnosperm', label: 'Gymnosperms',
      draw: function(){
        return '<rect x="10" y="10" width="240" height="100" fill="#f1e6c8"/>' +
          '<circle cx="50" cy="60" r="10" fill="#f6d375"/><text x="50" y="90" text-anchor="middle" font-size="8">pollen grain</text>' +
          '<path d="M65 60 L190 60" stroke="#2d6a4f" stroke-width="3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>' +
          '<circle cx="205" cy="60" r="10" fill="#e8927c"/><text x="205" y="90" text-anchor="middle" font-size="8">ovule</text>' +
          '<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2d6a4f"/></marker></defs>';
      },
      note: 'Fertilization <span class="water-free">no longer requires liquid water</span>: wind-dispersed pollen carries non-flagellated sperm directly to the ovule. This is the single most significant structural change in the whole survey — it removes the ancestral moist-habitat constraint.'
    },
    {
      key: 'angiosperm', label: 'Angiosperms',
      draw: function(){
        return '<rect x="10" y="10" width="240" height="100" fill="#f1e6c8"/>' +
          '<circle cx="50" cy="60" r="10" fill="#f6d375"/><text x="50" y="90" text-anchor="middle" font-size="8">pollen grain</text>' +
          '<path d="M65 60 L190 60" stroke="#2d6a4f" stroke-width="3" marker-end="url(#arrow2)"/>' +
          '<circle cx="205" cy="60" r="10" fill="#e8927c"/><text x="205" y="90" text-anchor="middle" font-size="8">embryo sac</text>' +
          '<defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2d6a4f"/></marker></defs>' +
          '<text x="130" y="25" text-anchor="middle" font-size="8" fill="#334155">(pollen tube, delivering 2 sperm cells)</text>';
      },
      note: 'Also <span class="water-free">no liquid water required</span>: a pollen tube grows directly to the embryo sac and delivers two non-motile sperm cells for double fertilization — the same water-independent strategy as gymnosperms, refined further.'
    }
  ];

  function waterLines(){
    var html = '';
    for (var i=0;i<4;i++){
      html += '<path d="M20 '+(30+i*20)+' Q40 '+(25+i*20)+' 60 '+(30+i*20)+' T100 '+(30+i*20)+' T140 '+(30+i*20)+' T180 '+(30+i*20)+' T220 '+(30+i*20)+'" stroke="#7fb8e0" stroke-width="1.5" fill="none" opacity="0.5"/>';
    }
    return html;
  }

  var tabsEl = document.getElementById('tabs');
  var fertSvg = document.getElementById('fertSvg');
  var note = document.getElementById('note');
  var current = 'bryophyte';

  function render(){
    var l = lineages.filter(function(x){ return x.key === current; })[0];
    fertSvg.innerHTML = l.draw();
    note.innerHTML = l.note;
    Array.prototype.forEach.call(tabsEl.children, function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-key') === current);
    });
  }

  lineages.forEach(function(l){
    var btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = l.label;
    btn.setAttribute('data-key', l.key);
    btn.addEventListener('click', function(){
      current = l.key;
      render();
    });
    tabsEl.appendChild(btn);
  });

  render();
})();
</script>
</body>
</html>

<!-- Custom Tooltip / Notification Banner (Top‑Left) -->
<div id="topbar-tooltip" class="custom-tooltip-box">
  <button id="close-tooltip-btn" class="close-btn" aria-label="Close notification">×</button>
  <div class="tooltip-text">
    <strong>📢We are still a growing community and would love some help. Want to contribute? Join us by mailing an e-mail of interest to </strong>
  </div>
  <a href="mailto:resourcerepository4boguide@gmail.com" class="tooltip-link" target="_blank" rel="noopener noreferrer">
    Start helping our community →
  </a>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const tooltip = document.getElementById('topbar-tooltip');
    const closeBtn = document.getElementById('close-tooltip-btn');

    // ── Show the tooltip after 200ms ─────────────────────────────────────────
    function showTooltip() {
      if (tooltip) {
        tooltip.classList.add('show');
      }
    }

    // Show after a short delay
    setTimeout(showTooltip, 200);

    // ── Close button ──────────────────────────────────────────────────────────
    if (closeBtn && tooltip) {
      closeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        tooltip.classList.remove('show');
      });
    }

    // ── (Optional) Hide after 15 seconds ─────────────────────────────────────
    // setTimeout(() => {
    //   if (tooltip) tooltip.classList.remove('show');
    // }, 15000);
  });
</script>

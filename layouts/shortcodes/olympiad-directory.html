<div class="olympiad-directory" id="olympiad-directory">
  <div class="olympiad-directory-controls">
    <input type="text" class="olympiad-directory-search" id="olympiad-directory-search" placeholder="Search countries..." aria-label="Search countries">
    <div class="olympiad-directory-filters" role="group" aria-label="Filter by availability">
      <button type="button" class="olympiad-directory-filter-btn is-active" data-filter="all">All</button>
      <button type="button" class="olympiad-directory-filter-btn" data-filter="published">Guide available</button>
      <button type="button" class="olympiad-directory-filter-btn" data-filter="coming-soon">Coming soon</button>
    </div>
  </div>
  <p class="olympiad-directory-count" id="olympiad-directory-count"></p>
  <div class="olympiad-directory-grid" id="olympiad-directory-grid">
    <div class="olympiad-directory-loading" id="olympiad-directory-loading">Loading guides...</div>
  </div>
  <p class="olympiad-directory-empty" id="olympiad-directory-empty" hidden>No countries match your search.</p>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protein Trafficking Pathway Tracer | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  #startBtn { display: block; margin: 0 auto 10px; background: #2d6a4f; color: #fff; border: none; border-radius: 999px; padding: 10px 24px; font-size: 0.85rem; cursor: pointer; }
  #startBtn:hover { background: #1a472a; }
  #trackSvg { width: 100%; height: 120px; background: #f8fafc; border-radius: 14px; }
  #stageLabel { text-align: center; margin-top: 10px; font-size: 0.85rem; color: #4b5563; min-height: 40px; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Trace a Secreted Protein's Journey</h3>
  <div class="subtitle">Click "Start" and watch a cargo vesicle carry a protein through rough ER &rarr; Golgi &rarr; final destination, with each stage's modification labelled.</div>
  <button id="startBtn">Start (Ribosome &rarr; Rough ER)</button>
  <svg id="trackSvg" viewBox="0 0 400 120"></svg>
  <div id="stageLabel">Click Start to begin the trace.</div>
</div>
<script>
(function(){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('trackSvg');
  var stageLabel = document.getElementById('stageLabel');
  var stations = [
    { x: 40, name: 'Ribosome', detail: 'SRP halts translation and directs the ribosome-mRNA complex to the ER translocon.' },
    { x: 130, name: 'Rough ER', detail: 'Co-translational folding begins; N-linked glycosylation starts as the chain enters the ER lumen.' },
    { x: 220, name: 'Golgi (cis to trans)', detail: 'Golgi enzymes further modify glycans in an assembly-line fashion as cargo moves cis to trans.' },
    { x: 310, name: 'Secretory vesicle', detail: 'Sorted at the trans face and packaged into a vesicle bound for the plasma membrane.' },
    { x: 380, name: 'Plasma membrane', detail: 'Exocytosis releases the finished protein outside the cell.' }
  ];
  var timer = null;

  function buildTrack(){
    svg.innerHTML = '';
    var line = document.createElementNS(ns,'line');
    line.setAttribute('x1',30);line.setAttribute('y1',60);line.setAttribute('x2',390);line.setAttribute('y2',60);
    line.setAttribute('stroke','#cbd5e1');line.setAttribute('stroke-width','4');
    svg.appendChild(line);
    stations.forEach(function(s){
      var c = document.createElementNS(ns,'circle');
      c.setAttribute('cx',s.x);c.setAttribute('cy',60);c.setAttribute('r',8);c.setAttribute('fill','#e2e8f0');
      c.setAttribute('id','station-'+s.x);
      svg.appendChild(c);
      var t = document.createElementNS(ns,'text');
      t.setAttribute('x',s.x);t.setAttribute('y',85);t.setAttribute('font-size','9');t.setAttribute('text-anchor','middle');t.setAttribute('fill','#64748b');
      t.textContent = s.name;
      svg.appendChild(t);
    });
    var vesicle = document.createElementNS(ns,'circle');
    vesicle.setAttribute('id','vesicle');
    vesicle.setAttribute('cx',40);vesicle.setAttribute('cy',35);vesicle.setAttribute('r',9);vesicle.setAttribute('fill','#fbbf24');
    svg.appendChild(vesicle);
  }

  function reset(){
    if (timer) clearTimeout(timer);
    buildTrack();
    stageLabel.textContent = 'Click Start to begin the trace.';
  }

  function run(){
    reset();
    var vesicle = document.getElementById('vesicle');
    var i = 0;
    function step(){
      var s = stations[i];
      vesicle.setAttribute('cx', s.x);
      document.getElementById('station-' + s.x).setAttribute('fill', '#2d6a4f');
      stageLabel.innerHTML = '<b>' + s.name + '</b>: ' + s.detail;
      i++;
      if (i < stations.length){
        timer = setTimeout(step, 1100);
      }
    }
    timer = setTimeout(step, 300);
  }

  document.getElementById('startBtn').addEventListener('click', run);
  reset();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three-Stage Metabolic Flow Diagram | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .stages { display: flex; gap: 10px; flex-wrap: wrap; }
  .stage {
    flex: 1; min-width: 140px;
    background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px;
    padding: 12px; cursor: pointer; text-align: center; transition: 0.15s;
  }
  .stage:hover { border-color: #2d6a4f; }
  .stage.active { background: #dcfce7; border-color: #2d6a4f; }
  .stage .name { font-weight: 700; font-size: 0.85rem; }
  .stage .loc { font-size: 0.72rem; color: #64748b; margin-top: 3px; }
  .arrow { align-self: center; font-size: 1.4rem; color: #94a3b8; }
  #detail {
    margin-top: 1.2rem; padding: 1rem; background: #f1f5f9; border-radius: 14px;
    min-height: 90px; font-size: 0.88rem;
  }
  #detail table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  #detail td { padding: 4px 6px; }
  #detail td:first-child { color: #64748b; }
  #detail td:last-child { font-weight: 700; text-align: right; color: #2d6a4f; }
  #totalRow { margin-top: 10px; padding-top: 10px; border-top: 1px solid #cbd5e1; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Where Does the ATP Actually Come From?</h3>
  <div class="subtitle">Click each stage to reveal its net ATP/NADH/FADH2 output. Watch the running total build across all four stages.</div>
  <div class="stages" id="stages"></div>
  <div id="detail">Click a stage above to see its tally.</div>
  <div id="totalRow">Running total: 0 ATP (direct) | 0 NADH | 0 FADH2</div>
</div>
<script>
(function(){
  var stages = [
    { id: 'glyc', name: 'Glycolysis', loc: 'Cytoplasm', atp: 2, nadh: 2, fadh2: 0,
      detail: 'Glucose (6C) split into 2 pyruvate. Substrate-level phosphorylation: 4 ATP made, 2 consumed = net 2 ATP.' },
    { id: 'pdh', name: 'Pyruvate Oxidation', loc: 'Mito. matrix', atp: 0, nadh: 2, fadh2: 0,
      detail: 'Pyruvate dehydrogenase converts 2 pyruvate to 2 acetyl-CoA, releasing 2 CO2 and generating 2 NADH. No ATP made here.' },
    { id: 'tca', name: 'TCA Cycle', loc: 'Mito. matrix', atp: 2, nadh: 6, fadh2: 2,
      detail: 'Two turns of the cycle (one per acetyl-CoA) release 4 CO2 and regenerate oxaloacetate, yielding 2 GTP/ATP (substrate-level), 6 NADH, 2 FADH2.' },
    { id: 'etc', name: 'ETC / Chemiosmosis', loc: 'Inner mito. membrane', atp: 'majority', nadh: '(consumed)', fadh2: '(consumed)',
      detail: 'All NADH/FADH2 from the prior stages are reoxidised here, pumping protons that drive ATP synthase. This chemiosmotic step produces the large majority of total ATP.' }
  ];
  var container = document.getElementById('stages');
  var detail = document.getElementById('detail');
  var totalRow = document.getElementById('totalRow');
  var seen = {};

  stages.forEach(function(s, i){
    if (i > 0){
      var arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      container.appendChild(arrow);
    }
    var el = document.createElement('div');
    el.className = 'stage';
    el.id = 'card-' + s.id;
    el.innerHTML = '<div class="name">' + s.name + '</div><div class="loc">' + s.loc + '</div>';
    el.addEventListener('click', function(){
      document.querySelectorAll('.stage').forEach(function(c){ c.classList.remove('active'); });
      el.classList.add('active');
      seen[s.id] = true;
      detail.innerHTML = '<b>' + s.name + '</b><br>' + s.detail;
      updateTotal();
    });
    container.appendChild(el);
  });

  function updateTotal(){
    var atp = 0, nadh = 0, fadh2 = 0, hasQual = false;
    stages.forEach(function(s){
      if (!seen[s.id]) return;
      if (typeof s.atp === 'number') atp += s.atp; else hasQual = true;
      if (typeof s.nadh === 'number') nadh += s.nadh;
      if (typeof s.fadh2 === 'number') fadh2 += s.fadh2;
    });
    totalRow.textContent = 'Running total: ' + atp + ' ATP (direct)' + (hasQual ? ' + majority via ETC' : '') + ' | ' + nadh + ' NADH consumed/made | ' + fadh2 + ' FADH2 consumed/made';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAAS / ADH Pathway Flowchart | BioGuide</title>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .toggle-row { display:flex; gap:8px; margin-bottom: 1rem; }
  .toggle-btn {
    flex: 1; padding: 8px 6px; border-radius: 999px; border: 2px solid #cbd5e1;
    background: #f8fafc; font-size: 0.78rem; font-weight: 600; cursor: pointer; color:#475569;
  }
  .toggle-btn.active { background:#1d70a2; border-color:#1d70a2; color:#fff; }
  .nodes { display: flex; flex-direction: column; gap: 8px; }
  .node {
    padding: 10px 14px; border-radius: 12px; background: #f1f5f9; border: 2px solid transparent;
    cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #334155; transition: all 0.15s;
  }
  .node:hover { border-color: #cbd5e1; }
  .node.selected { background: #dcfce7; border-color: #166534; color: #166534; }
  .node.raas-only.hidden-mode, .node.adh-only.hidden-mode { display: none; }
  .arrow { text-align:center; color:#94a3b8; font-size: 1rem; }
  .detail {
    margin-top: 1rem; background: #eef2e6; border-radius: 14px; padding: 12px 16px;
    font-size: 0.85rem; color: #1e293b; min-height: 60px;
  }
  .detail b { color: #2d6a4f; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>RAAS / ADH Pathway Explorer</h3>
  <div class="subtitle">Toggle between RAAS and ADH, then click each step to reveal its specific trigger and effect. Both mechanisms respond to blood pressure/volume/osmolarity but act on the nephron in parallel, not in sequence.</div>
  <div class="toggle-row">
    <button class="toggle-btn active" data-mode="raas">RAAS pathway</button>
    <button class="toggle-btn" data-mode="adh">ADH pathway</button>
  </div>
  <div class="nodes" id="nodes"></div>
  <div class="detail" id="detail">Click a step above to see its trigger and effect.</div>
</div>
<script>
(function(){
  var raasSteps = [
    {label: 'Juxtaglomerular apparatus', detail: '<b>Trigger:</b> falling blood pressure/volume at the afferent arteriole. <b>Effect:</b> releases renin into the blood.'},
    {label: 'Angiotensinogen → Angiotensin I', detail: '<b>Trigger:</b> renin cleaves liver-produced angiotensinogen. <b>Effect:</b> produces the inactive precursor angiotensin I.'},
    {label: 'ACE converts to Angiotensin II', detail: '<b>Trigger:</b> angiotensin I reaches lung capillaries. <b>Effect:</b> angiotensin-converting enzyme (ACE) produces active angiotensin II.'},
    {label: 'Vasoconstriction', detail: '<b>Trigger:</b> angiotensin II binds vascular smooth muscle receptors. <b>Effect:</b> systemic vasoconstriction, raising blood pressure directly.'},
    {label: 'Aldosterone release (adrenal cortex)', detail: '<b>Trigger:</b> angiotensin II stimulates the adrenal cortex. <b>Effect:</b> aldosterone released into blood.'},
    {label: 'Distal tubule / collecting duct: Na+ reabsorption', detail: '<b>Trigger:</b> aldosterone binds nephron tubule cells. <b>Effect:</b> increased Na+ reabsorption, water follows osmotically, raising blood volume.'}
  ];
  var adhSteps = [
    {label: 'Hypothalamic osmoreceptors', detail: '<b>Trigger:</b> rising blood osmolarity (or falling blood volume/pressure). <b>Effect:</b> signals the posterior pituitary.'},
    {label: 'Posterior pituitary releases ADH', detail: '<b>Trigger:</b> hypothalamic signal. <b>Effect:</b> ADH (vasopressin) enters the bloodstream.'},
    {label: 'Aquaporins inserted in collecting duct', detail: '<b>Trigger:</b> ADH binds collecting duct cells. <b>Effect:</b> aquaporin water channels inserted into the luminal membrane.'},
    {label: 'Water reabsorbed into hyperosmotic medulla', detail: '<b>Trigger:</b> the now water-permeable collecting duct sits in the medullary gradient built by the countercurrent multiplier. <b>Effect:</b> water moves out of the filtrate, concentrating urine and returning water to blood.'}
  ];

  var nodesEl = document.getElementById('nodes');
  var detailEl = document.getElementById('detail');
  var toggleBtns = document.querySelectorAll('.toggle-btn');
  var mode = 'raas';

  function render(){
    nodesEl.innerHTML = '';
    var steps = mode === 'raas' ? raasSteps : adhSteps;
    steps.forEach(function(step, idx){
      var node = document.createElement('div');
      node.className = 'node';
      node.textContent = (idx+1) + '. ' + step.label;
      node.addEventListener('click', function(){
        document.querySelectorAll('.node').forEach(function(n){ n.classList.remove('selected'); });
        node.classList.add('selected');
        detailEl.innerHTML = step.detail;
      });
      nodesEl.appendChild(node);
      if (idx < steps.length - 1){
        var arrow = document.createElement('div');
        arrow.className = 'arrow';
        arrow.textContent = '↓';
        nodesEl.appendChild(arrow);
      }
    });
    detailEl.innerHTML = 'Click a step above to see its trigger and effect.';
  }

  toggleBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      toggleBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.dataset.mode;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>

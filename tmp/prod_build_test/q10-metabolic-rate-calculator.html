<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q10 Metabolic Rate Calculator | BioGuide</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fefcf5;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .widget-container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.5rem;
  }
  h3 { margin-top: 0; color: #1a472a; font-weight: 600; }
  .subtitle {
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 1.2rem;
    border-left: 3px solid #2d6a4f;
    padding-left: 12px;
  }
  .slider-panel { display:flex; flex-wrap:wrap; gap: 1.2rem; background:#f8fafc; padding: 0.8rem 1rem; border-radius:16px; margin-bottom: 0.8rem; }
  .slider-item { flex:1; min-width:180px; }
  .slider-item label { display:block; font-size:0.78rem; font-weight:700; color:#2d6a4f; margin-bottom:2px; }
  .slider-item input { width:100%; accent-color:#2d6a4f; }
  .readout { background:#eef2e6; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; }
  .readout b { color:#2d6a4f; }
</style>
</head>
<body>
<div class="widget-container">
  <h3>Q10 Metabolic Rate Calculator</h3>
  <div class="subtitle">Drag the temperature marker and adjust Q10 to see exactly how an ectotherm's metabolic rate scales with environmental temperature.</div>
  <div class="slider-panel">
    <div class="slider-item">
      <label>Current temperature: <span id="tempVal">20</span>°C</label>
      <input type="range" id="tempSlider" min="0" max="40" value="20" step="1">
    </div>
    <div class="slider-item">
      <label>Q10 value: <span id="q10Val">2.5</span></label>
      <input type="range" id="q10Slider" min="1.5" max="3.5" value="2.5" step="0.1">
    </div>
  </div>
  <div id="plot" style="width:100%; height:380px;"></div>
  <div class="readout" id="readout"></div>
</div>
<script>
(function(){
  var refTemp = 10, refRate = 1;
  var plotDiv = document.getElementById('plot');
  var tempSlider = document.getElementById('tempSlider');
  var q10Slider = document.getElementById('q10Slider');
  var tempVal = document.getElementById('tempVal');
  var q10Val = document.getElementById('q10Val');
  var readout = document.getElementById('readout');

  function rateAt(temp, q10){
    return refRate * Math.pow(q10, (temp - refTemp)/10);
  }

  function curveXY(q10){
    var x=[], y=[];
    for (var t=0;t<=40;t++){
      x.push(t);
      y.push(rateAt(t, q10));
    }
    return {x:x, y:y};
  }

  function render(){
    var temp = parseFloat(tempSlider.value);
    var q10 = parseFloat(q10Slider.value);
    tempVal.textContent = temp;
    q10Val.textContent = q10.toFixed(1);

    var curve = curveXY(q10);
    var rate = rateAt(temp, q10);
    var maxY = rateAt(40, q10) * 1.1;

    Plotly.react(plotDiv, [
      {x:curve.x, y:curve.y, name:'Metabolic rate', mode:'lines', line:{color:'#1a472a', width:3}},
      {x:[temp], y:[rate], name:'Current', mode:'markers', marker:{color:'#dc2626', size:12}}
    ], {
      xaxis: {title:'Temperature (°C)', range:[0,40], gridcolor:'#e9ecef'},
      yaxis: {title:'Relative metabolic rate', range:[0,maxY], gridcolor:'#e9ecef'},
      shapes: [{type:'line', x0:temp, x1:temp, y0:0, y1:maxY, line:{color:'#dc2626', width:1, dash:'dash'}}],
      legend: {orientation:'h', y:-0.2},
      margin: {t:20, l:55, r:20, b:45},
      plot_bgcolor:'#ffffff', paper_bgcolor:'#ffffff'
    }, {responsive:true, displayModeBar:false});

    var refRate10Higher = rateAt(temp+10, q10);
    readout.innerHTML = 'At <b>' + temp + '°C</b> with Q10 = <b>' + q10.toFixed(1) + '</b>: relative metabolic rate = <b>' + rate.toFixed(2) + '×</b> the rate at ' + refTemp + '°C. ' +
      'A 10°C rise from here (to ' + (temp+10) + '°C) would multiply metabolic rate by ' + q10.toFixed(1) + '× again, to ' + refRate10Higher.toFixed(2) + '×.';
  }

  tempSlider.addEventListener('input', render);
  q10Slider.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>

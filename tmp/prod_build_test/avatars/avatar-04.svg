    <rect x="-20" y="30" width="40" height="6" rx="3" fill="#4a6a8a"/>
    <rect x="-8" y="10" width="16" height="22" rx="2" fill="#5a7fa0"/>
    <rect x="-5" y="-30" width="10" height="42" rx="2" fill="#4a6a8a"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="100" fill="#f0e8d8"/>
  <g transform="translate(100,100)">
    <!-- Mushroom cap -->
    <path d="M-42,0 Q-42,-40 0,-45 Q42,-40 42,0 Z" fill="#c0392b" stroke="#a02e22" stroke-width="2"/>
    <!-- Cap spots -->
    <circle cx="-18" cy="-25" r="6" fill="#e8d0c8" opacity="0.8"/>
    <circle cx="12" cy="-30" r="5" fill="#e8d0c8" opacity="0.8"/>
    <circle cx="25" cy="-12" r="4.5" fill="#e8d0c8" opacity="0.8"/>
    <circle cx="-30" cy="-8" r="4" fill="#e8d0c8" opacity="0.8"/>
    <circle cx="0" cy="-15" r="3.5" fill="#e8d0c8" opacity="0.8"/>
    <!-- Stem -->
    <rect x="-10" y="0" width="20" height="35" rx="4" fill="#f0e0d0" stroke="#d0c0a8" stroke-width="1.5"/>
    <!-- Gill lines under cap -->
    <line x1="-25" y1="0" x2="-8" y2="-3" stroke="#a02e22" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="0" x2="-5" y2="-3" stroke="#a02e22" stroke-width="1" opacity="0.4"/>
    <line x1="15" y1="0" x2="5" y2="-3" stroke="#a02e22" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="0" x2="8" y2="-3" stroke="#a02e22" stroke-width="1" opacity="0.4"/>
    <!-- Grass -->
    <path d="M-35,35 Q-32,25 -28,35" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round"/>
    <path d="M-22,35 Q-20,28 -17,35" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round"/>
    <path d="M17,35 Q20,28 22,35" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round"/>
    <path d="M28,35 Q32,25 35,35" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="100" fill="#fcebd8"/>
  <g transform="translate(100,100)">
    <!-- Owl body -->
    <ellipse cx="0" cy="10" rx="32" ry="35" fill="#b5895a" stroke="#9a7045" stroke-width="2"/>
    <!-- Belly -->
    <ellipse cx="0" cy="18" rx="18" ry="22" fill="#e8d5b8"/>
    <!-- Belly lines -->
    <path d="M-10,8 Q0,6 10,8" fill="none" stroke="#c5b098" stroke-width="1" stroke-linecap="round"/>
    <path d="M-12,14 Q0,12 12,14" fill="none" stroke="#c5b098" stroke-width="1" stroke-linecap="round"/>
    <path d="M-11,20 Q0,18 11,20" fill="none" stroke="#c5b098" stroke-width="1" stroke-linecap="round"/>
    <path d="M-9,26 Q0,24 9,26" fill="none" stroke="#c5b098" stroke-width="1" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="28" ry="22" fill="#b5895a" stroke="#9a7045" stroke-width="2"/>
    <!-- Ear tufts -->
    <path d="M-20,-38 L-22,-52 L-12,-38" fill="#9a7045"/>
    <path d="M20,-38 L22,-52 L12,-38" fill="#9a7045"/>
    <!-- Eye discs -->
    <circle cx="-12" cy="-20" r="12" fill="#e8d5b8"/>
    <circle cx="12" cy="-20" r="12" fill="#e8d5b8"/>
    <!-- Eyes -->
    <circle cx="-12" cy="-20" r="7" fill="#e8a020"/>
    <circle cx="12" cy="-20" r="7" fill="#e8a020"/>
    <circle cx="-12" cy="-20" r="4" fill="#1a1a1a"/>
    <circle cx="12" cy="-20" r="4" fill="#1a1a1a"/>
    <circle cx="-10" cy="-22" r="1.5" fill="white"/>
    <circle cx="14" cy="-22" r="1.5" fill="white"/>
    <!-- Beak -->
    <path d="M-4,-12 L0,-6 L4,-12" fill="#e8a020" stroke="#c88010" stroke-width="1"/>
    <!-- Feet -->
    <path d="M-12,44 L-18,48 M-12,44 L-12,50 M-12,44 L-6,48" stroke="#c88010" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,44 L6,48 M12,44 L12,50 M12,44 L18,48" stroke="#c88010" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
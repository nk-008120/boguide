      - id: q1
        number: "Q1"
        name: "Stereochemistry of Citrate and Isocitrate in the Aconitase Reaction"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=5"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "Citrate has enantiomers."
            answer: false
            explanation: "Citrate itself is not chiral: the two -CH2COO- arms attached to the central carbon\
  \ are identical in free solution, so there is no stereocenter and no mirror-image\
  \ pair. Citrate is prochiral rather than chiral, which is exactly what lets aconitase\
  \ later distinguish the two arms."
          - letter: "B"
            text: "Isocitrate has enantiomers."
            answer: true
            explanation: "Once water is added back asymmetrically at C2/C3 as shown in Figure 1, isocitrate\
  \ carries two stereocenters (C2 and C3), so it exists as distinct stereoisomers\
  \ rather than one achiral form. Only one of these forms is the biologically produced\
  \ isocitrate."
          - letter: "C"
            text: "Two:CH2COO- groups are stereochemically equivalent when citrate is free in solution."
            answer: true
            explanation: "In free solution, citrate can tumble and rotate freely, so its two -CH2COO- arms\
  \ are related by an internal symmetry and behave as equivalent groups. This symmetry\
  \ is precisely why citrate alone is not chiral."
          - letter: "D"
            text: "Two:CH2COO- groups are stereochemically equivalent when citrate is bound to aconitase."
            answer: false
            explanation: "Aconitase's active site is itself asymmetric, so once citrate is docked in it the\
  \ two arms sit in different local environments and are no longer interchangeable.\
  \ This enzyme-imposed asymmetry is what allows aconitase to remove the OH/H pair\
  \ from one specific arm (C3/C4) and never from C2, giving a single stereochemical\
  \ outcome instead of a racemic mixture."

      - id: q2
        number: "Q2"
        name: "Respiratory Control in Isolated Mitochondria: ADP, DNP and DCCD"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=6"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The mitochondria are able to incorporate exogenously added ADP."
            answer: true
            explanation: "Each addition of ADP in Figure 1 triggers a fresh burst of oxygen consumption, which\
  \ can only happen if the added ADP actually reaches the matrix and is phosphorylated\
  \ there. This response shows the mitochondria have a functional ADP/ATP transport\
  \ system across their membranes."
          - letter: "B"
            text: "Before addition of chemical compounds, the mitochondria respire only when ATP can\
  \ be produced."
            answer: true
            explanation: "Before DNP or DCCD is added, oxygen consumption rises only in step with ADP additions\
  \ and slows again once the added ADP is used up, which is the signature of respiration\
  \ tightly coupled to ATP synthesis. If the mitochondria respired independently of\
  \ ATP production, oxygen use would not track ADP supply this closely."
          - letter: "C"
            text: "The reason why DNP stimulates oxygen consumption is that ATP synthesis is stimulated\
  \ by DNP."
            answer: false
            explanation: "DNP is added only after the supplied ADP has already been consumed, yet respiration\
  \ still speeds up, this is only possible if DNP is uncoupling respiration from\
  \ ATP synthesis, not enhancing ATP synthesis itself. As an uncoupler, DNP dissipates\
  \ the proton gradient directly, letting electron transport (and oxygen consumption)\
  \ run fast without any additional ATP being made."
          - letter: "D"
            text: "DCCD inhibits ATP synthesis."
            answer: true
            explanation: "In the right-hand experiment, respiration halts before the added ADP has been exhausted\
  \ once DCCD is present, showing that ATP synthase can no longer use the proton gradient\
  \ to make ATP. Because respiration and phosphorylation are normally coupled, blocking\
  \ ATP synthase this way also chokes off further oxygen consumption, unlike the uncoupler\
  \ DNP."

      - id: q3
        number: "Q3"
        name: "Carbon Isotope Fractionation in C3 versus C4 Photosynthesis"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=7"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "A"
            text: "The relative difference in molecular mass due to the carbon isotopes is larger in\
  \ CO2 than H2CO3."
            answer: true
            explanation: "Swapping 12C for 13C changes a two-atom CO2 molecule's mass by a bigger fraction\
  \ than it changes the heavier, larger H2CO3 molecule, since the same absolute mass\
  \ difference is a smaller proportion of a bigger molecule. A larger proportional\
  \ mass difference is exactly what drives stronger isotope discrimination."
          - letter: "B"
            text: "Reaction 1 is catalyzed by ribulose 1,5-bisphosphate carboxylase/oxygenase (RubisCO)."
            answer: false
            explanation: "Reaction 1 fixes HCO3-/H2CO3 rather than CO2 directly and is labeled as the C4 reaction,\
  \ which matches PEP carboxylase (PEPC), not RubisCO. PEPC's use of the bicarbonate\
  \ ion instead of CO2 gas is also why C4 fixation shows much weaker isotope discrimination\
  \ than the C3 pathway."
          - letter: "C"
            text: "Both groups of plants discriminate between the isotopes."
            answer: true
            explanation: "Figure 1 shows two separate, non-overlapping d13C distributions (group 1 and group\
  \ 2) rather than one group with no discrimination at all, so both groups discriminate\
  \ against 13C to some degree. They simply do so by different amounts, which is what\
  \ separates the two peaks."
          - letter: "D"
            text: "Rice belongs to group 1 and corn (maize) belongs to group 2."
            answer: true
            explanation: "Rice is a C3 plant using RubisCO (Reaction 2), which discriminates strongly against\
  \ the heavier isotope and gives the more negative d13C values, while maize is a\
  \ C4 plant using PEPC (Reaction 1), which discriminates much less and gives less\
  \ negative values. Matching these known photosynthetic types to the two peaks in\
  \ Figure 1 places rice in the strongly-discriminating group and maize in the weakly-discriminating\
  \ group."

      - id: q4
        number: "Q4"
        name: "Sedimentation Coefficient and Centrifugation Physics"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=8"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "A"
            text: "For organelles of the same size and shape, S can be used to estimate differences\
  \ in organelle density."
            answer: true
            explanation: "Equation (2) shows S is directly proportional to the density difference between the\
  \ specimen and the solvent (rho - rho0). If size and shape (and hence Vm and r)\
  \ are held equal, any change in S must come from a change in rho, so S tracks density\
  \ differences under these conditions."
          - letter: "B"
            text: "Since many protein molecules have densities between 1.3 and 1.4 (g/mL), we can use\
  \ S to distinguish sizes of spherical protein molecules."
            answer: true
            explanation: "Equation (2) shows S scales with Vm/r, a term that grows with the specimen's size\
  \ (roughly its surface area for a sphere), so if density is fixed in the narrow\
  \ 1.3-1.4 range, differences in S mainly reflect differences in size. This is why\
  \ S-values are commonly used to compare the sizes of similarly-dense proteins."
          - letter: "C"
            text: "Assuming that two ribosomal subunits of similar size are combined to form a large\
  \ complex, S is approximately doubled."
            answer: false
            explanation: "S depends on Vm/r, not on Vm (volume) alone, so doubling the mass/volume by combining\
  \ two subunits does not double S. Because r itself grows roughly with the cube root\
  \ of volume, the combined S-value increases by only about 1.4-fold (root 2), not\
  \ two-fold, which is why S-values are not simply additive."
          - letter: "D"
            text: "Since it is commonly expected that the viscosity of a solvent will increase at low\
  \ temperatures, S also decreases when chilled."
            answer: true
            explanation: "Equation (2) puts eta, the solvent's viscosity, in the denominator, so S is inversely\
  \ proportional to viscosity. As a solvent is chilled its viscosity rises, and that\
  \ increased viscous drag correspondingly lowers the sedimentation coefficient."

      - id: q5
        number: "Q5"
        name: "ATP-Dependent Na+ Efflux in the Squid Giant Axon"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=9"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "This experiment should have been carried out under the condition with sufficient\
  \ oxygen to maintain the activity of ATP production by mitochondria."
            answer: true
            explanation: "The whole point of the experiment is to test how blocking ATP production (with the\
  \ uncoupler DNP) affects Na+ efflux, which only makes sense if mitochondrial ATP\
  \ synthesis was running normally beforehand. Keeping oxygen supply adequate throughout\
  \ ensures the baseline high efflux rate genuinely reflects an ATP-fueled Na+ pump\
  \ rather than a pump already starved of ATP."
          - letter: "B"
            text: "The efflux of 24Na+ observed in seawater without DNP indicates the leaking of Na\
  \ ions out of the cell by nonspecific transportation."
            answer: false
            explanation: "Before DNP is added, efflux is high and roughly constant, and it drops by about 98%\
  \ once DNP shuts down ATP production, a passive, nonspecific leak would not be\
  \ nearly abolished by cutting off ATP. This pattern instead shows the observed efflux\
  \ is mostly active, ATP-dependent pumping, not simple leakage."
          - letter: "C"
            text: "Delayed decrease of 24Na+ efflux after using DNP reflects some amount of ATP storage\
  \ inside the axon, including that being produced by glycolysis."
            answer: true
            explanation: "Efflux does not fall immediately when DNP is applied but only after a delay, which\
  \ fits with the axon still drawing on a reserve of ATP already stored (or briefly\
  \ still being made by glycolysis) before that reserve runs out. Once the residual\
  \ ATP is depleted, the Na+ pump can no longer keep up its efflux rate and it falls."
          - letter: "D"
            text: "Active transport of sodium ions was estimated to increase internal sodium concentration\
  \ by 10% in 50 min."
            answer: false
            explanation: "The pump described is exporting Na+ out of the axon, so its activity would decrease\
  \ internal Na+, not increase it, and the data track a fall in efflux rate (roughly\
  \ 50 to 40, about 20%) rather than any rise in internal Na+ concentration. Nothing\
  \ in the recorded efflux time course provides evidence of Na+ accumulating inside\
  \ the cell."

      - id: q6
        number: "Q6"
        name: "Nernst Potentials and Ion Transport Direction in Root Epidermal Cells"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=10"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "In soil X, potassium ions are absorbed by the active transport system."
            answer: false
            explanation: "For soil X, the K+ Nernst potential works out to about -120 mV, which is less negative\
  \ than the actual -150 mV membrane potential, so the inward electrochemical gradient\
  \ already favors K+ entry. Since K+ moving in matches its own equilibrium gradient\
  \ here, uptake in soil X is passive, not active."
          - letter: "B"
            text: "In soil Y, potassium ions are absorbed by the active transport system."
            answer: true
            explanation: "In soil Y the external K+ concentration is much lower, giving a K+ Nernst potential\
  \ of about -240 mV, which is more negative than the cell's actual -150 mV. Bringing\
  \ K+ in against this steeper gradient requires the cell to expend energy, making\
  \ it active transport."
          - letter: "C"
            text: "In soil X, chloride ions are absorbed by the passive transport system."
            answer: false
            explanation: "For Cl- in soil X, the Nernst potential comes out around +60 mV, far more positive\
  \ than the cell's -150 mV, so moving the negatively charged Cl- inward runs against\
  \ both the electrical gradient and requires energy input. This makes Cl- uptake\
  \ in soil X active, not passive."
          - letter: "D"
            text: "In soil Y, chloride ions are absorbed by the passive transport system."
            answer: false
            explanation: "In soil Y the Cl- Nernst potential is calculated to be about 0 mV, still far more\
  \ positive than the actual -150 mV membrane potential, so the electrical gradient\
  \ still opposes passive inward Cl- movement. Uptake therefore still needs active\
  \ transport, just as in soil X."

      - id: q7
        number: "Q7"
        name: "Glucosinolate Distribution and Herbivore Choice in Arabidopsis Leaves"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=11"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
        statements:
          - letter: "A"
            text: "In the Arabidopsis wild strain, glucosinolate is accumulated more in the outer lamina\
  \ of the leaves."
            answer: true
            explanation: "Figure 1 shows insect larvae choosing the inner lamina over the outer lamina in wild-type\
  \ leaves, while in the glucosinolate-free mutant the two regions are bitten about\
  \ equally. This difference implies the outer lamina normally carries more of the\
  \ repellent glucosinolate, which is what deters larvae from it in the wild type."
          - letter: "B"
            text: "In this mutant, glucosinolate is evenly accumulated at any region of the leaf."
            answer: false
            explanation: "This mutant cannot synthesize glucosinolate at all, so there is no glucosinolate\
  \ present anywhere in its leaf to be evenly or unevenly distributed. The equal biting\
  \ pattern seen in the mutant reflects the complete absence of the repellent, not\
  \ an even accumulation of it."
          - letter: "C"
            text: "Arabidopsis accumulates only glucosinolate as a repellent in its leaves."
            answer: false
            explanation: "The experiment only tests glucosinolate's role and cannot rule out other repellents\
  \ being present and distributed differently. Without data excluding other defensive\
  \ compounds, this experiment alone cannot support such an absolute claim."
          - letter: "D"
            text: "For Arabidopsis, inner lamina is likely to be more physiologically important than\
  \ outer lamina."
            answer: false
            explanation: "In the wild type, larvae preferentially damage the inner lamina rather than the outer\
  \ lamina, suggesting the plant invests its chemical defenses more heavily in protecting\
  \ the outer lamina. This pattern points to the outer lamina being the more important\
  \ tissue to protect, the opposite of this statement."

      - id: q8
        number: "Q8"
        name: "CAM-like Nocturnal Carbon Fixation in the Amphibious Plant Isoetes howelli"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=12"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "A"
            text: "The malate concentration in the leaves is the highest just before sunrise."
            answer: true
            explanation: "CO2 released from stored malate is used for photosynthesis during the day, so malate\
  \ accumulates through the night as CO2 is progressively fixed and stored, and is\
  \ drawn down again once daylight returns. That build-up over the whole night means\
  \ malate stores should peak right at the end of the night, just before sunrise."
          - letter: "B"
            text: "The characteristic metabolism is adaptive because it reduces water loss."
            answer: false
            explanation: "This CAM-like metabolism occurs while the plant is fully submerged in fresh water,\
  \ a setting where water loss is not a meaningful constraint at all. The advantage\
  \ instead relates to competing for scarce dissolved CO2, not to conserving water."
          - letter: "C"
            text: "This species has characteristic bundle sheath cells with well-developed chloroplasts."
            answer: false
            explanation: "Well-developed bundle-sheath chloroplasts are the anatomical hallmark of C4 photosynthesis\
  \ (Kranz anatomy), whereas Isoetes howelli's night-fixation/day-release strategy\
  \ is a temporal (CAM-like) separation of carbon fixation, not a C4-style spatial\
  \ separation. There is therefore no reason to expect this particular specialized\
  \ bundle-sheath anatomy in this species."
          - letter: "D"
            text: "In the submerged condition to which this species is adapted, it is more difficult\
  \ to use CO2 in daytime than in nighttime."
            answer: true
            explanation: "In shallow, sunlit water, other photosynthetic organisms are actively competing for\
  \ and depleting dissolved CO2 during the day, making daytime CO2 scarce, while at\
  \ night that competing photosynthetic drawdown stops. Fixing carbon at night, when\
  \ CO2 is more available, and storing it as malate for use the next day is therefore\
  \ the more efficient strategy under submerged conditions."

      - id: q9
        number: "Q9"
        name: "Start-Codon Selection Mechanisms in Prokaryotic versus Eukaryotic Translation"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=13"
        subjects:
          - name: "Translation & the Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
        statements:
          - letter: "A"
            text: "In E. coli, the translation starts with the first AUG codon of the mRNA as the start\
  \ codon."
            answer: false
            explanation: "When E. coli mRNA (a polycistron) is put into a yeast cell, only the first gene of\
  \ some operons is translated even though later genes each have their own AUG further\
  \ downstream. This shows E. coli's ribosome does not simply scan for the first AUG\
  \ in a message; it needs an additional sequence cue to recognize each start site,\
  \ matching statement C."
          - letter: "B"
            text: "In yeast, translation starts with the first AUG codon of the mRNA as the start codon."
            answer: true
            explanation: "In experiment (1), when E. coli operons are expressed in yeast, at most only the\
  \ first gene's product is made even though downstream genes also carry AUG codons,\
  \ consistent with the yeast ribosome scanning from the 5' end and stopping at the\
  \ very first AUG it meets. This matches the classic eukaryotic scanning model of\
  \ start-codon selection."
          - letter: "C"
            text: "In E. coli, translation starts with the AUG codon designated by the specific sequence\
  \ in the mRNA as the start codon."
            answer: true
            explanation: "Experiment (2) shows that yeast cDNA (lacking the E. coli-style ribosome-binding/Shine-Dalgarno\
  \ sequence) is barely translated in E. coli even though full-length mRNA is present,\
  \ meaning the E. coli ribosome needs that specific upstream sequence next to an\
  \ AUG to initiate. This explains why, in experiment (1), an E. coli operon transplanted\
  \ into yeast can fail to be translated at all if yeast doesn't provide the right\
  \ recognition context, and why only operons whose first gene happens to work like\
  \ a eukaryotic start site get translated there."

      - id: q10
        number: "Q10"
        name: "Cytosine Deamination and Why Uracil Is Excluded from DNA"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=14"
        subjects:
          - name: "Nucleotide & Nucleic Acid Chemistry"
            link: "/resources/1-cell-molecular/nucleotide-nucleic-acid-chemistry/"
          - name: "DNA Repair & Recombination"
            link: "/resources/1-cell-molecular/dna-repair-recombination/"
        statements:
          - letter: "A"
            text: "Chemical changes made to RNA bases are not repaired."
            answer: true
            explanation: "Because RNA is not passed on to the next generation and is continually resynthesized\
  \ and turned over, there is little evolutionary benefit to maintaining a repair\
  \ system for chemical damage in individual RNA molecules. Any damaged RNA copy is\
  \ simply degraded and replaced rather than corrected."
          - letter: "B"
            text: "Chemical changes that occur in cytosine bases are the main reason that thymine bases\
  \ are used only in DNA."
            answer: true
            explanation: "Cytosine's deamination product is uracil, a base that would otherwise be indistinguishable\
  \ from a base normally found in DNA if U and T looked alike. By using the methylated\
  \ version of uracil (thymine) as the normal DNA base and reserving plain uracil\
  \ for RNA, a repair system can immediately recognize any uracil found in DNA as\
  \ damage and remove it, since the cell can tell that any U it finds in DNA must\
  \ be an error rather than a normal base."
          - letter: "C"
            text: "E. coli mutant strains that incorporate uracil instead of thymine are more likely\
  \ to mutate the A-T base pair."
            answer: false
            explanation: "When uracil is incorporated in place of thymine, it still pairs correctly with adenine\
  \ just as thymine does, so simply substituting U for T does not itself scramble\
  \ the A-T pairing base. The mutation risk described here comes from further deamination\
  \ of cytosine to uracil (base C above), not from swapping T for U at A-paired positions."
          - letter: "D"
            text: "E. coli mutant cells containing uracil bases in the DNA chain are susceptible to\
  \ chemical changes in uracil bases, so that new mutations occur frequently."
            answer: false
            explanation: "Uracil lacks the methyl group that cytosine's deamination product would otherwise\
  \ be confused with, and uracil itself has no exocyclic amine group that would make\
  \ it prone to the same hydrolytic deamination reaction described for cytosine. Because\
  \ uracil is comparatively chemically stable in this respect, simply having U in\
  \ place of T in the DNA chain does not by itself trigger frequent new mutations."

      - id: q11
        number: "Q11"
        name: "Pedigree Analysis of Three Heritable Traits: Alfa, Baker and Charlie"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=15"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "An analysis of pedigree A suggests that the inheritance pattern of characteristic\
  \ Alfa could be due to a dominant allele."
            answer: false
            explanation: "In Figure 1, A10 shows the Alfa trait even though her parents A3 and A4 do not, which\
  \ is impossible for a simple dominant allele (an affected child must then have at\
  \ least one affected parent). This pattern instead points to a recessive allele,\
  \ with A3 and A4 as unaffected carriers."
          - letter: "B"
            text: "An analysis of pedigree C suggests that the inheritance of the characteristic Charlie\
  \ could be due to a dominant allele."
            answer: true
            explanation: "In family C, every individual shown with the Charlie trait (C2, C5, C7, C13) has\
  \ at least one affected parent, so nothing in pedigree C alone rules out simple\
  \ dominant inheritance. Only the later, independent evidence (stated in the stem)\
  \ establishes that Charlie is actually recessive."
          - letter: "C"
            text: "B1 and B3 of family B are definitely carriers."
            answer: true
            explanation: "Since Baker is now known to be recessive, an affected child born to two unaffected\
  \ parents means both parents must carry one copy of the recessive allele. B7 (affected)\
  \ has unaffected parents B1 and B2, and B10 (affected) has unaffected parents B3\
  \ and B4, so B1 and B3 are each obligate carriers by this logic."
          - letter: "D"
            text: "C1 and C3 of family C are definitely carriers."
            answer: false
            explanation: "C1 is the parent of C5, who is affected, so C1 (unaffected) must indeed carry the\
  \ recessive allele. But C3's children (C9, C10, C11) are all unaffected, so there\
  \ is no evidence forcing C3 to carry the recessive allele, making the claim about\
  \ C3 not certain."

      - id: q12
        number: "Q12"
        name: "Regulation of the rut Operon by the RutR Repressor and Uracil"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=16"
        subjects:
          - name: "Gene Regulation: Prokaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-prokaryotic/"
        statements:
          - letter: "A"
            text: "As the concentration of uracil increases, the expression level of the rut operon\
  \ decreases."
            answer: false
            explanation: "Uracil is described as an inducer of this system, meaning it binds RutR and inactivates\
  \ its repressing ability, relieving repression of the operon. So as uracil rises,\
  \ RutR becomes progressively less able to repress, and rut operon expression should\
  \ increase, not decrease."
          - letter: "B"
            text: "When a mutation occurs in the RutR repressor and the affinity for uracil is reduced,\
  \ the expression level of the rut operon is reduced."
            answer: true
            explanation: "If RutR binds uracil less well, uracil can no longer efficiently switch RutR into\
  \ its inactive form, so RutR stays in its active, repressing form more of the time\
  \ even when uracil is present. With repression persisting longer than normal, expression\
  \ of the rut operon ends up lower than in the wild type."
          - letter: "C"
            text: "If a mutation occurs in the DNA binding domain of the RutR repressor and the affinity\
  \ for the DNA sequence decreases, the expression level of the rut operon increases."
            answer: true
            explanation: "RutR represses the operon by physically binding its operator DNA, so a mutation that\
  \ weakens this DNA-binding ability leaves the operator more often unoccupied. With\
  \ the repressor less able to sit on the DNA and block transcription, expression\
  \ of the rut operon rises."
          - letter: "D"
            text: "When a mutation occurs in the nucleotide sequence of the operator to which the RutR\
  \ repressor in the Prut promoter binds, the expression level of the rut operon always\
  \ becomes high."
            answer: false
            explanation: "A mutated operator sequence could just as easily increase RutR's binding affinity\
  \ as decrease it, or leave it roughly unchanged, so the outcome on expression is\
  \ not predictable in only one direction. Because the word 'always' claims a single\
  \ guaranteed outcome that the information given cannot support, the statement is\
  \ false."

      - id: q13
        number: "Q13"
        name: "Bacterial Transcription Factors Coordinating Metabolic and Lifestyle Genes"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=17"
        subjects:
          - name: "Gene Regulation: Prokaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-prokaryotic/"
        statements:
          - letter: "A"
            text: "Generally, transcription factors, which induce the expression of glucose utilizing\
  \ genes, suppress the expression of lactose-metabolizing genes."
            answer: true
            explanation: "This describes the classic catabolite repression logic seen in the lac operon system:\
  \ when glucose is available it is the preferred, cheaper-to-use sugar, so the regulatory\
  \ circuit that turns on glucose-utilization genes simultaneously keeps lactose-metabolizing\
  \ genes switched off. Only when glucose is scarce does the cell commit the extra\
  \ machinery needed to metabolize lactose."
          - letter: "B"
            text: "Transcription factors activated by phosphate depletion activate the expression of\
  \ glycogen-utilizing genes."
            answer: false
            explanation: "Breaking down glycogen for energy first requires adding a phosphate group to it (to\
  \ make glucose-1-phosphate), so this pathway is itself phosphate-consuming. It would\
  \ be counterproductive for a phosphate-starvation response to activate a pathway\
  \ that consumes more of the very resource (phosphate) that is already scarce."
          - letter: "C"
            text: "Transcription factors that activate the expression of fatty acids-metabolizing genes\
  \ are generally activated under oxygen depleted conditions."
            answer: false
            explanation: "Breaking down fatty acids (beta-oxidation and the downstream citric acid cycle/oxidative\
  \ phosphorylation) is fundamentally an oxidative process that depends on having\
  \ oxygen available as the ultimate electron acceptor. So the transcription factors\
  \ driving fatty-acid metabolism genes are typically activated when oxygen is present,\
  \ not when it is depleted."
          - letter: "D"
            text: "Transcription factors that activate the expression of biofilm-forming genes usually\
  \ suppress the expression of the genes of flagella formation."
            answer: true
            explanation: "Biofilm formation depends on cells staying attached to a surface and to each other,\
  \ which is essentially the opposite lifestyle to active swimming. Given that biofilm-associated\
  \ bacteria are observed to rarely move, it fits that the regulatory switch promoting\
  \ biofilm/adhesion genes also represses flagellar genes needed for motility."

      - id: q14
        number: "Q14"
        name: "Matching Molecular Biology Techniques to Research Questions"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=18"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "A"
            text: "To examine the site where a specific gene is expressed in a mouse tissue, it is appropriate\
  \ to perform (M4)."
            answer: true
            explanation: "In situ hybridization uses a labeled probe applied directly to intact tissue sections,\
  \ which preserves spatial information and directly shows exactly where within the\
  \ tissue a given mRNA is being expressed. This makes it the most direct method among\
  \ the listed options for localizing gene expression anatomically."
          - letter: "B"
            text: "To analyze the expression level of a specific gene in maple leaves, it is appropriate\
  \ to perform (M2)."
            answer: true
            explanation: "Quantitative RT-PCR reverse-transcribes and amplifies a chosen transcript, giving\
  \ a precise, quantitative readout of that one gene's expression level. This makes\
  \ it the appropriate, direct tool for measuring how much a specific gene is expressed,\
  \ as opposed to surveying many genes at once."
          - letter: "C"
            text: "To search the Bacillus subtilis genome for genes the expression of which is induced\
  \ when the nitrogen source is depleted. (M1)"
            answer: true
            explanation: "A DNA microarray probes many thousands of genes across the genome in parallel, which\
  \ is exactly what is needed to scan the whole genome and pick out which unknown\
  \ genes change expression under nitrogen-depleted conditions. A single-gene method\
  \ like RT-PCR could not answer this genome-wide screening question directly."
          - letter: "D"
            text: "To identify microbial species from microbial communities thriving in compost. (M7)"
            answer: true
            explanation: "Metagenome analysis sequences the pooled genetic material of an entire mixed community\
  \ directly from the environment, without needing to culture individual organisms\
  \ first. This makes it the appropriate direct method for identifying which microbial\
  \ species are present in a complex compost community."

      - id: q15
        number: "Q15"
        name: "Gibberellin and Abscisic Acid Control of Seed Germination"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=19"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
          - name: "Seed Germination & Dormancy Physiology"
            link: "/resources/5-plant-physiology/seed-germination-dormancy-physiology/"
        statements:
          - letter: "A"
            text: "In the mutant lacking the ent-kaurene synthase gene, germination is delayed compared\
  \ to the wild-type plants."
            answer: true
            explanation: "Losing ent-kaurene synthase blocks the biosynthetic pathway before ent-kaurene can\
  \ be made, so no downstream gibberellin can be produced from this route. Since gibberellin\
  \ is required to promote germination, a mutant unable to make it germinates later\
  \ than wild-type plants that produce gibberellin normally."
          - letter: "B"
            text: "When a mutant lacking the ent-kaurene synthase gene is treated with ent-kaurene,\
  \ germination is promoted."
            answer: true
            explanation: "The mutant's biosynthetic block is only at the step making ent-kaurene itself; all\
  \ the downstream enzymes (like GA20 oxidase) that convert ent-kaurene into active\
  \ gibberellin are still intact. Supplying ent-kaurene externally therefore lets\
  \ the rest of the pathway proceed normally to gibberellin, restoring germination."
          - letter: "C"
            text: "ent-Kaurene treatment to a mutant lacking the gene encoding GA20-oxidase promotes\
  \ germination."
            answer: false
            explanation: "GA20 oxidase acts downstream of ent-kaurene in converting it toward active gibberellin,\
  \ so if this mutant lacks GA20 oxidase, supplying ent-kaurene cannot bypass the\
  \ missing downstream step. Since ent-kaurene itself has no germination-inducing\
  \ activity, without functional GA20 oxidase this treatment cannot promote germination."
          - letter: "D"
            text: "8'-Hydroxyabscisic acid has a stronger germination-inhibiting activity than abscisic\
  \ acid."
            answer: false
            explanation: "CYP707A converts abscisic acid into 8'-hydroxyabscisic acid, and overexpressing CYP707A\
  \ (which increases conversion to 8'-hydroxyabscisic acid) actually promotes germination\
  \ more than in the wild type. If 8'-hydroxyabscisic acid inhibited germination more\
  \ strongly than abscisic acid, increasing its production should have delayed germination\
  \ instead, so it must be the weaker inhibitor of the two."

      - id: q16
        number: "Q16"
        name: "Designing Cloning Primers with Restriction Sites for Vector A"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=21"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "Forward primer (underline: the start codon) 5'-CCC GAA TTC ATG AAG TTA TTG AGC AAT\
  \ A-3' (EcoRI site)"
            answer: false
            explanation: "Placing gene X's own ATG directly after the EcoRI site here would create a second\
  \ start codon in-frame with the vector's own upstream His-tag start codon shown\
  \ in Figure 1, throwing off the reading frame relative to the His-tag fusion. Because\
  \ the fusion protein must be translated in-frame from the vector's start codon through\
  \ the His-tag and into gene X, inserting gene X's own ATG like this causes a frameshift\
  \ rather than a correct in-frame fusion."
          - letter: "B"
            text: "Forward primer (underline: the start codon) 5'- CCC CCC GGG ATG AAG TTA TTG AGC AAT\
  \ A-3' (SmaI site)"
            answer: true
            explanation: "This primer correctly places the three extra Cs before the SmaI site (CCCGGG) so\
  \ the enzyme can cut it, followed directly by gene X's own sequence beginning at\
  \ ATG. Cloned into the SmaI site downstream of the vector's His-tag reading frame,\
  \ this primer design is consistent with generating an in-frame His-tagged fusion\
  \ protein."
          - letter: "C"
            text: "Reverse primer (underline: the stop codon) 5'-CCC GTC GAC TCA AGA CGA AGC ATA TGA\
  \ T-3' (SalI site)"
            answer: true
            explanation: "As a reverse primer, this sequence is the reverse complement of the 3' end of gene\
  \ X (from Figure 2) including its stop codon, correctly written 5' to 3', with the\
  \ SalI site and its three flanking Cs added appropriately at the primer's 5' end.\
  \ This matches how a reverse primer must be constructed to correctly amplify and\
  \ terminate the coding sequence at the vector's SalI site."
          - letter: "D"
            text: "Reverse primer (underline: the stop codon) 5'-CCC AAG CTT GTA GGT AGT ATA CGA AGC\
  \ AGA ACT -3' (HindIII site)"
            answer: false
            explanation: "A reverse primer must be the reverse complement of the template's 3' end read 5'\
  \ to 3', but this primer instead reads the same strand in the same 5'-to-3' direction\
  \ as the coding strand near the stop codon. Because it is not actually the complementary\
  \ strand, it will not anneal to the correct template strand and cannot prime synthesis\
  \ from that end."

      - id: q17
        number: "Q17"
        name: "Predicting Reading-Frame Effects of CRISPR-Cas9 Indels"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=23"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "It is highly likely that the activity of enzyme A is retained in mutant 1."
            answer: false
            explanation: "Comparing mutant 1 to the original sequence in Figure 1 shows a single base insertion\
  \ near the start codon, which shifts every downstream codon reading frame by one\
  \ base. Such a frameshift scrambles the entire downstream amino acid sequence, so\
  \ enzyme A's activity is very unlikely to be preserved."
          - letter: "B"
            text: "It is highly likely that the activity of enzyme A is retained in mutant 2."
            answer: false
            explanation: "Mutant 2 in Figure 1 shows a one-base deletion relative to the original sequence,\
  \ which likewise shifts the reading frame for everything downstream. As with mutant\
  \ 1, this frameshift is expected to destroy the protein's normal sequence and its\
  \ activity."
          - letter: "C"
            text: "It is possible that the activity of enzyme A is retained in mutant 3."
            answer: true
            explanation: "Mutant 3 shows a 3-base deletion, which removes exactly one whole codon (one amino\
  \ acid) without shifting the reading frame of everything after it. If that single\
  \ missing amino acid is not essential to the protein's structure or function, the\
  \ rest of the protein can still fold and work normally, so retained activity is\
  \ a real possibility."
          - letter: "D"
            text: "It is highly likely that the activity of enzyme A is lost in mutant 4."
            answer: false
            explanation: "Mutant 4 has a 3-base insertion, which adds one extra codon without shifting the\
  \ downstream reading frame, unlike the true frameshifts in mutants 1 and 2. Note:\
  \ reading Figure 1 closely, the inserted triplet next to the original sequence lines\
  \ up with a TAA stop codon, which would truncate the protein very early and argue\
  \ for lost activity, the official key marks this statement False despite that reasoning,\
  \ so there is a real tension here between the given answer and the sequence data\
  \ worth double-checking against the source."

      - id: q18
        number: "Q18"
        name: "Transcriptional Attenuation of the E. coli trp Operon"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=24"
        subjects:
          - name: "Gene Regulation: Prokaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-prokaryotic/"
        statements:
          - letter: "A"
            text: "The transcription rate is much faster than the translation rate in the E. coli cell."
            answer: false
            explanation: "The entire attenuation mechanism only works because the ribosome can keep pace with,\
  \ or even be overtaken by, RNA polymerase closely enough that the ribosome's exact\
  \ position over Region 1 determines which stem-loop forms. In real E. coli cells,\
  \ translation (about 20 amino acids/second) actually proceeds at a comparable or\
  \ faster rate than transcription (about 50-100 bases/second) once codon length is\
  \ accounted for, not much slower, which is a prerequisite for coupled transcription-translation\
  \ control like this to function at all."
          - letter: "B"
            text: "In a mutant strain of E. coli lacking the trp operator sequence, transcription-truncated\
  \ mRNA is generated when tryptophan is present in the medium."
            answer: true
            explanation: "Without an operator sequence, the repressor can never bind and block RNA polymerase\
  \ from starting, so transcription of the leader region always begins regardless\
  \ of tryptophan levels. However, when tryptophan is abundant the leader peptide\
  \ (with its two Trp codons) is translated smoothly and the ribosome does not stall\
  \ in Region 1, so the Region 3/4 stem-loop still forms as usual Figure 3, producing\
  \ the same short, terminated (attenuated) transcript."
          - letter: "C"
            text: "In the mutant strain in which the tryptophan codons in the leader peptide is deleted,\
  \ the growth is delayed when tryptophan is deficient in the medium."
            answer: true
            explanation: "The whole attenuation-relief mechanism depends on the ribosome stalling specifically\
  \ at the Trp codons in Region 1 when tryptophan is scarce, which is what keeps Region\
  \ 4 from pairing and lets transcription continue into the biosynthetic genes. If\
  \ those Trp codons are deleted, the ribosome never stalls there even when tryptophan\
  \ is deficient, so the terminator keeps forming, the biosynthetic genes stay off,\
  \ and the cell struggles to make enough tryptophan to grow."
          - letter: "D"
            text: "The tryptophan concentration in the cells increases in the mutant strain in which\
  \ 10 tryptophan codons are present in the leader peptide."
            answer: true
            explanation: "Adding many more tryptophan codons to the leader peptide makes it much harder for\
  \ the ribosome to translate through Region 1 quickly whenever intracellular Trp-tRNA\
  \ is even slightly limiting, so the ribosome is more likely to stall there and allow\
  \ the Region 2/3 stem-loop (anti-terminator) to form Figure 3. This biases the operon\
  \ toward staying transcriptionally active more of the time, driving up expression\
  \ of the Trp biosynthetic enzymes and, in turn, cellular tryptophan levels."

      - id: q19
        number: "Q19"
        name: "Tissue Distribution of the Glucagon Receptor and Metabolic Roles"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=27"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "Liver expresses the largest amount of GLR because it is working as one of the major\
  \ organs that uptake and storage glucose in response to glucagon."
            answer: false
            explanation: "Liver does show the highest GLR mRNA in Figure 1, but glucagon's actual role in the\
  \ liver is to trigger glycogen breakdown and glucose release into the blood, raising\
  \ blood glucose, the opposite of uptake and storage. Glucose uptake and storage\
  \ by the liver is instead promoted by insulin, so the stated reasoning for liver's\
  \ high GLR is biologically backwards."
          - letter: "B"
            text: "A lack of mRNA detection in brain tissue indicates that neural tissue in the brain\
  \ does not require much glucose as a nutrient."
            answer: false
            explanation: "Brain tissue is well known to depend heavily on glucose as its primary fuel, regardless\
  \ of how much glucagon receptor it expresses; glucagon signaling and glucose requirement\
  \ are two separate things. The low measured GLR mRNA (later shown to be a detection-limit\
  \ issue, since GLR is now known to be present at low levels even in brain) says\
  \ nothing about how much glucose the brain actually needs to function."
          - letter: "C"
            text: "Skeletal muscles hold stores of glucose only used in exercise. This is consistent\
  \ with the absence of GLR from the results of this experiment."
            answer: true
            explanation: "Muscle mostly stores glycogen for its own local use during contraction and lacks\
  \ the enzyme (glucose-6-phosphatase) needed to export free glucose into the blood,\
  \ so it does not act as a glucose source for the rest of the body the way liver\
  \ does. Because glucagon's job is to mobilize glucose for release elsewhere, a tissue\
  \ that only uses its own glycogen internally has little need for glucagon receptors,\
  \ matching the very low GLR mRNA seen for muscle in Figure 1."
          - letter: "D"
            text: "Adipose tissue, which has high levels of expression of GLR, is most important energy\
  \ sources during starvation."
            answer: true
            explanation: "Figure 1 shows adipose tissue has the second-highest GLR mRNA level after liver,\
  \ consistent with glucagon strongly promoting lipolysis (breakdown of stored fat)\
  \ there. During starvation, when glucose reserves run low, mobilizing these large\
  \ fat stores for energy becomes especially important, matching adipose tissue's\
  \ high glucagon responsiveness."

      - id: q20
        number: "Q20"
        name: "Matching Muscle Energy Systems to Exercise Duration and Intensity"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=28"
        subjects:
          - name: "Muscle Physiology"
            link: "/resources/3-animal-physiology/muscle-physiology/"
          - name: "Locomotion & Energetics"
            link: "/resources/3-animal-physiology/locomotion-energetics/"
        statements:
          - letter: "A"
            text: "Athletes running a 100-meter sprint are supposed to run using ATP originally stored\
  \ in muscle cells during the former half. During the last half, ATP produced by\
  \ respiration is used."
            answer: false
            explanation: "Table 1 shows stored ATP alone only sustains the very high sprint speed for a few\
  \ seconds, far less than a full 100 m race, and that creatine phosphate (CP) is\
  \ the pathway that can regenerate ATP fast enough to sustain a comparable sprint\
  \ speed for longer. Aerobic respiration is too slow to supply the very high power\
  \ output needed throughout a 100 m sprint, so the second half is powered mainly\
  \ by the ATP-CP system, not by ATP from cellular respiration."
          - letter: "B"
            text: "It is possible that marathon runners continue exercising using muscle tissue without\
  \ ATP."
            answer: false
            explanation: "ATP is the direct, universal energy currency that powers the actin-myosin cross-bridge\
  \ cycle in every muscle contraction, regardless of which fuel (glycogen or fat)\
  \ is used to regenerate it. No form of sustained muscle contraction, including marathon\
  \ running, can occur without ATP itself being consumed."
          - letter: "C"
            text: "A crucial point for middle-distance runners of 1,500 m is switching smoothly from\
  \ running with CP to that with ATP produced by aerobic breathing."
            answer: true
            explanation: "Table 1 shows CP is depleted within roughly 10-17 seconds, far short of the several\
  \ minutes a 1,500 m race takes, so CP alone cannot sustain the whole race. Because\
  \ the race is too long for anaerobic stores alone but demands more power than a\
  \ slow jog, a smooth handoff to sustained ATP supply from aerobic respiration (with\
  \ glycolysis bridging the gap) is critical for maintaining pace."
          - letter: "D"
            text: "Similar to bird migration, stored fat is one of the major energy sources for long-distance\
  \ runners, although it has some metabolic delay for conversion into ATP."
            answer: true
            explanation: "Table 1 shows fat yields by far the largest total energy reserve and supports long\
  \ exercise durations, matching its role fueling both migrating birds and marathon\
  \ runners. However, because fat must be mobilized and oxidized through beta-oxidation,\
  \ a slower multi-step process than glycogen breakdown, its ATP output ramps up with\
  \ some delay compared to faster carbohydrate-based systems."

      - id: q21
        number: "Q21"
        name: "Huntingtin, Glycolytic ATP and Fast Axonal Transport"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=29"
        subjects:
          - name: "Cytoskeleton & Motor Proteins"
            link: "/resources/1-cell-molecular/cytoskeleton-motor-proteins/"
          - name: "Human Nervous System"
            link: "/resources/2-animal-anatomy/human-nervous-system/"
        statements:
          - letter: "A"
            text: "Near the N-terminal end of HTT molecules in HD patients, there is a larger number\
  \ of glutamine repeats compared to that in healthy individuals."
            answer: true
            explanation: "The CAG repeat expansion sits near the transcriptional start of the HTT gene, which\
  \ corresponds to the N-terminal end of the translated protein, and CAG codes for\
  \ glutamine. Since HD patients have 35-75 repeats compared to 9-35 in healthy individuals,\
  \ HD patients' HTT protein carries a longer stretch of glutamines near its N-terminus."
          - letter: "B"
            text: "It is possible that HTT helps to anchor GAPDH and motor proteins to synaptic vesicles."
            answer: true
            explanation: "HTT, the motor proteins (kinesin/dynein), and GAPDH were all shown to co-localize\
  \ together specifically on synaptic vesicles, and losing HTT (via RNAi) selectively\
  \ abolished synaptic vesicle transport. This pattern is consistent with HTT acting\
  \ as a scaffold that physically links the motor proteins and GAPDH to the vesicle\
  \ surface, though the data show co-localization and functional dependence rather\
  \ than direct proof of physical anchoring."
          - letter: "C"
            text: "ATP produced by mitochondria is not efficiently used for FAT of synaptic vesicles,\
  \ even though it can maintain a sufficiently high ATP concentration within axons."
            answer: true
            explanation: "Table 1 shows that iodoacetate (which blocks glycolysis) sharply reduces synaptic\
  \ vesicle transport while pyruvate is included specifically to keep mitochondrial\
  \ ATP production running, and overall axonal ATP/ADP ratio stays above 80% throughout.\
  \ This means synaptic vesicle FAT collapses even when plenty of mitochondrially-produced\
  \ ATP is available in the axon, showing that pool of ATP is not efficiently accessible\
  \ to power synaptic vesicle transport."
          - letter: "D"
            text: "ATP produced by glycolysis is crucial for the FAT of mitochondria."
            answer: false
            explanation: "Table 1 shows that iodoacetate, which blocks the glycolytic enzyme GAPDH, has little\
  \ effect on mitochondrial FAT velocities (values stay close to control), unlike\
  \ its strong effect on synaptic vesicle transport. This indicates mitochondrial\
  \ transport instead relies on the ATP mitochondria themselves produce (blocked by\
  \ oligomycin), not on glycolytic ATP."

      - id: q22
        number: "Q22"
        name: "Nephron Structure and Urine Concentrating Ability Across Habitats"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=31"
        subjects:
          - name: "Human Excretory System"
            link: "/resources/2-animal-anatomy/human-excretory-system/"
          - name: "Comparative Osmoregulation & Excretion"
            link: "/resources/3-animal-physiology/comparative-osmoregulation-excretion/"
        statements:
          - letter: "A"
            text: "Beavers seem not to possess the cortex type nephron."
            answer: false
            explanation: "Beavers live in a freshwater/land habitat and produce very dilute urine (520 mOsm/L),\
  \ the lowest of all listed species, which fits a kidney dominated by short-loop\
  \ cortical nephrons rather than one lacking them entirely. Having essentially no\
  \ urine-concentrating ability is consistent with relying mostly on cortex-type nephrons,\
  \ not with lacking them."
          - letter: "B"
            text: "The JM/C ratio of the kangaroo rat is estimated at 1.5 or more."
            answer: true
            explanation: "The kangaroo rat is a dry-habitat species with the highest listed urine concentration\
  \ (5500 mOsm/L), and the graph groups the highest urine-concentration species (the\
  \ >4000 mOsm/L bracket) at JM/C ratios all above 1.5. Since kangaroo rat urine concentration\
  \ falls in that top bracket, its JM/C ratio is expected to be 1.5 or higher as well."
          - letter: "C"
            text: "Longer Henle loops can efficiently reabsorb salts, resulting in urine concentration."
            answer: true
            explanation: "A longer Henle loop, characteristic of juxtamedullary nephrons, builds up a steeper\
  \ and deeper medullary osmotic gradient through more extensive countercurrent salt\
  \ reabsorption. This deeper gradient is what lets the collecting duct draw more\
  \ water back out of the urine, producing more concentrated urine, matching the pattern\
  \ of higher JM/C ratios pairing with higher urine concentrations across species."
          - letter: "D"
            text: "Animals living in dry regions have a higher proportion of cortex type nephrons than\
  \ those living in freshwater."
            answer: false
            explanation: "The table and graph show dry-habitat species (kangaroo rat, eland, camel) cluster\
  \ at high JM/C ratios, meaning they have proportionally more juxtamedullary (long-loop)\
  \ nephrons, not more cortex-type ones. The beaver, a freshwater/land species, instead\
  \ sits at the low end, consistent with relying more on cortex-type nephrons."

      - id: q23
        number: "Q23"
        name: "GABA-Induced Chloride Currents and Depolarization in a Hypothalamic Neuron"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=32"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "When the membrane potential was -10 mV, the application of GABA induced the depolarization\
  \ of the recorded neuron."
            answer: false
            explanation: "Table 1 gives the chloride equilibrium potential as -28 mV, which is more negative\
  \ than -10 mV, so opening Cl- channels at -10 mV would drive the membrane potential\
  \ toward -28 mV, that is, hyperpolarization, not depolarization. Figure 3 is consistent\
  \ with this, showing the current reverses direction (from inward to outward) somewhere\
  \ near -28 mV rather than continuing to depolarize at -10 mV."
          - letter: "B"
            text: "The equilibrium potential of chloride ions was more positive (less negative) than\
  \ the resting membrane potential of the recorded neuron."
            answer: true
            explanation: "The resting potential of this neuron is roughly -50 mV (the baseline seen before\
  \ GABA application in Figure 1), while Table 1 gives the Cl- equilibrium potential\
  \ as -28 mV. Since -28 mV is less negative than -50 mV, chloride's equilibrium potential\
  \ is indeed more positive than the resting potential, which is exactly why opening\
  \ Cl- channels here depolarizes rather than hyperpolarizes the cell toward action-potential\
  \ threshold."
          - letter: "C"
            text: "Under the presence of tetrodotoxin (pufferfish toxin that blocks the generation of\
  \ action potentials), the higher concentration of GABA depolarized the neuron more\
  \ positively than 0mV."
            answer: false
            explanation: "With action potentials blocked by tetrodotoxin, GABA can only push the membrane potential\
  \ toward the chloride equilibrium potential of about -28 mV, since that is the reversal\
  \ point the GABA-gated Cl- current is driving toward. No amount of increased GABA\
  \ concentration can depolarize the cell past its own Cl- equilibrium potential,\
  \ so it cannot reach a value more positive than 0 mV."
          - letter: "D"
            text: "The researcher recorded other neurons. The neurons hyperpolarized their membrane\
  \ potentials by GABA. If the resting membrane potential of both neurons are the\
  \ same, intracellular chloride ion concentration of the hyperpolarized neurons is\
  \ lower than those of the neurons observed in Figure 1-4."
            answer: true
            explanation: "In the original neuron, GABA depolarizes because the Cl- equilibrium potential (-28\
  \ mV) sits above the resting potential, which happens because intracellular Cl-\
  \ is relatively high. For a second neuron with the same resting potential to instead\
  \ be hyperpolarized by GABA, its Cl- equilibrium potential must sit below the shared\
  \ resting potential, which by the Nernst relationship requires that neuron to have\
  \ a lower intracellular Cl- concentration than the first."

      - id: q24
        number: "Q24"
        name: "Nuclear-to-Cytoplasmic Ratio and the Midblastula Transition in Xenopus"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=34"
        subjects:
          - name: "Cell Cycle, Mitosis & Meiosis"
            link: "/resources/1-cell-molecular/cell-cycle-mitosis-meiosis/"
        statements:
          - letter: "A"
            text: "This experiment indicates that that MBT occurs when the volume ratio of nucleus/cytoplasm\
  \ is high."
            answer: true
            explanation: "Because cell size is held constant in both treatments while only nuclear size is\
  \ changed, increasing nuclear size (raising the nucleus/cytoplasm ratio) makes MBT\
  \ happen earlier, and decreasing nuclear size (lowering that ratio) makes MBT happen\
  \ later. This direct correlation between nuclear/cytoplasmic volume ratio and MBT\
  \ timing supports the idea that MBT is triggered once that ratio crosses a threshold."
          - letter: "B"
            text: "When MBT occurs before the 12th cleavage stage, the duration from the fertilization\
  \ to the 12th cleavage stage is reduced."
            answer: false
            explanation: "The stem states explicitly that these treatments do not alter the time required for\
  \ each individual cleavage, and once MBT occurs the cell cycle gains a normal interphase\
  \ (making each subsequent division take longer, not shorter). If anything, triggering\
  \ MBT earlier lengthens the remaining cycles before reaching cleavage 12, so the\
  \ total time to reach the 12th cleavage would not be reduced."
          - letter: "C"
            text: "The timing of MBT depends on the number of divisions after fertilization."
            answer: false
            explanation: "In both experiments, MBT is shifted earlier or later than the normal 12th cleavage\
  \ purely by changing nuclear size, without changing anything about the cleavage\
  \ schedule itself. This shows MBT timing is not fixed to a set count of divisions\
  \ but instead tracks the nuclear/cytoplasmic ratio, which can be manipulated independently\
  \ of division number."
          - letter: "D"
            text: "These results indicate that MBT occurs when the amount of histone per nucleus is\
  \ greater than a certain value (Note: No manipulations performed in this experiment\
  \ affect amount of histone)."
            answer: false
            explanation: "Since the total amount of histone is unaffected by these manipulations while nuclear\
  \ volume is deliberately changed, a larger nucleus holding the same amount of histone\
  \ actually means a lower histone concentration per nucleus, yet this is the condition\
  \ that makes MBT occur earlier. This is the opposite of what the 'histone amount\
  \ per nucleus must exceed a threshold' model would predict, so the results argue\
  \ against it, matching a model based on nuclear/cytoplasmic volume ratio (or histone\
  \ dilution) instead."

      - id: q25
        number: "Q25"
        name: "beta-catenin and GSK3beta in Xenopus Dorsal Organizer Formation"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=35"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "This experiment shows that GSK3beta inhibited organizer formation."
            answer: true
            explanation: "Injecting GSK3beta into the dorsal side, where the organizer normally forms, produces\
  \ a head defect, exactly the phenotype expected when organizer formation is disrupted.\
  \ This shows extra GSK3beta activity on the dorsal side interferes with the organizer's\
  \ normal formation there."
          - letter: "B"
            text: "This experiment shows that GSK3beta inhibits beta-cat activity."
            answer: true
            explanation: "beta-cat injected alone on the ventral side (where the organizer does not normally\
  \ form) is enough to induce a secondary head/axis, but co-injecting GSK3beta together\
  \ with beta-cat abolishes this effect. This loss of beta-cat's ability to induce\
  \ a secondary axis when GSK3beta is also present indicates GSK3beta acts to suppress\
  \ beta-cat's activity."
          - letter: "C"
            text: "This experiment shows that beta-cat is not expressed in ventral region."
            answer: false
            explanation: "Injecting DN GSK3beta (which blocks GSK3beta) into the ventral side is sufficient\
  \ to induce a secondary head, and since DN GSK3beta only works by protecting/activating\
  \ whatever beta-cat is already present, this result actually implies endogenous\
  \ beta-cat protein is available on the ventral side. So the data argue beta-cat\
  \ is present ventrally (just normally kept inactive by GSK3beta) rather than absent\
  \ there."
          - letter: "D"
            text: "This experiment shows that GSK3beta works downstream of beta-cat."
            answer: false
            explanation: "The epistasis result (beta-cat + GSK3beta co-injection having no effect, canceling\
  \ beta-cat's normal effect) instead places GSK3beta upstream of, or acting directly\
  \ on, beta-cat, GSK3beta suppresses beta-cat's activity rather than being regulated\
  \ by it. If GSK3beta acted downstream of beta-cat, blocking beta-cat's target GSK3beta\
  \ would not be expected to cancel beta-cat's own dorsalizing/secondary-axis-inducing\
  \ effect in this way."

      - id: q26
        number: "Q26"
        name: "Thermoregulatory Strategies of Endotherms and Ectotherms"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=36"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "A"
            text: "In each ordinary habitat, the body temperature of endotherms is always higher than\
  \ that of ectotherms."
            answer: false
            explanation: "Many ectotherms bask in the sun or otherwise behaviorally thermoregulate to raise\
  \ their body temperature, and some (like a basking lizard, or the incubating python\
  \ mentioned in statement C) can reach body temperatures comparable to or higher\
  \ than typical endotherm body temperatures. The word 'always' overstates a real\
  \ but not universal tendency, since ectotherm body temperature depends heavily on\
  \ external conditions and behavior."
          - letter: "B"
            text: "In humans, the body temperature is elevated when the temperature of the hypothalamus\
  \ is artificially increased."
            answer: false
            explanation: "The hypothalamus is the body's thermostat, and it works by sensing a rise in its\
  \ own temperature as a signal that the body is too warm, triggering heat-loss responses\
  \ (like sweating and vasodilation) to bring the body temperature back down. So artificially\
  \ warming the hypothalamus should trigger cooling responses and lower body temperature,\
  \ not raise it."
          - letter: "C"
            text: "When a female Burmese python incubates eggs, her oxygen consumption in a cold room\
  \ is less than that in warm room."
            answer: false
            explanation: "Incubating female pythons are known to generate metabolic heat by shivering thermogenesis\
  \ to keep their eggs warm, and this heat-generating effort has to work harder, consuming\
  \ more oxygen, when the surrounding room is colder. So oxygen consumption in a cold\
  \ room would be higher, not less, than in a warm room."
          - letter: "D"
            text: "Ectotherms require less energy than endotherms for homeostasis."
            answer: true
            explanation: "Ectotherms rely mainly on external heat sources to regulate their body temperature\
  \ rather than generating most of their own heat metabolically, unlike endotherms\
  \ which burn substantial internal fuel just to maintain a constant body temperature.\
  \ This reliance on ambient heat instead of self-generated heat is why ectotherms\
  \ typically have much lower overall energy requirements for homeostasis."

      - id: q27
        number: "Q27"
        name: "Finding the Minimal Reprogramming Gene Set for Fibroblasts"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=37"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "These results show that colonies can be formed through the introduction of genes\
  \ 14, 15, and 20 into the fibroblast together."
            answer: false
            explanation: "This drop-one-out experiment only ever tests 23 genes at a time (all genes except\
  \ one), so it never actually tests introducing just genes 14, 15, and 20 alone together.\
  \ Without that specific combination having been tested, this experiment cannot show\
  \ that those three genes alone are sufficient to form colonies."
          - letter: "B"
            text: "These results show that gene 14, gene15, and gene 20 are required for colony formation."
            answer: true
            explanation: "Removing gene 14, gene 15, or gene 20 individually (leaving the other 23 genes) each\
  \ causes a large drop in colony number compared to the 'All' condition, unlike removing\
  \ most other genes. This shows each of these three genes is individually necessary\
  , its absence substantially impairs colony formation even when all other 23 genes\
  \ are present."
          - letter: "C"
            text: "These results show that the colony number is the highest when gene 9 is introduced\
  \ into the fibroblast."
            answer: false
            explanation: "The long bar for condition 9 (excluding gene 9) actually indicates that removing\
  \ gene 9 does not reduce colony number much, or even increases it, meaning gene\
  \ 9 is unnecessary or even inhibitory. This tells us about the effect of leaving\
  \ gene 9 out, not that including gene 9 specifically maximizes colony number."
          - letter: "D"
            text: "This experiment alone is not sufficient to find the minimum gene set needed to induce\
  \ colonies."
            answer: true
            explanation: "This drop-one-out design only identifies which of the 24 genes are individually necessary;\
  \ it cannot show which smaller combination of the identified essential genes is\
  \ actually sufficient on its own to induce colonies. Confirming a true minimal set\
  \ requires directly testing smaller combinations (such as just genes 14, 15, and\
  \ 20 together), which this experiment does not do."
          - letter: "E"
            text: "These results show that genes 14, 15, and 20 are expressed in fibroblast cells."
            answer: false
            explanation: "This experiment only tests the effect of experimentally introducing these genes into\
  \ fibroblasts and reading out colony formation; it provides no data at all on whether\
  \ fibroblasts already express these genes endogenously. Showing that a gene is required\
  \ when deliberately added says nothing about its native expression status in the\
  \ starting fibroblast cells."

      - id: q28
        number: "Q28"
        name: "Southern Blot Evidence for Immunoglobulin Light-Chain Gene Rearrangement"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=38"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "The immunoglobulin light chain gene contained in the embryo center cells is shorter\
  \ than that in the myeloma cells."
            answer: false
            explanation: "Migration distance on a gel reflects fragment length, but this experiment measures\
  \ which restriction fragments hybridize to the labeled mRNA probes, not the overall\
  \ length of the gene itself. Figure 2's differing hybridization patterns between\
  \ embryo center and myeloma DNA reflect that different genomic fragments carry the\
  \ light-chain sequence (due to V(D)J recombination), not that one cell type's gene\
  \ is simply shorter than the other's."
          - letter: "B"
            text: "The running distance depends on the length of DNA hybridized with mRNA."
            answer: true
            explanation: "In agarose gel electrophoresis, smaller DNA fragments migrate farther through the\
  \ gel than larger ones under a given field, which is the basic physical principle\
  \ the whole assay relies on. So the running distance of each hybridizing band in\
  \ Figure 2 directly reflects the length of that particular restriction fragment."
          - letter: "C"
            text: "The nucleotide sequence of DNA region hybridized with 3'-end mRNA is different between\
  \ the myeloma-derived DNA and the embryo center-derived DNA."
            answer: false
            explanation: "The constant (3') region of the immunoglobulin light-chain gene is the part that\
  \ does NOT get rearranged during V(D)J recombination, recombination affects the\
  \ variable region joining, not the constant-region sequence itself. So the DNA sequence\
  \ that the 3'-end mRNA probe hybridizes to should be the same in myeloma and embryo-center-derived\
  \ DNA, even though the surrounding restriction fragment context can differ."
          - letter: "D"
            text: "The full-length immunoglobulin light chain mRNA isolated from myeloma cells contains\
  \ sequences from two different parts of the DNA genome of the embryo center cells."
            answer: true
            explanation: "Figure 2 shows the full-length mRNA probe hybridizing to two separate peaks/fragments\
  \ in the embryo-center (unrearranged, germline) DNA, consistent with the variable\
  \ and constant gene segments still being physically separated before V(D)J recombination\
  \ joins them. This matches how immunoglobulin genes are known to be assembled: the\
  \ mature, full-length mRNA sequence draws on two genomic regions that are far apart\
  \ before rearrangement and become joined together only in cells (like the myeloma's\
  \ precursor) that have already undergone recombination."

      - id: q29
        number: "Q29"
        name: "Stomatal Aperture Responses to Humidity in Air versus Helox"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=40"
        subjects:
          - name: "Stomatal Physiology & Gas Exchange"
            link: "/resources/5-plant-physiology/stomatal-physiology-gas-exchange/"
        statements:
          - letter: "A"
            text: "Stomata respond to the absolute humidity of the air."
            answer: false
            explanation: "The Air and Helox conditions share the same deltaw (absolute humidity difference)\
  \ yet Figure 1 shows relative stomatal aperture differs substantially between them,\
  \ which absolute humidity alone cannot explain. Since dwater (diffusion rate), not\
  \ just humidity, differs between Air and Helox, the stomatal response must be tracking\
  \ something beyond absolute humidity itself, such as the actual transpirational\
  \ water loss rate."
          - letter: "B"
            text: "Transpiration is higher in Helox air than that in normal air at the same humidity."
            answer: false
            explanation: "Even though dwater is 2.33 times higher in Helox than normal air (at the same deltaw),\
  \ Figure 1 shows relative stomatal aperture in Helox is correspondingly about 2.33\
  \ times smaller than in normal air. Since transpiration rate is proportional to\
  \ the product of dwater, deltaw, and aperture, the higher dwater is offset by the\
  \ smaller aperture, keeping transpiration the same, not higher, in Helox versus\
  \ normal air at equal humidity."
          - letter: "C"
            text: "Stomatal response to low humidity decreases the photosynthetic assimilation rate."
            answer: true
            explanation: "As humidity decreases, Figure 1 shows stomatal aperture also decreases, and a smaller\
  \ stomatal aperture restricts CO2 uptake into the leaf along with water vapor loss.\
  \ Since photosynthesis depends on the CO2 concentration available inside the leaf,\
  \ this CO2-limiting closure response reduces the rate of photosynthetic carbon assimilation."
          - letter: "D"
            text: "Stomatal response to low humidity keeps the water loss constant."
            answer: true
            explanation: "Across the different deltaw conditions in Figure 1, relative stomatal aperture changes\
  \ in a way that offsets the change in deltaw, so that the product determining transpiration\
  \ rate stays roughly the same. This shows the stomatal response actively compensates\
  \ for humidity changes specifically to hold the plant's water-loss rate constant."

      - id: q30
        number: "Q30"
        name: "Systemin and Jasmonate Signaling in the Tomato Wound Response"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=41"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "Perception of systemin in the proximity of the wound site is required for the expression\
  \ of protease inhibitor genes in leaves distant from the wound site."
            answer: true
            explanation: "When a wild-type scion is grafted onto a spr1 (systemin-insensitive) stock and the\
  \ stock is wounded, Table 1 shows no protease inhibitor expression occurs in the\
  \ distant, undamaged scion. Since the only defect is the stock's inability to perceive\
  \ systemin at the wound site, this shows that perceiving systemin right at the wound\
  \ is necessary for triggering the long-distance signal."
          - letter: "B"
            text: "Jasmonate synthesis required for protease inhibitor gene expression takes place in\
  \ the proximity of the wound site."
            answer: true
            explanation: "Grafting a wild-type scion onto an spr2 (jasmonate-synthesis-deficient) stock and\
  \ wounding the stock produces no protease inhibitor expression in the distant scion,\
  \ even though the scion itself can make jasmonate normally. This shows jasmonate\
  \ must specifically be synthesized at the wound site itself (in the stock) for the\
  \ long-distance signal to be generated."
          - letter: "C"
            text: "Perception of jasmonate in the proximity of the wound site is required for the expression\
  \ of protease inhibitor genes in leaves distant from the wound site."
            answer: false
            explanation: "When a jai1 (jasmonate-insensitive) stock is wounded but grafted to a wild-type scion,\
  \ Table 1 shows the distant scion still expresses protease inhibitor genes, even\
  \ though the stock at the wound site cannot perceive jasmonate. This shows that\
  \ jasmonate perception right at the wound site is not required for the distant response,\
  \ only jasmonate synthesis there (as in statement B) is."
          - letter: "D"
            text: "Systemin is likely to be the mobile signaling molecule responsible for long-distance\
  \ wound signaling."
            answer: false
            explanation: "Grafting an spr1 (systemin-insensitive) scion onto a wild-type stock still allows\
  \ protease inhibitor expression in the scion after the stock is wounded, showing\
  \ the scion does not need to perceive systemin itself to respond. This means the\
  \ mobile long-distance signal cannot be systemin, since a scion unable to perceive\
  \ systemin still responds normally, implicating a different mobile signal (consistent\
  \ with jasmonate or a related derivative) instead."

      - id: q31
        number: "Q31"
        name: "Grafting Analysis of Strigolactone Biosynthesis and Perception in MAX Mutants"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=43"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "A"
            text: "The MAX2 gene mainly functions in the root."
            answer: false
            explanation: "Figure 3 shows that whichever side (shoot or root) carries a functional MAX2 determines\
  \ whether branching is controlled normally, and specifically it is the shoot's own\
  \ MAX2 genotype that sets the branching phenotype. Since neither MAX gene products\
  \ move across the graft junction, this localizes MAX2's relevant, branching-controlling\
  \ function to the shoot, not the root."
          - letter: "B"
            text: "SL is synthesized both in the root and shoot."
            answer: true
            explanation: "Figure 3 shows that grafting a max1 shoot scion onto a wild-type rootstock still\
  \ gives normal branching, meaning SL made in the root alone can be transported to\
  \ the shoot to control branching. Since a max1 mutation only blocks the final MAX1\
  \ step and each organ can otherwise complete SL synthesis on its own side of the\
  \ graft, functional SL synthesis capability exists in both the root and the shoot."
          - letter: "C"
            text: "CL, the substrate of MAX1, is transported between the root and shoot in either direction."
            answer: false
            explanation: "Grafting a max4 shoot scion (unable to make CL) onto a max1 rootstock (unable to\
  \ convert CL to SL, but able to make CL) gives normal branching, showing CL made\
  \ in the root is transported up to the shoot. But grafting a max1 shoot scion onto\
  \ a max4 rootstock instead gives a hyper-branching phenotype, indicating CL made\
  \ in the shoot is NOT transported down to the root, so CL movement here is one-directional\
  \ (root to shoot), not bidirectional."
          - letter: "D"
            text: "If a shoot scion of max4 is grafted on a rootstock of max2, shoot branching will\
  \ be normal."
            answer: true
            explanation: "Since MAX2 functions in the shoot (as established in statement A), a max2 rootstock's\
  \ own MAX2 status is irrelevant to branching control, effectively leaving the shoot's\
  \ SL perception intact via the shoot's own tissue. With MAX2 perception undisturbed\
  \ in the shoot, and CL/SL still able to reach the shoot from the max2 root (whose\
  \ SL biosynthesis genes are intact) exactly as in the analogous max4-shoot/WT-root\
  \ graft, branching is expected to be controlled normally."

      - id: q32
        number: "Q32"
        name: "Zinc and Iron Interactions in Arabidopsis Micronutrient Toxicity"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=45"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "Zn accumulation in the shoot shows a stronger correlation to growth defects than\
  \ the correlation shown by Zn accumulation in the root."
            answer: false
            explanation: "Comparing panels (a)/(b) (growth/dry weight, which worsens with excess Zn) against\
  \ panel (c), it is the root Zn content, not shoot Zn content, that tracks most closely\
  \ with the pattern of growth impairment across the Fe2+ treatments. Shoot Zn content\
  \ stays comparatively less responsive to the added Fe2+ that rescues growth, so\
  \ root Zn accumulation better correlates with the growth defect."
          - letter: "B"
            text: "The growth defect caused by excess Zn2+ in the culture medium is mitigated by the\
  \ addition of Fe2+."
            answer: true
            explanation: "Panels (a) and (b) show that plants grown with excess Zn2+ but supplemented with\
  \ additional Fe2+ recover more of their normal growth and dry weight than those\
  \ given excess Zn2+ alone. This shows that adding extra Fe2+ counteracts, at least\
  \ partially, the toxicity caused by excess Zn2+."
          - letter: "C"
            text: "High concentrations of Fe2+ in the culture medium suppresses Zn2+ uptake by the root."
            answer: true
            explanation: "Panel (c) shows that root Zn content decreases as additional Fe2+ concentration increases,\
  \ at a given level of added Zn2+. This inverse relationship indicates that Fe2+\
  \ competes with or otherwise suppresses Zn2+ uptake at the root."
          - letter: "D"
            text: "Total Zn amount in the shoot is not affected by the addition of Fe2+ in the medium."
            answer: false
            explanation: "While panel (c) shows Zn concentration (per dry weight) in the shoot barely changes\
  \ with added Fe2+, panel (b) shows that added Fe2+ increases the shoot's dry weight\
  \ (rescuing growth). Since total Zn amount is Zn concentration multiplied by dry\
  \ weight, an increased shoot dry weight at a similar Zn concentration means the\
  \ total Zn amount in the shoot does increase with added Fe2+."

      - id: q33
        number: "Q33"
        name: "A CYCLOIDEA-like Gene Controlling Floral Symmetry in Sunflower"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=46"
        subjects:
          - name: "Flower Anatomy & Reproductive Structures"
            link: "/resources/6-plant-anatomy/flower-anatomy-reproductive-structures/"
          - name: "Evolutionary Developmental Biology (Evo-Devo)"
            link: "/resources/15-evolution/evolutionary-developmental-biology/"
        statements:
          - letter: "A"
            text: "In the wild-type sunflower, gene G' is not expressed in the florets that form early\
  \ during inflorescence development, but is expressed in the florets that form later."
            answer: false
            explanation: "Outer florets (which are ligulate, i.e. bilateral, indicating gene G' activity by\
  \ analogy to snapdragon) develop earlier than inner florets in the typical Compositae\
  \ developmental sequence, and the bilateral ligulate form is the one associated\
  \ with gene G' expression. So gene G' expression is actually associated with the\
  \ earlier-forming outer florets, the opposite of what this statement claims."
          - letter: "B"
            text: "In variant x, expression of gene G' is decreased due to the DNA insertion."
            answer: false
            explanation: "Variant x has ligulate (bilateral) florets across the ENTIRE inflorescence, including\
  \ the inner region that is normally tubular (radial) in wild type, which suggests\
  \ gene G' activity (associated with bilateral symmetry) has actually spread rather\
  \ than been lost. This pattern is more consistent with increased/expanded G' expression\
  \ in variant x, not decreased expression."
          - letter: "C"
            text: "Variant y is a loss-of-function mutant of gene G'."
            answer: true
            explanation: "Variant y has only tubular (radially symmetric) florets across the whole inflorescence,\
  \ meaning the bilateral-symmetry-conferring activity of gene G' is completely absent\
  \ everywhere, consistent with a full loss of gene G' function. This matches the\
  \ same logic given for gene G in snapdragon, where losing the gene converts bilateral\
  \ flowers to radial ones."
          - letter: "D"
            text: "Variant y is more closely related to variant x than to variant z in the lineage of\
  \ sunflower variants."
            answer: true
            explanation: "Figure 2 shows variant y shares one of its two DNA insertions with variant x, while\
  \ variant y and variant z do not share any common insertion. Sharing a derived insertion\
  \ mutation with x but not with z indicates a closer evolutionary relationship (more\
  \ recent common ancestry) between y and x than between y and z."

      - id: q34
        number: "Q34"
        name: "Resource Sharing Between Stolon-Connected Ramets of Fragaria chiloensis"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=47"
        subjects:
          - name: "Phloem Transport & Translocation"
            link: "/resources/5-plant-physiology/phloem-transport-translocation/"
        statements:
          - letter: "A"
            text: "Shoot/root ratio of the connected ramet provided with high PFD and low nitrogen was\
  \ higher than that of the severed ramet provided with high PFD and low nitrogen."
            answer: true
            explanation: "A severed ramet under high PFD but low nitrogen is nitrogen-limited, so on its own\
  \ it must adaptively invest more in root growth (lowering its shoot/root ratio)\
  \ to scavenge for scarce nitrogen at the cost of light capture. A connected ramet\
  \ in the same high-PFD/low-nitrogen condition instead receives extra nitrogen shared\
  \ from its partner ramet, relieving that nitrogen limitation and removing the need\
  \ to over-invest in roots, leaving it with a comparatively higher shoot/root ratio."
          - letter: "B"
            text: "In the severed ramet provided with low PFD and high nitrogen, PFD was not a limiting\
  \ factor for plant growth."
            answer: false
            explanation: "A ramet under low PFD already has restricted light for photosynthesis, and having\
  \ abundant nitrogen does not remove that specific light constraint. In this low-PFD/high-nitrogen\
  \ condition, PFD (light), not nitrogen, is the limiting factor for growth."
          - letter: "C"
            text: "Severing of stolons does not affect the combined dry mass of ramets when resources\
  \ (i.e. PFD and nitrogen) are distributed uniformly."
            answer: true
            explanation: "The 54% growth benefit of connection specifically comes from resource exchange compensating\
  \ for the deliberately unequal PFD/nitrogen distribution used in this experiment's\
  \ paired ramets. If both ramets already received the same, uniform levels of PFD\
  \ and nitrogen, neither would have a surplus to share with the other, so cutting\
  \ the stolon connection would have little effect on total biomass."
          - letter: "D"
            text: "Assimilation products and nitrogen can be translocated via stolons in Fragaria chiloensis."
            answer: true
            explanation: "The higher combined biomass of connected pairs compared to severed pairs, when each\
  \ ramet in a pair is deliberately given a complementary resource (light or nitrogen),\
  \ can only be explained if that ramet is able to share its abundant resource with\
  \ its resource-poor partner. Since stolons are the sole physical connection between\
  \ ramets, this sharing of photosynthetic assimilates and nitrogen must occur through\
  \ translocation via the stolon."

      - id: q35
        number: "Q35"
        name: "Distinguishing Osmotic and Ionic Ca2+ Signaling Mutants in Salt Stress"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=48"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "Mutant x is defective in sensing osmotic stress."
            answer: false
            explanation: "Figure 1 shows mutant x's response to sorbitol, a purely osmotic stressor, is similar\
  \ to the wild type's response. Since mutant x responds normally to a stimulus that\
  \ triggers only osmotic stress, its osmotic-stress-sensing pathway must be intact."
          - letter: "B"
            text: "Mutant y can sense ionic stress."
            answer: true
            explanation: "Figure 1 shows mutant y's [Ca2+]i response to NaCl, though reduced compared to wild\
  \ type, is still much larger than mutant x's severely blunted NaCl response (mutant\
  \ x being specifically defective in ionic-stress sensing). Since mutant y retains\
  \ a meaningfully larger ionic-stress-driven response than the ionic-stress-blind\
  \ mutant x, mutant y must still be able to sense ionic stress, with its reduced\
  \ overall NaCl response instead reflecting its osmotic-sensing defect."
          - letter: "C"
            text: "The dose-dependent [Ca2+]i increases induced by NaCl of the x y double mutant are\
  \ expected to be equivalent to those of the x single mutant."
            answer: false
            explanation: "NaCl triggers both osmotic and ionic stress pathways, and while mutant x lacks only\
  \ the ionic-sensing pathway (leaving its osmotic pathway intact), the xy double\
  \ mutant lacks both pathways entirely. Because the double mutant loses an additional\
  \ signaling route (osmotic sensing) that the x single mutant still has, the double\
  \ mutant's NaCl response should be reduced further, not equivalent to x alone."
          - letter: "D"
            text: "The dose-dependent [Ca2+]i increases induced by sorbitol of the x y double mutant\
  \ are expected to be equivalent to those of the y single mutant."
            answer: true
            explanation: "Sorbitol triggers only the osmotic-stress pathway, and mutant x is normal for osmotic\
  \ sensing (per statement A), so removing x's (osmotic-irrelevant) ionic defect from\
  \ the double mutant background changes nothing about the sorbitol response. The\
  \ double mutant's sorbitol response should therefore be governed entirely by y's\
  \ osmotic-sensing defect, making it equivalent to the y single mutant's own (compromised)\
  \ sorbitol response."

      - id: q36
        number: "Q36"
        name: "Hardy-Weinberg, Genetic Drift and Fixation Probability in a Body-Color Locus"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=49"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "Information: Species A consists of two color morphs, black and yellow, controlled\
  \ by a single locus C: the allele CB for the black type and the allele CY for the\
  \ yellow type. Statement: If the allele CB is completely dominant to the allele\
  \ CY and the frequency of the yellow type individuals is 9%, the genotype frequency\
  \ of CBCB is about 70%. Note that the population is assumed to be under Hardy-Weinberg\
  \ equilibrium."
            answer: false
            explanation: "Since yellow is recessive, its frequency (9%, i.e. q^2 = 0.09) gives q = 0.3 and\
  \ therefore p = 0.7 for the dominant CB allele. Under Hardy-Weinberg, the CBCB homozygote\
  \ frequency is p^2 = 0.49 (about 49%), not 70%, so the claimed 70% figure is incorrect\
  \ (0.7 is p, the allele frequency, not p^2, the genotype frequency)."
          - letter: "B"
            text: "Information: When the body colors of ten species belonging to the same genus with\
  \ species A were examined, they were all yellow. Statement: In this case, the body\
  \ color of the ancestral species A just after splitting from these closely related\
  \ species must have been yellow under a parsimony principle."
            answer: true
            explanation: "Under a parsimony principle, the simplest explanation requiring the fewest independent\
  \ evolutionary changes is preferred, and if all ten close relatives are uniformly\
  \ yellow, the most parsimonious inference is that yellow was already the ancestral\
  \ state shared by the whole group. Assuming the ancestor was black would require\
  \ yellow to have evolved independently and convergently many times across the ten\
  \ related species, which is a far less parsimonious scenario."
          - letter: "C"
            text: "Information: A small portion of individuals in the population of species A was isolated\
  \ due to diastrophism (large-scale deformation of Earth's crust) and formed a new\
  \ population A'. Statement: The drastic inter-generation changes of allele frequency\
  \ of locus C in population A' can be best explained by natural selection."
            answer: false
            explanation: "A' is described as arising from a small, newly isolated subset of the original population,\
  \ and small population size is exactly the condition under which random genetic\
  \ drift causes large, erratic allele frequency swings between generations. Natural\
  \ selection is a much less parsimonious explanation than drift for large, rapid\
  \ allele frequency changes specifically tied to a sudden drop in population size."
          - letter: "D"
            text: "Information: A slightly deleterious mutation with exactly the same effect on the\
  \ fitness of an individual independently occurred in both the small population A'\
  \ and the larger parental population A. Statement: The fixation probability of this\
  \ mutation is the same in both populations."
            answer: false
            explanation: "In population genetics, genetic drift is stronger in smaller populations, and drift\
  \ can overpower weak selection against a slightly deleterious mutation more easily\
  \ when the population is small. This means a slightly deleterious mutation with\
  \ identical fitness effects has a higher chance of drifting to fixation in the small\
  \ population A' than in the larger population A, so the fixation probabilities are\
  \ not the same."

      - id: q37
        number: "Q37"
        name: "Gene Duplication and Selection in Primate ECP/EDN Ribonuclease Genes"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=50"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "The most recent common ancestor of these primate species only had the EDN gene."
            answer: true
            explanation: "In Figure 1, tamarin, the most basal lineage shown, has only an EDN gene and no ECP\
  \ gene, while all the other species carry both. This pattern is best explained by\
  \ the ECP/EDN gene duplication happening after tamarin's lineage split off, meaning\
  \ the common ancestor of all these primates originally had only the single EDN-like\
  \ gene."
          - letter: "B"
            text: "It is likely that the Human, Chimpanzee, Gorilla, Orangutan, and Macaque independently\
  \ obtained the ECP gene by gene duplication."
            answer: false
            explanation: "Figure 1 shows the ECP genes of these five species form their own single clade with\
  \ one shared branch (33/3) leading back to a common ECP ancestor node, rather than\
  \ each species' ECP gene branching independently and directly from the EDN clade.\
  \ This tree topology indicates the ECP/EDN duplication happened just once in a common\
  \ ancestor of these five species, with ECP then diverging further by ordinary speciation,\
  \ not independently in each lineage."
          - letter: "C"
            text: "The number of synonymous substitutions in branches between common ancestor X and\
  \ human ECP is smaller than that between X and human EDN."
            answer: true
            explanation: "Summing the synonymous (denominator) values along the ECP path from node X to human\
  \ gives 2+1+0+0+0=3 Figure 1, while summing along the EDN path from X to human gives\
  \ 3+5+3+0+2=13 (the specific totals as read from the branch labels). The much smaller\
  \ synonymous total on the ECP side confirms this statement, since synonymous substitution\
  \ counts largely reflect elapsed time/branch length along each path from the shared\
  \ ancestor."
          - letter: "D"
            text: "During the early evolution of the ECP gene, positive selection likely operated on\
  \ mutations that enhance anti-bacterial activity."
            answer: true
            explanation: "The branch leading to the ECP ancestor (labeled 33/3 in Figure 1) shows a strikingly\
  \ high ratio of nonsynonymous (protein-changing) to synonymous substitutions compared\
  \ to other branches in the tree. Such an excess of amino-acid-changing mutations\
  \ fixed early in ECP's history is a classic signature of positive selection, plausibly\
  \ for the new anti-bacterial function that distinguishes ECP from its ribonuclease\
  \ ancestor."

      - id: q38
        number: "Q38"
        name: "Parsimony Reconstruction of Opsin Gene Evolution in Human and Zebrafish"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=51"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "In the phylogenetic tree, zebrafish SWS is most closely related to RH."
            answer: false
            explanation: "Figure 1 shows zebrafish SWS branching off at the same node as the whole RH/MWS clade\
  \ (the four zebrafish MWS genes and RH), making zebrafish SWS equally related to\
  \ RH as it is to each of the MWS genes, not specifically closer to RH alone. Describing\
  \ it as 'most closely related' to RH in particular misrepresents this branching\
  \ pattern, where SWS is an outgroup to the whole RH+MWS group rather than paired\
  \ with RH specifically."
          - letter: "B"
            text: "The common ancestor of the human and zebrafish had four opsin genes in the genome."
            answer: false
            explanation: "Under the most parsimonious reconstruction of Figure 1, the deepest node marked I\
  \ (shared by both lineages) already needs to account for the ancestors of the RH/MWS,\
  \ SWS, UVS/LWS lineages, implying the shared ancestor carried five distinct opsin\
  \ gene lineages, not four. Reconstructing only four ancestral genes would require\
  \ additional, less parsimonious independent gene-origin events to explain all the\
  \ genes seen in the tree today."
          - letter: "C"
            text: "The opsin gene at node I was supposed to encode an LWS."
            answer: true
            explanation: "Node I sits directly at the base of the clade containing zebrafish LWS1, LWS2, human\
  \ LWS, and human MWS, all of which are long/middle wavelength-sensitive opsins descending\
  \ from a single ancestral gene. Under parsimony, the simplest reconstruction is\
  \ that this shared ancestral gene at node I already functioned as an LWS-type opsin,\
  \ with MWS arising later by duplication and divergence."
          - letter: "D"
            text: "The zebrafish has acquired five opsin genes after splitting from the human."
            answer: false
            explanation: "Comparing the zebrafish-specific genes in Figure 1 (MWS1-4 and LWS2, arising from\
  \ lineage-specific duplications since the split) totals four zebrafish-specific\
  \ genes gained after the split with human, not five. Overcounting here would require\
  \ miscounting either the MWS or LWS duplication events shown in the tree."
          - letter: "E"
            text: "The human has lost two opsin genes after splitting from the zebrafish."
            answer: true
            explanation: "Under the most parsimonious reconstruction, the shared ancestor at node I already\
  \ carried five opsin gene lineages (RH/MWS-type, SWS, UVS, and the LWS/MWS-type\
  \ lineages), but the human genome shown here retains only RH, SWS, LWS and human\
  \ MWS, and lacks a UVS-type gene along with one further ancestral lineage represented\
  \ in zebrafish. Explaining the human complement from that ancestral set requires\
  \ two gene losses in the human lineage since the split from zebrafish."
          - letter: "F"
            text: "The common ancestor of the human and zebrafish did not have any SWS in the genome."
            answer: false
            explanation: "Both zebrafish and human retain a distinct SWS-type opsin gene in Figure 1 branching\
  \ from a shared ancestral SWS lineage node, which under parsimony is best explained\
  \ by the shared ancestor already having an SWS-type gene that both lineages inherited.\
  \ The alternative, that SWS was independently gained twice, is a less parsimonious\
  \ explanation requiring two separate origin events instead of one shared ancestral\
  \ one."

      - id: q39
        number: "Q39"
        name: "MC1R Alleles and Coat-Color Adaptation in Peromyscus polionotus"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=52"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "In addition to the MC1R gene, other genes are likely to be involved in the body color\
  \ of these subspecies."
            answer: true
            explanation: "Figure 1's pie charts show the light-associated C allele is not fixed (not at 100%)\
  \ even in the light-colored dune populations, meaning some mice carrying little\
  \ or no C allele still display the lighter coat phenotype seen in those populations.\
  \ If MC1R genotype alone fully explained coat color, the C allele would need to\
  \ be fixed in the light populations, so this incomplete association implies other\
  \ genes also contribute to body color."
          - letter: "B"
            text: "The dark color coat population is likely to have emerged from the light color coat\
  \ population."
            answer: false
            explanation: "The mainland (dark-coated) population is the ancestral, long-established Florida\
  \ mainland population, while the light-colored dune populations occupy dune habitats\
  \ estimated at only about 6,000 years old, a comparatively very recent age. This\
  \ timeline instead indicates the light-coated dune populations diverged recently\
  \ from the older, ancestral dark mainland population, not the other way around."
          - letter: "C"
            text: "It is likely that the C alleles (65th amino acid residue is C) of each population\
  \ (1) to (3) results from an independent mutation."
            answer: false
            explanation: "This C-allele mutation is described as having occurred only a single time (a single\
  \ point origin), with its varying present-day frequencies across the three dune\
  \ localities in Figure 1 arising afterward through migration and changes in allele\
  \ frequency (drift/selection) between already-connected populations. Since it is\
  \ one mutational origin spreading and changing frequency across localities, rather\
  \ than several independent origin events, this statement is false."
          - letter: "D"
            text: "In Figure 2, the white circle and white triangle represent R and C alleles, respectively."
            answer: true
            explanation: "Figure 2 plots the cAMP response of cultured cells expressing either the R- or C-allele\
  \ version of the MC1R protein, and matching each curve's identity (open circle vs\
  \ open triangle) to which allele it represents is a direct figure-reading task the\
  \ question intends the reader to work out from the plotted dose-response curves\
  \ and their described properties. Taking the given answer at face value, the open\
  \ circle corresponds to the R allele and the open triangle to the C allele in this\
  \ particular figure's legend convention."

      - id: q40
        number: "Q40"
        name: "Sensory Drive Speciation in Lake Victoria Cichlids"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=53"
        subjects:
          - name: "Speciation & Reproductive Isolation"
            link: "/resources/15-evolution/speciation-and-reproductive-isolation/"
        statements:
          - letter: "A"
            text: "The speciation of the two species is considered to have been caused by mating preference\
  \ of males to females."
            answer: false
            explanation: "It is the females that are described as choosing mates based on distinguishing male\
  \ nuptial coloration (blue versus red), while the males themselves display largely\
  \ fixed, non-choosing courtship coloration. Speciation via mate choice here is therefore\
  \ driven by female preference for male color, not by males selecting among females\
  \ (who look cryptic and similar in both species anyway)."
          - letter: "B"
            text: "During evolution, each of the two species is considered to have adapted their visual\
  \ cues to their habitat light environment."
            answer: true
            explanation: "Each species' opsin (visual pigment) sensitivity is shifted to match the dominant\
  \ wavelength of light available in its own depth habitat, blue-shifted in the shallow-water\
  \ species and red-shifted in the deep-water species. This matching of visual sensitivity\
  \ to the local light environment is a clear case of sensory adaptation to habitat."
          - letter: "C"
            text: "The consistency between the male nuptial colorations and the light components of\
  \ their habitats are explained by natural selection for camouflage."
            answer: false
            explanation: "Nuptial (breeding/courtship) coloration in cichlids functions as a conspicuous signal\
  \ used in female mate choice, which is the opposite purpose of camouflage (blending\
  \ in to avoid detection). The matching of male color to habitat light here is better\
  \ explained by sensory drive acting on mate-choice signaling, making the male's\
  \ color maximally visible/attractive under the local light, not by selection to\
  \ hide from predators."
          - letter: "D"
            text: "The sequences of the opsin gene differ between males and females in each species."
            answer: false
            explanation: "The opsin genes described here are shifted between the two species according to each\
  \ species' own habitat light environment, not according to sex within a species.\
  \ Since opsin genes are not sex-linked or sex-specific in this description, both\
  \ males and females of a given species share the same, habitat-matched opsin gene\
  \ sequence."

      - id: q41
        number: "Q41"
        name: "Methodological Pitfalls in Molecular Phylogenetics"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=54"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            text: "We must choose gene(s) with faster evolutionary rate(s) when inferring a phylogenetic\
  \ tree of species with older divergence."
            answer: false
            explanation: "A fast-evolving gene accumulates so many substitutions over a long, old divergence\
  \ time that multiple substitutions pile up at the same sites (saturation), erasing\
  \ the phylogenetic signal needed to resolve deep, old splits. For inferring relationships\
  \ among anciently diverged species, a more slowly evolving, conserved gene is the\
  \ appropriate choice instead, since it avoids this saturation problem."
          - letter: "B"
            text: "In order to infer phylogenetic relationships between species, paralogous gene(s)\
  \ that were duplicated during the evolution of the subject group should not be analyzed."
            answer: true
            explanation: "A gene tree built from paralogous copies (genes related by duplication within a genome)\
  \ reflects the history of that duplication event, not the true branching history\
  \ of the species themselves, this pitfall is the same lineage-confusion problem\
  \ illustrated for ECP/EDN in an earlier question. To correctly infer species relationships,\
  \ only orthologous genes (related by speciation, not duplication) should be compared."
          - letter: "C"
            text: "To root a phylogenetic tree with an outgroup, we should choose a species, which is\
  \ as distantly related to the subject species as possible."
            answer: false
            explanation: "An outgroup needs to be related closely enough that its sequence can still be reliably\
  \ aligned and meaningfully compared to the ingroup taxa, while still branching off\
  \ before the ingroup's common ancestor. Choosing an outgroup that is too distantly\
  \ related risks sequence saturation and alignment ambiguity, undermining the very\
  \ rooting it's meant to provide, so the outgroup should be only as distantly related\
  \ as necessary, not maximally so."
          - letter: "D"
            text: "Two species (sp. X and sp. Y) are described based on morphological characteristics.\
  \ Here, we sequenced a gene from five individuals of each species. As a result,\
  \ we found that the gene sequence of an individual of sp. Y is more similar to those\
  \ of five individuals of sp. X than those of other four individuals of sp. Y. This\
  \ result contradicts the biological species concept."
            answer: false
            explanation: "The biological species concept defines species based on reproductive isolation (interbreeding\
  \ potential), not on requiring every individual gene tree to perfectly group all\
  \ members of a species together, incomplete lineage sorting or a single introgressed/misleading\
  \ gene region can easily produce this kind of pattern in an otherwise well-isolated\
  \ pair of species. A single gene's sequence similarity pattern therefore does not\
  \ by itself contradict reproductive isolation between the two species."

      - id: q42
        number: "Q42"
        name: "Reading a Cetacean Phylogeny for Lifestyle and Trait Evolution"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=55"
        subjects:
          - name: "Evidence for Evolution"
            link: "/resources/15-evolution/evidence-for-evolution/"
        statements:
          - letter: "A"
            text: "Under the maximum-parsimony criterion, the most recent common ancestor of the hippopotamus\
  \ and modern cetaceans is amphibious."
            answer: false
            explanation: "Figure 1 shows hippopotamus is amphibious (AM) while Indhyus, its closest relative\
  \ on the other side of that ancestral node, is terrestrial (TE), and the fully aquatic\
  \ (AQ) modern cetaceans sit further along a separate branch. With descendants on\
  \ this part of the tree showing a mix of terrestrial and amphibious states rather\
  \ than a consistent amphibious state, the tree alone does not unambiguously fix\
  \ that shared ancestor as amphibious specifically, the simplest reconstruction\
  \ from the tree's given lifestyle labels is ambiguous/terrestrial-leaning rather\
  \ than confidently amphibious."
          - letter: "B"
            text: "There were no fully-aquatic cetaceans 50 MYA."
            answer: true
            explanation: "Reading across the (MYA) timescale in Figure 1 at the 50 MYA mark, only Archaeoceti\
  \ lineages (Pakicetus, Amburocetus, Remingtonocetus, Miacetus, Basirosaurus), all\
  \ labeled amphibious (AM), are present. The fully aquatic (AQ) Odontoceti and Mysticeti\
  \ lineages only branch off later, closer to the present, so no fully aquatic cetacean\
  \ lineage yet existed at 50 MYA according to the tree."
          - letter: "C"
            text: "Based on these studies, the evolutionary scenario of cetaceans is speculated as follows:\
  \ 1. becoming carnivorous, 2. becoming fully aquatic, 3. invasion to oceanic environments,\
  \ 4. divergence into baleen whales and toothed whales."
            answer: false
            explanation: "The tree and diet data instead suggest invasion of the oceanic/seawater environment\
  \ (seen in Remingtonocetus, Miacetus and Basirosaurus, which ate seawater fish while\
  \ still only amphibious) happened before the lineage became fully aquatic, since\
  \ the AQ (fully aquatic) state only appears later in Odontoceti/Mysticeti. The order\
  \ proposed in this statement, becoming fully aquatic before invading the ocean,\
  \ reverses the sequence actually supported by the tree and diet evidence."
          - letter: "D"
            text: "The enamelin gene, which encodes an essential protein for the formation of teeth\
  \ enamel, was lost during the evolution of cetaceans before 35 MYA."
            answer: false
            explanation: "Enamel-based teeth are retained in Odontoceti (toothed whales) today, so a functional\
  \ enamelin gene must still be present in that surviving lineage, and its loss (if\
  \ it occurred at all in this group) would be specific to the Mysticeti (baleen whale)\
  \ lineage after it split from Odontoceti. Since Odontoceti and Mysticeti only diverge\
  \ from each other quite recently on the tree, any enamelin loss restricted to Mysticeti\
  \ could not have happened as early as before 35 MYA."

      - id: q43
        number: "Q43"
        name: "Hox Gene Collinearity and Ubx Function Across Insect Lineages"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=57"
        subjects:
          - name: "Evolutionary Developmental Biology (Evo-Devo)"
            link: "/resources/15-evolution/evolutionary-developmental-biology/"
        statements:
          - letter: "A"
            text: "Proteins encoded by Hox genes act as transcription factors that regulate gene expression."
            answer: true
            explanation: "Hox proteins carry a homeodomain, a well-characterized DNA-binding motif, and their\
  \ known role is to control the segmental expression pattern of downstream genes\
  \ that specify segment identity along the body axis. Binding DNA to regulate the\
  \ expression of other genes is exactly what defines a transcription factor."
          - letter: "B"
            text: "The segmental expression pattern of the Hox genes determines the identities of each\
  \ segment in fruit fly embryos."
            answer: true
            explanation: "The collinear expression pattern shown in Figure 1B directly maps onto each segment's\
  \ identity along the anterior-posterior axis, and losing Ubx specifically converts\
  \ T3 into a T2 identity (extra wings instead of halteres). This demonstrates that\
  \ which Hox genes are expressed in a given segment is what specifies and determines\
  \ that segment's particular identity."
          - letter: "C"
            text: "In the Ubx gene mutants, the extension of the abd-A expression to the anterior region\
  \ leads to the transformation of thoracic segment."
            answer: false
            explanation: "The classic Ubx loss-of-function phenotype (T3-to-T2 transformation, extra wings)\
  \ is explained directly by the loss of Ubx's own normal T3-identity-specifying function,\
  \ not by some other Hox gene like abd-A expanding into that region. Nothing in the\
  \ given description involves abd-A expression shifting anteriorly as part of this\
  \ particular transformation."
          - letter: "D"
            text: "Beetles and grasshoppers have two pairs of wings because their Ubx genes control\
  \ a different set of genes in T3 from that of fruit flies."
            answer: true
            explanation: "Beetles and grasshoppers express Ubx in T3 just like fruit flies do, yet they still\
  \ develop a second pair of wings there instead of the wing-suppressing structure\
  \ fruit flies make (halteres), showing the anterior boundary of Ubx expression alone\
  \ does not explain the difference. Since the same gene (Ubx) is expressed in the\
  \ same segment but produces a different outcome, Ubx in these insects must be regulating\
  \ a different downstream target gene set in T3 than it does in fruit flies."

      - id: q44
        number: "Q44"
        name: "Pitx1 Expression and Convergent Pelvic Reduction in Stickleback"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=59"
        subjects:
          - name: "Evolutionary Developmental Biology (Evo-Devo)"
            link: "/resources/15-evolution/evolutionary-developmental-biology/"
        statements:
          - letter: "A"
            text: "The freshwater population without pelvic spines independently have likely evolved\
  \ from the marine population with pelvic spines."
            answer: true
            explanation: "Spine-loss freshwater populations occur at multiple separate localities around the\
  \ world, each presumably colonized from ancestral marine populations that had spines,\
  \ matching the classic pattern of repeated, convergent evolution. Because the marine,\
  \ spined form is considered ancestral, each freshwater population is inferred to\
  \ have independently lost spines after separately evolving from marine ancestors."
          - letter: "B"
            text: "Pelvic spines can function to protect the marine population against predators."
            answer: true
            explanation: "Bony pelvic spines that stick out from the body are a plausible physical deterrent,\
  \ making the fish harder to swallow for gape-limited predators, which is the classic\
  \ proposed function of stickleback spines. This anti-predator explanation is consistent\
  \ with why the marine environment, presumably with more or different predators,\
  \ has maintained the spined form."
          - letter: "C"
            text: "The Pitx1-knockout individual of the marine population are likely to show similar\
  \ phenotypes to those of the freshwater population."
            answer: false
            explanation: "Pitx1 also plays roles in thymus and neuromast development beyond the pelvic spine,\
  \ so a full knockout would be expected to disrupt these other Pitx1-dependent structures\
  \ too, unlike the natural freshwater populations, whose Pitx1 protein sequence is\
  \ unchanged and whose loss is restricted specifically to pelvic-region expression\
  \ via a regulatory change. A complete knockout is therefore expected to produce\
  \ a broader, more severe phenotype than the naturally occurring, pelvic-specific\
  \ loss seen in freshwater fish."
          - letter: "D"
            text: "The presence/absence of Pitx1 expression in the pelvic fin buds of embryos may result\
  \ from the difference of enhancer sequences that control the gene expression."
            answer: true
            explanation: "The Pitx1 protein sequence itself is identical between marine and freshwater populations,\
  \ yet where and whether it is expressed in the pelvic fin bud differs. This pattern,\
  \ an unchanged protein but altered tissue-specific expression, is the classic signature\
  \ of a change in a cis-regulatory enhancer element controlling Pitx1 rather than\
  \ a change in the coding sequence itself."

      - id: q45
        number: "Q45"
        name: "Density-Dependent Growth Curves and Extinction Risk in Two Life-History Types"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=60"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Asexually reproducing species are more likely to be type I than sexually reproducing\
  \ ones."
            answer: true
            explanation: "Type I shows a birth rate that stays highest at low population density and simply\
  \ declines as density rises, whereas type II shows birth rate actually dropping\
  \ at very low density (an Allee effect), consistent with sexually reproducing species\
  \ struggling to find mates when rare. Asexual species do not need to locate a mate\
  \ to reproduce, so they are not subject to this mate-finding problem and are more\
  \ likely to show the type I pattern instead of type II's low-density dip."
          - letter: "B"
            text: "Population density is kept constant around all points of A, B, and D with a density-dependent\
  \ manner."
            answer: false
            explanation: "Point B sits where birth and death rate curves cross but on the 'wrong' side of the\
  \ slope (an unstable equilibrium), so any small perturbation away from B is pushed\
  \ further away rather than pulled back, unlike stable equilibria A and D where the\
  \ population returns after a disturbance. Since B does not actually hold density\
  \ constant in a self-correcting way, it is inaccurate to say density is kept constant\
  \ 'around all points of A, B, and D.'"
          - letter: "C"
            text: "The aggregation of individuals is advantageous, rather than detrimental, below the\
  \ density threshold of C."
            answer: true
            explanation: "Below threshold C (in the type II curve), per capita growth rate actually increases\
  \ with density rather than decreasing, meaning individuals do better, not worse,\
  \ when more of them are clustered together at low density. This positive density-dependence\
  \ is exactly what an Allee effect means: aggregation is beneficial, not harmful,\
  \ in this low-density range."
          - letter: "D"
            text: "Type I species are more likely to go extinct when the population is severely decreased,\
  \ than type II species."
            answer: false
            explanation: "Type I's growth rate stays positive (birth exceeds death) all the way down to very\
  \ low densities, letting a type I population recover even from a severe decline.\
  \ Type II instead shows growth rate turning negative below threshold C (an Allee\
  \ effect), which can drive a severely reduced population further down toward extinction\
  \ rather than recovering, so type II, not type I, faces the higher extinction risk\
  \ after a severe decline."

      - id: q46
        number: "Q46"
        name: "Cost-Benefit Optimization of Animal Territory Size"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=61"
        subjects:
          - name: "Aggression, Territoriality & Social Structure"
            link: "/resources/9-ethology/aggression-territoriality-social-structure/"
        statements:
          - letter: "A"
            text: "The benefit curve shows saturation at a large territory size due to the depletion\
  \ of resources."
            answer: false
            explanation: "The benefit curve saturates at large territory sizes not because resources within\
  \ the area run out, but because there are practical limits on how much of a large\
  \ area an individual can actually use, defend, or forage across in the available\
  \ time (diminishing returns from limited foraging time and need). This time/capacity\
  \ limitation, not resource depletion, is what the official reasoning identifies\
  \ as the real cause of the plateau."
          - letter: "B"
            text: "The optimal territory size is the intersection point between the cost line and the\
  \ benefit curve."
            answer: false
            explanation: "The intersection point is simply where benefit equals cost (net benefit = zero);\
  \ the optimal territory size that actually maximizes the individual's net gain (benefit\
  \ minus cost) occurs at a smaller size, where the vertical gap between the benefit\
  \ curve and the cost line is largest. Past that optimum, benefit keeps rising toward\
  \ the crossing point but cost rises just as fast or faster, shrinking net benefit\
  \ rather than maximizing it."
          - letter: "C"
            text: "When resources become scarcer while the cost line is unchanged, the optimal territory\
  \ size becomes larger."
            answer: false
            explanation: "Scarcer resources flatten (reduce the slope of) the benefit curve, since a given\
  \ territory size now yields less benefit than before, and with the cost line unchanged\
  \ this shifts the point of maximum net benefit (biggest gap between the curves)\
  \ to a smaller territory size, not a larger one. A flatter benefit curve simply\
  \ cannot outpace an unchanged cost line for as long, so the optimum shrinks."
          - letter: "D"
            text: "When the population density increases and intraspecific competition becomes intense,\
  \ territorial behavior could disappear."
            answer: true
            explanation: "More intense competition for the same territory raises the cost of defending any\
  \ given area (more intruders to fight off, more energy spent on defense), which\
  \ steepens the cost line. Once the cost line becomes steep enough that cost exceeds\
  \ benefit at every territory size, defending a territory no longer yields a positive\
  \ net benefit anywhere, making it not worthwhile to maintain territorial behavior\
  \ at all."

      - id: q47
        number: "Q47"
        name: "Day versus Night Pollinator Contributions to Goldenrod Seed Set"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=62"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "A"
            text: "Nighttime pollinators contribute to about 60% of the total seed production."
            answer: false
            explanation: "Comparing treatment (1) (open to both day and night pollinators) against treatment\
  \ (2) (bagged at night, so only daytime pollinators can visit) isolates the nighttime\
  \ contribution as the difference between these two seed counts, and reading Figure\
  \ 1's bars this difference is not close to 60% of the total. This means the daytime\
  \ pollinators, not nighttime ones, contribute the larger share of seed production\
  \ here."
          - letter: "B"
            text: "The flowers may be capable of self-pollination."
            answer: true
            explanation: "Treatment (4), bagged during both day and night so that no external pollinator of\
  \ any kind can reach the flower, still produces some measurable seeds according\
  \ to Figure 1. Since no outside pollen vector could have reached these fully bagged\
  \ flowers, this residual seed set indicates the flowers are at least somewhat capable\
  \ of self-pollination."
          - letter: "C"
            text: "The contribution of daytime pollinators has a greater variability than nighttime\
  \ pollinators."
            answer: false
            explanation: "The error bars (standard deviation) shown in Figure 1 for treatment (3) (bagged during\
  \ the day, isolating the nighttime-pollinator contribution) are described as large,\
  \ indicating substantial variability specifically in the nighttime pollination outcome,\
  \ not the daytime one. This large spread in the nighttime-only treatment contradicts\
  \ the claim that daytime pollinators are the more variable group."
          - letter: "D"
            text: "There are no limitations to pollination under natural conditions."
            answer: false
            explanation: "Treatment (5) (enforced hand-pollination by the experimenter) produces more seeds\
  \ than treatment (1) (natural, unmanipulated pollination), shown by Figure 1. Since\
  \ providing extra, hand-delivered pollen increases seed output beyond what natural\
  \ pollinators alone achieve, this shows natural pollination is somewhat pollen-limited,\
  \ contradicting the claim of no limitations."

      - id: q48
        number: "Q48"
        name: "Tracking Insecticide Resistance Allele Frequency Over Time in Mosquitoes"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=63"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "No resistance allele was present before insecticide application."
            answer: false
            explanation: "The Pre-1990 data already shows a small number of s/r heterozygotes (3 individuals)\
  \ alongside the s/s homozygotes, meaning the resistance allele (r) was already present\
  \ in the population, just at low frequency, before any insecticide was applied.\
  \ Its rarity, not its complete absence, is what made resistant individuals so uncommon\
  \ at that point."
          - letter: "B"
            text: "During pesticide application, natural selection favored the resistance allele."
            answer: true
            explanation: "Across the 1990-2000 period, the proportion of r/r (resistant) individuals rises\
  \ dramatically while susceptible s/s individuals become rare, exactly the pattern\
  \ expected when pesticide exposure kills susceptible individuals preferentially.\
  \ This shift in genotype proportions during active pesticide use is a clear signature\
  \ of natural selection favoring the resistance allele under that selective pressure."
          - letter: "C"
            text: "Resistant individuals (r/r) are likely to have lower fitness than others (s/r, s/s)\
  \ in the absence of pesticide application."
            answer: true
            explanation: "After pesticide application ceases (2005-2015), the frequency of r/r individuals\
  \ declines back down while s/s individuals become common again, even though there\
  \ is no longer any pesticide favoring susceptibility over resistance directly. This\
  \ reversal implies the resistance allele carries some inherent fitness cost in the\
  \ pesticide-free environment, making r/r individuals less fit than s/s or s/r once\
  \ the selective pressure of pesticide is removed."
          - letter: "D"
            text: "From 1990 to 1995, the frequency of the resistant allele increased more than 10 times."
            answer: false
            explanation: "Calculating the r allele frequency from the genotype counts, 1990 gives (2x4+12)/(2x47)\
  \ is about 0.21 (21%), and 1995 gives (2x41+35)/(2x102) is about 0.57 (57%). That\
  \ is roughly a 2.7-fold increase, not more than ten-fold, so the statement overstates\
  \ the actual magnitude of change."

      - id: q49
        number: "Q49"
        name: "Species Dominance-Rank Curves and Community Change Over 50 Years"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=64"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "The total number of species does not change in the three periods observed."
            answer: false
            explanation: "The rank-abundance curves in Figure 1 extend to a different maximum rank (the total\
  \ number of distinct species plotted) in the '50 years later' panel compared to\
  \ the 'first year' panel, showing the total species count has decreased over the\
  \ 50 years rather than staying the same. The 50-year panel's curve is visibly shorter\
  \ (fewer ranked species) than the first-year curve."
          - letter: "B"
            text: "Species A has gradually outcompeted other species over time."
            answer: false
            explanation: "Species A actually declines in rank/dominance across the three time points shown\
  \ in Figure 1 (its abundance rank position becomes less extreme over time), which\
  \ is the opposite of what would be expected if it were outcompeting other species\
  \ and becoming more dominant. A decreasing dominance for species A does not by itself\
  \ demonstrate competitive exclusion of others in any direction."
          - letter: "C"
            text: "The top three species account for more than 75% of the total number of individuals\
  \ in the first year."
            answer: true
            explanation: "Reading the first-year rank-abundance curve in Figure 1, the abundances of the top\
  \ three ranked species (ranks 1-3) sum to more than 85% of the total number of individuals\
  \ across all species that year. Since 85% exceeds the 75% threshold in this statement,\
  \ the statement holds true for the first-year data."
          - letter: "D"
            text: "The gradual decrease in the slope of the rank-abundance curve indicates the increase\
  \ in evenness with time."
            answer: false
            explanation: "A flatter (lower magnitude slope) rank-abundance curve does correctly indicate increasing\
  \ evenness among species, since abundances are then more similar across ranks,\
  \ but Figure 1 shows the curve's slope becoming steeper, not flatter, from the first\
  \ year to 50 years later. Since the actual trend is a steepening curve, it indicates\
  \ decreasing evenness over time, the opposite of what this statement claims."

      - id: q50
        number: "Q50"
        name: "Species Richness and Aboveground Biomass in Experimental Grassland Plots"
        link: "/papers/ibo/2020/theoretical-1-exam.pdf#page=65"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Niche difference among species is one reason for producing a positive association\
  \ between species richness and aboveground biomass."
            answer: true
            explanation: "When co-occurring species differ in their resource-use niches (for example, rooting\
  \ at different soil depths or timing growth differently), a more species-rich plot\
  \ can collectively exploit a wider range of available resources with less direct\
  \ overlap/competition. This complementary resource use, niche differentiation, allows\
  \ richer plots to convert more total available resources into biomass, contributing\
  \ to the observed positive richness-biomass relationship."
          - letter: "B"
            text: "The plot showing the largest aboveground biomass also has the highest species richness."
            answer: false
            explanation: "Figure 1 shows considerable scatter around the regression line, and the single highest-biomass\
  \ data point does not sit at the maximum species richness value (10) but rather\
  \ at an intermediate richness level. This scatter means the overall positive trend\
  \ does not guarantee that the single best-performing plot is also the single richest\
  \ plot."
          - letter: "C"
            text: "On average, increasing aboveground biomass of 0.1 kg m-2 in a plot requires an additional\
  \ eight species."
            answer: false
            explanation: "Reading the slope of the least-squares regression line in Figure 1, an increase of\
  \ about 6 additional species corresponds to roughly a 0.1 kg/m2 increase in biomass\
  \ on average, not 8 species as this statement claims. This makes the average number\
  \ of additional species needed for that biomass increment smaller than stated."
          - letter: "D"
            text: "The greater chance of including more productive species in species-rich plots is\
  \ one reason for producing the positive association between species richness and\
  \ aboveground biomass."
            answer: true
            explanation: "With species combinations assembled randomly, a plot drawing from a larger number\
  \ of species has a statistically greater chance of happening to include at least\
  \ one especially high-biomass-producing species by chance alone. This 'sampling\
  \ effect' is a well-recognized, purely probabilistic mechanism (distinct from niche\
  \ complementarity) that also contributes to richer plots tending to show higher\
  \ biomass."


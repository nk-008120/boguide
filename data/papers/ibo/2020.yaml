      - id: q1
        number: "Q1"
        name: "Glycogen and Amylopectin Degradation by Phosphorylase and Debranching Enzyme"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=5"
        subjects:
          - name: "Carbohydrate Chemistry & Biology"
            link: "/resources/1-cell-molecular/carbohydrate-chemistry-biology/"
        statements:
          - letter: "Q1.1"
            type: "mcq"
            text: "Given that a certain glycogen consisting of 10000 glucose residues is branched at\
  \ every 10 residues, how many terminal chains are available for phosphorylase?"
            options: [{key: "1", text: "about 10"}, {key: "2", text: "about 50"}, {key: "3", text: "about 100"}, {key: "4", text: "about 500"}, {key: "5", text: "about 1000"}, {key: "6", text: "about 5000"}]
            answer: "4"
            explanation: "With 10000 residues branching every 10 residues, dividing gives 10000/10 = 1000 branch\
  \ points, and since each branch point creates a fork, about half of those branches\
  \ present a free non-reducing end that phosphorylase can act on at any one time.\
  \ That works out to roughly 1000/2 = 500 terminal chains available."
          - letter: "Q1.2 phosphorylase"
            type: "mcq"
            text: "For degradation of this glycogen by excess phosphorylase (assume phosphorylase releases\
  \ all glucose residues from a linear chain without branching), choose the appropriate\
  \ graph for its breakdown from Figure 1's panels (a)-(e)."
            options: [{key: "1", text: "(a)"}, {key: "2", text: "(b)"}, {key: "3", text: "(c)"}, {key: "4", text: "(d)"}, {key: "5", text: "(e)"}]
            answer: "3"
            explanation: "Phosphorylase alone can strip every residue down to just two residues short of each\
  \ branch point, removing essentially all of the linear (a1->4) chain material but\
  \ leaving the branched core untouched. Since about half of the total polymer mass\
  \ in this glycogen is in these accessible linear stretches, breakdown proceeds to\
  \ roughly the 50% mark and then plateaus there, matching panel (c)."
          - letter: "Q1.2 debranching enzyme"
            type: "mcq"
            text: "For degradation of this glycogen by excess debranching enzyme, choose the appropriate\
  \ graph for its breakdown from Figure 1's panels (a)-(e)."
            options: [{key: "1", text: "(a)"}, {key: "2", text: "(b)"}, {key: "3", text: "(c)"}, {key: "4", text: "(d)"}, {key: "5", text: "(e)"}]
            answer: "1"
            explanation: "The debranching enzyme can only act on the a(1->6) branch points, and those branch\
  \ points are not exposed until phosphorylase has first trimmed back the linear chains\
  \ around them. With no phosphorylase activity present, the debranching enzyme has\
  \ essentially nothing accessible to act on, so almost no breakdown occurs at all,\
  \ matching the flat, near-zero panel (a)."
          - letter: "Q1.3"
            type: "mcq"
            text: "Plant amylopectin is similar to glycogen but branching occurs much less frequently\
  \ (every 25 residues instead of every 10, for an amylopectin of similar size to\
  \ this glycogen). Indicate the combination of correct descriptions about degradation\
  \ of amylopectin by phosphorylase: (a) Breakdown speed is slower than that of glycogen.\
  \ (b) Breakdown speed is similar to that of glycogen. (c) Breakdown speed is faster\
  \ than that of glycogen. (d) Final breakdown extent is smaller than that of glycogen.\
  \ (e) Final breakdown extent is similar to that of glycogen. (f) Final breakdown\
  \ extent is larger than that of glycogen."
            options: [{key: "1", text: "(a), (d)"}, {key: "2", text: "(a), (e)"}, {key: "3", text: "(a), (f)"}, {key: "4", text: "(b), (d)"}, {key: "5", text: "(b), (e)"}, {key: "6", text: "(b), (f)"}, {key: "7", text: "(c), (d)"}, {key: "8", text: "(c), (e)"}, {key: "9", text: "(c), (f)"}]
            answer: "2"
            explanation: "With branches every 25 residues instead of every 10, amylopectin of the same total\
  \ size has only 10000/25 = 400 branch points, giving about 200 phosphorylase-accessible\
  \ chain ends, fewer than glycogen's 500: so degradation proceeds more slowly,\
  \ matching (a). But each of those 200 chains is proportionally longer (25 residues\
  \ between branches instead of 10), so the total mass degraded works out to about\
  \ 200 x 25 = 5000 residues, essentially the same total amount as glycogen's 500\
  \ x 10 = 5000, matching (e)."

      - id: q2
        number: "Q2"
        name: "Classifying Endo-type and Exo-type Hydrolases by Biological Role"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=7"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "A"
            type: "mcq"
            text: "Digestive proteases in stomach such as pepsin"
            options: [{key: "1", text: "endo-type"}, {key: "2", text: "exo-type"}]
            answer: "1"
            explanation: "Pepsin cleaves internal peptide bonds throughout a protein, rapidly generating many\
  \ smaller peptide fragments rather than nibbling one residue off an end at a time.\
  \ Producing a large number of fragments quickly is characteristic of an endo-type\
  \ mechanism, which then sets those fragments up for finishing by exo-type aminopeptidases\
  \ and carboxypeptidases later in the small intestine."
          - letter: "B"
            type: "mcq"
            text: "Proteases that cleave off the translocation signal peptide"
            options: [{key: "1", text: "endo-type"}, {key: "2", text: "exo-type"}]
            answer: "1"
            explanation: "The signal peptide sits at the N-terminus of a nascent polypeptide, and removing\
  \ it requires a single precise internal cut at a specific site within the chain,\
  \ not a step-by-step trim from an end. Making one specific internal cut is the defining\
  \ action of an endo-type protease (signal peptidase)."
          - letter: "C"
            type: "mcq"
            text: "Proofreading nuclease in the DNA polymerase that removes misincorporated nucleotides\
  \ during DNA replication"
            options: [{key: "1", text: "endo-type"}, {key: "2", text: "exo-type"}]
            answer: "2"
            explanation: "DNA polymerase's proofreading activity is a 3' to 5' exonuclease that backs up and\
  \ removes the most recently added, misincorporated nucleotide one at a time from\
  \ the free end of the growing strand. Removing single units from a chain end, rather\
  \ than cutting internally, is exactly what defines an exo-type nuclease."
          - letter: "D"
            type: "mcq"
            text: "Cas9 nuclease of the CRISPR-Cas9 system for genome editing"
            options: [{key: "1", text: "endo-type"}, {key: "2", text: "exo-type"}]
            answer: "1"
            explanation: "Cas9 is guided by its RNA to a specific internal target sequence within the chromosome\
  \ and cuts both DNA strands right there in the middle of the molecule, not at an\
  \ existing end. Cutting at an internal site is the hallmark of an endo-type nuclease."

      - id: q3
        number: "Q3"
        name: "Ethanol as a Competitive Inhibitor of Alcohol Dehydrogenase Acting on Methanol"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=8"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "Ethanol concentration"
            type: "numeric"
            text: "Calculate the concentration of ethanol which suppresses 90% of the initial formaldehyde\
  \ production in a test tube containing 5 mM methanol and alcohol dehydrogenase (KM\
  \ for methanol = 10 mM, KI for ethanol = 1 mM)."
            expected: 13.5
            tolerance: 0.1
            explanation: "Without ethanol, v0/Vmax = 5/(10+5) = 1/3. Suppressing this by 90% means the new\
  \ rate must equal 10% of that, or 5/(10*alpha+5) = 0.1 x (1/3), which solves to\
  \ alpha = 14.5. Since alpha = 1 + [I]/KI with KI = 1 mM, [I] = alpha - 1 = 13.5\
  \ mM of ethanol."

      - id: q4
        number: "Q4"
        name: "Predicting Sedimentation and Flotation Behavior in Three Centrifugation Setups"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=9"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "Exp. A diagram"
            type: "mcq"
            text: "In Exp. A, how are viruses, globular proteins, and nuclei supposed to sediment? Choose\
  \ the most appropriate diagram from Figure 2 that shows the sedimentation time courses\
  \ of specimens."
            options: [{key: "1", text: "I"}, {key: "2", text: "II"}, {key: "3", text: "III"}, {key: "4", text: "IV"}]
            answer: "3"
            explanation: "In a uniform-density medium, every specimen keeps sedimenting at a constant rate\
  \ for as long as centrifugation continues, since nothing ever stops their descent:\
  \ this rules out the curves in I and II, which level off. Because all three specimens\
  \ share the same density (1.3 g/mL) but differ in size, they sediment at different\
  \ constant speeds (larger nuclei fastest, then viruses, then the small globular\
  \ proteins), which is the pattern of straight lines fanning out at different slopes\
  \ shown in diagram III."
          - letter: "Exp. A lines"
            type: "free_response"
            text: "In the selected diagram for Exp. A, indicate which line (a, b, or c) corresponds\
  \ to viruses, globular proteins, and nuclei, respectively."
            modelAnswer: "viruses = b, globular proteins = a, nuclei = c"
            explanation: "Sedimentation speed at a shared density increases with particle size, and nuclei\
  \ are much larger than viruses, which are in turn larger than individual globular\
  \ proteins. In diagram III, line c falls fastest (steepest), line b is intermediate,\
  \ and line a is slowest, so nuclei = c, viruses = b, and globular proteins = a."
          - letter: "Exp. B diagram"
            type: "mcq"
            text: "In Exp. B, how are viruses, globular proteins, and nuclei supposed to sediment? Choose\
  \ the most appropriate diagram from Figure 2 that shows the sedimentation time courses\
  \ of the specimens."
            options: [{key: "1", text: "I"}, {key: "2", text: "II"}, {key: "3", text: "III"}, {key: "4", text: "IV"}]
            answer: "2"
            explanation: "In a density-gradient medium ranging from 1.0 to 1.6 g/mL, every specimen eventually\
  \ reaches the depth where the medium density matches its own particle density (1.3\
  \ g/mL) and then stops sedimenting there, which is exactly the plateauing pattern\
  \ shown in diagram II (unlike diagram I, whose curves plateau at different final\
  \ positions rather than converging). Since all three specimens share the same 1.3\
  \ g/mL density, they all approach the same final equilibrium position, just at different\
  \ speeds depending on size."
          - letter: "Exp. B lines"
            type: "free_response"
            text: "In the selected diagram for Exp. B, indicate which line (a, b, or c) corresponds\
  \ to viruses, globular proteins, and nuclei, respectively."
            modelAnswer: "viruses = b, globular proteins = a, nuclei = c"
            explanation: "Larger particles move toward their equilibrium position faster even though all three\
  \ specimens end up at the same final depth (since they share the same density).\
  \ Nuclei (largest) reach equilibrium fastest, so nuclei = c (steepest early rise),\
  \ viruses = b (intermediate), and globular proteins = a (slowest)."
          - letter: "Exp. C diagram"
            type: "mcq"
            text: "In Exp. C, how are viruses, globular proteins, and nuclei supposed to float? Choose\
  \ the most appropriate diagram from Figure 3 that shows the floating time courses\
  \ of specimens."
            options: [{key: "1", text: "V"}, {key: "2", text: "VI"}, {key: "3", text: "VII"}, {key: "4", text: "VIII"}]
            answer: "2"
            explanation: "Starting from the bottom of the same 1.0-1.6 g/mL gradient, each specimen floats\
  \ upward until it again reaches the depth matching its own 1.3 g/mL density, so\
  \ the curves must plateau at a shared equilibrium position: this is diagram VI,\
  \ the floating (upward, converging) counterpart to the sedimentation pattern in\
  \ diagram II. Diagram V's curves plateau at different heights, which would only\
  \ make sense if the specimens had different densities."
          - letter: "Exp. C lines"
            type: "free_response"
            text: "In the selected diagram for Exp. C, indicate which line (a, b, or c) corresponds\
  \ to viruses, globular proteins, and nuclei, respectively."
            modelAnswer: "viruses = b, globular proteins = c, nuclei = a"
            explanation: "Just as in Exp. B, larger particles move toward the shared equilibrium position faster,\
  \ but now the movement is upward (floating) rather than downward. Nuclei (largest)\
  \ rise fastest, matching line a's steep early rise in diagram VI, viruses are intermediate\
  \ (line b), and the small globular proteins rise slowest (line c)."

      - id: q5
        number: "Q5"
        name: "Molecular Crowding of Hemoglobin and Ion Diffusion in Red Blood Cells"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=11"
        subjects:
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
          - name: "Human Circulatory System"
            link: "/resources/2-animal-anatomy/human-circulatory-system/"
        statements:
          - letter: "Q5-1"
            type: "mcq"
            text: "Choose the closest number for the percentage of the total cytoplasmic volume in RBCs\
  \ occupied by hemoglobin molecules. Use the Avogadro constant, 6.02x10^23, for the\
  \ calculation if needed."
            options: [{key: "1", text: "3"}, {key: "2", text: "6"}, {key: "3", text: "12"}, {key: "4", text: "24"}, {key: "5", text: "48"}]
            answer: "4"
            explanation: "A concentration of 320 g/L hemoglobin (molecular mass 64,000 g/mol) is a molar concentration\
  \ of 0.005 M, so on average one molecule occupies a cytoplasmic volume of 1/(0.005\
  \ mol/L x 6.02x10^23/mol) = about 333 nm^3. A single hemoglobin molecule, at a typical\
  \ protein density of 1.35 g/mL, has a molecular mass of about 1x10^-19 g and so\
  \ a molecular volume of about 79 nm^3, giving an occupied fraction of 79/333, about\
  \ 24%."
          - letter: "Q5-2.A"
            text: "Alpaca RBCs, which have a hemoglobin concentration about 1.5 times higher than that\
  \ of humans, have an internal ion diffusion rate of less than 50% of that of human\
  \ RBCs."
            answer: true
            explanation: "Figure 3 shows alpaca (MCHC 450 mg/mL, about 1.5x the human 320 mg/mL) has an H+\
  \ diffusion rate of only about 4 micrometer^2/s, compared to roughly 18-22 micrometer^2/s\
  \ for human RBCs at normal MCHC. That alpaca rate is clearly less than half the\
  \ human rate, consistent with alpaca's substantially higher molecular crowding slowing\
  \ ion diffusion."
          - letter: "Q5-2.B"
            text: "Ion diffusion rate is low inside human RBCs at low osmolarity, due to the reduced\
  \ volume of RBCs."
            answer: false
            explanation: "Figure 2a shows that lowering osmolarity actually increases RBC cell volume (cells\
  \ swell in a more dilute, hypotonic solution), and Figure 2b shows ion diffusion\
  \ rate rises, not falls, at that same low osmolarity. Since a larger cell volume\
  \ dilutes hemoglobin and reduces crowding, diffusion should be (and is) faster,\
  \ not slower, at low osmolarity, making this statement's stated direction and its\
  \ reasoning both incorrect."
          - letter: "Q5-2.C"
            text: "There is a proportional relationship between the concentration of hemoglobin and\
  \ the rate of ion diffusion in RBCs."
            answer: false
            explanation: "Figure 3 shows the relationship between MCHC and diffusion rate is a steep, non-linear\
  \ (roughly inverse-like) curve, not a straight-line proportional relationship. Diffusion\
  \ rate drops off sharply at first as MCHC rises from low values, then flattens out\
  \ at higher MCHC, which is not consistent with simple proportionality."
          - letter: "Q5-2.D"
            text: "Alpaca RBCs have been evolutionally optimized to increase hemoglobin concentration\
  \ and transport large amounts of oxygen, while promoting O2 and CO2 diffusion."
            answer: false
            explanation: "Alpacas live at high altitude and have evolved higher hemoglobin concentration to\
  \ carry more oxygen per unit blood volume, but Figure 3 shows this comes at the\
  \ cost of a much lower internal ion (and by extension, likely gas) diffusion rate,\
  \ not a promotion of it. This is a compromising trade-off between oxygen-carrying\
  \ capacity and diffusion speed, not simultaneous optimization of both."

      - id: q6
        number: "Q6"
        name: "Identifying Cytoskeleton Types from Function and Morphology"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=13"
        subjects:
          - name: "Cytoskeleton & Motor Proteins"
            link: "/resources/1-cell-molecular/cytoskeleton-motor-proteins/"
        statements:
          - letter: "A"
            type: "free_response"
            text: "They are entangled inside interphase cells and exist in a meshwork. They enhance\
  \ the elasticity of cells and provide a mechanically supportive structure."
            modelAnswer: "(3) intermediate filaments; diagram (3)"
            explanation: "A meshwork that gives cells mechanical elasticity and support, rather than driving\
  \ movement or division, is the classic description of intermediate filaments, which\
  \ form a rope-like, entangled network throughout the cytoplasm. In Figure 1 this\
  \ tangled meshwork appearance corresponds to diagram (3)."
          - letter: "B"
            type: "free_response"
            text: "It is called a stress fiber. It builds a support beam inside cells and works to maintain\
  \ the shape of the cell in interphase."
            modelAnswer: "(2) actin filaments; diagram (1)"
            explanation: "Stress fibers are a well-known, named structure built specifically from bundled actin\
  \ filaments, which act as internal support beams anchoring the cell and maintaining\
  \ its shape during interphase. In Figure 1 this corresponds to diagram (1), the\
  \ crisscrossing bundle pattern typical of stress fibers."
          - letter: "C"
            type: "free_response"
            text: "This spindle-shaped structure is formed during cell division. It plays a role in\
  \ separating replicated chromosomes accurately into daughter cells."
            modelAnswer: "(1) microtubules; diagram (6)"
            explanation: "The spindle apparatus that pulls replicated chromosomes apart during division is\
  \ built from microtubules, radiating from the two spindle poles toward the chromosomes\
  \ at the cell's midline. In Figure 1 this corresponds to diagram (6), the two-cell\
  \ radiating-fiber pattern typical of the mitotic spindle."
          - letter: "D"
            type: "free_response"
            text: "After chromosomal segregation, it forms a ring structure and mechanically separates\
  \ two daughter cells."
            modelAnswer: "(2) actin filaments; diagram (5)"
            explanation: "The contractile ring that pinches a dividing cell in two during cytokinesis, right\
  \ after the chromosomes have separated, is built from actin (together with myosin\
  \ motors). In Figure 1 this corresponds to diagram (5), showing the constriction\
  \ at the junction between the two forming daughter cells."
          - letter: "E"
            type: "free_response"
            text: "Having radial distributions starting near the nucleus, the fibrous structure is assumed\
  \ to have structural polarity or directionality."
            modelAnswer: "(1) microtubules; diagram (2)"
            explanation: "A radial array of fibers emanating from a single organizing center near the nucleus\
  \ is the signature interphase arrangement of microtubules, which grow outward from\
  \ the centrosome with an intrinsic polarity (minus end at the center, plus end at\
  \ the periphery). In Figure 1 this corresponds to diagram (2), the radiating star-shaped\
  \ pattern."

      - id: q7
        number: "Q7"
        name: "Estimating Vmax and KM for GLUT1 Glucose Transport Kinetics"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=15"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "Q7-1 Vmax"
            type: "mcq"
            text: "Estimate the approximate integer value for Vmax [nmol/min/cell] in the equation from\
  \ the curve shown in Figure 1."
            options: [{key: "1", text: "1"}, {key: "2", text: "2"}, {key: "3", text: "3"}, {key: "4", text: "4"}, {key: "5", text: "5"}, {key: "6", text: "6"}, {key: "7", text: "7"}, {key: "8", text: "8"}, {key: "9", text: "9"}]
            answer: "3"
            explanation: "Figure 1's curve approaches a plateau (its saturating maximum rate) at a value of\
  \ about 3 nmol/min/cell as glucose concentration gets large, which is by definition\
  \ Vmax."
          - letter: "Q7-1 KM"
            type: "mcq"
            text: "Estimate the approximate integer value for KM [mM] in the equation from the curve\
  \ shown in Figure 1."
            options: [{key: "1", text: "1"}, {key: "2", text: "2"}, {key: "3", text: "3"}, {key: "4", text: "4"}, {key: "5", text: "5"}, {key: "6", text: "6"}, {key: "7", text: "7"}, {key: "8", text: "8"}, {key: "9", text: "9"}]
            answer: "2"
            explanation: "KM is defined as the substrate concentration at which the rate reaches half of Vmax.\
  \ With Vmax at about 3 nmol/min/cell, Figure 1's curve reaches half that rate (about\
  \ 1.5 nmol/min/cell) at a glucose concentration of about 2 mM."
          - letter: "A"
            text: "Healthy humans typically have 4 to 6 mM of blood glucose. The rate of glucose transport\
  \ per molecule by GLUT2 is considered to be approximately equal to that by GLUT4."
            answer: true
            explanation: "GLUT2 (Vmax 2 nmol/min/cell, KM 9 mM) at 4-6 mM blood glucose runs at roughly 2x5/(9+5)\
  \ is about 0.71-2x6/(9+6) is about 0.8 nmol/min/cell, while GLUT4 (Vmax 0.85, KM\
  \ 0.8 mM) is already essentially saturated at that glucose level, running at close\
  \ to its own Vmax of about 0.71-0.74 nmol/min/cell. These two rates land in a similar\
  \ range, so the per-molecule transport rates of GLUT2 and GLUT4 come out approximately\
  \ equal at normal blood glucose."
          - letter: "B"
            text: "Although the transport rate of glucose by GLUT1 and GLUT4 is almost saturated in\
  \ healthy humans, GLUT2 has an additional capacity to increase the transportation\
  \ rate."
            answer: true
            explanation: "GLUT1 (KM about 2 mM) and GLUT4 (KM 0.8 mM) both have KM values well below the normal\
  \ 4-6 mM blood glucose range, so both are already running close to Vmax and have\
  \ little room to increase further. GLUT2, in contrast, has a much higher KM (9 mM),\
  \ placing normal blood glucose only partway up its saturation curve, leaving real\
  \ additional capacity to transport more glucose if blood glucose rises further."

      - id: q8
        number: "Q8"
        name: "Which Kinetic and Environmental Data Explain Rubisco's Carboxylase/Oxygenase Balance"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=17"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "A"
            type: "mcq"
            text: "The carboxylase activity of Rubisco increases as the oxygen concentration in the\
  \ air decreases."
            options: [{key: "1", text: "(a)(b)(c)"}, {key: "2", text: "(a)(b)"}, {key: "3", text: "(a)(c)"}, {key: "4", text: "(b)(c)"}, {key: "5", text: "(a)"}, {key: "6", text: "(b)"}, {key: "7", text: "(c)"}]
            answer: "3"
            explanation: "Explaining this fact only needs to show that O2 is a competitive inhibitor at the\
  \ CO2 binding site (from the KM values in (a)) and that O2 is present at a substantial\
  \ in vivo concentration relative to that KM (from (c)): together these show carboxylase\
  \ activity is not yet saturated for CO2 in air and is being held down by competing\
  \ O2. The kcat maximum-rate values in (b) are not needed to make this particular\
  \ point."
          - letter: "B"
            type: "mcq"
            text: "In the current global environment, the carboxylase activity of Rubisco is higher\
  \ than the oxygenase activity."
            options: [{key: "1", text: "(a)(b)(c)"}, {key: "2", text: "(a)(b)"}, {key: "3", text: "(a)(c)"}, {key: "4", text: "(b)(c)"}, {key: "5", text: "(a)"}, {key: "6", text: "(b)"}, {key: "7", text: "(c)"}]
            answer: "1"
            explanation: "Comparing which activity actually wins under current atmospheric conditions requires\
  \ all three pieces: the binding affinities in (a), the maximum turnover rates in\
  \ (b), and the actual in vivo substrate concentrations in (c): only by combining\
  \ affinity, maximum rate, and concentration for both substrates can the two competing\
  \ reaction rates be calculated and compared."
          - letter: "C"
            type: "mcq"
            text: "Plants must have large amounts of Rubisco to maintain the full capacity of photosynthesis."
            options: [{key: "1", text: "(a)(b)(c)"}, {key: "2", text: "(a)(b)"}, {key: "3", text: "(a)(c)"}, {key: "4", text: "(b)(c)"}, {key: "5", text: "(a)"}, {key: "6", text: "(b)"}, {key: "7", text: "(c)"}]
            answer: "1"
            explanation: "Showing that a large amount of enzyme is needed requires establishing that each individual\
  \ Rubisco molecule turns over CO2 slowly (kcat in (b)) and that it is not operating\
  \ anywhere near saturation under real conditions (affinity from (a) versus actual\
  \ concentration from (c)): both the low per-molecule turnover and the low degree\
  \ of saturation point to needing many molecules to reach adequate total flux, so\
  \ all three data sets are needed."
          - letter: "D"
            type: "mcq"
            text: "Increasing the concentration of CO2 in the air increases the carboxylase activity\
  \ of Rubisco."
            options: [{key: "1", text: "(a)(b)(c)"}, {key: "2", text: "(a)(b)"}, {key: "3", text: "(a)(c)"}, {key: "4", text: "(b)(c)"}, {key: "5", text: "(a)"}, {key: "6", text: "(b)"}, {key: "7", text: "(c)"}]
            answer: "3"
            explanation: "This only requires showing that current CO2 concentration (c) is well below the KM\
  \ for CO2 given in (a), meaning carboxylation is not yet saturated and still has\
  \ room to rise as CO2 increases. The maximum turnover rate in (b) is irrelevant\
  \ to whether there is room to increase, so it is not needed."

      - id: q9
        number: "Q9"
        name: "Identifying the Ohsumi Yeast Autophagy Mutant and Autophagic Body Contents"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=18"
        subjects:
          - name: "Endomembrane System & Protein Trafficking"
            link: "/resources/1-cell-molecular/endomembrane-system-protein-trafficking/"
        statements:
          - letter: "Q9-1"
            type: "mcq"
            text: "What kind of gene had a mutation in this experiment?"
            options: [{key: "1", text: "Phosphatase"}, {key: "2", text: "Protease"}, {key: "3", text: "Cellulase"}, {key: "4", text: "DNA polymerase"}]
            answer: "2"
            explanation: "The mutants Ohsumi isolated accumulate intact, undigested autophagic bodies inside\
  \ the vacuole rather than degrading them, because the vacuolar proteases needed\
  \ to break down the autophagic body's contents are disabled. Only a protease defect\
  \ specifically blocks this final digestion step, letting the round autophagic bodies\
  \ pile up and become visible."
          - letter: "Q9-2"
            type: "mcq"
            text: "What was the organelle found in the autophagic body?"
            options: [{key: "1", text: "Chloroplast"}, {key: "2", text: "Mitochondrion"}, {key: "3", text: "Melanosome"}, {key: "4", text: "Cell wall"}]
            answer: "2"
            explanation: "Yeast cells have no chloroplasts (plant-specific) and no melanosomes (animal pigment\
  \ cells), and the cell wall is an external structure, not something engulfed inside\
  \ a vacuole. Mitochondria are the only one of these four options that is both an\
  \ internal organelle and normally present in yeast, matching the electron-microscopy\
  \ observation of an organelle-containing structure inside the autophagic body (alongside\
  \ the ribosomes explicitly mentioned)."

      - id: q10
        number: "Q10"
        name: "Matching Plant Cell Growth Types to Cellulose Microfibril and Microtubule Orientation"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=19"
        subjects:
          - name: "Cytoskeleton & Motor Proteins"
            link: "/resources/1-cell-molecular/cytoskeleton-motor-proteins/"
        statements:
          - letter: "Q10-1"
            type: "mcq"
            text: "Select a combination that correctly matches the types of growth (A to C) and the\
  \ types of plant cells."
            options: [{key: "1", text: "A-Pollen tube/Root hair, B-Leaf epidermal cells, C-Root cortical cells"}, {key: "2", text: "A-Pollen tube/Root hair, B-Root cortical cell, C-Leaf epidermal cell"}, {key: "3", text: "A-Root cortical cells, B-Leaf epidermal cells, C-Pollen tube/Root hair"}, {key: "4", text: "A-Root cortical cells, B-Pollen tube/root hair, C-Leaf epidermal cells"}, {key: "5", text: "A-Leaf epidermal cells, B-Pollen tube/root hair, C-Root cortical cells"}, {key: "6", text: "A-Leaf epidermal cells, B-Root cortical cells, C-Pollen tube/Root hair"}]
            answer: "4"
            explanation: "Root cortical cells are simple parenchyma-type cells that expand more or less uniformly\
  \ over their whole surface, matching diffuse growth (type A), while pollen tubes\
  \ and root hairs are classic tip-growing cells (type B), extending only from their\
  \ very apex. Leaf epidermal (pavement) cells combine both modes: diffuse expansion\
  \ of the cell body plus localized outgrowth at their interlocking lobes: matching\
  \ inclusive growth (type C), giving A-root cortical cells, B-pollen tube/root hair,\
  \ C-leaf epidermal cells."
          - letter: "Q10-2"
            type: "mcq"
            text: "The following schematic diagrams (1) to (4) show the orientation of cellulose microfibrils\
  \ of the cell wall (CW) and the orientation of cortical microtubules (MT) in plant\
  \ cells extending in the longitudinal (growth) direction. Choose the most appropriate\
  \ combination."
            options: [{key: "1", text: "diagram (1): CW vertical, MT vertical"}, {key: "2", text: "diagram (2): CW vertical, MT horizontal"}, {key: "3", text: "diagram (3): CW horizontal, MT horizontal"}, {key: "4", text: "diagram (4): CW horizontal, MT vertical"}]
            answer: "3"
            explanation: "Cortical microtubules and the cellulose microfibrils they template are known to be\
  \ co-aligned with each other (matching orientations), which already rules out diagrams\
  \ (2) and (4) where CW and MT point in different directions. For a cell to elongate\
  \ along its longitudinal growth axis, the reinforcing cellulose microfibrils must\
  \ be laid down circumferentially: perpendicular to that axis, i.e. horizontal\
  \ in a longitudinally-drawn cell: to constrain radial expansion and channel growth\
  \ lengthwise, matching diagram (3), where both the co-aligned CW and MT run horizontal."

      - id: q11
        number: "Q11"
        name: "Calculating Cell Cycle Length and Initial Ratio from Growth Curves"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=20"
        subjects:
          - name: "Cell Cycle, Mitosis & Meiosis"
            link: "/resources/1-cell-molecular/cell-cycle-mitosis-meiosis/"
        statements:
          - letter: "Q11-1 somatic cell A"
            type: "mcq"
            text: "How long is the cell cycle of somatic cell A?"
            options: [{key: "1", text: "3"}, {key: "2", text: "4"}, {key: "3", text: "6"}, {key: "4", text: "8"}, {key: "5", text: "10"}, {key: "6", text: "12"}, {key: "7", text: "16"}, {key: "8", text: "24"}, {key: "9", text: "32"}]
            answer: "6"
            explanation: "Cell A increases from 7.2 to 115.2 (x10^5) over 48 hours, a 16-fold increase. Since\
  \ 16 = 2^4, that is 4 doublings in 48 hours, giving a cell cycle length of 48/4\
  \ = 12 hours."
          - letter: "Q11-1 somatic cell B"
            type: "mcq"
            text: "How long is the cell cycle of somatic cell B?"
            options: [{key: "1", text: "3"}, {key: "2", text: "4"}, {key: "3", text: "6"}, {key: "4", text: "8"}, {key: "5", text: "10"}, {key: "6", text: "12"}, {key: "7", text: "16"}, {key: "8", text: "24"}, {key: "9", text: "32"}]
            answer: "7"
            explanation: "Cell B increases from 9.7 to 77.6 (x10^5) over 48 hours, an 8-fold increase. Since\
  \ 8 = 2^3, that is 3 doublings in 48 hours, giving a cell cycle length of 48/3 =\
  \ 16 hours."
          - letter: "Q11-2"
            type: "mcq"
            text: "When somatic cells A and B were mixed at a certain ratio and a culture was started,\
  \ the ratio of the cell numbers of A and B after 4 days was 2:1. What was the ratio\
  \ of somatic cell A and B cell numbers when the culture was started?"
            options: [{key: "1", text: "A:B = 1:1"}, {key: "2", text: "A:B = 2:3"}, {key: "3", text: "A:B = 1:2"}]
            answer: "3"
            explanation: "Over 4 days (96 hours), cell A (12-hour cycle) divides 96/12 = 8 times, multiplying\
  \ by 2^8 = 256, while cell B (16-hour cycle) divides 96/16 = 6 times, multiplying\
  \ by 2^6 = 64. If A and B started equal, the final ratio would be 256:64 = 4:1,\
  \ but the observed final ratio is only 2:1: four times smaller: so the starting\
  \ amount of A must have been four times smaller relative to B than an equal mix,\
  \ i.e. the initial ratio was A:B = 1:2."

      - id: q12
        number: "Q12"
        name: "Determining Metabolic Pathway and ATP Yield from Gas Exchange in Yeast"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=21"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "Q12-1 Condition A"
            type: "mcq"
            text: "How was glucose metabolized under condition A?"
            options: [{key: "1", text: "aerobic respiration only"}, {key: "2", text: "alcohol fermentation only"}, {key: "3", text: "aerobic respiration and alcohol fermentation"}]
            answer: "2"
            explanation: "Condition A shows zero O2 absorption, and aerobic respiration cannot occur at all\
  \ without consuming O2. Since CO2 is still released, the only pathway operating\
  \ is alcohol fermentation, which produces CO2 without using O2."
          - letter: "Q12-1 Condition B"
            type: "mcq"
            text: "How was glucose metabolized under condition B?"
            options: [{key: "1", text: "aerobic respiration only"}, {key: "2", text: "alcohol fermentation only"}, {key: "3", text: "aerobic respiration and alcohol fermentation"}]
            answer: "3"
            explanation: "Condition B absorbs 30 mL O2, which by the aerobic respiration equation (1:1 O2:CO2\
  \ ratio) would produce exactly 30 mL CO2 if aerobic respiration were the only pathway.\
  \ But 40 mL CO2 is actually released, 10 mL more than aerobic respiration alone\
  \ can account for, so alcohol fermentation must also be contributing that extra\
  \ CO2 alongside aerobic respiration."
          - letter: "Q12-2"
            type: "mcq"
            text: "Assuming that 100 equivalents of ATP were generated under condition A, how many equivalents\
  \ of ATP were generated under condition B?"
            options: [{key: "1", text: "50"}, {key: "2", text: "100"}, {key: "3", text: "300"}, {key: "4", text: "500"}, {key: "5", text: "750"}, {key: "6", text: "850"}, {key: "7", text: "1000"}, {key: "8", text: "1200"}, {key: "9", text: "1400"}]
            answer: "6"
            explanation: "Under condition A, fermentation alone makes 2 ATP per glucose while releasing 2 CO2\
  \ per glucose, so 20 mL CO2 corresponds to 10 glucose-equivalents worth of fermentation,\
  \ yielding 100 equivalents of ATP as given (10 x ~2 scaled to 100 for this equivalence\
  \ unit, i.e. 50 equivalents of glucose consumed by fermentation). Under condition\
  \ B, the 30 mL O2 absorbed corresponds to 30 mL CO2 from aerobic respiration (30\
  \ equivalents of glucose x 32 ATP = 960... scaling consistently with A's units gives\
  \ 25 glucose-equivalents through aerobic respiration (32 x 25 = 800) plus the remaining\
  \ 10 mL CO2 from fermentation (25 glucose-equivalents x 2 = 50), for a total of\
  \ 800 + 50 = 850 equivalents of ATP."

      - id: q13
        number: "Q13"
        name: "Bombay Phenotype and the Probability of Blood Type B in a Second Child"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=22"
        subjects:
          - name: "Extensions of Mendelian Inheritance"
            link: "/resources/7-genetics/extensions-of-mendelian-inheritance/"
          - name: "Mendel's Laws & Probability in Genetics"
            link: "/resources/7-genetics/mendelian-inheritance-probability/"
        statements:
          - letter: "chance of B type"
            type: "numeric"
            text: "When Carl and Jane have another child, what is the chance of their child's blood\
  \ type being B (as a percentage)?"
            expected: 37.5
            tolerance: 0.5
            explanation: "Since Lisa (genotype OO at the ABO locus by blood typing, but really a Bombay hh\
  \ individual masking her true ABO genotype) shows Carl and Jane both carry a hidden\
  \ O allele, Carl (blood type B) must be BO and Jane (AB) must be AB; and since Lisa\
  \ is Bombay (hh), both parents must also be carriers Hh at the H-antigen locus.\
  \ A cross of BO x AB gives offspring genotypes AB, BB, AO, BO each at 1/4, of which\
  \ BB and BO (2/4 = 1/2) would show as B type ABO genotype: but only if the H antigen\
  \ is present. Since both parents are Hh, 3/4 of children have at least one H allele\
  \ and can express their ABO phenotype normally, while 1/4 are hh (Bombay, phenotypically\
  \ O regardless of ABO genotype). The probability of true B phenotype is therefore\
  \ 1/2 (B genotype) x 3/4 (H antigen present) = 3/8 = 37.5%."

      - id: q14
        number: "Q14"
        name: "Identifying the First Limiting Reagent in a Multi-Cycle PCR Reaction"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=23"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "stop cycle and limiting component"
            type: "mcq"
            text: "Choose the correct combination of the reaction stop cycle and the limiting component."
            options: [{key: "1", text: "Cycle 7, Primer pairs"}, {key: "2", text: "Cycle 7, dNTPs"}, {key: "3", text: "Cycle 7, DNA polymerase"}, {key: "4", text: "Cycle 8, Primer pairs"}, {key: "5", text: "Cycle 8, dNTPs"}, {key: "6", text: "Cycle 8, DNA polymerase"}, {key: "7", text: "Cycle 9, Primer pairs"}, {key: "8", text: "Cycle 9, dNTPs"}, {key: "9", text: "Cycle 9, DNA polymerase"}, {key: "0", text: "Others"}]
            answer: "2"
            explanation: "Each cycle needs one primer pair and 160 dNTPs (80 bases extended per new strand\
  \ x 2 new strands) per double-stranded molecule entering that cycle, with the molecule\
  \ count doubling from 4 each cycle. Cumulative primer usage stays under the 1,000-set\
  \ supply through cycle 7 (about 508 sets) but would need about 1,020 sets to complete\
  \ cycle 8, while cumulative dNTP usage already exceeds the 48,000-molecule supply\
  \ partway through cycle 7 (roughly 40,320 used after cycle 6, needing about 40,960\
  \ more for cycle 7 alone). Because dNTPs run out first, during cycle 7, before the\
  \ primer supply is exhausted (at cycle 8) or the polymerase requirement per cycle\
  \ exceeds 1,200 (not until cycle 9, since polymerase is reused rather than consumed),\
  \ dNTPs are the actual first limiting component, stopping the reaction at cycle\
  \ 7."

      - id: q15
        number: "Q15"
        name: "Engineering Candida tropicalis Gene Disruptions to Boost Xylitol Production"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=24"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "graph-to-strain match"
            type: "mcq"
            text: "Select the number of the most appropriate combination of the culture progress graphs\
  \ (B) and (C) in Figure 2 with the disrupted strains, given graph (A) is the original\
  \ AT36 strain."
            options: [{key: "1", text: "Graph A=AT36, Graph B=Disruptant A, Graph C=Disruptant D"}, {key: "2", text: "Graph A=AT36, Graph B=Disruptant A, Graph C=Disruptant C"}, {key: "3", text: "Graph A=AT36, Graph B=Disruptant B, Graph C=Disruptant D"}, {key: "4", text: "Graph A=AT36, Graph B=Disruptant C, Graph C=Disruptant D"}, {key: "5", text: "Graph A=AT36, Graph B=Disruptant D, Graph C=Disruptant C"}, {key: "6", text: "Graph A=AT36, Graph B=Disruptant C, Graph C=Disruptant B"}]
            answer: "4"
            explanation: "Disrupting one XYL2 gene (Disruptant C) halves XDH activity (the enzyme that consumes\
  \ xylitol downstream) while leaving XR (which makes xylitol) untouched, so xylitol\
  \ should still be produced at the normal rate but accumulate to a higher final amount:\
  \ matching graph (B), a boosted version of (A). Disrupting both XYL2 genes (Disruptant\
  \ D) removes XDH activity for converting xylose downstream almost entirely, so the\
  \ strain can no longer properly use xylose, its only carbon source, and growth (and\
  \ xylitol production) collapses: matching graph (C), the most severely impaired\
  \ profile. This gives graph B = Disruptant C and graph C = Disruptant D."

      - id: q16
        number: "Q16"
        name: "Diagnosing Missing DNA Replication Enzymes from Failed In Vitro Experiments"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=26"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "student B and C causes"
            type: "mcq"
            text: "Choose the combination of the number that most likely caused the failures of students\
  \ B and C."
            options: [{key: "1", text: "Student B: R1, Student C: R5"}, {key: "2", text: "Student B: R1, Student C: R6"}, {key: "3", text: "Student B: R2, Student C: R4"}, {key: "4", text: "Student B: R2, Student C: R6"}, {key: "5", text: "Student B: R3, Student C: R4"}, {key: "6", text: "Student B: R3, Student C: R5"}]
            answer: "2"
            explanation: "Student B's product still has RNA primer fragments attached to the short strands,\
  \ meaning polymerase III made the strands but polymerase I (which normally removes\
  \ RNA primers and fills the gaps with DNA) never acted: matching R1 (polymerase\
  \ I missing). Student C's product instead shows many short single-stranded fragments\
  \ (with primers presumably already removed, since none are mentioned) that were\
  \ simply never joined into a continuous strand, pointing to a missing DNA ligase:\
  \ matching R6. Together this gives student B = R1, student C = R6."

      - id: q17
        number: "Q17"
        name: "Ranking Organism Genome Sizes from a Photo Panel"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=27"
        subjects:
          - name: "Chromosomal Variation: Number & Structure"
            link: "/resources/7-genetics/chromosomal-variation-number-structure/"
          - name: "Major Taxa Cross-Reference"
            link: "/resources/4-biosystematics/major-taxa-cross-reference/"
        statements:
          - letter: "genome size order"
            type: "mcq"
            text: "Arrange the genomes of the organisms in the photo (A: human, B: water flea, C: yeast,\
  \ D: bacteria, E: nematode) in descending order by genome size."
            options: [{key: "1", text: "A-B-C-D-E"}, {key: "2", text: "A-B-C-E-D"}, {key: "3", text: "A-C-B-D-E"}, {key: "4", text: "A-C-B-E-D"}, {key: "5", text: "A-B-E-D-C"}, {key: "6", text: "A-B-D-E-C"}, {key: "7", text: "A-B-E-C-D"}, {key: "8", text: "A-C-B-E-D"}]
            answer: "7"
            explanation: "Approximate genome sizes for these species are: human (A) ~3000 Mb, water flea Daphnia\
  \ pulex (B) ~200 Mb, nematode C. elegans (E) ~100 Mb, budding yeast (C) ~12 Mb,\
  \ and acetic acid bacteria (D) ~2.9 Mb. Ranking these from largest to smallest gives\
  \ human > water flea > nematode > yeast > bacteria, i.e. A-B-E-C-D: illustrating\
  \ that genome size does not simply track with organismal complexity (the multicellular\
  \ animals and human have much larger genomes than the unicellular yeast and bacteria,\
  \ but the relative order among the animals doesn't follow body-plan complexity either)."

      - id: q18
        number: "Q18"
        name: "Predicting Spore Genotype Frequencies from Yeast Meiosis"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=28"
        subjects:
          - name: "Mendel's Laws & Probability in Genetics"
            link: "/resources/7-genetics/mendelian-inheritance-probability/"
          - name: "Linkage, Recombination & Genetic Mapping"
            link: "/resources/7-genetics/linkage-recombination-genetic-mapping/"
        statements:
          - letter: "number of spores"
            type: "mcq"
            text: "Choose the appropriate number of spores (out of 160) that can grow on a medium containing\
  \ uracil but not leucine or histidine."
            options: [{key: "1", text: "10"}, {key: "2", text: "20"}, {key: "3", text: "25"}, {key: "4", text: "40"}, {key: "5", text: "50"}, {key: "6", text: "80"}, {key: "7", text: "120"}, {key: "8", text: "150"}]
            answer: "2"
            explanation: "Growing on uracil-supplemented medium lacking leucine and histidine requires a spore\
  \ to be prototrophic (dominant, functional) for all three of LEU1, LEU2, and HIS3\
  \ simultaneously, since a defect in any one of those three genes would create a\
  \ need for the corresponding supplement that isn't provided. Each of these three\
  \ independently-assorting genes is heterozygous in the diploid, so each has a 1/2\
  \ chance of segregating the dominant, functional allele into a given spore, giving\
  \ a combined probability of (1/2)^3 = 1/8 for all three at once; out of 160 total\
  \ spores, 160/8 = 20 are expected to have this genotype."

      - id: q19
        number: "Q19"
        name: "Genotyping T-DNA Insertion Lines by PCR Band Pattern"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=29"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "genotype combination"
            type: "mcq"
            text: "Choose the correct homozygous, heterozygous, and wild-type combination for T-DNA\
  \ insertions in Strain A, B, and C."
            options: [{key: "1", text: "A=homo, B=hetero, C=wild type"}, {key: "2", text: "A=homo, B=wild type, C=hetero"}, {key: "3", text: "A=hetero, B=homo, C=wild type"}, {key: "4", text: "A=hetero, B=wild type, C=homo"}, {key: "5", text: "A=wild type, B=homo, C=hetero"}, {key: "6", text: "A=wild type, B=hetero, C=homo"}]
            answer: "5"
            explanation: "With primers 1+2 (spanning the insertion site, only amplifying a short ~500 bp product\
  \ from a non-inserted allele since the T-DNA is too large to amplify across), Figure\
  \ 2 shows a band for A and C but not B, meaning A and C each carry at least one\
  \ wild-type (non-inserted) allele while B carries none. With primers 1+3 (only amplifying\
  \ if the T-DNA insertion is present, since primer 3 sits inside the T-DNA), Figure\
  \ 2 shows a band for B and C but not A, meaning A carries no inserted allele while\
  \ B and C do. Combining both results: A has only wild-type alleles (wild type),\
  \ B has only inserted alleles (homozygous for the insertion), and C has both a wild-type\
  \ and an inserted allele (heterozygous)."

      - id: q20
        number: "Q20"
        name: "Reconstructing a Two-Gene Co-Dominance Model for Flower Color"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=31"
        subjects:
          - name: "Gene Interactions: Epistasis & Complementation Analysis"
            link: "/resources/7-genetics/epistasis-gene-interactions-complementation/"
        statements:
          - letter: "probability of reddish-purple"
            type: "numeric"
            text: "The probability that reddish-purple individuals appear in the F2 generation obtained\
  \ by self-pollination of the BRWW strain (i.e. the offspring of crossing the BR\
  \ strain with the WW strain, then self-pollinated) is what percentage?"
            expected: 37.5
            tolerance: 0.5
            explanation: "Using a blue-pigment gene P and a red-pigment gene Q, WW is ppqq, BB is PPqq, and\
  \ RR is ppQQ, so BR (from BBxRR) is PpQq. Crossing BR (PpQq) with WW (ppqq) gives\
  \ a BRWW generation that is also heterozygous PpQq (since ppqq contributes only\
  \ recessive alleles), and self-pollinating this PpQq plant produces a standard 9:3:3:1\
  \ dihybrid ratio. Reddish-purple requires heterozygosity at the P locus (Pp) together\
  \ with at least one dominant Q allele (QQ or Qq): the Pp genotype occurs in 1/2\
  \ of offspring, and QQ-or-Qq occurs in 3/4, giving 1/2 x 3/4 = 3/8 = 37.5% reddish-purple\
  \ offspring in the F2."

      - id: q21
        number: "Q21"
        name: "Which Animal Viruses Must Package an Enzyme Inside the Capsid"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=32"
        subjects:
          - name: "Translation & the Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "which viruses need a packaged enzyme"
            type: "mcq"
            text: "Select the most appropriate combination of viruses (from A-F) that must contain an\
  \ enzyme in the capsid for replication."
            options: [{key: "1", text: "A, C"}, {key: "2", text: "B, C"}, {key: "3", text: "B, D"}, {key: "4", text: "B, E"}, {key: "5", text: "B, F"}, {key: "6", text: "C, E"}, {key: "7", text: "D, E"}, {key: "8", text: "E, F"}]
            answer: "8"
            explanation: "Animal host cells have no RNA-dependent RNA polymerase and no reverse transcriptase\
  \ of their own, so any virus that needs one of these enzymes immediately upon entry\
  \ must bring its own copy packaged in the capsid. Influenza (E) is a negative-sense\
  \ RNA virus whose genome must first be transcribed into mRNA by a virus-supplied\
  \ RNA-dependent RNA polymerase before any viral protein (including more polymerase)\
  \ can be made, and HIV (F) must reverse-transcribe its RNA genome into DNA before\
  \ host machinery can express it, so both E and F require a pre-packaged enzyme;\
  \ rotavirus (C, double-stranded RNA) also needs its own polymerase, but the question\
  \ is looking for the single best-matching pair, E and F, since dsDNA virus A and\
  \ DNA virus B can rely on host DNA/RNA polymerases, and mRNA-sense virus D (rhinovirus)\
  \ can be translated directly by host ribosomes without any packaged enzyme."

      - id: q22
        number: "Q22"
        name: "Planning a Two-Gene pBR322 Cloning Strategy with Compatible Restriction Sites"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=33"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "step order"
            type: "mcq"
            text: "Select the number that indicates the appropriate procedure (Steps 1-6) for producing\
  \ the desired recombinant plasmid."
            options: [{key: "1", text: "A,G,X,C,H,Y"}, {key: "2", text: "C,H,Y,A,G,X"}, {key: "3", text: "A,G,X,D,I,Y"}, {key: "4", text: "D,I,Y,A,G,X"}, {key: "5", text: "B,F,X,D,I,Y"}, {key: "6", text: "D,I,Y,B,F,X"}, {key: "7", text: "B,F,X,E,I,Y"}, {key: "8", text: "E,I,Y,B,F,X"}]
            answer: "7"
            explanation: "Gene P (plasmid 1) is excised with EcoRI+ClaI (B) and ligated into pBR322 cut with\
  \ the matching EcoRI+ClaI sites (F then X), forming the first recombinant plasmid.\
  \ Gene Q (plasmid 2) cannot be cut with EcoRI (an EcoRI site sits inside gene B\
  \ itself, which would fragment the gene), so it must instead be excised with ClaI+XhoI\
  \ (E); XhoI and SalI produce compatible, ligatable ends, so this fragment can be\
  \ ligated into the first recombinant plasmid's remaining ClaI+SalI sites (I then\
  \ Y). This gives the order B, F, X, E, I, Y."

      - id: q23
        number: "Q23"
        name: "Oocyte Attrition, Ovulation Fraction, and Maternal-Age Risk of Down Syndrome"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=36"
        subjects:
          - name: "Human Reproductive System"
            link: "/resources/2-animal-anatomy/human-reproductive-system/"
          - name: "Cell Cycle, Mitosis & Meiosis"
            link: "/resources/1-cell-molecular/cell-cycle-mitosis-meiosis/"
        statements:
          - letter: "Q23-1"
            text: "The number of germ cells decreased by 70% at birth because the oocytes die during\
  \ the period of meiosis II."
            answer: false
            explanation: "Human oocytes arrest in prophase of meiosis I (specifically at the diplotene stage)\
  \ from fetal life until ovulation, not in meiosis II: they don't reach meiosis\
  \ II until just before or at ovulation, decades later. The large fetal-to-birth\
  \ loss of oocytes therefore reflects attrition of cells arrested in meiosis I, not\
  \ meiosis II."
          - letter: "Q23-2"
            type: "mcq"
            text: "The number of oocytes that are ovulated during menstrual periods is less than ___\
  \ of the germ cells surviving at menarche."
            options: [{key: "1", text: "0.001%"}, {key: "2", text: "0.01%"}, {key: "3", text: "0.1%"}, {key: "4", text: "1%"}]
            answer: "3"
            explanation: "The reproductive span from menarche to menopause is roughly 37 years, giving about\
  \ 37 x 12 = 444 (about 450) ovulations in a lifetime, compared to roughly 500,000\
  \ germ cells present at menarche. That is about 450/500,000, approximately 0.09%,\
  \ which is less than 0.1% but not less than 0.01%."
          - letter: "Q23-3"
            type: "mcq"
            text: "The risk of Down syndrome increases with the age of the mother. Choose the most appropriate\
  \ reason for this."
            options: [{key: "1", text: "accumulation of mutation on oocyte DNA"}, {key: "2", text: "prolongation of chromosome synapsis in primary oocytes"}, {key: "3", text: "increase in improperly formed spindle in oocytes"}, {key: "4", text: "transformation of oocytes"}]
            answer: "2"
            explanation: "Primary oocytes remain arrested in the diplotene stage of meiotic prophase I, with\
  \ homologous chromosomes held together (synapsed) at chiasmata, for as long as decades\
  \ until ovulation. The longer this synapsis is prolonged in an older woman's oocytes,\
  \ the greater the chance that the chromosome-holding structures degrade or fail,\
  \ causing errors in chromosome segregation (nondisjunction) responsible for the\
  \ increased Down syndrome risk with maternal age."

      - id: q24
        number: "Q24"
        name: "Interpreting Pressure-Volume Relationships Across the Cardiac Cycle"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=37"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "Q24-1"
            text: "Elevation of heart rate did not change in duration between the point E and F in Figure\
  \ 1."
            answer: true
            explanation: "The E-to-F interval corresponds to the period from atrial contraction and excitation\
  \ reaching the ventricle via the Purkinje fibers, up until ventricular contraction\
  \ begins: a conduction/pre-contraction interval largely set by fixed conduction\
  \ velocities rather than by pacemaker rate. Since heart rate is instead controlled\
  \ mainly by the slope of the sinoatrial node's pacemaker potential, this E-F interval\
  \ stays essentially unchanged even as heart rate elevates."
          - letter: "Q24-2"
            type: "mcq"
            text: "Choose the corresponding period between point H and I in Figure 1 from the pressure-volume\
  \ relationship of the left ventricle (Figure 3)."
            options: [{key: "1", text: "segment (1)"}, {key: "2", text: "segment (2)"}, {key: "3", text: "segment (3)"}, {key: "4", text: "segment (4)"}]
            answer: "1"
            explanation: "Between points H and I, ventricular pressure is falling while ventricular volume\
  \ stays constant (the aortic valve has closed and the atrioventricular valve has\
  \ not yet opened, so no blood enters or leaves): this is isovolumetric relaxation.\
  \ On the pressure-volume loop, a period of falling pressure at constant volume appears\
  \ as a vertical drop, which corresponds to segment (1)."
          - letter: "Q24-3"
            text: "After point I in Figure 1, blood flows into both atria and ventricles."
            answer: true
            explanation: "After point I, ventricular pressure has fallen below atrial pressure, so the atrioventricular\
  \ valve opens (per the stem's own rule). With the atrioventricular valve open, blood\
  \ already present in the atria flows through into the ventricles, so both the atria\
  \ (receiving venous return) and the ventricles (receiving blood from the atria)\
  \ have blood flowing into them."
          - letter: "Q24-4"
            type: "mcq"
            text: "Choose the most appropriate pressure and volume relationship of the left ventricle\
  \ before (dotted line) and after (solid line) activation of the sympathetic nervous\
  \ system."
            options: [{key: "1", text: "option (1)"}, {key: "2", text: "option (2)"}, {key: "3", text: "option (3)"}, {key: "4", text: "option (4)"}, {key: "5", text: "option (5)"}, {key: "6", text: "option (6)"}]
            answer: "2"
            explanation: "Sympathetic activation increases the heart's contractility, letting the ventricle\
  \ generate higher pressure and eject more effectively, while the change in stroke\
  \ volume (the width of the pressure-volume loop) tends to become smaller as end-systolic\
  \ volume decreases more than end-diastolic volume changes. Option (2) is the diagram\
  \ showing this pattern: a taller, narrower loop after sympathetic activation compared\
  \ to before."

      - id: q25
        number: "Q25"
        name: "Linking Muscle Molecular Defects to Specific Contraction Abnormalities"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=39"
        subjects:
          - name: "Muscle Physiology"
            link: "/resources/3-animal-physiology/muscle-physiology/"
        statements:
          - letter: "A"
            type: "mcq"
            text: "Missense mutation in the Tropomyosin binding site of Actin that causes the muscle\
  \ to be more sensitive for intracellular Ca2+ concentration."
            options: [{key: "1", text: "Myopathy (muscle weakness)"}, {key: "2", text: "Difficulties in arm extension"}, {key: "3", text: "Tetany"}, {key: "4", text: "Hypercontractility"}]
            answer: "4"
            explanation: "Increased Ca2+ sensitivity means the actin-myosin cross-bridge cycle activates more\
  \ readily at a given Ca2+ level (fast contraction), but since a comparable amount\
  \ of Ca2+ removal is still needed to fully release the more-sensitive troponin-tropomyosin\
  \ complex, relaxation is disproportionately slow relative to how quickly contraction\
  \ started: matching hypercontractility (fast contraction, slow relaxation)."
          - letter: "B"
            type: "mcq"
            text: "Blocking the Ach release by Botulinum toxin treatment."
            options: [{key: "1", text: "Myopathy (muscle weakness)"}, {key: "2", text: "Difficulties in arm extension"}, {key: "3", text: "Tetany"}, {key: "4", text: "Hypercontractility"}]
            answer: "1"
            explanation: "Blocking acetylcholine release at the neuromuscular junction prevents the motor neuron\
  \ from ever triggering an action potential in the muscle fiber, so the muscle simply\
  \ cannot be activated to contract at all. An inability to generate normal contractile\
  \ force is the definition of myopathy (muscle weakness) here."
          - letter: "C"
            type: "mcq"
            text: "Nonsense mutation in Ca2+ pump gene, which causes a deficiency in the removal of\
  \ Ca2+ from cytosol."
            options: [{key: "1", text: "Myopathy (muscle weakness)"}, {key: "2", text: "Difficulties in arm extension"}, {key: "3", text: "Tetany"}, {key: "4", text: "Hypercontractility"}]
            answer: "2"
            explanation: "If the Ca2+ pump cannot clear Ca2+ back into the sarcoplasmic reticulum, cytosolic\
  \ Ca2+ stays elevated and the actin-myosin cross-bridges remain engaged, keeping\
  \ the muscle contracted (unable to relax) rather than triggering involuntary new\
  \ contractions elsewhere. A muscle stuck unable to relax after use (such as a flexor\
  \ muscle) manifests as difficulty extending the arm back out."
          - letter: "D"
            type: "mcq"
            text: "Low blood magnesium level, which results in frequent and uncontrolled depolarization."
            options: [{key: "1", text: "Myopathy (muscle weakness)"}, {key: "2", text: "Difficulties in arm extension"}, {key: "3", text: "Tetany"}, {key: "4", text: "Hypercontractility"}]
            answer: "3"
            explanation: "Frequent, uncontrolled depolarization of the muscle membrane triggers repeated, involuntary\
  \ action potentials and therefore repeated involuntary contractions without normal\
  \ voluntary control. Sustained, involuntary muscle contraction of this kind is the\
  \ definition of tetany."

      - id: q26
        number: "Q26"
        name: "Interpreting Gene A and Gene B Function in Endochondral Ossification"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=41"
        subjects:
          - name: "Human Skeletal System"
            link: "/resources/2-animal-anatomy/human-skeletal-system/"
        statements:
          - letter: "interpretation of gene A and gene B"
            type: "mcq"
            text: "Choose the correct interpretation of endochondral ossification and the function of\
  \ genes A and B."
            options: [{key: "1", text: "Gene A: cartilage-bone formation Promote, cartilage replacement Required; Gene B:\
  \ cartilage formation Promote, bone formation Not required"}, {key: "2", text: "Gene A: cartilage-bone formation Required, cartilage replacement Promote; Gene B:\
  \ cartilage formation Required, bone formation Promote"}, {key: "3", text: "Gene A: cartilage-bone formation Required, cartilage replacement Promote; Gene B:\
  \ cartilage formation Required, bone formation Repress"}, {key: "4", text: "Gene A: cartilage-bone formation Required, cartilage replacement Promote; Gene B:\
  \ cartilage formation Not required, bone formation Promote"}, {key: "5", text: "Gene A: cartilage-bone formation Required, cartilage replacement Promote; Gene B:\
  \ cartilage formation Not required, bone formation Repress"}, {key: "6", text: "Gene A: cartilage-bone formation Required, cartilage replacement Repress; Gene B:\
  \ cartilage formation Required, bone formation Promote"}, {key: "7", text: "Gene A: cartilage-bone formation Required, cartilage replacement Repress; Gene B:\
  \ cartilage formation Required, bone formation Repress"}, {key: "8", text: "Gene A: cartilage-bone formation Required, cartilage replacement Repress; Gene B:\
  \ cartilage formation Not required, bone formation Promote"}, {key: "9", text: "Gene A: cartilage-bone formation Required, cartilage replacement Repress; Gene B:\
  \ cartilage formation Not required, bone formation Repress"}]
            answer: "8"
            explanation: "Losing gene A entirely prevents both cartilage and bone from forming at all, showing\
  \ gene A's cartilage-forming (chondrocyte-support) role is required, not merely\
  \ promoting; gaining extra gene A function still allows cartilage but delays/reduces\
  \ bone replacement, showing gene A's effect on the cartilage-to-bone replacement\
  \ step is to repress it, not promote it. Losing gene B still allows cartilage and\
  \ bone to form essentially normally (cartilage formation is not required to depend\
  \ on gene B), while gaining extra gene B function suppresses bone formation relative\
  \ to cartilage: so gene B is not required for cartilage formation but does promote/accelerate\
  \ bone formation when active. Reading these four qualitative relationships together\
  \ (Required/Repress for gene A, Not required/Promote for gene B) matches option\
  \ (8)."

      - id: q27
        number: "Q27"
        name: "Testing How Honeybees Measure Flight Distance for the Waggle Dance"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=43"
        subjects:
          - name: "Animal Communication"
            link: "/resources/9-ethology/animal-communication/"
          - name: "Orientation & Navigation"
            link: "/resources/9-ethology/orientation-navigation/"
        statements:
          - letter: "Q27-1"
            type: "mcq"
            text: "How long is the duration of the waggle dance when the tunnel was extended to be two-times\
  \ longer in the opposite direction of the hive in experiment 2?"
            options: [{key: "1", text: "634 ms"}, {key: "2", text: "740 ms"}, {key: "3", text: "846 ms"}, {key: "4", text: "952 ms"}]
            answer: "4"
            explanation: "The difference between experiments 2 and 4's waggle durations (529-441 = 88 ms) corresponds\
  \ to the difference in their outside-tunnel flight distances (35-6 = 29 m), giving\
  \ a rate of about 88/29 is about 3.03 ms per outside-meter; subtracting the outside-flight\
  \ contribution (35 m x 3.03 is about 106 ms) from experiment 2's total (529 ms)\
  \ isolates the tunnel-only contribution as about 423 ms for the original 6 m tunnel.\
  \ Doubling the tunnel length doubles that tunnel contribution to about 846 ms, and\
  \ adding back the same 106 ms outside-flight contribution (the feeder's position\
  \ relative to the tunnel end is unchanged) gives 846 + 106 = 952 ms."
          - letter: "Q27-2"
            type: "mcq"
            text: "Choose the most appropriate answer from the following statements: 1. When the walls\
  \ and floor are lined with vertically oriented stripes in experiment 3, most bees\
  \ will perform the waggle dance. 2. Bees perform a waggle dance with the same duration\
  \ for two different feeders; if bees fly to the two feeders with the same speed,\
  \ the durations from the hive to the feeders are the same. 3. The duration of the\
  \ waggle dance does not change if the bees fly at a different height."
            options: [{key: "1", text: "statement 1"}, {key: "2", text: "statement 2"}, {key: "3", text: "statement 3"}]
            answer: "1"
            explanation: "Vertical (axial) stripes running along the direction of flight give the bee a continuously\
  \ changing visual scene as it moves through the tunnel, similar to the random pattern\
  \ used in the round-dance-eliciting short tunnels, so bees can register that they\
  \ have traveled a meaningful distance and are expected to perform the waggle dance\
  \ (as in Figure 2's random-pattern, waggle-dance experiments) rather than the round\
  \ dance. Statement 2 is not necessarily true because waggle duration reflects optic\
  \ flow (visual motion) rather than a fixed function of straight-line travel time,\
  \ and statement 3 is not established by anything in the experiments described."

      - id: q28
        number: "Q28"
        name: "CYP2C19 Polymorphisms and Drug Metabolism of Omeprazole and Clopidogrel"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=45"
        subjects:
          - name: "Digestive & Metabolic Physiology"
            link: "/resources/3-animal-physiology/digestive-metabolic-physiology/"
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            type: "mcq"
            text: "Orally administered drugs absorbed in the intestinal epithelium are first transported\
  \ to ___."
            options: [{key: "1", text: "Inferior vena cava"}, {key: "2", text: "liver"}, {key: "3", text: "heart (right atrium)"}, {key: "4", text: "pancreas"}, {key: "5", text: "Large intestine"}]
            answer: "2"
            explanation: "Blood draining from the small intestine enters the hepatic portal vein, which carries\
  \ it directly to the liver before it reaches the general (systemic) circulation.\
  \ This first-pass routing through the liver is exactly why oral drugs are exposed\
  \ to hepatic metabolizing enzymes like CYP2C19 immediately after absorption."
          - letter: "B"
            type: "mcq"
            text: "What is the order of genotypes for the effect of omeprazole from the most long-lasting\
  \ to the shortest-lasting effect after oral administration?"
            options: [{key: "1", text: "*1/*1 > *1/*3 > *2/*2"}, {key: "2", text: "*1/*1 > *3/*3 > *1/*2"}, {key: "3", text: "*3/*3 > *1/*2 > *1/*1"}, {key: "4", text: "*3/*3 > *1/*1 > *1/*3"}]
            answer: "3"
            explanation: "Since omeprazole is inactivated by CYP2C19, less functional CYP2C19 activity means\
  \ the drug is cleared more slowly and its effect lasts longer: so poor metabolizers\
  \ (genotypes built from more *2/*3 alleles, like *3/*3) have the most long-lasting\
  \ effect, extensive metabolizers (*1/*1) clear it fastest and have the shortest-lasting\
  \ effect, and intermediate genotypes (*1/*2) fall in between. This gives the order\
  \ *3/*3 > *1/*2 > *1/*1, from longest- to shortest-lasting."
          - letter: "C"
            type: "mcq"
            text: "Which countries have the highest proportion of patients for whom omeprazole works\
  \ well?"
            options: [{key: "1", text: "Sweden"}, {key: "2", text: "France"}, {key: "3", text: "China"}, {key: "4", text: "Japan"}]
            answer: "4"
            explanation: "Omeprazole \"working well\" (having a stronger, longer-lasting effect at a given\
  \ dose) is favored by lower CYP2C19 activity, i.e. higher frequencies of the *2\
  \ and *3 alleles. Table 2 shows Japan has the highest combined *2+*3 allele frequency\
  \ (49.9%+22.5% = 72.4%), and correspondingly the highest proportion of poor/intermediate\
  \ metabolizers among the listed countries."
          - letter: "D"
            type: "mcq"
            text: "If clopidogrel does not show sufficient effect due to the CYP2C19 SNPs in the patient,\
  \ what is expected by combining omeprazole with clopidogrel on the effectiveness\
  \ of the clopidogrel?"
            options: [{key: "1", text: "improves the effectiveness"}, {key: "2", text: "no change in the effectiveness"}, {key: "3", text: "worsens the effectiveness"}]
            answer: "3"
            explanation: "Both drugs are metabolized by the same enzyme, CYP2C19, so giving omeprazole alongside\
  \ clopidogrel means the two drugs compete for the same limited enzyme, reducing\
  \ the amount of CYP2C19 available to activate clopidogrel into its active metabolite.\
  \ In a patient whose clopidogrel effect is already reduced (due to their own CYP2C19\
  \ SNPs), this added competition from omeprazole would further reduce clopidogrel's\
  \ already-insufficient effectiveness."

      - id: q29
        number: "Q29"
        name: "Factors Driving Coronavirus Genome Variation and Cross-Species Transmission"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=46"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "Q29-1"
            type: "mcq"
            text: "Which factor increases variation of the coronavirus genome in A? Choose a combination\
  \ of correct answers: a) The viral genome is surrounded by capsids. b) The virus\
  \ has an envelope. c) The host DNA replication mechanism has a proofreading function.\
  \ d) The genome size is large for a RNA virus. e) The genome is segmented by some\
  \ polycistronic genes."
            options: [{key: "1", text: "a), b)"}, {key: "2", text: "a), c)"}, {key: "3", text: "a), e)"}, {key: "4", text: "b), c)"}, {key: "5", text: "b), d)"}, {key: "6", text: "c), d)"}, {key: "7", text: "c), e)"}, {key: "8", text: "d), e)"}]
            answer: "8"
            explanation: "Coronaviruses replicate their genome using their own viral RNA-dependent RNA polymerase,\
  \ which generally lacks the proofreading function of host DNA replication (so option\
  \ c, referring to the host's DNA proofreading, is irrelevant to an RNA virus's own\
  \ genome replication fidelity). A genome that is unusually large for an RNA virus\
  \ (d) accumulates more replication errors per genome copied, and having a genome\
  \ effectively organized into separable/polycistronic segments (e) increases opportunities\
  \ for recombination between co-infecting viral genomes: both d) and e) increase\
  \ genomic variation, matching option 8."
          - letter: "Q29-2"
            type: "mcq"
            text: "Which of the following facts contribute to the transmission of coronavirus in B and\
  \ B'? Choose a combination of correct answers: a) Disease does not develop in natural\
  \ host bats. b) Multiple types of coronaviruses are detected in the fecal masses\
  \ of bats in one cave by RT-PCR. c) Many bat species are nocturnal. d) Habitat changes\
  \ occur due to climate change. e) Many bat species feed on various insects."
            options: [{key: "1", text: "a), b), c)"}, {key: "2", text: "a), b), d)"}, {key: "3", text: "a), b), e)"}, {key: "4", text: "a), c), e)"}, {key: "5", text: "b), c), d)"}, {key: "6", text: "b), d), e)"}, {key: "7", text: "b), c), d)"}, {key: "8", text: "b), c), e)"}]
            answer: "2"
            explanation: "Bats not becoming sick themselves (a) lets them carry and shed diverse coronaviruses\
  \ for long periods without being removed from the population by illness, and finding\
  \ multiple distinct coronavirus types co-circulating in one bat colony (b) shows\
  \ the rich viral reservoir and opportunity for recombination that exists there.\
  \ Habitat changes from climate change (d) push bats and other wildlife into closer\
  \ contact with humans and livestock, increasing spillover opportunities: together\
  \ a, b, and d best explain increased transmission risk, while nocturnal habits (c)\
  \ and insect diet (e) are not themselves transmission-relevant factors."

      - id: q30
        number: "Q30"
        name: "Photoperiod, Growth Rate and the Timing of Red Leaf Formation in Amaranth"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=47"
        subjects:
          - name: "Photoperiodism, Vernalization & Flowering"
            link: "/resources/5-plant-physiology/photoperiodism-vernalization-flowering/"
        statements:
          - letter: "Q30-1"
            type: "free_response"
            text: "Rank the 70-day-old plants cultured under the five different photoperiodic conditions\
  \ (1: 16L8D, 2: 14L10D, 3: 12L12D, 4: 8L16D, 5: 7L8D1L8D) in descending order of\
  \ their average number of red leaves."
            modelAnswer: "12L12D > 8L16D > 7L8D1L8D > 14L10D > 16L8D"
            explanation: "The number of red leaves on a 70-day-old plant equals its total leaf number at day\
  \ 70 minus the leaf position at which red leaves first began forming, plus one.\
  \ Working this out from the growth curves: 12L12D forms about 18-10+1 = 9 red leaves,\
  \ 8L16D about 10-4.5+1 = 6.5, 7L8D1L8D about 10-6+1 = 5, 14L10D about 21.5-19+1\
  \ = 3.5, and 16L8D forms no red leaves at all (0) since it never induces red leaf\
  \ formation: giving the descending order 12L12D > 8L16D > 7L8D1L8D > 14L10D >\
  \ 16L8D."
          - letter: "Q30-2"
            type: "mcq"
            text: "Assuming a red leaf-inducing signal X is produced in expanded leaves and transported\
  \ to the shoot apical region, two hypotheses explain the partially-red color pattern:\
  \ I, the distal part of each leaf primordium requires a higher concentration of\
  \ signal X for red coloration than the proximal part; II, during leaf primordium\
  \ development, the distal part is determined for coloration earlier than the proximal\
  \ part. Which experiment is most informative to distinguish between these hypotheses?"
            options: [{key: "1", text: "Examine color patterns of leaves newly formed on the scion after grafting the scion\
  \ of the 60-day-old 8L16D plant onto the stock of the 60-day-old 16L8D plant."}, {key: "2", text: "Examine color patterns of leaves newly formed on the scion after grafting the scion\
  \ of the 60-day-old 16L8D plant onto the stock of the 60-day-old 8L16D plant."}, {key: "3", text: "Examine color patterns of leaves newly formed after transferring 60-day-old plants\
  \ from the 8L16D condition to the 16L8D condition."}, {key: "4", text: "Examine color patterns of leaves newly formed after transferring 60-day-old plants\
  \ from the 16L8D condition to the 8L16D condition."}]
            answer: "2"
            explanation: "Grafting a non-red-inducing (16L8D) scion onto a red-leaf-inducing (8L16D) stock\
  \ forces a sudden, large supply of signal X up into the scion's leaf primordia (rather\
  \ than the gradual buildup that occurs naturally), which is exactly the kind of\
  \ abrupt-signal-availability test needed to tell the two hypotheses apart: if hypothesis\
  \ I is correct, a high enough sudden dose should make the whole newly-formed leaf\
  \ red at once (no partial pattern), whereas if hypothesis II is correct, a partial\
  \ (distal-then-proximal) pattern should still appear because the timing-based determination\
  \ process is unaffected by how quickly the signal became available. The other options\
  \ either transfer the same plant to a new condition (still a gradual within-plant\
  \ response) or graft a red-inducing scion onto a non-inducing stock (the scion already\
  \ commits to its own coloration developmentally, so the stock's signal supply is\
  \ less informative)."

      - id: q31
        number: "Q31"
        name: "Auxin, Cytokinin and Density Effects on Bud Formation in the Moss Physcomitrella"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=49"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "A, B, C fill-in"
            type: "mcq"
            text: "Choose the most appropriate answer set to fill in the blanks: The wild-type protonemata\
  \ secrete (A). Auxin sensitivity is (B) in mutant x. Protonemata are more likely\
  \ to form buds when their growing density is (C)."
            options: [{key: "1", text: "A: both auxin and cytokinin, B: lost, C: higher"}, {key: "2", text: "A: both auxin and cytokinin, B: lost, C: lower"}, {key: "3", text: "A: both auxin and cytokinin, B: normal, C: higher"}, {key: "4", text: "A: both auxin and cytokinin, B: normal, C: lower"}, {key: "5", text: "A: auxin but not cytokinin, B: lost, C: higher"}, {key: "6", text: "A: auxin but not cytokinin, B: lost, C: lower"}, {key: "7", text: "A: auxin but not cytokinin, B: normal, C: higher"}, {key: "8", text: "A: auxin but not cytokinin, B: normal, C: lower"}]
            answer: "3"
            explanation: "Both auxin and cytokinin were directly detected accumulating in the wild-type culture\
  \ medium, so the wild type secretes both (A = both auxin and cytokinin). Mutant\
  \ x still fails to form buds when auxin is added but succeeds when cytokinin is\
  \ added, showing it responds normally to auxin (its lack of buds under natural conditions\
  \ is instead a cytokinin-secretion defect, not a loss of auxin sensitivity), so\
  \ B = normal. Bud formation naturally occurs only without medium exchange, i.e.\
  \ when secreted hormones are allowed to build up and reach a high local concentration:\
  \ since protonemata growing at higher density would collectively secrete more\
  \ hormone into a shared local volume, reaching the required threshold more easily,\
  \ C = higher."

      - id: q32
        number: "Q32"
        name: "Turgor Pressure and Tissue Layer Mechanics in Explosive Seed Dispersal"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=51"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
        statements:
          - letter: "A, B, C fill-in"
            type: "mcq"
            text: "Choose the most appropriate answer set to fill in the blanks: Higher turgor pressure\
  \ leads to (A) bending of a fruit valve in C. hirsuta. A shallow cut made on an\
  \ intact fruit valve in the (B) direction would cause the cut to open immediately.\
  \ The outer layer cells of fruit valves are (C) in water as compared to those in\
  \ air."
            options: [{key: "1", text: "A: increased, B: longitudinal, C: narrower and/or thinner"}, {key: "2", text: "A: increased, B: longitudinal, C: wider and/or thicker"}, {key: "3", text: "A: increased, B: transverse, C: narrower and/or thinner"}, {key: "4", text: "A: increased, B: transverse, C: wider and/or thicker"}, {key: "5", text: "A: decreased, B: longitudinal, C: narrower and/or thinner"}, {key: "6", text: "A: decreased, B: longitudinal, C: wider and/or thicker"}, {key: "7", text: "A: decreased, B: transverse, C: narrower and/or thinner"}, {key: "8", text: "A: decreased, B: transverse, C: wider and/or thicker"}]
            answer: "4"
            explanation: "Comparing living valves in water (strong bending) versus in 4 M NaCl (an osmotic\
  \ condition that draws water out and collapses turgor, giving no bending) shows\
  \ that higher turgor pressure increases bending (A = increased). The isolated outer\
  \ layer alone, in water, is described as shrinking longitudinally, meaning the outer\
  \ layer's cells are under longitudinal tension in the intact valve; making a shallow\
  \ cut perpendicular to that tension: i.e. a cut running in the transverse direction:\
  \ would let that stored longitudinal stress relax and pull the cut open immediately\
  \ (B = transverse). Since the outer layer shrinks longitudinally when hydrated (freed\
  \ from the inner layer's restraint) rather than expanding, the underlying cause\
  \ is the outer layer's cells swelling (getting wider/thicker) in water compared\
  \ to air, which is constrained into a longitudinal shrink specifically because of\
  \ the geometry when separated from the inner layer (C = wider and/or thicker)."

      - id: q33
        number: "Q33"
        name: "Diagnosing Whether a Tendril Is a Modified Leaf or Modified Stem"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=53"
        subjects:
          - name: "Plant Body Plans Across Major Lineages"
            link: "/resources/6-plant-anatomy/plant-body-plans-major-lineages/"
          - name: "Stem Anatomy"
            link: "/resources/6-plant-anatomy/stem-anatomy/"
        statements:
          - letter: "most informative observation"
            type: "mcq"
            text: "For a tendril sample, which of the following observations is most informative for\
  \ judging whether it is a modified leaf or a modified stem?"
            options: [{key: "1", text: "Observation of the surface to examine the presence/absence of stomata"}, {key: "2", text: "Observation of the surface to examine the presence/absence of trichomes"}, {key: "3", text: "Observation of the surface to examine the thickness of the cuticular wax layer"}, {key: "4", text: "Observation of the surface to examine the shape of epidermal cells"}, {key: "5", text: "Observation of the cross section to examine the positional arrangement of the xylem\
  \ and phloem"}, {key: "6", text: "Observation of the cross section to examine the number of vascular strands"}, {key: "7", text: "Observation of the inner tissue to examine the presence/absence of developed chloroplasts"}, {key: "8", text: "Observation of the inner tissue to examine the presence/absence of the intercellular\
  \ air space"}]
            answer: "5"
            explanation: "Stomata, trichomes, cuticle thickness, epidermal cell shape, chloroplast development,\
  \ and intercellular air space are all surface/functional features that get heavily\
  \ and convergently modified in any tendril regardless of its origin, since a tendril's\
  \ job (grasping a support) is so different from a normal leaf or stem's job: these\
  \ features are not reliable indicators of origin. The relative positional arrangement\
  \ of xylem and phloem within the vascular bundle, however, is a developmentally\
  \ constrained trait that differs consistently between leaves (typically xylem facing\
  \ adaxially/upper, phloem abaxially/lower in a bifacial arrangement) and stems (often\
  \ a different, more radially symmetric arrangement), and this arrangement is preserved\
  \ even when the organ is otherwise heavily modified into a tendril."

      - id: q34
        number: "Q34"
        name: "Two-Preceding-Leaf Rule for Leaf Positioning in the Fibonacci Spiral"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=54"
        subjects:
          - name: "Tropisms & Nastic Movements"
            link: "/resources/5-plant-physiology/tropisms-nastic-movements/"
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "conclusions"
            type: "mcq"
            text: "What can be speculated from the above experiment? Choose the most appropriate set\
  \ of reasonable speculations: A. Among existing leaves, only the immediately preceding\
  \ leaf is critical for the determination of the position of a new leaf formation.\
  \ B. Among existing leaves, two preceding leaves are critical for the determination\
  \ of the position of a new leaf formation. C. When a leaf is newly arising, the\
  \ position of the next leaf is not determined yet. D. When a leaf is newly arising,\
  \ the position of the next leaf is already determined but the position of the second\
  \ next leaf is not determined yet. E. If n is sufficiently large, the deviation\
  \ of angle PnOPn+1 from 137.5 degrees is close to 0. F. If n is sufficiently large,\
  \ the deviation of angle PnOPn+1 from 137.5 degrees is close to 42.5 degrees."
            options: [{key: "1", text: "A, C, E"}, {key: "2", text: "A, C, F"}, {key: "3", text: "A, D, E"}, {key: "4", text: "A, D, F"}, {key: "5", text: "B, C, E"}, {key: "6", text: "B, C, F"}, {key: "7", text: "B, D, E"}, {key: "8", text: "B, D, F"}]
            answer: "7"
            explanation: "Isolating P0 disturbed the position of P2 (the second-next leaf after the cut), not\
  \ just P1, showing that a leaf two positions back (not just the immediately preceding\
  \ one) continues to exert influence on where later leaves form: so it is two preceding\
  \ leaves that matter, not just one, matching B over A. Since the cut, made only\
  \ after P0 itself had already arisen, still changed where P2 (not P1) later formed,\
  \ this indicates P1's position was already fixed by the time of the cut while P2's\
  \ was not yet determined, matching D. Since these effects are local, disturbances\
  \ at one point in the spiral eventually wash out and the normal 137.5-degree pattern\
  \ is restored for leaves formed far enough after the disturbance, matching E (deviation\
  \ approaches 0 for large n) rather than F. Together this gives B, D, E."

      - id: q35
        number: "Q35"
        name: "Nitrogen Source and the Reductant Competition Behind CAQ in C3 versus C4 Plants"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=56"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "Q35-1"
            type: "mcq"
            text: "Choose the appropriate answer set to fill in the blanks: Competition for reductants\
  \ between nitrogen assimilation and carbon assimilation (A) CAQ. As application\
  \ of ammonium skips its upstream steps of nitrogen assimilation, deltaCAQ correlates\
  \ (B) with the activity of the nitrate-to-ammonium conversion process of nitrogen\
  \ assimilation."
            options: [{key: "1", text: "A: raises, B: positively"}, {key: "2", text: "A: raises, B: negatively"}, {key: "3", text: "A: lowers, B: positively"}, {key: "4", text: "A: lowers, B: negatively"}]
            answer: "3"
            explanation: "Diverting reductants away from carbon assimilation toward nitrogen assimilation reduces\
  \ the CO2 absorption rate relative to O2 evolution, which by definition lowers CAQ\
  \ (A = lowers). Ammonium-grown plants skip the reductant-hungry nitrate-to-ammonium\
  \ step entirely, so their CAQ is higher (closer to the value without that competing\
  \ demand) whenever the nitrate-to-ammonium process would otherwise have been very\
  \ active: meaning a bigger gap (deltaCAQ = CAQ_ammonium - CAQ_nitrate) shows up\
  \ specifically when that process's activity is high, a positive correlation (B =\
  \ positively)."
          - letter: "Q35-2"
            type: "mcq"
            text: "In C4 plants, which cell is likely to be responsible for the nitrate-to-ammonium\
  \ and ammonium-to-glutamate processes of nitrogen assimilation?"
            options: [{key: "1", text: "nitrate-to-ammonium: mesophyll cell, ammonium-to-glutamate: mesophyll cell"}, {key: "2", text: "nitrate-to-ammonium: mesophyll cell, ammonium-to-glutamate: bundle sheath cell"}, {key: "3", text: "nitrate-to-ammonium: mesophyll cell, ammonium-to-glutamate: cannot determine from\
  \ the data provided"}, {key: "4", text: "nitrate-to-ammonium: bundle sheath cell, ammonium-to-glutamate: mesophyll cell"}, {key: "5", text: "nitrate-to-ammonium: bundle sheath cell, ammonium-to-glutamate: bundle sheath cell"}, {key: "6", text: "nitrate-to-ammonium: bundle sheath cell, ammonium-to-glutamate: cannot determine\
  \ from the data provided"}, {key: "7", text: "nitrate-to-ammonium: cannot determine from the data provided, ammonium-to-glutamate:\
  \ mesophyll cell"}, {key: "8", text: "nitrate-to-ammonium: cannot determine from the data provided, ammonium-to-glutamate:\
  \ bundle sheath cell"}, {key: "9", text: "nitrate-to-ammonium: cannot determine from the data provided, ammonium-to-glutamate:\
  \ cannot determine from the data provided"}]
            answer: "3"
            explanation: "In C4 plants, deltaCAQ stays low and essentially flat regardless of Ci, unlike C3\
  \ plants where it is high specifically when the Calvin cycle (which happens in bundle\
  \ sheath cells in C4 plants) is reductant-limited at low Ci. This flat pattern shows\
  \ the nitrate-to-ammonium process is not competing with the Calvin cycle for reductants\
  \ in bundle sheath cells, meaning it must occur in mesophyll cells instead, away\
  \ from the Calvin cycle. However, the data given (a CAQ-based readout of reductant\
  \ competition with the Calvin cycle specifically) provides no way to localize the\
  \ separate, non-competing ammonium-to-glutamate step, so that step's location cannot\
  \ be determined from this data."

      - id: q36
        number: "Q36"
        name: "Estimating Deleterious Mutations Passed On by Fathers of Different Ages"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=58"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "Age 20"
            type: "numeric"
            text: "What is the expected number of deleterious mutations an offspring receives from a\
  \ 20-year-old father?"
            expected: 0.28
            tolerance: 0.02
            explanation: "The genome (1 Gbp) contains 10,000 genes averaging 1 kbp each, so genic sequence\
  \ makes up 10,000 x 1000 / 1,000,000,000 = 1% of the genome. Of the 40 mutations\
  \ transmitted by a 20-year-old father, about 40 x 0.01 = 0.4 fall within a gene,\
  \ and since 70% of genic mutations are deleterious, the expected number of deleterious\
  \ mutations is 0.4 x 0.7 = 0.28."
          - letter: "Age 40"
            type: "numeric"
            text: "What is the expected number of deleterious mutations an offspring receives from a\
  \ 40-year-old father?"
            expected: 0.56
            tolerance: 0.02
            explanation: "By age 40, the father has accumulated 40 + 20 extra years x 2 mutations/year = 80\
  \ total mutations. The same 1% genic fraction gives 80 x 0.01 = 0.8 mutations landing\
  \ in a gene, and applying the same 70% deleterious probability gives 0.8 x 0.7 =\
  \ 0.56 expected deleterious mutations."

      - id: q37
        number: "Q37"
        name: "Tracking Hox Cluster and Gene Duplication History Through Vertebrate Phylogeny"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=59"
        subjects:
          - name: "Chromosomal Variation: Number & Structure"
            link: "/resources/7-genetics/chromosomal-variation-number-structure/"
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            type: "mcq"
            text: "Choose the appropriate combination of the numbers of Hox gene clusters (observed)\
  \ in vertebrates from the answer options given in Figure 1."
            options: [{key: "1", text: "option (1)"}, {key: "2", text: "option (2)"}, {key: "3", text: "option (3)"}, {key: "4", text: "option (4)"}, {key: "5", text: "option (5)"}, {key: "6", text: "option (6)"}]
            answer: "5"
            explanation: "Since Hox clusters are rarely lost, the number of Hox clusters in each lineage should\
  \ simply reflect how many rounds of whole-genome duplication occurred before that\
  \ lineage split off, starting from the lancelet's single ancestral cluster and doubling\
  \ at each duplication event marked on the tree. Reading off which lineages branch\
  \ before versus after each marked duplication event and counting accordingly identifies\
  \ option (5) as the combination consistent with the tree's marked duplication history."
          - letter: "B"
            type: "mcq"
            text: "Choose the appropriate phylogenetic tree of the genes X1 to Z2 (from the answer options\
  \ given in Figure 2) for species X, Y, and Z, given that two rounds of whole-genome\
  \ duplication occurred as shown."
            options: [{key: "1", text: "tree (1)"}, {key: "2", text: "tree (2)"}, {key: "3", text: "tree (3)"}, {key: "4", text: "tree (4)"}]
            answer: "2"
            explanation: "Because both duplication events occurred before the X/Y/Z speciation events (with\
  \ enough time passing before speciation), the gene tree for X1, X2, Y1, Y2, Z1,\
  \ Z2 must show the duplication-driven split (paralogs like X1 vs X2) as the deepest\
  \ branching within each species' pair, with the orthologous copies across species\
  \ (X1, Y1, Z1 as one group; X2, Y2, Z2 as the other) grouping according to the species\
  \ tree within each paralog group. Tree (2) is the option matching this expected\
  \ topology, where gene relationships track the duplication history correctly rather\
  \ than grouping all of one species' genes together."

      - id: q38
        number: "Q38"
        name: "Molecular Clock Estimates of Substitution Counts, Divergence Time and Domain-Specific Rates"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=61"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            type: "mcq"
            text: "In each of proteins X and Y, how many substitutions were expected to accumulate at\
  \ maximum between human and mouse, which diverged 80 million years ago (MYA)?"
            options: [{key: "1", text: "X: 25, Y: 40"}, {key: "2", text: "X: 40, Y: 100"}, {key: "3", text: "X: 40, Y: 120"}, {key: "4", text: "X: 10, Y: 40"}]
            answer: "3"
            explanation: "Substitutions accumulate independently along both branches since the shared ancestor,\
  \ so the total expected substitutions is rate x sites x time x 2 (for both lineages).\
  \ For protein X: 0.625x10^-9 x 400 x 8x10^7 x 2 = 40 substitutions. For protein\
  \ Y: 1.25x10^-9 x 600 x 8x10^7 x 2 = 120 substitutions."
          - letter: "B"
            type: "mcq"
            text: "In Protein X, 6 amino acid substitutions were observed between human and a mammal\
  \ species. Choose the right choice for the divergence time between them."
            options: [{key: "1", text: "3 MYA"}, {key: "2", text: "6 MYA"}, {key: "3", text: "9 MYA"}, {key: "4", text: "12 MYA"}]
            answer: "4"
            explanation: "Setting 6 substitutions = 0.625x10^-9 x 400 x T x 2 and solving for T gives T = 6\
  \ / (0.625x10^-9 x 400 x 2) = 1.2x10^7 years, i.e. 12 million years ago."
          - letter: "C"
            type: "mcq"
            text: "Human insulin is first synthesized as preproinsulin (110 a.a.), then matures into\
  \ active insulin (A-B domain, 51 a.a.) by releasing a predomain (24 a.a.) and a\
  \ C domain (31 a.a.). Choose the most appropriate choice for the relative values\
  \ of the substitution rates of a. pre-domain, b. A-B domain, and c. C-domain."
            options: [{key: "1", text: "a < b < c"}, {key: "2", text: "b < c < a"}, {key: "3", text: "c < b < a"}, {key: "4", text: "a < c < b"}]
            answer: "2"
            explanation: "The A-B domain is the mature, biologically active insulin hormone itself, so it is\
  \ under the strongest functional constraint and should have the lowest substitution\
  \ rate. The predomain (a signal-sequence-like region cleaved off early and never\
  \ part of the functional hormone) is under the least functional constraint and should\
  \ have the highest substitution rate, with the C-domain (a connecting peptide with\
  \ some functional role in proper folding/processing but not the active hormone itself)\
  \ falling in between: giving b (A-B domain, lowest) < c (C-domain) < a (predomain,\
  \ highest)."

      - id: q39
        number: "Q39"
        name: "Identifying Unlabeled Cetartiodactyl DNA Samples from a Phylogenetic Sequence Alignment"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=62"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
          - name: "Evidence for Evolution"
            link: "/resources/15-evolution/evidence-for-evolution/"
        statements:
          - letter: "tube-to-label match"
            type: "mcq"
            text: "Based on the sequence alignment and known phylogenetic relationships, indicate the\
  \ most likely combination of tubes and labels for tube #2, #3, and #4."
            options: [{key: "1", text: "#2=bowhead whale, #3=pigmy hippopotamus, #4=water buffalo"}, {key: "2", text: "#2=bowhead whale, #3=water buffalo, #4=pigmy hippopotamus"}, {key: "3", text: "#2=pigmy hippopotamus, #3=bowhead whale, #4=water buffalo"}, {key: "4", text: "#2=pigmy hippopotamus, #3=water buffalo, #4=bowhead whale"}, {key: "5", text: "#2=water buffalo, #3=bowhead whale, #4=pigmy hippopotamus"}, {key: "6", text: "#2=water buffalo, #3=pigmy hippopotamus, #4=bowhead whale"}]
            answer: "5"
            explanation: "Under a constant evolutionary rate, the number of sequence differences between the\
  \ bottlenose dolphin (#1) and each other tube directly reflects how recently they\
  \ shared a common ancestor: the closest relative (bowhead whale, another cetacean)\
  \ should show the fewest differences, pygmy hippopotamus (a more distant relative)\
  \ an intermediate number, and water buffalo (the outgroup) the most differences.\
  \ Counting mismatches in the alignment against tube #1 and ranking them from fewest\
  \ to most differences assigns tube #3 (fewest) = bowhead whale, tube #4 (intermediate)\
  \ = pygmy hippopotamus, and tube #2 (most differences) = water buffalo."

      - id: q40
        number: "Q40"
        name: "Tracing Membrane Origins in the Four-Membrane Plastids of Chlorarachniophytes"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=63"
        subjects:
          - name: "History of Life: Origin & Major Transitions"
            link: "/resources/15-evolution/history-of-life-origin-and-major-transitions/"
          - name: "Endomembrane System & Protein Trafficking"
            link: "/resources/1-cell-molecular/endomembrane-system-protein-trafficking/"
        statements:
          - letter: "membrane origins"
            type: "mcq"
            text: "From which organism is each of the four plastid membranes (a, innermost, through\
  \ d, outermost) derived? Choose the most appropriate combination."
            options: [{key: "1", text: "(a) cyanobacterium; (b) green alga; (c) ancestor of chlorarachniophytes; (d) ancestor\
  \ of chlorarachniophytes"}, {key: "2", text: "(a) cyanobacterium; (b) green alga; (c) green alga; (d) ancestor of chlorarachniophytes"}, {key: "3", text: "(a) cyanobacterium; (b) cyanobacterium; (c) green alga; (d) ancestor of chlorarachniophytes"}, {key: "4", text: "(a) cyanobacterium; (b) cyanobacterium; (c) green alga; (d) green alga"}, {key: "5", text: "(a) cyanobacterium; (b) cyanobacterium; (c) ancestor of chlorarachniophytes; (d)\
  \ ancestor of chlorarachniophytes"}]
            answer: "3"
            explanation: "The innermost two membranes (a, b) are the original cyanobacterium's own double membrane,\
  \ inherited unchanged from the primary endosymbiosis that gave the green alga its\
  \ plastid in the first place. When the ancestor of chlorarachniophytes then engulfed\
  \ that whole green alga (secondary endosymbiosis), the green alga's own plasma membrane\
  \ became the third membrane (c), and the phagosomal membrane from the chlorarachniophyte\
  \ ancestor's own engulfing vacuole became the outermost, fourth membrane (d):\
  \ giving (a) cyanobacterium, (b) cyanobacterium, (c) green alga, (d) ancestor of\
  \ chlorarachniophytes."

      - id: q41
        number: "Q41"
        name: "Projecting a Three-Stage Population Forward and Finding the Extinction-Preventing Birth Rate"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=64"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "NJ,2"
            type: "numeric"
            text: "What is the number of juveniles (NJ,2) at year 2?"
            expected: 68
            tolerance: 1
            explanation: "Year 1's adults are NA1,1 = S1 x NJ,0 = 0.2 x 100 = 20 and NA2,1 = S2 x NA1,0 = 0.5\
  \ x 20 = 10, so year 1's juveniles are NJ,1 = m1 x NA1,1 + m2 x NA2,1 = 3x20 + 2x10\
  \ = 80. Year 2's adults are then NA1,2 = S1 x NJ,1 = 0.2 x 80 = 16 and NA2,2 = S2\
  \ x NA1,1 = 0.5 x 20 = 10, giving NJ,2 = m1 x NA1,2 + m2 x NA2,2 = 3x16 + 2x10 =\
  \ 68."
          - letter: "NA1,2"
            type: "numeric"
            text: "What is the number of adult-1 individuals (NA1,2) at year 2?"
            expected: 16
            tolerance: 1
            explanation: "Year 1's juveniles are NJ,1 = m1 x NA1,1 + m2 x NA2,1, where NA1,1 = S1 x NJ,0 =\
  \ 0.2 x 100 = 20 and NA2,1 = S2 x NA1,0 = 0.5 x 20 = 10, giving NJ,1 = 3x20 + 2x10\
  \ = 80. NA1,2 is that year-1 juvenile cohort surviving into adult-1: NA1,2 = S1\
  \ x NJ,1 = 0.2 x 80 = 16."
          - letter: "NA2,2"
            type: "numeric"
            text: "What is the number of adult-2 individuals (NA2,2) at year 2?"
            expected: 10
            tolerance: 1
            explanation: "NA2,2 is year 1's adult-1 individuals surviving into adult-2: NA2,2 = S2 x NA1,1\
  \ = 0.5 x 20 = 10, where NA1,1 = S1 x NJ,0 = 0.2 x 100 = 20."
          - letter: "minimum m1 to prevent extinction"
            type: "numeric"
            text: "The population with the above parameters will go extinct in the near future. To prevent\
  \ extinction (holding other parameters constant), m1 should be increased such that\
  \ m1 >= ?"
            expected: 4
            tolerance: 0
            explanation: "A juvenile's lifetime expected number of offspring (net reproductive rate) is R0\
  \ = S1 x m1 (offspring produced after surviving to adult-1) + S1 x S2 x m2 (offspring\
  \ produced after further surviving to adult-2). The population holds steady or grows\
  \ only when R0 >= 1. With S1=0.2, S2=0.5, m2=2: 0.2 x m1 + 0.2x0.5x2 = 0.2 x m1\
  \ + 0.2 >= 1, which solves to m1 >= 4."

      - id: q42
        number: "Q42"
        name: "Matching Plant Morphological Plasticity Responses to Environmental Cues"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=65"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
        statements:
          - letter: "matching responses to diagrams"
            type: "mcq"
            text: "Match the statements (a: response to soil fertilization, b: response to apical damage,\
  \ c: response to shade condition, d: response to trampling pressure) with the corresponding\
  \ diagrams (A to D) and choose the appropriate number from the table."
            options: [{key: "1", text: "A=a, B=d, C=c, D=b"}, {key: "2", text: "A=a, B=c, C=d, D=b"}, {key: "3", text: "A=b, B=a, C=c, D=d"}, {key: "4", text: "A=b, B=d, C=c, D=a"}, {key: "5", text: "A=c, B=a, C=d, D=b"}, {key: "6", text: "A=c, B=a, C=b, D=d"}]
            answer: "3"
            explanation: "Apical damage (b) removes the dominant shoot tip and releases lateral buds from apical\
  \ dominance, producing a bushier plant with multiple side branches: matching diagram\
  \ A. Soil fertilization (a) provides abundant nutrients supporting vigorous, larger\
  \ overall growth: matching diagram B. Shade condition (c) triggers the shade-avoidance\
  \ response of spindly, elongated internodes reaching for light: matching diagram\
  \ C. Trampling pressure (d) physically suppresses vertical growth, producing a flattened,\
  \ low-growing form: matching diagram D. This gives A=b, B=a, C=c, D=d."

      - id: q43
        number: "Q43"
        name: "Direct and Inclusive Fitness in a Haplodiploid Hymenopteran Insect"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=66"
        subjects:
          - name: "Kin Selection, Altruism & Eusociality"
            link: "/resources/9-ethology/kin-selection-altruism-eusociality/"
        statements:
          - letter: "Q43-1"
            type: "numeric"
            text: "Provide the direct fitness of genotype A, assuming that all offspring are females\
  \ and females with different genotypes do not compete."
            expected: 6
            tolerance: 0
            explanation: "Direct fitness is defined as one-half of the number of offspring an individual produces\
  \ (offspring are related to their mother by one-half). Genotype A produces 12 offspring\
  \ of her own, so direct fitness = 0.5 x 12 = 6."
          - letter: "Q43-2"
            type: "mcq"
            text: "Rank genotypes A to D in descending order of inclusive fitness, assuming that all\
  \ offspring are females."
            options: [{key: "1", text: "A>B>D>C"}, {key: "2", text: "A>D>B>C"}, {key: "3", text: "B>A>D>C"}, {key: "4", text: "B>D>A>C"}, {key: "5", text: "C>A>D>C"}, {key: "6", text: "C>D>A>C"}]
            answer: "4"
            explanation: "Inclusive fitness sums direct fitness (0.5 x own offspring) and indirect fitness\
  \ (number of siblings x each sibling's own offspring x 0.375, where 0.375 = 0.5\
  \ x 0.75 combines the standard fitness-counting factor with the 3/4 relatedness\
  \ of full sisters under haplodiploidy). Genotype A: 0.5x12 + 3x7x0.375 = 6 + 7.875\
  \ = 13.875. Genotype B: 0.5x2 + 8x12x0.375 = 1 + 36 = 37. Genotype C: 0.5x8 + 4x6x0.375\
  \ = 4 + 9 = 13. Genotype D: 0.5x9 + 6x5x0.375 = 4.5 + 11.25 = 15.75. Ranking these\
  \ descending gives B (37) > D (15.75) > A (13.875) > C (13)."

      - id: q44
        number: "Q44"
        name: "Tracing Detrital and Grazing Food-Web Pathways and Cesium Bioaccumulation Timing"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=67"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "Q44-1"
            type: "numeric"
            text: "The prey biomass of spiders consists of 40% herbivores and 60% detritivores, while\
  \ that of passerine birds consists of 50% herbivores, 30% spiders, and 20% detritivores.\
  \ What is the contribution of the pathway from the detrital food web to passerine\
  \ birds, as a percentage of biomass of detritivores relative to the combined biomass\
  \ of herbivores and detritivores reaching passerine birds? Answer as a 2-digit integer,\
  \ cutting off after the decimal point."
            expected: 54
            tolerance: 1
            explanation: "The direct detritivore-to-bird pathway contributes 0.2 (20%) directly, while the\
  \ indirect pathway (detritivore to spider to bird) contributes 0.3 (spider's share\
  \ of bird diet) x 0.6 (detritivore's share of spider diet), scaled up by a factor\
  \ of 10 to account for the extra trophic transfer's 10% conversion efficiency loss\
  \ being already 'spent' getting through the spider step relative to a direct link:\
  \ (0.2 + 0.3x0.6x10) / [(0.2 + 0.3x0.6x10) + (0.5 + 0.3x0.4x10)] = 2.0/(2.0+1.7)\
  \ is about 0.5405, giving 54 when expressed as a 2-digit integer percentage."
          - letter: "Q44-2"
            type: "mcq"
            text: "Given the described 137Cs behavior (fungi accumulate it, vascular plants and their\
  \ herbivores absorb little from soil), choose the most appropriate combination of\
  \ organisms (grasshopper, spider, earthworm) matching graphs A, B, and C in Figure\
  \ 2."
            options: [{key: "1", text: "A=Grasshopper, B=Spider, C=Earthworm"}, {key: "2", text: "A=Grasshopper, B=Earthworm, C=Spider"}, {key: "3", text: "A=Spider, B=Earthworm, C=Grasshopper"}, {key: "4", text: "A=Spider, B=Grasshopper, C=Earthworm"}, {key: "5", text: "A=Earthworm, B=Grasshopper, C=Spider"}, {key: "6", text: "A=Earthworm, B=Spider, C=Grasshopper"}]
            answer: "4"
            explanation: "Since soil cesium is difficult for vascular plants to absorb, grasshoppers (herbivores)\
  \ should start relatively low in cesium and decline further/stay low quickly; earthworms\
  \ (detritivores, feeding on fungi-enriched organic matter) should retain persistently\
  \ higher cesium levels over time; and spiders, consuming both herbivores and detritivores,\
  \ should show an intermediate pattern between the two. Matching a fast-declining\
  \ curve to grasshopper, a persistently high curve to earthworm, and an intermediate\
  \ curve to spider identifies graph A (fastest initial decline) = spider, B = grasshopper,\
  \ C = earthworm."

      - id: q45
        number: "Q45"
        name: "Nitrogen and Phosphorus Accumulation Trajectories Through Primary Succession"
        link: "/papers/ibo/2020/theoretical-2-exam.pdf#page=69"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "N and P accumulation pattern"
            type: "mcq"
            text: "Choose the panel that represents temporal changes in the total amount of nitrogen\
  \ (N) and phosphorus (P) accumulation in soil through primary succession after glacial\
  \ retreat in Alaska."
            options: [{key: "1", text: "panel (1)"}, {key: "2", text: "panel (2)"}, {key: "3", text: "panel (3)"}, {key: "4", text: "panel (4)"}]
            answer: "2"
            explanation: "Nitrogen enters the ecosystem only through biological fixation, which requires nitrogen-fixing\
  \ organisms to first establish, so total soil nitrogen should start near zero and\
  \ rise progressively through succession as fixation, plant growth, and organic matter\
  \ recycling accumulate it over time. Phosphorus, by contrast, is present from the\
  \ start (released by rock weathering as soon as the glacier retreats) but only gets\
  \ depleted over time through plant uptake, storage in standing biomass, and leaching\
  \ losses that outpace the slow rate of new weathering: so P should start relatively\
  \ high and decline through succession. This rising-N, falling-P pattern matches\
  \ panel (2)."

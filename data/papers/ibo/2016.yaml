          - letter: "B"
            text: "Age estimates increase particularly strongly from 100 to 10-category model in D.elatum."
            answer: false
            explanation: "For D. elatum, [FIGURE-1] shows the age estimate rising when moving to the 100-category\
  \ model, not when further coarsening to the 10-category model, so the strong increase\

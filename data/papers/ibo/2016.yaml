          - letter: "C"
            text: "Model with just 10 DBH categories underestimate the observed ages for three species."
            answer: true
            explanation: "Comparing the 10-category model's estimates against the ring-count circles in [FIGURE-1]\
  \ shows the model falling well below the observed ages for three of the four species\
  \ (A. sinensis, C. macrolepis, and D. elatum)."
          - letter: "D"
            text: "For D.elatum, measuring DBH using either 100 or 1000 will give an accurate estimate\
  \ of tree age, whereas to estimate the age of C. macrolepis, only 100 gives a reliable\
  \ estimate."
            answer: true
            explanation: "[FIGURE-1] shows the 100- and 1000-category model estimates both landing close to\

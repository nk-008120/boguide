      - id: q1
        number: "Q1"
        name: "Wee1/Cdc25 Feedback Control of M-Cdk Activity"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=5"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "Wee1 kinase is active if it is phosphorylated."
            answer: false
            explanation: "[FIGURE-1] shows Wee1 and Cdc25 responding oppositely to the same okadaic-acid-sensitive\
  \ phosphatases: Wee1 is active in its unphosphorylated state and is switched off\
  \ by phosphorylation, the mirror image of Cdc25. Treating the extract with okadaic\
  \ acid (which blocks the phosphatases that normally keep Wee1 dephosphorylated)\
  \ drives Wee1 into its inactive, phosphorylated form, so phosphorylation turns Wee1\
  \ off rather than on."
          - letter: "B"
            text: "The phosphatases that control the phosphorylation of Wee1 kinase and Cdc25 phosphatase\
  \ are specific for tyrosine side chains."
            answer: false
            explanation: "Okadaic acid is described as an inhibitor of serine/threonine phosphatases, and it\
  \ is exactly this inhibition that shifts Wee1 and Cdc25 into their alternate phosphorylation\
  \ states. That makes the regulatory phosphatases acting on Wee1 and Cdc25 themselves\
  \ serine/threonine-specific; the tyrosine-15 phosphorylation in the figure belongs\
  \ to Cdk1, the downstream substrate, not to Wee1 or Cdc25."
          - letter: "C"
            text: "Okadaic acid directly affects the activation of Cdk1."
            answer: false
            explanation: "Okadaic acid acts upstream, on the serine/threonine phosphatases that set the phosphorylation\
  \ states of Wee1 and Cdc25 (illustrated in [FIGURE-1]); Cdk1 activity only changes\
  \ as a downstream consequence once Wee1 is inactivated and Cdc25 is activated. So\
  \ the effect on Cdk1 is indirect, mediated through these two regulators."
          - letter: "D"
            text: "If M-Cdk is able to phosphorylate Wee1 kinase and Cdc25 phosphatase, a small amount\
  \ of active M-Cdk would lead to its rapid and complete activation."
            answer: true
            explanation: "This describes the double-negative/positive feedback wiring implied by the loops\
  \ in [FIGURE-1]: active M-Cdk phosphorylating Cdc25 would activate more Cdc25 (which\
  \ removes the inhibitory phosphate from more Cdk1), and phosphorylating Wee1 would\
  \ inactivate more Wee1 (removing the enzyme that adds that inhibitory phosphate).\
  \ Both effects reinforce the initial activation, so a small amount of active M-Cdk\
  \ would be rapidly amplified into complete, switch-like activation."

      - id: q2
        number: "Q2"
        name: "Estimating Translation Rate from a TMV Protein Pulse-Chase Gel"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=6"
        subjects:
          - name: "Translation & the Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
        statements:
          - letter: "A"
            text: "The rate of TMV protein synthesis is exponentially proportional to time."
            answer: false
            explanation: "[FIGURE-1] plots the apparent molecular weight of the largest labeled polypeptide\
  \ against time, and the trace rises steeply at first and then flattens out as it\
  \ approaches the 116 kDa full-length product around 25 minutes. That saturating,\
  \ plateauing shape is inconsistent with an ever-accelerating exponential increase."
          - letter: "B"
            text: "With an average molecular mass of an amino acid of 110 daltons, the average rate\
  \ of protein synthesis is approximately 35 to 40 amino acids per minute."
            answer: false
            explanation: "Reading the steep, roughly linear portion of the curve in [FIGURE-1] gives an increase\
  \ of about 52,000 daltons over 10 minutes, i.e. around 5,200 daltons per minute.\
  \ Dividing by 110 daltons per residue gives roughly 47 amino acids per minute, which\
  \ is faster than the 35-40 range the statement proposes."
          - letter: "C"
            text: "The rabbit reticulocyte lysate contains methionyl-tRNA synthetase"
            answer: true
            explanation: "The experiment only works because 35S-methionine is incorporated into the growing\
  \ TMV polypeptide, which requires charging tRNA-Met with methionine before it can\
  \ be delivered to the ribosome. Since the lysate is stated to contain the complete\
  \ rabbit reticulocyte translational machinery and successfully synthesizes labeled\
  \ protein, it must contain an active methionyl-tRNA synthetase."
          - letter: "D"
            text: "The mRNA may contain more than two rare codons in its sequence."
            answer: true
            explanation: "In [FIGURE-1] the labeled products appear as a ladder of discrete bands rather than\
  \ a smooth continuous smear, showing that ribosomes are not moving at a constant\
  \ rate but repeatedly stall at particular positions along the message. Multiple\
  \ pause sites of this kind are consistent with the mRNA containing several codons\
  \ that are read by rare tRNAs, forcing ribosomes to wait at more than two positions."

      - id: q3
        number: "Q3"
        name: "Ordering a Proline Biosynthesis Pathway by Cross-Feeding"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=7"
        subjects:
          - name: "Gene Regulation: Prokaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-prokaryotic/"
        statements:
          - letter: "A"
            text: "The intermediate that accumulates in the ProC¯ strain comes after the block in the\
  \ ProA¯ strain."
            answer: true
            explanation: "In cross-feeding, a strain can only rescue a neighbour if the intermediate it leaks\
  \ lies downstream of the neighbour's block. [FIGURE-1] shows the ProC¯ strain supporting\
  \ growth of the nearby ProA¯ streak at the permissive temperature, which places\
  \ the ProC¯-accumulated intermediate later in the pathway than the ProA¯ block."
          - letter: "B"
            text: "The intermediate that accumulates in the ProB¯ strain comes after the block in the\
  \ ProA¯ strain"
            answer: false
            explanation: "The cross-feeding pattern in [FIGURE-1] instead shows the ProA¯ strain able to feed\
  \ the ProB¯ strain, not the reverse, which places the ProA¯-accumulated intermediate\
  \ downstream of the ProB¯ block rather than the other way around. So the ProB¯ intermediate\
  \ does not sit after the ProA¯ block."
          - letter: "C"
            text: "There are at least three different genes that affect proline biosynthesis."
            answer: true
            explanation: "Three independently isolated mutant strains (ProA¯, ProB¯, and ProC¯), each blocked\
  \ at a different point revealed by the cross-feeding pattern in [FIGURE-1], is direct\
  \ evidence for at least three distinct genes/steps contributing to proline biosynthesis\
  \ in this pathway."
          - letter: "D"
            text: "Under at least one condition, the proline that is produced is rapidly used for protein\
  \ synthesis and is prevented from being synthesized in excess of needs."
            answer: true
            explanation: "The wild-type strain never cross-feeds any of the mutants in [FIGURE-1], even though\
  \ it must be making proline and pathway intermediates to grow. That absence of leakage\
  \ under normal growth conditions indicates the pathway's products are consumed about\
  \ as fast as they are made rather than accumulating and diffusing out."

      - id: q4
        number: "Q4"
        name: "Uncouplers and Inhibitors of Oxidative Phosphorylation"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=8"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "x is the oxidizable substrate."
            answer: true
            explanation: "In panel A of [FIGURE-1], the arrow labelled x is the first addition, occurring before\
  \ both O2 consumption and ATP synthesis begin to rise; since mitochondria need substrate,\
  \ ADP and Pi before either process can start, and ADP+Pi is already marked separately,\
  \ x must mark the addition of the oxidizable substrate."
          - letter: "B"
            text: "y is either oligomycin or CN-."
            answer: true
            explanation: "In [FIGURE-1], the addition marked y coincides with both the O2-consumption and ATP-synthesis\
  \ traces levelling off together, the signature of blocking electron transport (with\
  \ CN-) or blocking ATP synthase in a way that backs up and stalls the whole chain\
  \ (with oligomycin). Either inhibitor would produce this simultaneous flattening\
  \ of both curves."
          - letter: "C"
            text: "z is DNP."
            answer: true
            explanation: "In panel B of [FIGURE-1], after z is added the solid O2-consumption line keeps climbing\
  \ while the dashed ATP-synthesis line flattens out - exactly the uncoupling signature\
  \ of DNP, which dissipates the proton gradient so electron transport and oxygen\
  \ consumption can continue unabated even though the gradient needed to drive ATP\
  \ synthase collapses."
          - letter: "D"
            text: "If z is a mixture of oligomycin and DNP, the ATP synthesis will not level off."
            answer: false
            explanation: "DNP alone already collapses the proton-motive force in [FIGURE-1], which is why the\
  \ dashed ATP-synthesis line plateaus after z is added; adding oligomycin on top\
  \ blocks ATP synthase directly but cannot make a difference once the gradient driving\
  \ it is already gone. So ATP synthesis still levels off (indeed no later than it\
  \ does with DNP alone), contrary to the statement."

      - id: q5
        number: "Q5"
        name: "Mapping Membrane-Protein Topology with Protease Protection"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=9"
        subjects:
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "The bigger fragments in lane 3 are hydrophilic."
            answer: false
            explanation: "[FIGURE-1] shows the protein crossing the bilayer through several membrane-spanning\
  \ segments; even after permeabilisation exposes both faces to protease in lane 3,\
  \ these transmembrane segments survive digestion because they are buried in the\
  \ lipid bilayer, which is exactly why they run as the largest surviving fragments.\
  \ Since transmembrane stretches are built from hydrophobic residues to sit comfortably\
  \ in the lipid interior, these large protected fragments are hydrophobic rather\
  \ than hydrophilic."
          - letter: "B"
            text: "The smaller fragments in lane 2 represent protein domains protruding outside the\
  \ membrane."
            answer: true
            explanation: "In lane 2 the vesicles are still intact and protease can only reach the domains exposed\
  \ on the outer face of the membrane, shown in [FIGURE-1]. Cleaving these exposed\
  \ loops off the rest of the protein produces the small fragments seen in that lane,\
  \ while the transmembrane and lumen-facing parts remain protected and are not represented\
  \ among them."
          - letter: "C"
            text: "Domain a is rich in leucine or isoleucine."
            answer: false
            explanation: "[FIGURE-1] shows domain a as a short segment that sits against the phospholipid head\
  \ groups rather than as one of the hydrophobic membrane-spanning helices, so it\
  \ is expected to interact with the negatively charged phosphate groups. That kind\
  \ of electrostatic contact calls for basic residues such as lysine, not the hydrophobic\
  \ leucine/isoleucine typical of the buried transmembrane segments."
          - letter: "D"
            text: "Domains a, c and e protrude into the lumen of vesicles."
            answer: false
            explanation: "Only after permeabilisation (lane 3) can protease reach the lumen-facing parts of\
  \ the protein, and [FIGURE-1] shows four additional large fragments appearing in\
  \ that lane compared with lane 2, implying more than one domain is newly exposed\
  \ on that side. Domain a, however, sits at the phospholipid head-group region rather\
  \ than projecting into the lumen, so not all of a, c and e can be assigned to the\
  \ lumen face."

      - id: q6
        number: "Q6"
        name: "Desaturase Identity and Ethanol Tolerance in Yeast"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=10"
        subjects:
          - name: "Lipids & Membrane Biochemistry"
            link: "/resources/1-cell-molecular/lipids-membrane-biochemistry/"
        statements:
          - letter: "A"
            text: "The lag phase of transformant OLE1 in YPD medium is shorter than those of ∆9Hz, ∆9Tn,\
  \ ∆11Hz and ∆11Tn due to the presence of native desaturase in yeast cells."
            answer: true
            explanation: "Panel A of [FIGURE-1] shows the OLE1-reconstituted strain (x) reaching exponential\
  \ growth clearly earlier than the insect-desaturase transformants. Because OLE1\
  \ is the yeast's own native desaturase, restoring it lets the cell resume its normal,\
  \ well-tuned membrane lipid synthesis immediately, giving it a head start over strains\
  \ relying on a foreign insect enzyme."
          - letter: "B"
            text: "Desaturases are equally active in all transformants."
            answer: false
            explanation: "Table Q.6 shows clearly different amounts of C16:1 and C18:1 monounsaturated fatty\
  \ acids across the transformants (for example, ∆11Hz produces essentially no C18:1\
  \ while ∆9Tn produces relatively little C16:1), and the growth curves in [FIGURE-1]\
  \ diverge accordingly. Such differing product profiles and growth rates show the\
  \ introduced desaturases are not all equally active."
          - letter: "C"
            text: "The content of mono-unsaturated fatty acids is a good indicator of the ethanol tolerance\
  \ in S. cerevisiae."
            answer: false
            explanation: "In Table Q.6, OLE1 has among the highest total monounsaturated fatty acid content,\
  \ yet panel B of [FIGURE-1] shows it does not stand out for ethanol tolerance, while\
  \ ∆9Tn, with a broadly similar mono-unsaturated total, grows distinctly better under\
  \ ethanol stress. Since total mono-unsaturated content does not track with tolerance\
  \ across the strains, it is not by itself a reliable predictor."
          - letter: "D"
            text: "Higher ratio of ∆9-C18:1 to ∆9-C16:1 causes higher ethanol tolerance in S. cerevisiae."
            answer: true
            explanation: "Table Q.6 shows ∆9Tn has by far the highest C18:1-to-C16:1 ratio of the transformants,\
  \ and panel B of [FIGURE-1] shows this same strain growing best in ethanol-containing\
  \ medium. That correlation between a higher C18:1/C16:1 ratio and better growth\
  \ under ethanol stress supports the statement."

      - id: q7
        number: "Q7"
        name: "Feedback Regulation of the PHB Synthesis Pathway"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=12"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The increase in activity of citrate synthase will reduce the production of PHB."
            answer: true
            explanation: "[FIGURE-1] shows acetyl-CoA as the shared branch point between the citric acid cycle\
  \ (via citrate synthase) and the PHB synthesis pathway (via β-ketothiolase). If\
  \ citrate synthase becomes more active it will draw more acetyl-CoA into the citric\
  \ acid cycle, leaving less available as substrate for β-ketothiolase and so reducing\
  \ the flux into PHB synthesis."
          - letter: "B"
            text: "When the intracellular concentration of HSCoA is high, the rate of PHB synthesis\
  \ will increase."
            answer: false
            explanation: "[FIGURE-1] shows HSCoA (free coenzyme A) as a product released by the β-ketothiolase\
  \ step that condenses two acetyl-CoA into acetoacetyl-CoA, and the pathway is described\
  \ as feedback-inhibited. A build-up of this product, HSCoA, is expected to feed\
  \ back and inhibit β-ketothiolase, slowing rather than speeding up PHB synthesis."
          - letter: "C"
            text: "When the rate of PHB synthesis increases, the growth rate of Ralstonia eutropha cells\
  \ will also increase."
            answer: false
            explanation: "PHB is a storage material that bacteria accumulate specifically when a nutrient other\
  \ than carbon is limiting, as stated in the question, diverting the excess acetyl-CoA\
  \ away from the citric acid cycle shown in [FIGURE-1] and into storage rather than\
  \ into biosynthesis and energy production. Because PHB accumulation is a response\
  \ to poor growth conditions, more PHB synthesis reflects reduced, not increased,\
  \ growth."
          - letter: "D"
            text: "PHB synthesis is stimulated by low ratios of (NADPH+H+)/NADP+."
            answer: false
            explanation: "[FIGURE-1] shows the acetoacetyl-CoA-reductase step consuming NADPH+H+ and releasing\
  \ NADP+ on the way to PHB. A low (NADPH+H+)/NADP+ ratio means relatively little\
  \ of the reduced cofactor this reductase needs is available, which would limit rather\
  \ than stimulate flux through that step and hence PHB synthesis."

      - id: q8
        number: "Q8"
        name: "Identifying Amino Acids from Peptide Mass Data"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=13"
        subjects:
          - name: "Amino Acids & Protein Chemistry Fundamentals"
            link: "/resources/1-cell-molecular/amino-acids-protein-chemistry/"
        statements:
          - letter: "A"
            text: "Amino acid named C is serine"
            answer: false
            explanation: "Setting up one linear equation per peptide from its amino-acid composition and mass,\
  \ then combining pairs of equations to cancel shared unknowns, pins down each letter's\
  \ identity; working through this system identifies C as alanine rather than serine,\
  \ so the statement is false."
          - letter: "B"
            text: "Amino acid named A is tyrosine"
            answer: false
            explanation: "Subtracting the equations for two peptides that differ mainly in their A and B content\
  \ isolates the relationship A−B, which resolves to tryptophan for A once matched\
  \ against the individual amino-acid mass table, not tyrosine."
          - letter: "C"
            text: "Amino acid named E is cysteine"
            answer: true
            explanation: "Once A, B and C are pinned down from the earlier equations, substituting back into\
  \ the remaining peptide-mass equations leaves a small system in D and E alone; solving\
  \ it identifies E as cysteine, matching this statement."
          - letter: "D"
            text: "Amino acid named B is glycine"
            answer: true
            explanation: "The same A−B combination used to identify A (tryptophan) also fixes B, which comes\
  \ out to glycine when matched against the amino-acid mass table, consistent with\
  \ this statement."

      - id: q9
        number: "Q9"
        name: "Screening Shrimp Gut Bacteria for Probiotic Potential Against Vibrio"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=14"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Candidate No.1 (P1) produced an antimicrobial compound that inhibited Gram negative\
  \ and Gram positive bacteria."
            answer: false
            explanation: "In panel A of [FIGURE-1], the P1 streak shows growth inhibition of the tester strains,\
  \ but the pattern only clears the Gram-positive indicators (Streptococcus sp. and\
  \ Bacillus sp.), while the Gram-negative indicators (Vibrio sp. and Salmonella sp.)\
  \ still grow near it. That selective pattern means P1's compound acts on Gram-positive,\
  \ not both Gram-positive and Gram-negative, bacteria."
          - letter: "B"
            text: "Candidate No.2 (P2) was able to decrease Vibrio sp. pathogenicity without killing\
  \ them."
            answer: true
            explanation: "In panel A, P2 does not clear a zone against the Gram-negative Vibrio sp. streak,\
  \ showing it is not bactericidal toward Vibrio; yet panel B shows shrimp mortality\
  \ with Vibrio harveyi plus P2 (U+V+P2) is far lower than with Vibrio alone (U+V).\
  \ Reduced mortality without direct killing indicates P2 lowers Vibrio's pathogenicity\
  \ through some other mechanism."
          - letter: "C"
            text: "Candidate No.3 (P3) produced an antimicrobial compound targeting the outer membrane."
            answer: false
            explanation: "Panel A shows P3 clearing the Gram-positive indicators while the Gram-negative indicators,\
  \ which are the ones that possess an outer membrane, are left growing. A compound\
  \ targeting the outer membrane would be expected to act on the Gram-negative strains,\
  \ so this pattern argues against that target."
          - letter: "D"
            text: "Candidate No.4 (P4) had good effect on the shrimp survival by inhibiting Gram-negative\
  \ bacteria."
            answer: false
            explanation: "Panel B shows P4 lowers shrimp mortality about as much as P2 and P3 when Vibrio harveyi\
  \ is present, so it clearly improves survival; but panel A shows P4, like P3, only\
  \ clears the Gram-positive indicator strains, leaving the Gram-negative Vibrio sp.\
  \ streak growing unimpeded. Its protective effect therefore cannot be explained\
  \ by direct inhibition of Gram-negative bacteria."

      - id: q10
        number: "Q10"
        name: "Timing Cell-Cycle Phases with a Thymidine Pulse-Chase"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=15"
        subjects:
          - name: "Cell Cycle, Mitosis & Meiosis"
            link: "/resources/1-cell-molecular/cell-cycle-mitosis-meiosis/"
        statements:
          - letter: "A"
            text: "The synthesis rate of histone proteins is relatively high between 6 and 10 hours\
  \ after radioactive labeled thymidine exposure."
            answer: false
            explanation: "In [FIGURE-1], the window during which labeled cells are seen in mitosis (roughly\
  \ 5 to 10 hours after the pulse) corresponds to cells that were already finishing\
  \ S phase at the time of labeling, not cells actively replicating DNA at 6-10 hours\
  \ themselves. Histone synthesis rises together with DNA replication during S phase,\
  \ which for this cohort occurred earlier, before the plateau begins, so histone\
  \ synthesis is not particularly high in that later 6-10 hour window."
          - letter: "B"
            text: "S phase of the cell cycle takes about 5 hours."
            answer: true
            explanation: "In [FIGURE-1], the time until the first labeled mitotic cells appear (about 5 hours)\
  \ corresponds to the length of G2, the time needed for a cell already at the end\
  \ of S phase at the moment of labeling to finish S and cross G2 into mitosis. The\
  \ width of the plateau after that first appearance, running from about 5 to 10 hours,\
  \ then corresponds to the spread in how far through S phase different labeled cells\
  \ were at the pulse, i.e. roughly the length of S phase itself, consistent with\
  \ the statement's approximate 5 hours."
          - letter: "C"
            text: "M phase of the cell cycle takes longer than 1 hour."
            answer: false
            explanation: "The question states that at every sampling point only about 1% of cells are seen\
  \ undergoing mitosis. With a roughly 20-hour total cell cycle (the population doubling\
  \ twice in 40 hours), an M phase lasting only about 1% of the cycle works out to\
  \ roughly 12 minutes, well under an hour."
          - letter: "D"
            text: "Most of the radioactive thymidine is assimilated in the S phase of the cell cycle."
            answer: true
            explanation: "Thymidine is a DNA nucleoside precursor, and it is taken up and incorporated specifically\
  \ while cells are replicating their DNA. The fact that only cells passing through\
  \ S phase during the short labeling pulse go on to appear as labeled mitotic cells\
  \ in [FIGURE-1] confirms that thymidine incorporation is essentially restricted\
  \ to S phase."

      - id: q11
        number: "Q11"
        name: "Cell Wall Elasticity and the Components of Water Potential"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=16"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "A"
            text: "Alterations of plant cell water potential are generally accompanied by a large change\
  \ in turgor pressure and in cell volume."
            answer: false
            explanation: "[FIGURE-1] shows the rigid cell wall keeping relative cell volume within a narrow\
  \ 1.0-0.8 range even while turgor pressure potential swings by several MPa. Because\
  \ the wall resists stretching or collapsing, large shifts in water potential are\
  \ absorbed mostly as a change in turgor pressure, not as a large change in cell\
  \ volume."
          - letter: "B"
            text: "Disappearance of turgor pressure indicates the ending point of cell plasmolysis with\
  \ reduction of approximately by 15% cell volume."
            answer: false
            explanation: "In [FIGURE-1], the turgor pressure curve flattens out at essentially zero starting\
  \ around a relative cell volume of about 0.95, i.e. only roughly a 5% volume loss,\
  \ which is where turgor pressure disappears (the onset of plasmolysis, not its endpoint).\
  \ The roughly 15% volume reduction instead corresponds to the far more negative\
  \ end of the plotted range, well past the point turgor is lost."
          - letter: "C"
            text: "As the cell volume decreases by 10%, most of the change in cell water potential is\
  \ caused by the drop in cell solute potential together with little change in turgor\
  \ pressure."
            answer: false
            explanation: "Reading [FIGURE-1] from full turgor (relative volume 1.0) to a 10% reduction (relative\
  \ volume 0.9), turgor pressure potential itself falls from roughly +2 MPa to near\
  \ zero, a swing of about 2 MPa, while solute potential changes by under 1 MPa over\
  \ that same interval. Over that full 10% decrease it is therefore the turgor pressure\
  \ term that dominates the change in water potential, the opposite of what the statement\
  \ claims."
          - letter: "D"
            text: "During cell rehydration, cell volume expansion stops when cell wall generates pressure\
  \ equivalent to turgor pressure and the cell water potential reaches zero."
            answer: true
            explanation: "As a rehydrating cell approaches full turgor in [FIGURE-1], turgor pressure potential\
  \ rises back toward its plateau and water potential approaches zero. At that point\
  \ the wall's back-pressure exactly balances the turgor pressure pushing outward,\
  \ so there is no further net driving force for water entry and volume expansion\
  \ stops."

      - id: q12
        number: "Q12"
        name: "C3 vs C4 Photosynthetic Response to Low Temperature"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=17"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "A"
            text: "If put at 35°C, photosynthesis rate of soybean would decrease and that of sorghum\
  \ would not change."
            answer: true
            explanation: "[FIGURE-1] shows sorghum's net CO2 uptake staying high and saturating even as ambient\
  \ CO2 rises, the signature of a C4 plant whose CO2-concentrating mechanism keeps\
  \ Rubisco saturated over a wide range of conditions, whereas soybean's curve keeps\
  \ climbing, marking it as a C3 plant more sensitive to conditions like elevated\
  \ temperature. Warming to 35°C is expected to increase photorespiration and reduce\
  \ net photosynthesis in the C3 soybean while the C4 sorghum, buffered by its CO2-concentrating\
  \ mechanism, would show little change."
          - letter: "B"
            text: "In cool condition, the biomass of sorghum increases faster than that of soybean."
            answer: false
            explanation: "The data table shows sorghum's CO2 uptake collapsing much more sharply than soybean's\
  \ once temperature drops to 10°C (falling from 48.2 to 1.2 by day 3, versus soybean's\
  \ more moderate drop from 23.2 to 1.6), and sorghum's uptake stays low even after\
  \ returning to 25°C. With such a severe and lingering loss of carbon fixation, sorghum's\
  \ biomass accumulation in cool conditions would be slower, not faster, than soybean's."
          - letter: "C"
            text: "Soybean plants are likely to have smaller photosynthetic water use efficiency than\
  \ sorghum."
            answer: true
            explanation: "As a C4 plant (identifiable from the CO2-saturation behaviour in [FIGURE-1]), sorghum\
  \ can maintain high photosynthetic rates while keeping its stomata more closed,\
  \ since its CO2-concentrating mechanism reduces the need for high intercellular\
  \ CO2. The C3 soybean has no such mechanism and must keep stomata open longer to\
  \ fix the same amount of carbon, losing proportionally more water per unit of CO2\
  \ fixed, i.e. a lower water use efficiency."
          - letter: "D"
            text: "The reduction of the carbon dioxide uptake in sorghum is mainly due to the decrease\
  \ of enzyme activity in low temperature."
            answer: false
            explanation: "If reduced enzyme activity at low temperature were the main cause, sorghum's CO2\
  \ uptake should recover once it is returned to 25°C on days 4-10; instead the table\
  \ shows it remaining low (1.5, barely above the day-3 value of 1.2) rather than\
  \ rebounding toward its original 48.2. That lack of recovery points to a more lasting\
  \ form of damage from the cold exposure rather than a simple, reversible drop in\
  \ enzyme activity."

      - id: q13
        number: "Q13"
        name: "A dme Mutant and Nitrogen Fixation in Soybean Root Nodules"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=18"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "Nitrogen fixation activity in nodules of the same treatment at 28 days after inoculation\
  \ is higher than that at 14 days after inoculation."
            answer: true
            explanation: "Panels C and D of [FIGURE-1] plot acetylene reduction activity, the proxy for nitrogenase/nitrogen-fixation\
  \ activity, and for both the wild-type and dme-mutant bars this value is clearly\
  \ higher at 28 days than at 14 days. So within each treatment, fixation activity\
  \ increases over that period."
          - letter: "B"
            text: "Both number and size of nodules increase with time from 14 to 28 days after inoculation\
  \ with B. japonicum."
            answer: true
            explanation: "Panels A and B of [FIGURE-1] show both nodule number (Panel A) and nodule dry weight\
  \ per nodule (Panel B) rising from 14 to 28 days for the wild-type-infected seedlings.\
  \ That upward trend in both count and individual nodule size supports the statement."
          - letter: "C"
            text: "The reduction in nitrogen-fixing activity of nodules infected by the mutant at 28\
  \ days after inoculation compared to those at 14 days after inoculation is due to\
  \ the reduction of nitrogenase activity and nodule formation."
            answer: false
            explanation: "The premise itself does not hold: panels C and D of [FIGURE-1] show the mutant's\
  \ acetylene reduction activity is higher at 28 days than at 14 days, not reduced,\
  \ and panel A shows nodule number for the mutant also increasing over that interval\
  \ rather than falling. Since fixing activity does not decrease from 14 to 28 days\
  \ in the mutant, there is nothing here for a drop in nitrogenase activity or nodule\
  \ formation to explain."
          - letter: "D"
            text: "Nitrogen fixation in B. japonicum-induced nodule is down-regulated by NAD+-dependent\
  \ malic enzyme."
            answer: false
            explanation: "Comparing the open (wild-type) and solid (dme mutant) bars in panels C and D of [FIGURE-1]\
  \ at each time point, the mutant nodules consistently show lower acetylene reduction\
  \ activity than wild-type. Losing the malic enzyme lowers nitrogen-fixing activity\
  \ rather than raising it, showing the enzyme normally supports (up-regulates) fixation\
  \ rather than suppressing it."

      - id: q14
        number: "Q14"
        name: "Symplastic vs Apoplastic Phloem Loading of Sucrose"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=19"
        subjects:
          - name: "Phloem Transport & Translocation"
            link: "/resources/5-plant-physiology/phloem-transport-translocation/"
        statements:
          - letter: "A"
            text: "Sucrose is synthesized in leaves and transported long distance through phloem to\
  \ sinks under hydrostatic pressure gradient."
            answer: true
            explanation: "[FIGURE-1] traces sucrose being loaded into the phloem from the mesophyll and moving\
  \ along the sieve tube from source to sink. Loading sucrose into the sieve elements\
  \ draws water in osmotically, raising hydrostatic pressure at the source end relative\
  \ to the sink end, and this pressure gradient is what drives the mass-flow transport\
  \ of sucrose over long distances (pressure-flow mechanism)."
          - letter: "B"
            text: "Loading sucrose in apoplastic pathway requires energy in several steps due to the\
  \ movement across secondary wall of living cells."
            answer: false
            explanation: "[FIGURE-1]'s apoplastic route shows sucrose being actively pumped across plasma membranes\
  \ (into the apoplast and then into companion cells/sieve elements against a concentration\
  \ gradient), so the energy is spent crossing plasma membranes, not because cell\
  \ walls themselves are being crossed. Cell walls are freely permeable to small solutes,\
  \ so movement through the apoplast (wall space) itself is not the energy-requiring\
  \ step."
          - letter: "C"
            text: "In the symplastic pathway, sucrose molecules are passively loaded through plasmodesmata."
            answer: true
            explanation: "[FIGURE-1]'s symplastic route shows sucrose moving cell-to-cell through plasmodesmata,\
  \ following its own concentration gradient from the sucrose-rich mesophyll toward\
  \ the sieve elements. Movement through these symplastic connections down a concentration\
  \ gradient does not require a membrane transport step, so this loading is passive."
          - letter: "D"
            text: "Unloading sucrose molecules at the sinks requires no energy release because of movement\
  \ down a concentration gradient of sucrose."
            answer: false
            explanation: "[FIGURE-1] only depicts loading at the source, but phloem unloading at sinks can\
  \ occur through either the symplastic or apoplastic route depending on the sink;\
  \ where unloading is apoplastic, as in many storage organs, sucrose again has to\
  \ cross plasma membranes and this transport step consumes energy rather than being\
  \ purely passive. So unloading is not universally an energy-free process."

      - id: q15
        number: "Q15"
        name: "Structural Changes Along Rhizophore Orders in Rhizophora mangle"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=20"
        subjects:
          - name: "Stem Anatomy"
            link: "/resources/6-plant-anatomy/stem-anatomy/"
        statements:
          - letter: "A"
            text: "There are monotonic decreases in rhizophore height and the length/height proportion\
  \ in the rhizophores as a function of the rhizophore order."
            answer: false
            explanation: "Panel B of [FIGURE-1] shows rhizophore height (open squares) decreasing steadily\
  \ across successive orders, but the length/height ratio (filled circles) instead\
  \ trends upward with increasing order. Since one of the two variables rises rather\
  \ than falls, both cannot be described as monotonically decreasing."
          - letter: "B"
            text: "Within first-order rhizophores, the xylem proportion in the cross-section is larger\
  \ when closer to the main stem, and decreases progressively as the rhizophore approached\
  \ the ground while increasing the proportion of bark and pith."
            answer: true
            explanation: "The left-hand chart of panel C in [FIGURE-1] plots tissue composition along a first-order\
  \ rhizophore from the main stem (small distance) down to the ground (distance near\
  \ 1.0 m). The xylem fraction is highest near the stem and shrinks toward the ground,\
  \ while the bark and pith fractions correspondingly expand, matching the statement."
          - letter: "C"
            text: "When rhizophore order changes from 1 to 5, bark and pith proportion decreases, while\
  \ xylem proportion increases."
            answer: false
            explanation: "The right-hand chart of panel C in [FIGURE-1], plotting composition at the base of\
  \ each successive rhizophore order, shows the pith fraction expanding as order increases\
  \ from 1 to 5, while xylem and bark shrink. That is essentially the opposite pattern\
  \ from the one the statement describes."
          - letter: "D"
            text: "The supportive function is likely enhanced in the first-order rhizophores, with lower\
  \ length/height proportion, and higher proportion of xylem compared with bark and\
  \ pith."
            answer: true
            explanation: "Panel B of [FIGURE-1] shows first-order rhizophores have the lowest length/height\
  \ ratio of any order (a stockier, more upright form well suited to load-bearing),\
  \ and panel C shows they also have the highest xylem fraction of the sequence, xylem\
  \ being the mechanically stiff, lignified tissue. Both a stouter shape and a xylem-dominated\
  \ cross-section point to a stronger supportive role for the first-order rhizophores\
  \ compared with later orders."

      - id: q16
        number: "Q16"
        name: "Arsenic Accumulation and Growth in Athyrium yokoscense"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=21"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "Moderate As levels in soils promote the growth of ferns."
            answer: false
            explanation: "In panel A of [FIGURE-1], the frond and root biomass bars for the intermediate arsenate/arsenite-spiked\
  \ treatments (50-500 mg As5+/kg and 5-50 mg As3+/kg) mostly share the same Tukey\
  \ letter as the low-As control, meaning they are not statistically different from\
  \ it. Only the extreme mine-soil treatment (814 mg As/kg) shows significantly higher\
  \ biomass, so no genuine growth promotion is seen at the moderate, spiked-soil levels."
          - letter: "B"
            text: "Concentration of As in root grown in arsenite-spiked media (As3+) is lower than those\
  \ in arsenate treatment (As5+), resulting in the increase of total biomass."
            answer: false
            explanation: "Panel B of [FIGURE-1] does show generally lower root As content in the arsenite (As3+)\
  \ treatments than in the arsenate (As5+) treatments, but panel A shows the biomass\
  \ across these As3+ and As5+ treatments is statistically indistinguishable (sharing\
  \ Tukey letters) from the control. Lower root As under arsenite is not accompanied\
  \ by any corresponding rise in total biomass."
          - letter: "C"
            text: "Arsenic concentration increases from young to old fronds and is positively correlated\
  \ to As levels in the soil"
            answer: false
            explanation: "Panel B of [FIGURE-1] does show As content rising from young to old fronds within\
  \ each treatment, but the relationship with soil As level is not simply positive\
  \ across the board: at the higher arsenite (As3+) concentrations, frond and root\
  \ As content is reduced relative to the lowest arsenite treatment, rather than continuing\
  \ to climb with soil As level."
          - letter: "D"
            text: "The transfer of As from root to frond of A. yokoscense in mine soil over time is\
  \ similar to that in arsenate-spiked soil."
            answer: false
            explanation: "Even though the mine soil carries by far the highest soil As concentration (814 mg/kg),\
  \ panel B of [FIGURE-1] shows its frond As content is comparatively low relative\
  \ to root As content, unlike the arsenate-spiked treatments where frond levels track\
  \ root levels more closely. That weaker root-to-frond transfer in mine soil, plausibly\
  \ linked to its much larger biomass diluting frond As, marks it as different from\
  \ the arsenate-spiked pattern rather than similar."

      - id: q17
        number: "Q17"
        name: "ABA and Ethephon Effects on Sweet Cherry Ripening"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=22"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "A"
            text: "Both ABA and Ethephon stimulate the expression of PacACO1 and PacNCED1 genes in sweet\
  \ cherry fruit."
            answer: true
            explanation: "Panels B and D of [FIGURE-1] show relative PacNCED1 mRNA and PacACO1 transcript levels\
  \ both rising above control in the ABA and ethephon treatments. Since both hormone\
  \ treatments increase expression of both genes relative to control, the statement\
  \ holds."
          - letter: "B"
            text: "The expression of PacNCED1 and ABA accumulation in pulp are higher than in the seed\
  \ in the treatments of ABA"
            answer: true
            explanation: "Panels A and B of [FIGURE-1] compare pulp and seed values specifically under the\
  \ ABA treatment, and in both panels the pulp bar sits above the seed bar. So both\
  \ ABA content and PacNCED1 expression are higher in pulp than in seed under ABA\
  \ treatment."
          - letter: "C"
            text: "ABA induces the maturation of sweet cherry fruit via stimulation of ethylene production."
            answer: false
            explanation: "The data table shows ABA treatment clearly advances ripening (lower firmness, higher\
  \ soluble-solids/acidity ratio and higher anthocyanin than control), but panel C\
  \ of [FIGURE-1] shows ABA raises ethylene production only modestly compared with\
  \ the much larger increase produced by ethephon, which itself does not trigger the\
  \ same ripening changes seen in the table. Since the hormone that most strongly\
  \ raises ethylene (ethephon) does not reproduce ABA's maturation effects, ABA's\
  \ promotion of ripening cannot be attributed mainly to stimulating ethylene."
          - letter: "D"
            text: "Ethephon shows lower effect on anthocyanin and endogenous ABA production than exogenous\
  \ ABA does."
            answer: true
            explanation: "The data table shows ethephon's anthocyanin value (14.4, not significantly different\
  \ from control's 13.4a) is far below ABA's (23.8b), and panel A of [FIGURE-1] shows\
  \ ethephon raising endogenous ABA content only slightly compared with the much larger\
  \ rise under direct ABA application. Both anthocyanin accumulation and endogenous\
  \ ABA induction are therefore weaker under ethephon than under exogenous ABA."

      - id: q18
        number: "Q18"
        name: "Reading a Pressure-Volume Loop of the Cardiac Cycle"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=23"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "At Q, the left atrioventricular valve is opened."
            answer: false
            explanation: "In [FIGURE-1], point Q sits at the end of the P-to-Q segment, where ventricular volume\
  \ has already risen to its filling plateau at low, near-constant pressure, i.e.\
  \ ventricular filling through the open mitral valve has just finished. Once filling\
  \ is complete the mitral (left atrioventricular) valve closes, so at Q it is closed,\
  \ not open."
          - letter: "B"
            text: "Ventricular ejection ends at S."
            answer: true
            explanation: "In [FIGURE-1] the segment from R to S traces a sharp fall in ventricular volume at\
  \ high pressure, the signature of ejection through the open aortic valve, and volume\
  \ stops decreasing right at S. Ejection therefore ends at point S, where the loop\
  \ transitions into isovolumic relaxation."
          - letter: "C"
            text: "The distance from S to P should be longer if there is a narrowing of the aortic valve."
            answer: true
            explanation: "The S-to-P segment in [FIGURE-1] is isovolumic relaxation, running at constant volume\
  \ from the pressure reached at S down to the low filling pressure at P. Aortic valve\
  \ stenosis forces the ventricle to generate higher pressure to eject against the\
  \ narrowed valve, raising the pressure at S, which lengthens the vertical S-to-P\
  \ drop needed to reach the same low pressure at P."
          - letter: "D"
            text: "In period R-S, blood does not flow into both atria and ventricles."
            answer: false
            explanation: "R-S in [FIGURE-1] is the ejection phase, during which the mitral valve is closed\
  \ so blood indeed cannot enter the ventricle; but the atria continue to fill from\
  \ venous return throughout this period regardless of what the ventricle is doing.\
  \ Since blood does keep flowing into the atria during R-S, it is not true that blood\
  \ flow into both atria and ventricles is absent."

      - id: q19
        number: "Q19"
        name: "Cardiac Output and Oxygen Delivery During Exercise (Fick Principle)"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=24"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "Cardiac output increased by two-fold during exercise."
            answer: true
            explanation: "Using CO = Q/(A-V): before exercise, CO = 250/50 = 5 L blood/min; during exercise,\
  \ CO = 1500/150 = 10 L blood/min. That is exactly a two-fold increase, from 5 to\
  \ 10 L/min."
          - letter: "B"
            text: "Stroke volume during exercise was higher than that before exercise."
            answer: false
            explanation: "Stroke volume = CO/HR. Before exercise, SV = 5 L/min ÷ 60/min ≈ 0.083 L; during exercise,\
  \ SV = 10 L/min ÷ 120/min ≈ 0.083 L. The two values come out essentially identical,\
  \ so stroke volume did not rise; the increase in cardiac output was driven by heart\
  \ rate instead."
          - letter: "C"
            text: "Physical exercise caused a reduction in hemoglobin's binding for oxygen in tissues,\
  \ resulting in a three-fold increase in the amount of oxygen released to tissues."
            answer: true
            explanation: "The oxygen extracted per litre of blood (A-V difference) rises from 50 to 150 mL/L\
  \ blood during exercise, a three-fold increase in oxygen released to the tissues.\
  \ This greater unloading is consistent with the well-known reduction in hemoglobin's\
  \ oxygen affinity during exercise (from heat, CO2, and acidity in working tissue),\
  \ which favours releasing more of its bound oxygen."
          - letter: "D"
            text: "The number of heart beats required to supply a tissue with 3000 mL of oxygen during\
  \ exercise is 240."
            answer: true
            explanation: "During exercise the heart delivers 1500 mL O2 per minute using 120 beats, i.e. 1500/120\
  \ = 12.5 mL O2 per beat. To supply 3000 mL of oxygen at that rate requires 3000/12.5\
  \ = 240 beats, matching the statement."

      - id: q20
        number: "Q20"
        name: "Four Congenital Heart Defects and Their Hemodynamic Consequences"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=25"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "In type 1, the blood volume going to the lungs is lower than normal."
            answer: true
            explanation: "[FIGURE-1] shows type 1 as a narrowing of the pulmonary artery (pulmonary stenosis).\
  \ A narrowed pulmonary artery restricts how much blood the right ventricle can push\
  \ into the pulmonary circulation, so less blood volume reaches the lungs than in\
  \ the normal heart."
          - letter: "B"
            text: "In type 2, the stroke volume of the left ventricle is increased."
            answer: false
            explanation: "[FIGURE-1] depicts type 2 as an atrial septal defect, a hole between the left and\
  \ right atria. This lets oxygenated blood shunt from the left atrium into the right\
  \ atrium before it ever fills the left ventricle, reducing rather than increasing\
  \ the volume of blood the left ventricle has available to eject each beat."
          - letter: "C"
            text: "In type 3, the systolic blood pressure at the arms is higher than that in the normal\
  \ type."
            answer: true
            explanation: "[FIGURE-1] shows type 3 as coarctation of the aorta, a narrowing located after the\
  \ branch points of the arm arteries. Blood upstream of the narrowing, including\
  \ the vessels supplying the arms, backs up against the obstruction, raising systolic\
  \ pressure in the arms above normal even as pressure falls beyond the narrowed segment."
          - letter: "D"
            text: "In type 4, the pulmonary blood pressure is increased."
            answer: true
            explanation: "[FIGURE-1] shows type 4 as a patent ductus arteriosus, a persistent connection between\
  \ the aorta and the pulmonary artery. Since aortic pressure is higher than pulmonary\
  \ arterial pressure, blood is shunted from the aorta into the pulmonary artery through\
  \ this open channel, raising pulmonary blood pressure above normal."

      - id: q21
        number: "Q21"
        name: "Ventilation Rate vs Tidal Volume During Graded Exercise"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=26"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "A"
            text: "The increase in ventilation rate is faster than the increase in tidal volume when\
  \ the treadmill speed increases from 9 km/h to 12 km/h."
            answer: false
            explanation: "In [FIGURE-1], between 9 and 12 km/h the tidal-volume trace climbs noticeably steeply\
  \ while the ventilation-rate trace rises only gently over that same interval. Since\
  \ tidal volume is the curve that increases proportionally faster here, the statement\
  \ has the two curves' behaviour backwards."
          - letter: "B"
            text: "In intense physical exercise (> 15 km/h treadmill speed), the increase in the ventilatory\
  \ minute volume is mainly caused by increased ventilation rate."
            answer: true
            explanation: "Beyond about 15 km/h in [FIGURE-1], the tidal-volume trace has essentially reached\
  \ a plateau and stops climbing further, while the ventilation-rate trace continues\
  \ to rise sharply toward the highest speeds. With tidal volume no longer increasing,\
  \ essentially all of the further rise in minute ventilation at high intensity has\
  \ to come from the still-rising breathing rate."
          - letter: "C"
            text: "At the treadmill speed of 15 km/h, the ventilatory volume per minute is approximately\
  \ 120 L."
            answer: true
            explanation: "At 15 km/h in [FIGURE-1], tidal volume sits at roughly 2.4-2.5 L/breath near its\
  \ plateau and ventilation rate is around 49 breaths/min. Multiplying the two gives\
  \ a minute ventilation of about 2.46 x 49 ≈ 120 L/min, matching the statement."
          - letter: "D"
            text: "In an adult human, a tidal volume of 0.2 L and ventilation rate of 30 breaths per\
  \ minute can provide equally effective gas exchange as a tidal volume of 0.6 L and\
  \ a ventilation rate of 10 breaths per minute."
            answer: false
            explanation: "Both combinations give the same total minute volume (0.2 L x 30 = 6 L/min = 0.6 L\
  \ x 10), but a substantial fixed anatomical dead space (roughly 150 mL) means that\
  \ with the smaller 0.2 L tidal volume, a much larger fraction of each breath never\
  \ reaches the alveoli. The larger 0.6 L breaths ventilate the alveoli far more effectively,\
  \ so the two breathing patterns are not equally effective for gas exchange."

      - id: q22
        number: "Q22"
        name: "Predicting Action Potential Changes from Altered Ion Conditions"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=27"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "If the modified Ringer solution contained a lower concentration of Na+ than the standard\
  \ Ringer solution, the action potential is Record B."
            answer: true
            explanation: "The rising phase and overshoot of an action potential are driven by Na+ rushing into\
  \ the cell down its electrochemical gradient. In [FIGURE-1], Record B shows a distinctly\
  \ reduced overshoot compared with the normal Record A, consistent with less Na+\
  \ being available to enter and drive the peak as high when extracellular Na+ is\
  \ lowered."
          - letter: "B"
            text: "If the modified Ringer solution contained a lower concentration of K+ than the standard\
  \ Ringer solution, the action potential is Record C."
            answer: true
            explanation: "The resting membrane potential is set mainly by K+ leaking out of the cell down its\
  \ concentration gradient, so lowering extracellular K+ steepens that gradient and\
  \ drives the resting potential more negative. In [FIGURE-1], Record C starts from\
  \ a more hyperpolarized resting level than Record A, matching the expected effect\
  \ of reduced extracellular K+."
          - letter: "C"
            text: "If the modified Ringer solution contained a substance that increased membrane permeability\
  \ to K+, the action potential is Record D."
            answer: false
            explanation: "Increasing K+ permeability would be expected to drive the resting potential closer\
  \ to the K+ equilibrium potential, i.e. more negative, similar to Record C rather\
  \ than Record D. In [FIGURE-1], Record D instead shows an enhanced overshoot rising\
  \ above the normal peak, a pattern more consistent with a change affecting the depolarizing\
  \ (Na+) phase than with simply raising K+ permeability."
          - letter: "D"
            text: "If the modified Ringer solution contained a substance that increased membrane permeability\
  \ to Cl-, the action potential is Record E."
            answer: false
            explanation: "Chloride's equilibrium potential lies close to or below the normal resting potential,\
  \ so increasing Cl- permeability would tend to hold or push the resting potential\
  \ more negative rather than change the shape of the trace the way Record E shows\
  \ in [FIGURE-1] (a resting level that starts elevated compared to Record A). Record\
  \ E's pattern is better explained by a different change than an increase in Cl-\
  \ permeability alone."

      - id: q23
        number: "Q23"
        name: "Phlorizin, SGLT2 Inhibition, and Diabetic Mouse Kidney Physiology"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=28"
        subjects:
          - name: "Homeostasis & Osmoregulation"
            link: "/resources/3-animal-physiology/homeostasis-osmoregulation/"
        statements:
          - letter: "A"
            text: "The blood pressure of Group 3 mice was lower than that of Group 2 mice."
            answer: true
            explanation: "Group 3 diabetic mice receive phlorizin, which blocks SGLT2-mediated glucose reabsorption\
  \ and so lowers blood glucose relative to the untreated diabetic Group 2. Since\
  \ the question states blood glucose correlates positively with blood pressure, the\
  \ lower blood glucose in phlorizin-treated Group 3 is expected to come with lower\
  \ blood pressure than in Group 2."
          - letter: "B"
            text: "The SGLT2 gene expression levels in the kidneys of Group 2 mice were lower than those\
  \ of Group 4 mice."
            answer: false
            explanation: "Group 2 mice have severe untreated type 2 diabetes and therefore high blood glucose,\
  \ and the question states SGLT2 expression is positively correlated with urine glucose\
  \ level, which itself rises with blood glucose. That points to Group 2's SGLT2 expression\
  \ being higher, not lower, than the normal Group 4 controls."
          - letter: "C"
            text: "The volume of urine of Group 1 mice was higher than that of Group 4 mice."
            answer: true
            explanation: "Group 1 consists of normal mice treated with phlorizin, which blocks glucose reabsorption\
  \ in the kidney and causes glucose to remain in the tubule fluid; the resulting\
  \ osmotic drag keeps more water in the urine (osmotic diuresis) compared with untreated\
  \ Group 4 controls. That extra water loss gives Group 1 a higher urine volume than\
  \ Group 4."
          - letter: "D"
            text: "The quantity of SGLT2 molecules in the kidney medulla is higher than that in the\
  \ kidney cortex."
            answer: false
            explanation: "SGLT2 is expressed almost exclusively in the early proximal convoluted tubule, a\
  \ segment of the nephron located in the kidney cortex, not in the medulla (where\
  \ the loops of Henle and collecting ducts, which rely on different transporters,\
  \ predominate). So the cortex, not the medulla, is where the great majority of SGLT2\
  \ molecules are found."

      - id: q24
        number: "Q24"
        name: "Hormonal Features of Polycystic Ovarian Syndrome"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=29"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "PCOS patients are more likely to have acne than healthy people."
            answer: true
            explanation: "PCOS is defined by elevated ovarian testosterone (hyperandrogenism), and excess androgens\
  \ are a well-known driver of increased sebum production and acne. Since PCOS patients\
  \ have chronically higher testosterone than healthy people, they are more prone\
  \ to acne."
          - letter: "B"
            text: "PCOS patients have progesterone level higher than healthy people."
            answer: false
            explanation: "Progesterone is produced by the corpus luteum after ovulation, but the question states\
  \ PCOS involves chronic failure of ovulation. Without regular ovulation there is\
  \ no corpus luteum to produce the normal post-ovulatory surge of progesterone, so\
  \ PCOS patients tend to have lower, not higher, progesterone than healthy cycling\
  \ women."
          - letter: "C"
            text: "Obese women have a higher risk of PCOS than normal-weight women."
            answer: true
            explanation: "The question states the ovary is stimulated to produce more testosterone when blood\
  \ insulin is high, and obesity is commonly associated with insulin resistance and\
  \ elevated circulating insulin. That extra insulin drive on the ovaries makes obese\
  \ women more prone to developing the hyperandrogenic picture of PCOS than normal-weight\
  \ women."
          - letter: "D"
            text: "Follicle-stimulating hormone (FSH) and Luteinizing hormone (LH) can be used to increase\
  \ the probability of PCOS women to conceive."
            answer: true
            explanation: "Since the core reproductive problem in PCOS is a failure of follicles to mature and\
  \ ovulate, supplying exogenous FSH and LH can drive follicular development and trigger\
  \ ovulation despite the underlying hormonal imbalance. This is the basis of standard\
  \ ovulation-induction therapy used to improve fertility in PCOS patients."

      - id: q25
        number: "Q25"
        name: "Ion Transport Across the Freshwater Fish Gill Epithelium"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=30"
        subjects:
          - name: "Comparative Osmoregulation & Excretion"
            link: "/resources/3-animal-physiology/comparative-osmoregulation-excretion/"
        statements:
          - letter: "A"
            text: "Inhibition of the Cl- pump leads to an increase in blood pH."
            answer: true
            explanation: "[FIGURE-1] shows the Cl- pump exchanging blood Cl- for HCO3- pumped out to the ambient\
  \ water. Blocking this exchanger would leave more HCO3- retained in the blood, and\
  \ since HCO3- is a base, a higher blood HCO3- level raises blood pH."
          - letter: "B"
            text: "An increase in CO2 produced by catabolism leads to an increase in Na+ and Cl- transports\
  \ across the epithelium cell."
            answer: true
            explanation: "More metabolic CO2 reacting with water inside the gill epithelial cells generates\
  \ more H+ and HCO3-, the two ions that [FIGURE-1] shows being exchanged for Na+\
  \ and Cl- respectively at the apical membrane. A larger internal supply of H+ and\
  \ HCO3- to drive these exchangers would be expected to increase the coupled uptake\
  \ of Na+ and Cl- from the water."
          - letter: "C"
            text: "A substance blocking the electron transport chain causes a decrease of Na+ influx,\
  \ but does not affect HCO3- outflux at the gill epithelium."
            answer: false
            explanation: "Both the Na+/H+ and Cl-/HCO3- exchangers shown in [FIGURE-1] are secondary active\
  \ transporters that ultimately depend on ATP-dependent gradients maintained by the\
  \ cell. Blocking the electron transport chain cuts ATP production and would be expected\
  \ to impair both exchangers together, reducing Na+ influx and HCO3- outflux, not\
  \ leaving HCO3- transport unaffected."
          - letter: "D"
            text: "During alkalosis, the epithelial cell increases the synthesis of a key Cl-/HCO3-\
  \ countertransport protein."
            answer: true
            explanation: "Alkalosis means excess base (too much HCO3-) in the body fluids, and [FIGURE-1] shows\
  \ the Cl-/HCO3- exchanger as the route that exports HCO3- from the blood into the\
  \ ambient water in return for Cl-. Upregulating this exchanger would help the fish\
  \ correct alkalosis by getting rid of the excess HCO3-, consistent with the statement."

      - id: q26
        number: "Q26"
        name: "Water Loading and Renal Handling in Two Groups of Students"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=31"
        subjects:
          - name: "Homeostasis & Osmoregulation"
            link: "/resources/3-animal-physiology/homeostasis-osmoregulation/"
        statements:
          - letter: "A"
            text: "The absolute reabsorption of water by nephrons of the students in Group II at t =\
  \ 60 min was lower than that of the students in Group I."
            answer: true
            explanation: "At t = 60 min in [FIGURE-1], the urine flow rate for Group II is clearly higher than\
  \ for Group I. A higher urine output at that point, for a broadly similar filtered\
  \ load, is consistent with the nephrons of Group II reabsorbing relatively less\
  \ of the filtered water than those of Group I."
          - letter: "B"
            text: "The plasma aldosterone concentration of the students in Group I was the highest at\
  \ t = 60 min."
            answer: false
            explanation: "Aldosterone promotes water and Na+ retention, which would tend to produce low urine\
  \ flow and higher urine Cl- concentration; at t = 60 min in [FIGURE-1] Group I does\
  \ show the lower urine flow of the two groups, consistent with relatively higher\
  \ aldosterone than Group II, but the question only supports comparing Group I against\
  \ Group II, not identifying t = 60 min as when Group I's own aldosterone level peaks.\
  \ Group I drank less water overall, so its aldosterone is elevated throughout, not\
  \ specifically highest at that one time point."
          - letter: "C"
            text: "The students in Group I drank 500 mL of water 30 minutes before the experiment."
            answer: false
            explanation: "Throughout [FIGURE-1], Group I consistently shows the lower urine flow rate and the\
  \ higher urine Cl- concentration of the two groups, both signs of more concentrated\
  \ urine from less prior water intake. That pattern fits Group I with the smaller\
  \ 100 mL pre-load, not the larger 500 mL one, so the statement has the groups' pre-loads\
  \ reversed."
          - letter: "D"
            text: "The students in Group II produced about 140 mL of urine during the period between\
  \ t = 40 min and t = 60 min."
            answer: true
            explanation: "In [FIGURE-1], Group II's urine flow rate is about 7 mL/min at both t = 40 and t\
  \ = 60 min. Over that 20-minute interval at roughly 7 mL/min, total urine output\
  \ works out to about 7 x 20 = 140 mL, matching the statement."

      - id: q27
        number: "Q27"
        name: "Thermal Metabolic Profiles of Five Animal Species"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=32"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "A"
            text: "Species IV was an ectothermic animal."
            answer: true
            explanation: "In [FIGURE-1], species IV's metabolic rate rises steadily and directly with external\
  \ temperature, without the U-shaped curve (elevated metabolism at both cold and\
  \ hot extremes to defend a constant body temperature) shown by the endothermic species.\
  \ A metabolic rate that simply tracks ambient temperature is the signature of an\
  \ ectotherm, whose body temperature (and hence metabolism) follows the environment."
          - letter: "B"
            text: "Species II had the highest thermo-insulating ability among the five species."
            answer: true
            explanation: "Among the U-shaped curves in [FIGURE-1] (species I, II and III), species II shows\
  \ the flattest, most gently sloped rise in metabolic rate as external temperature\
  \ drops away from the thermoneutral zone. Needing to raise metabolism the least\
  \ to defend body temperature against cold indicates the best insulation of the five\
  \ species."
          - letter: "C"
            text: "Species III possessed the highest basal metabolic rate among the five species."
            answer: true
            explanation: "The basal metabolic rate corresponds to the minimum point of each U-shaped curve,\
  \ within the thermoneutral zone. In [FIGURE-1], species III's curve bottoms out\
  \ at a higher metabolic rate than the minima of species I and II, making it the\
  \ highest basal metabolic rate among the endothermic species shown."
          - letter: "D"
            text: "Increase in body temperature in species V was mainly dependent on metabolism."
            answer: false
            explanation: "Species V, like species IV, shows metabolic rate simply rising together with external\
  \ temperature in [FIGURE-1] rather than the actively-defended U-shape of the endotherms,\
  \ marking it as an ectotherm as well. An ectotherm's body temperature rises mainly\
  \ because it absorbs heat from a warmer environment, not because its own metabolic\
  \ heat production is driving the increase."

      - id: q28
        number: "Q28"
        name: "BDNF, β-AR Signaling, and Brown Fat Thermogenesis"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=33"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "Regularly learning and memorizing activities help to increase the number of brown\
  \ fat cells."
            answer: true
            explanation: "Learning and memory tasks engage the limbic system, and [FIGURE-1] states that activating\
  \ limbic neurons raises BDNF, which drives the nervous-system signal that increases\
  \ β-AR and the browning of white adipocytes into brown ones. Repeated engagement\
  \ of this pathway through regular cognitive activity would therefore be expected\
  \ to promote more browning and so more brown fat cells."
          - letter: "B"
            text: "Inhibition of BDNF expression reduces the size of white adipose tissue."
            answer: false
            explanation: "[FIGURE-1] places BDNF upstream of the signal that converts white adipocytes into\
  \ brown ones (the browning process). Suppressing BDNF would reduce this conversion,\
  \ leaving more fat cells in their white, energy-storing state and so increasing,\
  \ not reducing, the size of the white adipose tissue depot."
          - letter: "C"
            text: "Psychological anxiety increases the manifestation of the β-AR."
            answer: true
            explanation: "Anxiety is a well-known activator of the sympathetic nervous system, which releases\
  \ catecholamines onto the receptors shown acting on adipocytes in [FIGURE-1]. Since\
  \ the pathway in the figure shows catecholamine signalling driving β-AR expression\
  \ upward, the heightened sympathetic activity of anxiety would be expected to increase\
  \ β-AR expression."
          - letter: "D"
            text: "β-AR gene-deleted mice will show higher sensitivity to cold"
            answer: true
            explanation: "[FIGURE-1] shows the β-AR signal as the trigger for the browning process and thermogenesis\
  \ that mammals rely on to generate heat in the cold. Without β-AR, mice would lose\
  \ this catecholamine-driven route to activate brown fat heat production, leaving\
  \ them less able to defend body temperature and so more sensitive to cold exposure."

      - id: q29
        number: "Q29"
        name: "Muscle Fiber-Type Gene Expression Across Three Human Leg Muscles"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=34"
        subjects:
          - name: "Muscle Physiology"
            link: "/resources/3-animal-physiology/muscle-physiology/"
        statements:
          - letter: "A"
            text: "The soleus muscles of the sprinter athletes are prone to be more developed than those\
  \ in the marathon athletes."
            answer: false
            explanation: "[FIGURE-1] shows the soleus with by far the highest relative expression of Myh7,\
  \ the marker for slow-twitch, oxidative type I fibers, which are suited to sustained,\
  \ fatigue-resistant, low-power contraction rather than the fast powerful bursts\
  \ sprinters rely on. That fiber-type profile matches the demands of endurance training,\
  \ so it is the marathon athletes' soleus, not the sprinters', that would be expected\
  \ to develop more."
          - letter: "B"
            text: "The ratio of mitochondria number per muscle mass in the quadriceps muscle is less\
  \ than that in the gastrocnemius muscle."
            answer: true
            explanation: "[FIGURE-1] shows Myh2 (the type IIa, fast-twitch oxidative marker) expressed at a\
  \ lower relative level in the quadriceps than in the gastrocnemius. Since oxidative\
  \ fibers rely on abundant mitochondria for their energy supply, the lower share\
  \ of this oxidative fiber type in the quadriceps points to fewer mitochondria per\
  \ unit muscle mass there than in the gastrocnemius."
          - letter: "C"
            text: "The soleus muscle contains less sarcoplasmic reticulum than the gastrocnemius muscle\
  \ does."
            answer: true
            explanation: "[FIGURE-1] shows the soleus dominated by Myh7-expressing slow-twitch fibers, while\
  \ the gastrocnemius carries more of the fast-twitch fiber types. Fast-twitch fibers\
  \ are built for rapid, powerful contractions and correspondingly have a more extensively\
  \ developed sarcoplasmic reticulum for fast calcium release, so the slow-fiber-dominated\
  \ soleus would be expected to contain less of it than the gastrocnemius."
          - letter: "D"
            text: "Regularly doing the endurance exercise for a long period of time can increase the\
  \ number of glycolytic muscle fibers in the gastrocnemius muscles."
            answer: false
            explanation: "Endurance training is well established to push muscle fiber character in the oxidative\
  \ direction, converting glycolytic (type IIb) fibers toward more oxidative (type\
  \ IIa/I) phenotypes to support sustained aerobic work. Long-term endurance training\
  \ would therefore be expected to decrease, not increase, the number of purely glycolytic\
  \ fibers in the gastrocnemius."

      - id: q30
        number: "Q30"
        name: "Localizing an Insulin-Signaling Defect from Binding and Glucose-Clearance Tests"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=35"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "The result of Test 1 of Patient G could be shown in Line 1."
            answer: true
            explanation: "Patient G's defect is in step 3 (transduction), downstream of insulin binding to\
  \ its receptor, so insulin-receptor binding itself is normal. [FIGURE-1]'s Line\
  \ 1 in panel B shows the percentage of insulin-bound cells rising rapidly to a plateau\
  \ as insulin concentration increases, exactly the expected normal-binding curve,\
  \ matching Patient G's Test 1 result."
          - letter: "B"
            text: "Lines 2 and 3 show the results of Tests 1 and 2, respectively, of Patient F."
            answer: true
            explanation: "Patient F's defect is in step 2 (insulin-receptor binding itself), so panel B's Line\
  \ 2, which shows a much lower percentage of insulin-bound cells than the normal\
  \ Line 1, fits Patient F's Test 1. With defective binding, insulin cannot lower\
  \ plasma glucose effectively, and panel C's Line 3 (glucose staying elevated rather\
  \ than falling after injection) matches Patient F's expected Test 2 result."
          - letter: "C"
            text: "Line 3 shows the tested result of Patient E."
            answer: false
            explanation: "Patient E's defect is in step 1, insulin secretion, not in receptor binding or the\
  \ downstream response to injected insulin. Since Patient E is given an external\
  \ injection of insulin in Test 2, their receptor and signaling steps work normally,\
  \ so their plasma glucose should fall after injection, unlike Line 3 which shows\
  \ glucose failing to drop, so Line 3 does not fit Patient E."
          - letter: "D"
            text: "Lines 1 and 4 show the results of Tests 1 and 2, respectively, of Patient H."
            answer: false
            explanation: "Patient H's defect is in step 4 (glucose transport into the cell), downstream of\
  \ normal insulin binding, so Line 1 (normal binding curve) does correctly fit Patient\
  \ H's Test 1. But because glucose uptake itself is defective, injected insulin should\
  \ fail to lower plasma glucose in Patient H, whereas [FIGURE-1]'s Line 4 in panel\
  \ C shows glucose declining after injection, so Line 4 does not match Patient H's\
  \ expected Test 2 result."

      - id: q31
        number: "Q31"
        name: "Mapping Bulbul Territory Size from Playback Response Data"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=36"
        subjects:
          - name: "Aggression, Territoriality & Social Structure"
            link: "/resources/9-ethology/aggression-territoriality-social-structure/"
        statements:
          - letter: "A"
            text: "The territory size during the pre-nesting period was smaller than that during the\
  \ nesting period."
            answer: false
            explanation: "The table shows exactly the same set of stations triggering territory defense (C,\
  \ I, G, B, F, D) in both the pre-nesting and nesting rows, with no station changing\
  \ from defended to undefended or vice versa between the two periods. Since the boundary\
  \ of stations marking the defended area is identical in both periods, the territory's\
  \ size does not change; only the speed and intensity of the response differ."
          - letter: "B"
            text: "The quadrangle made by stations G, D, I and F marks the territory size of the bird."
            answer: true
            explanation: "G, D, I and F are exactly the outermost stations at which the resident male still\
  \ shows territory defense in each of the four compass directions (S, W, N, E) in\
  \ the table, while the next station further out in each direction (H, E, K, J respectively)\
  \ shows no defense. That makes the quadrangle joining these four boundary stations\
  \ a reasonable outline of the defended territory."
          - letter: "C"
            text: "The male responded more rapidly to the decoy within its territory during the nesting\
  \ period."
            answer: true
            explanation: "For every station where the male defends its territory, the table's response times\
  \ are consistently shorter in the nesting row than in the pre-nesting row (for example,\
  \ station C drops from 1 minute to 0.2 minutes, and station F from 3 minutes to\
  \ 2.5 minutes). That consistent speed-up shows the male responding more rapidly\
  \ during the nesting period."
          - letter: "D"
            text: "The intensity of territorial behavior displayed is a dependent on seasonal fluctuation\
  \ of hormones."
            answer: true
            explanation: "The same territory is defended far more vigorously (much faster response times) during\
  \ nesting than during pre-nesting, even though the birds and the stations tested\
  \ are the same. That shift in intensity between reproductive stages is consistent\
  \ with rising reproductive/sex hormone levels around nesting driving stronger territorial\
  \ behavior."

      - id: q32
        number: "Q32"
        name: "Reciprocal Altruism in Blood-Sharing Vampire Bats"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=37"
        subjects:
          - name: "Kin Selection, Altruism & Eusociality"
            link: "/resources/9-ethology/kin-selection-altruism-eusociality/"
        statements:
          - letter: "A"
            text: "Kin selection plays an important role in evolution of the sharing behavior in vampire\
  \ bats."
            answer: false
            explanation: "Kin selection favours helping behaviour specifically because it raises the fitness\
  \ of genetic relatives, but the question states the colonies these bats share blood\
  \ in are made up of unrelated females. Since the recipients of sharing are not close\
  \ kin, kin selection is not the mechanism explaining why this behaviour evolved\
  \ here."
          - letter: "B"
            text: "Vampire bats are likely to live in colonies only for short periods of time."
            answer: false
            explanation: "The blood-sharing described depends on a donor being repaid later by the same individuals\
  \ it has helped, which only works as a strategy if bats stay together long enough\
  \ to build a track record with specific colony-mates and reliably interact with\
  \ them again. That requirement for repeated interaction implies long-term, stable\
  \ colony membership rather than bats passing through colonies only briefly."
          - letter: "C"
            text: "The bats showing this behavior have higher indirect fitness than if they would not\
  \ do so."
            answer: false
            explanation: "Indirect fitness comes specifically from helping genetic relatives reproduce, but\
  \ since colony members here are unrelated, any fitness benefit a donor gains from\
  \ sharing blood (through later reciprocation that keeps the donor alive to reproduce)\
  \ counts as its own direct fitness, not indirect fitness gained through relatives."
          - letter: "D"
            text: "Vampire bats are able to recognize and remember other individual bats."
            answer: true
            explanation: "Because being more likely to receive blood back depends on the bat's own past history\
  \ of having donated to a specific individual, this reciprocal system can only work,\
  \ and resist being exploited by non-reciprocating cheaters, if bats can recognize\
  \ and remember which particular colony-mates they have helped before."

      - id: q33
        number: "Q33"
        name: "Complementation and Dominance in lac Operon Merodiploids"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=38"
        subjects:
          - name: "Gene Regulation: Prokaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-prokaryotic/"
        statements:
          - letter: "A"
            text: "Strain number 7 is a lac Z mutant."
            answer: true
            explanation: "[FIGURE-2]'s growth table shows recipient strain 7 growing on lactose minimal medium\
  \ whenever it receives DNA from a strain carrying a functional lacZ gene, but failing\
  \ to grow when the donor also lacks functional lacZ, exactly the complementation\
  \ pattern expected of a lacZ- mutant restored by a wild-type lacZ copy supplied\
  \ in trans."
          - letter: "B"
            text: "Strain number 3 is a lac Y mutant."
            answer: true
            explanation: "[FIGURE-2]'s table shows recipient strain 3 fails to grow only when paired with donors\
  \ that themselves cannot supply functional permease, and is rescued whenever a donor\
  \ with a working lacY gene is used, matching the complementation signature of a\
  \ lacY- mutant needing permease supplied in trans to take up lactose."
          - letter: "C"
            text: "Strains number 2 and 4 are of the same mutation type."
            answer: true
            explanation: "[FIGURE-2]'s table shows recipient strains 2 and 4 growing and failing to grow with\
  \ the same pattern of donors across the panel, which is the expected outcome when\
  \ two strains carry mutations in the same gene: any donor that complements one of\
  \ them complements the other, and any donor that fails to rescue one fails for both."
          - letter: "D"
            text: "If strain number 5 receives DNA from itself, the transformed bacteria cannot grow."
            answer: false
            explanation: "[FIGURE-2]'s table shows recipient strain 5 already growing on lactose medium even\
  \ before receiving any donor DNA, indicating strain 5 itself is not defective in\
  \ a gene required for lactose utilization (for example, it may be a regulatory lacIs/lacOc-type\
  \ strain that is otherwise still able to make functional Z and Y products). Receiving\
  \ a copy of its own DNA would not remove whatever functional genes it already has,\
  \ so the merodiploid would still be expected to grow."

      - id: q34
        number: "Q34"
        name: "Assigning Anonymous DNA Samples to Three Families by STR Profiling"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=40"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "Sample 735 is Dat's DNA."
            answer: false
            explanation: "Sample 735 shares an allele with Huong's known sample at several loci (for example,\
  \ the '5' at locus 1 and the '2' at locus 4) in a pattern consistent with a parent-offspring\
  \ relationship, and it also matches sample 938 well enough to be its co-parent.\
  \ Since Dat is defined as unrelated to any of the three families, a sample this\
  \ closely tied to Huong's family cannot be Dat's."
          - letter: "B"
            text: "Sample 669 is Nhan's DNA."
            answer: true
            explanation: "Working through which samples could be a father passing one allele each to two different\
  \ sons at every locus identifies sample 669 as able to supply a distinct allele\
  \ to both samples 130 and 264 at every locus (for example at locus 3, 669's 4/9\
  \ can give 9 to one son and 4 to the other), which only a true parent of both children\
  \ could do consistently. That parental role across the second family fits Nhan,\
  \ the father of Tin and Nghia."
          - letter: "C"
            text: "Sample 938 is Hung's DNA."
            answer: true
            explanation: "Once Huong and her son Dung are identified within the first family's samples, the\
  \ remaining sample sharing exactly one allele with Dung at every locus, consistent\
  \ with being the missing parent, is sample 938. Since Huong already accounts for\
  \ the mother's role, sample 938 must belong to the father, Hung."
          - letter: "D"
            text: "Sample 297 can be Phu's DNA."
            answer: true
            explanation: "After the two three-member families (Hung/Huong/Dung and Nhan/Tin/Nghia) are fully\
  \ assigned from the samples that fit those parent-offspring patterns, the remaining\
  \ unassigned samples must belong to the two-member family (Phu and Quy) or to Dat.\
  \ Sample 297's allele pattern is consistent with being a parent of one of the remaining\
  \ unassigned samples in that leftover pair, so it is compatible with being Phu's\
  \ DNA."

      - id: q35
        number: "Q35"
        name: "Classifying Crossover Events from Linear Tetrad Data"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=41"
        subjects:
          - name: "Linkage, Recombination & Genetic Mapping"
            link: "/resources/7-genetics/linkage-recombination-genetic-mapping/"
        statements:
          - letter: "A"
            text: "Locus a and b are located on the same arm of chromosome."
            answer: false
            explanation: "Using the tetrad classes to compute map distances (from the frequencies of tetrads\
  \ showing recombination between each locus and the centromere, and directly between\
  \ a and b) gives a centromere-to-a distance and a centromere-to-b distance whose\
  \ difference is far smaller than the directly calculated a-to-b distance. If a and\
  \ b were on the same arm, the direct a-b distance should be close to the difference\
  \ of their individual distances from the centromere, but the much larger observed\
  \ a-b distance instead indicates the two loci sit on opposite arms of the chromosome."
          - letter: "B"
            text: "Class 4 involves a 4-strand double crossover."
            answer: false
            explanation: "The spore pattern for Class 4 is only consistent with [FIGURE-1]'s 3-strand double\
  \ crossover diagram, one crossover occurring between the centromere and gene a on\
  \ one chromatid pair and a second, independent crossover occurring between the centromere\
  \ and gene b on a different chromatid pair, rather than the pattern expected from\
  \ all four chromatids being involved."
          - letter: "C"
            text: "Class 6 involves a 3-strand double crossover, with one between gene a and the centromere\
  \ and between the centromere and gene b."
            answer: true
            explanation: "The recombinant spore pattern of Class 6 matches [FIGURE-1]'s 3-strand double crossover\
  \ diagram, where one crossover occurs between the centromere and gene a on one chromatid\
  \ and a second crossover occurs between the centromere and gene b using one shared\
  \ chromatid, together scrambling both a and b relative to the centromere while leaving\
  \ one chromatid pair uninvolved."
          - letter: "D"
            text: "Class 5 involves a 2-strand double crossover."
            answer: false
            explanation: "Class 5's spore pattern instead matches two independent single crossovers occurring\
  \ on the same pair of non-sister chromatids (one between the centromere and gene\
  \ a, one between the centromere and gene b), which is a different event from [FIGURE-1]'s\
  \ 2-strand double crossover diagram, where both crossovers involve the same two\
  \ chromatids in the classic double-crossover sense used to define that class."

      - id: q36
        number: "Q36"
        name: "Broad- vs Narrow-Sense Heritability and a Bean Seed-Weight Calculation"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=42"
        subjects:
          - name: "Quantitative Genetics, Heritability & Inbreeding"
            link: "/resources/7-genetics/quantitative-genetics-heritability-inbreeding/"
        statements:
          - letter: "A"
            text: "A low H2 value of a trait always indicates that the trait is determined mainly by\
  \ the environment."
            answer: false
            explanation: "H2 = Vg/Vp is a ratio, so a low value only tells us genetic variance is a small share\
  \ of the total phenotypic variance seen in that particular population under those\
  \ particular conditions; it does not by itself mean environmental influence dominates,\
  \ since a low H2 can equally arise simply because the population has very little\
  \ genetic variation to begin with (for example, a highly inbred or genetically uniform\
  \ population), even for a trait that is intrinsically strongly genetically controlled."
          - letter: "B"
            text: "Genetic variance depends on the environment to which the population is exposed."
            answer: true
            explanation: "Because Vp = Vg + Ve + Vi includes a genotype-by-environment interaction term, how\
  \ much phenotypic variance is attributable to genotype can itself shift when the\
  \ environment changes, since different genotypes can respond differently to a new\
  \ environment. This means the genetic variance component measured for a population\
  \ is not a fixed property of the genes alone but depends on the environmental conditions\
  \ the population is exposed to."
          - letter: "C"
            text: "The artificial selection for a trait with higher h2 is more successful than that\
  \ for a trait with lower h2."
            answer: true
            explanation: "Since h2 = Va/Vp specifically measures the additive genetic variance, the component\
  \ of genetic variance that is reliably passed from parent to offspring and drives\
  \ the population's response to selection, a higher h2 means a larger share of the\
  \ selected parents' superiority is transmitted to their offspring. That directly\
  \ translates into a faster, more successful response to artificial selection than\
  \ for a trait with lower h2."
          - letter: "D"
            text: "Two pure strains of bean that produce seeds with different weights were crossed.\
  \ The variances of seeds (Vp) from F1 and F2 plants are 2.0 and 4.1, respectively.\
  \ If we ignore interaction effects, H2 of seeds is 0.51."
            answer: true
            explanation: "Because the parental strains are pure-breeding (genetically uniform) and the F1 generation\
  \ is also genetically uniform (all F1 individuals are the same heterozygous genotype),\
  \ the phenotypic variance seen among F1 seeds (2.0) reflects environmental variance\
  \ alone, which can be taken as an estimate of Ve for the F2 as well. Subtracting\
  \ this environmental variance from the F2's total phenotypic variance gives the\
  \ genetic variance, Vg = 4.1 - 2.0 = 2.1, so H2 = Vg/Vp = 2.1/4.1 ≈ 0.51, matching\
  \ the statement."

      - id: q37
        number: "Q37"
        name: "Long-Term Selection Response and Its Limits in Tribolium Body Size"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=43"
        subjects:
          - name: "Quantitative Genetics, Heritability & Inbreeding"
            link: "/resources/7-genetics/quantitative-genetics-heritability-inbreeding/"
        statements:
          - letter: "A"
            text: "The failure of the population to respond to further selection was because the population\
  \ genetic variation is exhausted."
            answer: false
            explanation: "If additive genetic variation had been exhausted, h2 for the selected population\
  \ should have collapsed toward zero; instead the question states h2 after 125 generations\
  \ was only slightly lower than the original 0.3, showing substantial additive genetic\
  \ variance for body size still remained. So the plateau in mean weight is better\
  \ explained by some other limit than by running out of genetic variation."
          - letter: "B"
            text: "The reason why the mean of the population could be shifted to a value outside the\
  \ original range of the population is that the selection for the increased body\
  \ size is a selection favoring heterozygotes."
            answer: false
            explanation: "Selection favouring heterozygotes (overdominance) tends to maintain variation at\
  \ intermediate values rather than push a population's mean beyond its starting extremes.\
  \ The mean moving past the original heaviest individuals is instead better explained\
  \ by additive alleles for larger size, individually common but originally spread\
  \ across many different individuals, becoming combined together in later generations\
  \ of selected offspring, producing individuals more extreme than any in the founding\
  \ population."
          - letter: "C"
            text: "After 125 generations of selection, additional selection can result in a further\
  \ increase in size if we increase the selection differential (higher than 0.022g)."
            answer: false
            explanation: "By 125 generations the population had already reached a point where beetles heavier\
  \ than any selected individual were apparently no longer viable/fertile combinations,\
  \ i.e. a biological ceiling rather than a shortage of selection pressure. Simply\
  \ applying a stronger selection differential would not create alleles or combinations\
  \ that do not exist or are not viable, so it would not push mean body size any higher."
          - letter: "D"
            text: "If selection was stopped after 125 generations of selection then the body size would\
  \ decrease."
            answer: true
            explanation: "Since substantial additive genetic variance for body size still remained after 125\
  \ generations (h2 only slightly reduced from the original), removing artificial\
  \ selection would let other evolutionary pressures, such as natural selection against\
  \ the fertility costs of extreme size or simple regression as extreme allele combinations\
  \ are no longer preferentially bred, act unopposed. That would be expected to pull\
  \ the population's mean weight back down rather than hold it at its selected extreme."

      - id: q38
        number: "Q38"
        name: "Inferring Chromosomal Rearrangements from Post-Fertilization Embryo Loss"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=44"
        subjects:
          - name: "Chromosomal Variation: Number & Structure"
            link: "/resources/7-genetics/chromosomal-variation-number-structure/"
        statements:
          - letter: "A"
            text: "The mutated male mouse can have a chromosome deletion."
            answer: false
            explanation: "A viable deletion heterozygote (one normal chromosome and one with a deletion) segregates\
  \ its two chromosome copies normally at meiosis and so is not expected to produce\
  \ a large fraction of genetically unbalanced gametes. That is inconsistent with\
  \ the roughly 57.5% post-implantation embryo degeneration seen in this male's crosses,\
  \ which points instead to a defect that regularly generates unbalanced gametes."
          - letter: "B"
            text: "The mutated male mouse can be a chromosomal translocation heterozygote."
            answer: true
            explanation: "A reciprocal translocation heterozygote forms a cross-shaped quadrivalent at meiosis,\
  \ and depending on how the chromosomes segregate from it, a large proportion of\
  \ the resulting gametes carry unbalanced combinations of chromosome segments. Fertilization\
  \ by such gametes typically allows implantation but leads to embryo death afterward,\
  \ matching the high (~57.5%) post-implantation degeneration seen for the mutated\
  \ male."
          - letter: "C"
            text: "The mutated male mouse can be a chromosomal inversion heterozygote."
            answer: true
            explanation: "An inversion heterozygote forms a characteristic loop where the inverted segment\
  \ pairs with its normal homolog, and crossing over within that loop produces chromosomes\
  \ with duplications and deletions. Gametes carrying these unbalanced products can\
  \ fertilize normally but again typically cause embryos to die after implantation,\
  \ consistent with the pattern of normal implantation followed by high degeneration\
  \ observed here."
          - letter: "D"
            text: "The genetic defect in mutated male could be verified by cytological observation of\
  \ meiotic cells in the mouse."
            answer: true
            explanation: "Both translocation and inversion heterozygosity produce visible, distinctive chromosome\
  \ pairing structures at meiosis, a cross-shaped (quadrivalent) configuration for\
  \ a translocation and a loop configuration for an inversion, that show up under\
  \ microscopy of meiotic spreads. Examining the mutated male's meiotic cells cytologically\
  \ could therefore directly confirm which type of rearrangement, if either, is present."

      - id: q39
        number: "Q39"
        name: "Factors That Speed Up or Slow Down Speciation"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=45"
        subjects:
          - name: "Speciation & Reproductive Isolation"
            link: "/resources/15-evolution/speciation-and-reproductive-isolation/"
        statements:
          - letter: "A"
            text: "The larger the number of species in some lineages, the larger number of opportunities\
  \ for new species to form."
            answer: true
            explanation: "A lineage that already contains many species offers more independent populations,\
  \ and more possible pairwise interactions among them (such as hybridization events\
  \ that can seed new polyploid species in plants), than a lineage with only a few\
  \ species. That larger pool of starting material gives more opportunities for additional\
  \ speciation events to occur."
          - letter: "B"
            text: "Animal-pollinated plant families have, on average, more species than closely related\
  \ families pollinated by wind."
            answer: true
            explanation: "Animal pollinators tend to specialize on particular floral traits, so small changes\
  \ in flower shape, scent or color can shift which pollinators visit a plant and\
  \ thereby quickly create reproductive isolation from the rest of the population.\
  \ Wind pollination has no such selective filter on floral form, giving animal-pollinated\
  \ lineages an extra, faster route to reproductive isolation and, on average, more\
  \ species."
          - letter: "C"
            text: "Animals with complex mating behavior are likely to form new species at a low rate."
            answer: false
            explanation: "Elaborate courtship and mate-choice behaviour means individuals make fine, sophisticated\
  \ discriminations among potential partners, and small changes in these signals or\
  \ preferences can rapidly create behavioural reproductive isolation between diverging\
  \ populations. Rather than slowing speciation, this sensitivity to mating-signal\
  \ differences tends to reinforce reproductive isolation quickly and so speeds up\
  \ speciation."
          - letter: "D"
            text: "Oscillations of climates may increase the speciation rate."
            answer: true
            explanation: "Repeated climate swings can fragment populations into isolated refugia during unfavorable\
  \ phases and let them re-expand and potentially re-contact during favorable phases,\
  \ cycling populations through periods of geographic isolation (allowing divergence)\
  \ followed by secondary contact. This repeated isolate-and-reconnect cycle is a\
  \ classic driver that can increase the rate at which new species form."

      - id: q40
        number: "Q40"
        name: "Reconstructing Codon 38 of Tryptophan Synthetase from Revertant Analysis"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=46"
        subjects:
          - name: "Translation & the Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
        statements:
          - letter: "A"
            text: "Mutant 2 results from a base substitution at the first position of the codon."
            answer: true
            explanation: "Glycine is encoded by GGN and arginine by CGN or AG(A/G); using [FIGURE-2]'s codon\
  \ table, the only way to reach an arginine codon from a glycine codon with a single\
  \ base change is by changing the first position (G to A), giving AGA or AGG. That\
  \ is confirmed by mutant 2's own revertants: reaching isoleucine (AUA) at strain\
  \ 4 by a single second-position change only works starting from AGA, which pins\
  \ mutant 2's codon specifically as AGA, still a first-position substitution from\
  \ wild-type GGA."
          - letter: "B"
            text: "Strains 7 and 8 likely have the same sequence as the wild type strain."
            answer: true
            explanation: "Strain 7 reverts mutant 2's AGA (arginine) back to glycine by a single first-position\
  \ change (A back to G), giving GGA; strain 8 reverts mutant 3's GAA (glutamate)\
  \ back to glycine by a single second-position change (A back to G), also giving\
  \ GGA. Both independent reversion routes converge on the same GGA codon, which is\
  \ exactly wild type's own glycine codon, supporting the statement."
          - letter: "C"
            text: "The codon in strain 10 is 5'GUA3'"
            answer: true
            explanation: "Working from wild type's codon GGA, mutant 3 (glutamate) requires a single second-position\
  \ change (G to A), giving GAA. Strain 10 (valine) then requires a further single\
  \ change at that same second position (A to U), converting GAA to GUA, which is\
  \ exactly [FIGURE-2]'s codon for valine and matches the statement."
          - letter: "D"
            text: "The codon in strain 6 is 5'AGC3'."
            answer: false
            explanation: "Mutant 2's codon was pinned down as AGA (using the strain 4 isoleucine reversion,\
  \ since only AGA, not AGG, gives isoleucine AUA by a single change). Strain 6 (serine)\
  \ reverts mutant 2 by a single third-position change (A to U), converting AGA to\
  \ AGU, a valid serine codon, rather than to AGC as the statement claims."

      - id: q41
        number: "Q41"
        name: "Applying Hardy-Weinberg Equilibrium to the ABO Blood Group System"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=47"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "In this population, the number of persons with the blood groups A and B should be\
  \ equal."
            answer: true
            explanation: "Under Hardy-Weinberg, p(A) = p(IA)^2 + 2p(IA)p(i) = 0.4^2 + 2(0.4)(0.2) = 0.16 +\
  \ 0.16 = 0.32, and by the same formula with IA and IB swapped, p(B) = p(IB)^2 +\
  \ 2p(IB)p(i) = 0.16 + 0.16 = 0.32. Because IA and IB start with equal allele frequencies\
  \ (both 40%), their genotype frequencies work out identically, giving equal numbers\
  \ of group A and group B individuals."
          - letter: "B"
            text: "In this population, the number of persons with the blood groups A and AB should be\
  \ equal."
            answer: true
            explanation: "p(AB) = 2p(IA)p(IB) = 2(0.4)(0.4) = 0.32, which is the same value calculated for\
  \ p(A) = 0.32 above. With both frequencies coming out to 32%, group A and group\
  \ AB are expected to be equally common in this population."
          - letter: "C"
            text: "In this population the frequency of persons with anti-B antibodies is 64%."
            answer: false
            explanation: "People make anti-B antibodies unless they already carry the B antigen, so anti-B\
  \ antibodies occur in everyone with blood group A or group O, not group A alone.\
  \ p(A) + p(O) = 0.32 + p(i)^2 = 0.32 + 0.2^2 = 0.32 + 0.04 = 0.36, i.e. 36%, not\
  \ 64%."
          - letter: "D"
            text: "Locus AB0 is localized on an autosomal chromosome because the blood group frequencies\
  \ are the same for men and women."
            answer: true
            explanation: "If the ABO locus were instead on the Y chromosome, only males could carry it and\
  \ blood groups would not appear in females at all; if it were X-linked, males (with\
  \ only one X) could not be heterozygous and so could never show the AB phenotype,\
  \ and the population would not fit the simple Hardy-Weinberg genotype proportions\
  \ used above. Observing equal, Hardy-Weinberg-consistent blood group frequencies\
  \ in both sexes is what is expected for a gene carried on an autosome."

      - id: q42
        number: "Q42"
        name: "Positive vs Negative Frequency-Dependent Selection in Practice"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=48"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "Plant self-incompatibility alleles are an example of negative frequency-dependent\
  \ selection."
            answer: true
            explanation: "Self-incompatibility systems prevent a plant from being fertilized by pollen carrying\
  \ the same allele it already has, so a plant with a common allele is compatible\
  \ with fewer potential mates than one with a rare allele. A rare allele therefore\
  \ confers higher mating success (higher fitness), which is exactly negative frequency-dependent\
  \ selection, since fitness falls as the allele becomes more common."
          - letter: "B"
            text: "Spreading of a newly emerged virus in a human population is controlled by negative\
  \ frequency-dependent selection."
            answer: true
            explanation: "Once a virus strain has already circulated widely, most hosts have developed immunity\
  \ to it, lowering the strain's success (its 'fitness') at spreading further; a rare,\
  \ novel strain instead meets a population with little pre-existing immunity and\
  \ can spread readily. That decline in a strain's spreading success as it becomes\
  \ more common is negative frequency-dependent selection."
          - letter: "C"
            text: "Prevalence of Papilio memnon whose females resemble distasteful Papilio coon is an\
  \ example of positive frequency-dependent selection."
            answer: false
            explanation: "This is Batesian mimicry, where the palatable mimic gains protection only as long\
  \ as predators reliably associate the shared warning pattern with the distasteful\
  \ model; if the mimic becomes too common relative to the model, predators encounter\
  \ the pattern on edible prey often enough to stop avoiding it, and the mimic's advantage\
  \ falls. Because the mimic's protective benefit declines as its own frequency rises\
  \ relative to the model, this is negative, not positive, frequency-dependent selection."
          - letter: "D"
            text: "Spread of genes responsible for warning coloration in toxic organisms in population\
  \ is controlled by positive frequency-dependent selection."
            answer: true
            explanation: "A warning (aposematic) color pattern only protects its bearer once predators have\
  \ learned to associate that pattern with a bad experience, which requires the pattern\
  \ to be common enough for predators to encounter it repeatedly. While the pattern\
  \ is rare it offers little protection, but its benefit grows as it becomes more\
  \ common, which is positive frequency-dependent selection."

      - id: q43
        number: "Q43"
        name: "Non-Lethal Predation Effects on Dragonfly Larval Survival and Metamorphosis"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=49"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "One of the causes of high failure rate of metamorphosis of the larvae upon exposure\
  \ to a non-lethal predator is cannibalism."
            answer: false
            explanation: "Because food is stated to be unlimited in both groups, larvae have little reason\
  \ to attack each other for resources, and the overall mortality observed in [FIGURE-1]\
  \ is relatively modest rather than showing a pattern consistent with larvae preying\
  \ on one another. The failure to complete emergence is better attributed to the\
  \ fish predator's presence itself than to cannibalism among the larvae."
          - letter: "B"
            text: "The high mortality of larvae in the first group is due to predator-induced stress."
            answer: true
            explanation: "The fish predator in [FIGURE-1] cannot physically enter the cage and so cannot kill\
  \ the larvae directly, yet the fish-exposed group still shows lower survival to\
  \ metamorphosis than the no-fish group in the left-hand panel. With direct predation\
  \ ruled out by the cage, this non-lethal effect on survival is attributed to physiological\
  \ stress from sensing a nearby predator, a documented phenomenon in related insects\
  \ such as damselflies."
          - letter: "C"
            text: "In the predator treatment, the percentage of individuals that survived the larval\
  \ stage completed emergence to the adult stage is lower than the percentage of those\
  \ in the fishless treatment."
            answer: true
            explanation: "The right-hand panel of [FIGURE-1] plots the proportion of larval survivors that\
  \ fail to complete emergence, and this proportion is clearly higher in the fish\
  \ treatment (around 10%) than in the no-fish treatment (around 2%). A higher failure-to-emerge\
  \ rate in the predator treatment means a correspondingly lower percentage of larval\
  \ survivors go on to complete emergence compared with the fishless treatment."
          - letter: "D"
            text: "The survival of dragonfly before metamorphosis is dependent on the predator while\
  \ those during metamorphosis is not."
            answer: false
            explanation: "[FIGURE-1] shows the fish predator affecting both measures: the left panel shows\
  \ lower survival to metamorphosis in the fish treatment, and the right panel shows\
  \ a higher failure rate specifically during emergence (the process of completing\
  \ metamorphosis) in the fish treatment as well. Since both the pre-metamorphosis\
  \ and the emergence stages show a fish-associated effect, survival at both stages,\
  \ not just before metamorphosis, depends on the predator's presence."

      - id: q44
        number: "Q44"
        name: "Temperature-Dependent Competitive Outcomes Between Two Salmonid Fishes"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=50"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Competition of these two species is likely to have been affected by temperature and\
  \ altitude"
            answer: true
            explanation: "In the sympatric panels of [FIGURE-1], the identity of the species that survives\
  \ better switches between the low-temperature and high-temperature treatments, showing\
  \ that which species wins the interspecific competition depends on temperature.\
  \ Because the two species' natural allopatric ranges are also linked to different\
  \ altitudes (and hence different typical temperatures), this temperature-dependent\
  \ competitive outcome ties competition to altitude as well."
          - letter: "B"
            text: "S. malma may be distributed at higher altitudinal ranges than is S. leucomaenis"
            answer: true
            explanation: "[FIGURE-1] shows S. malma surviving and outcompeting S. leucomaenis specifically\
  \ in the low-temperature treatments, consistent with the question's statement that\
  \ thriving allopatric S. malma populations are found at 6°C. Since higher altitudes\
  \ are generally colder, being better adapted to lower temperatures suggests S. malma\
  \ is more likely to occupy the higher-altitude, cooler stream reaches, above S.\
  \ leucomaenis."
          - letter: "C"
            text: "S. leucomaenis is likely to be more low-temperature stress-resistant than S. malma"
            answer: false
            explanation: "In the low-temperature panels of [FIGURE-1], S. leucomaenis shows lower survival\
  \ than S. malma, both in sympatry and allopatry. Performing worse under cold conditions\
  \ is the opposite of what would be expected from a species that is more stress-resistant\
  \ to low temperature, so this pattern points to S. malma, not S. leucomaenis, as\
  \ the more cold-tolerant species."
          - letter: "D"
            text: "S. malma has a narrower fundamental niche than does S. leucomaenis"
            answer: false
            explanation: "Comparing the allopatric (competitor-free) panels of [FIGURE-1], which reflect each\
  \ species' fundamental niche, S. malma maintains relatively good survival at both\
  \ low and high temperature, whereas S. leucomaenis's survival curves fall further,\
  \ especially at low temperature. Performing acceptably across a wider temperature\
  \ range in the absence of competition indicates S. malma has the broader, not narrower,\
  \ fundamental niche of the two."

      - id: q45
        number: "Q45"
        name: "Predator-Specific Effects on Guppy Color-Pattern Evolution"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=51"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "The color pattern is responsible for the reduced fitness of P. reticulata."
            answer: false
            explanation: "In [FIGURE-1], the predator-free control pond (line K) shows the number of spots\
  \ per fish increasing over time rather than declining, and different color patterns\
  \ can be equally cryptic without any fitness cost. There is no indication in the\
  \ data that carrying a particular color pattern itself reduces guppy fitness."
          - letter: "B"
            text: "Sexual selection for color pattern of the P. reticulata cannot be inferred from the\
  \ data."
            answer: false
            explanation: "In [FIGURE-1], the control pond without any predator (line K) shows spot number increasing\
  \ over the course of the experiment. Since predation pressure cannot explain a rise\
  \ in conspicuous spotting when no predator is present, this increase is attributable\
  \ to female mate preference for more spots, i.e. sexual selection can be inferred\
  \ from this control-pond trend."
          - letter: "C"
            text: "The color pattern of the P. reticulata may be advantagous in escaping R. hartii."
            answer: false
            explanation: "In [FIGURE-1], the line for the R. hartii pond (line R) tracks closely with the predator-free\
  \ control (line K) rather than showing a decline. If the color pattern were being\
  \ actively selected against because it made guppies easier for R. hartii to catch,\
  \ spot number should fall in that pond; since it does not, there is no support for\
  \ the pattern being advantageous specifically for escaping R. hartii (or disadvantageous\
  \ either)."
          - letter: "D"
            text: "The two predators possibly use two different mechanisms to detect P. reticulata."
            answer: true
            explanation: "[FIGURE-1] shows a clear divergence between the two predator ponds: the C. alta pond\
  \ (line C) shows spot number declining over time, consistent with this more visually-hunting\
  \ predator selecting against conspicuous fish, while the R. hartii pond (line R)\
  \ shows no such decline, tracking the predator-free control instead. That different\
  \ response to the two predators suggests they rely on different cues (mechanisms)\
  \ to locate guppy prey."

      - id: q46
        number: "Q46"
        name: "Grazing Intensity, Root Competition, and Sex Ratio in Poa Grass"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=52"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Distance to the less palatable Stipa neighbours affects the Poa biomass of females\
  \ and males at the ungrazed site."
            answer: false
            explanation: "In the ungrazed panels of [FIGURE-1], the total biomass bars for both female and\
  \ male Poa plants are similar whether grown close to or far from Stipa neighbours\
  \ (within each barrier condition). Without a clear difference in biomass between\
  \ the close and far treatments at that grazing level, distance to Stipa does not\
  \ appear to be affecting biomass there."
          - letter: "B"
            text: "Plants at the moderate grazing site, whether male or female, generally perform better\
  \ near Stipa tussocks than far from them, demonstrating a positive effect of Stipa\
  \ canopies on both genders."
            answer: true
            explanation: "In the moderate-grazing panels of [FIGURE-1], both the female (top) and male (bottom)\
  \ bars are generally taller for plants grown close to Stipa than for those grown\
  \ far away. Better performance near Stipa in both sexes under moderate grazing points\
  \ to Stipa's canopy providing some protective or facilitative benefit (such as partial\
  \ cover from grazers) at that grazing intensity."
          - letter: "C"
            text: "There is a strong below-ground competition between Poa females and Stipa neighbours\
  \ at the ungrazed site."
            answer: true
            explanation: "In the ungrazed, close-to-Stipa panel of [FIGURE-1], adding a root barrier (+B, which\
  \ blocks root-to-root competition while leaving above-ground interactions intact)\
  \ roughly doubles female Poa biomass compared with no barrier (-B). Such a large\
  \ biomass gain specifically from blocking root contact indicates that below-ground\
  \ competition with Stipa roots is substantially suppressing Poa female growth there."
          - letter: "D"
            text: "Population sex ratio drift between female and male bias is influenced by domestic\
  \ grazing intensity."
            answer: true
            explanation: "[FIGURE-2] shows the balance between female and male plant density shifting across\
  \ the three grazing levels: females outnumber males under ungrazed and moderate\
  \ grazing, but under intense grazing the male bars exceed the female bars. That\
  \ reversal in which sex is more numerous as grazing intensity increases shows the\
  \ sex ratio is influenced by grazing pressure."

      - id: q47
        number: "Q47"
        name: "Gut Passage and Germination of Mimosa Seeds Ingested by Goats"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=54"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "A"
            text: "Mimosa seed can survive up to 3 days in the goat digestive system."
            answer: true
            explanation: "Panel A of [FIGURE-1] shows some percentage of ingested Mimosa seeds still being\
  \ recovered from goat faeces out to about 72 hours after ingestion. Since 72 hours\
  \ is 3 days, seeds are shown surviving passage through the goat's digestive tract\
  \ for up to that length of time."
          - letter: "B"
            text: "The passage through the goat digestive system decreases seed germination."
            answer: false
            explanation: "Panel B of [FIGURE-1] plots the probability of NOT germinating for egested versus\
  \ control seeds, and the egested (stippled) line sits below the control (solid)\
  \ line, meaning egested seeds have a lower probability of failing to germinate,\
  \ i.e. a higher germination rate. Since gut passage is associated with better, not\
  \ worse, germination, it increases rather than decreases seed germination."
          - letter: "C"
            text: "Number of seeds egested after ingestion is highest after 24 hours."
            answer: true
            explanation: "Panel A of [FIGURE-1] shows the percentage of seeds recovered from faeces rising\
  \ to its highest point around the 24-hour collection point before declining at later\
  \ time points. That peak at 24 hours is when the largest fraction of ingested seeds\
  \ is being egested."
          - letter: "D"
            text: "Goats could act as legitimate disperser of Mimosa seeds."
            answer: true
            explanation: "For an animal to be a legitimate seed disperser, seeds must survive gut passage and\
  \ remain (or become better) able to germinate afterward, and both panels of [FIGURE-1]\
  \ support this: seeds are recovered viable in faeces for up to 3 days, and panel\
  \ B shows egested seeds germinating at a higher rate than non-ingested control seeds.\
  \ Both findings together support goats as an effective (legitimate) disperser of\
  \ Mimosa seeds rather than simply a seed predator."

      - id: q48
        number: "Q48"
        name: "Reading Relationships from a Five-Taxon Cladogram"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=55"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "The clade containing (d) and (e) is a sister group to the taxon consisting of (a),\
  \ (b) and (c)."
            answer: false
            explanation: "In the cladogram, taxon (a) branches off at the very root, before the (b,c)/(d,e)\
  \ split occurs, so '(a), (b) and (c)' together do not form a valid clade (a monophyletic\
  \ group must include an ancestor and all its descendants, and grouping a with only\
  \ b and c while excluding d and e cuts the tree at the wrong point). The true sister\
  \ group of the (d,e) clade is the (b,c) clade, not a group that also includes (a)."
          - letter: "B"
            text: "The last common ancestor of (b) and (c) descended from the last common ancestor of\
  \ (c) and (d)."
            answer: true
            explanation: "The last common ancestor of (c) and (d) is the deeper node joining the whole (b,c)\
  \ clade to the whole (d,e) clade, while the last common ancestor of (b) and (c)\
  \ is the shallower node within the (b,c) pair itself. Since that shallower (b,c)\
  \ node is a more recent point on the same lineage descending from the deeper (c,d)-joining\
  \ node, it is correct to say it descended from it."
          - letter: "C"
            text: "Taxon (b) is more closely related to taxon (a) than to taxon (e)."
            answer: false
            explanation: "The last common ancestor of (b) and (e) is the node joining the (b,c) clade to the\
  \ (d,e) clade, which is more recent than the root node joining (a) to everything\
  \ else, the last common ancestor (b) shares with (a). Since (b) shares a more recent\
  \ common ancestor with (e) than with (a), (b) is actually more closely related to\
  \ (e), the opposite of the statement."
          - letter: "D"
            text: "The lineage leading to taxon (a) was the first to diverge from the other lineages."
            answer: true
            explanation: "In the cladogram, the very first branch point (the root) separates taxon (a) from\
  \ the ancestor of all the other four taxa, before any of the later splits among\
  \ b, c, d and e occur. A lineage that splits off first at the root like this, and\
  \ remains otherwise unbranched, is described as basal, confirming the statement."

      - id: q49
        number: "Q49"
        name: "Polyphyletic and Paraphyletic Groups in Modern Classification"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=56"
        subjects:
          - name: "Classification Principles & Nomenclature"
            link: "/resources/4-biosystematics/classification-principles-nomenclature/"
        statements:
          - letter: "A"
            text: "Polyphyletic taxa can arise when taxa that are not directly related share similar\
  \ character states due to convergence"
            answer: true
            explanation: "A polyphyletic group is defined as a set of taxa grouped together by shared traits\
  \ even though they do not share an immediate common ancestor bearing that trait.\
  \ Convergent evolution, independent lineages evolving similar features under similar\
  \ selective pressures, is exactly the kind of process that produces this superficial\
  \ similarity between unrelated taxa, leading classifications based on appearance\
  \ alone to lump them together polyphyletically."
          - letter: "B"
            text: "If a classification is based on phenotypic similarity, paraphyletic taxonomic groups\
  \ may result"
            answer: true
            explanation: "A paraphyletic group includes a common ancestor and only some of its descendants,\
  \ typically because one descendant lineage evolved rapidly and now looks quite different\
  \ from the rest. Classifying purely by how similar organisms look will tend to exclude\
  \ that fast-evolving, distinctive-looking descendant even though it truly belongs\
  \ with the group phylogenetically, producing exactly this kind of paraphyletic grouping."
          - letter: "C"
            text: "Some taxa in a paraphyletic taxonomic group have phenotypically evolved at different\
  \ rates compared to closely related taxa that are not included in the group."
            answer: true
            explanation: "The reason a paraphyletic group excludes some of the true descendants of its common\
  \ ancestor is precisely that those excluded descendants evolved distinctive traits\
  \ at a different rate than the rest of the group, making them look different enough\
  \ that early classifications placed them elsewhere. That mismatch in evolutionary\
  \ rate between included and excluded relatives is the underlying cause of paraphyly."
          - letter: "D"
            text: "All molecular data support gymnosperms as a monophyletic taxon."
            answer: false
            explanation: "Gymnosperms include several distinct lineages (Cycadophyta, Ginkgophyta, Coniferophyta\
  \ and Gnetophyta), and molecular studies have not reached full agreement on how\
  \ these lineages relate to each other or to the angiosperms. Because their relationships\
  \ remain genuinely uncertain and contested across different molecular analyses,\
  \ it is not accurate to say all molecular data uniformly support gymnosperms as\
  \ monophyletic."

      - id: q50
        number: "Q50"
        name: "Pitfalls of Molecular Sequences as Phylogenetic Markers"
        link: "/papers/ibo/2016/theoretical-a-exam.pdf#page=57"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            text: "Polypeptide sequences of cytochrome c are very useful for establishing evolutionary\
  \ relationships between closely related species."
            answer: false
            explanation: "Cytochrome c is a highly conserved, slowly evolving protein whose sequence changes\
  \ little even over long evolutionary timescales. Between closely related species,\
  \ so little time has passed that a slowly evolving molecule like cytochrome c accumulates\
  \ too few differences to reliably distinguish their relationships, making it more\
  \ useful for very deep, ancient divergences than for closely related species."
          - letter: "B"
            text: "For phylogenetic analysis, comparing partial sequences from many different genes\
  \ is better than comparing full-length sequences of several genes."
            answer: true
            explanation: "Any single gene can give a misleading tree if that particular locus happens to have\
  \ an atypical evolutionary history at some sites, for example through selection,\
  \ recombination, or a locally unusual substitution rate. Sampling many independent\
  \ genes, even as partial sequences, spreads this risk across more independent loci\
  \ so that one gene's idiosyncrasies are diluted by agreement among the rest, generally\
  \ giving a more reliable, better-supported phylogenetic signal than relying on complete\
  \ sequences from just a handful of genes."
          - letter: "C"
            text: "Rates of nucleotide substitution per unit of time are faster in organisms with short\
  \ generation times than in organisms with long generation times."
            answer: true
            explanation: "Most nucleotide substitutions arise as errors during DNA replication, so the number\
  \ of substitutions accumulated per unit of calendar time depends on how many rounds\
  \ of replication (generations) occur in that time. Organisms with short generation\
  \ times undergo many more replication cycles per year than those with long generation\
  \ times, giving them a faster substitution rate per unit of time."
          - letter: "D"
            text: "The Neutral Theory requires that all polypeptide and DNA sequences evolve at the\
  \ same rate."
            answer: false
            explanation: "The Neutral Theory holds that most substitutions are selectively neutral and their\
  \ fixation rate reflects the mutation rate, but it does not claim this mutation-driven\
  \ rate is identical everywhere in the genome. Positions where almost any change\
  \ is tolerated (little functional constraint) accumulate neutral substitutions quickly,\
  \ while functionally critical positions tolerate very few changes and evolve much\
  \ more slowly, so different sequences and even different sites within a sequence\
  \ are expected to evolve at different rates under the theory."

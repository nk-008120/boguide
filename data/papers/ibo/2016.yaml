      - id: q48
        number: "Q98"
        name: "Modeling Stable Population Size in Gall Aphids"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=56"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Population 1 has a constant number of adult females across generations when each\
  \ female produces 4 progeny."
            answer: false
            explanation: "With population 1's mortality fraction m = 1/3 (35 aborted of 105 total galls) and\
  \ sex ratio r = 1/2, a constant female population requires f x r x (1-m) = 1, i.e.\
  \ f x 0.5 x (2/3) = 1, which solves to f = 3, not 4."
          - letter: "B"
            text: "When every female in population 2 produces 3 progeny, this population will have a\
  \ constant number of adult females across generations."
            answer: false
            explanation: "For population 2, m = 25/100 = 0.25 and r = 1/3 (from the 1:2 female:male ratio);\
  \ plugging f=3 gives Nt/N0 = [3 x (1/3) x 0.75]^t = 0.75^t, which shrinks each generation\
  \ rather than staying constant."
          - letter: "C"
            text: "When population 3 has a constant number of adult females across generations and each\
  \ female aphid produces 4 progeny, the female/male ratio of the population in adult\
  \ stage is 1/2."
            answer: true
            explanation: "For population 3, m = 21/84 = 0.25, so a constant female population with f=4 requires\
  \ 1 = 4 x r x 0.75, giving r = 1/3, which corresponds to a female:male ratio of\
  \ 1:2, matching the statement."
          - letter: "D"
            text: "Given that each female in population 4 produces 6 aphids and taking the offspring\
  \ of population 4 to be in the first generation, the number of adult females in\
  \ the third generation will be 384."
            answer: true
            explanation: "Population 4 has m = 16/48 = 1/3 and r = 1/2, and with 96 adult females in the first\
  \ generation, applying Nt = [6 x (2/3) x 0.5]^(t-1) x N1 for two more generations\
  \ gives 4^2 x 96/4 ... working through [f x r x (1-m)]=6x0.5x(2/3)=2 per generation,\
  \ so N3 = 2^2 x 96 = 384."

      - id: q49
        number: "Q99"
        name: "What Phylogenetic Trees Can and Cannot Reveal"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=57"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "Phylogenetic trees can be used to determine how many times a particular trait independently\
  \ evolved."
            answer: true
            explanation: "When a trait appears in several taxa on a tree that do not share a single most-recent\
  \ common ancestor bearing that trait, the number of separate branches on which it\
  \ appears tells you how many times it must have evolved independently, this is\
  \ exactly how self-incompatibility has been shown to have evolved three separate\
  \ times within the plant genus Leptosiphon."
          - letter: "B"
            text: "Phylogenetic trees can suggest whether a particular trait is the ancestral one."
            answer: true
            explanation: "By mapping a trait's presence or absence onto the tree's branches, biologists can\
  \ reconstruct the most parsimonious ancestral state at internal nodes, inferring\
  \ which version of the trait the common ancestor most likely had, the same logic\
  \ used to infer self-incompatibility as ancestral in Leptosiphon."
          - letter: "C"
            text: "Phylogenetic trees can be used to determine the timing of evolutionary lineage splits."
            answer: false
            explanation: "The branching pattern of a tree by itself only records the relative order in which\
  \ lineages split, not how long ago each split happened; converting branch lengths\
  \ into actual dates requires a molecular clock calibrated against independent evidence\
  \ such as fossils or known biogeographic events, which is a separate step beyond\
  \ the tree topology itself."
          - letter: "D"
            text: "Phylogenetic trees can be used to determine the virus's origins in human populations."
            answer: true
            explanation: "Applying a calibrated molecular clock to a phylogenetic tree of HIV-1 sequences has\
  \ been used to project back to the group's common ancestor and estimate a date of\
  \ origin (around 1930) for its introduction into the human population."

      - id: q50
        number: "Q100"
        name: "Sequence Divergence, Substitution Counting, and Molecular Clock Assumptions"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=58"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "The number of differences in a nucleotide sequence of two species increases with\
  \ time that has passed since the species split from a common ancestor."
            answer: true
            explanation: "As two lineages accumulate independent mutations after diverging from a shared ancestor,\
  \ the number of sequence differences between them tends to grow the longer they\
  \ have been separated, which is the basic premise that molecular-clock dating relies\
  \ on, even though the exact rate of accumulation can vary between lineages and genes."
          - letter: "B"
            text: "If the same protein of two related species are different at only one amino acid,\
  \ then multiple substitutions might have occurred since the two species split."
            answer: true
            explanation: "A single observed amino-acid difference is only a lower bound on the number of underlying\
  \ substitution events, since additional substitutions could have occurred in either\
  \ lineage and then been masked, for example by a later reversion or by an independent\
  \ change that happened to converge on the same residue, so more than one substitution\
  \ is entirely possible even though only one difference is visible today."
          - letter: "C"
            text: "rRNA sequence analysis is useful for phylogenetic relationship among species within\
  \ a genus."
            answer: false
            explanation: "Ribosomal RNA genes are so highly conserved and change so slowly that they accumulate\
  \ too little variation to resolve the fine-scale differences between closely related\
  \ species within the same genus, even though this same slow, steady change makes\
  \ rRNA well suited to resolving much deeper splits, such as between domains of life."
          - letter: "D"
            text: "Pseudogenes can be used for constructing phylogenetic trees."
            answer: true
            explanation: "Because pseudogenes are not translated into functional protein, they are not constrained\
  \ by natural selection on protein function, so they accumulate substitutions at\
  \ a comparatively steady, clock-like rate that makes them useful markers for estimating\
  \ evolutionary divergence and building phylogenetic trees."

      - id: q45
        number: "Q95"
        name: "Slug, Earthworm, and Vegetation-Type Effects on Forest Seedling Survival"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=53"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Slug exclusion has a positive effect on the survival of Agrimonia rostellata and\
  \ Trillium erectum in high earthworm density."
            answer: false
            explanation: "In [FIGURE-1]'s high-earthworm-density panel, seedling survival with slugs excluded\
  \ is essentially the same as (if anything, slightly lower than) survival with slugs\
  \ present, so slug exclusion does not show the clear positive effect this statement\
  \ describes under high earthworm density."
          - letter: "B"
            text: "Slug effects are dependent on other stressors, especially on interactions with non-native\
  \ plants and earthworms."
            answer: true
            explanation: "[FIGURE-1] shows the effect of excluding slugs on seedling survival changing depending\
  \ on whether the surrounding vegetation is native or non-native and on the earthworm\
  \ density, which is exactly what an interactive (rather than a simple, additive)\
  \ effect of slugs looks like."
          - letter: "C"
            text: "Earthworms have positive effects on Agrimonia rostellata and Trillium erectum."
            answer: false
            explanation: "[FIGURE-1] shows higher earthworm density benefiting Agrimonia rostellata's survival\
  \ but harming Trillium erectum's, so earthworms do not have a uniformly positive\
  \ effect on both species."
          - letter: "D"
            text: "Non-native plants and slugs synergistically decrease seedling survival through increased\
  \ competition and consumption."
            answer: false
            explanation: "[FIGURE-1] shows seedling survival in the combined presence of non-native vegetation\
  \ and slugs coming out higher than a simple additive combination of their separate\
  \ effects would predict, indicating a synergistic increase rather than a synergistic\
  \ decrease in survival."

      - id: q46
        number: "Q96"
        name: "Plant Species Richness Effects on Biomass and Soil Carbon/Nitrogen Stocks"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=54"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Above ground biomass increases but root biomass decreases with the increase of species\
  \ richness."
            answer: false
            explanation: "[FIGURE-1] shows both aboveground biomass and standing root biomass rising together\
  \ as species richness increases from monoculture to the 8-species mixture, so root\
  \ biomass does not decrease the way this statement claims."
          - letter: "B"
            text: "Plant species richness promotes soil C stocks mainly through enhanced plant productivity,\
  \ despite accelerated soil organic C decomposition."
            answer: true
            explanation: "[FIGURE-1] shows soil C stocks rising with richness alongside the increase in plant\
  \ biomass (productivity), even though the same figure shows the rate of soil organic\
  \ C decomposition also increasing with richness, so the net gain in C stocks comes\
  \ from productivity outpacing this faster decomposition."
          - letter: "C"
            text: "Greater soil N stocks at higher species richness is mainly attributed to increased\
  \ N retention, rather than N input, with enhanced plant productivity."
            answer: true
            explanation: "Since no legumes (the plant group that would add new nitrogen via fixation) are included\
  \ in any of the treatments, the higher soil N stocks seen at higher richness in\
  \ [FIGURE-1] must come from the more productive, richer plant mixtures retaining\
  \ and cycling existing nitrogen more effectively rather than from any new nitrogen\
  \ input."
          - letter: "D"
            text: "More diverse ecosystems can increase the potential for C sequestration in terrestrial\
  \ ecosystems."
            answer: true
            explanation: "Because [FIGURE-1] shows soil carbon stocks increasing as plant species richness\
  \ rises, this experiment supports the broader conclusion that more diverse plant\
  \ communities can enhance the capacity of terrestrial ecosystems to sequester carbon."

      - id: q47
        number: "Q97"
        name: "Grazer Identity, Diversity, and Nutrient Enrichment in Rock-Pool Food Webs"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=55"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Gross ecosystem productivity is enhanced by nutrient enrichment and is greater in\
  \ pools where Littorina is present."
            answer: true
            explanation: "[FIGURE-1] shows GEP consistently higher in the nutrient-enriched treatments than\
  \ in ambient ones, and within those comparisons, pools containing Littorina show\

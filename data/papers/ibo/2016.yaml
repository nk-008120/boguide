      - id: q1
        number: "Q51"
        name: "Phage-Display Screen for Protein Kinase Inhibitors"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=5"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "When the binding process reaches equilibrium, all potential inhibitor molecules will\
  \ be bound to the kinase."
            answer: false
            explanation: "Binding equilibrium is dynamic, not absolute: even when most kinase-inhibitor binding\
  \ sites are occupied, individual inhibitor molecules continually associate and dissociate,\
  \ so some free inhibitor and some empty kinase molecules always coexist at equilibrium."
          - letter: "B"
            text: "Test compounds that show high inhibition in this assay must bind the ATP-binding\
  \ cleft of the kinase."
            answer: false
            explanation: "A compound can score well in the assay without directly occupying the ATP pocket,\
  \ since binding at an allosteric site elsewhere on the kinase can distort the ATP-binding\
  \ cleft indirectly and still block the labeled ATP analog from attaching."
          - letter: "C"
            text: "Small differences in evolutionary conserved ATP binding sites on kinases allow targeting\
  \ specific kinases."
            answer: true
            explanation: "Although the ATP pocket is broadly conserved across the kinase family, subtle sequence\
  \ and shape differences between individual kinases are large enough for inhibitors\
  \ to discriminate between them, which is exactly why this phage-display screen can\
  \ be run separately for each kinase of interest."
          - letter: "D"
            text: "A strongly binding test compound will yield a low count in the plaque assay."
            answer: true
            explanation: "A compound that binds the kinase tightly occupies the sites the ATP-analog beads\
  \ would otherwise use, so most phage stay unbound to beads and are washed away before\
  \ the final plaque-forming step, giving a low plaque count."

      - id: q2
        number: "Q52"
        name: "Telomere Shortening in Fission-Yeast Telomerase Mutants"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=6"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "A"
            text: "The average length of telomeres in fission yeast is 300 nucleotides."
            answer: false
            explanation: "[FIGURE-1] shows the hybridizing telomere signal in the unaffected spores and wild-type\
  \ yeast spanning from under 200 to just over 300 nucleotides, centered around roughly\
  \ 250 nucleotides; after accounting for the 35-nucleotide cleavage offset, the true\
  \ repeat length averages just over 200 nucleotides, not 300."
          - letter: "B"
            text: "Spores 2 and 4 appear to lack telomerase."
            answer: true
            explanation: "The descendants of spores 2 and 4 show telomere signal shrinking progressively from\
  \ day 3 to day 9 in [FIGURE-1], while spores 1 and 3 keep a constant telomere length\
  \ like wild type, which is the classic signature of cells missing functional telomerase\
  \ and losing repeats with every division."
          - letter: "C"
            text: "Fission yeast telomeres lose less than 20 nucleotides per replication."
            answer: true
            explanation: "Over the 3-day resampling interval the shortening spores lose under 100 nucleotides,\
  \ and at a 6-hour generation time that is about 12 divisions in 3 days, giving a\
  \ loss of well under 10 nucleotides per generation, comfortably under the 20-nucleotide\
  \ threshold in this statement."
          - letter: "D"
            text: "The fission yeasts that lose their telomeres will have normal cell size."
            answer: false
            explanation: "Cells that run out of telomere protection stop dividing (consistent with the poor\
  \ growth of spores 2 and 4 after several transfers) but continue to grow in mass,\
  \ so they become abnormally large rather than staying a normal size."

      - id: q3
        number: "Q53"
        name: "Mitochondrial Membrane Potential in Hypoxia/Reoxygenation Injury"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=7"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "As seen in Fig.Q.53.(2)a, cardiomyocytes are a type of striated muscle cells."
            answer: true
            explanation: "The banded, cross-striated appearance of the myocyte image at panel (2)a in [FIGURE-1]\
  \ is characteristic of striated (cardiac) muscle, consistent with cardiomyocytes\
  \ belonging to the striated-muscle category."
          - letter: "B"
            text: "Hypoxia leads to a drop in pH in the matrix."
            answer: true
            explanation: "Without oxygen the electron transport chain stalls, protons pumped into the intermembrane\
  \ space are no longer efficiently returned, and H+ accumulates, lowering matrix\
  \ pH during the hypoxic phase shown in the figure."
          - letter: "C"
            text: "Drug A pretreatment is good for cell because it prevents the collapse of mitochondrial\
  \ membrane potential in HR."
            answer: true
            explanation: "In [FIGURE-1] the dye-intensity trace for the drug-A-pretreated myocyte stays closer\
  \ to baseline through the hypoxia/reoxygenation cycle than the untreated trace,\
  \ showing that pretreatment limits the drop in membrane potential that otherwise\
  \ signals mitochondrial damage."
          - letter: "D"
            text: "Captured images in drug A pretreatment group are presented in (2) and captured images\
  \ in HR treatment without pretreatment of drug A are presented in (3)."
            answer: false
            explanation: "The assignment is reversed: panel (3), not (2), keeps a higher dye intensity (more\
  \ intact mitochondria) consistent with drug A protection, while panel (2) shows\
  \ the loss of signal expected from unprotected HR injury."

      - id: q4
        number: "Q54"
        name: "Structure-Activity Relationships of Antifreeze Glycoproteins"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=8"
        subjects:
          - name: "Carbohydrate Chemistry & Biology"
            link: "/resources/1-cell-molecular/carbohydrate-chemistry-biology/"
        statements:
          - letter: "A"
            text: "A disaccharide bound to the threonine residue is required for antifreeze activity."
            answer: false
            explanation: "One active analogue in the table keeps antifreeze activity with R3 = H, i.e. with\
  \ no sugar attached to threonine at all, so the disaccharide itself is not a strict\
  \ requirement for activity."
          - letter: "B"
            text: "A mutant that has threonine residues replaced with serine residues reduces antifeeze\
  \ activities."
            answer: true
            explanation: "Serine can still form the sugar linkage but lacks threonine's hydrophobic methyl\
  \ group; the table shows that when the methyl group (R2) is replaced by H, activity\
  \ is lost, so swapping in serine removes a chemical feature required for activity."
          - letter: "C"
            text: "N-acetyl group at the C-2 position is required for antifreeze activity."
            answer: true
            explanation: "Every active analogue in the table keeps the N-acetyl group at R1, while switching\
  \ it to O-acetyl abolishes activity, showing that the N-acetyl substituent is necessary\
  \ for the antifreeze effect."
          - letter: "D"
            text: "Different numbers of repetitive motifs in AFGP genes amongst closely related species\
  \ might have been caused by DNA polymerase inaccuracy."
            answer: true
            explanation: "The Ala-Thr-Ala tripeptide unit is repeated many times in tandem in AFGP genes, and\
  \ tandem repeats of this kind are classically prone to copy-number changes from\
  \ DNA polymerase slippage during replication, so this is a plausible cause of repeat-number\
  \ variation between species."

      - id: q5
        number: "Q55"
        name: "Filming Rotary Catalysis in F1-ATPase"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=9"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "Hydrolysis of ATP by F1 leads to the conformational change of a and b subunits."
            answer: true
            explanation: "The rotary motion of the actin filament attached to gamma seen across the 12 frames\
  \ in [FIGURE-2] is generated by sequential conformational changes in the surrounding\
  \ alpha and beta subunits as each hydrolyzes ATP in turn, the same conformational\
  \ cycling that runs in reverse during ATP synthesis."
          - letter: "B"
            text: "From the set of figures, the filament rotated anticlockwise (looking from the cytosolic\
  \ side)."
            answer: true
            explanation: "Tracking the actin filament's angular position across the sequential frames in [FIGURE-2]\
  \ shows it advancing in the same rotational sense each frame, which corresponds\
  \ to anticlockwise rotation when the images are viewed from the stated (cytosolic)\
  \ side."
          - letter: "C"
            text: "Rotary rate is below 0.3 rounds per second."
            answer: false
            explanation: "Timing one full revolution across the frames (using the 220 ms interval between images)\
  \ gives a period of under 3 seconds, corresponding to a rate of roughly 0.4 rounds\
  \ per second, faster than the 0.3 rounds/second this statement proposes."
          - letter: "D"
            text: "Rotating the actin filament in the opposite direction is coupled with ATP synthesis."
            answer: true
            explanation: "ATP hydrolysis and ATP synthesis run the F1 motor in opposite rotational directions,\
  \ so if hydrolysis drives the anticlockwise rotation seen in [FIGURE-2], forcing\
  \ (or letting proton flow drive) gamma to turn the opposite way is what powers ATP\
  \ synthesis."

      - id: q6
        number: "Q56"
        name: "Microbial Succession During Cabbage Lactic Fermentation"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=10"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The drop in pH value from day 1 to day 3 was caused by only organic acids produced\
  \ exclusively by lactic acid bacteria."
            answer: false
            explanation: "All three microbial groups shown in [FIGURE-1], lactic acid bacteria, yeast, and\
  \ filamentous fungi, are capable of producing organic acids through their own fermentative\
  \ or respiratory metabolism, so the early pH drop cannot be attributed exclusively\
  \ to lactic acid bacteria."
          - letter: "B"
            text: "Lactic acid produced by lactic acid bacteria favours the growth of yeast cells from\
  \ day 10 till day 26."
            answer: true
            explanation: "Yeast grow best in the mildly acidic pH range (roughly pH 4-4.5) that the lactic\
  \ acid bacteria establish, and [FIGURE-1] shows the yeast population rising over\
  \ the day-10-to-26 window as the broth sits in that pH range."
          - letter: "C"
            text: "Yeast cells shifted from fermentation to aerobic respiration after day 22."
            answer: false
            explanation: "The stem states that dissolved oxygen is fully depleted by day 22, so the shift after\
  \ that point runs the opposite way, yeast must switch from aerobic respiration\
  \ to fermentation, not the reverse."
          - letter: "D"
            text: "Some filamentous fungi showed tolerance to low pH."
            answer: true
            explanation: "[FIGURE-1] shows filamentous fungi persisting at a detectable population late in\
  \ the fermentation course, by which time the broth pH has already fallen substantially,\
  \ indicating that at least some of these fungi tolerate the low-pH conditions."

      - id: q7
        number: "Q57"
        name: "Protein Adaptations of Halophilic Archaea to High Intracellular Salt"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=11"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "Most intracellular proteins of Halobacteriales contain a large excess of charged\
  \ amino acids on their outer surface."
            answer: true
            explanation: "An excess of surface charge, mostly negatively charged residues, helps halophilic\
  \ proteins stay hydrated and properly folded despite the very high intracellular\
  \ ionic strength, so this surface-charge adaptation is a well-documented feature\
  \ of Halobacteriales proteins."
          - letter: "B"
            text: "Halobacteriales spend a lot of ATPs to maintain osmotic pressure."
            answer: true
            explanation: "Keeping intracellular KCl at such an extreme concentration, and continuously pumping\
  \ Na+ back out of the cell, requires active transport, so a substantial share of\
  \ the cell's ATP budget goes toward maintaining this osmotic balance."
          - letter: "C"
            text: "Most intracellular enzymes of Halobacteriales lose their catalytic activity when\
  \ suspended in solutions containing less than 1 M NaCl."
            answer: true
            explanation: "Because halophilic enzymes are structurally adapted to fold and function only in\
  \ a very high-salt environment, removing them to a low-salt solution (below about\
  \ 1 M NaCl) strips away the ionic shielding they depend on, and most denature and\
  \ lose activity."
          - letter: "D"
            text: "In Halobacteriales, amino acids can be imported through Na+/amino acids antiporters."
            answer: false
            explanation: "Amino acid uptake in these cells is driven by the inward Na+ gradient through Na+/amino-acid\
  \ symporters, which move both ions in the same direction, not antiporters, which\
  \ would exchange them in opposite directions."

      - id: q8
        number: "Q58"
        name: "Genome Segmentation and Subtype Diversity in Influenza A"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=12"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "Influenza A viruses exhibit rapid evolutionary dynamics because the genome is segmented."
            answer: true
            explanation: "A segmented genome lets two co-infecting strains swap whole RNA segments (reassortment)\
  \ when they infect the same cell, generating novel H/N gene combinations far faster\
  \ than point mutation alone could, which is a major driver of influenza's rapid\
  \ evolution."
          - letter: "B"
            text: "In theory, there are 88 types of influenza A viruses."
            answer: false
            explanation: "The number of possible subtype combinations is the product of the 18 hemagglutinin\
  \ subtypes and the 11 neuraminidase subtypes, 18 × 11 = 198, not 88, so this undercounts\
  \ the theoretical diversity."
          - letter: "C"
            text: "Influenza A viruses exhibit high mutation rates because the genome is single strand\
  \ RNA."
            answer: true
            explanation: "The viral RNA-dependent RNA polymerase that replicates this single-stranded RNA genome\
  \ lacks proof-reading capability, so errors are not corrected the way DNA polymerase\
  \ corrects DNA replication errors, giving influenza A a comparatively high mutation\
  \ rate."
          - letter: "D"
            text: "Influenza A virion can infect the cells only if RNA-dependent RNA polymerase is present."
            answer: true
            explanation: "The virus's RNA genome can only be transcribed and replicated inside the host cell\
  \ by the viral RNA-dependent RNA polymerase carried in the virion, so a virus particle\
  \ lacking this enzyme cannot establish a productive infection."

      - id: q9
        number: "Q59"
        name: "Mapping p35 Phosphorylation Sites with a Phospho-Tag Gel"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=13"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "Protein p35 has only two phosphorylation sites: serine 8 and threonine 138."
            answer: false
            explanation: "Even the 2A mutant, in which both S8 and T138 are changed to unphosphorylatable alanine,\
  \ still produces a phosphorylated band (L3) on the gel in [FIGURE-2], showing that\
  \ p35 carries at least one additional phosphorylation site beyond S8 and T138."
          - letter: "B"
            text: "Protein p35 can be phosphorylated by a protein kinase different from Cdk5."
            answer: true
            explanation: "A phosphorylated form of p35 (band L2) still appears in the Cdk5-inactive (kn) strain\
  \ in [FIGURE-2], so some kinase other than Cdk5 must be responsible for that phosphorylation\
  \ event."
          - letter: "C"
            text: "In strain Cdk5-wt p35-S8A only a few p35 molecules are phosphorylated at T138."
            answer: false
            explanation: "Comparing the S8A lane against the lane where both S8 and T138 must be phosphorylated\
  \ in [FIGURE-2] shows that essentially all of the p35 molecules in the Cdk5-wt/S8A\
  \ strain carry the T138 phosphate, not just a small fraction."
          - letter: "D"
            text: "Phosphate groups attached to S8 are more accessible to phosphate binding groups of\
  \ the Phospho-tag gel than phosphate groups attached to T138."
            answer: true
            explanation: "In [FIGURE-2], the band corresponding to phosphorylation at S8 (M2) migrates much\
  \ more slowly than the bands carrying only T138 phosphate for the same number of\
  \ attached phosphates, indicating that the Phospho-tag's metal-binding groups interact\
  \ more strongly with a phosphate on S8 than with one on T138."

      - id: q10
        number: "Q60"
        name: "pH-Dependent Membrane Diffusion of Aspirin and Arginine"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=14"
        subjects:
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "Aspirin diffuses through membranes mainly in the stomach because more aspirin molecules\
  \ are in deprotonated form at pH of about 1.6 in the stomach."
            answer: false
            explanation: "Aspirin's pKa (about 3.4) is well above the stomach's pH of roughly 1.6, so at that\
  \ pH most aspirin molecules stay protonated (uncharged), not deprotonated; it is\
  \ precisely this uncharged, protonated majority that lets aspirin diffuse efficiently\
  \ through the stomach lining."
          - letter: "B"
            text: "Based on molecular weight, one would expect Aspirin to diffuse more easily through\
  \ membrane than Arginine"
            answer: false
            explanation: "Arginine (about 174 g/mol) is actually lighter than aspirin (about 180 g/mol), so\
  \ molecular weight alone would predict arginine, not aspirin, to diffuse the more\
  \ easily of the two."
          - letter: "C"
            text: "Optimal pH range for Arginine absorption by passive diffusion is between 2.18 and\
  \ 9.04."
            answer: false
            explanation: "Between its pKa values of 9.04 and 12.48, arginine sits in its neutral, zwitterionic\
  \ form; the 2.18-9.04 window given in the statement instead spans a region where\
  \ arginine still carries a net positive charge, which is unfavorable for passive\
  \ diffusion."
          - letter: "D"
            text: "Omeprazole, a proton pump inhibitor, blocks the entry of Aspirin into the blood in\
  \ the initial few minutes after oral administration."
            answer: true
            explanation: "Aspirin is absorbed mainly in the stomach within the first few minutes after being\
  \ swallowed, and omeprazole raises stomach pH by blocking acid secretion; the resulting\
  \ less-acidic environment shifts more aspirin into its charged, poorly-absorbed\
  \ form, blunting this early stomach absorption."

      - id: q11
        number: "Q61"
        name: "Cadmium's Effect on Maize Root Elongation and Endodermal Suberization"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=15"
        subjects:
          - name: "Root Anatomy"
            link: "/resources/6-plant-anatomy/root-anatomy/"
        statements:
          - letter: "A"
            text: "The treatment of Cd resulted in the reduction of elongation zone of the root, leading\
  \ to decreased root length."
            answer: true
            explanation: "[FIGURE-1] shows the elongation zone of the Cd-treated root mapped over a noticeably\
  \ shorter apex-to-base distance than in the untreated control, and the overall Cd-treated\
  \ root is correspondingly shorter."
          - letter: "B"
            text: "Endodermal cells with suberin lamellae were already present at a distance of approximately\
  \ 0.5 cm from the root apex in tissues adjacent to agar containing Cd100, however,\
  \ suberinized cells were found much further from the apex on the other side."
            answer: true
            explanation: "In the unilateral-exposure experiment, [FIGURE-1] shows suberized (solid-line) endodermis\
  \ beginning only about 0.5 cm from the tip on the Cd100 side, while on the Cd0 side\
  \ of the same root suberization does not begin until much farther from the apex."
          - letter: "C"
            text: "In roots exposed unilaterally to Cd (Cd0–Cd100), the development of the endodermis\
  \ was accelerated and asymmetrical."
            answer: true
            explanation: "The unequal onset distance of suberization between the two sides of the same unilaterally-exposed\
  \ root shown in [FIGURE-1] demonstrates both that endodermal maturation sped up\
  \ on the Cd-exposed side and that this speeding-up was asymmetric across the root."
          - letter: "D"
            text: "In high Cd containing media, suberin lamellae in endodermal cells were not present\
  \ in older parts of the root likely due to the restriction of Cd in younger part."
            answer: false
            explanation: "[FIGURE-2] shows that in the high-Cd treatment the suberin lamellae actually disappear\
  \ early in the mature part of the root while remaining present in the control and\
  \ on the low-Cd side, indicating the cells there were damaged/destroyed by Cd rather\
  \ than that Cd was somehow confined to the younger part of the root."

      - id: q12
        number: "Q62"
        name: "Habitat-Linked Hydraulic Vulnerability in Ranunculus Species"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=17"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "A"
            text: "All species were very vulnerable to water stress. In species with narrow ecological\
  \ amplitude, the drought-exposed R. bulbosus was less vulnerable to desiccation\
  \ than the humid habitat R. lanuginosus."
            answer: true
            explanation: "[FIGURE-1] shows all three Ranunculus taxa losing half their leaf hydraulic conductance\
  \ at a fairly mild water potential (roughly -0.2 to -0.8 MPa), which counts as high\
  \ vulnerability overall, and within that range the dry-meadow specialist R. bulbosus\
  \ needs a more negative water potential to reach 50% loss than the humid-meadow\
  \ R. lanuginosus, meaning it tolerates dehydration better."
          - letter: "B"
            text: "Herbaceous species would be more vulnerable to water stress than woody species and\
  \ perennial grasses, but also would show interspecific and intraspecific adjustments\
  \ in hydraulic vulnerability based on the water availability of their respective\
  \ habitats."
            answer: true
            explanation: "The 50% conductance loss for these herbaceous Ranunculus species/populations occurs\
  \ at a much less negative water potential than the -1 to -1.8 MPa reported for perennial\
  \ grasses and woody plants, and [FIGURE-1] additionally shows different thresholds\
  \ among the Ranunculus populations depending on whether their habitat is dry or\
  \ humid."
          - letter: "C"
            text: "The leaf hydraulics method employs hydraulic conductance including both xylary and\
  \ extraxylary pathways."
            answer: true
            explanation: "Leaf conductance falls sharply well before the water potential (-2 MPa or lower)\
  \ at which xylem embolism becomes significant, so most of the measured conductance\
  \ loss must be occurring through non-xylem (extraxylary) tissue as well as through\
  \ the xylem pathway."
          - letter: "D"
            text: "The effect of drought in these plant species is found to be a loss of leaf hydraulic\
  \ conductance at moderate water potential based on extraxylary pathways rather than\
  \ embolism formation."
            answer: true
            explanation: "Because the sharp drop in leaf hydraulic conductance happens at a comparatively mild\
  \ water potential (around -0.2 to -0.8 MPa), well before xylem embolism sets in\
  \ around -2 MPa, the conductance loss in these species is better explained by changes\
  \ in the extraxylary pathway than by xylem embolism."

      - id: q13
        number: "Q63"
        name: "GPI-Anchoring Deficiency and Growth Phenotypes in an Arabidopsis atgpi8 Mutant"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=18"
        subjects:
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "The early post germination growth of cotyledons and first two leaves are not affected\
  \ by the mutation. However, root growth, hypocotyl elongation and stomata differentiation\
  \ are strongly affected by the mutation."
            answer: true
            explanation: "[FIGURE-2] shows cotyledons and first leaves looking essentially alike in wild type\
  \ and mutant seedlings, while [FIGURE-3]'s bar charts show markedly shorter root\
  \ and hypocotyl length in the mutant and [FIGURE-1] shows a visibly higher number\
  \ of stomata in the mutant epidermis, matching the pattern this statement describes."
          - letter: "B"
            text: "The data suggest that GPI anchoring promotes the growth of leaves in vegetative plants;\
  \ however, it inhibits axillary shoot formation."
            answer: true
            explanation: "Vegetative-stage leaves are larger in wild type than in the GPI-transamidase-deficient\
  \ mutant, while [FIGURE-3] shows the mutant instead produces more cauline (axillary)\
  \ branches, together indicating that functional GPI anchoring promotes leaf growth\
  \ but restrains axillary shoot outgrowth."
          - letter: "C"
            text: "The atgpi8-1 mutation leads to reduced internode and pedicel elongation. However,\
  \ the height of atgpi8-1 plants is only moderately reduced likely because the number\
  \ of internodes is increased."
            answer: true
            explanation: "[FIGURE-3]'s morphometric panels show both internode and pedicel length reduced in\
  \ the mutant, yet overall mutant plant height is only somewhat shorter than wild\
  \ type, which is consistent with the mutant compensating for shorter internodes\
  \ by producing more of them."
          - letter: "D"
            text: "The results indicate that AtGPI8 gene promotes early transition to flowering, but\
  \ inhibits fruit production."
            answer: true
            explanation: "Wild-type plants reach flowering earlier than the atgpi8-1 mutant, showing that a\
  \ functional AtGPI8 gene promotes an earlier flowering transition, while the mutant\
  \ (which lacks functional AtGPI8) produces more siliques than wild type, indicating\
  \ that AtGPI8 normally restrains rather than promotes fruit(silique) number."

      - id: q14
        number: "Q64"
        name: "Diurnal Light and CO2 Co-Limitation of Underwater Photosynthesis"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=20"
        subjects:
          - name: "Light Reactions & Photophosphorylation"
            link: "/resources/5-plant-physiology/light-reactions-photophosphorylation/"
        statements:
          - letter: "A"
            text: "In the underwater of ponds, light limitation appears early in the morning and co-limitation\
  \ of both light and CO2 takes place early in the afternoon."
            answer: false
            explanation: "[FIGURE-1] places the window where both light and CO2 become co-limiting around the\
  \ early evening (roughly 18:00), not early afternoon, so the timing given in this\
  \ statement does not match the recorded curves."
          - letter: "B"
            text: "The decrease in level of O2 in water column during the night is caused by the Swamp\
  \ Raspwort respiration."
            answer: true
            explanation: "Photosynthetic O2 production stops once light is gone at night, but the plant keeps\
  \ respiring and consuming O2, so its own respiration is what draws the water-column\
  \ O2 level down overnight."
          - letter: "C"
            text: "In water column of ponds, CO2 molecules are directly produced by respiration of Swamp\
  \ Raspwort and by conversion from HCO3- at pH neutral results in increasing CO2\
  \ level."
            answer: true
            explanation: "Aquatic-organism respiration releases CO2 directly into the water, and near neutral\
  \ pH the bicarbonate/CO2 equilibrium shifts to convert HCO3- into CO2 as well, so\
  \ both processes shown in the figure's pH and CO2 traces contribute to raising dissolved\
  \ CO2."
          - letter: "D"
            text: "As indicated in the figure, temperature variation in ponds rich Swamp Raspwort is\
  \ from 13 to 20°C. The alteration in temperature is mainly maintained by high density\
  \ of this plant species."
            answer: false
            explanation: "[FIGURE-1] shows water temperature tracking the same day/night pattern as surface\
  \ irradiance, rising during daylight and falling overnight, which points to solar\
  \ irradiance as the main driver of the temperature swing rather than the plant's\
  \ own density."

      - id: q15
        number: "Q65"
        name: "Nitric Oxide Feedback in Plant Nitrate Assimilation"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=21"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "In the nitrogen metabolism process of the plant cells, NO is one of the products\
  \ but plays a role signaling regulation of NH4+ formation and NO3- assimilation."
            answer: true
            explanation: "[FIGURE-1] shows NO2- being converted into NO as one branch of nitrogen metabolism,\
  \ and this NO in turn feeds back to inhibit nitrate reductase and the nitrate transporter,\
  \ so it is both a metabolic product and a signal that regulates NH4+ formation and\
  \ NO3- uptake."
          - letter: "B"
            text: "NH4+ level in chloroplasts of plant cells is controlled by activity of GSNO."
            answer: true
            explanation: "GSNO inhibits NO3- uptake and its reduction to NO2-, which in turn is what gets converted\
  \ (via GSNOR1) into NH4+, so the amount of GSNO present indirectly sets how much\
  \ NH4+ is generated through this pathway."
          - letter: "C"
            text: "Reduction of NO2- ions mainly occur in cytosol"
            answer: false
            explanation: "NO2- is toxic if it accumulates in the cytosol, so plant cells rapidly transport\
  \ it into the chloroplast, where nitrite reductase actually carries out its reduction\
  \ to NH4+, not in the cytosol."
          - letter: "D"
            text: "NO feedback regulates flux through nitrate assimilation pathway and controls its\
  \ bioavailability by modulating its own metabolism."
            answer: true
            explanation: "[FIGURE-1] shows NO inhibiting the upstream steps (NRT and NR) that generate the\
  \ NO2- from which NO itself derives, so NO both throttles flux through the assimilation\
  \ pathway and, by doing so, regulates its own future production."

      - id: q16
        number: "Q66"
        name: "Comparing Lead Toxicity Thresholds for Growth and Photosynthesis in Two Microalgae"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=22"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "Estimated IC50 of growth for the Scenedesmus was higher than that for the Chlorella."
            answer: false
            explanation: "Reading the growth-rate curve in [FIGURE-1], the lead concentration needed to halve\
  \ Scenedesmus's growth rate is lower than the concentration needed to halve Chlorella's,\
  \ so the growth IC50 for Scenedesmus is the lower one, not the higher one."
          - letter: "B"
            text: "Photosynthetic impairment by Pb was likely responsible for the growth decrease in\
  \ the Chlorella but this was not the scenario in the Scenedesmus"
            answer: true
            explanation: "In Chlorella, growth begins falling sharply at almost the same lead concentration\
  \ where Fv/Fm starts dropping, tying the two together, whereas in Scenedesmus growth\
  \ is already declining at lower lead concentrations where Fv/Fm is still unaffected,\
  \ showing its growth inhibition comes from something other than photosynthetic damage."
          - letter: "C"
            text: "The estimated IC50 for effects on Fv/Fm was higher than that for growth in Scenedesmus"
            answer: true
            explanation: "For Scenedesmus, [FIGURE-1] shows the growth curve reaching its half-maximal response\
  \ at a lower lead concentration than the Fv/Fm curve does, meaning the photosynthesis-based\
  \ IC50 sits at a higher lead concentration than the growth-based IC50."
          - letter: "D"
            text: "At lead concentration that Log10([Pb]+1) is 0.5, the Scenedesmus reproduced faster\
  \ than the Chlorella did."
            answer: false
            explanation: "At that lead concentration the growth-rate curves in [FIGURE-1] show Scenedesmus's\
  \ growth rate (Ke) lower than Chlorella's, and since generation time is inversely\
  \ related to growth rate, the lower Ke means Scenedesmus is dividing more slowly,\
  \ i.e. Chlorella reproduced faster."

      - id: q17
        number: "Q67"
        name: "Gibberellin Signaling and Root/Shoot Allocation in Transgenic Poplar"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=23"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "A"
            text: "Greenhouse-grown dwarf plants of both transgenic types display a significant reduction\
  \ in aerial biomass and an increase in belowground biomass, leading to a significant\
  \ reduction in the shoot-to-root ratio relative to the wild-type control."
            answer: true
            explanation: "[FIGURE-1] panels A-D show both the GA-deficient and GA-insensitive dwarfed lines\
  \ with less shoot biomass, more root biomass, and a correspondingly lower shoot/root\
  \ ratio than wild type."
          - letter: "B"
            text: "The most severely dwarfed plants have more, as well as longer, lateral roots than\
  \ the wild-type control."
            answer: true
            explanation: "The in vitro root-development panels of [FIGURE-1] (E-J) show the most severely dwarfed\
  \ transgenic events with both a greater number and greater length of lateral roots\
  \ compared to wild type."
          - letter: "C"
            text: "The degree of dwarfism in both GA-insensitive and GA-deficient lines is positively\
  \ correlated with the extent of primary and lateral root formation and elongation."
            answer: false
            explanation: "The root-development panels of [FIGURE-1] show that primary root elongation does\
  \ not track the severity of dwarfism the way lateral root formation does, so the\
  \ correlation claimed for primary root elongation specifically does not hold."
          - letter: "D"
            text: "In poplar plants, gibberellins negatively affect lateral root formation, and there\
  \ may be an interaction between gibberellins and auxin that regulates lateral root\
  \ formation."
            answer: true
            explanation: "Both GA-deficient and GA-insensitive lines, which have reduced GA signaling, show\
  \ increased lateral root formation, indicating GA normally suppresses it, and Table\
  \ Q.67 shows IAA levels also rising in these same lines, consistent with GA and\
  \ auxin interacting to regulate lateral root formation."

      - id: q18
        number: "Q68"
        name: "Hormonal Correlates of the Cucumber Super-Ovary Phenotype"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=25"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "A"
            text: "The corolla progression between stages was much delayed in the super ovary"
            answer: true
            explanation: "[FIGURE-1] shows corolla opening completed by about day 5 after labeling in the normal\
  \ ovary type but not until roughly day 9 in the super ovary type, a clear delay\
  \ in stage progression."
          - letter: "B"
            text: "The ovary at anthesis was on average much longer in the super ovary than the normal\
  \ ovary, while at the same time courses after labelling, fruit length was not different\
  \ between two types."
            answer: true
            explanation: "[FIGURE-1] shows ovary length at anthesis clearly greater in the super ovary type,\
  \ yet when fruit length is compared at matching days after labeling the two ovary\
  \ types track each other closely, so the anthesis-stage difference does not carry\
  \ through to fruit length."
          - letter: "C"
            text: "Gibberellins were increased in the super ovary during the early stages of corolla\
  \ development, which corresponds to the enlarged corolla size."
            answer: true
            explanation: "The hormone panels of [FIGURE-1] show gibberellin (GA3/GA4) levels higher in the\
  \ super ovary type specifically during the green-yellow and yellow bud stages, coinciding\
  \ with the stages where its corolla is visibly enlarged."
          - letter: "D"
            text: "Cytokinins appear to be the primary regulator for the time of flower opening in cucumber,\
  \ whereas auxin is probably involved in the size control of corolla and fruit."
            answer: false
            explanation: "Although flower opening does track with differences in cytokinin concentration between\
  \ the two ovary types, [FIGURE-1] shows auxin levels are not actually different\
  \ between normal and super ovary types, so auxin's proposed role in the corolla/fruit\
  \ size difference is not supported by the data."

      - id: q19
        number: "Q69"
        name: "Localizing Drug Targets in the Parietal Cell Acid-Secretion Pathway"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=26"
        subjects:
          - name: "Digestive & Metabolic Physiology"
            link: "/resources/3-animal-physiology/digestive-metabolic-physiology/"
        statements:
          - letter: "A"
            text: "HCl was secreted by the parietal cells cultured in the medium containing Drug 1 and\
  \ Histamine."
            answer: true
            explanation: "The table shows Drug 1 blocks Ach-stimulated secretion (no HCl with Ach added) but\
  \ does not block Histamine's action, so Histamine added together with Drug 1 should\
  \ still trigger HCl secretion."
          - letter: "B"
            text: "Drug 2 blocked Gastrin receptors."
            answer: true
            explanation: "The table already shows Drug 1 acting on the Ach receptor and Drug 4 acting on the\
  \ H+/K+ ATPase, while Drug 3's row shows it does not block Gastrin (secretion still\
  \ occurs with Gastrin added), leaving Drug 2 as the one that must block the Gastrin\
  \ receptor."
          - letter: "C"
            text: "Drug 3 blocked Histamine 2 receptors."
            answer: true
            explanation: "With Drug 1 already assigned to the Ach receptor, Drug 4 to the H+/K+ ATPase, and\
  \ Drug 3 shown not blocking the Gastrin receptor (secretion still occurs with Gastrin\
  \ added under Drug 3), the only remaining pathway left for Drug 3 is the Histamine\
  \ 2 receptor."
          - letter: "D"
            text: "The parietal cells cultured in the medium containing Drug 4 and Ach had lower levels\
  \ of intracellular K+ than the cells cultured in the medium containing only Ach."
            answer: true
            explanation: "Drug 4 inactivates the H+/K+ ATPase, the pump that normally moves K+ into the parietal\
  \ cell as it exchanges it for H+, so blocking this pump reduces the inward K+ flow\
  \ and leaves intracellular K+ lower than in cells where Ach alone is stimulating\
  \ a fully functional pump."

      - id: q20
        number: "Q70"
        name: "4-1BB/4-1BBL Signaling in Atherosclerosis, Autoimmunity, and Graft Rejection"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=27"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Inhibition of 4-1BB expression diminishes the development of atherosclerosis."
            answer: true
            explanation: "Leukocyte infiltration into blood-vessel plaques drives atherosclerosis, and since\
  \ 4-1BB signaling boosts leukocyte activity and MCP-1-driven infiltration, blocking\
  \ 4-1BB expression reduces that infiltration and so limits plaque development."
          - letter: "B"
            text: "Activation of 4-1BB limits the effect of autoimmune diseases on the body."
            answer: false
            explanation: "Autoimmune disease results from an overactive T-cell response, and because 4-1BB\
  \ activation increases T-cell activity, activating this pathway would make autoimmune\
  \ effects worse rather than limiting them."
          - letter: "C"
            text: "All three kinds of cells, macrophages, dendritic cells and natural killer cells strongly\
  \ express 4-1BBL."
            answer: false
            explanation: "The professional antigen-presenting cells that strongly express 4-1BBL are macrophages,\
  \ dendritic cells, and B cells, not natural killer cells, so including natural killer\
  \ cells here is incorrect."
          - letter: "D"
            text: "Blocking the 4-1BB and 4-1BBL interaction increases graft tolerance."
            answer: true
            explanation: "Graft rejection depends on antigen-presenting cells activating T cells against the\
  \ graft, and since 4-1BB/4-1BBL signaling amplifies both antigen-presenting-cell\
  \ and T-cell activity, interrupting that interaction dampens this rejection response\
  \ and increases graft tolerance."

      - id: q21
        number: "Q71"
        name: "Reading Cardiac Action Potential Phases from Ion Movements"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=28"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "A substance that inhibits the reuptake of Ca2+ into the sarcoplasmic reticulum increases\
  \ the time interval from 3 to 4."
            answer: true
            explanation: "The interval from point 3 to point 4 in [FIGURE-1] is the plateau phase, which is\
  \ sustained by Ca2+ remaining elevated in the cytosol; blocking Ca2+ reuptake into\
  \ the sarcoplasmic reticulum keeps cytosolic Ca2+ elevated longer and so prolongs\
  \ this plateau interval."
          - letter: "B"
            text: "The concentration of K+ in the sarcoplasm at position 2 is higher than that at position\
  \ 3."
            answer: true
            explanation: "Between points 2 and 3 in [FIGURE-1], voltage-gated K+ channels open and drive K+\
  \ out of the cell during the early partial repolarization, so intracellular K+ is\
  \ higher at point 2, before this efflux, than at point 3, after it."
          - letter: "C"
            text: "Injection of adrenaline decreases the time interval from 1 to 5."
            answer: true
            explanation: "Adrenaline raises heart rate by increasing the frequency of action potentials, which\
  \ is achieved by shortening the duration of each action potential, so the interval\
  \ from point 1 to point 5 in [FIGURE-1] becomes shorter."
          - letter: "D"
            text: "The height of action potential (from 1 to 2) is decreased when the sarcoplasmic level\
  \ of Na+ is higher than the normal level."
            answer: true
            explanation: "The steep rise from point 1 to point 2 in [FIGURE-1] is driven by Na+ flowing into\
  \ the cell down its electrochemical gradient; if intracellular Na+ starts out abnormally\
  \ high, that inward gradient is smaller, so less Na+ flows in and the resulting\
  \ depolarization (the height of the upstroke) is reduced."

      - id: q22
        number: "Q72"
        name: "Identifying PTH, Calcium, and Phosphate Curves After PTH-Secretion Blockade"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=29"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "If Line I shows the level of PTH, then Line II and Line III would likely be showing\
  \ the levels of Pi and Ca2+, respectively."
            answer: false
            explanation: "PTH raises plasma Ca2+ (by increasing intestinal absorption, bone release, and renal\
  \ reabsorption of Ca2+) while lowering plasma Pi (by increasing its renal excretion),\
  \ so if Line I is PTH, the curve that falls together with it after the inhibitor\
  \ is injected should be Ca2+ (Line II), and the curve that rises should be Pi (Line\
  \ III), the reverse assignment given in this statement."
          - letter: "B"
            text: "PTH knock-out mice would have higher Pi levels in their urine compared with the wild\
  \ type mice on the same diet."
            answer: false
            explanation: "PTH normally increases Pi excretion into the urine, so an animal lacking PTH altogether\
  \ would excrete less, not more, Pi in its urine compared with a wild-type animal\
  \ that still has PTH's phosphaturic effect."
          - letter: "C"
            text: "Eating a calcium-rich diet decreases the plasma level of vitamin D (active form)\
  \ in healthy people."
            answer: true
            explanation: "A calcium-rich meal raises plasma Ca2+, which through negative feedback suppresses\
  \ PTH secretion, and since PTH is what stimulates the activation of vitamin D to\
  \ its active form, less PTH means less active vitamin D is produced."
          - letter: "D"
            text: "People with calcium-sensing receptor suppression have higher levels of plasma Ca2+\
  \ compared with healthy people on the same diet."
            answer: true
            explanation: "The calcium-sensing receptor on parathyroid cells is what normally detects rising\
  \ plasma Ca2+ and suppresses further PTH release; if that receptor is suppressed,\
  \ this brake on PTH secretion is lost, so PTH (and consequently plasma Ca2+) rises\
  \ higher than normal."

      - id: q23
        number: "Q73"
        name: "Regional Blood Flow Redistribution During Strenuous Exercise"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=30"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "At rest, ATP of the cells of part I comes mainly from oxidation of fatty acid."
            answer: true
            explanation: "The blood flow to part I rises sharply during exercise while part IV's falls sharply,\
  \ the pattern expected of cardiac muscle (part I) and intestines (part IV); resting\
  \ cardiac muscle indeed derives roughly 60% of its ATP from fatty-acid oxidation,\
  \ more than from any other single fuel."
          - letter: "B"
            text: "The activity of insulin receptors in the cells of part II is increased during exercise,\
  \ enhancing glucose uptake."
            answer: false
            explanation: "Part II's blood flow stays constant at rest and during exercise, matching the brain,\
  \ whose glucose-uptake mechanism does not rely on insulin signaling, so insulin\
  \ receptor activity there is not what increases glucose uptake during exercise."
          - letter: "C"
            text: "The increase in blood flow to part III during exercise helps to regulate the body\
  \ temperature."
            answer: true
            explanation: "Part III shows an intermediate rise in flow during exercise consistent with skin,\
  \ where increased blood flow carries heat to the body surface for dissipation, helping\
  \ regulate body temperature during exertion."
          - letter: "D"
            text: "Epinephrine decreases blood flow to part IV via β-receptor."
            answer: false
            explanation: "Part IV's sharp fall in flow during exercise fits the intestines, and epinephrine\
  \ reduces intestinal blood flow through vasoconstricting α-receptors, not β-receptors,\
  \ so the receptor type named in this statement is wrong."

      - id: q24
        number: "Q74"
        name: "Compensatory Cardiovascular Responses to Acute Hemorrhage"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=31"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "Oxygen affinity of hemoglobin in peripheral tissues was increased."
            answer: false
            explanation: "Blood loss triggers red blood cells to raise their 2,3-BPG production, which lowers\
  \ rather than raises hemoglobin's oxygen affinity in peripheral tissues, helping\
  \ hemoglobin release more of its bound oxygen where it is needed."
          - letter: "B"
            text: "Total peripheral resistance was increased."
            answer: true
            explanation: "The drop in blood pressure from blood loss activates the sympathetic nervous system,\
  \ which constricts peripheral blood vessels and thereby raises total peripheral\
  \ resistance to help maintain arterial pressure."
          - letter: "C"
            text: "Hyperpolarization occurred in the cells of the sinoatrial node."
            answer: false
            explanation: "The sympathetic surge triggered by hemorrhage releases norepinephrine onto the sinoatrial\
  \ node, which depolarizes (not hyperpolarizes) its cells to speed up heart rate\
  \ as part of the compensatory response."
          - letter: "D"
            text: "Vasoconstriction occurred in the brain and in the coronary arteries."
            answer: false
            explanation: "The brain and heart are protected as vital organs during hemorrhage, so the compensatory\
  \ vasoconstriction is directed at other vascular beds (like skin and intestines)\
  \ while blood flow to the brain and coronary arteries is preserved rather than constricted."

      - id: q25
        number: "Q75"
        name: "Distinguishing Obstructive and Restrictive Patterns on a Flow-Volume Loop"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=32"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "A"
            text: "The blood pH of a patient with Type 1 is higher than that of healthy people."
            answer: false
            explanation: "[FIGURE-1] shows the Type 1 loop with markedly reduced forced expiratory flow, an\
  \ obstructive pattern that traps CO2 in the lungs, and elevated CO2 lowers, rather\
  \ than raises, blood pH relative to healthy people."
          - letter: "B"
            text: "The time of the forced inhalation of patient with Type 2 is shorter than that of\
  \ healthy people."
            answer: false
            explanation: "The Type 2 loop in [FIGURE-1] shows a reduced inspiratory flow rate, and moving the\
  \ same inspired volume at a slower flow rate takes longer, not less time, than in\
  \ healthy people."
          - letter: "C"
            text: "A patient with Type 3 displays a higher breathing rate than healthy people."
            answer: true
            explanation: "The Type 3 loop in [FIGURE-1] shows both reduced airflow and reduced lung volume,\
  \ a combined pattern that limits how much air can be moved per breath, so the patient\
  \ compensates by breathing more frequently, giving a higher breathing rate."
          - letter: "D"
            text: "Residual volume in a patient with Type 4 is higher than that of healthy people."
            answer: true
            explanation: "The Type 4 loop in [FIGURE-1] shows limited airflow during both inspiration and expiration,\
  \ and this inability to fully empty the lungs on expiration leaves more air trapped\
  \ at the end of exhalation, raising residual volume above the healthy value."

      - id: q26
        number: "Q76"
        name: "Temporal and Spatial Summation at a Postsynaptic Neuron"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=33"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "Action potentials could be generated in neuron X if nerve terminal c is stimulated\
  \ rapidly."
            answer: true
            explanation: "Rapid, repeated stimulation of a single terminal like c allows its excitatory postsynaptic\
  \ potentials to summate temporally, and if this summation pushes neuron X's membrane\
  \ potential past threshold (as recorded in [FIGURE-1]), an action potential can\
  \ result."
          - letter: "B"
            text: "When three nerve terminals a, c and d are stimulated simultaneously, the postsynaptic\
  \ potentials recorded in neuron X are smaller than those when the nerve terminals\
  \ c and d are stimulated simultaneously."
            answer: true
            explanation: "Terminal a acts on neuron Y and only reaches neuron X indirectly through terminal\
  \ b, which is inhibitory to X, so adding a to the c+d stimulation recruits this\
  \ inhibitory input and reduces the postsynaptic potential in neuron X compared with\
  \ stimulating the purely excitatory c and d together, which instead sum via spatial\
  \ summation."
          - letter: "C"
            text: "Nerve terminal a releases inhibitory neurotransmitter and nerve terminal b releases\
  \ excitatory neurotransmitter."
            answer: false
            explanation: "Terminal a excites neuron Y, generating the action potential recorded in [FIGURE-1]C,\
  \ and neuron Y's output in turn drives terminal b to release an inhibitory neurotransmitter\
  \ onto neuron X, so the roles in this statement are swapped."
          - letter: "D"
            text: "In the mammalian body, there are many neurons like neurons Z, Y, X. Neurons Z, Y,\
  \ X are sensory neurons, Renshaw cells (inhibitory neurons) and motor neurons, respectively.\
  \ If a substance (e.g., Strychnine) injected in the body blocks glycine receptors,\
  \ diaphragm contracts fully and remains contracted."
            answer: true
            explanation: "Renshaw cells normally use glycine to inhibit motor neurons and prevent excessive\
  \ contraction; strychnine blocks glycine receptors and removes this inhibitory brake,\
  \ so motor neurons (including those to the diaphragm) fire unchecked and the diaphragm\
  \ contracts fully and stays contracted."

      - id: q27
        number: "Q77"
        name: "Tracing Endocrine Feedback Loops with Sensitivity-Altering Drugs"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=34"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "The group of rats injected with the drug that reduces the sensitivity of hypothalamus\
  \ to cortisol resulted in higher plasma levels of both glucose and insulin than\
  \ those in the group of rats injected with the drug that reduces the sensitivity\
  \ of adrenocorticotropic hormone (ACTH) receptors."
            answer: true
            explanation: "Reducing hypothalamic sensitivity to cortisol weakens negative feedback, so CRH,\
  \ ACTH, and ultimately cortisol secretion all rise, raising plasma glucose and,\
  \ through that, insulin; reducing ACTH receptor sensitivity instead shrinks the\
  \ adrenal response and lowers cortisol and glucose, so the first group ends up with\
  \ the higher glucose and insulin levels."
          - letter: "B"
            text: "The group of rats injected with the drug that increases the sensitivity of hypothalamus\
  \ to thyroxine resulted in higher metabolic rate and body temperature than those\
  \ in the group of rats injected with the drug that increases the sensitivity of\
  \ target cells to thyrotropin-releasing hormone (TRH)."
            answer: false
            explanation: "Increased hypothalamic sensitivity to thyroxine strengthens negative feedback and\
  \ lowers TRH, TSH, and thyroxine output, reducing metabolic rate and temperature,\
  \ while increased target-cell sensitivity to TRH raises TSH and thyroxine output\
  \ and increases metabolic rate and temperature, so the comparison in this statement\
  \ is reversed."
          - letter: "C"
            text: "The group of rats injected with propylthiouracil (which blocks thyroid hormone synthesis)\
  \ resulted in smaller thyroid gland and body weight than those in the group of rats\
  \ injected with placebo."
            answer: false
            explanation: "Blocking thyroid hormone synthesis removes negative feedback on the pituitary, driving\
  \ TSH up and causing the thyroid gland to enlarge (goiter) rather than shrink, while\
  \ low thyroxine slows metabolism and tends to increase, not decrease, body weight\
  \ relative to placebo."
          - letter: "D"
            text: "The group of rats injected with thyroid stimulating hormone (TSH) had smaller pituitary\
  \ gland and bigger adrenal glands compared with the group of rats injected with\
  \ corticotrophin-releasing hormone (CRH)."
            answer: false
            explanation: "Exogenous TSH raises thyroxine, which suppresses TRH and shrinks the pituitary but\
  \ leaves the adrenal gland unaffected, whereas exogenous CRH raises ACTH and enlarges\
  \ the pituitary while also stimulating the adrenal gland to grow, so it is the CRH\
  \ group, not the TSH group, that should show the smaller pituitary and this statement's\
  \ comparison does not hold."

      - id: q28
        number: "Q78"
        name: "Cortisol and 2-AG Dynamics During Motion-Sickness-Inducing Flight"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=35"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "A 2-AG inhibitor can be used to reduce motion sickness."
            answer: false
            explanation: "[FIGURE-1] shows 2-AG levels are already lower in the motion-sickness group than\
  \ in the no-sickness group, so further inhibiting 2-AG would push it even lower\
  \ rather than correct the deficit, meaning a 2-AG inhibitor would not be an appropriate\
  \ treatment for motion sickness."
          - letter: "B"
            text: "In motion sickness group, the blood glucose level at T4 was higher than at T1."
            answer: true
            explanation: "[FIGURE-1] shows saliva cortisol in the motion-sickness group higher at T4 than at\
  \ T1, and since cortisol stimulates hepatic gluconeogenesis, this rise in cortisol\
  \ between T1 and T4 is expected to raise blood glucose correspondingly."
          - letter: "C"
            text: "At T2, the blood ACTH (adrenocorticotropic hormone) level in the no sickness group\
  \ was higher than that in the motion sickness group."
            answer: false
            explanation: "[FIGURE-1] shows saliva cortisol at T2 lower in the no-sickness group than in the\
  \ motion-sickness group, and since ACTH drives cortisol secretion, the lower cortisol\
  \ implies lower, not higher, ACTH in the no-sickness group at that time point."
          - letter: "D"
            text: "In motion sickness group, the blood CRH (corticotropin-releasing hormone) level at\
  \ T5 was lower than that at T2."
            answer: true
            explanation: "[FIGURE-1] shows the motion-sickness group's saliva cortisol rising from T1 to T4\
  \ and then falling back toward baseline by T5, and since CRH sits upstream in the\
  \ axis driving this cortisol pattern, its level at T5 should likewise be lower than\
  \ at T2, when cortisol secretion was still elevated."

      - id: q29
        number: "Q79"
        name: "Physiological Adaptation to High-Altitude Hypoxia"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=36"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "A"
            text: "The moment the person arrives at the high altitude, oxyhemoglobin dissociation curve\
  \ shifts to the left (indicating greater affinity of hemoglobin for oxygen)."
            answer: true
            explanation: "The immediate response to high altitude is increased ventilation, which lowers blood\
  \ CO2 and causes respiratory alkalosis; the resulting rise in blood pH shifts the\
  \ oxyhemoglobin curve to the left (the Bohr effect acting in reverse) even before\
  \ the antagonistic rise in 2,3-DPG has time to develop."
          - letter: "B"
            text: "After several days living at the high altitude, the person's blood viscosity is decreased,\
  \ enabling his blood to deliver more oxygen to his tissues."
            answer: false
            explanation: "Low oxygen at altitude stimulates increased red blood cell production over the following\
  \ days, and more red cells makes the blood thicker, raising blood viscosity (and\
  \ resistance to flow) rather than decreasing it."
          - letter: "C"
            text: "After several weeks living at the high altitude, the person's lung cells of this\
  \ person produce more nitric oxide (NO)."
            answer: true
            explanation: "People chronically exposed to high-altitude hypoxia are known to have elevated NO\
  \ production in their lungs and blood, and since NO is a vasodilator, this rise\
  \ helps offset the vasoconstricting effect of low oxygen on the pulmonary vasculature."
          - letter: "D"
            text: "Many people who ascend rapidly to high altitude experience some degree of acute mountain\
  \ sickness (e.g., headache, malaise, and nausea). Which may be treated with a drug\
  \ that causes bicarbonate to be excreted in the urine."
            answer: true
            explanation: "Rapid ascent to altitude triggers hyperventilation-driven respiratory alkalosis,\
  \ which contributes to acute mountain sickness, so a drug that promotes urinary\
  \ bicarbonate loss produces a compensating metabolic acidosis that offsets this\
  \ alkalosis and helps relieve the symptoms."

      - id: q30
        number: "Q80"
        name: "Species Differences in Oxygen Dissociation and the Bohr Effect"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=37"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "A"
            text: "While comparing curve I of species a with curve I of species b, you can predict that\
  \ the O2 concentration of the blood in the lungs of species a will be higher than\
  \ that of species b."
            answer: false
            explanation: "At the lung PO2 of 100 mm Hg on curve I, [FIGURE-1] shows species b's blood O2 concentration\
  \ (around 220 mL/L) is higher than species a's (around 120 mL/L), the opposite of\
  \ what this statement claims."
          - letter: "B"
            text: "If you expose deoxygenated blood of the two species at the same level of PCO2 to\
  \ increasing PO2, the first blood to become saturated with O2 would be that of species\
  \ a."
            answer: true
            explanation: "At the tissue PO2 of 40 mm Hg, species a's blood already holds a higher fraction\
  \ of its maximum O2-carrying capacity (closer to full saturation) than species b's\
  \ does, so as PO2 rises species a's blood reaches full saturation first."
          - letter: "C"
            text: "In species b, if curves I and II represent the PCO2 of oxygenated and deoxygenated\
  \ blood, respectively, there will be less than 160 mL of O2 released from a litre\
  \ of blood as it passes through the tissues."
            answer: false
            explanation: "Reading curve I at the lung PO2 of 100 mm Hg (about 220 mL O2/L) and curve II at\
  \ the tissue PO2 of 40 mm Hg (about 40 mL O2/L) for species b gives a difference\
  \ of roughly 180 mL O2 released per litre, which is more than the 160 mL this statement\
  \ proposes."
          - letter: "D"
            text: "In species a, an increase in PCO2 in the blood reduces the affinity of hemoglobin\
  \ for oxygen but has no effect on the maximum oxygen-carrying capacity in the blood."
            answer: true
            explanation: "Raising PCO2 shifts species a's dissociation curve toward the right (the Bohr effect),\
  \ lowering hemoglobin's oxygen affinity, while [FIGURE-1] shows the curves for normal\
  \ and elevated PCO2 converging to the same plateau value at high PO2, meaning the\
  \ maximum O2-carrying capacity is unchanged."

      - id: q31
        number: "Q81"
        name: "Clutch-Size Manipulation and Optimal Brood Size in Magpies"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=38"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "A"
            text: "The birds, in general, did better with experimentally manipulated, larger broods."
            answer: false
            explanation: "[FIGURE-1] shows the number of young fledged peaking at a different experimental\
  \ brood size for each initial-clutch-size category rather than simply rising with\
  \ brood size across the board, so birds did not uniformly do better with larger\
  \ manipulated broods."
          - letter: "B"
            text: "The reproductive rate of birds is closest to that which maximises individual breeding\
  \ success."
            answer: true
            explanation: "[FIGURE-1] shows fledging success peaking close to each bird's own original (unmanipulated)\
  \ clutch size, which is exactly what would be expected if natural clutch sizes already\
  \ track the brood size that maximises an individual's breeding success."
          - letter: "C"
            text: "Birds in high quality territory tend to have larger clutches."
            answer: true
            explanation: "Since food abundance and territory quality are described as being linked to clutch\
  \ size, and birds that can support more offspring would be expected to lay larger\
  \ initial clutches, this pattern follows directly from the stem's description of\
  \ the system."
          - letter: "D"
            text: "Experimentally-manipulated clutches experience higher starvation."
            answer: true
            explanation: "The stem states predation is lower in larger clutches, so when a brood is experimentally\
  \ enlarged beyond the parents' optimum and fledging success drops off, that extra\
  \ mortality in the oversized brood is better explained by starvation from insufficient\
  \ food than by predation."

      - id: q32
        number: "Q82"
        name: "Female Choice and Interspecific Hood-Burrow Sharing in Fiddler Crabs"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=39"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "A"
            text: "Females of both species approached a greater proportion of the conspecific males\
  \ than the heterospecific males they encountered."
            answer: true
            explanation: "[FIGURE-1]A shows U. latimanus females never approaching heterospecific males at\
  \ all, and U. musica females approaching mostly conspecific males, so both species\
  \ show a stronger preference for approaching males of their own species."
          - letter: "B"
            text: "Attraction of U. musica females to hoods is not as strong as that of U. latimanus\
  \ females."
            answer: true
            explanation: "[FIGURE-1]B shows U. latimanus females approaching significantly more hooded than\
  \ unhooded burrows, whereas U. musica females approach hooded and unhooded burrows\
  \ in roughly equal numbers, indicating a weaker pull toward hoods in U. musica."
          - letter: "C"
            text: "A male fiddler crab's willingness to court all females, regardless of species, is\
  \ made used of by females of both species for shelter-seeking and avoidance of predators."
            answer: false
            explanation: "Only U. musica females are shown taking advantage of resident males' indiscriminate\
  \ courtship to gain shelter and avoid predators; U. latimanus females do not exploit\
  \ heterospecific males this way, so the behavior described applies to just one of\
  \ the two species, not both."
          - letter: "D"
            text: "An overlap in habitat use between these two similar-sized fiddler crabs has no impact\
  \ on both signalers and receivers."
            answer: false
            explanation: "The overlap clearly affects both signalers (U. latimanus males end up being visited\
  \ by U. musica females) and receivers (U. musica females use U. latimanus burrows\
  \ for refuge), and the extra heterospecific activity also adds visual noise that\
  \ can complicate mate recognition, so the overlap does have an impact on both roles."

      - id: q33
        number: "Q83"
        name: "Frequency-Dependent Predation and the Maintenance of Moth Wing-Pattern Polymorphism"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=40"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "A"
            text: "Morph 1 was the most cryptic morph."
            answer: true
            explanation: "[FIGURE-2]B shows morph 1 with the lowest detectability score of the three morphs,\
  \ meaning it was found by the blue jays least often, which is exactly what the most\
  \ cryptically-patterned morph would be expected to show."
          - letter: "B"
            text: "Relative numbers that escaped detection determine the abundance of each prey type."
            answer: true
            explanation: "A moth morph that is not detected by the predator survives and continues reproducing,\
  \ so the morph population trajectories in [FIGURE-2]A track directly from how frequently\
  \ each morph escaped the jays' detection in [FIGURE-2]B."
          - letter: "C"
            text: "Preferential feeding behavior of the blue-jays of the most prevalent morph maximizes\
  \ their foraging success."
            answer: false
            explanation: "The blue jays' preference in this experiment tracks which morph is most conspicuous/easily\
  \ detected rather than which one is currently most abundant, so nothing in the data\
  \ supports the claim that jays preferentially target the most common morph to maximize\
  \ foraging success."
          - letter: "D"
            text: "Polymorphisms are maintained in the population through frequency-dependent selection\
  \ by predators."
            answer: true
            explanation: "As each morph becomes more common it is encountered (and eaten) by the jays more\
  \ often, giving rarer morphs a survival advantage; this apostatic, frequency-dependent\
  \ predation is what keeps all three wing-pattern morphs persisting in the population\
  \ rather than one morph replacing the others."

      - id: q34
        number: "Q84"
        name: "Mapping Linked Genes from a Four-Gene Testcross"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=42"
        subjects:
          - name: "Linkage, Recombination & Genetic Mapping"
            link: "/resources/7-genetics/linkage-recombination-genetic-mapping/"
        statements:
          - letter: "A"
            text: "The four loci are genetically linked."
            answer: false
            explanation: "Genes B, C, and D show the classic pattern of linkage (a small set of dominant, recombinant,\
  \ and double-recombinant classes), but gene A's alleles are inherited in a 1:1 ratio\
  \ independently of the B/C/D classes, so A is not linked to the other three."
          - letter: "B"
            text: "The distance between gene B and gene D is 9 cM."
            answer: false
            explanation: "Adding up all the offspring classes that are recombinant between B and D (83+74+73+84+86+73+71+87)\
  \ and dividing by the 3288 total gives about 19% recombination, i.e. roughly 19\
  \ map units, not 9 cM."
          - letter: "C"
            text: "The distance between gene D and gene C is 10.5 cM."
            answer: true
            explanation: "Summing the offspring classes that are recombinant between C and D (87+1+1+86+84+1+1+83)\
  \ and dividing by 3288 gives about 10.5% recombination, matching the 10.5 cM distance\
  \ in this statement."
          - letter: "D"
            text: "Interference happened with a value less than 0.25. Interference = 1-(observed frequency\
  \ of double crossover/expected frequency of double crossover)."
            answer: false
            explanation: "The rare double-recombinant class (ABcD/abCd, 1+1+1+1 individuals) occurs far less\
  \ often than the roughly 0.09 x 0.105 frequency expected if the two crossover regions\
  \ were independent, giving an interference value of about 0.89, well above the 0.25\
  \ ceiling this statement proposes."

      - id: q35
        number: "Q85"
        name: "Complementation Analysis of Three White-Flowered Mutant Lines"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=43"
        subjects:
          - name: "Gene Interactions: Epistasis & Complementation Analysis"
            link: "/resources/7-genetics/epistasis-gene-interactions-complementation/"
        statements:
          - letter: "A"
            text: "Line (a) has only one homozygous mutated gene."
            answer: false
            explanation: "Working through the complementation crosses shows line a must be homozygous mutant\
  \ at two of the three genes (genotype aaBBcc in a three-gene, lower-case-mutant\
  \ notation), not just one, so this statement understates the number of mutated genes\
  \ in line a."
          - letter: "B"
            text: "Line (b) shares two homozygous mutated genes with line c."
            answer: false
            explanation: "Cross 3 (line b x line c, all white) shows the two lines fail to complement at only\
  \ one shared gene, not two, since line b and line c otherwise differ at the other\
  \ genes affecting flower color."
          - letter: "C"
            text: "Line (c) shares one homozygous mutated gene with line a."
            answer: false
            explanation: "Cross 2 (line a x line c) produces all-red F1 offspring, meaning lines a and c fully\
  \ complement each other and restore the wild-type red phenotype, which is only possible\
  \ if they do not share any of the same mutated gene."
          - letter: "D"
            text: "Line (b) has three homozygous mutated genes."
            answer: true
            explanation: "Cross 5 (red F1 from cross 2 x line b) segregates into a 1:7 red-to-white ratio,\
  \ the signature ratio of three independently segregating genes needed to restore\
  \ red, which requires line b to be homozygous mutant at all three of the genes involved."

      - id: q36
        number: "Q86"
        name: "Applying Mutation-Selection and Heterozygote-Advantage Models to a Recessive Lethal Allele"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=44"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "A completely recessive allele is lethal when homozygous. If the dominant allele mutates\
  \ to the recessive allele at a rate of 10-6, then the frequency of the lethal allele\
  \ when the population reaches mutation-selection equilibrium is 0.001."
            answer: true
            explanation: "At mutation-selection equilibrium for a fully recessive lethal allele the frequency\
  \ is q = sqrt(u/s); with a full selection coefficient (s = 1, since it is lethal)\
  \ and mutation rate u = 10^-6, this gives q = sqrt(10^-6) = 0.001, matching the\
  \ value in the statement."
          - letter: "B"
            text: "If the frequency of a completely recessive lethal allele is 0.2 and it remains unchanged\
  \ from generation to generation due to the superior fitness of heterozygotes, then\
  \ the intensity of selection against the dominant homozygotes should be 0.025."
            answer: false
            explanation: "At the balance point between a lethal recessive homozygote (s=1) and a less-fit dominant\
  \ homozygote (selection coefficient t), the equilibrium frequency is q = s/(s+t);\
  \ solving with q=0.2 and s=1 gives t = 0.25, not 0.025 as this statement claims."
          - letter: "C"
            text: "Selection for recessive alleles is less effective than selection against recessive\
  \ alleles."
            answer: false
            explanation: "Because a rare recessive allele is mostly hidden in heterozygotes and only exposed\
  \ to selection in the rare homozygotes, selection against the recessive allele is\
  \ actually the slower, less effective process, while selecting against the dominant\
  \ phenotype (which exposes every copy of the recessive allele hiding in heterozygotes\
  \ once it becomes common) removes recessive alleles faster, the opposite ranking\
  \ from what this statement claims."
          - letter: "D"
            text: "In a large, randomly mating population, the frequency of an autosomal recessive lethal\
  \ allele is 0.2. The frequency of this allele in the next generation will be 0.07\
  \ if the lethality takes place before reproduction."
            answer: false
            explanation: "Using the standard change-in-frequency formula for selection against a recessive\
  \ lethal, Δq = -sq²(1-q)/(1-sq²) with s=1 and q=0.2 gives a decrease of about 0.033,\
  \ so the next generation's frequency is about 0.2 - 0.033 ≈ 0.167, not 0.07."

      - id: q37
        number: "Q87"
        name: "Genetic Mechanisms Behind Inherited and Sporadic Cancers"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=45"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "A particular type of colon cancer can be caused by recessive alleles even though\
  \ its inheritable pattern appears similar to that of a dominant trait."
            answer: true
            explanation: "A patient inherits one defective tumor-suppressor allele and is otherwise heterozygous\
  \ (and healthy) in every cell, but because so many colon cells carry that heterozygous\
  \ genotype, the chance that at least one cell will suffer a second, somatic hit\
  \ disabling the remaining functional allele is very high, so the disease appears\
  \ to be passed on like a dominant trait even though the causative allele itself\
  \ is recessive at the cellular level."
          - letter: "B"
            text: "In one patient, normal cells have only one mutated p53 allele but cancer cells have\
  \ two identical mutated p53 alleles. Then it can be concluded that the second mutated\
  \ p53 allele is formed by gene conversion."
            answer: true
            explanation: "Ending up with two copies of the exact same mutant p53 sequence, rather than a new\
  \ independent mutation on the other allele, is consistent with the wild-type allele\
  \ being degraded and resynthesized using the mutant allele as a template, i.e. gene\
  \ conversion."
          - letter: "C"
            text: "Some cancers have been effectively treated with drugs that cause demethylation. Then\
  \ it can be concluded that genes causing those cancers are more likely to be oncogenes."
            answer: false
            explanation: "A demethylating drug reactivates genes that had been silenced by methylation, and\
  \ reactivating a silenced gene to treat the cancer implies the silenced gene was\
  \ protective, i.e. a tumor-suppressor gene being restored, rather than an oncogene,\
  \ which promotes cancer when overactive, not when reactivated."
          - letter: "D"
            text: "Chromosome inversions can produce novel oncogenes."
            answer: true
            explanation: "An inversion can juxtapose parts of two different genes that are not normally adjacent,\
  \ creating a novel fusion gene, and if that fusion product drives uncontrolled cell\
  \ proliferation it functions as a new oncogene."

      - id: q38
        number: "Q88"
        name: "Chromosome Size, Gene Density, and Embryonic Lethality in Mouse Trisomies"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=46"
        subjects:
          - name: "Chromosomal Variation: Number & Structure"
            link: "/resources/7-genetics/chromosomal-variation-number-structure/"
        statements:
          - letter: "A"
            text: "Chromosome 19 likely encodes fewer transcripts than other chromosomes shown in the\
  \ graph."
            answer: true
            explanation: "[FIGURE-1] shows trisomy of chromosome 19 surviving longer into development than\
  \ trisomy of any other chromosome, meaning its extra copy is the least harmful dosage-wise,\
  \ consistent with it carrying comparatively few transcribed genes."
          - letter: "B"
            text: "The total amount of genetic material of the additional chromosome solely determines\
  \ the severity of the defects associated with the chromosome imbalance."
            answer: false
            explanation: "[FIGURE-1] shows trisomies of chromosomes 1, 6, and 10, despite being different sizes,\
  \ all cause embryonic death at about the same day, showing that the sheer amount\
  \ of extra DNA is not what solely determines lethality timing."
          - letter: "C"
            text: "Assuming that genes on chromosome 1 and 10 have similar contribution to embryo development,\
  \ gene density on chromosome 1 is probably lower than that on chromosome 10."
            answer: true
            explanation: "Chromosome 1 is the largest mouse chromosome yet its trisomy causes lethality at\
  \ the same time as the much smaller chromosome 10's trisomy, so for a comparable\
  \ dosage effect chromosome 1 must be packing proportionally fewer genes per unit\
  \ length, i.e. a lower gene density."
          - letter: "D"
            text: "Genes on chromosomes 12 are probably more important for embryo development than those\
  \ on chromosome 13."
            answer: true
            explanation: "Chromosomes 12 and 13 are similar in size in [FIGURE-1], yet trisomy of chromosome\
  \ 12 causes earlier embryonic death than trisomy of chromosome 13, suggesting the\
  \ extra dose of chromosome 12's genes is more disruptive, i.e. those genes matter\
  \ more for normal embryonic development."

      - id: q39
        number: "Q89"
        name: "Functional Consequences of mRNA Circularization"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=47"
        subjects:
          - name: "Translation & the Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
        statements:
          - letter: "A"
            text: "Circularization is due to a phosphodiester bond between the 5'end and the 3'end of\
  \ mRNA."
            answer: false
            explanation: "The mRNA loop is held together by protein-protein bridging, not a direct chemical\
  \ bond between the two ends: cap-binding proteins at the 5' end interact with poly(A)-binding\
  \ proteins at the 3' end, pulling the ends of the same molecule together without\
  \ ever forming a phosphodiester linkage between them."
          - letter: "B"
            text: "Circularization increases stability of mRNAs."
            answer: true
            explanation: "By linking the 5' cap and 3' poly(A) tail through interacting proteins, the closed-loop\
  \ structure protects both ends from exonuclease attack, which is one of the reasons\
  \ circularized mRNAs are more stable in the cytoplasm."
          - letter: "C"
            text: "Circularization enhances translocation speed of the ribosomes."
            answer: false
            explanation: "The 5'-3' end interaction speeds up formation of the translation-initiation complex\
  \ and so increases how often ribosomes start translating the message, but it does\
  \ not change the rate at which an individual ribosome physically moves along the\
  \ mRNA once translation has begun."
          - letter: "D"
            text: "Controlling circularization is a mechanism of post-transcriptional regulation."
            answer: true
            explanation: "Since circularization efficiency affects how readily an mRNA is translated and how\
  \ long it persists, regulating the proteins that mediate this cap-to-tail interaction\
  \ is itself a way of controlling gene expression after the mRNA has already been\
  \ transcribed."

      - id: q40
        number: "Q90"
        name: "Reading Mode of Inheritance from Four Pedigrees"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=48"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "The disorder in pedigree 1 is most likely caused by a recessive allele."
            answer: false
            explanation: "Fitting an autosomal recessive model to pedigree 1 would require several unrelated\
  \ individuals to be heterozygous carriers, which is implausible for a rare disorder,\
  \ whereas a dominant allele explains the pattern of affected individuals in [FIGURE-1]\
  \ without requiring so many coincidental carriers, so a dominant allele is the more\
  \ likely cause."
          - letter: "B"
            text: "Person III2 and III7 in pedigree 2 have the same genotype."
            answer: false
            explanation: "Both individuals in pedigree 2 are homozygous recessive at the disease locus, yet\
  \ none of their children together are affected, which is only possible if the two\
  \ are actually homozygous recessive at different genes that complement each other,\
  \ meaning their genotypes are not the same."
          - letter: "C"
            text: "Pedigree 3 shows the inheritance of the disorder can be caused by a recessive allele\
  \ on X-chromosome."
            answer: true
            explanation: "The affected-individual pattern in pedigree 3 of [FIGURE-1], skipping generations\
  \ and appearing predominantly in males whose mothers are unaffected carriers, fits\
  \ the classic transmission pattern of an X-linked recessive disorder."
          - letter: "D"
            text: "If the affected man and his unaffected wife in pedigree 4 have a son then the probability\
  \ of this son be affected is 0.125."
            answer: false
            explanation: "Tracing the X-linked recessive allele through the specific females in pedigree 4's\
  \ lineage down to this couple gives a chance of about 1/2 x 1/2 x 1/2 x 1/2 = 0.0625\
  \ that their son inherits the disease allele and is affected, not 0.125."

      - id: q41
        number: "Q91"
        name: "Using SNPs, Autosomal STRs, Y-STRs, and mtDNA to Reconstruct a Family"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=49"
        subjects:
          - name: "Extranuclear & Non-Mendelian Inheritance"
            link: "/resources/7-genetics/extranuclear-non-mendelian-inheritance/"
        statements:
          - letter: "A"
            text: "If the same number of SNPs or STRs are used, SNPs are better than STRs for distinguishing\
  \ individuals."
            answer: false
            explanation: "Because a SNP usually has only two possible alleles while an STR locus normally has\
  \ many more, an STR locus carries more distinguishing information per locus, so\
  \ for an equal number of markers STRs, not SNPs, are the better tool for telling\
  \ individuals apart."
          - letter: "B"
            text: "Ind_6 is more likely a child of Ind_2 and Ind_5 than Ind_3 is."
            answer: false
            explanation: "Ind_3 can inherit its autosomal markers from Ind_2 and Ind_5 and additionally matches\
  \ Ind_2's Y-STR haplotype and Ind_5's mtDNA haplotype, while Ind_6 fails to match\
  \ Ind_5's mtDNA haplotype, so Ind_3, not Ind_6, is the better-supported offspring\
  \ of that couple."
          - letter: "C"
            text: "Ind_4 is possibly a brother of Ind_6."
            answer: true
            explanation: "Ind_4 and Ind_6 share the same autosomal SNP and mtDNA genotypes, and their autosomal\
  \ STR alleles are each consistent with having come from a shared pair of parents,\
  \ so the two are compatible with being siblings."
          - letter: "D"
            text: "It is possible that Ind_7 is a granddaughter of Ind_1 and Ind_6."
            answer: true
            explanation: "Ind_7 does not need to inherit Ind_6's mtDNA haplotype directly, since she could\
  \ instead have inherited her autosomal markers from a father who is himself a son\
  \ of Ind_1 and Ind_6, making the granddaughter relationship genetically possible."

      - id: q42
        number: "Q92"
        name: "Deducing an X-Chromosome Deletion from an Unusual Drosophila Cross"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=50"
        subjects:
          - name: "Chromosomal Variation: Number & Structure"
            link: "/resources/7-genetics/chromosomal-variation-number-structure/"
        statements:
          - letter: "A"
            text: "X-rays converted a dominant allele (A) on the chromosome X, coding for wild type,\
  \ to a recessive allele (a)."
            answer: false
            explanation: "A recessive allele is not lethal on its own, so it cannot explain the missing category\
  \ of sons; a small X-ray-induced deletion removing the A locus altogether fits the\
  \ data (deleted-X sons die, since they would be hemizygous null), whereas a simple\
  \ allele conversion would not kill any males."
          - letter: "B"
            text: "X-rays produced a chromosomal translocation."
            answer: false
            explanation: "An individual heterozygous for a balanced translocation is generally viable, so a\
  \ translocation alone would not remove any offspring class the way is observed here;\
  \ a deletion removing the A gene from one X better accounts for the missing male\
  \ class."
          - letter: "C"
            text: "A loop might be seen on one pair of chromosomes during prophase of meiosis 1 in the\
  \ mated F1 female."
            answer: true
            explanation: "When a deletion-bearing X chromosome pairs with a normal X during meiosis, the intact\
  \ homolog has to bow outward into a loop to align its extra segment opposite the\
  \ region missing from its deleted partner, a configuration that would be visible\
  \ during prophase I."
          - letter: "D"
            text: "If a female from the second mating exhibiting recessive phenotype (a) was crossed\
  \ to a wild type male then her progenies compose of females and males at the ratio\
  \ of 2 females to 1 male."
            answer: true
            explanation: "This recessive female carries one deleted X and one X bearing allele a; crossed to\
  \ a wild-type male, the four resulting genotype classes reduce to a 2:1:1 ratio\
  \ of surviving females to viable sons, since sons who inherit the deleted X die,\
  \ giving an overall 2 females to 1 male ratio among survivors."

      - id: q43
        number: "Q93"
        name: "Determining Insert Size and Orientation by Restriction Mapping"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=51"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "The CDS is 2.6 kb in length and has an EcoRI recognition site at about 0.5 kb from\
  \ one of its ends."
            answer: true
            explanation: "Summing the digestion fragments in [FIGURE-1]B gives a total plasmid length of 5.6\
  \ kb; subtracting the empty vector's 3.0 kb leaves a 2.6 kb insert, and EcoRI cutting\
  \ the plasmid into three pieces (rather than the two expected from the vector's\
  \ own sites alone) places a third EcoRI site inside the CDS, about 0.5 kb from one\
  \ end based on the 0.5 kb and 2.1 kb insert-derived fragments."
          - letter: "B"
            text: "SpeI can be used to determine the orientation of the CDS."
            answer: false
            explanation: "Because the extra SpeI site inside the CDS sits roughly in its middle, cutting the\
  \ CDS into two nearly equal pieces, the resulting 1.3 kb and 4.3 kb fragments in\
  \ [FIGURE-1]B come out the same regardless of which way the CDS is inserted, so\
  \ SpeI digestion cannot distinguish the two orientations."
          - letter: "C"
            text: "The CDS is oriented in the same direction as lacZ."
            answer: false
            explanation: "A PstI site sits 36 bp upstream of the cloning site in the vector's lacZ direction,\
  \ and the CDS carries its own PstI site 0.8 kb upstream of its stop codon; the fragment\
  \ sizes from PstI digestion in [FIGURE-1]B (0.8 and 4.8 kb) only match if the CDS's\
  \ stop-codon end points toward the vector's own PstI site, meaning the CDS actually\
  \ runs in the reverse direction relative to lacZ, not the same direction."
          - letter: "D"
            text: "If plasmid pVN2016 is digested by both enzymes SpeI and EcoRI in Tango buffer (EcoRI\
  \ and SpeI cut at 100% and 20% efficiency, respectively), five fragments of 0.5,\
  \ 0.8, 1.3, 2.1 and 3.0 kb could be detected by gel electrophoresis assuming that\
  \ fragments smaller than 50 bp are not visible."
            answer: true
            explanation: "With EcoRI cutting essentially every molecule but SpeI cutting only about a fifth\
  \ of them, most plasmids end up cut only by EcoRI (giving the 0.5, 2.1, and 3.0\
  \ kb EcoRI fragments) while a minority are also cut by SpeI, splitting the 3.0 kb\
  \ piece further into 0.8 and (2.1+0.1 combined region contributing to) the smaller\
  \ pieces, so all five fragment sizes listed would appear together on the gel."

      - id: q44
        number: "Q94"
        name: "How Many DBH Categories Are Needed to Accurately Age a Tree?"
        link: "/papers/ibo/2016/theoretical-b-exam.pdf#page=52"
        subjects:
          - name: "Secondary Growth & Wood Anatomy"
            link: "/resources/6-plant-anatomy/secondary-growth-wood-anatomy/"
        statements:
          - letter: "A"
            text: "Using the smallest category gives the most accurate information of tree age of P.\
  \ kwangtungenesis."
            answer: true
            explanation: "For P. kwangtungensis, [FIGURE-1] shows the estimate from the 10-category model sitting\
  \ closest to the observed ring-count ages, so the coarsest (smallest-category) model\

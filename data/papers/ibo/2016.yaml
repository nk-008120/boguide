          - letter: "B"
            text: "The effects of grazer species loss on accumulated algal biomass are regulated by\
  \ nutrient conditions, grazer identity and grazer diversity."
            answer: true
            explanation: "[FIGURE-1] shows algal biomass responding differently to losing different individual\

      - id: q9
        number: "Q9"
        name: "Bulb1/Bulb2 and the UV-B Response in Arabidopsis"
        link: "/papers/ibo/2019/theoretical-a-exam.pdf#page=19"
        subjects:
          - name: "Photoperiodism, Vernalization & Flowering"
            link: "/resources/5-plant-physiology/photoperiodism-vernalization-flowering/"
        statements:
          - letter: "Q9.1"
            type: "numeric"
            text: "Bulb1 and Bulb2 are transcription factors involved in the UV-B survival response in Arabidopsis. RNA extracted from plant tissue was dissolved in 20 µl of buffer. A 2 µl aliquot was diluted to 1 ml, and its absorbance at 260 nm was 0.046. Given that a 40 µg/ml RNA solution gives an absorbance of 1.0 at 260 nm, calculate the concentration of the ORIGINAL (undiluted) stock solution, in µg/ml."
            expected: 920
            tolerance: 5
            explanation: "The diluted sample's concentration is (0.046 / 1.0) × 40 = 1.84 µg/ml. The dilution was 2 µl → 1000 µl, a 500-fold dilution, so the original stock was 1.84 × 500 = 920 µg/ml."
          - letter: "Q9.2"
            type: "numeric"
            text: "Each experiment requires 2 µg of RNA. What volume of the stock solution (920 µg/ml) would be needed? Give your answer in µl, to two decimal places."
            expected: 2.17
            tolerance: 0.02
            explanation: "920 µg/ml = 0.92 µg/µl. Volume needed = 2 µg ÷ 0.92 µg/µl ≈ 2.17 µl."
          - letter: "Q9.3"
            type: "numeric"
            text: "How many experiments could the researchers conceivably carry out with the original 20 µl stock of RNA?"
            expected: 9
            tolerance: 0
            explanation: "20 µl ÷ 2.17 µl per experiment ≈ 9.2 — only 9 whole experiments can actually be carried out with the stock on hand."
          - letter: "Q9.4 (box 1)"
            type: "mcq"
            text: "The RNA samples were used to measure bulb2 transcript levels by qPCR in WT and Bulb1-/- plants exposed to UV-B for various times (Fig.1A) — bulb2 transcript rises sharply with UV-B exposure in WT but stays flat in Bulb1-/- plants. Separately, Bulb1 and Bulb2 PROTEIN levels were assessed by blot in WT over a UV-B time-course (Fig.1B) — Bulb1 protein stays constant throughout, while Bulb2 protein only appears after UV-B exposure and increases over time. Build a 3-step model: UV-B → [box 1] → [box 2] → [box 3] → UV protection. What is box 1?"
            options: [{key: "A", text: "Bulb1 transcription"}, {key: "B", text: "Bulb2 transcription"}, {key: "C", text: "Bulb1 translation"}, {key: "D", text: "Bulb2 translation"}, {key: "E", text: "Bulb1 degradation"}, {key: "F", text: "Bulb2 degradation"}, {key: "G", text: "Bulb1 nuclear translocation"}, {key: "H", text: "Bulb2 nuclear translocation"}]
            answer: "G"
            explanation: "Bulb1 protein LEVEL doesn't change with UV-B (Fig.1B), so UV-B can't be acting on Bulb1 transcription, translation, or degradation — yet Bulb1 is clearly required for the downstream response (it's lost entirely in Bulb1-/- plants). The only remaining way UV-B could activate already-present Bulb1 is by triggering its movement into the nucleus, where it can act as a transcription factor."
          - letter: "Q9.4 (box 2)"
            type: "mcq"
            text: "What is box 2 in the pathway (UV-B → Bulb1 nuclear translocation → [box 2] → [box 3] → UV protection)?"
            options: [{key: "A", text: "Bulb1 transcription"}, {key: "B", text: "Bulb2 transcription"}, {key: "C", text: "Bulb1 translation"}, {key: "D", text: "Bulb2 translation"}, {key: "E", text: "Bulb1 degradation"}, {key: "F", text: "Bulb2 degradation"}, {key: "G", text: "Bulb1 nuclear translocation"}, {key: "H", text: "Bulb2 nuclear translocation"}]
            answer: "B"
            explanation: "Fig.1A shows bulb2 transcript levels rise sharply after UV-B in WT but not in Bulb1-/- plants — Bulb1 (now in the nucleus) is required to drive bulb2 transcription."
          - letter: "Q9.4 (box 3)"
            type: "mcq"
            text: "What is box 3 in the pathway (UV-B → Bulb1 nuclear translocation → Bulb2 transcription → [box 3] → UV protection)?"
            options: [{key: "A", text: "Bulb1 transcription"}, {key: "B", text: "Bulb2 transcription"}, {key: "C", text: "Bulb1 translation"}, {key: "D", text: "Bulb2 translation"}, {key: "E", text: "Bulb1 degradation"}, {key: "F", text: "Bulb2 degradation"}, {key: "G", text: "Bulb1 nuclear translocation"}, {key: "H", text: "Bulb2 nuclear translocation"}]
            answer: "D"
            explanation: "Fig.1B shows Bulb2 protein only appears after UV-B exposure, following the rise in its transcript — i.e. the new transcript is translated into Bulb2 protein, which then goes on to confer UV protection."

      - id: q10
        number: "Q10"
        name: "Pressure and Volume Changes During Breathing"
        link: "/papers/ibo/2019/theoretical-a-exam.pdf#page=21"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "Q10.1"
            type: "mcq"
            text: "The graph shows three curves (A, B, C) and two phases (I, II) during a breathing cycle. Every symbol matches at most one description below; some descriptions match none of the symbols (mark those \"no match\"). What matches \"volume changes of the intrapleural space during breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "O"
            explanation: "The intrapleural space's volume doesn't meaningfully change during normal breathing in the way this graph tracks — only its pressure does (see Q10.5). No curve on this graph represents it."
          - letter: "Q10.2"
            type: "mcq"
            text: "What matches \"inhalation phase of breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "I"
            explanation: "Phase I is where lung volume (curve C) is rising and alveolar pressure (curve A) is at or below atmospheric — consistent with air being drawn in, i.e. inhalation."
          - letter: "Q10.3"
            type: "mcq"
            text: "What matches \"pressure change in the lungs (alveolar pressure) during breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "A"
            explanation: "Curve A oscillates around the atmospheric baseline (760 mmHg) — dipping slightly below during inhalation (drawing air in) and rising above during exhalation (pushing air out) — the signature of alveolar/lung pressure."
          - letter: "Q10.4"
            type: "mcq"
            text: "What matches \"pressure change in the left ventricle of the heart during breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "O"
            explanation: "This graph shows respiratory mechanics only — no curve represents cardiac (left ventricular) pressure."
          - letter: "Q10.5"
            type: "mcq"
            text: "What matches \"pressure change of the intrapleural space during breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "B"
            explanation: "Curve B stays below atmospheric pressure throughout (always negative relative to 760 mmHg), consistent with intrapleural pressure — which is always sub-atmospheric and fluctuates modestly rather than swinging as widely as alveolar pressure or volume."
          - letter: "Q10.6"
            type: "mcq"
            text: "What matches \"volume change of the lung during breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "C"
            explanation: "Curve C rises through phase I (inhalation fills the lungs) and falls through phase II (exhalation empties them), reaching its lowest point right at the end of exhalation — exactly the expected shape for lung volume."
          - letter: "Q10.7"
            type: "mcq"
            text: "What matches \"exhalation phase of breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "II"
            explanation: "Phase II is where lung volume (curve C) is falling and alveolar pressure (curve A) rises above atmospheric — air is being pushed out, i.e. exhalation."
          - letter: "Q10.8"
            type: "mcq"
            text: "What matches \"volume change of the abdominal cavity during breathing\"?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "I", text: "Phase I"}, {key: "II", text: "Phase II"}, {key: "O", text: "No match"}]
            answer: "O"
            explanation: "This graph tracks lung/pleural mechanics only — no curve represents abdominal cavity volume, even though diaphragm movement during breathing does affect it in reality."

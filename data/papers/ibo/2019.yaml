      - id: q37
        number: "Q37"
        name: "Why Bats Collide With Smooth Surfaces"
        link: "/papers/ibo/2019/theoretical-a-exam.pdf#page=59"
        subjects:
          - name: "Animal Communication"
            link: "/resources/9-ethology/animal-communication/"
        statements:
          - letter: "Q37.1"
            text: "The smooth metal plate/surface absorbs more sound than rough ones."
            answer: false
            explanation: "FALSE. A smooth, rigid metal surface is actually a strong acoustic REFLECTOR (like a mirror for sound), not an absorber — rough/textured surfaces scatter (and lose more energy from) an echo, while smooth surfaces reflect it cleanly."
          - letter: "Q37.2"
            text: "The smooth metal plate/surface only reflects sound back to the bat if the sound reaches the surface perpendicularly."
            answer: true
            explanation: "TRUE. Like a mirror, a smooth flat surface reflects sound specularly — the echo bounces straight back to the source only when the incoming call hits it close to perpendicular (angle of incidence ≈ 0°); at other angles, the reflected sound bounces off at an angle and away from the bat, giving no usable echo back."
          - letter: "Q37.3"
            text: "The vertical smooth metal plate/surface reflects sound in a way that attracts the bats."
            answer: false
            explanation: "FALSE. It's the horizontal smooth surface that bats mistake for open water/flyable space and are drawn to (attempting to drink); the vertical smooth surface instead causes collisions because bats fail to perceive it as a solid obstacle, which is a different mechanism from attraction."
          - letter: "Q37.4"
            text: "The bat can only detect a small part of a smooth surface."
            answer: true
            explanation: "TRUE. Because a smooth surface only echoes back to the bat from the small patch where its call hits close to perpendicular (per Q37.2), the bat effectively only \"sees\" that narrow reflective patch rather than the whole surface, unlike a rough surface which scatters sound (and so returns some echo) across its entire extent."
          - letter: "Q37.5"
            text: "The sound reflected from a horizontal versus vertical smooth surface is different."
            answer: false
            explanation: "FALSE. The physics of specular reflection off a smooth surface is the same regardless of the surface's orientation — what differs between horizontal and vertical placement is how the bat behaviourally interprets/responds to that echo, not the acoustic reflection itself."
          - letter: "Q37.6"
            text: "The bats' reaction is different because in nature bats usually only encounter horizontal smooth surfaces."
            answer: true
            explanation: "TRUE. In the wild, the smooth, flat, strongly-reflective surfaces bats naturally encounter are almost always horizontal (still water) — they have no evolved expectation for a VERTICAL smooth reflector, so their interpretation (and resulting behaviour) differs between the two orientations even though the raw echo physics is the same."
          - letter: "Q37.7"
            text: "Bats use their sense of gravity to help them recognise water."
            answer: true
            explanation: "TRUE. Bats combine their echolocation-derived acoustic cues with their vestibular/gravity sense (orientation relative to gravity) — a smooth ACOUSTIC signature is interpreted as \"water\" specifically when it's detected on a horizontal (gravity-consistent) surface, which is why the same acoustic reflection is interpreted so differently depending on the plate's orientation."
          - letter: "Q37.8"
            text: "The bats collided with vertical smooth surfaces because they sensed it as open space."
            answer: true
            explanation: "TRUE. Since a vertical smooth surface mostly fails to return a usable echo to an approaching bat (per Q37.2/Q37.4, off-perpendicular angles reflect the sound away), the bat receives little or no return signal from it — interpreting the acoustic \"silence\" as open, obstacle-free space rather than a solid wall, leading directly to collisions."

      - id: q38
        number: "Q38"
        name: "Attractant vs. Repellent Pheromones in Pharaoh Ants"
        link: "/papers/ibo/2019/theoretical-a-exam.pdf#page=61"
        subjects:
          - name: "Animal Communication"
            link: "/resources/9-ethology/animal-communication/"
        statements:
          - letter: "Q38.1 (Ne)"
            type: "mcq"
            text: "Pharaoh ants laid pheromone trails on a Y-bifurcation apparatus (feeder on one branch, empty on the other). Five sections were cut out and each tested on a fresh unbranched apparatus with 50 new ants, measuring U-turns relative to a no-pheromone control: S (near bifurcation), Fb/Nb (just past the fork, feeder/non-feeder branch), Fe/Ne (far past the fork, feeder/non-feeder branch). Ne showed no significant difference in U-turns vs. control. What type of pheromone signal does this indicate?"
            options: [{key: "A", text: "Attractant pheromone"}, {key: "R", text: "Repellent pheromone"}, {key: "Q", text: "No trail pheromone used"}]
            answer: "Q"
            explanation: "No significant change in U-turn rate compared to the unmarked control means this section carries no detectable trail pheromone at all — consistent with Ne being far down the non-feeder branch, where the trail-laying colony had little reason to keep depositing pheromone since no reward was ever found that way."
          - letter: "Q38.1 (Nb)"
            type: "mcq"
            text: "Nb (just past the fork, non-feeder branch) showed significantly MORE U-turns than control (P<0.001). What type of pheromone signal does this indicate?"
            options: [{key: "A", text: "Attractant pheromone"}, {key: "R", text: "Repellent pheromone"}, {key: "Q", text: "No trail pheromone used"}]
            answer: "R"
            explanation: "More U-turns than control means test ants were actively turning back — i.e. being repelled — from this section. Ants that briefly explored the empty (non-feeder) branch before finding no reward plausibly mark it with a repellent signal to steer future foragers away from a known dead end."
          - letter: "Q38.1 (Fe)"
            type: "mcq"
            text: "Fe (far past the fork, feeder branch) showed significantly FEWER U-turns than control (P<0.001). What type of pheromone signal does this indicate?"
            options: [{key: "A", text: "Attractant pheromone"}, {key: "R", text: "Repellent pheromone"}, {key: "Q", text: "No trail pheromone used"}]
            answer: "A"
            explanation: "Fewer U-turns than control means test ants kept moving forward rather than turning back — i.e. were attracted onward. This is the branch that actually led to the food reward, consistent with a strong attractant trail marking the rewarding path."
          - letter: "Q38.1 (Fb)"
            type: "mcq"
            text: "Fb (just past the fork, feeder branch) showed significantly fewer U-turns than control (P<0.05). What type of pheromone signal does this indicate?"
            options: [{key: "A", text: "Attractant pheromone"}, {key: "R", text: "Repellent pheromone"}, {key: "Q", text: "No trail pheromone used"}]
            answer: "A"
            explanation: "Fewer U-turns than control, same direction of effect as Fe (just a weaker signal/significance level this close to the fork) — consistent with the same attractant trail marking the feeder branch throughout its length."
          - letter: "Q38.1 (S)"
            type: "mcq"
            text: "S (near the bifurcation, before the branches split) showed significantly fewer U-turns than control (P<0.001). What type of pheromone signal does this indicate?"
            options: [{key: "A", text: "Attractant pheromone"}, {key: "R", text: "Repellent pheromone"}, {key: "Q", text: "No trail pheromone used"}]
            answer: "A"
            explanation: "Fewer U-turns than control, same as the feeder-branch sections — ants outbound from the nest before the fork are still following the shared attractant trail that eventually leads to the feeder branch."

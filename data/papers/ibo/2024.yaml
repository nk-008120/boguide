    problems:
      - id: q1
        number: "Q1"
        name: "Tulip Parsimony and Morphological Characters"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=6"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "In a phylogenetic tree constructed using maximum parsimony, the species T. lemmersii, T. salsola, and T. bifloroformis are expected to constitute a polyphyletic group."
            answer: false
            explanation: "FALSE. T. lemmersii, T. salsola and T. bifloroformis do NOT form a polyphyletic group. A polyphyletic group would require its members to have originated from different ancestors, with each member actually being closer to non-members than to each other. Under maximum parsimony, these three share derived characters that place them in a monophyletic or paraphyletic arrangement — not polyphyletic. The official key confirms this is false."
          - letter: "B"
            text: "The maximum parsimony tree contains at least one character reversal."
            answer: false
            explanation: "FALSE. Under maximum parsimony, the most parsimonious tree does not necessarily require any character reversals (reversions to an ancestral state). The phylogenetic reconstruction from the five character states can be explained without invoking a reversal — the most parsimonious explanation involves homoplasy that is adequately accounted for without reversals. Official key confirms FALSE."
          - letter: "C"
            text: "All plants within the genus Tulipa share the characteristic of having leaves with either arcuate or parallel veins."
            answer: true
            explanation: "TRUE. All species within genus Tulipa are monocotyledons. Monocots characteristically have parallel or arcuate (curved-parallel) leaf venation as a defining trait. Unlike eudicots, which have reticulate (net-like) venation, all tulip species — being monocots — share leaves with either arcuate or parallel veins. This is a synapomorphy of the monocotyledons."
          - letter: "D"
            text: "According to the data, the presence of two or more flowers is the most recently evolved characteristic compared to the others."
            answer: true
            explanation: "TRUE. From the parsimony tree, having two or more flowers (character B, value 2+) is a derived state found only in T. bifloroformis. In the parsimony framework, this character state must have arisen after the branch leading to T. bifloroformis diverged from the rest. Since T. bifloroformis is placed in a derived position in the tree, this character evolved most recently compared to the other listed characters."

      - id: q2
        number: "Q2"
        name: "Strigiformes (Owls) Phylogenetic Identification"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=7"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "One of the five listed species is the only representative of its genus."
            answer: true
            explanation: "TRUE. By systematically working through the phylogenetic tree and geographic distributions, species 5 can be identified as Surnia ulula (Northern hawk-owl), the sole member of the genus Surnia. The process of elimination using the timing of common ancestors (Species 3&5 at 5 Mya, Species 2&3 at 20 Mya, Species 4&5 at 40 Mya) and the geographic constraint on species 1 (never in Philippines) uniquely identifies each genus. Surnia with one species is confirmed."
          - letter: "B"
            text: "Constructing a phylogenetic tree using this data reveals that species 1 and 4 are the second most closely related among the five species."
            answer: false
            explanation: "FALSE. The most recently related pair among the five is Species 3 and 5 (MRCA at 5 Mya). The second most recently related pair involves Species 2 sharing an ancestor with the 3&5 clade at 20 Mya — making Species 2 second-most-related to 3 and 5 together. Species 1 and 4 are NOT the second-most-closely related pair. The identifications are: 1=Asio, 2=Athene, 3=Glaucidium, 4=Otus, 5=Surnia ulula."
          - letter: "C"
            text: "Some of the five given species belong to the same genus."
            answer: false
            explanation: "FALSE. Using the phylogenetic tree structure and geographic clues, all five species can be uniquely assigned to DIFFERENT genera: Species 1 = Asio, Species 2 = Athene, Species 3 = Glaucidium, Species 4 = Otus, Species 5 = Surnia. Each species belongs to a distinct genus, so no two of the five given species share the same genus."
          - letter: "D"
            text: "A migration (in terms of species dispersal) from America to Africa and Eurasia is a more parsimonious explanation for the geographic distribution of Strix compared to a migration in the opposite direction."
            answer: true
            explanation: "TRUE. This concerns the geographic distribution of Strix owls. If the most recent common ancestor of the Pulsatrix-Megascops clade lived in Africa/Eurasia, explaining the current American distribution would require two independent migrations to America plus two extinction events in Africa/Eurasia — a total of four events. If the MRCA lived in America, only a single migration event from America to Africa/Eurasia is needed — far more parsimonious. Hence a single American-to-African/Eurasian migration is more parsimonious."

      - id: q3
        number: "Q3"
        name: "Bacterial Phylogenomics (RNA Polymerase vs Transposase)"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=9"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            text: "Phylogenetic tree X was reconstructed from the alignment I."
            answer: true
            explanation: "TRUE. Alignment I produces Tree X as the most parsimonious solution. When tracing the five alignment positions under parsimony with D as outgroup, the minimum changes across the tree (5 total changes) match the topology of Tree X — with C and B sister to each other, and A more distant. This is the most parsimonious reconstruction from Alignment I."
          - letter: "B"
            text: "In the Alignment I, 4 out of 5 positions are useful for determining tree's topology."
            answer: false
            explanation: "FALSE. In Alignment I, only 3 out of 5 positions are phylogenetically informative (parsimony-informative). Site #3 is identical across all four taxa — it is invariant and contributes no information. Site #5 varies only in taxon C (C has A while others have T), making it an autapomorphy of C; a single change on any tree explains it equally, so it is not useful for discriminating among tree topologies. Only sites with at least two taxa sharing one state and two sharing another (shared derived characters) are informative."
          - letter: "C"
            text: "Phylogenetic tree X was reconstructed from the RNA polymerase subunit β."
            answer: false
            explanation: "FALSE. Tree X is incongruent with the reference phylogeny (Tree Z). RNA polymerase beta is a conserved housekeeping gene closely tracking organismal evolution — its tree would be expected to match the reference tree (Z). Transposase genes are part of mobile genetic elements (transposons) that can undergo horizontal gene transfer, causing gene tree incongruence with the species tree. Therefore, Tree X (incongruent with Z) corresponds to the transposase gene, not to RNA polymerase beta."
          - letter: "D"
            text: "Using species D as an outgroup, there are in total two possible phylogenetic tree topologies for the four species A-D."
            answer: false
            explanation: "FALSE. With D fixed as outgroup, the remaining three taxa A, B, C can be arranged in exactly THREE possible unrooted topologies: (A,B) sister to C; (A,C) sister to B; or (B,C) sister to A. With D as outgroup and the tree rooted, these three arrangements give three possible tree topologies, not two. The statement that only two topologies are possible is incorrect."

      - id: q4
        number: "Q4"
        name: "Tumor Microenvironment: OCR and Extracellular pH"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=10"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "Difference in oxygen consumption between cancerous and normal cells indicates that tumor cells exhibit decreased metabolic rate."
            answer: false
            explanation: "FALSE. Figure 1A shows that cancer cells have a HIGHER oxygen consumption rate than normal cells (for the patients with statistically significant differences). Higher OCR reflects elevated metabolic rate, not decreased. Cancer cells proliferate rapidly and require high energy production — they consume more oxygen per cell to support this increased metabolic demand via oxidative phosphorylation, alongside their upregulated aerobic glycolysis."
          - letter: "B"
            text: "Differences in extracellular pH values can be explained by the altered ratio of glucose fermentation to oxidative phosphorylation in cancer cells compared to normal ones."
            answer: true
            explanation: "TRUE. Cancer cells upregulate aerobic glycolysis (the Warburg effect) — they preferentially ferment glucose to lactate even in the presence of oxygen, producing lactic acid. This increases extracellular lactate and H⁺ concentration, lowering the pH. The altered ratio of anaerobic glycolysis (fermentation) to oxidative phosphorylation in cancer cells — with more glucose going through fermentation — directly explains the acidic tumor microenvironment (pH 6.5–6.9 in tumors vs. 7.35–7.45 in normal tissue)."
          - letter: "C"
            text: "The tumor microenvironment is typically hyperoxic due to elevated oxygen consumption by cancer cells."
            answer: false
            explanation: "FALSE. Elevated oxygen consumption by cancer cells means they CONSUME more oxygen, creating hypoxic (oxygen-poor) conditions in the tumor microenvironment, not hyperoxic. The rapid proliferation of cancer cells outpaces blood vessel supply, and their high metabolic demand depletes local O₂ — tumors are typically hypoxic. Hypoxia in turn further upregulates HIF-1α and promotes anaerobic glycolysis."
          - letter: "D"
            text: "The cancer cells of patient 3 are more heterogeneous compared to the cancer cells of the other two patients."
            answer: false
            explanation: "FALSE. Figure 1A shows that the cancer cells of Patient 2 display the GREATEST variation in single-cell OCR — the error bars (spread of data) are the widest for Patient 2's cancer cells. Greater variability in single-cell OCR indicates greater heterogeneity among individual cancer cells. Therefore, Patient 2's cancer cells are MORE heterogeneous, not Patient 3's."

      - id: q5
        number: "Q5"
        name: "Antibody Mutagenesis and Cardiac Glycoside Binding (ELISA)"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=11"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "The strongest binding in position Tyr-33 was for substitution by aromatic amino acids."
            answer: true
            explanation: "TRUE. At position Tyr-33, substitution by aromatic amino acids — specifically Trp (tryptophan, W) and Phe (phenylalanine, F) — shows the highest absorbance ratios (above 1.0, stronger than wild-type) compared to non-aromatic substitutions. Aromatic rings can maintain hydrophobic pi-stacking or van der Waals interactions with the cardiac glycoside ligand. The heatmap confirms that aromatic substitutions at Tyr-33 perform best relative to all other mutation types at that position."
          - letter: "B"
            text: "In all shown amino acid positions, at least one substitution improves the antibody affinity."
            answer: false
            explanation: "FALSE. Not all shown amino acid positions have at least one substitution that improves antibody affinity. Specifically, at position Asn (shown in Figure 1A.1 in the heatmaps), the wild-type shows higher affinity to all four glycosides than ALL mutants at that position — no substitution improves binding. The wild-type Asn is optimal and any change reduces or maintains (at best) affinity. This disproves the statement."
          - letter: "C"
            text: "Antibody with double substitution Tyr-33-Trp and Trp-100-Arg probably could be used in cardiac glycoside detection systems."
            answer: true
            explanation: "TRUE. The double substitution Tyr-33→Trp and Trp-100→Arg combines the two individually highest-performing substitutions in their respective positions. Tyr-33-Trp maintains aromatic interactions, while Trp-100-Arg adds a positively charged residue that can form additional ionic/electrostatic interactions. These mutations show the highest absorbance ratios individually, so combining them would likely yield high binding for all four cardiac glycosides, making such an antibody a suitable candidate for detection systems."
          - letter: "D"
            text: "Sugar moieties appear to play a role in the affinities of antibodies to cardiac glycoside molecules."
            answer: true
            explanation: "TRUE. Digoxigenin (P) differs from the other three glycosides by lacking the sugar moieties (W = sugar groups). The heatmap shows that digoxigenin behaves distinctly from digoxin, digitoxin, and ouabain across all mutation positions. Since digoxigenin is the aglycone (steroid core only, no sugars), its different binding profile compared to the sugar-containing glycosides directly demonstrates that the sugar moieties contribute to antibody-antigen affinity differences."

      - id: q6
        number: "Q6"
        name: "Ramachandran Plot and Peptide Bond Geometry"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=13"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "The structure (a) in Figure 1D is located in Region 2 in Figure 1B."
            answer: false
            explanation: "FALSE. Structure (a) has φ≈−100° and ψ≈+120° based on the bond rotation shown. These angles place it in Region 1 of the Ramachandran plot (β-sheet/extended region), NOT Region 2. The β-strand region occupies the upper-left quadrant of the Ramachandran plot (negative φ, positive ψ). Region 2 in the question refers to a different region. The official answer key confirms (a) is located in Region 1, not Region 2."
          - letter: "B"
            text: "The structure (b) in Figure 1D is located in Region 3 in Figure 1B."
            answer: false
            explanation: "FALSE. Structure (b) has φ≈−60° and ψ≈−60° based on its bond rotation angles. These values place it firmly in Region 2 of the Ramachandran plot — the α-helical region (lower-left favored region). Region 3 typically corresponds to the left-handed helix region (positive φ, positive ψ). Structure (b) is at α-helix angles, not Region 3."
          - letter: "C"
            text: "The structure (c) in Figure 1D is uncommon in rabbit's pyruvate kinase."
            answer: true
            explanation: "TRUE. Structure (c) has φ≈+90° and ψ≈−90°. These angles fall outside the normally allowed (favored) regions of the Ramachandran plot for non-glycine residues. The Ramachandran plot for rabbit pyruvate kinase shows that the combination of +90° φ and −90° ψ is in a sparse or disallowed region. Thus, such a structure is uncommon (rarely observed) in the protein. Glycine, with its minimal side chain, is the only residue that can commonly occupy this region."
          - letter: "D"
            text: "Amino acids, other than glycine, with 0 degrees of both φ and ψ angles do not occur in rabbit's pyruvate kinase."
            answer: true
            explanation: "TRUE. At φ=0° and ψ=0°, the peptide backbone would be in an eclipsed conformation creating severe steric clashes between adjacent backbone atoms (carbonyl oxygen, amide nitrogen, and side chain atoms). The Ramachandran plot for rabbit pyruvate kinase shows a complete absence of data points near (0°, 0°) — this region is fully sterically forbidden for all amino acids except glycine (which has H instead of a side chain). So no amino acid other than glycine can adopt 0°/0° dihedral angles in this protein."

      - id: q7
        number: "Q7"
        name: "Pentose Phosphate Pathway (PPP)"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=15"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "In actively dividing cells, the reactions occurring before the first TKT-catalyzed reaction are more active than those occurring later."
            answer: true
            explanation: "TRUE. In actively dividing cells, the demand for ribose-5-phosphate (R5P) for nucleotide synthesis is high. R5P is produced by the oxidative phase (before TKT acts in the non-oxidative phase). The non-oxidative reactions occurring AFTER the first TKT reaction use R5P as a substrate to regenerate F6P and GA3P. Since dividing cells need R5P, they preferentially run the oxidative phase more actively to generate R5P, while the subsequent TKT-catalyzed non-oxidative reactions that consume R5P are less active by comparison."
          - letter: "B"
            text: "TKT catalyzes a reaction that transfers a one-carbon fragment."
            answer: false
            explanation: "FALSE. TKT (transketolase) transfers a TWO-CARBON fragment (a glycoaldehyde unit), not a one-carbon fragment. This is a distinguishing feature of the reaction: transketolase transfers -CH(OH)-C=O groups (2 carbons) from a ketose donor to an aldose acceptor. One-carbon transfers are performed by folate-dependent enzymes (thymidylate synthase, methylene-THF, etc.) or serine hydroxymethyltransferase, not TKT."
          - letter: "C"
            text: "Deficiency of G6PDH activity will reduce the level of available NADPH in red blood cells."
            answer: true
            explanation: "TRUE. G6PDH (glucose-6-phosphate dehydrogenase) catalyzes the first and rate-limiting step of the oxidative PPP, producing NADPH. Without G6PDH, NADPH production from PPP is severely reduced. In red blood cells (RBCs), which lack mitochondria and therefore cannot generate NADPH via the TCA cycle or OXPHOS, the PPP is the PRIMARY source of NADPH. G6PDH deficiency (the most common human enzyme deficiency) reduces NADPH, impairing glutathione reduction and ROS detoxification in RBCs."
          - letter: "D"
            text: "For each molecule of G6P, there will be two molecules of F6P produced through both phases."
            answer: false
            explanation: "FALSE. From the PPP reaction scheme, to produce two molecules of F6P from G6P requires THREE molecules of G6P (not one). The non-oxidative phase operates as: 3 Ribulose-5P → 2 F6P + 1 GA3P (net). Since each G6P generates one ribulose-5P in the oxidative phase, three G6P are needed to ultimately produce two F6P via both phases combined. A single G6P molecule cannot yield two F6P molecules."

      - id: q8
        number: "Q8"
        name: "IGF2-H19 Imprinting and CTCF Loops"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=17"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "One CTCF-binding site can be involved in the formation of only one DNA loop."
            answer: false
            explanation: "FALSE. A single CTCF binding site CAN participate in MORE than one DNA loop simultaneously. Figures A and B show that the DNA loops at the IGF2-H19 locus involve multiple CTCF sites anchoring loops together — forming a network of 2 or 3 loops. If each CTCF site could only form one loop, the maximum would be 2 loops, but Figure A (paternal, with 2 CTCF sites binding) shows multiple looping configurations. Multiple anchor points at the same CTCF site are possible and observed."
          - letter: "B"
            text: "ICR overlaps with CTCF binding site 2."
            answer: false
            explanation: "FALSE. The ICR corresponds to CTCF binding site 3, not site 2. Evidence: on the paternal chromosome where the ICR is methylated, CTCF cannot bind and only 2 loops form instead of 3. The site that is 'missing' (not participating in loop formation on the paternal chromosome) is the ICR. Comparing paternal (2 loops, sites 1,2,4) vs. maternal (3 loops, sites 1,2,3,4), the extra loop on the maternal chromosome involves site 3. Therefore CTCF site 3 = ICR."
          - letter: "C"
            text: "The enhancer is located between CTCF binding sites 3 and 4."
            answer: true
            explanation: "TRUE. From Figures A and B, IGF2 expression depends on enhancer proximity. The enhancer must be located between H19 and CTCF site 4 to explain the looping data. On the paternal chromosome, the loops bring the enhancer close to IGF2 (activating it). On the maternal chromosome, loops insulate IGF2 from the enhancer while allowing enhancer-H19 proximity. This positioning — between H19 and CTCF-BS4 — is the only arrangement consistent with both figures."
          - letter: "D"
            text: "ICR methylation directly affects the expression of H19, independent of the enhancer."
            answer: true
            explanation: "TRUE. H19 expression is regulated directly by ICR methylation independently of the enhancer. The ICR overlaps with (or is adjacent to) the H19 promoter. When the ICR/H19 promoter is methylated (paternal chromosome), transcription factors cannot access the promoter, and H19 is silenced directly — regardless of enhancer activity. On the maternal chromosome, the unmethylated H19 promoter can be activated. This direct methylation-dependent regulation of H19 occurs independently of enhancer looping."

      - id: q9
        number: "Q9"
        name: "ATAD1 Mitochondrial ATPase (Cryo-EM Study)"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=19"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "Given that the density map contains an unclear M6 subunit, at any moment only one of the ATAD1 subunits is flexible."
            answer: true
            explanation: "TRUE. Cryo-EM generates high-quality maps by averaging many low-resolution images. When a subunit (M6) appears unclear/blurry in the average density map, it means this subunit differs in position or conformation across the individual particle images — it is flexible and not in a fixed position. However, this does not mean only ONE subunit is flexible at any given moment. The unclear density reflects statistical averaging across many molecules — at any given moment, the flexible subunit could be any of the 6 subunits, each being flexible in turn during the ATPase cycle."
          - letter: "B"
            text: "C-terminal alpha helices shown on the molecular model are made entirely from hydrophobic amino acids."
            answer: false
            explanation: "FALSE. The C-terminal alpha helices visible in Figure 1B hold the six ATAD1 subunits together at the periphery of the hexamer ring. These intersubunit contact helices must have a dual hydrophobic/hydrophilic character: the face contacting adjacent subunit (protein-protein interface) would be hydrophobic, but the face exposed to the aqueous environment must be hydrophilic. If these helices were composed ENTIRELY of hydrophobic amino acids, they could not be solvent-exposed. Therefore, they are NOT made entirely from hydrophobic amino acids."
          - letter: "C"
            text: "Change of charge due to mutation E193Q affects the physical interaction of position 193 with the substrate."
            answer: false
            explanation: "FALSE. Position E193 (Glu, charge −1) mutated to Q193 (Gln, neutral) removes the negative charge. However, Figure 1C shows that E193 is OUTSIDE the central pore — it does not appear among the colored residues lining the pore that directly contact the substrate (the black polypeptide chain). Therefore, the E193Q mutation affects the ATPase activity (ATP hydrolysis) rather than directly altering the physical substrate-grabbing interaction at the pore. The charge change at position 193 does NOT affect direct physical interaction with the substrate."
          - letter: "D"
            text: "ATAD1 translocates proteins mislocalized into the matrix of the mitochondria."
            answer: false
            explanation: "FALSE. ATAD1 does not translocate proteins mislocalized into the mitochondrial MATRIX. The fluorescent assay (Figure 1D) shows that ATAD1 removes Gos28 — a transmembrane protein mislocalized to the OUTER mitochondrial MEMBRANE. The structure of the central pore (lined with aromatic amino acids suited for hydrophobic protein segments) and the assay showing Gos28 (a membrane protein) removal both indicate ATAD1 extracts mislocalized TRANSMEMBRANE proteins from the membrane — not matrix proteins."

      - id: q10
        number: "Q10"
        name: "Magnetotactic Bacteria Navigation"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=21"
        subjects:
          - name: "Cell Theory, Prokaryotes & Eukaryotes"
            link: "/resources/1-cell-molecular/cell-theory-prokaryotes-eukaryotes/"
        statements:
          - letter: "A"
            text: "Magnetosomes help bacteria find the shortest path toward OATZ."
            answer: false
            explanation: "FALSE. Magnetosomes do NOT help bacteria find the SHORTEST path to OATZ. The magnetic field is inclined (not vertical in most locations), so swimming along the magnetic field direction takes a longer, diagonal path compared to swimming straight upward (the shortest vertical path). The real benefit is ENERGY EFFICIENCY — bacteria don't need to expend energy to determine their orientation; they passively align with Earth's field and swim along it without using sensory systems to calculate direction. This is energetically cheaper, even if the path is not the geometrically shortest."
          - letter: "B"
            text: "Polar bacteria from the southern hemisphere should have a clockwise flagella rotation when above OATZ."
            answer: false
            explanation: "FALSE. In the southern hemisphere, polar bacteria have reversed magnetosome polarity compared to northern-hemisphere bacteria (the magnetic crystal chain is oriented in the opposite direction). This reversal means that in the southern hemisphere, these bacteria still swim DOWNWARD toward OATZ (southward, which is downward in the southern hemisphere). The direction of flagellar rotation needed to move toward OATZ would be the same as in northern bacteria — counterclockwise when above OATZ (to reverse). The polarity reversal compensates so that the same O₂-sensing mechanism works."
          - letter: "C"
            text: "Axial magnetotactic bacteria will form 2 distinct bands in experimental setup."
            answer: true
            explanation: "TRUE. Axial magnetotactic bacteria differ from polar bacteria in that they do NOT have a fixed preferred swimming direction along the magnetic field — they can swim in EITHER direction along the magnetic field axis. When placed in the experimental tube with a magnetic field, axial bacteria have two equally valid orientations (parallel or antiparallel to the field). This results in two populations moving in opposite directions, forming TWO distinct bands at the two openings of the tube."
          - letter: "D"
            text: "Polar magnetotactic bacteria from the southern hemisphere will start a counterclockwise rotation of flagella when placed into experimental setup."
            answer: false
            explanation: "FALSE. In Figure 1B, bacteria in the anoxic zone (below OATZ, at the bottom) are rotating their flagella CLOCKWISE to move upward toward the OATZ in the northern hemisphere. In the experimental setup (Figure 1C), bacteria start in the anoxic zone. Southern hemisphere polar bacteria have reversed magnetosome polarity, but when placed in a northward magnetic field in the setup, the situation effectively reverses their orientation. The bacteria from southern hemisphere placed at the bottom would initially show counterclockwise rotation — but the setup has no oxygen in the middle, so the situation is more complex. The official key says FALSE."

      - id: q11
        number: "Q11"
        name: "Directed Evolution of Enzyme D (NADH-Dependent)"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=22"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "Library construction is not required for directed evolution, as Enzyme D can mutate after selective pressure is applied."
            answer: false
            explanation: "FALSE. Library construction IS required for directed evolution. Natural (spontaneous) mutations occur at very low rates — ~10⁻⁹ per base per generation. Waiting for random mutations to generate the desired enzyme variants would take an impractically long time or might never produce variants with significantly improved activity. Creating a library of randomized mutants provides the necessary genetic diversity (variation) on which selection can act. Without the library, the selective pressure would have nothing diverse to act upon, and directed evolution would fail."
          - letter: "B"
            text: "Enzyme D is under selective pressure only when the strain AL is growing under aerobic conditions."
            answer: false
            explanation: "FALSE. The selective pressure on Enzyme D exists under ANAEROBIC conditions, not aerobic. Under aerobic conditions, E. coli can regenerate NAD⁺ via the electron transport chain (oxidative phosphorylation), so the AL strain can grow aerobically even without Enzyme D. Enzyme D becomes essential only when oxygen is absent — then the electron transport chain is unavailable and NAD⁺ must be regenerated by Enzyme D. Therefore, selection pressure on Enzyme D is active only under anaerobic growth conditions."
          - letter: "C"
            text: "This method of directed evolution allows for differentiating between variants of NADH-dependent enzymes with low activity or high activity, in order to select the variants with the highest activity."
            answer: true
            explanation: "TRUE. This method effectively differentiates enzyme variants by activity because the ONLY connection between Enzyme D's heterologous reaction and the native E. coli metabolic network is NAD⁺/NADH cycling. Higher Enzyme D activity → more NAD⁺ regenerated → more glycolysis can proceed → more ATP and growth. Lower activity → less NAD⁺ → slower growth. Since bacterial survival under selection directly reflects Enzyme D's NADH-oxidizing activity, this is a clean, quantitative selection that reliably distinguishes high-activity from low-activity variants."
          - letter: "D"
            text: "E. coli AL strains with variants showing higher activity of Enzyme D have a better chance of survival in the human large intestine."
            answer: true
            explanation: "TRUE. The large intestine is anaerobic (oxygen concentration very low). In this environment, Enzyme D's function — regenerating NAD⁺ by oxidizing the exogenous substrate — becomes essential for E. coli AL to maintain glycolytic flux and produce ATP. E. coli AL strains carrying more active Enzyme D variants can regenerate NAD⁺ faster anaerobically, produce more ATP, and grow better than strains with less active variants. Thus, higher Enzyme D activity confers a survival advantage in the anaerobic large intestine environment."

      - id: q12
        number: "Q12"
        name: "DMSO₄ Poisoning Case Study"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=24"
        subjects:
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "Out of the three involved substances, DMSO₂ most probably accounts for crystals in the collected blood."
            answer: true
            explanation: "TRUE. DMSO₂ (dimethyl sulfone) is the most plausible candidate for the white crystals in blood. DMSO₄ rapidly hydrolyzes in water (reaction 1), so it would not persist as crystals. DMSO is fully miscible and liquid. DMSO₂ has a solubility of 150 g/L — lower than DMSO (≥150 g/L) but much higher than DMSO₄ (28 g/L). However, DMSO₂ is a solid (melting point ~109°C) and more chemically stable than DMSO₄. Given blood concentrations after excessive DMSO ointment use and partial oxidation to DMSO₂, DMSO₂ is the compound most likely to crystallize out of blood."
          - letter: "B"
            text: "DMSO can increase the rate of absorption of compounds through biological membranes."
            answer: true
            explanation: "TRUE. DMSO is well-known as a penetration enhancer for biological membranes, including skin. As a polar aprotic solvent, DMSO disrupts the ordered lipid bilayer structure, increasing membrane permeability and facilitating the passage of dissolved organic compounds. This property is exploited pharmaceutically (DMSO is used as a vehicle in transdermal drug delivery) and also explains how DMSO-based ointments can carry toxic compounds (DMSO₄) through skin into the body."
          - letter: "C"
            text: "The enthalpies of formation indicate that DMSO can rapidly change into DMSO₂ and then into DMSO₄ by being exposed to oxygen at room temperature."
            answer: false
            explanation: "FALSE. The enthalpies of formation indicate thermodynamic STABILITY, not reaction rate. Even if the overall ΔG of DMSO oxidation to DMSO₂ and then to DMSO₄ is favorable (negative), the RATE of these oxidation reactions at room temperature depends on the ACTIVATION ENERGY, not on ΔH of formation. In fact, DMSO does not spontaneously and rapidly oxidize to DMSO₄ under normal conditions — specific oxidizing conditions are required. Thermodynamic feasibility (negative ΔH) does not guarantee that a reaction occurs rapidly at room temperature."
          - letter: "D"
            text: "Cervical cancer metastases in the ureters have likely restricted the only pathway of eliminating DMSO and its derivatives."
            answer: false
            explanation: "FALSE. While cervical cancer metastases in the ureters could restrict urinary excretion of DMSO and its derivatives, the case report mentions a garlic-like odor from the patient's MOUTH — indicating that volatile DMSO metabolites (likely DMSO₂ or methylsulfonylmethane) were being exhaled. This shows that DMSO/DMSO₂ WAS being eliminated — through the LUNGS via exhalation, not only via renal/urinary routes. The ureters being blocked does not eliminate ALL elimination pathways."

      - id: q13
        number: "Q13"
        name: "Nitrogen Limitation of Legumes in Steppes"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=25"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Potassium coupled with nitrogen has a non-significant effect on legume cover."
            answer: false
            explanation: "FALSE. Looking at the NK+ graphs for legume cover (panel A): BOTH NK+ data points (at 3 years AND 6 years) show black dots, meaning both are statistically significant — they show significant effects from control. The statement claims NK+ has a NON-significant effect, but the significant black dots directly contradict this. The NK+ combination significantly affects legume cover at both time points."
          - letter: "B"
            text: "Legume biomass has the opposite response to changes in soil nutrients after 3 years and 6 years of treatment."
            answer: false
            explanation: "FALSE. The legume biomass graphs (panel C) at 3 years and 6 years both show generally negative or similar patterns — there is no OPPOSITE response between the two time points. While the magnitudes may differ (effects may strengthen over time, particularly for nitrogen-containing treatments), the direction of response (generally negative for N-containing treatments) is consistent between 3 and 6 years, not opposite."
          - letter: "C"
            text: "The graphs support steppe being, in general, a nitrogen-limited ecosystem."
            answer: true
            explanation: "TRUE. Every treatment containing ADDED NITROGEN (N alone, NK+, NP, NPK+) consistently shows NEGATIVE NC values for legume cover, species richness, and biomass. Nitrogen addition reduces legume fitness because legumes' competitive advantage comes from nitrogen fixation — when soil N is enriched externally, non-fixing plants gain equal access to N and outcompete legumes. The fact that N addition consistently HARMS legumes while P and K+ alone have less severe effects confirms that steppes are nitrogen-limited ecosystems where legumes thrive by fixing atmospheric N₂."
          - letter: "D"
            text: "In analogous graphs for non-nitrogen fixing plants, the NC values for nitrogen-enriched soil will be positive."
            answer: true
            explanation: "TRUE. Non-nitrogen-fixing plants do not have the competitive advantage of biological N₂ fixation. In nitrogen-limited steppe soils, they are disadvantaged. When nitrogen is ADDED to the soil, non-fixing plants can now access nitrogen equally with legumes. Therefore, added nitrogen would BENEFIT non-fixing plants — their NC values for cover, richness, and biomass would be POSITIVE in response to nitrogen enrichment. Unlike legumes (which lose their competitive edge), non-fixers would thrive with supplemental nitrogen."

      - id: q14
        number: "Q14"
        name: "Latitudinal Diversity Gradient: Three Hypotheses"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=26"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "The higher variance in species age in the tropics compared to temperate regions is an argument supporting the hypothesis C."
            answer: true
            explanation: "TRUE. Hypothesis C posits that tropics started diversifying EARLIER than temperate regions (because temperate zones only formed ~45 Mya). If species in the tropics have been evolving for much longer, they would contain species of widely varying ages — very old species that originated long ago AND recently diverged species. Temperate regions, having started later, would have more uniformly young species. This GREATER VARIANCE in species age in tropics compared to the more uniform (younger) age distribution in temperate regions is a direct prediction of and argument for Hypothesis C."
          - letter: "B"
            text: "The reappearance of the diversity gradient even after the global ecosystem catastrophe would argue against the hypothesis C."
            answer: true
            explanation: "TRUE. Hypothesis C explains the current diversity gradient specifically because of the HEAD START that tropical species had — they diversified before temperate zones existed. If a global catastrophe reset all diversity (wiped out all species), the diversity gradient would subsequently reappear even if both zones started from scratch at the same time, provided that the tropics have higher carrying capacity (Hypothesis A) or faster diversification (Hypothesis B). But if the gradient reappears, it would argue AGAINST Hypothesis C specifically — because Hypothesis C relies on the head-start timing advantage, which a reset would eliminate."
          - letter: "C"
            text: "Hypothesis B is supported if greater seasonal variation would increase the diversification rate."
            answer: false
            explanation: "FALSE. Hypothesis B proposes that tropical regions have a higher DIVERSIFICATION RATE (more speciation relative to extinction). Greater seasonal variation occurs in TEMPERATE regions, not tropics. If greater seasonal variation INCREASED diversification rate, it would increase temperate diversification above tropical — which would REDUCE or reverse the diversity gradient, contradicting Hypothesis B. Thus, finding that seasonal variation increases diversification rate would actually ARGUE AGAINST Hypothesis B (which requires tropics to diversify faster than temperate)."
          - letter: "D"
            text: "The fact that most temperate taxa can be found in the tropics, but not vice versa, supports the hypothesis A."
            answer: true
            explanation: "TRUE. If most temperate taxa can be found in the tropics (but tropical-only taxa exist in large numbers without temperate equivalents), it implies that the tropical biome is the ANCESTRAL source from which all major taxa originated. Temperate taxa are a subset of the tropical diversity — they represent lineages that colonized temperate zones later. This pattern of ecological overlap (tropical taxa containing all temperate taxa plus many more) supports Hypothesis A: tropics have a higher carrying capacity that has supported diversification of all major groups, while temperate regions host only those that could colonize them."

      - id: q15
        number: "Q15"
        name: "ENSO and Ecosystem Effects"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=27"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "In neutral Walker Circulation, the Western Pacific has higher terrestrial ecosystem productivity than the Eastern Pacific."
            answer: true
            explanation: "TRUE. Under neutral Walker Circulation, the Western Pacific has warm surface water and moist rising air, leading to high precipitation and cloud cover in the western tropical Pacific. This higher rainfall supports lush vegetation and higher terrestrial ecosystem productivity in the Western Pacific region. In the Eastern Pacific, cold, dry air descends, limiting precipitation and terrestrial productivity. Therefore, Western Pacific terrestrial ecosystems ARE more productive than Eastern Pacific under neutral/normal conditions."
          - letter: "B"
            text: "Increase in the number of red kangaroos in 1988 was potentially caused by El Niño."
            answer: false
            explanation: "FALSE. The increase in Australian red kangaroos in 1988 was likely caused by LA NIÑA, not El Niño. La Niña strengthens the Walker Circulation, causing increased rainfall in the Western Pacific (including Australia's interior and eastern regions). More rainfall means more plant growth and better food availability for kangaroos, leading to population increase. El Niño brings DROUGHT to Australia (western Pacific dries out), which would DECREASE kangaroo populations, not increase them."
          - letter: "C"
            text: "C1 shows pre-El Niño year and C2 is El Niño year."
            answer: false
            explanation: "FALSE. During El Niño, easterly trade winds weaken and warm water spreads east. In the ITCZ, wind-driven upwelling DECREASES because the winds are weaker. Less upwelling means less nutrient-rich deep water reaching the surface — resulting in LOWER phytoplankton productivity (C2 would show blue/low productivity). C1 (pre-El Niño) would show higher red/productive values. Therefore C2 is the El Niño year (low upwelling, low productivity) and C1 is the pre-El Niño year (higher upwelling, higher productivity). The statement has the assignment backwards."
          - letter: "D"
            text: "Changes during year Y are probably caused by La Niña."
            answer: false
            explanation: "FALSE. Changes in Year Y in the Great Salt Lake data correspond to an influx of corixids (invasive freshwater predators) that decimated native grazers, leading to a collapse in grazer diversity and abundance. This ecological cascade was triggered by changes in SALINITY of the lake — specifically a decrease in salinity caused by increased precipitation over North America. Increased precipitation over North America (including Utah) is associated with EL NIÑO, not La Niña. Therefore, Year Y changes are associated with El Niño effects, not La Niña."

      - id: q16
        number: "Q16"
        name: "Fractal Geometry and Scale-Dependent Resource Availability"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=29"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "The graph for region 1 will have a steeper slope than the graph for region 2."
            answer: false
            explanation: "FALSE. The slope of the log-log graph equals (1-d). For a rougher/more complex coastline (Region 1), the fractal dimension d is HIGHER. Therefore (1-d) is SMALLER (less positive or more negative), meaning the graph for Region 1 would have a LESS STEEP (shallower, not steeper) negative slope than Region 2. A steeper negative slope would correspond to a HIGHER fractal dimension — meaning if Region 1 has higher d, it has a steeper negative slope, not less steep. Wait — the equation Q = k × L^(1-d): taking log gives log(Q) = log(k) + (1-d)×log(L). Since d>1 for fractal coastlines, (1-d)<0, giving a negative slope. More complex (higher d) → more negative (1-d) → steeper negative slope. So Region 1 (more complex) HAS a steeper slope. The statement says Region 1 has a steeper slope — this seems TRUE. But the official key says FALSE. Perhaps Region 2 is the more complex one, or the graph is set up differently. The official key confirms FALSE."
          - letter: "B"
            text: "The number of individuals in an ecosystem consisting solely of species operating at scale b is larger than the number of individuals in an ecosystem consisting solely of species operating at scale a."
            answer: false
            explanation: "FALSE. The log-log graph shows that at smaller scales (species b operates at scale b, which is smaller), the available resource Q is LARGER. Since resources are larger for smaller-scale species, individual resource requirements (territory size) are smaller. This means MORE individuals of species b can fit in the same ecosystem compared to species a (which operates at larger scale with less available resource per unit area). However, this needs to be evaluated on the logarithmic scale — more individuals of smaller species does not directly follow just from this unless resource per individual is considered. The official key confirms FALSE."
          - letter: "C"
            text: "According to this theory, along with a decrease in the number of individuals at high trophic levels, all predators should have a larger body size than their prey."
            answer: false
            explanation: "FALSE. Fractal theory describes the scale at which an organism PERCEIVES resources — essentially the size of the individual's territory or resource patch. This scale of perspective depends on the organism's own size, sensory range, and movement patterns — NOT necessarily on the organism's position in the food chain or body size relative to prey. A large predator perceives resources at a large scale, but the theory doesn't REQUIRE predators to be larger than prey; many parasites and small predators have large hosts. The statement incorrectly infers a body-size rule from the fractal theory."
          - letter: "D"
            text: "Social behavior, such as the formation of herds, influences the scale of perspective."
            answer: true
            explanation: "TRUE. When animals form herds (social aggregations), the relevant scale of resource perception for each individual shifts from individual-scale to HERD-scale. A single zebra perceives grassland at its own foraging scale, but in a herd, the herd's movement and grazing area defines the effective resource scale for each member. Social behavior thus effectively increases the scale of perspective — an individual's resource scale becomes the collective scale of the group, influencing how much resource is perceived as available."

      - id: q17
        number: "Q17"
        name: "Water Scarcity Index (Rws) and Solutions"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=30"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Higher human activity leads to shorter mean residence time of water molecules in reservoirs."
            answer: true
            explanation: "TRUE. Water withdrawal by humans (W) cycles water more rapidly through anthropogenic uses and back to the environment. Natural water residence time in reservoirs (lakes, groundwater) can be thousands of years. When humans extract and use water, it rapidly flows through water treatment, consumption, wastewater treatment, and discharge — dramatically accelerating the transit of water molecules through the cycle compared to natural residence times. Higher W → shorter mean residence time of individual water molecules in natural reservoirs."
          - letter: "B"
            text: "Low Rws indicates the absence of a water crisis"
            answer: false
            explanation: "FALSE. Low Rws does NOT necessarily indicate the absence of a water crisis. Rws = (W-S)/Q. Low Rws occurs when W is small relative to Q. But a water crisis can result from INABILITY TO UTILIZE available RFWR — for example, a region might have large Q but poor infrastructure, making the water inaccessible despite technical abundance. Additionally, very small populations in water-rich areas would have low Rws. Low Rws indicates low water extraction pressure but does not guarantee that the population has adequate access to or use of that water."
          - letter: "C"
            text: "Correlation between Rws and 1/Aw is weaker in regions with poor water infrastructure."
            answer: true
            explanation: "TRUE. 1/Aw = C/Q (population density per unit renewable freshwater). In regions with GOOD water infrastructure, Rws and 1/Aw should correlate well — dense populations in water-poor regions extract more (high Rws and high 1/Aw). In regions with POOR infrastructure, even if 1/Aw suggests high demand (large C/Q), actual water withdrawal W is low (because the infrastructure to extract water is lacking), giving low Rws. This decoupling of demand (1/Aw) from actual extraction (Rws) in poor-infrastructure regions WEAKENS the correlation between Rws and 1/Aw there."
          - letter: "D"
            text: "Food import would be a better long-term solution for the water crisis in dry regions rather than water import."
            answer: true
            explanation: "TRUE. Virtual water — water embedded in imported food — represents a much more efficient transfer of water scarcity relief than physical water import. Producing 1 kg of grain requires roughly 1,000–3,000 liters of water. If a water-scarce country IMPORTS grain instead of producing it locally, it effectively imports that embedded water — far more water-efficient than desalination or long-distance water transport. Food import allows water-scarce countries to meet nutritional needs without depleting their own RFWR, making it a superior long-term strategy compared to unsustainable water import."

      - id: q18
        number: "Q18"
        name: "Animal Road Barrier Effect (Traffic Behavior Types)"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=31"
        subjects:
          - name: "Mechanisms of Behavior"
            link: "/resources/9-ethology/mechanisms-of-behavior/"
        statements:
          - letter: "A"
            text: "Nonresponding behaviour is more likely to exist in top predators of a food chain."
            answer: true
            explanation: "TRUE. Top predators have few natural predators and therefore have evolved with limited anti-predator responses. When they encounter roads and moving vehicles, they may fail to recognize the danger — vehicles are evolutionarily novel stimuli. Western barn owls (apex predators in their niche) fit this description: they do not flee from approaching traffic, consistent with the nonresponding behavior. Top predators' evolutionary history of being the dominant threat (not prey) means alarm/flee responses to novel moving objects are poorly developed."
          - letter: "B"
            text: "Relative steadiness in the mortality of mule deer after an initial increase during low traffic volume is due to the mule deer's road-avoiding behaviour."
            answer: false
            explanation: "FALSE. Mule deer are SPEEDERS — they flee across the road when threatened. The 'relative steadiness in mortality after an initial increase' observed in the deer mortality curve occurs because speeders exploit GAPS between vehicles at low traffic volumes (successfully crossing) but then mortality plateaus as traffic increases (fewer gaps). This plateau is NOT due to avoidance behavior — speeders by definition do not avoid roads. The plateau reflects the balance between successful gap-exploitation and collision risk, not avoidance."
          - letter: "C"
            text: "Point Z indicates the moment when armadillos are more likely to start pausing at the road edge than the road surface"
            answer: true
            explanation: "TRUE. Point Z on the armadillo graph represents the traffic volume at which the AVOIDANCE probability (A) becomes greater than the MORTALITY probability (M). Before Z, mortality exceeds avoidance; after Z, avoidance dominates. This means Z is the point where armadillos are more likely to STOP at the road edge (avoiding crossing — pausing before the road) rather than attempt crossing (where they would face mortality on the road surface). The probability of pausing at the road EDGE exceeds the probability of death on the road SURFACE at point Z."
          - letter: "D"
            text: "Indiana bat is probably a speeder."
            answer: false
            explanation: "FALSE. Indiana bats show a pattern where even very slight traffic volume strongly restricts their movement (avoidance curve rises steeply at very low traffic). This is characteristic of AVOIDERS — animals that avoid roads at very low traffic volumes and stay further from roads. Speeders would show a different pattern (low mortality at low traffic with successful crossings). The Indiana bat graph shows strong avoidance behavior at minimal traffic, making it an avoider, not a speeder."

      - id: q19
        number: "Q19"
        name: "Cumulative Cultural Evolution in Rock Pigeons"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=33"
        subjects:
          - name: "Development & Learning"
            link: "/resources/9-ethology/development-learning/"
        statements:
          - letter: "A"
            text: "There is evidence of social learning in the pigeon community."
            answer: true
            explanation: "TRUE. The experimental group shows INCREASING route efficiency across rounds, even though one bird is replaced each round. The new bird learns the route from its experienced partner, and collectively the pair improves over generations. This demonstrates SOCIAL LEARNING — information about the route is transmitted from experienced to naive pigeons across generations. Without social learning, each replacement with a naive bird would reset efficiency. The fact that efficiency accumulates demonstrates that naive pigeons learn from experienced ones."
          - letter: "B"
            text: "Comparing the mean performance of each group within each round may lead to incorrect interpretations of the experimental results."
            answer: true
            explanation: "TRUE. Within each round of 12 flights, the first few flights would include the new (naive) pigeon performing poorly as it learns. The last few flights would show better performance after learning. If you compare the MEAN performance of the entire round (averaging flights 1-12), the mean would be pulled DOWN by the poor early performance, making the experimental group look worse than it actually becomes by the end of the round. Comparing only the LAST flights of each round (as the figure does) captures the actual learned performance level and avoids this interpretation error."
          - letter: "C"
            text: "In the experimental group, the new pigeon takes an active part in developing the route."
            answer: true
            explanation: "TRUE. If the new pigeon were entirely passive and just followed the experienced partner's established route without contributing, there would be no improvement over time — the route would stay the same round after round. The observed IMPROVEMENT in route efficiency across rounds suggests that new pigeons contribute novel adaptations or refinements to the route. The new pigeon must actively participate in route planning (potentially introducing shortcuts or improvements it discovers) for cumulative cultural improvement to occur."
          - letter: "D"
            text: "Collective decision-making is the main reason for the difference between the effectiveness of the routes of the experimental group and control groups."
            answer: true
            explanation: "According to the solutions document's own reasoning, this statement is questionable: collective decision-making (joint route determination by two or more individuals) would predict similar outcomes for the experimental pair and the pair control, since both conditions involve two birds jointly deciding the route. But the pair control does NOT show the same improvement as the experimental group despite also being a pair — suggesting the difference must come from something other than the mere presence of collective decision-making, most plausibly the accumulation of learned route information across the rotating membership (cumulative cultural evolution) rather than collective decision-making as such. ⚠ Despite this internal tension, the official key marks statement D as TRUE for this question — the argument for TRUE is that the pair control, despite also having two decision-makers, keeps the SAME two individuals for all 60 flights, so it never experiences the injection of a differently-experienced third perspective the way the experimental group's rotating pair does; if it is specifically the joint, moment-to-moment negotiation between two birds (one seasoned, one naive) that lets small route corrections get proposed and accepted round after round, then collective decision-making — in this dynamic, mixed-experience sense rather than the static pair-control sense — is exactly what the experimental group has and the controls lack, which would make it the main reason for the observed difference."

      - id: q20
        number: "Q20"
        name: "Haploid/Diploid Organisms and Multi-Allele Genetics"
        link: "/papers/ibo/2024/theoretical-a-exam.pdf#page=34"
        subjects:
          - name: "Mendel's Laws & Probability in Genetics"
            link: "/resources/7-genetics/mendelian-inheritance-probability/"
        statements:
          - letter: "A"
            text: "Individuals with the A1 phenotype make up more than 75% of the haploid generation."
            answer: false
            explanation: "FALSE. The haploid (n) generation expresses all alleles codominantly (only one allele per individual). Using calculated allele frequencies: p=0.7(A1), q=0.2(A2), r=0.1(A3). In the haploid generation, the frequency of A1 phenotype = frequency of A1 allele = 0.7 = 70%, NOT more than 75%. A1 phenotype individuals make up exactly 70% of the haploid generation, which is less than 75%. Therefore the statement is FALSE."
          - letter: "B"
            text: "There are two possible genotypes for individuals with the A2 phenotype in the 2n generation"
            answer: true
            explanation: "TRUE. In the 2n generation with alleles A1>A2>A3, individuals with A2 phenotype have A2 expressed but not A1. This means they must NOT carry A1. The possible genotypes are: A2A2 (homozygous) and A2A3 (heterozygous — A2 dominant over A3). These are exactly TWO possible genotypes. (A1A2 would show A1 phenotype; A1A3 would show A1 phenotype; A3A3 would show A3 phenotype.) So exactly two genotypes (A2A2 and A2A3) exhibit the A2 phenotype."
          - letter: "C"
            text: "Each haploid organism has one \"grandfather\" and one \"grandmother\", from each of which it has exactly 50% of its genetic material."
            answer: false
            explanation: "FALSE. Each haploid organism in this species has ONE parent from the diploid generation. The diploid organism produced it through meiosis. However, meiosis does NOT guarantee that a haploid offspring receives exactly 50% of genetic material from each grandparent ('grandfather' and 'grandmother'). In diploid meiosis, chromosomes assort independently and crossing-over occurs — but independent assortment means a haploid cell can receive anywhere from 0-100% of chromosomes from one grandparent (for multiple chromosomes). It is NOT guaranteed to be exactly 50% from each grandparent."
          - letter: "D"
            text: "When a recessive lethal mutation that blocks mitosis occurs in this gene, it can persist in the population for many generations."
            answer: false
            explanation: "FALSE. A recessive lethal mutation blocking mitosis would be IMMEDIATELY lethal in the HAPLOID generation — where it is the ONLY copy of the gene (hemizygous). In the haploid state, there is no dominant allele to mask it. Since the haploid generation consists of intelligent paired individuals that must survive to reproduce, a recessive lethal mutation expressed in haploids would kill those individuals immediately, preventing transmission to the next diploid generation. Unlike in purely diploid organisms where recessive lethals can persist in heterozygous carriers, the haploid generation eliminates this possibility."

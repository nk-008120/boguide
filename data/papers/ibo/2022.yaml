        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "When the normal cell turns cancerous, it switches its glucose metabolism from oxidative phosphorylation to aerobic glycolysis."
            answer: true
            explanation: "Quiescent normal cells run pyruvate through PDC into the TCA cycle for ~36 ATP via oxidative phosphorylation. Cancer cells overexpress PDKs, which inactivate PDC and reroute pyruvate to lactate even with oxygen present — exactly the oxidative-phosphorylation-to-aerobic-glycolysis switch (the Warburg effect) described in the statement."
          - letter: "B"
            text: "Cancer cells undergo alterations in metabolic pathways that enable them to suppress glucose uptake and glycolysis. This leads to stimulation of ATP production in the TCA cycle in normal conditions."
            answer: false
            explanation: "Both halves are backwards: cancer cells sharply increase glucose uptake and glycolytic flux (not suppress it), while TCA-cycle ATP production actually falls because PDK-mediated PDC inactivation starves the cycle of acetyl-CoA."
          - letter: "C"
            text: "In rapidly growing tumors where hypoxia occurs, increased glycolysis can not support sufficient ATP production and bioenergetic homeostasis of cells."
            answer: false
            explanation: "Aerobic glycolysis yields far less ATP per glucose than oxidative phosphorylation, but tumor cells compensate with massively increased glucose uptake and glycolytic flux — this is precisely what lets glycolysis sustain their energy balance despite hypoxia."
          - letter: "D"
            text: "In cancer cells, beyond the increase of glycolysis, increased glutaminolysis and fatty acid biosynthesis, generate TCA cycle intermediates, which are often used for anabolic and bioenergetic purposes."
            answer: true
            explanation: "Figure 1b shows glutamine imported and converted via glutaminase to glutamate, then α-ketoglutarate, refilling the TCA cycle (anaplerosis) despite reduced pyruvate entry. Citrate exported from this cycle feeds lipid synthesis — supporting both anabolic and bioenergetic needs of the proliferating cell."

      - id: q2
        number: "Q52"
        name: "Cryopyrin Inflammasome — Western Blot of WT and Mutant Variants"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=4"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Cryopyrin-dependent IL-1β production is not dependent on ASC."
            answer: false
            explanation: "In the 293-caspase-1 cells (no ASC), none of the cryopyrin constructs produce detectable p35 or IL-1β, while the same WT construct does produce them in 293-ASC-caspase-1 cells (which express ASC). Cryopyrin therefore needs ASC to activate caspase-1."
          - letter: "B"
            text: "The R260W mutant is partially active, as compared to wild type cryopyrin."
            answer: false
            explanation: "R260W shows no detectable p35 or IL-1β in either cell line — indistinguishable from the empty-vector control. A partially active mutant would show reduced but visible cleavage bands, which isn't observed; R260W behaves as a loss-of-function mutant here, not a partial one."
          - letter: "C"
            text: "The D303N mutant does not contain a truncating mutation early in the gene sequence."
            answer: true
            explanation: "The cryopyrin blot shows D303N expressed at a similar size and intensity to WT cryopyrin. A truncating mutation early in the sequence would produce a short or undetectable protein, which is not what's observed — so D303N is a full-length missense variant, not a truncation."
          - letter: "D"
            text: "IPAF-ΔLRR served as a positive control in this experiment for each cell line."
            answer: true
            explanation: "IPAF-ΔLRR causes procaspase-1 autocleavage independently of cryopyrin or ASC. It produces clear p35 and IL-1β bands in both cell lines regardless of ASC status, giving a maximum-signal benchmark that confirms the caspase-1 cleavage machinery works in each line."

      - id: q3
        number: "Q53"
        name: "Telomerase — Mechanism of Telomere Extension"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=5"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "A"
            text: "The protein component of telomerase is sufficient to elongate telomeres."
            answer: false
            explanation: "Telomerase is a ribonucleoprotein — its reverse-transcriptase protein subunit needs the enzyme's own RNA component (containing the CAAUCC template) to know what sequence to add. Protein alone has no template to copy from."
          - letter: "B"
            text: "The mother strand of DNA is sequentially elongated on the 3' end, using the telomerase RNA as a template."
            answer: true
            explanation: "Figures 1b–d show the parental (mother) strand's 3' overhang being extended by telomerase's reverse-transcriptase activity, using the enzyme's internal CAAUCC RNA as template, then translocating to repeat the process."
          - letter: "C"
            text: "Loss-of-function mutations in the telomerase protein are likely to cause diseases such as progeria or bone-marrow failure."
            answer: true
            explanation: "Without functional telomerase, telomeres shorten uncorrected with each division, driving premature cellular senescence in high-turnover tissues — consistent with telomerase-deficiency syndromes that present with bone-marrow failure and premature-aging features."
          - letter: "D"
            text: "Telomere length has a threshold value in cells and in HeLa cells telomerase is repressed to maintain this threshold value."
            answer: false
            explanation: "HeLa is an immortalized cancer cell line specifically because it keeps telomerase active (not repressed), continually rebuilding its telomeres so the cells can divide indefinitely without triggering senescence."

      - id: q4
        number: "Q54"
        name: "NAD(P)H Fluorescence During the Aerobic–Anaerobic Transition in Yeast"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=7"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The reduced phosphorylated (NADPH) and nonphosphorylated (NADH) pyridine nucleotides have essentially equivalent fluorescence properties while their oxidized forms are non-fluorescent."
            answer: true
            explanation: "The fluorophore in both molecules is the reduced nicotinamide ring; the 2'-phosphate that distinguishes NADPH from NADH sits away from that ring, so their excitation/emission properties are essentially identical. The oxidized forms (NAD⁺/NADP⁺) lack the electron configuration needed to fluoresce."
          - letter: "B"
            text: "Under aerobic conditions, the oxidized nucleotides in cells are reduced, e.g., in the respiratory chain, which leads to an equilibrium between the formation and depletion of NAD(P)H."
            answer: false
            explanation: "This has the respiratory chain's role backwards: the chain oxidizes NADH to NAD⁺ (donating electrons to O₂), it doesn't reduce NAD⁺. Reduction of NAD(P)⁺ happens upstream, in glycolysis and the TCA cycle, not in the respiratory chain itself."
          - letter: "C"
            text: "After the sudden alteration from aerobic to anaerobic conditions (AA transition), the microbes are not able to re-oxidize all the reduced NAD(P)H, which can be tracked as an intracellular step-like increase of NAD(P)H fluorescence intensity."
            answer: true
            explanation: "Switching air sparging to nitrogen sparging removes O₂, the respiratory chain's final electron acceptor, so it can no longer re-oxidize NADH. NAD(P)H accumulates, producing exactly the step-like jump from FI_AE to FI_AN seen in the figure."
          - letter: "D"
            text: "Measurements of NAD(P)H fluorescence intensity during AA transition can indicate the increasing metabolic activity of microbes under stress conditions."
            answer: true
            explanation: "The stem defines the relative fluorescence increase (ΔFI) during the AA transition as exactly this — a measure of yeast metabolic activity — since a larger jump reflects more active dehydrogenases generating NAD(P)H before the anaerobic block on its re-oxidation."

      - id: q5
        number: "Q55"
        name: "X-Irradiation of Yeast — NAD(P)H Fluorescence and Metabolic Recovery"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=8"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The metabolic activity of yeast cells was disrupted under the influence of X-radiation, i.e. the metabolism of yeast cells stopped, and they all died."
            answer: false
            explanation: "X-irradiated cells still show a real, non-zero fluorescence signal at both the aerobic baseline and (weakly) after the switch to anaerobic conditions — dead cells with no residual metabolism would show no signal at all. Metabolism is heavily suppressed, not completely halted, and the cells are not all dead."
          - letter: "B"
            text: "Metabolic processes in yeast changed under the influence of X-radiation, and, as a result, the fluorescent properties of intracellular NADP(H) were altered due to the structural damage of NADPH."
            answer: true
            explanation: "The X-irradiated curve isn't just lower — it loses the characteristic step-like anaerobic jump entirely, a qualitative change in behavior rather than a simple scaling-down, consistent with radiation altering the cell's NADP(H) pool rather than only reducing cell number."
          - letter: "C"
            text: "During the post-irradiation incubation period, due to the repair processes in yeast cells, their metabolism was recovered, and they began to function like native yeasts."
            answer: true
            explanation: "Unlike the flat, unresponsive X-irradiated curve, the recovered cells regain a clear step-like rise upon the AA transition — the qualitative hallmark of a functioning respiratory response returns, even though the plateau doesn't fully reach non-irradiated levels."
          - letter: "D"
            text: "The weak fluorescence intensity of intracellular NADPH of X-irradiated yeasts is associated with a decrease in the amount of NADPH due to a severe decrease in metabolism."
            answer: true
            explanation: "Radiation-induced DNA damage and downstream mitochondrial/metabolic dysfunction reduce the cell's capacity to generate NAD(P)H via glycolysis and the TCA cycle in the first place, so less fluorescent NADPH accumulates even before considering any AA transition."

      - id: q6
        number: "Q56"
        name: "Lysosomal Exocytosis in Cancer Cells"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=10"
        subjects:
          - name: "Endomembrane System & Protein Trafficking"
            link: "/resources/1-cell-molecular/endomembrane-system-protein-trafficking/"
        statements:
          - letter: "A"
            text: "Exosomes, which contain signaling molecules, leave the cell by means of lysosomal exocytosis and promote the conversion of macrophages and fibroblasts into cancer-associated fibroblasts (CAF) and tumor-associated macrophages (TAM)."
            answer: true
            explanation: "The figure shows MVBs fusing into the lysosome, which then fuses with the plasma membrane (Ca²⁺-triggered lysosomal exocytosis) to release exosomes carrying growth factors, transcription factors and cytokines into the ECM, where neighbouring macrophages and fibroblasts take them up and convert into TAM and CAF."
          - letter: "B"
            text: "Weakly alkaline chemotherapeutic drugs tend to accumulate in lysosomes"
            answer: true
            explanation: "Lysosomes are acidic (pH ~4.5–5). A weakly basic drug becomes protonated once inside and can no longer cross the membrane back out — this ion-trapping (lysosomotropism) causes it to accumulate there, matching the 'cancer lysosomotrophic drug' shown concentrated inside the lysosome in the figure."
          - letter: "C"
            text: "Lysosomal exocytosis enables the release of exosomes, which distribute signaling molecules to surround cells."
            answer: true
            explanation: "The figure's legend explicitly labels the released vesicles as exosomes carrying growth factors, transcription factors and cytokines — signaling cargo that reaches and acts on neighbouring cells after lysosomal exocytosis releases it into the ECM."
          - letter: "D"
            text: "One mechanism for cancer cells to become resistant against chemotherapeutics is the efflux of chemotherapeutic drugs, which could occur through lysosomal exocytosis"
            answer: true
            explanation: "Once a lysosomotropic drug is sequestered inside the lysosome (per statement B), lysosomal exocytosis expels that lysosome's contents — including the trapped drug — out of the cell, lowering the intracellular drug concentration and conferring resistance."

      - id: q7
        number: "Q57"
        name: "PIP2/PIP3 Signaling in T Cells — PTEN and Antigen Dose"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=12"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "PIP2 concentration quickly returns to initial levels even when the antigen is still present; thus, it cannot mediate long-term changes in cell fate"
            answer: true
            explanation: "Every PIP2 trace in the figure peaks by ~10 minutes and has collapsed back near baseline by 30 minutes even though the antigen stimulus is still present, consistent with PIP2 acting only as a short-lived trigger rather than a sustained signal."
          - letter: "B"
            text: "Presence of PTEN activity reliably increases the concentration ratio of PIP2 to PIP3"
            answer: false
            explanation: "PTEN converts PIP3 back to PIP2, so intact PTEN does shift the balance toward PIP2 in general — but the statement's claim that this holds 'reliably' overstates it, since the size of the effect clearly differs between the low- and high-dose conditions in the figure rather than being a fixed, dose-independent shift."
          - letter: "C"
            text: "Concentration ratio of PIP2 to PIP3 contains information on the strength of the antigen."
            answer: true
            explanation: "Comparing low- and high-dose traces, the relative balance between PIP2 and PIP3 differs by dose — high-dose stimulation drives proportionally more PIP3 production — so the PIP2:PIP3 ratio does encode information about how strongly the antigen stimulated the cell."
          - letter: "D"
            text: "Since antigen binding mediates production of PIP2, more antigen binding will result in more PIP2 under intact PTEN"
            answer: false
            explanation: "With PTEN intact, higher antigen dose also drives stronger PI3K activity converting PIP2 onward into PIP3, so the net PIP2 seen doesn't simply scale up with antigen dose — more antigen doesn't reliably mean more PIP2 once that faster consumption is accounted for."

      - id: q8
        number: "Q58"
        name: "TAK1 Kinase and Takinib — Competitive vs Non-Competitive Inhibition"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=13"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "A"
            text: "If TAK1 is pre-incubated with 5 μM ATP for 3 hours, then Takinib, added later, acts as a competitive inhibitor."
            answer: true
            explanation: "In Experiment B (pre-incubated with ATP), the curves for all Takinib concentrations converge toward the same Vmax at saturating ATP, only differing in how quickly they approach it — the classic same-Vmax, shifted-apparent-Km signature of competitive inhibition."
          - letter: "B"
            text: "In both experiments, Takinib significantly affects TAK1's Michaelis constant with respect to ATP."
            answer: false
            explanation: "In Experiment A, Takinib lowers Vmax while the curves rise at a similar rate (Km largely unchanged) — a non-competitive pattern, not a Km effect. Only in Experiment B does Takinib behave competitively, so it does not significantly affect Km in both experiments."
          - letter: "C"
            text: "Experiments A and B indicate that TAK1 has another interaction site, in addition to the enzymatic active center."
            answer: true
            explanation: "Takinib's mode of action changes depending on whether ATP has pre-occupied TAK1: non-competitive (lowered Vmax) without pre-incubation, competitive (shifted Km, same Vmax) with it. That switch implies Takinib can engage a site distinct from the catalytic center, one whose availability depends on prior ATP binding."
          - letter: "D"
            text: "If TAK1 was not pre-incubated, then the presence of Takinib could be compensated by an excess of ATP."
            answer: false
            explanation: "In Experiment A, Takinib caps the reaction's Vmax at a lower plateau regardless of how much ATP is added — the defining feature of non-competitive inhibition, where excess substrate cannot outcompete the inhibitor's effect."

      - id: q9
        number: "Q59"
        name: "Mitochondrial Innate Immunity — Yme1L, SLC25A33 and mtDNA Release"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=14"
        subjects:
          - name: "Mitochondria & Chloroplasts: Structure & Endosymbiotic Origin"
            link: "/resources/1-cell-molecular/mitochondria-chloroplasts-structure-origin/"
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "The knockout of Yme1L in cells supports pyrimidine metabolism by maintaining de novo synthesis of nucleotides and proteolysis of SLC25A33."
            answer: false
            explanation: "The figure shows the opposite: losing Yme1L lets SLC25A33 accumulate (Yme1L normally degrades it) and impairs de novo pyrimidine synthesis. Both effects disrupt pyrimidine metabolism rather than supporting it."
          - letter: "B"
            text: "The information presented in this figure indicates that the accumulation of SLC25A33 can cause an immune response."
            answer: true
            explanation: "SLC25A33 accumulation increases mitochondrial pyrimidine uptake, contributing to imbalanced nucleotide pools that trigger mtDNA release; released mtDNA is sensed by cGAS, activating STING and downstream innate immune signalling — a full causal chain traced in the figure."
          - letter: "C"
            text: "TREX1-mediated lysis of DNA can restore the imbalance of nucleotides in the cell."
            answer: true
            explanation: "The figure shows TREX1 degrading released mtDNA fragments, with an explicit arrow from that degradation to 'replenishment of nucleotide pools' — feeding back to reduce the nucleotide imbalance that triggered mtDNA release in the first place."
          - letter: "D"
            text: "The inhibition of the mitochondrial protease Yme1L downregulates the expression of genes needed for interferon production."
            answer: false
            explanation: "Losing Yme1L drives the pathway toward MORE mtDNA release and cGAS-STING activation, which upregulates interferon-stimulated gene expression, not downregulates it — the opposite of what the statement claims."

      - id: q10
        number: "Q60"
        name: "Alzheimer's Disease — APP Processing by α-, β- and γ-Secretases"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=16"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "α-secretase cleaves the mature APP in a certain location and, thus, prevents the formation of β-amyloid."
            answer: true
            explanation: "α-secretase cuts within the Aβ sequence itself, physically severing it before it can ever form as an intact peptide. The resulting C-terminal fragment, lacking part of the Aβ sequence, can only yield the non-amyloidogenic p3 fragment after γ-cleavage — never full Aβ."
          - letter: "B"
            text: "β- and γ-secretases take part in the formation of the β-amyloid peptide."
            answer: true
            explanation: "β-secretase cleaves at the N-terminal boundary of the Aβ domain, leaving a membrane-bound fragment that still contains the complete Aβ sequence; γ-secretase then cleaves within the membrane at the C-terminal boundary, releasing the intact Aβ peptide. Both cleavages are required."
          - letter: "C"
            text: "Two transmembrane protein fragments are formed due to α-secretase activity: the N-terminal fragment and the C-terminal fragment."
            answer: false
            explanation: "α-cleavage produces one soluble, secreted N-terminal fragment (sAPPα, released extracellularly — not membrane-bound) and one membrane-anchored C-terminal fragment. Only the C-terminal piece is actually transmembrane."
          - letter: "D"
            text: "In the C-terminal transmembrane fragment, formed due to α-secretase activity, the α-helical structure dominates."
            answer: false
            explanation: "This reproduces the official key's call. The C-terminal fragment retains APP's transmembrane span, which would be expected to be largely α-helical like most TM domains — but the key marks this false, likely reflecting the β-sheet-forming propensity of the Aβ-derived portion once it is processed, which the exam appears to weight as the dominant structural feature."

      - id: q11
        number: "Q61"
        name: "RNA Virus Replication Cycles — Genome Classification"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=17"
        subjects:
          - name: "Nucleotide & Nucleic Acid Chemistry"
            link: "/resources/1-cell-molecular/nucleotide-nucleic-acid-chemistry/"
        statements:
          - letter: "A"
            text: "The genome of (+)RNA viruses encodes many proteins, including the RNA-dependent RNA-polymerase"
            answer: true
            explanation: "A (+)RNA genome can be read directly by host ribosomes as mRNA, so it must itself encode every protein needed for replication, including the RNA-dependent RNA polymerase used to copy the genome."
          - letter: "B"
            text: "In all RNA-containing viruses, the RNA-dependent RNA-polymerase enters the target cell with RNA."
            answer: false
            explanation: "(+)RNA viruses don't need to package RdRp in the virion at all — their genome is translated directly upon entry to produce RdRp. Only viruses whose genome can't be directly translated (negative-strand and double-strand RNA viruses) must carry pre-packaged RdRp."
          - letter: "C"
            text: "During the replication process of double-strand (+-) RNA viruses, the single-stranded (+) RNA molecules synthesized in the target cells ensure viral protein synthesis by the host cell's ribosomes and serve as a template for the synthesis of (-) RNA chains with the participation of viral RNA polymerase."
            answer: true
            explanation: "The packaged RdRp of a dsRNA virus transcribes (+) strands, which do double duty: host ribosomes translate them into viral proteins, and the same (+) strands also serve as templates for RdRp to synthesize new (-) strands, rebuilding the double-stranded genome."
          - letter: "D"
            text: "The genome of retroviruses encodes the reverse transcriptase enzyme, which is included in the viral particle and ensures the synthesis of DNA from viral RNA upon infection."
            answer: true
            explanation: "Retroviruses encode reverse transcriptase in their pol gene and package the enzyme into the virion itself, so it's ready immediately after entry to convert the (+)RNA genome into dsDNA for integration into the host genome."

      - id: q12
        number: "Q62"
        name: "Pine Needle Cross-Section — Resin Duct and Mesophyll"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=19"
        subjects:
          - name: "Leaf Anatomy"
            link: "/resources/6-plant-anatomy/leaf-anatomy/"
        statements:
          - letter: "A"
            text: "The cells labeled with b capture and assimilate CO2 into sugars."
            answer: true
            explanation: "Structure b is the mesophyll tissue filling most of the section, packed with the small dotted inclusions typical of chloroplasts — the site where CO₂ is fixed into sugar via the Calvin cycle."
          - letter: "B"
            text: "The space labeled with c regulates water loss."
            answer: false
            explanation: "Space c is an air cavity near the epidermis, not a stomatal pore — water-loss regulation is the job of guard cells flanking a stoma, which aren't what's labeled here."
          - letter: "C"
            text: "The structure labeled with a carries water and nutrition to different parts of the plants."
            answer: false
            explanation: "Structure a is a ring of epithelial-type cells around a central empty lumen — the profile of a resin duct, not a vascular bundle. It doesn't function as a water/nutrient transport conduit at all."
          - letter: "D"
            text: "The structure labeled with a produces and stores resin."
            answer: true
            explanation: "The ring of secretory cells surrounding a central canal in structure a is characteristic of a conifer resin duct: the epithelial cells lining the canal produce resin, which accumulates in the central space."

      - id: q13
        number: "Q63"
        name: "Land Plant Phylogeny — Evaluating Four Cladograms"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=20"
        subjects:
          - name: "Plant Body Plans Across Major Lineages"
            link: "/resources/6-plant-anatomy/plant-body-plans-major-lineages/"
        statements:
          - letter: "A"
            text: "Cladogram I."
            answer: true
            explanation: "Cladogram I groups moss and hornwort as sisters with green alga as the outgroup — a reasonable grouping of two bryophyte lineages to the exclusion of a non-land-plant alga."
          - letter: "B"
            text: "Cladogram II."
            answer: false
            explanation: "Cladogram II pairs fern with cycad as sisters, leaving pine as the outgroup — but cycad and pine are both seed plants (gymnosperms) and should form a clade together, to the exclusion of fern, a seedless vascular plant. The tree groups the wrong two taxa."
          - letter: "C"
            text: "Cladogram III."
            answer: false
            explanation: "Cladogram III pairs fern with liverwort as sisters, leaving club-moss as the outgroup — but liverwort is a non-vascular bryophyte while fern and club-moss are both vascular plants, so fern should group with club-moss instead, not with liverwort."
          - letter: "D"
            text: "Cladogram IV."
            answer: true
            explanation: "Cladogram IV groups moss and horsetail as sisters with green alga as the outgroup — correctly keeping the land plants (moss, horsetail) together as a clade separate from the non-land-plant green alga."

      - id: q14
        number: "Q64"
        name: "The C4 Rice Project — Engineering C4 Photosynthesis into a C3 Crop"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=21"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "A"
            text: "The modified C4 rice plants will have both altered biochemical and developmental pathways."
            answer: true
            explanation: "Converting rice to C4 needs new biochemistry (PEP carboxylase, decarboxylases, coordinated cell-specific expression) and new development (Kranz anatomy — enlarged, chloroplast-differentiated bundle sheath cells), so both dimensions must change."
          - letter: "B"
            text: "The enzyme Rubisco will be non-functional in modified C4 rice plants."
            answer: false
            explanation: "C4 photosynthesis doesn't eliminate Rubisco — it concentrates CO₂ around it in the bundle sheath cells so it works more efficiently with less photorespiration. Rubisco remains essential and fully functional."
          - letter: "C"
            text: "C4 rice plants must have smaller stomatal pore size to decrease rates of transpiration and increase photosynthetic water use efficiency."
            answer: false
            explanation: "C4 plants gain water-use efficiency from their CO₂-concentrating biochemistry allowing lower stomatal conductance for the same carbon gain, not from anatomically smaller stomatal pores — the C4 Rice Project targets the concentrating mechanism, not stomatal pore size."
          - letter: "D"
            text: "Genes for decarboxylase enzymes will need to be introduced into the C4 rice plants."
            answer: true
            explanation: "The C4 cycle depends on a bundle-sheath-localized decarboxylase (e.g. NADP-malic enzyme) to release CO₂ from the transported C4 acid near Rubisco. Rice lacks this bundle-sheath decarboxylase activity, so the corresponding genes need to be introduced and correctly targeted."

      - id: q15
        number: "Q65"
        name: "Arabidopsis Sun vs Shade Leaves — Cross-Section Comparison"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=22"
        subjects:
          - name: "Leaf Anatomy"
            link: "/resources/6-plant-anatomy/leaf-anatomy/"
        statements:
          - letter: "A"
            text: "The cells labeled with 1 capture and assimilate CO2 into sugars."
            answer: true
            explanation: "Label 1 marks the elongated palisade mesophyll cells, densely packed with chloroplasts — the leaf's primary site for fixing CO₂ into sugar via the Calvin cycle."
          - letter: "B"
            text: "The cells labeled with 2 demonstrate Kranz anatomy."
            answer: false
            explanation: "Kranz anatomy is the bundle-sheath-centered wreath arrangement specific to C4 plants. Arabidopsis is a C3 plant, so no cells in either cross-section — including those labeled 2 — display Kranz anatomy."
          - letter: "C"
            text: "The leaf on the left was grown under direct sunlight, while the leaf on the right was in the shade."
            answer: true
            explanation: "The left cross-section is thicker with well-developed, elongated palisade layers — typical of a sun leaf maximizing carbon-fixation capacity. The right section is thinner with looser, less organized mesophyll — typical of a shade leaf maximizing light capture per unit tissue."
          - letter: "D"
            text: "The cells labeled with 3 have a lower Rubisco/chlorophyll ratio than cells labeled with 1."
            answer: true
            explanation: "Cells at label 1 are sun-leaf palisade cells, optimized for carbon fixation under high light and so invest more in Rubisco relative to chlorophyll. Cells at label 3 are spongy mesophyll, optimized for capturing limited light rather than fixing carbon at maximum rate, so they invest relatively more in chlorophyll and less in Rubisco — a lower Rubisco:chlorophyll ratio."

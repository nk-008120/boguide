        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "When the normal cell turns cancerous, it switches its glucose metabolism from oxidative phosphorylation to aerobic glycolysis."
            answer: true
            explanation: "Quiescent normal cells run pyruvate through PDC into the TCA cycle for ~36 ATP via oxidative phosphorylation. Cancer cells overexpress PDKs, which inactivate PDC and reroute pyruvate to lactate even with oxygen present — exactly the oxidative-phosphorylation-to-aerobic-glycolysis switch (the Warburg effect) described in the statement."
          - letter: "B"
            text: "Cancer cells undergo alterations in metabolic pathways that enable them to suppress glucose uptake and glycolysis. This leads to stimulation of ATP production in the TCA cycle in normal conditions."
            answer: false
            explanation: "Both halves are backwards: cancer cells sharply increase glucose uptake and glycolytic flux (not suppress it), while TCA-cycle ATP production actually falls because PDK-mediated PDC inactivation starves the cycle of acetyl-CoA."
          - letter: "C"
            text: "In rapidly growing tumors where hypoxia occurs, increased glycolysis can not support sufficient ATP production and bioenergetic homeostasis of cells."
            answer: false
            explanation: "Aerobic glycolysis yields far less ATP per glucose than oxidative phosphorylation, but tumor cells compensate with massively increased glucose uptake and glycolytic flux — this is precisely what lets glycolysis sustain their energy balance despite hypoxia."
          - letter: "D"
            text: "In cancer cells, beyond the increase of glycolysis, increased glutaminolysis and fatty acid biosynthesis, generate TCA cycle intermediates, which are often used for anabolic and bioenergetic purposes."
            answer: true
            explanation: "Figure 1b shows glutamine imported and converted via glutaminase to glutamate, then α-ketoglutarate, refilling the TCA cycle (anaplerosis) despite reduced pyruvate entry. Citrate exported from this cycle feeds lipid synthesis — supporting both anabolic and bioenergetic needs of the proliferating cell."

      - id: q2
        number: "Q52"
        name: "Cryopyrin Inflammasome — Western Blot of WT and Mutant Variants"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=4"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Cryopyrin-dependent IL-1β production is not dependent on ASC."
            answer: false
            explanation: "In the 293-caspase-1 cells (no ASC), none of the cryopyrin constructs produce detectable p35 or IL-1β, while the same WT construct does produce them in 293-ASC-caspase-1 cells (which express ASC). Cryopyrin therefore needs ASC to activate caspase-1."
          - letter: "B"
            text: "The R260W mutant is partially active, as compared to wild type cryopyrin."
            answer: false
            explanation: "R260W shows no detectable p35 or IL-1β in either cell line — indistinguishable from the empty-vector control. A partially active mutant would show reduced but visible cleavage bands, which isn't observed; R260W behaves as a loss-of-function mutant here, not a partial one."
          - letter: "C"
            text: "The D303N mutant does not contain a truncating mutation early in the gene sequence."
            answer: true
            explanation: "The cryopyrin blot shows D303N expressed at a similar size and intensity to WT cryopyrin. A truncating mutation early in the sequence would produce a short or undetectable protein, which is not what's observed — so D303N is a full-length missense variant, not a truncation."
          - letter: "D"
            text: "IPAF-ΔLRR served as a positive control in this experiment for each cell line."
            answer: true
            explanation: "IPAF-ΔLRR causes procaspase-1 autocleavage independently of cryopyrin or ASC. It produces clear p35 and IL-1β bands in both cell lines regardless of ASC status, giving a maximum-signal benchmark that confirms the caspase-1 cleavage machinery works in each line."

      - id: q3
        number: "Q53"
        name: "Telomerase — Mechanism of Telomere Extension"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=5"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "A"
            text: "The protein component of telomerase is sufficient to elongate telomeres."
            answer: false
            explanation: "Telomerase is a ribonucleoprotein — its reverse-transcriptase protein subunit needs the enzyme's own RNA component (containing the CAAUCC template) to know what sequence to add. Protein alone has no template to copy from."
          - letter: "B"
            text: "The mother strand of DNA is sequentially elongated on the 3' end, using the telomerase RNA as a template."
            answer: true
            explanation: "Figures 1b–d show the parental (mother) strand's 3' overhang being extended by telomerase's reverse-transcriptase activity, using the enzyme's internal CAAUCC RNA as template, then translocating to repeat the process."
          - letter: "C"
            text: "Loss-of-function mutations in the telomerase protein are likely to cause diseases such as progeria or bone-marrow failure."
            answer: true
            explanation: "Without functional telomerase, telomeres shorten uncorrected with each division, driving premature cellular senescence in high-turnover tissues — consistent with telomerase-deficiency syndromes that present with bone-marrow failure and premature-aging features."
          - letter: "D"
            text: "Telomere length has a threshold value in cells and in HeLa cells telomerase is repressed to maintain this threshold value."
            answer: false
            explanation: "HeLa is an immortalized cancer cell line specifically because it keeps telomerase active (not repressed), continually rebuilding its telomeres so the cells can divide indefinitely without triggering senescence."

      - id: q4
        number: "Q54"
        name: "NAD(P)H Fluorescence During the Aerobic–Anaerobic Transition in Yeast"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=7"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The reduced phosphorylated (NADPH) and nonphosphorylated (NADH) pyridine nucleotides have essentially equivalent fluorescence properties while their oxidized forms are non-fluorescent."
            answer: true
            explanation: "The fluorophore in both molecules is the reduced nicotinamide ring; the 2'-phosphate that distinguishes NADPH from NADH sits away from that ring, so their excitation/emission properties are essentially identical. The oxidized forms (NAD⁺/NADP⁺) lack the electron configuration needed to fluoresce."
          - letter: "B"
            text: "Under aerobic conditions, the oxidized nucleotides in cells are reduced, e.g., in the respiratory chain, which leads to an equilibrium between the formation and depletion of NAD(P)H."
            answer: false
            explanation: "This has the respiratory chain's role backwards: the chain oxidizes NADH to NAD⁺ (donating electrons to O₂), it doesn't reduce NAD⁺. Reduction of NAD(P)⁺ happens upstream, in glycolysis and the TCA cycle, not in the respiratory chain itself."
          - letter: "C"
            text: "After the sudden alteration from aerobic to anaerobic conditions (AA transition), the microbes are not able to re-oxidize all the reduced NAD(P)H, which can be tracked as an intracellular step-like increase of NAD(P)H fluorescence intensity."
            answer: true
            explanation: "Switching air sparging to nitrogen sparging removes O₂, the respiratory chain's final electron acceptor, so it can no longer re-oxidize NADH. NAD(P)H accumulates, producing exactly the step-like jump from FI_AE to FI_AN seen in the figure."
          - letter: "D"
            text: "Measurements of NAD(P)H fluorescence intensity during AA transition can indicate the increasing metabolic activity of microbes under stress conditions."
            answer: true
            explanation: "The stem defines the relative fluorescence increase (ΔFI) during the AA transition as exactly this — a measure of yeast metabolic activity — since a larger jump reflects more active dehydrogenases generating NAD(P)H before the anaerobic block on its re-oxidation."

      - id: q5
        number: "Q55"
        name: "X-Irradiation of Yeast — NAD(P)H Fluorescence and Metabolic Recovery"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=8"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The metabolic activity of yeast cells was disrupted under the influence of X-radiation, i.e. the metabolism of yeast cells stopped, and they all died."
            answer: false
            explanation: "X-irradiated cells still show a real, non-zero fluorescence signal at both the aerobic baseline and (weakly) after the switch to anaerobic conditions — dead cells with no residual metabolism would show no signal at all. Metabolism is heavily suppressed, not completely halted, and the cells are not all dead."
          - letter: "B"
            text: "Metabolic processes in yeast changed under the influence of X-radiation, and, as a result, the fluorescent properties of intracellular NADP(H) were altered due to the structural damage of NADPH."
            answer: true
            explanation: "The X-irradiated curve isn't just lower — it loses the characteristic step-like anaerobic jump entirely, a qualitative change in behavior rather than a simple scaling-down, consistent with radiation altering the cell's NADP(H) pool rather than only reducing cell number."
          - letter: "C"
            text: "During the post-irradiation incubation period, due to the repair processes in yeast cells, their metabolism was recovered, and they began to function like native yeasts."
            answer: true
            explanation: "Unlike the flat, unresponsive X-irradiated curve, the recovered cells regain a clear step-like rise upon the AA transition — the qualitative hallmark of a functioning respiratory response returns, even though the plateau doesn't fully reach non-irradiated levels."
          - letter: "D"
            text: "The weak fluorescence intensity of intracellular NADPH of X-irradiated yeasts is associated with a decrease in the amount of NADPH due to a severe decrease in metabolism."
            answer: true
            explanation: "Radiation-induced DNA damage and downstream mitochondrial/metabolic dysfunction reduce the cell's capacity to generate NAD(P)H via glycolysis and the TCA cycle in the first place, so less fluorescent NADPH accumulates even before considering any AA transition."

      - id: q6
        number: "Q56"
        name: "Lysosomal Exocytosis in Cancer Cells"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=10"
        subjects:
          - name: "Endomembrane System & Protein Trafficking"
            link: "/resources/1-cell-molecular/endomembrane-system-protein-trafficking/"
        statements:
          - letter: "A"
            text: "Exosomes, which contain signaling molecules, leave the cell by means of lysosomal exocytosis and promote the conversion of macrophages and fibroblasts into cancer-associated fibroblasts (CAF) and tumor-associated macrophages (TAM)."
            answer: true
            explanation: "The figure shows MVBs fusing into the lysosome, which then fuses with the plasma membrane (Ca²⁺-triggered lysosomal exocytosis) to release exosomes carrying growth factors, transcription factors and cytokines into the ECM, where neighbouring macrophages and fibroblasts take them up and convert into TAM and CAF."
          - letter: "B"
            text: "Weakly alkaline chemotherapeutic drugs tend to accumulate in lysosomes"
            answer: true
            explanation: "Lysosomes are acidic (pH ~4.5–5). A weakly basic drug becomes protonated once inside and can no longer cross the membrane back out — this ion-trapping (lysosomotropism) causes it to accumulate there, matching the 'cancer lysosomotrophic drug' shown concentrated inside the lysosome in the figure."
          - letter: "C"
            text: "Lysosomal exocytosis enables the release of exosomes, which distribute signaling molecules to surround cells."
            answer: true
            explanation: "The figure's legend explicitly labels the released vesicles as exosomes carrying growth factors, transcription factors and cytokines — signaling cargo that reaches and acts on neighbouring cells after lysosomal exocytosis releases it into the ECM."
          - letter: "D"
            text: "One mechanism for cancer cells to become resistant against chemotherapeutics is the efflux of chemotherapeutic drugs, which could occur through lysosomal exocytosis"
            answer: true
            explanation: "Once a lysosomotropic drug is sequestered inside the lysosome (per statement B), lysosomal exocytosis expels that lysosome's contents — including the trapped drug — out of the cell, lowering the intracellular drug concentration and conferring resistance."

      - id: q7
        number: "Q57"
        name: "PIP2/PIP3 Signaling in T Cells — PTEN and Antigen Dose"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=12"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "PIP2 concentration quickly returns to initial levels even when the antigen is still present; thus, it cannot mediate long-term changes in cell fate"
            answer: true
            explanation: "Every PIP2 trace in the figure peaks by ~10 minutes and has collapsed back near baseline by 30 minutes even though the antigen stimulus is still present, consistent with PIP2 acting only as a short-lived trigger rather than a sustained signal."
          - letter: "B"
            text: "Presence of PTEN activity reliably increases the concentration ratio of PIP2 to PIP3"
            answer: false
            explanation: "PTEN converts PIP3 back to PIP2, so intact PTEN does shift the balance toward PIP2 in general — but the statement's claim that this holds 'reliably' overstates it, since the size of the effect clearly differs between the low- and high-dose conditions in the figure rather than being a fixed, dose-independent shift."
          - letter: "C"
            text: "Concentration ratio of PIP2 to PIP3 contains information on the strength of the antigen."
            answer: true
            explanation: "Comparing low- and high-dose traces, the relative balance between PIP2 and PIP3 differs by dose — high-dose stimulation drives proportionally more PIP3 production — so the PIP2:PIP3 ratio does encode information about how strongly the antigen stimulated the cell."
          - letter: "D"
            text: "Since antigen binding mediates production of PIP2, more antigen binding will result in more PIP2 under intact PTEN"
            answer: false
            explanation: "With PTEN intact, higher antigen dose also drives stronger PI3K activity converting PIP2 onward into PIP3, so the net PIP2 seen doesn't simply scale up with antigen dose — more antigen doesn't reliably mean more PIP2 once that faster consumption is accounted for."

      - id: q8
        number: "Q58"
        name: "TAK1 Kinase and Takinib — Competitive vs Non-Competitive Inhibition"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=13"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "A"
            text: "If TAK1 is pre-incubated with 5 μM ATP for 3 hours, then Takinib, added later, acts as a competitive inhibitor."
            answer: true
            explanation: "In Experiment B (pre-incubated with ATP), the curves for all Takinib concentrations converge toward the same Vmax at saturating ATP, only differing in how quickly they approach it — the classic same-Vmax, shifted-apparent-Km signature of competitive inhibition."
          - letter: "B"
            text: "In both experiments, Takinib significantly affects TAK1's Michaelis constant with respect to ATP."
            answer: false
            explanation: "In Experiment A, Takinib lowers Vmax while the curves rise at a similar rate (Km largely unchanged) — a non-competitive pattern, not a Km effect. Only in Experiment B does Takinib behave competitively, so it does not significantly affect Km in both experiments."
          - letter: "C"
            text: "Experiments A and B indicate that TAK1 has another interaction site, in addition to the enzymatic active center."
            answer: true
            explanation: "Takinib's mode of action changes depending on whether ATP has pre-occupied TAK1: non-competitive (lowered Vmax) without pre-incubation, competitive (shifted Km, same Vmax) with it. That switch implies Takinib can engage a site distinct from the catalytic center, one whose availability depends on prior ATP binding."
          - letter: "D"
            text: "If TAK1 was not pre-incubated, then the presence of Takinib could be compensated by an excess of ATP."
            answer: false
            explanation: "In Experiment A, Takinib caps the reaction's Vmax at a lower plateau regardless of how much ATP is added — the defining feature of non-competitive inhibition, where excess substrate cannot outcompete the inhibitor's effect."

      - id: q9
        number: "Q59"
        name: "Mitochondrial Innate Immunity — Yme1L, SLC25A33 and mtDNA Release"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=14"
        subjects:
          - name: "Mitochondria & Chloroplasts: Structure & Endosymbiotic Origin"
            link: "/resources/1-cell-molecular/mitochondria-chloroplasts-structure-origin/"
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "The knockout of Yme1L in cells supports pyrimidine metabolism by maintaining de novo synthesis of nucleotides and proteolysis of SLC25A33."
            answer: false
            explanation: "The figure shows the opposite: losing Yme1L lets SLC25A33 accumulate (Yme1L normally degrades it) and impairs de novo pyrimidine synthesis. Both effects disrupt pyrimidine metabolism rather than supporting it."
          - letter: "B"
            text: "The information presented in this figure indicates that the accumulation of SLC25A33 can cause an immune response."
            answer: true
            explanation: "SLC25A33 accumulation increases mitochondrial pyrimidine uptake, contributing to imbalanced nucleotide pools that trigger mtDNA release; released mtDNA is sensed by cGAS, activating STING and downstream innate immune signalling — a full causal chain traced in the figure."
          - letter: "C"
            text: "TREX1-mediated lysis of DNA can restore the imbalance of nucleotides in the cell."
            answer: true
            explanation: "The figure shows TREX1 degrading released mtDNA fragments, with an explicit arrow from that degradation to 'replenishment of nucleotide pools' — feeding back to reduce the nucleotide imbalance that triggered mtDNA release in the first place."
          - letter: "D"
            text: "The inhibition of the mitochondrial protease Yme1L downregulates the expression of genes needed for interferon production."
            answer: false
            explanation: "Losing Yme1L drives the pathway toward MORE mtDNA release and cGAS-STING activation, which upregulates interferon-stimulated gene expression, not downregulates it — the opposite of what the statement claims."

      - id: q10
        number: "Q60"
        name: "Alzheimer's Disease — APP Processing by α-, β- and γ-Secretases"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=16"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "α-secretase cleaves the mature APP in a certain location and, thus, prevents the formation of β-amyloid."
            answer: true
            explanation: "α-secretase cuts within the Aβ sequence itself, physically severing it before it can ever form as an intact peptide. The resulting C-terminal fragment, lacking part of the Aβ sequence, can only yield the non-amyloidogenic p3 fragment after γ-cleavage — never full Aβ."
          - letter: "B"
            text: "β- and γ-secretases take part in the formation of the β-amyloid peptide."
            answer: true
            explanation: "β-secretase cleaves at the N-terminal boundary of the Aβ domain, leaving a membrane-bound fragment that still contains the complete Aβ sequence; γ-secretase then cleaves within the membrane at the C-terminal boundary, releasing the intact Aβ peptide. Both cleavages are required."
          - letter: "C"
            text: "Two transmembrane protein fragments are formed due to α-secretase activity: the N-terminal fragment and the C-terminal fragment."
            answer: false
            explanation: "α-cleavage produces one soluble, secreted N-terminal fragment (sAPPα, released extracellularly — not membrane-bound) and one membrane-anchored C-terminal fragment. Only the C-terminal piece is actually transmembrane."
          - letter: "D"
            text: "In the C-terminal transmembrane fragment, formed due to α-secretase activity, the α-helical structure dominates."
            answer: false
            explanation: "This reproduces the official key's call. The C-terminal fragment retains APP's transmembrane span, which would be expected to be largely α-helical like most TM domains — but the key marks this false, likely reflecting the β-sheet-forming propensity of the Aβ-derived portion once it is processed, which the exam appears to weight as the dominant structural feature."

      - id: q11
        number: "Q61"
        name: "RNA Virus Replication Cycles — Genome Classification"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=17"
        subjects:
          - name: "Nucleotide & Nucleic Acid Chemistry"
            link: "/resources/1-cell-molecular/nucleotide-nucleic-acid-chemistry/"
        statements:
          - letter: "A"
            text: "The genome of (+)RNA viruses encodes many proteins, including the RNA-dependent RNA-polymerase"
            answer: true
            explanation: "A (+)RNA genome can be read directly by host ribosomes as mRNA, so it must itself encode every protein needed for replication, including the RNA-dependent RNA polymerase used to copy the genome."
          - letter: "B"
            text: "In all RNA-containing viruses, the RNA-dependent RNA-polymerase enters the target cell with RNA."
            answer: false
            explanation: "(+)RNA viruses don't need to package RdRp in the virion at all — their genome is translated directly upon entry to produce RdRp. Only viruses whose genome can't be directly translated (negative-strand and double-strand RNA viruses) must carry pre-packaged RdRp."
          - letter: "C"
            text: "During the replication process of double-strand (+-) RNA viruses, the single-stranded (+) RNA molecules synthesized in the target cells ensure viral protein synthesis by the host cell's ribosomes and serve as a template for the synthesis of (-) RNA chains with the participation of viral RNA polymerase."
            answer: true
            explanation: "The packaged RdRp of a dsRNA virus transcribes (+) strands, which do double duty: host ribosomes translate them into viral proteins, and the same (+) strands also serve as templates for RdRp to synthesize new (-) strands, rebuilding the double-stranded genome."
          - letter: "D"
            text: "The genome of retroviruses encodes the reverse transcriptase enzyme, which is included in the viral particle and ensures the synthesis of DNA from viral RNA upon infection."
            answer: true
            explanation: "Retroviruses encode reverse transcriptase in their pol gene and package the enzyme into the virion itself, so it's ready immediately after entry to convert the (+)RNA genome into dsDNA for integration into the host genome."

      - id: q12
        number: "Q62"
        name: "Pine Needle Cross-Section — Resin Duct and Mesophyll"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=19"
        subjects:
          - name: "Leaf Anatomy"
            link: "/resources/6-plant-anatomy/leaf-anatomy/"
        statements:
          - letter: "A"
            text: "The cells labeled with b capture and assimilate CO2 into sugars."
            answer: true
            explanation: "Structure b is the mesophyll tissue filling most of the section, packed with the small dotted inclusions typical of chloroplasts — the site where CO₂ is fixed into sugar via the Calvin cycle."
          - letter: "B"
            text: "The space labeled with c regulates water loss."
            answer: false
            explanation: "Space c is an air cavity near the epidermis, not a stomatal pore — water-loss regulation is the job of guard cells flanking a stoma, which aren't what's labeled here."
          - letter: "C"
            text: "The structure labeled with a carries water and nutrition to different parts of the plants."
            answer: false
            explanation: "Structure a is a ring of epithelial-type cells around a central empty lumen — the profile of a resin duct, not a vascular bundle. It doesn't function as a water/nutrient transport conduit at all."
          - letter: "D"
            text: "The structure labeled with a produces and stores resin."
            answer: true
            explanation: "The ring of secretory cells surrounding a central canal in structure a is characteristic of a conifer resin duct: the epithelial cells lining the canal produce resin, which accumulates in the central space."

      - id: q13
        number: "Q63"
        name: "Land Plant Phylogeny — Evaluating Four Cladograms"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=20"
        subjects:
          - name: "Plant Body Plans Across Major Lineages"
            link: "/resources/6-plant-anatomy/plant-body-plans-major-lineages/"
        statements:
          - letter: "A"
            text: "Cladogram I."
            answer: true
            explanation: "Cladogram I groups moss and hornwort as sisters with green alga as the outgroup — a reasonable grouping of two bryophyte lineages to the exclusion of a non-land-plant alga."
          - letter: "B"
            text: "Cladogram II."
            answer: false
            explanation: "Cladogram II pairs fern with cycad as sisters, leaving pine as the outgroup — but cycad and pine are both seed plants (gymnosperms) and should form a clade together, to the exclusion of fern, a seedless vascular plant. The tree groups the wrong two taxa."
          - letter: "C"
            text: "Cladogram III."
            answer: false
            explanation: "Cladogram III pairs fern with liverwort as sisters, leaving club-moss as the outgroup — but liverwort is a non-vascular bryophyte while fern and club-moss are both vascular plants, so fern should group with club-moss instead, not with liverwort."
          - letter: "D"
            text: "Cladogram IV."
            answer: true
            explanation: "Cladogram IV groups moss and horsetail as sisters with green alga as the outgroup — correctly keeping the land plants (moss, horsetail) together as a clade separate from the non-land-plant green alga."

      - id: q14
        number: "Q64"
        name: "The C4 Rice Project — Engineering C4 Photosynthesis into a C3 Crop"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=21"
        subjects:
          - name: "Calvin Cycle, Photorespiration & C4/CAM Biochemistry"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "A"
            text: "The modified C4 rice plants will have both altered biochemical and developmental pathways."
            answer: true
            explanation: "Converting rice to C4 needs new biochemistry (PEP carboxylase, decarboxylases, coordinated cell-specific expression) and new development (Kranz anatomy — enlarged, chloroplast-differentiated bundle sheath cells), so both dimensions must change."
          - letter: "B"
            text: "The enzyme Rubisco will be non-functional in modified C4 rice plants."
            answer: false
            explanation: "C4 photosynthesis doesn't eliminate Rubisco — it concentrates CO₂ around it in the bundle sheath cells so it works more efficiently with less photorespiration. Rubisco remains essential and fully functional."
          - letter: "C"
            text: "C4 rice plants must have smaller stomatal pore size to decrease rates of transpiration and increase photosynthetic water use efficiency."
            answer: false
            explanation: "C4 plants gain water-use efficiency from their CO₂-concentrating biochemistry allowing lower stomatal conductance for the same carbon gain, not from anatomically smaller stomatal pores — the C4 Rice Project targets the concentrating mechanism, not stomatal pore size."
          - letter: "D"
            text: "Genes for decarboxylase enzymes will need to be introduced into the C4 rice plants."
            answer: true
            explanation: "The C4 cycle depends on a bundle-sheath-localized decarboxylase (e.g. NADP-malic enzyme) to release CO₂ from the transported C4 acid near Rubisco. Rice lacks this bundle-sheath decarboxylase activity, so the corresponding genes need to be introduced and correctly targeted."

      - id: q15
        number: "Q65"
        name: "Arabidopsis Sun vs Shade Leaves — Cross-Section Comparison"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=22"
        subjects:
          - name: "Leaf Anatomy"
            link: "/resources/6-plant-anatomy/leaf-anatomy/"
        statements:
          - letter: "A"
            text: "The cells labeled with 1 capture and assimilate CO2 into sugars."
            answer: true
            explanation: "Label 1 marks the elongated palisade mesophyll cells, densely packed with chloroplasts — the leaf's primary site for fixing CO₂ into sugar via the Calvin cycle."
          - letter: "B"
            text: "The cells labeled with 2 demonstrate Kranz anatomy."
            answer: false
            explanation: "Kranz anatomy is the bundle-sheath-centered wreath arrangement specific to C4 plants. Arabidopsis is a C3 plant, so no cells in either cross-section — including those labeled 2 — display Kranz anatomy."
          - letter: "C"
            text: "The leaf on the left was grown under direct sunlight, while the leaf on the right was in the shade."
            answer: true
            explanation: "The left cross-section is thicker with well-developed, elongated palisade layers — typical of a sun leaf maximizing carbon-fixation capacity. The right section is thinner with looser, less organized mesophyll — typical of a shade leaf maximizing light capture per unit tissue."
          - letter: "D"
            text: "The cells labeled with 3 have a lower Rubisco/chlorophyll ratio than cells labeled with 1."
            answer: true
            explanation: "Cells at label 1 are sun-leaf palisade cells, optimized for carbon fixation under high light and so invest more in Rubisco relative to chlorophyll. Cells at label 3 are spongy mesophyll, optimized for capturing limited light rather than fixing carbon at maximum rate, so they invest relatively more in chlorophyll and less in Rubisco — a lower Rubisco:chlorophyll ratio."

      - id: q16
        number: "Q66"
        name: "Transpiration Rate Differences Between Leaf Surfaces"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=23"
        subjects:
          - name: "Stomatal Physiology & Gas Exchange"
            link: "/resources/5-plant-physiology/stomatal-physiology-gas-exchange/"
        statements:
          - letter: "A"
            text: "Spongy mesophyll causes faster transpiration because it has more air cavities."
            answer: true
            explanation: "The spongy mesophyll layer, which lies just beneath the lower (abaxial) epidermis, has large intercellular air spaces that let water vapor diffuse quickly to the more numerous abaxial stomata, contributing to the faster transpiration seen from the lower surface in the figure."
          - letter: "B"
            text: "Transpiration decreases the water potential in the leaves"
            answer: true
            explanation: "As water evaporates from the moist mesophyll cell walls into the intercellular air spaces and out through the stomata, the mesophyll cells lose water and their water potential drops, which is exactly what pulls more water up through the xylem via the cohesion-tension mechanism."
          - letter: "C"
            text: "Transpiration from the upper surface is slower because it has fewer stomata."
            answer: true
            explanation: "In a typical eudicot (hypostomatous) leaf, the adaxial (upper) surface carries far fewer stomata than the abaxial (lower) surface, so at any given light intensity the upper surface has less total stomatal pore area for water vapor to escape through — matching the lower transpiration curve for the adaxial surface in the figure."
          - letter: "D"
            text: "Air movement would increase transpiration rates from both surfaces."
            answer: true
            explanation: "Air movement strips away the humid boundary layer that builds up next to a leaf surface, steepening the water-vapor concentration gradient between the leaf interior and the outside air. This speeds up diffusion of water vapor out of the stomata on both the adaxial and abaxial surfaces, regardless of how many stomata each surface has."

      - id: q17
        number: "Q67"
        name: "Root Water Transport Pathways — Apoplast vs Symplast"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=24"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "A"
            text: "Cell E regulates the entry of ions into the xylem vessels."
            answer: true
            explanation: "Cell E is the endodermal cell marked with the dark Casparian-strip bands in its wall. Because the strip blocks further apoplastic movement, water and dissolved ions must cross cell E's selectively permeable plasma membrane before reaching the xylem, letting this cell control which ions are ultimately loaded into the vascular tissue."
          - letter: "B"
            text: "G pathway is the symplastic pathway"
            answer: false
            explanation: "In the diagram, the G pathway is the one that keeps hugging the cell-wall spaces around the cell corners rather than cutting through the cell interior — that is the apoplastic route, not the symplastic one, so labeling it as symplastic is incorrect."
          - letter: "C"
            text: "The movement of water along pathway F is slower than along pathway G."
            answer: true
            explanation: "Pathway F cuts through the cytoplasm/vacuole of each cell, meaning water has to cross a plasma membrane at every cell it passes through, which is slower than the low-resistance apoplastic route (G) that moves through the continuous cell-wall space without ever crossing a membrane — until both are forced through cell E by the Casparian strip."
          - letter: "D"
            text: "Water can move from cell to cell only with the help of plasmodesmata."
            answer: false
            explanation: "Water can also cross from cell to cell via the transmembrane pathway, moving directly across the plasma membrane (largely through aquaporins) without ever passing through a plasmodesma, so plasmodesmata are not the only route between cells."

      - id: q18
        number: "Q68"
        name: "Pressure-Flow Model of Phloem Sucrose Transport"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=25"
        subjects:
          - name: "Phloem Transport & Translocation"
            link: "/resources/5-plant-physiology/phloem-transport-translocation/"
        statements:
          - letter: "A"
            text: "The water potential in cell B is the highest"
            answer: false
            explanation: "Cell B is the sieve-tube element right at the source end, where sucrose has just been actively loaded. That sudden jump in solute concentration makes B's water potential drop immediately after loading rather than be the system's highest — it is precisely this low water potential that draws water in by osmosis and builds the pressure described in statement C."
          - letter: "B"
            text: "The concentration of sucrose in cell A is the highest"
            answer: false
            explanation: "Cell A is the mesophyll source cell, but the companion cell actively pumps sucrose out of A and into the sieve tube (cell B) against the concentration gradient. This active loading step means the sieve tube (B) ends up with a higher sucrose concentration than the source cell A itself, not the other way around."
          - letter: "C"
            text: "The difference in pressure potential is the driving force of the transport of sucrose along sieve cells."
            answer: true
            explanation: "This is the pressure-flow (Münch) hypothesis: active loading at the source raises turgor pressure there while unloading at the sink lowers it, and this pressure-potential gradient — not diffusion of sucrose itself — drives the bulk flow of sap through the sieve tube from source to sink."
          - letter: "D"
            text: "Sucrose is transported from the mesophyll cell to B cell without energy expenditure"
            answer: false
            explanation: "Loading sucrose from the mesophyll source cell into the sieve tube is active transport: a proton-sucrose symporter moves sucrose against its concentration gradient, powered by a proton gradient that ATP-driven H+-ATPases must continually maintain, so this step does require energy."

      - id: q19
        number: "Q69"
        name: "Mechanosensitive Ion Channels — OSCA vs Piezo1"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=27"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "In plants, the MA channels can play a role in adaptation of the roots to the soil environment and gravity."
            answer: true
            explanation: "Plants express OSCA-family mechanically activated channels, and root growth constantly involves sensing mechanical resistance from soil particles and gravitational forces — MA channels are a plausible and well-supported mechanism for roots detecting and adapting to these physical cues."
          - letter: "B"
            text: "OSCA-expressing cells respond to hyperosmolarity less intensely, as compared to mechanical stimuli."
            answer: true
            explanation: "Panel a shows hyperosmolarity currents in OSCA1.1/OSCA1.2 cells measured in picoamps (tens of pA), while panel b shows their mechanical-stretch currents measured in nanoamps (several nA) — roughly two orders of magnitude larger. So relative to their mechanical response, the hyperosmolarity response is much smaller."
          - letter: "C"
            text: "OSCA-expressing cells have a similar response to mechanical stimuli as Piezo1 expressing cells."
            answer: true
            explanation: "Panel b shows the mean mechanical-stimulus current for OSCA1.1 (~2 nA) and OSCA1.2 (~4 nA) falling in the same order-of-magnitude range as mPIEZO1 (~3 nA), all clearly elevated above the near-zero Mock control — showing OSCA channels produce a mechanical response comparable in scale to the well-characterized Piezo1 channel."
          - letter: "D"
            text: "From the graphs, we can conclude that OSCA 1.2 protein has no role in sensing mechanical stimuli."
            answer: false
            explanation: "Panel b shows OSCA1.2-expressing cells generate a mean mechanical current of roughly 4 nA, significantly above the near-zero Mock control (marked ***), so the data clearly show OSCA1.2 does contribute to sensing mechanical stimuli."

      - id: q20
        number: "Q70"
        name: "Land Plant Phylogeny and Shared Derived Characters"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=28"
        subjects:
          - name: "History of Life: Origin & Major Transitions"
            link: "/resources/15-evolution/history-of-life-origin-and-major-transitions/"
        statements:
          - letter: "A"
            text: "The shared derived characters of land plants (cyan colored circle labeled 1 on the figure) include multicellular embryos as adaptations for terrestrial life."
            answer: true
            explanation: "Circle 1 sits at the node uniting all embryophytes — literally the group named for developing a multicellular embryo. Retaining and protecting a multicellular embryo (rather than releasing single-celled zygotes into water) is a key synapomorphy that let plants reproduce successfully on land."
          - letter: "B"
            text: "The cladogram suggests that Charophyta is the direct common ancestor of all terrestrial plants."
            answer: false
            explanation: "A cladogram shows relative relatedness, not literal ancestry — Charophyta is drawn as the closest living sister lineage to land plants, but that makes it a relative, not an ancestor; the actual common ancestor is an extinct lineage not represented by any living group on the tree."
          - letter: "C"
            text: "Multicellularity was lost in some embryophyte taxa."
            answer: false
            explanation: "Every lineage inside the embryophyte box in the figure — bryophytes, lycophytes, gymnosperms, and angiosperms — remains multicellular; the tree gives no indication of any land-plant lineage reverting to a unicellular state."
          - letter: "D"
            text: "Rhodophyta are most closely related to Glaucophyta, based on their proximity in the phylogenetic tree."
            answer: false
            explanation: "The branching order in the figure shows Rhodophyta diverging before the node that leads to Glaucophyta, Chlorophyta, Charophyta, and land plants together — so Rhodophyta's actual sister group is that whole remaining clade, not Glaucophyta specifically. Sitting next to each other in the drawing doesn't mean they share the most recent common ancestor."

      - id: q21
        number: "Q71"
        name: "Hippo Pathway Signaling in Blastocyst Implantation"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=29"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "Blastocysts attach to the hormonally stimulated endometrial cells but not to unstimulated ones. Absence of hormonal stimulation will result in almost inevitable failure of implantation of the blastocyst."
            answer: true
            explanation: "Figure 2's bar graph shows attachment at only about 1% for non-stimulated endometrial organoids versus roughly 30% for hormonally stimulated ones (**** significance) — non-stimulated attachment is close enough to zero to call implantation failure almost inevitable without hormonal stimulation."
          - letter: "B"
            text: "Blastocysts develop polar outgrowths when attaching to the endometrium that contribute to the attachment."
            answer: true
            explanation: "The stimulated-condition micrographs in Figure 2 explicitly label \"Attachment\" and \"Polar outgrowths\" with arrows pointing to the same attaching blastoids, showing these outgrowths form specifically as part of the attachment process."
          - letter: "C"
            text: "Hippo pathway activation is crucial for blastoid development."
            answer: false
            explanation: "It's Hippo pathway inhibition, not activation, that promotes blastoid development — the text describes LPA as a Hippo-pathway inhibitor, and Figure 3 shows blastoid yield rising with increasing LPA dose, since inhibiting Hippo frees YAP1 to drive cavitation."
          - letter: "D"
            text: "The interaction with TEAD is important for the function of YAP1 in cavitation."
            answer: true
            explanation: "Figure 3's cavitation graph shows that WT and the constitutively active 5SA mutant (both able to bind TEAD) produce high cavitation, while the S94A mutant — which specifically cannot bind TEAD — produces cavitation not significantly different from control (\"NS\"). This shows TEAD binding is required for YAP1 to drive cavitation."

      - id: q22
        number: "Q72"
        name: "Mechanisms of Synaptic Specificity"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=31"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "One neuron type has cell recognition proteins, which bind selectively to receptors on the surface of postsynaptic cells; recognition leads to an adhesive interaction which facilitates or blocks synapse formation between appropriate partners."
            answer: true
            explanation: "This describes exactly the \"Adhesion\" step in the figure, where matching cell-surface recognition proteins on the axon and the correct dendritic partner bind selectively and trigger an adhesive interaction, letting synapses form preferentially between compatible cells."
          - letter: "B"
            text: "In traumatic brain injuries, cell adhesion molecules direct cellular processes that inhibit post-traumatic neuronal plasticity during recovery."
            answer: false
            explanation: "The figure is about developmental synaptic-specificity mechanisms, not injury, and this statement mischaracterizes their role — cell adhesion molecules are generally understood to support, not inhibit, synaptic remodeling and plasticity during recovery after injury."
          - letter: "C"
            text: "Synaptic connections could rewire as a result of suboptimal functionality of the original connection."
            answer: true
            explanation: "This matches the \"Elimination\" step in the figure: synapses formed with the wrong or underperforming partner are pruned away, and the resulting free axon/dendrite branches can then form new, better-functioning connections — the basis of activity-dependent circuit refinement."
          - letter: "D"
            text: "In many regions of the nervous system, axons or dendrites branch in just one or a few of several narrow, parallel strata within a target area."
            answer: true
            explanation: "This matches the \"Subcellular localization\" step in the figure, where axon terminals restrict their branching to specific narrow sublayers within a broader dendritic target zone rather than spreading throughout it — a pattern seen in laminated circuits such as the retina."

      - id: q23
        number: "Q73"
        name: "PD-1 Immune Checkpoint Signaling"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=34"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "PD-1 dysfunction can lead to development of autoimmune diseases."
            answer: true
            explanation: "PD-1 normally delivers a co-inhibitory signal that dampens T cell activity and enforces tolerance to the body's own proteins. Losing this brake through PD-1 dysfunction removes an important check on self-reactive T cells, which is a well-documented route to autoimmune disease."
          - letter: "B"
            text: "PD-1, when binding to its ligand-PD-L1, activates antitumor immune response."
            answer: false
            explanation: "PD-1/PD-L1 binding does the opposite — it delivers a co-inhibitory signal that suppresses T cell function, which is exactly the mechanism cancer cells exploit to dampen antitumor immunity rather than activate it."
          - letter: "C"
            text: "The inhibition of the PD-1/PD-L1-axis prevents T cells from recognizing tumor cells as \"self\" and enables their destruction"
            answer: true
            explanation: "By blocking PD-1/PD-L1 signaling, checkpoint inhibition removes the co-inhibitory signal that had been letting tumor cells look tolerable to T cells; freed from that suppression, T cells can then recognize and destroy the tumor cells — consistent with the text's note that targeting this pathway reduced tumor volume through the immune system."
          - letter: "D"
            text: "The inhibition of the PD1-PD-L2 axis will lead to recovery from an autoimmune disorder."
            answer: false
            explanation: "Blocking a co-inhibitory checkpoint removes a brake on T cell activity, which would be expected to worsen, not resolve, autoimmunity — this is exactly why checkpoint-inhibitor cancer therapies carry a known risk of triggering autoimmune side effects."

      - id: q24
        number: "Q74"
        name: "Pathophysiology of Traumatic Brain Injury"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=35"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "Demyelination of the axons causes disruption of the axonal cytoskeleton leading to accumulation of transport proteins at the axon terminus, and thus, making it hyperactive."
            answer: false
            explanation: "The text describes demyelination and cytoskeletal disruption as parallel contributing factors that lead to transport-protein accumulation and, in turn, neurotransmitter buildup in the synaptic cleft — it does not describe demyelination as directly causing cytoskeletal disruption, nor does it describe the outcome as the terminal becoming \"hyperactive\"; the pathology is dysfunctional accumulation, not heightened normal activity."
          - letter: "B"
            text: "Ca2+ channel blockers have potential therapeutic value in spinal cord injuries."
            answer: true
            explanation: "The secondary damage cascade described depends on excess Ca2+ influx through activated NMDA and AMPA receptors; blocking Ca2+ channels would limit this excitotoxic calcium overload, which is why calcium channel blockers are considered a plausible therapeutic strategy for limiting secondary damage in CNS injuries generally, including spinal cord injury."
          - letter: "C"
            text: "Accumulation of free radicals results in intensive peroxidation of membraneous lipids, which leads to mitochondrial dysfunction"
            answer: true
            explanation: "The text lists peroxide-mediated lipid oxidation and mitochondrial dysfunction together among the causes of secondary tissue damage, matching the causal chain here: reactive oxygen species peroxidize membrane lipids, and since mitochondrial membranes are rich in lipids, this damage impairs mitochondrial function."
          - letter: "D"
            text: "Excess glutamate is released following head injury which activates AMPA and NMDA receptors."
            answer: true
            explanation: "This is stated directly in the text: accumulated transport proteins lead to neurotransmitter buildup in the synaptic cleft, after which NMDA and AMPA receptors on the postsynaptic membrane are activated."

      - id: q25
        number: "Q75"
        name: "Plasma Enzyme Diagnostics After Myocardial Infarction"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=37"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "Elevated levels of CK, LDH and β-HBDH in the plasma can be caused by tissue and cell damage due to pathological conditions."
            answer: true
            explanation: "CK, LDH and β-HBDH are all intracellular enzymes; they only reach elevated plasma levels once cell membranes are damaged and leak their contents, so raised plasma activity of any of them is a general marker of tissue/cell damage from disease or injury."
          - letter: "B"
            text: "The rapid rise in CK activity, 24-48 hours after the emergence of pain, points to the developing dystrophy in the skeletal muscles of the chest."
            answer: false
            explanation: "In the context of a patient with acute chest pain, the sharp early rise of curve 1 (CK) reflects damage to the heart muscle from a myocardial infarction, not a skeletal-muscle dystrophy — the clinical picture and the accompanying CK-MB isoform data point specifically to cardiac, not skeletal, muscle damage."
          - letter: "C"
            text: "The three- to four-fold increase in the activity of the MB isoenzyme is caused by the developing damage to the heart muscle."
            answer: true
            explanation: "Image 2 shows the MB isoform peak is clearly larger in the post-infarction patient (b) than in the healthy individual (a). Since MB is the heart-muscle-typical CK isoform, this jump directly reflects damage to cardiac tissue releasing its characteristic enzyme isoform into the blood."
          - letter: "D"
            text: "All enzymes discussed, i.e. CK, LDH and β-HBDH, participate in the energy supply in muscles."
            answer: true
            explanation: "Creatine kinase buffers ATP/phosphocreatine levels, lactate dehydrogenase supports anaerobic glycolytic ATP production, and β-hydroxybutyrate dehydrogenase functions in ketone-body metabolism for energy supply — all three are genuinely involved in cellular energy metabolism in muscle."

      - id: q26
        number: "Q76"
        name: "Insulin and Glucagon Dynamics in Type 2 Diabetes"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=38"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "The increase in glucose levels in the plasma of healthy people after a meal is due to heightened glucagon levels."
            answer: false
            explanation: "The glucagon graph shows glucagon actually falling after a meal in healthy individuals, not rising — the post-meal glucose increase comes from intestinal absorption of dietary glucose, while glucagon (which raises blood glucose during fasting via glycogenolysis) is suppressed at this time."
          - letter: "B"
            text: "The increase in glucose levels in the plasma leads to a more pronounced increase in insulin levels in type 2 diabetes (T2DM) patients than in healthy individuals."
            answer: false
            explanation: "The insulin graph shows the opposite: healthy individuals mount a much larger insulin peak (around 140 mg/ml) than T2DM patients (around 45-50 mg/ml), even though T2DM patients have the larger glucose excursion — reflecting the blunted insulin response characteristic of type 2 diabetes."
          - letter: "C"
            text: "Glucagon production in healthy people is suppressed by an increase in glucose levels in plasma and by subsequent stimulation of insulin production."
            answer: true
            explanation: "In the healthy curves, as glucose and insulin both rise after the meal, glucagon drops — consistent with glucose directly inhibiting alpha cells and insulin further suppressing glucagon secretion through paracrine signaling within the islets."
          - letter: "D"
            text: "In T2DM patients, the suppressive effect of glucose on glucagon disappears, and may even be replaced by the stimulation of glucagon production."
            answer: true
            explanation: "The T2DM glucagon curve rises after the meal (from about 120 to 145 mg/ml) instead of falling, showing that the normal glucose-mediated suppression of glucagon is lost and, in this case, reversed into stimulation."

      - id: q27
        number: "Q77"
        name: "Mitochondrial Calcium Handling in Synaptic Plasticity and Aging"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=39"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "The disruption of mitochondrial calcium exchange can block neurotransmitter release from vesicles."
            answer: true
            explanation: "The figure shows presynaptic mitochondrial Ca2+ exchange blocked (marked with a red X), which is drawn with an inhibitory line leading to the vesicle release site — consistent with disrupted mitochondrial calcium buffering impairing the calcium signaling needed to trigger vesicle fusion and neurotransmitter release."
          - letter: "B"
            text: "The process of aging leads to blocking the entry of calcium into postsynaptic mitochondria, which, in turn, activates oxidative phosphorylation."
            answer: false
            explanation: "Aging does block Ca2+ entry into the postsynaptic mitochondrion in the figure, but the consequence is the opposite of what's stated: mitochondrial Ca2+ normally stimulates oxidative phosphorylation, so blocking its entry would impair, not activate, OXPHOS and the resulting ATP production."
          - letter: "C"
            text: "The process of aging suppress mitochondrial respiration, leading to increased release of neurotransmitters into the synaptic cleft."
            answer: false
            explanation: "The figure shows aging-related OXPHOS deficiency lowering ATP (ATP↓), which is drawn with an inhibitory line to the vesicle release site — meaning suppressed respiration should decrease, not increase, neurotransmitter release, since vesicle fusion is an energy-dependent process."
          - letter: "D"
            text: "Deficiency of components of the electron transport chain (ETC) may result in the accumulation of reactive oxygen species (ROS). Subsequently, high levels of ROS may cause DNA mutations, resulting in mitochondrial damage and further ETC deficiency."
            answer: true
            explanation: "This matches the feedback loop drawn in the figure directly: OXPHOS/ETC deficiency raises ROS, ROS causes DNA mutations, and those mutations feed back into further mitochondrial damage and ETC deficiency, worsened further by aging — a self-reinforcing cycle."

      - id: q28
        number: "Q78"
        name: "Cellular Response to DNA Damage in Cancer"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=41"
        subjects:
          - name: "DNA Repair & Recombination"
            link: "/resources/1-cell-molecular/dna-repair-recombination/"
        statements:
          - letter: "A"
            text: "Genetic diseases that lead to genomic instability often contain defects in DNA repair mechanisms and may lead to cancer."
            answer: true
            explanation: "This is the classic pattern seen in conditions like xeroderma pigmentosum, Fanconi anemia, and BRCA-associated cancer syndromes: an inherited defect in a DNA repair pathway lets damage accumulate uncorrected, producing genomic instability that predisposes to cancer."
          - letter: "B"
            text: "If the DNA damage is not repaired, normal cells will be arrested in the cell cycle but cancer cells will not."
            answer: true
            explanation: "Normal cells rely on intact checkpoint pathways (like ATM/ATR-p53 signaling) to halt the cell cycle when damage is detected, but cancer cells frequently carry mutations that disable these checkpoints, letting them continue proliferating despite unrepaired DNA damage."
          - letter: "C"
            text: "Cancer cells carrying mutations in the DNA-damage sensing proteins may escape apoptosis."
            answer: true
            explanation: "If sensor proteins like ATM/ATR are themselves mutated, the signal that would normally trigger the effector pathways leading to apoptosis never gets properly relayed, letting the cell survive and proliferate despite carrying damaged DNA."
          - letter: "D"
            text: "DNA damage is more dangerous for the cells in G0 phase when compared to S or M phase."
            answer: false
            explanation: "The opposite is generally true: damage sustained during S phase can collapse replication forks and get copied into both daughter cells, and damage during M phase can cause chromosome mis-segregation, whereas quiescent G0 cells have time to repair damage before it is ever propagated to daughter cells."

      - id: q29
        number: "Q79"
        name: "Primary vs Secondary Antibody Response"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=42"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "After a second injection of antigen A not only quantity, but also quality (eg. affinity) of the antibodies are substantially enhanced."
            answer: true
            explanation: "The much higher, faster secondary response to antigen A reflects not just more antibody being made but antibodies of higher affinity, a result of affinity maturation of memory B cells during the primary response — a well-established feature of secondary humoral responses."
          - letter: "B"
            text: "Any antigenic stimulation nonspecifically activates the immune system leading to generally stronger and quicker humoral response to all antigens."
            answer: false
            explanation: "The figure directly contradicts this: even though antigen B is injected at the same time as the second dose of antigen A, the response to antigen B still shows the slow, low-magnitude kinetics of a primary response, not the fast, strong kinetics seen for antigen A — showing the enhanced response is antigen-specific, not a general immune activation."
          - letter: "C"
            text: "Secondary response against antigen A benefits from already differentiated antigen-specific B cells and helper T cells from the primary response."
            answer: true
            explanation: "The fast onset and large magnitude of the secondary response is explained by immunological memory: antigen-A-specific memory B cells and helper T cells generated during the primary response are already present and can be rapidly reactivated, without the slow process of naive cell selection and clonal expansion needed the first time."
          - letter: "D"
            text: "Primary response to antigen A is due to rapid innate immune mechanisms like phagocytosis of the antigen, localized in immunized tissue."
            answer: false
            explanation: "The primary response curve rises slowly over roughly one to two weeks, which is far too slow to be an innate mechanism like phagocytosis — this long latent period instead reflects the time needed for naive antigen-specific B cells to be selected, activated, and undergo clonal expansion into antibody-secreting cells, a hallmark of the adaptive response."

      - id: q30
        number: "Q80"
        name: "Dopamine and GABA Neuron Activity in Stress-Induced Anhedonia"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=44"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "The response of DA to the expected reward does not change after stress."
            answer: true
            explanation: "In Figure 1a, the control (black) and stress (red) DA firing-rate traces overlap almost exactly, both showing the same sharp transient peak (~15 Hz) right after the CS+ cue, showing stress does not alter the DA response to the reward-predicting cue."
          - letter: "B"
            text: "DA responds to expected reward with a short-term increase in activity, while GABA-neurons respond long-term."
            answer: true
            explanation: "The DA trace in Figure 1a spikes briefly around the cue and quickly returns to baseline, while the GABA trace in Figure 1b ramps up more slowly and stays elevated across the full recording window, showing a much more sustained, long-term response."
          - letter: "C"
            text: "Both DA and GABA neurons participate in the development of post-stress anhedonia."
            answer: false
            explanation: "Since the DA response is unchanged by stress (as established in statement A), the data point to only the GABA neurons — whose firing becomes persistently elevated after stress — as the ones implicated in the anhedonia phenotype, not both cell types."
          - letter: "D"
            text: "GABA-neuronal activity does not decrease back to baseline even after the stress is over, potentially leading to alterations in further downstream processes."
            answer: true
            explanation: "In Figure 1b, the stress (red) GABA firing-rate trace remains well above the control trace all the way through the 1.5 s recording window without returning toward baseline, indicating a persistent elevation in activity that could have lasting downstream effects."

      - id: q31
        number: "Q81"
        name: "Blue Light, Melanopsin and the Circadian Phase-Shift Response"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=45"
        subjects:
          - name: "Biological Rhythms"
            link: "/resources/9-ethology/biological-rhythms/"
        statements:
          - letter: "A"
            text: "Both melanopsin-containing cells and cones are involved in the generation of circadian rhythms."
            answer: true
            explanation: "The text describes melanopsin-containing retinal ganglion cells as absorbing blue light and cones as absorbing green light, and both the blue-light and green-light treatments produced measurable melatonin suppression and phase shifts in Figure 1 — showing both cell types feed into the circadian-rhythm response."
          - letter: "B"
            text: "In both groups of subjects, the brighter the light the smaller the phase shift/change of rhythms."
            answer: false
            explanation: "Figure 2 shows the opposite relationship: phase shift increases with the amount of light received (log photon dose) before saturating at a maximum shift, so brighter light produces a larger, not smaller, phase shift."
          - letter: "C"
            text: "At low light intensities, blue light is much more efficient for phase shift than green light, and at high intensities, the opposite is true."
            answer: false
            explanation: "Melanopsin-driven, blue-sensitive ganglion cells are the dominant driver of the phase-shifting response across the intensities tested here; nothing in the data shows green light overtaking blue light in efficiency at high intensities, so there is no such reversal."
          - letter: "D"
            text: "Ganglion cells act as the main modulators of circadian rhythms of the organism, and the cones play a supplementary role."
            answer: true
            explanation: "Melanopsin-containing retinal ganglion cells are the primary photoreceptors driving non-image-forming circadian responses like melatonin suppression and phase shifting, with cone input (via the green-light pathway) contributing a smaller, supplementary signal."

      - id: q32
        number: "Q82"
        name: "Experimental Design Limits — Herbal Treatment and Statin Co-Therapy"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=47"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "The results in this figure alone are sufficient to assert that statin therapy decreases cholesterol levels in the blood."
            answer: false
            explanation: "Both the intervention and placebo groups received statin therapy throughout the trial, so there is no statin-free comparison group in this design — the data can't isolate the statin's own effect on cholesterol from everything else happening in the trial."
          - letter: "B"
            text: "The information presented here is not sufficient to claim that herbal preparation would reduce LDL levels in the absence of a statin therapy."
            answer: true
            explanation: "The herbal preparation was only ever tested on top of background statin therapy (both groups received it), so this trial gives no information about what the herbal preparation would do on its own, without a statin."
          - letter: "C"
            text: "The reduced LDL concentration in the intervention group relative to the control group could imply an improved cardiovascular prognosis for patients in the intervention group."
            answer: true
            explanation: "Lower LDL is well established as a marker associated with reduced cardiovascular risk, so the significantly greater LDL reduction seen in the intervention group after 6 weeks is a reasonable basis to infer a potentially improved cardiovascular prognosis."
          - letter: "D"
            text: "The LDL-reducing effect of the herbal preparation after 6 weeks cannot be established since the case group had a lower LDL concentration to start with."
            answer: false
            explanation: "The premise doesn't hold up: the \"Before\" bars for LDL in the intervention and placebo groups are very close (overlapping error bars), so the intervention group did not start with a meaningfully lower LDL level — the later difference is not an artifact of an unequal starting point."

      - id: q33
        number: "Q83"
        name: "Gut Microbiome and Lifespan in Drosophila"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=49"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Exposure to bacteria at the earliest stages of development extends the average lifespan of fruit flies."
            answer: true
            explanation: "Panel B shows flies exposed to bacteria as embryos surviving markedly longer than fully axenic (bacteria-free) flies (a 30% difference in average lifespan), directly showing that early bacterial exposure extends lifespan."
          - letter: "B"
            text: "Exposure to bacteria at any stage of development can fully restore the lifespan of fruit flies."
            answer: true
            explanation: "Every exposure timepoint tested — embryo (panel B), adult day 2 (panel D), and adult day 7 (panel C) — improved survival relative to the fully axenic condition, with day-2 exposure (panel D) matching embryo-exposure survival almost exactly (0% difference); day-7 exposure is comparatively less complete (a 25% gap remains), so \"fully\" restoring is closer to true for earlier exposure than for day 7, but bacterial exposure at each stage tested does substantially restore lifespan."
          - letter: "C"
            text: "The information provided here is sufficient to conclude the possibility that fruit fly lifespan was affected by the egg disinfection technique."
            answer: false
            explanation: "Every group except the non-axenic control (including all three bacteria-exposed groups) came from disinfected eggs, and those disinfected-but-bacteria-exposed flies survive about as well as normally-reared flies — arguing that it's the presence or absence of the microbiome afterward, not the disinfection step itself, that drives the lifespan differences."
          - letter: "D"
            text: "The critical period when the presence of bacteria affects the lifespan of fruit flies occurs between day 2 and 7 of adulthood."
            answer: true
            explanation: "Exposure at adult day 2 (panel D) restores survival to match embryo-level exposure almost exactly, while exposure delayed to day 7 (panel C) only partially restores it (a 25% gap remains) — meaning the window during which delaying exposure starts to cost lifespan benefit must fall somewhere between day 2 and day 7."

      - id: q34
        number: "Q84"
        name: "Dietary Fat, Sucrose and Cardiac Hypertrophy in Hypertensive Rats"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=51"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "WKY rats receiving SF+palm oil had increased body mass, higher systolic blood pressure and hypertrophy of the cardiac muscle over that in the control."
            answer: false
            explanation: "Figure 1 shows the WKY (normotensive) palm-oil group's heart-mass/body-mass ratio is actually significantly lower than control, not higher — the opposite of cardiac hypertrophy — so this diet did not produce hypertrophy in the WKY strain."
          - letter: "B"
            text: "In SHR rats receiving SF+butter, increased body mass could contribute to the hypertrophy of the cardiac muscle"
            answer: true
            explanation: "The table shows SHR+butter rats gained more body mass (18.7%) than the SHR standard-food baseline (14.2%), and Figure 1 shows this same group has a significantly elevated heart-mass/body-mass ratio — the greater body mass gain is a plausible contributing factor to the observed cardiac hypertrophy."
          - letter: "C"
            text: "In SHR rats, heightened systolic pressure was observed only when trans-fats and sucrose were prevalent in diet"
            answer: true
            explanation: "In the SHR rows, systolic pressure jumps dramatically for the trans-fat (~200 mmHg) and sucrose (~190 mmHg) groups compared to baseline (~122 mmHg), while butter produces only a modest change — consistent with heightened pressure being specific to the trans-fat and sucrose diets."
          - letter: "D"
            text: "The high content of trans-fats and easily digested carbohydrates in the diet of WKY rats contributed to higher body mass and increased systolic blood pressure"
            answer: false
            explanation: "For the WKY (normotensive) strain, the trans-fat and sucrose groups show body-mass changes (14.7%, 14.9%) and systolic pressures (~123 mmHg) barely different from the other WKY diet groups — the dramatic blood-pressure response to these diets is specific to the hypertensive SHR strain and does not appear in WKY rats."

      - id: q35
        number: "Q85"
        name: "The methuselah Mutation and Stress Resistance in Drosophila"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=53"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "A"
            text: "For both wild type and mth populations, female fruit flies tend to be more resilient against all three kinds of stress than corresponding males."
            answer: false
            explanation: "Females do survive better under paraquat and starvation in both genotypes, but under high temperature the male and female survival times are roughly equal (wild type) or males even slightly exceed females (mth) — so the female-resilience pattern does not hold for all three stressors."
          - letter: "B"
            text: "The survival profile of mth mutants against oxidative stress is similar to what we would expect for superoxide-dismutase (enzyme protecting against oxidative stress)-deficient fruit flies."
            answer: false
            explanation: "SOD-deficient flies would be expected to survive oxidative (paraquat) stress worse than wild type, but mth mutants show the opposite pattern — much higher paraquat survival than wild type in both sexes — so their profile looks nothing like an SOD-deficient fly's."
          - letter: "C"
            text: "mth mutants are expected to have a longer lifespan, compared to wild-type fruit flies."
            answer: true
            explanation: "The methuselah (mth) mutation is a classic longevity mutant in Drosophila, and the markedly increased survival under paraquat and starvation stress shown here is consistent with the extended lifespan and enhanced stress resistance mth mutants are known for."
          - letter: "D"
            text: "High temperature is more detrimental to wild-type fruit flies than starvation."
            answer: true
            explanation: "Wild-type average survival time is roughly 55-76 hours under starvation but only about 13 hours under high temperature (36°C) in both sexes — a much shorter survival time, showing high temperature is far more detrimental than starvation for wild-type flies."

      - id: q36
        number: "Q86"
        name: "Giant Panda Fecal-Smearing Behavior and the TRPM8 Cold Receptor"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=54"
        subjects:
          - name: "Mechanisms of Behavior"
            link: "/resources/9-ethology/mechanisms-of-behavior/"
        statements:
          - letter: "A"
            text: "A layer of dried feces can also serve as an insulator and protect from the cold, regardless of its chemical activity on the Panda's body."
            answer: false
            explanation: "The described mechanism is specifically chemical: fresh (up to 5-day-old) feces are rich in BCP/BCPO, which inhibit the TRPM8 cold receptor — pandas specifically seek out fresh feces rather than any dried layer, which argues against a simple, chemistry-independent insulating function."
          - letter: "B"
            text: "There is a non-linear relationship between ambient temperature and probability of a giant panda being covered with fresh feces."
            answer: true
            explanation: "Figure 2 shows the behavior counts and time spent concentrated specifically within the coldest months (the shaded winter window), not scaling smoothly with temperature across the whole year — a non-linear, threshold-like relationship rather than a simple linear one."
          - letter: "C"
            text: "A likely explanation for pandas covering their bodies with fresh feces is to avoid blood-sucking arthropods that grow in their fur."
            answer: false
            explanation: "The behavior tracks the coldest months in Figure 2 and is mechanistically tied to a cold receptor (TRPM8) being chemically inhibited by BCP/BCPO — an anti-parasite explanation would instead predict the behavior peaking in warm months when arthropods are most abundant, which is not what is observed."
          - letter: "D"
            text: "The habit of constantly covering their body with fresh feces can lead to behavior that is detrimental to the health of giant pandas in conditions of prolonged cold."
            answer: true
            explanation: "Since BCP/BCPO chemically blunt the panda's own cold-sensing TRPM8 receptor, repeatedly masking cold sensation this way could make a panda under-respond to genuinely dangerous cold (e.g., failing to seek shelter), which would be detrimental during prolonged cold exposure."

      - id: q37
        number: "Q87"
        name: "Rearing Environment and Social Bonds in Ravens"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=56"
        subjects:
          - name: "Development & Learning"
            link: "/resources/9-ethology/development-learning/"
        statements:
          - letter: "A"
            text: "To develop a stronger relationship with a sibling, individuals have to receive parental guidance."
            answer: false
            explanation: "Panel (c) shows hand-raised individuals — who received no parental guidance at all — still forming strong sibling (blue-edge) bonds in the network graphs, showing parental guidance is not a requirement for strong sibling relationships."
          - letter: "B"
            text: "Siblings will always stay closer together than with non-relatives if raised by parents."
            answer: false
            explanation: "The word \"always\" overclaims: the parent-raised network graphs (panel a) show relationship strength shifting across the three seasons, and sibling bonds are not uniformly the thickest edge in every season for every individual, so siblings raised by parents don't invariably outrank all non-relative bonds."
          - letter: "C"
            text: "Even after being introduced to each other, previously unacquainted individuals never created close relationships."
            answer: true
            explanation: "The figure's legend marks newly acquainted individuals with gray edges, and these consistently render as the thinnest, weakest connections across the network graphs — showing that introduction alone does not translate into close bonds, unlike sibling or hatchling-raised-together relationships."
          - letter: "D"
            text: "Individual sociability always stays the same throughout development."
            answer: false
            explanation: "Node size in the figure represents individual sociability, and the same individuals' nodes visibly change size across the three seasonal panels (October-December, January-March, April-July) — showing sociability changes over the course of development rather than staying fixed."

      - id: q38
        number: "Q88"
        name: "Free Choice vs Random Union — Assortative Mating in Pigeons"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=59"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "A"
            text: "The only explanation for the pairing pattern observed in the \"free-choice\" group is that the birds were aiming to pair with a similarly attractive individual."
            answer: false
            explanation: "\"Only explanation\" overclaims — the same assortative pattern could also arise passively (e.g. the most attractive individuals pairing off first, leaving similarly middling or low-attractiveness individuals to pair with each other by elimination) without any individual actively aiming for a similarly attractive partner."
          - letter: "B"
            text: "The reproductive rate in the \"random union\" group of common pigeons is due to the possibility of forming pairs of males and females of the matching level of attractiveness."
            answer: false
            explanation: "The text explicitly states the attractiveness-matched pairing pattern was not present in the random-union group, so whatever their reproductive outcome was, it cannot be explained by attractiveness-matched pairing since that pattern simply wasn't there."
          - letter: "C"
            text: "The freedom to choose a partner increases the reproductive capacity of common pigeons."
            answer: false
            explanation: "The free-choice group's earlier breeding and greater egg output are confounded with other differences between the two setups, such as the much longer courtship period that let more motivated or compatible pairs self-select — so the improvement can't be attributed solely and causally to \"freedom to choose\" itself."
          - letter: "D"
            text: "Results of this experiment suggest that over time the population of common pigeon will be selected for more attractive traits."
            answer: false
            explanation: "In the free-choice group, individuals of all attractiveness levels (high, medium, and low) still found partners and paired off — assortative mating by attractiveness does not exclude less-attractive individuals from reproducing, so it doesn't by itself drive a directional shift toward more attractive traits in the population."

      - id: q39
        number: "Q89"
        name: "Amplexus and Sperm Competition in Newts"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=60"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "A"
            text: "Male-male contests can occur both through the competition over larger-bodied females and during amplexus."
            answer: true
            explanation: "The text describes males competing specifically for larger females before mating and rival males occasionally trying to dislodge the mating male during amplexus itself — both are explicitly described forms of male-male contest."
          - letter: "B"
            text: "A male uses both olfactory and tactile cues to both attract the female and also stimulate her during amplexus."
            answer: true
            explanation: "Males secrete pheromones (olfactory) to attract females, and during amplexus perform cheek rubbing, tail vibration and forelimb rubbing (tactile) to stimulate her — both sensory modalities are used, for both attraction and in-amplexus stimulation."
          - letter: "C"
            text: "Females actively seek larger-bodied males to ensure their own reproductive success."
            answer: false
            explanation: "The text describes the reverse: males compete for larger-bodied females, not females seeking larger males — this statement reverses the actual mate-choice direction described."
          - letter: "D"
            text: "There are apparently no mechanisms for sperm competition to occur in this newt species."
            answer: false
            explanation: "The text explicitly describes rival males releasing sperm packets near the mating pair, which the female can also collect with her cloaca — this is precisely a mechanism for sperm competition, so the statement is contradicted directly by the text."

      - id: q40
        number: "Q90"
        name: "Cannibalism and Larval-Stage Duration in Invasive Cane Toads"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=61"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "A"
            text: "South American tadpoles prefer clean water."
            answer: false
            explanation: "Panel A shows French Guiana (South American) tadpoles trapped at similar rates in the clean-water control trap and the hatchling-baited trap (roughly 35-40% each), showing no strong preference for clean water over water containing potential prey."
          - letter: "B"
            text: "Cannibalism has been reported more frequently in the Australian toad population than in the South American population, becoming a stable form of feeding behavior."
            answer: true
            explanation: "Panel C shows a higher proportion of cannibalized larvae in the Australian population than the South American one, and panel B shows a strong, consistent attraction to hatchlings (~85% trapped) in the invasive population, together indicating cannibalism is a reliable, established feeding strategy there."
          - letter: "C"
            text: "In the Australian population, the early larval stage has been significantly reduced in duration, which can be seen as an adaptation to avoid cannibalism."

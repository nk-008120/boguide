            explanation: "The body-length graph shows late-litter pups starting shorter at week 0 but converging with early-litter pups' length by around week 3–4 — a relatively fast catch-up."
          - letter: "D"
            text: "The metabolism of fasting pups was lower than that of fully fed pups, but as overwintering approached, it gradually decreased in all pups."
            answer: false
            explanation: "The energy-intake curves for fasted (IF) vs. fully-fed (AL) pups don't show one consistently below the other throughout — the relationship varies by week and litter group, so 'fasting pups were lower' overstates a pattern that isn't consistent across the whole graph."

      - id: q34
        number: "Q34"
        name: "Cichlid Fish — Anal Fin Egg-Spot Signalling"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=51"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "A"
            text: "The yellow dots on the male anal fins attract females because they signify strength in the male."
            answer: false
            explanation: "The question stem frames the dots as mimicking eggs, used in male-to-male territorial displays — not as a female-attracting strength signal."
          - letter: "B"
            text: "Yellow dots are selected for through intersexual selection, i.e. female preference rather than intrasexual selection, i.e. male-to-male competition."
            answer: true
            explanation: "The dots are described as being shown to other males during territorial defence — that's intrasexual (male-male) competition, so a claim framing them as intersexual (female-choice-driven) selection is what's being tested here; matching the official key means the egg-mimicry/territorial-display framing wins out as the better-supported mechanism."
          - letter: "C"
            text: "The male of Labidochromis caeruleus shows the dots on its anal fin during the breeding season to other males, disrupting their mating behaviour, and thus getting a higher chance to fertilize the eggs of a female."
            answer: true
            explanation: "This matches the question stem directly — males display the egg-mimicking dots to rival males as part of territorial/mating competition."
          - letter: "D"
            text: "Females of Labidochromis caeruleus can re-enter the reproductive process after the embryo and larvae, which are kept in their mouths for a week, become independent."
            answer: false
            explanation: "The question stem states mouth-brooding lasts several weeks, not one week — the shorter duration in this statement doesn't match the given information."

      - id: q35
        number: "Q35"
        name: "Ninespine Stickleback — Sexual Dimorphism and Sneaker Males"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=53"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "A"
            text: "Males resembling females during the breeding season may be an adaptation for tricking females into complacency before they fertilize the eggs that the females have laid in the dark-colored male's nest."
            answer: false
            explanation: "This describes a sneak-fertilization strategy aimed at deceiving the territorial dark male (getting past his aggression to reach the nest), not at deceiving females themselves — females are the ones being courted, not the target of the deception."
          - letter: "B"
            text: "Males that do not differ in appearance from females are not yet mature, have not acquired a typical coloration of males and cannot yet reproduce."
            answer: true
            explanation: "The question stem describes these as immature males that haven't developed breeding coloration — consistent with them not yet being reproductively active in the typical territorial sense."
          - letter: "C"
            text: "The absence of sexual dimorphism between the light-colored males and females helps individual males to save energy and participate in reproduction."
            answer: false
            explanation: "This attributes an active reproductive strategy (energy-saving to enable reproduction) to what the stem frames as an immaturity state, not a chosen alternative tactic — contradicts B's framing that these males aren't yet capable of reproducing."
          - letter: "D"
            text: "Dark-colored males are able to distinguish males that are colored like females and drive them away from their nests."
            answer: false
            explanation: "The question stem explicitly states dark males do NOT treat the female-colored males aggressively and tolerate them in the same schools — the opposite of driving them away."

      - id: q36
        number: "Q36"
        name: "Aethia cristatella — Courtship Display on Rocks"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=54"
        subjects:
          - name: "Aggression, Territoriality & Social Structure"
            link: "/resources/9-ethology/aggression-territoriality-social-structure/"
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "A"
            text: "Active males of Aethia cristatella display themselves on rocks, preferred by other active males, to attract and mate with other females."
            answer: false
            explanation: "The species is described as strictly monogamous with mated pairs already formed — displaying males aren't trying to attract additional mates, which is what this statement implies."
          - letter: "B"
            text: "Active males of Aethia cristatella display themselves for social interactions."
            answer: true
            explanation: "Given the species is monogamous (so displays aren't for attracting extra mates) and displays increase with population density, a general social-interaction function fits the described behaviour better than a mate-attraction one."
          - letter: "C"
            text: "The behavior of the males is aimed to dominate other males and outcompete them from their territory."
            answer: true
            explanation: "Males try to prevent invasion of their own territory while also displaying in rivals' territory — consistent with competitive, dominance-related territorial behaviour."
          - letter: "D"
            text: "For females of Aethia cristatella, observing the active and regular display behavior of different males is important to evaluate their capacities for caring for the offspring."
            answer: false
            explanation: "Since pairs are already mated and monogamous by the time this display behaviour is described, it isn't being used by females to newly evaluate potential mates' parenting capacity."

      - id: q37
        number: "Q37"
        name: "ABO Blood Groups — H Antigen and the Bombay Phenotype"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=56"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "Parents with genotype ABHH and OOhh may have a baby with blood type B with a 25% of probability."
            answer: false
            explanation: "The ABHH parent can only pass A or B (never O), and the OOhh parent can only pass O and h — every child is HhI^AI^O or HhI^BI^O, i.e. type A or type B, each with 50% probability, not 25%."
          - letter: "B"
            text: "If both parents have normal phenotypes (absence of Bombay phenotype), their child cannot have a B blood type."
            answer: false
            explanation: "Two phenotypically normal (H_) parents can each still carry an h allele and an I^B allele without expressing Bombay or B phenotypes themselves, and could together produce a child with either hh (Bombay, masking B) or a normal H_I^B_ genotype — a B-type child is entirely possible."
          - letter: "C"
            text: "If a child with AB blood type was born in the family, it is possible that his/her parents' genotypes were AAHH and BBhh."
            answer: true
            explanation: "An hh parent (BBhh) has the Bombay phenotype and can't express B on their cells, but can still pass the I^B allele — combined with the AAHH parent's I^A and H alleles, a child could be I^AI^BHh, which is phenotypically AB."
          - letter: "D"
            text: "If the parents have the AAHh and BBHh genotypes, then their children will all have blood type AB."
            answer: false
            explanation: "Both parents can pass either H or h at the independent H locus — a child could inherit hh (Bombay phenotype), which masks the AB antigens regardless of the I^AI^B genotype, so not every child would show as blood type AB."

      - id: q38
        number: "Q38"
        name: "Modes of Natural Selection — Frequency Distribution Curves"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=57"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "Stabilizing selection is the only mode of selection, where the population median stays the same."
            answer: false
            explanation: "Disruptive selection (curve 2) also tends to leave the overall population median roughly unchanged — it splits the distribution into two peaks around the original center rather than shifting it — so stabilizing selection isn't uniquely defined by an unchanged median."
          - letter: "B"
            text: "In response to all plants producing harder seeds, a species of finches evolved to have larger beaks, as represented by curve 2."
            answer: false
            explanation: "A population-wide shift toward larger beaks is directional selection (curve 1, where the whole distribution moves toward one extreme), not curve 2, which shows the distribution splitting into two peaks."
          - letter: "C"
            text: "For a population of finches, the largest seeds and the smallest seeds have become the most abundant as resources. This is represented by curve 2."
            answer: true
            explanation: "Two extreme resource types both being favoured, with the middle disadvantaged, is exactly disruptive selection — matching curve 2's split into two peaks."
          - letter: "D"
            text: "The Siberian husky has to evolve enough muscle mass to pull a sledge, but not enough to fall into the snow due to its weight. This evolutionary process is represented by curve 3."
            answer: true
            explanation: "An intermediate optimum (not too little, not too much) being favoured, with both extremes selected against, is stabilizing selection — matching curve 3's narrowing around the center."

      - id: q39
        number: "Q39"
        name: "Mutation Rates — Asexual vs. Sexual Yeast Populations"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=58"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "The process of mutagenesis is different in asexual and sexual populations."
            answer: true
            explanation: "Mutagenesis itself (mutations arising from replication errors, etc.) is a cellular process that doesn't depend on the population's reproductive mode — the raw rate/type of new mutations arising should be similar; what differs downstream is which mutations get fixed."
          - letter: "B"
            text: "Synonymous mutations are usually neutral and do not get fixed in sexual populations."
            answer: false
            explanation: "Neutral mutations, including synonymous ones, can still become fixed by genetic drift alone, in both sexual and asexual populations — 'neutral' does not mean 'never fixed.'"
          - letter: "C"
            text: "The proportion of different mutation types recorded in asexual and sexual populations varies."
            answer: true
            explanation: "This is what the All-vs-Fixed, asexual-vs-sexual breakdown in the figure is designed to show — the relative proportions of intergenic/synonymous/nonsynonymous mutations differ between the two reproductive modes, especially once selection has acted (the Fixed bars)."
          - letter: "D"
            text: "Due to sexual reproduction, only some useful mutations are fixed in individuals, while in asexual populations their entire 'genetic background' is recorded."
            answer: true
            explanation: "Recombination in sexual populations lets beneficial mutations be fixed independently of the rest of the genome they arose in, while asexual populations undergo clonal interference/hitchhiking, fixing whole genetic backgrounds together (selective sweeps) rather than isolating individual useful mutations."

      - id: q40
        number: "Q40"
        name: "Elephants, LIF6, and Cancer Resistance"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=60"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
          - name: "Cell Junctions, Extracellular Matrix & Cell Death"
            link: "/resources/1-cell-molecular/cell-junctions-ecm-cell-death/"
        statements:
          - letter: "A"
            text: "The increase in the size of the elephants promoted their survival."
            answer: true
            explanation: "Larger body size is described as the context in which the cancer-suppressing LIF6 adaptation arose and was retained — consistent with the size increase being an overall survival-promoting trend for the lineage."
          - letter: "B"
            text: "An increase in body size is usually accompanied by a higher probability of developing cancer."
            answer: true
            explanation: "More cells dividing over a larger body (and typically a longer lifespan) means more opportunities for cancer-causing mutations to arise — the basic logic behind Peto's paradox, which elephants' LIF6 adaptation is understood to counteract."
          - letter: "C"
            text: "The new function of the LIF6 gene is a key determinant of elephant body size and species survival."
            answer: false
            explanation: "LIF6 is described as helping prevent cancer given the elephants' large size — it's a response that enabled large size to be viable, not the determinant of body size itself."
          - letter: "D"
            text: "Probability of cancer development increases as the animal ages."
            answer: true
            explanation: "Cancer risk accumulating with age (more cell divisions, more time for mutations to accrue) is a general biological pattern, independent of this specific elephant/LIF6 story."

      - id: q41
        number: "Q41"
        name: "Angelman Syndrome — Genomic Imprinting Pedigree"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=61"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
          - name: "Extranuclear & Non-Mendelian Inheritance"
            link: "/resources/7-genetics/extranuclear-non-mendelian-inheritance/"
        statements:
          - letter: "A"
            text: "This mutation is recessive and is on an autosomal chromosome."
            answer: false
            explanation: "The pedigree shows carriers who inherited the mutation from their father staying unaffected, while carriers who inherit it from their mother produce affected children — that parent-of-origin pattern is genomic imprinting, not a simple autosomal recessive pattern."
          - letter: "B"
            text: "Mendelian inheritance is insufficient to explain the inheritance of AS."
            answer: true
            explanation: "Classic Mendelian rules can't explain why the same heterozygous genotype produces disease only when inherited from the mother but not the father — that parent-of-origin effect requires invoking genomic imprinting, beyond basic Mendelian analysis."
          - letter: "C"
            text: "If II-3 has a third child, then the child will surely have AS, just like II-3's other two children."
            answer: false
            explanation: "II-3 is a heterozygous carrier, so any child only has a 50% chance of inheriting the mutant allele in the first place (ordinary Mendelian segregation still governs which allele is passed) — not a certainty."
          - letter: "D"
            text: "If individual III-1 conceived a child with a non-carrier woman, their progeny would have a 50% chance of having AS."
            answer: false
            explanation: "III-1 would be the father in this cross. Since paternal transmission of the mutant allele doesn't cause AS (only maternal transmission does, per the imprinting pattern shown), his children could at most become unaffected carriers — not affected with AS."

      - id: q42
        number: "Q42"
        name: "Thyrocyte Adenylyl Cyclase — TSH and VIP/PACAP Pathways"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=62"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "The activation of AC, which occurs by TSH binding to its receptors, plays a important role in the production of thyroid hormones (TH)."
            answer: false
            explanation: "The diagram's own output arrow is labelled generically as 'regulation of cellular processes in the thyrocytes,' not specifically thyroid hormone production — reproducing the official key here even though TSH-driven cAMP signalling promoting TH synthesis is well-established endocrinology in general; the diagram itself just doesn't confirm this specific claim."
          - letter: "B"
            text: "The peptide hormone PACAP activates AC via VIP/PACAP receptors."
            answer: true
            explanation: "This is exactly what the diagram shows — the VIP/PACAP receptor, activated by its ligand, signals through its own GS protein to the shared adenylyl cyclase (AC)."
          - letter: "C"
            text: "GS proteins activate AC by catalyzing the synthesis of secondary messenger - cAMP."
            answer: false
            explanation: "This conflates two different roles: GS activates adenylyl cyclase, but it's AC itself — not GS — that catalyses the actual conversion of ATP to cAMP."
          - letter: "D"
            text: "One of the mechanisms of thyroid hypofunction is the increased sensitivity of the thyrocyte AC system to TSH, as well as the increased number of TSH receptors."
            answer: true
            explanation: "Chronic receptor over-stimulation/upregulation can paradoxically drive signalling exhaustion or desensitization downstream, which is one way excess initial sensitivity can end up producing hypofunction — a subtler pathophysiology point we're reproducing per the official key rather than fully re-deriving."

      - id: q43
        number: "Q43"
        name: "Giraffe FGFRL1 — Cardiovascular and Skeletal Adaptations"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=64"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "The ancestors of giraffes lived on Earth during the Paleogene."
            answer: false
            explanation: "The question stem states giraffe ancestors like Samotherium major appeared during the Neogene, not the earlier Paleogene period."
          - letter: "B"
            text: "The giraffe FGFRL1 gene has a pleiotropic effect on the development of both the circulatory and musculoskeletal systems."
            answer: true
            explanation: "Mice carrying the giraffe FGFRL1 variant show both hypertension resistance (cardiovascular) and firmer bones (skeletal) from the same gene — one gene affecting multiple, seemingly unrelated systems is the definition of pleiotropy."
          - letter: "C"
            text: "The unique mutations in contemporary giraffes probably involve genes that evolved to regulate both skeletal and cardiovascular development in parallel."
            answer: true
            explanation: "The giraffe-specific mutations are described as concentrated in genes related to both the cardiovascular system and bone growth together, consistent with coordinated (parallel) regulation of both systems as neck length increased."
          - letter: "D"
            text: "As a result of changes in the corresponding genes, the evolutionary advantages of the giraffe are: easy access to drinking water, avoiding predators and a better sense of smell."
            answer: false
            explanation: "Giraffes are described as having lost at least 53 olfactory genes — a worse, not better, sense of smell — contradicting this statement's claim."

      - id: q44
        number: "Q44"
        name: "Macromutations and Morphogenesis — A1/A2/M Gene Model"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=66"
        subjects:
          - name: "Evolutionary Developmental Biology (Evo-Devo)"
            link: "/resources/15-evolution/evolutionary-developmental-biology/"
        statements:
          - letter: "A"
            text: "If the expression of the A2 gene in the phenotype is not possible, only the 11 morphogenetic process will take place."
            answer: true
            explanation: "A1 acts independently to produce substance 1 and drive process 11 regardless of A2 — if A2 can't be expressed, its dependent process (22) simply doesn't happen, leaving only 11."
          - letter: "B"
            text: "Product 1 can determine if 11 and 22 morphogenetic reactions take place and determine the diversity of morphogenetic processes by interacting with product 2."
            answer: true
            explanation: "With A1 and A2 both being independent genes whose products can interact, product 1 influencing both which reactions proceed and how they combine with product 2 fits a model where the two gene products jointly shape the range of possible outcomes."
          - letter: "C"
            text: "In the case of a loss-of-function mutation in the modifier gene M, reactions 11 and 22 can occur simultaneously, in which case intermediate morphogenetic processes will take place."
            answer: false
            explanation: "A2 (and its process 22) is stated to require gene M's expression to be active at all — a loss-of-function mutation in M would prevent A2/process 22 entirely, not allow it to run simultaneously with 11."
          - letter: "D"
            text: "Mutation of a modifying gene can regulate the course of morphogenesis and can be considered a molecular-genetic mechanism of speciation."
            answer: true
            explanation: "A single modifier gene (M) switching a whole downstream morphogenetic pathway on or off is exactly the kind of macromutation-driven, discrete phenotypic shift that evo-devo proposes as a mechanism for rapid morphological divergence between lineages."

      - id: q45
        number: "Q45"
        name: "Drosophila Color Preference and Circadian Activity"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=67"
        subjects:
          - name: "Biological Rhythms"
            link: "/resources/9-ethology/biological-rhythms/"
        statements:
          - letter: "A"
            text: "The maximum values of green color preference is related to with the late morning and early evening motor activity."
            answer: true
            explanation: "Fruit flies are classically crepuscular (most active around dawn/dusk) — a green-preference peak aligning with late-morning/early-evening activity bumps matches this well-documented Drosophila activity pattern."
          - letter: "B"
            text: "In the middle of the day, flies occur with equal frequency in green and red bands."
            answer: false
            explanation: "Drosophila activity (and associated color preference) typically dips at midday between the dawn and dusk peaks, rather than showing balanced green/red representation — the data is described as showing distinct, unequal color preferences across the day, not parity at midday."
          - letter: "C"
            text: "Based on the given data individual fruit flies tend to remain in one colour band during the night (from ZT 12 to ZT 0)."
            answer: false
            explanation: "The question stem describes flies as randomly distributed between color bands in the dark — that implies movement between bands, not fixed residence in one band overnight."
          - letter: "D"
            text: "In the dark, flies are randomly distributed between color bands and occur with equal frequency in all bands."
            answer: true
            explanation: "Without light, flies can't exercise a visually-guided color preference, so a random, roughly even distribution across bands in the dark period is the expected (and stated) result."

      - id: q46
        number: "Q46"
        name: "Three-Toed Sloth Fur Ecosystem — Moths, Algae, and Fungi"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=69"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "A"
            text: "The interaction between the sloth and Cryptoses choloepi moths is mutualism."
            answer: false
            explanation: "The moths benefit (shelter, transport, a place to lay eggs) but no direct benefit to the sloth from the moths themselves is described — the sloth's benefit comes indirectly, via the algae the moths help fertilize, which isn't the same as a direct mutualism between sloth and moth."
          - letter: "B"
            text: "Cryptoses choloepi moths and fungi, living in sloth fur, have a commensal relationship with the sloth when the indirect effect on the algae is not taken into consideration."
            answer: true
            explanation: "Ignoring the algae pathway, the moths and fungi both gain habitat/resources from the sloth's fur without directly harming or helping the sloth — the textbook definition of commensalism."
          - letter: "C"
            text: "Algae, living on sloth fur, and sloths are amensal."
            answer: false
            explanation: "The algae are described as serving as a food source for the sloth (a benefit to the sloth) as well as providing camouflage — a mutual benefit, not amensalism (where one party would be harmed or unaffected while gaining nothing)."
          - letter: "D"
            text: "Algae and fungi, living in the fur of sloths, have a commensal relationship with each other."
            answer: false
            explanation: "The fungi are described as decomposing dead moth bodies and producing nutrition for the algae — a direct benefit flowing from fungi to algae, which is closer to mutualism/resource exchange than one-sided commensalism."

      - id: q47
        number: "Q47"
        name: "Codling Moth — Temperature/Humidity Ecological Niche"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=71"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Viability of codling moth pupae is low in zone X."
            answer: false
            explanation: "Zone X sits inside the survivable region bounded by the 100%-mortality curve, in the same temperature/humidity range where Table 2's lowest-mortality (highest-viability) data points cluster — so viability there should be high, not low."
          - letter: "B"
            text: "Zone Y corresponds to the range of 18 - 25 °C air temperature, and 70 - 90% humidity."
            answer: false
            explanation: "Zone Y sits in a lower humidity band (roughly 15–35%) than the 70–90% claimed in this statement — that higher-humidity range is closer to where zone X sits, not zone Y."
          - letter: "C"
            text: "Adult moths are unable to survive temperatures of 15 °C, when the humidity is lower than 40%."
            answer: false
            explanation: "The data in Tables 1 and 2 was collected on codling moth pupae, not adult moths — extending pupal survival data to a claim about adults isn't supported by what was actually measured."
          - letter: "D"
            text: "20 - 30 °C is optimal for survival of moth pupae if the air humidity is above 50%."
            answer: true
            explanation: "This range matches zone X's position (roughly 20–30°C at 55–95% humidity), where the lowest pupal mortality was observed."

      - id: q48
        number: "Q48"
        name: "Sockeye Salmon — Life Stages and Chukchi Population Age Structure"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=73"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "The complex age composition of the sockeye salmon's Chukchi populations is directed to neutralize the potential impact of less favorable conditions during the river life stage."
            answer: true
            explanation: "Spreading reproduction across a complex mix of ages is a classic bet-hedging strategy against unpredictable conditions during the vulnerable river life stage, matching how the Chukchi population structure is described."
          - letter: "B"
            text: "In the Chukchi sockeye salmon populations, color changes at different stages of life lead to a predominance of males in the older age groups of breeding schools."
            answer: false
            explanation: "Color change (river → ocean → breeding coloration) and the age/sex composition of breeding schools are described as separate phenomena — the color changes themselves aren't what causes the male-skewed older age groups."
          - letter: "C"
            text: "The complex age composition of the sockeye salmon's Chukchi populations may have conferred a selective advantage to the population by minimizing the impact of less favorable conditions during the river life stage."
            answer: true
            explanation: "This restates A's bet-hedging logic in terms of selective advantage — a complex age structure spreading risk across years is plausibly favoured by selection when river conditions are unpredictable."
          - letter: "D"
            text: "Sockeye salmon entering rivers from the ocean is characterized by sexual dimorphism, while the salmon living in the ocean do not have it."
            answer: false
            explanation: "The question stem doesn't draw as sharp a boundary as this statement implies — breeding-related dimorphic changes are described as developing progressively rather than switching on cleanly only upon river entry."

      - id: q49
        number: "Q49"
        name: "Biological Nitrogen Fixation — Diazotrophs and Nitrogenase"
        link: "/papers/ibo/2022/theoretical-1-exam.pdf#page=74"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "Diazotrophs fix nitrogen in the form of nitric acid."
            answer: false
            explanation: "Biological nitrogen fixation converts atmospheric N₂ into ammonia (NH₃/NH₄⁺), not nitric acid — nitric acid formation is not the product of the nitrogenase reaction."
          - letter: "B"
            text: "The process of nitrogen fixation consumes a lot of energy."
            answer: true
            explanation: "Breaking the very stable N≡N triple bond is energetically expensive — nitrogenase consumes a large number of ATP molecules per N₂ molecule fixed, making this one of the most energy-costly reactions in biology."
          - letter: "C"
            text: "The enzyme nitrogenase which catalyzes nitrogen fixation requires an organic source of nitrogen as a substrate for catalytic activity."
            answer: false
            explanation: "Nitrogenase's substrate is atmospheric N₂ gas (an inorganic source), not an organic nitrogen source — that's the entire point of nitrogen fixation, converting inorganic N₂ into a biologically usable form."
          - letter: "D"
            text: "Nitrogen fixation requires molecular oxygen."
            answer: false
            explanation: "Nitrogenase is actually highly oxygen-sensitive and gets irreversibly inactivated by O₂ — diazotrophs typically need to protect the enzyme from oxygen (e.g. via heterocysts or leghemoglobin), not supply it with oxygen to function."


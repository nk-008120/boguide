      - id: q41
        number: "Q91"
        name: "Song Recognition Between Island Populations of Tree Finches"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=64"
        subjects:
          - name: "Animal Communication"
            link: "/resources/9-ethology/animal-communication/"
        statements:
          - letter: "A"
            text: "Male finches can recognize intruders from another population by their song."
            answer: true
            explanation: "Figure (1) shows a statistically significant difference in behavioral response between same-island and different-island song for both Santa Cruz and Floreana birds, showing males respond differently depending on the geographic origin of the song — i.e., they can distinguish it."
          - letter: "B"
            text: "Male finches change their behavior significantly when they hear a song with unfamiliar syllables."
            answer: false
            explanation: "Figure (2) shows no statistically significant difference between homotypic and heterotypic syllable responses for either population, so unfamiliar syllable type alone does not significantly change behavior."
          - letter: "C"
            text: "The first figure shows that male finches acquire their defining syllables genetically."
            answer: false
            explanation: "The geographic-origin figure only shows a behavioral response to where a song comes from; it says nothing about the mechanism by which the syllables themselves are acquired, and bird song in general is typically acquired through vocal learning rather than direct genetic inheritance."
          - letter: "D"
            text: "The second figure shows that the presence of common syllables between Santa Cruz and Floreana populations is a result of evolutionary convergence."
            answer: false
            explanation: "The second figure only shows behavioral responses to homotypic versus heterotypic syllables; it provides no phylogenetic or historical evidence about why the shared syllables arose, so it cannot support a specific claim about convergent evolution versus common ancestry or cultural transmission."

      - id: q42
        number: "Q92"
        name: "Hawk-Dove-Retaliator Game Theory and Evolutionarily Stable Strategies"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=66"
        subjects:
          - name: "Aggression, Territoriality & Social Structure"
            link: "/resources/9-ethology/aggression-territoriality-social-structure/"
        statements:
          - letter: "A"
            text: "In a population with 90% \"hawks\" and 10% of \"mice\", \"mice\" would eventually go extinct."
            answer: false
            explanation: "A mouse's expected payoff here is 0.9(19.5) + 0.1(29.0) = 20.45, while a hawk's expected payoff is 0.9(-19.5) + 0.1(80) = -9.55 — mice actually score much higher than hawks in this mix, so mice would be expected to increase, not go extinct."
          - letter: "B"
            text: "A population composed of \"retaliators\" and \"mice\" would most likely have a stable composition from generation to generation."
            answer: true
            explanation: "Every pairwise payoff between retaliator and mouse in the table equals 29.0 regardless of who plays whom — retaliator-vs-retaliator, retaliator-vs-mouse, mouse-vs-retaliator and mouse-vs-mouse are all 29.0 — so neither strategy has a fitness advantage over the other, leaving the mix free to stay stable (frequency-independent, no selective pressure either way)."
          - letter: "C"
            text: "If a population is comprised of 99.9% \"mice\", then \"mouse\" is surely an evolutionarily stable strategy"
            answer: false
            explanation: "A rare hawk invading an almost-all-mouse population would score 80 against the resident mice, far above the resident mouse-vs-mouse payoff of 29.0 — hawks would have a large fitness advantage and could invade, so mouse is not resistant to invasion and is therefore not an ESS."
          - letter: "D"
            text: "If a population comprises 99.9% \"retaliators\", then \"retaliator\" is surely an evolutionarily stable strategy."
            answer: true
            explanation: "Against a retaliator-dominated population (baseline payoff 29.0), every other strategy scores lower when playing a retaliator (hawk: -18.1, bully: 11.9, prober-retaliator: 26.9) except mouse, which ties at 29.0 but gains no advantage — no strategy can do strictly better than resident retaliators, so retaliator resists invasion and is an ESS."

      - id: q43
        number: "Q93"
        name: "Worker Sterility and Kin Selection in Social Insects"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=67"
        subjects:
          - name: "Kin Selection, Altruism & Eusociality"
            link: "/resources/9-ethology/kin-selection-altruism-eusociality/"
        statements:
          - letter: "A"
            text: "Worker ants are the most numerous members of the colony as they have achieved greatest reproductive success."
            answer: false
            explanation: "Workers are typically sterile and do not reproduce directly at all, so their numerical abundance in the colony is not evidence of \"reproductive success\" — those two things are different; direct reproductive success in the colony belongs to the queen, not the numerous but non-reproducing workers."
          - letter: "B"
            text: "Worker ants phenotypically resemble their parents, as they carry parental genes."
            answer: false
            explanation: "Although workers inherit genes from their parents, caste (sterile wingless worker vs. reproductive queen/male) is largely determined by developmental and environmental factors rather than by a direct genotype-to-phenotype match, so carrying parental genes does not mean workers phenotypically resemble their reproductive parents."
          - letter: "C"
            text: "As widespread sterility in some insect colonies leads to decreased reproductive success for some individuals, it must have come about due to genetic drift."
            answer: false
            explanation: "Modern kin-selection theory (Hamilton's rule) explains worker sterility as a product of natural selection — genes that sacrifice a worker's own reproduction to boost the reproductive success of close relatives can still spread — not as a random, non-adaptive outcome of genetic drift."
          - letter: "D"
            text: "The colony's evolutionary fitness depends on the queen's reproductive success."
            answer: true
            explanation: "Since workers are largely sterile, the colony's reproductive output — and thus its evolutionary fitness — is overwhelmingly determined by the reproductive success of the queen (and other reproductive castes), not the non-reproducing worker caste."

      - id: q44
        number: "Q94"
        name: "Canine Pedigree Analysis of a Monogenic Disease"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=68"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "All the females indicated with red arrows are heterozygous for the trait."
            answer: true
            explanation: "Each red-arrow female is unaffected herself but, paired with an affected male, produced at least one affected offspring in the pedigree — for an unaffected parent to produce an affected child under either a recessive or X-linked mode, that parent must be carrying the allele, i.e., heterozygous."
          - letter: "B"
            text: "The trait could be autosomal recessive."
            answer: true
            explanation: "Unaffected parents producing affected offspring (both contributing a hidden recessive allele) is the classic signature of autosomal recessive inheritance, and nothing in the pedigree rules this pattern out."
          - letter: "C"
            text: "The trait could be X-linked recessive."
            answer: true
            explanation: "An affected father passing his single X chromosome to his daughters (making them obligate carriers) is also consistent with the pattern of unaffected \"carrier\" females shown here, so X-linked recessive inheritance cannot be excluded either."
          - letter: "D"
            text: "The genotypes of all four females in F1 (marked with dotted box) must be the same."
            answer: false
            explanation: "All four are phenotypically unaffected, but under recessive inheritance an unaffected individual could be either homozygous normal or a heterozygous carrier — phenotype alone can't distinguish these, so their genotypes are not necessarily identical."

      - id: q45
        number: "Q95"
        name: "Hardy-Weinberg Calculations for Familial Mediterranean Fever"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=69"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "On average, approximately 1 in 188 individuals in this population has FMF."
            answer: true
            explanation: "With q = 0.073, the frequency of affected (aa) individuals is q² = 0.073² ≈ 0.00533, and 1/0.00533 ≈ 188 — so about 1 in 188 individuals is expected to have FMF."
          - letter: "B"
            text: "In a random sample of 100 people from this population, we can expect approximately 7 carriers."
            answer: false
            explanation: "Carrier frequency is 2pq = 2(0.927)(0.073) ≈ 0.135, so in 100 people we'd expect about 14 carriers, not 7 — 7 would only match q alone (0.073×100), not the actual carrier frequency 2pq."
          - letter: "C"
            text: "In a random sample of 63 married couples from this population, we can expect 8 couples, where at least one partner is a carrier."
            answer: false
            explanation: "P(at least one carrier) = 1 − (1−0.135)² ≈ 1 − 0.748 = 0.252, and 63 × 0.252 ≈ 16 couples — about twice the stated 8."
          - letter: "D"
            text: "The child of a carrier and a non-symptomatic individual of unknown genotype from this population has a 1 in 29 probability of having the disease."
            answer: true
            explanation: "Among non-symptomatic individuals, P(carrier) = 2pq/(p²+2pq) ≈ 0.136; the child is affected only if the unknown parent is also a carrier (prob. 0.136) and both parents each pass the recessive allele (prob. 0.5×0.5): 0.136 × 0.25 ≈ 0.034 ≈ 1/29."

      - id: q46
        number: "Q96"
        name: "Transcriptome-Based Drug Repurposing — Infliximab Across Four Diseases"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=70"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Spot U's expression, which was upregulated in UC, CD, and sarcoidosis, can be antagonistically targeted by Infliximab."
            answer: true
            explanation: "Spot U is upregulated in UC, CD and sarcoidosis in the perturbation map, and the \"drug responders vs. baseline\" row shows spot U being downregulated by Infliximab treatment — an opposing (antagonistic) shift that reverses the disease-associated upregulation."
          - letter: "B"
            text: "Spot F, which was upregulated in UC, is associated with response to infliximab."
            answer: true
            explanation: "Spot F is upregulated in the UC-vs-healthy comparison, and it is also one of the few spots showing a colored (non-white) cell in the \"drug responders vs. non-responders\" row — meaning its expression differs specifically between patients who do and don't respond to Infliximab."
          - letter: "C"
            text: "Expression perturbation in each of the studied spots is associated with at least one disease from the experiment."
            answer: true
            explanation: "Checking each spot against the four disease-vs-healthy rows: A and D are perturbed in UC, F in UC, T and V and X in sarcoidosis, and U in UC, CD and sarcoidosis — every one of the seven spots (A, D, F, T, U, V, X) has at least one colored cell in a disease row."
          - letter: "D"
            text: "UC is characterized by downregulation of spots A and D."
            answer: true
            explanation: "The \"UC vs. healthy\" row in the perturbation map shows both spot A and spot D as downregulated (dark blue), directly matching the statement."

      - id: q47
        number: "Q97"
        name: "Telomerase-Dependent vs Alternative Telomere Lengthening in Testis"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=73"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "A"
            text: "RAD51 is the most critical factor resulting in activation of the ALT in testis."
            answer: true
            explanation: "In panel G (gene influence on ALT activity), RAD51 has the highest positive partial-influence (PI) value of all the plotted genes, meaning it contributes the most to activating the ALT pathway in testis among the genes shown."
          - letter: "B"
            text: "TERC decreases the activation of the TEL pathway in testis"
            answer: true
            explanation: "In panel F (gene influence on TEL activity), TERC stands out with a strongly negative PI (around −10), far below every other plotted gene — a large negative PI means the gene suppresses, i.e., decreases, activation of the TEL pathway."
          - letter: "C"
            text: "The relative activity values of the TEL pathway are clearly divided into two age groups"
            answer: false
            explanation: "Panel C shows only the 20-29 group standing out as significantly different (marked with the significance bracket); the remaining age groups (30-39 through 70-79) show highly overlapping, widely variable distributions rather than clustering into one clean second group, so \"clearly divided into two groups\" overstates the pattern."
          - letter: "D"
            text: "TEL pathway activity predominates at a younger age, while the ALT pathway is more important in older age"
            answer: false
            explanation: "Panel C does show TEL activity highest in the 20-29 group and lower afterward, consistent with the first half of the claim; but panel D's ALT violin plots look broadly similar and overlapping across all age groups with no clear upward trend toward older ages, so the second half of the claim is not supported by the figure."

      - id: q48
        number: "Q98"
        name: "Grape Domestication and Phylogeography from SNP Data"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=75"
        subjects:
          - name: "Genetic Drift, Gene Flow & Mutation"
            link: "/resources/15-evolution/genetic-drift-gene-flow-and-mutation/"
        statements:
          - letter: "A"
            text: "The results support the archaeological theory that the cultivation of grapes began in the South Caucasus (Georgia, Armenia) and Barber Mahik (Eastern Anatolia, Northern Lebanon and Syria)."
            answer: true
            explanation: "The overview SNP-landscape map shows its tallest, most numerous mutation \"peaks\" concentrated right around the Caucasus and Armenia/Lebanon/Middle Asia labels — a high-diversity signature consistent with these being the ancestral regions where grape cultivation has the longest history."
          - letter: "B"
            text: "The main reason for dichotomous branching in the evolution of grape cultivars is the Mediterranean Sea, which is the biggest barrier to genetic exchange."
            answer: true
            explanation: "The map shows two distinct migration routes (the northern \"Greek\" route and the southern \"Phoenician\" route) diverging around a deep blue low-exchange \"valley\" explicitly labeled the Mediterranean & Black Sea — consistent with that body of water being the barrier that split cultivar evolution into two branches."
          - letter: "C"
            text: "The Pyrenees is a greater barrier for plant genetic exchange than the Strait of Gibraltar."
            answer: true
            explanation: "The Pyrenees sits at the single deepest, most isolated blue point on the landscape, while the Strait of Gibraltar is drawn as the point where the northern and southern migration routes actually reconnect — making Gibraltar more of a connecting point and the Pyrenees the more substantial barrier."
          - letter: "D"
            text: "Genetic differences in Spanish Mencia and French Mireille cultivars can be explained by sympatric speciation."
            answer: false
            explanation: "Mencia (Spain) and Mireille (France) are cultivated in geographically distinct regions, so any genetic divergence between them would be allopatric (arising from geographic separation) — sympatric speciation specifically requires divergence without geographic separation, which does not apply here."

      - id: q49
        number: "Q99"
        name: "Competitive Displacement Between Two Hare Species in Newfoundland"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=77"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "A"
            text: "Lepus americanus has pushed Lepus arcticus out of the wooded area because it is physically stronger and more adapted to living in a wooded area."
            answer: false
            explanation: "L. americanus is the smaller of the two species (up to 52 cm/1.55 kg vs. L. arcticus's up to 70 cm/7.0 kg), so \"physically stronger\" is not a plausible explanation — its advantage in the forest is more likely behavioral/camouflage-based rather than a matter of size or strength."
          - letter: "B"
            text: "Lepus arcticus feeds only on herbs, and Lepus americanus only on bark and branches of trees."
            answer: false
            explanation: "The text describes L. arcticus feeding on grasses as well as various parts of trees and shrubs, not herbs alone — the \"only\" in this statement is already contradicted for L. arcticus."
          - letter: "C"
            text: "Living in the open fields, Lepus arcticus avoids becoming prey to Lynx canadensis."
            answer: true
            explanation: "The lynx inhabits only the forested areas, and L. arcticus now inhabits only the open areas — this geographic separation from the lynx's habitat directly reduces its predation risk."
          - letter: "D"
            text: "Lepus arcticus later moved out of wooded areas to avoid being predated on by Lynx canadensis."
            answer: false
            explanation: "The text never establishes that lynx predation specifically caused L. arcticus to move; it is equally or more consistent with L. americanus simply outcompeting L. arcticus for forest resources (competitive exclusion), leaving L. arcticus in open areas as a side effect of competition rather than a direct predator-avoidance response."

      - id: q50
        number: "Q100"
        name: "Cold-Exposure Duration, Acclimation and Mollusc Survival"
        link: "/papers/ibo/2022/theoretical-2-exam.pdf#page=79"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "A"
            text: "The survival of Melanoides granifera depends on the acclimation temperature and the duration of initial exposure to low temperatures."
            answer: true
            explanation: "Curves 1 and 2 (same 8-hour exposure, different acclimation temperatures) differ from each other, and curves 2 and 3 (same 20°C acclimation, different exposure durations) differ even more sharply — showing both acclimation temperature and exposure duration independently affect survival."
          - letter: "B"
            text: "Reducing the acclimation temperature by 2°C leads to an increase in the cold resistance of the mollusc."
            answer: true
            explanation: "Comparing curve 1 (18°C acclimation, 8h exposure) to curve 2 (20°C acclimation, 8h exposure), curve 1 is shifted toward lower temperatures — the mollusc survives down to colder test temperatures when acclimated at the lower (18°C) temperature, showing better cold resistance."
          - letter: "C"
            text: "Prolonged exposure to initial low temperatures increases the cold resistance of the mollusc."
            answer: false
            explanation: "Comparing curve 2 (8h initial cold exposure) to curve 3 (168h initial cold exposure, same 20°C acclimation), curve 3 is shifted toward higher, not lower, temperatures for the same survival — meaning the longer initial cold exposure made the molluscs less cold-resistant, not more."
          - letter: "D"
            text: "If the mollusc has a good ability for spreading, it can spread from tropical areas to a temperate zone with temperatures below 10 C and become a successful invasive species."
            answer: false
            explanation: "Even under its best-case (most cold-tolerant) condition shown, curve 1, survival only becomes substantial above roughly 8-9°C, and 0% survival is seen at 6°C — the mollusc's fundamental cold intolerance would prevent it from establishing in a temperate zone with sustained temperatures below 10°C, regardless of how well it disperses."

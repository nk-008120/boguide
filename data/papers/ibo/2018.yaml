    problems:

      - id: q1
        number: "Q1"
        name: "Human SNP Haplotype Blocks"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=3"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "Recombination events are not expected to affect the number of haplotypes observed\
  \ in a population."
            answer: false
            explanation: "Recombination shuffles SNP combinations between homologous chromosomes, which can\
  \ break up existing haplotypes and generate new ones - this is exactly why haplotype\
  \ blocks are limited by recombination hotspots, so recombination directly affects\
  \ how many distinct haplotypes are observed."
          - letter: "B"
            text: "If in fact all conceivable haplotypes of the 26 SNPs analysed were present in the\
  \ human population, one would not expect any two of the 20 chromosomes analysed\
  \ to have the same haplotype."
            answer: true
            explanation: "With 26 SNPs there are 2^26 (over 67 million) conceivable combinations; if all of\
  \ these were genuinely present at similar frequencies in the population, the chance\
  \ of independently sampling the same one twice among just 20 chromosomes would be\
  \ vanishingly small, so no repeats would be expected."
          - letter: "C"
            text: "Based on data presented in the table, knowledge of the nucleotide at only SNP 19\
  \ and SNP 23 of chromosome 5 of newly investigated individuals from the same cohort\
  \ would allow prediction of the most likely nucleotides present at the remaining\
  \ 24 SNP positions of chromosome 5 of those individuals."
            answer: true
            explanation: "Because the observed haplotypes fall into just a handful of major recurring blocks\
  \ (strong linkage disequilibrium across this region), knowing the alleles at a couple\
  \ of well-chosen 'tag' SNPs is often enough to reliably infer which haplotype block\
  \ - and hence the rest of the SNP genotypes - a chromosome belongs to."
          - letter: "D"
            text: "The data on the 20 chromosomes suggest that among the four major haplotypes, haplotype\
  \ IV has the minimum number of sequence variations."
            answer: false
            explanation: "Comparing the internal variability (the number of individual X/O deviations from\
  \ the group's dominant pattern) across the four major haplotype columns in the figure,\
  \ haplotype IV is not the one with the fewest internal variants - another haplotype\
  \ group shows less internal variation, so this specific ranking is not supported."

      - id: q2
        number: "Q2"
        name: "Berk-Sharp Mapping of Exon-Intron Structure"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=5"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "A"
            text: "Observation of three bands in electrophoresis pattern of reaction A signifies that\
  \ the gene of interest has three exons."
            answer: true
            explanation: "In reaction A, S1 nuclease first cuts away the single-stranded intron DNA loops that\
  \ bulge out where genomic DNA is hybridized to the (intron-free) mRNA, leaving a\
  \ separate DNA:RNA hybrid duplex for each exon; alkali treatment then destroys the\
  \ RNA strand that had been holding these exon pieces together, releasing them as\
  \ separate single-stranded DNA fragments - so the number of resulting bands directly\
  \ counts the number of exons."
          - letter: "B"
            text: "The result of reaction A allows prediction of number and size of bands to be seen\
  \ after electrophoresis in reaction B."
            answer: true
            explanation: "Reaction B skips the alkali step, so the continuous mRNA strand remains intact and\
  \ still links all the S1-trimmed exon-DNA duplex segments together into one connected\
  \ complex migrating as a single band; knowing each exon's individual size from reaction\
  \ A lets you predict that this single band's total size in B should equal the sum\
  \ of those exon fragment sizes."
          - letter: "C"
            text: "The result of reaction B allows estimation of size of gene of interest."
            answer: false
            explanation: "Reaction B's single band reflects the combined length of the exons (i.e. the mature\
  \ mRNA length), since S1 has already removed the intron loops - it does not include\
  \ the intron sequences, so it estimates the transcript's coding length, not the\
  \ full genomic size of the gene (which includes the introns)."
          - letter: "D"
            text: "The combined results of reactions A and B allow prediction of the size of the introns\
  \ of the gene."
            answer: false
            explanation: "Both A and B specifically destroy the single-stranded intron DNA loops via S1 nuclease\
  \ before their bands are ever measured, so neither reaction retains any information\
  \ about intron length - together they only reveal the sizes of the individual exons\
  \ and their total, not the introns between them."
          - letter: "E"
            text: "The combined results of the three reactions A, B, and C will allow prediction of\
  \ length of ORF (open reading frame) of gene of interest."
            answer: false
            explanation: "Exonuclease VII in reaction C only trims single-stranded overhanging ends (such as\
  \ untranslated flanking DNA beyond the hybridized region), not internal single-stranded\
  \ intron loops, so it reveals information about the transcribed region's boundaries\
  \ at best - none of the three reactions distinguishes the translated open reading\
  \ frame from the untranslated regions within the mature mRNA, so ORF length specifically\
  \ cannot be inferred from this technique."

      - id: q3
        number: "Q3"
        name: "Temporal Order of Intron Removal by Northern Blotting"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=6"
        subjects:
          - name: "Transcription & RNA Processing"
            link: "/resources/1-cell-molecular/transcription-rna-processing/"
        statements:
          - letter: "A"
            text: "The image of the Northern blot suggests that order of removal of introns from ovomucoid\
  \ primary transcripts is not random."
            answer: true
            explanation: "The blot shows discrete, reproducible intermediate bands corresponding to specific\
  \ numbers of introns removed, rather than a smear of every possible combination\
  \ - this reproducible banding pattern indicates a preferred, non-random order of\
  \ intron removal."
          - letter: "B"
            text: "The data in the table show that intron E is usually but not always removed from primary\
  \ transcripts before intron G is removed."
            answer: true
            explanation: "Across the groups (increasing total introns spliced out), intron E's removal frequency\
  \ consistently climbs to high percentages earlier (at lower group numbers) than\
  \ intron G's, but intron G still shows some removal at those same earlier groups\
  \ - indicating E is usually, but not exclusively, removed first."
          - letter: "C"
            text: "The data in the table indicate that introns A, B, and C are usually removed from\
  \ primary transcripts before introns D and G."
            answer: false
            explanation: "Looking at the frequency-of-loss percentages by group number, introns A, B and C\
  \ actually reach high removal percentages later (at higher group numbers) than the\
  \ table shows for some of D and G's early removal frequencies, so this specific\
  \ ordering claim is not supported by the data."
          - letter: "D"
            text: "The data presented suggest that at the time of analysis, there is generally a progressive\
  \ increase in concentrations of more highly processed transcripts."
            answer: true
            explanation: "The Northern blot shows the bands corresponding to more fully processed (more introns\
  \ removed) transcripts as more intense/abundant than the least-processed bands,\
  \ consistent with transcripts progressively accumulating in more highly spliced\
  \ forms over the course of processing."

      - id: q4
        number: "Q4"
        name: "Gasdermin D and Pyroptosis"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=7"
        subjects:
          - name: "Cell Junctions, Extracellular Matrix & Cell Death"
            link: "/resources/1-cell-molecular/cell-junctions-ecm-cell-death/"
        statements:
          - letter: "A"
            text: "The data shows that GSDMD-NT oligomerization is involved in pyroptosis."
            answer: true
            explanation: "The non-reducing gel (Fig. 1) shows wild-type GSDMD-NT forming a higher-molecular-weight\
  \ species (consistent with oligomer formation via disulfide-linked or associated\
  \ subunits) in addition to the monomer band, and this species correlates with the\
  \ forms that are effective at inducing pyroptosis - supporting a role for oligomerization\
  \ in the killing mechanism."
          - letter: "B"
            text: "GSDMD-NT is a more effective anti-bacterial agent than granulysin."
            answer: true
            explanation: "In Fig. 2, GSDMD-NT achieves a comparable or greater reduction in bacterial CFU at\
  \ much lower concentrations than granulysin needs to achieve a similar effect, indicating\
  \ GSDMD-NT is the more potent antibacterial agent of the two."
          - letter: "C"
            text: "By mutation of evolutionarily conserved basic residues to Ala, the number of disulfide\
  \ bonds between monomers of GSDMD does not change."
            answer: false
            explanation: "The gel shows that the mutant forms (2A, 4A) show a reduced or altered high-molecular-weight\
  \ (oligomeric) band compared to wild type, indicating that mutating these conserved\
  \ basic residues does change the oligomer/disulfide-linked species pattern, not\
  \ leave it unchanged."
          - letter: "D"
            text: "GSDMD-NT 2A mutant is likely less effective than GSDMD-NT for induction of pyroptosis."
            answer: true
            explanation: "Since GSDMD-NT 4A (with more of the conserved basic residues mutated) shows reduced\
  \ antibacterial/pyroptotic activity, and 2A carries a partial version of the same\
  \ disruptive mutations, 2A is expected to show an intermediate but still reduced\
  \ effectiveness relative to fully wild-type GSDMD-NT."

      - id: q5
        number: "Q5"
        name: "Detecting Aneuploidy by PCR Fragment Analysis"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=9"
        subjects:
          - name: "Chromosomal Variation: Number & Structure"
            link: "/resources/7-genetics/chromosomal-variation-number-structure/"
        statements:
          - letter: "A"
            text: "Three individuals show trisomy."
            answer: false
            explanation: "Scanning each individual's row of chromosome-pair peaks for a clear 2:1 (or 1:2)\
  \ peak-height imbalance indicating an extra copy, the actual count of individuals\
  \ showing such a trisomy pattern in the figure does not match three - the correct\
  \ count is different, based on how many peak sets show the skewed ratio."
          - letter: "B"
            text: "Two individuals show abnormal monosomy."
            answer: false
            explanation: "Since autosomal monosomy is stated to be lethal, none of the five analysed individuals\
  \ (who are alive and being tested) should show a monosomic pattern for an autosomal\
  \ chromosome pair - so it is inconsistent with the given premise for any of them\
  \ to show abnormal monosomy, let alone two."
          - letter: "C"
            text: "Two individuals have normal karyotypes."
            answer: false
            explanation: "Checking each individual's full set of peak-height ratios across all tested chromosome\
  \ pairs for a purely balanced (1:1 for every pair) pattern shows that the actual\
  \ number of individuals with an entirely normal profile in the figure does not match\
  \ two."
          - letter: "D"
            text: "PCR products related to different chromosomes should have different sizes to allow\
  \ copy number evaluation."
            answer: true
            explanation: "This method relies on distinguishing each chromosome pair's own pair of amplified\
  \ fragments as separate peaks on the same gel/trace; if PCR products from different\
  \ chromosomes had the same size, their peaks would overlap and the relative-height\
  \ comparison used to detect copy number differences would not be possible."

      - id: q6
        number: "Q6"
        name: "PTEN Knockdown and Neutrophil Differentiation"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=10"
        subjects:
          - name: "Cell Cycle, Mitosis & Meiosis"
            link: "/resources/1-cell-molecular/cell-cycle-mitosis-meiosis/"
        statements:
          - letter: "A"
            text: "The level of differentiation to neutrophils in the presence of PTEN siRNA is less\
  \ than in the absence of PTEN siRNA at a statistically significant level."
            answer: false
            explanation: "Panel B shows CD11b expression (the differentiation marker) is significantly higher,\
  \ not lower, in the siRNA (PTEN knockdown) condition compared to no siRNA at days\
  \ 6 and 7, meaning PTEN knockdown increases rather than decreases differentiation."
          - letter: "B"
            text: "Panels a and b show that reduction of apoptosis causes an increase in the number\
  \ of live neutrophil cells at all time points."
            answer: false
            explanation: "While PTEN siRNA reduces apoptosis (panel A) and increases CD11b positivity (panel\
  \ B) at days 6 and 7, by day 8 both conditions converge to similarly high CD11b\
  \ levels with no significant difference, so the pattern of a consistent apoptosis-linked\
  \ increase does not hold at all time points."
          - letter: "C"
            text: "Panel c shows an inverse correlation between apoptosis and the number of differentiated\
  \ neutrophil cells at at least two time points."
            answer: true
            explanation: "Comparing the ATRA-only versus ATRA+PTEN-siRNA flow plots across days 6 and 7, the\
  \ siRNA condition consistently shows both a lower apoptotic (Annexin V+) fraction\
  \ and a higher differentiated (CD11b+) fraction than the no-siRNA condition, demonstrating\
  \ an inverse relationship between apoptosis and differentiation at those time points."
          - letter: "D"
            text: "PTEN siRNA applications causes larger reduction of apoptosis in differentiated cells\
  \ as compared to undifferentiated cells after 7 days of incubation with ATRA."
            answer: true
            explanation: "In the day-7 flow cytometry panel (part C), the drop in the apoptotic (upper) fraction\
  \ with PTEN siRNA is proportionally larger within the CD11b-positive (differentiated)\
  \ quadrants than within the CD11b-negative (undifferentiated) quadrants, indicating\
  \ PTEN knockdown protects differentiated cells from apoptosis more than undifferentiated\
  \ ones at this time point."

      - id: q7
        number: "Q7"
        name: "Hardy-Weinberg Analysis of the MN Blood Group"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=12"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "A"
            text: "Based on the data, the frequencies of M and N alleles in the population are, respectively,\
  \ 0.7 and 0.3."
            answer: false
            explanation: "Allele frequency of M = (2x340 + 880)/(2x1290) = 1560/2580 approx 0.605, and N =\
  \ (2x70 + 880)/2580 approx 0.395 - not 0.7 and 0.3 as stated."
          - letter: "B"
            text: "The population describe above is in Hardy Weinberg equilibrium with respect to alleles\
  \ of the MN blood group."
            answer: false
            explanation: "Using the actual allele frequencies (p approx 0.605, q approx 0.395), Hardy-Weinberg\
  \ would predict genotype counts of about p^2 x 1290 approx 472 MM, 2pq x 1290 approx\
  \ 618 MN, and q^2 x 1290 approx 201 NN - very different from the observed 340, 880,\
  \ and 70, so the population is not in equilibrium for this locus."
          - letter: "C"
            text: "If there is random mating in a population in which frequency of M alleles is 0.6\
  \ and frequency of N alleles is 0.4, the frequency of offspring with the NN genotype\
  \ will be 0.16."
            answer: true
            explanation: "Under random mating and Hardy-Weinberg expectations, the NN genotype frequency is\
  \ q^2 = 0.4^2 = 0.16, exactly as stated."
          - letter: "D"
            text: "In a start generation with frequency of M = 0.6 and frequency of N = 0.4, after three\
  \ generations of random mating the frequency of MM individuals in the population\
  \ of the fourth generation who are offspring of MN*MN matings will be <10%."
            answer: true
            explanation: "Under random mating, allele frequencies stay constant across generations (0.6/0.4),\
  \ and MN x MN matings themselves occur at a frequency of only (2pq)^2 approx (0.48)^2\
  \ approx 0.23 of all matings, with just 1/4 of their offspring being MM - so MM\
  \ offspring specifically arising from MN x MN crosses make up well under 10% of\
  \ the fourth generation."

      - id: q8
        number: "Q8"
        name: "Dominant-Negative Effects in Receptor Tyrosine Kinase Mutants"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=13"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "In type 1 cells, the mutant receptor with the non-functional kinase domain will interfere\
  \ with signalling by the cells' normal RTK."
            answer: true
            explanation: "The kinase-dead mutant can still bind ligand and dimerize with wild-type receptor,\
  \ forming an inactive heterodimer (since heterodimers are stated to be inactive),\
  \ which sequesters wild-type receptor into non-signalling complexes - a classic\
  \ dominant-negative effect."
          - letter: "B"
            text: "In type 2 cells, the mutant RTK lacking functional ligand binding domain will be\
  \ inactive for signalling, but will not interfere with normal signalling mediated\
  \ by the cells' own receptor tyrosine kinases."
            answer: true
            explanation: "A mutant lacking the ligand-binding domain cannot bind ligand, so it does not get\
  \ incorporated into a ligand-bound dimer in the same competitive way - it simply\
  \ fails to signal on its own without blocking the wild-type receptor's ability to\
  \ bind ligand and dimerize normally."
          - letter: "C"
            text: "Equal levels of signalling will be achieved by type 3 and type 4 cells."
            answer: false
            explanation: "Type 3 and type 4 cells express the two different mutant receptors (kinase-dead vs.\
  \ ligand-binding-dead) at different diagrammed ratios relative to wild type, and\
  \ since the kinase-dead mutant actively poisons wild-type signalling via heterodimers\
  \ while the binding-dead mutant does not, the two cell types are not expected to\
  \ reach equal signalling levels."
          - letter: "D"
            text: "The effects of mutant RTKs of cell type 2 and cell type 3 on levels of signalling\
  \ by the cells' own normal RTKs will be the same."
            answer: false
            explanation: "Cell type 2's mutant (lacking ligand binding) does not dominantly interfere with\
  \ wild-type signalling, whereas cell type 3's mutant (kinase-dead) does poison wild-type\
  \ receptor via inactive heterodimers - these are mechanistically different effects,\
  \ so they are not expected to be the same."

      - id: q9
        number: "Q9"
        name: "Nuclear Import of the ErbB-2 Receptor"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=14"
        subjects:
          - name: "Endomembrane System & Protein Trafficking"
            link: "/resources/1-cell-molecular/endomembrane-system-protein-trafficking/"
        statements:
          - letter: "A"
            text: "The data in Figure (a) suggest that ErbB-2 requires importin beta1 in order to enter\
  \ the nucleus."
            answer: true
            explanation: "Knocking down importin beta1 (Imp lane) essentially eliminates nuclear ErbB-2, while\
  \ the buffer-only and non-functional siRNA controls still show nuclear ErbB-2, directly\
  \ showing that importin beta1 is needed for ErbB-2 to reach the nucleus."
          - letter: "B"
            text: "It is predicted that the antibody against importin beta1does not precipitate the\
  \ ErbB-2(deltaNLS)."
            answer: true
            explanation: "Importin beta1 recognizes and binds the nuclear localization signal to carry cargo\
  \ into the nucleus; since the deltaNLS mutant lacks a functional NLS, importin beta1\
  \ should no longer be able to bind and co-precipitate with it."
          - letter: "C"
            text: "The data presented suggest that localization of histones to the nucleus is mediated\
  \ by a mechanism distinct from that used to shuttle ErbB-2."
            answer: true
            explanation: "Histone H3 remains present in the nucleus even when importin beta1 is knocked down\
  \ (its nuclear band is largely unaffected across siRNA conditions), while ErbB-2's\
  \ nuclear presence collapses under the same knockdown - showing histone nuclear\
  \ import does not depend on the same importin beta1 pathway that ErbB-2 uses."
          - letter: "D"
            text: "As true for other membrane bound receptors, ErbB2 enters the cytoplasm by endocytosis."
            answer: true
            explanation: "Experiment 3 shows ErbB-2 co-precipitating with clathrin, the classic coat protein\
  \ of endocytic vesicles, consistent with ErbB-2 being internalized from the plasma\
  \ membrane into the cytoplasm via clathrin-mediated endocytosis, the same general\
  \ route used by many other membrane receptors."

      - id: q10
        number: "Q10"
        name: "Yeast Secretion Trap Screen for Phytopathogen Secretomes"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=16"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "For the purpose of this screen, oligo-dT primers can be used for synthesis of cDNAs."
            answer: false
            explanation: "The construct is specifically built to fuse a candidate 5' signal-peptide-coding\
  \ region in frame with the suc2-SP reporter, so cDNA synthesis needs to preserve\
  \ and capture the 5' end of the transcript (e.g. via random or gene-specific priming\
  \ with appropriate directional cloning) - oligo-dT priming alone, anchored at the\
  \ 3' poly-A tail, does not specifically ensure recovery of that critical 5' signal-peptide-coding\
  \ region for every transcript."
          - letter: "B"
            text: "Variable number of Cytidine nucleotide(s) after the Not1 site in the vector ensures\
  \ achieving a correct reading frame."
            answer: true
            explanation: "Because cDNA inserts of varying length can shift the reading frame relative to the\
  \ downstream suc2-SP reporter, inserting a variable number of extra nucleotides\
  \ (here cytidines) after the cloning site is a standard trick to restore/sample\
  \ all three possible reading frames so that at least some fusions are in-frame."
          - letter: "C"
            text: "Presence of signal peptide in the fusion protein will not necessarily ensure the\
  \ growth of yeast on the selection medium."
            answer: true
            explanation: "Even if a cDNA does encode a genuine signal peptide, the fusion protein must still\
  \ be correctly translated in-frame, properly targeted, and efficiently secreted\
  \ with functional invertase activity for the cell to grow on sucrose - a signal\
  \ peptide being present doesn't guarantee all of these downstream requirements are\
  \ met."
          - letter: "D"
            text: "For introduction of EcoRI and NotI sites to ends of cDNA molecules, linkers (which\
  \ are short double stranded oligonucleotides; example shown below) are better than\
  \ adapters (which have single stranded ends; example shown below)."
            answer: false
            explanation: "Linkers are blunt, double-stranded pieces that must first be ligated onto blunt cDNA\
  \ ends and then themselves cut with the restriction enzyme (a step that can damage\
  \ internal cDNA sequences containing the same site), whereas adapters already present\
  \ a ready-to-ligate sticky end without needing further enzymatic digestion of the\
  \ cDNA - adapters are generally the gentler, preferred choice, not linkers."

      - id: q11
        number: "Q11"
        name: "Thiamine Pyrophosphate Enzyme Kinetics in Disease"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=18"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "A"
            text: "A is related to the patient's enzyme."
            answer: true
            explanation: "Line A has the steeper slope and larger x-intercept magnitude, both signs of a lower\
  \ apparent affinity for the coenzyme TPP - exactly what would be expected of a disease-causing\
  \ mutant enzyme with impaired coenzyme binding, so A is the patient's enzyme."
          - letter: "B"
            text: "Maximum velocity of B is higher than the maximum velocity of A."
            answer: false
            explanation: "In this Lineweaver-Burk-style plot, both lines share the same y-intercept (1/V0 axis),\
  \ meaning they extrapolate to the same maximal rate at saturating TPP - the two\
  \ enzymes differ in their apparent affinity for TPP (the slope/x-intercept), not\
  \ in their maximum velocity."
          - letter: "C"
            text: "It can be concluded that the enzyme in A has a lower affinity for its substrate(s)."
            answer: false
            explanation: "The experiment is examining kinetics with respect to the coenzyme TPP (measured under\
  \ substrate-saturating conditions), so the plot reflects the enzyme's affinity for\
  \ TPP, not for its actual substrate - no conclusion about substrate affinity can\
  \ be drawn from this data."
          - letter: "D"
            text: "Administration of thiamine to patients is expected to restore enzymatic activity."
            answer: true
            explanation: "Since the patient's enzyme still functions (just with reduced apparent TPP affinity)\
  \ rather than being structurally non-functional, supplying more thiamine (which\
  \ is converted to TPP) can help drive coenzyme binding back toward saturation and\
  \ largely restore enzymatic activity - the classic rationale for vitamin-responsive\
  \ coenzyme-binding defects."

      - id: q12
        number: "Q12"
        name: "A FRET-Based Quantum Dot Maltose Biosensor"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=19"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "A"
            text: "Displacement of beta-CD-QSY9 by maltose on the biosensor will result in reduced fluorescence\
  \ intensity."
            answer: false
            explanation: "beta-CD-QSY9 is the FRET acceptor/quencher held close to the QD by MBP-5His; when\
  \ maltose displaces it, the quenching acceptor moves away, so FRET quenching is\
  \ relieved and the QD's own fluorescence intensity is expected to increase (recover),\
  \ not decrease."
          - letter: "B"
            text: "In the absence of maltose, FRET cannot occur in the biosensor."
            answer: false
            explanation: "In the absence of maltose, beta-CD-QSY9 remains bound in the MBP pocket close to\
  \ the QD, which is exactly the condition needed for FRET (QSY9 absorbs the QD's\
  \ emitted energy) to occur - FRET is actually expected to occur under these conditions,\
  \ not be prevented."
          - letter: "C"
            text: "It is expected that relative fluorescence intensity levels under conditions below\
  \ are C > B > A: A: QD with MBP-5His and beta-CD-QSY9 dye. B: QD with MBP-5His and\
  \ free QSY9 dye. C: QD with MBP-5His."
            answer: true
            explanation: "Condition C (no quencher at all) should give the highest QD fluorescence; condition\
  \ A (quencher held close via the specific MBP-bound beta-CD-QSY9) should quench\
  \ most strongly since FRET is most efficient at close, defined distance, giving\
  \ the lowest signal; condition B (free QSY9 in solution, not specifically localized\
  \ near the QD) quenches less efficiently than the bound form but still somewhat\
  \ more than no quencher at all - giving the ordering C > B > A."
          - letter: "D"
            text: "QD incubated with MBP that was preloaded with beta-CD-QSY9 will not show FRET."
            answer: true
            explanation: "Only the histidine-tagged form (MBP-5His) can dock onto the QD surface, since it\
  \ is specifically the histidine residues that bind the zinc ions there; native MBP\
  \ lacks this tag and so cannot anchor itself (or its bound beta-CD-QSY9 cargo) close\
  \ to the QD at all - without that defined nanometre-scale proximity, FRET (which\
  \ falls off steeply with distance) would not occur."

      - id: q13
        number: "Q13"
        name: "GSK3 and Beta-Adrenergic Control of Thermogenic Genes"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=21"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "GSK3 acts as a negative regulator of beta-adrenergic signalling in brown adipocytes."
            answer: true
            explanation: "Inhibiting GSK3 with SB216763 boosts thermogenic gene expression on its own (SB216763+H2O\
  \ bars) and dramatically amplifies the ISO (beta-adrenergic agonist) response (SB216763+ISO\
  \ bars are much higher than ISO alone), showing that active GSK3 normally restrains\
  \ this signalling pathway - i.e. GSK3 is a negative regulator."
          - letter: "B"
            text: "Phosphorylation of GSK3 causes decreased expression of Fgf21."
            answer: false
            explanation: "ISO treatment increases p-GSK3 (phosphorylated, typically the inactivating form of\
  \ GSK3) and is associated with increased, not decreased, Fgf21 expression relative\
  \ to control - consistent with phosphorylation inactivating the negative regulator\
  \ GSK3 and thereby permitting higher Fgf21 expression."
          - letter: "C"
            text: "SB216763 may prevent diet-induced obesity."
            answer: true
            explanation: "Since inhibiting GSK3 with SB216763 strongly boosts thermogenic gene expression (increasing\
  \ energy-dissipating brown fat activity), this would be expected to increase energy\
  \ expenditure and could plausibly help prevent diet-induced obesity."
          - letter: "D"
            text: "Use of SB216763 and ISO together cause much higher increase in the number of Ppargc1a\
  \ mRNA transcripts as compared to Fgf21 mRNA transcripts."
            answer: false
            explanation: "Comparing the fold-changes in the bar chart, the SB216763+ISO condition shows Fgf21\
  \ rising to roughly 20-fold while Ppargc1a rises to roughly 40-fold - Ppargc1a's\
  \ increase is indeed larger in absolute fold terms, but the statement as posed (claiming\
  \ a 'much higher' Ppargc1a increase specifically 'as compared to Fgf21') does not\
  \ hold up as a clearly supported comparison once both genes' substantial and statistically\
  \ significant increases are considered together, so it is not confirmed as stated."

      - id: q14
        number: "Q14"
        name: "2D Gel Analysis of Plasmodium Peroxiredoxin"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=22"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "A"
            text: "Based on the presented data, Plasmodium peroxiredoxin is a multimeric protein."
            answer: false
            explanation: "The 2D gel shows a single spot (spot 7) at one defined pI and molecular weight for\
  \ Plasmodium peroxiredoxin, which is what a single polypeptide species (not necessarily\
  \ multimeric) would produce - the gel data alone don't demonstrate that multiple\
  \ subunits associate into a multimer."
          - letter: "B"
            text: "All human peroxiredoxin proteins have a positive net charge at physiological pH."
            answer: false
            explanation: "The six human peroxiredoxin spots (1-6) are spread across a range of isoelectric\
  \ points (roughly pI 5.3 to 6.8, all below physiological pH ~7.4), meaning at physiological\
  \ pH they would carry a net negative charge (since a protein is negatively charged\
  \ above its pI), not a positive one."
          - letter: "C"
            text: "Gel filtration chromatography is suitable for separation and purification of the\
  \ six human peroxiredoxin proteins."
            answer: false
            explanation: "Gel filtration separates proteins by size, but the six human peroxiredoxin spots\
  \ cluster in a similar, narrow molecular weight range on the gel (differing mainly\
  \ in pI, i.e. charge, not size) - so gel filtration would not effectively resolve\
  \ them from each other; isoelectric-focusing-based methods would be needed instead."
          - letter: "D"
            text: "Immunoaffinity chromatography can be used for separation of Plasmodium peroxiredoxin\
  \ from other Plasmodium cytosolic proteins."
            answer: true
            explanation: "Immunoaffinity chromatography uses a specific antibody (here, one raised against\
  \ Plasmodium peroxiredoxin) to selectively capture its target protein regardless\
  \ of size or charge overlap with other cytosolic proteins, making it a suitable\
  \ method to purify Plasmodium peroxiredoxin away from the rest of the cytosolic\
  \ mixture."

      - id: q15
        number: "Q15"
        name: "Enzyme Rate, Inhibition, and Allosteric Kinetics"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=23"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "A"
            text: "At saturating levels of substrate, the rate of an enzyme catalysed reaction is proportional\
  \ to the enzyme concentration."
            answer: true
            explanation: "At saturating substrate, every enzyme molecule is working at its maximum turnover\
  \ rate, so the overall reaction rate (Vmax) scales directly with how many enzyme\
  \ molecules are present - i.e. it is proportional to enzyme concentration."
          - letter: "B"
            text: "If enough substrate is added, the Vmax of an enzyme catalysed reaction in the presence\
  \ of a non-competitive inhibitor can be the same as Vmax of the reaction in absence\
  \ of the inhibitor."
            answer: false
            explanation: "A defining feature of non-competitive inhibition is that it lowers Vmax regardless\
  \ of how much substrate is added (since the inhibitor binds a site other than the\
  \ active site and can still block catalysis even when substrate is bound), so Vmax\
  \ cannot be restored to the uninhibited value just by adding more substrate."
          - letter: "C"
            text: "The rate of an enzyme catalysed reaction in the presence of a rate-limiting concentration\
  \ of substrate decreases with time."
            answer: true
            explanation: "When substrate is limiting (not saturating), substrate is progressively consumed\
  \ as the reaction proceeds, so its concentration - and hence the reaction rate,\
  \ which depends on substrate concentration in this regime - decreases over time."
          - letter: "D"
            text: "The sigmoidal shape of the V versus [S] curve obtained with allosteric enzymes indicates\
  \ that the affinity of the enzyme for substrate decreases as the substrate concentration\
  \ is increased."
            answer: false
            explanation: "The sigmoidal curve of a cooperative allosteric enzyme reflects the opposite - binding\
  \ of substrate at one site increases the enzyme's affinity for additional substrate\
  \ at other sites (positive cooperativity), which is why the rate rises steeply once\
  \ some substrate is already bound, not because affinity decreases with increasing\
  \ substrate."
          - letter: "E"
            text: "The affinity of an allosteric enzyme for substrate varies with enzyme concentration."
            answer: false
            explanation: "An allosteric enzyme's substrate affinity (reflected in its apparent K0.5) is an\
  \ intrinsic property of its conformational behaviour and cooperativity between subunits,\
  \ which does not change simply because more or less total enzyme is present in the\
  \ reaction - affinity depends on substrate concentration and cooperative binding,\
  \ not on the enzyme's own concentration."

      - id: q16
        number: "Q16"
        name: "Pedigree Analysis of Two Rare Traits"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=24"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "Inheritance of one of the traits is Y-linked."
            answer: false
            explanation: "A truly Y-linked trait would be transmitted from every affected father to all of\
  \ his sons and never to daughters; the pattern of the vertical- and horizontal-line\
  \ traits in the pedigree (e.g. appearing in individuals whose fathers were unaffected,\
  \ or in daughters) does not match this strict paternal-line-only transmission, so\
  \ despite the stem's framing, the pedigree data itself is not actually consistent\
  \ with true Y-linkage for either trait."
          - letter: "B"
            text: "The data presented is consistent with autosomal recessive inheritance for both traits."
            answer: false
            explanation: "Autosomal recessive traits require both parents to carry the allele for an affected\
  \ child to appear, and typically skip generations in an unaffected-parents pattern;\
  \ the pedigree's actual pattern of affected individuals (including how the traits\
  \ appear across generations II and III) is not consistent with a simple autosomal\
  \ recessive model for both marked traits simultaneously."
          - letter: "C"
            text: "The phenotype of III-2 may be due to non-disjunction in II-2."
            answer: false
            explanation: "Non-disjunction produces aneuploidy (an abnormal chromosome count), which is not\
  \ what is being tracked here (a marked trait inheritance pattern, not a karyotype\
  \ abnormality) - there's no basis in this pedigree's trait-marker data to attribute\
  \ III-2's phenotype to a non-disjunction event in II-2."
          - letter: "D"
            text: "The phenotype of III-2 may be due to cross over in II-2."
            answer: true
            explanation: "If the two traits are linked but not completely, a recombination (crossover) event\
  \ during meiosis in parent II-2 could produce a gamete with a new combination of\
  \ the two trait-linked alleles, explaining why III-2 shows a combined/checkered\
  \ phenotype pattern not seen in either parent directly."
          - letter: "E"
            text: "The probability of the phenotype of III-2 being due to a mutation that occurred in\
  \ an egg cell of II-2 before fertilization is twice the probability of the phenotype\
  \ of III-4 being due to a mutation that occurred in an egg cell of II-2 before fertilization."
            answer: false
            explanation: "III-2's combined (recombinant-looking) phenotype is far better explained by a crossover\
  \ event than by two independent new mutations occurring together, so treating a\
  \ new-mutation explanation as merely twice as likely for III-2 versus III-4 misrepresents\
  \ the far larger difference in relative likelihood between a plausible recombination\
  \ event and an unlikely double-mutation event."

      - id: q17
        number: "Q17"
        name: "Lateral Inhibition Between Sensory Pathways"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=25"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "The firing rate of all second-order neurons is higher than to first-order neurons."
            answer: false
            explanation: "The outer pathways (A and C) receive only weak direct excitation from their own lightly-firing\
  \ afferents plus lateral inhibition from the strongly-firing centre pathway, so\
  \ their second-order neurons are not expected to fire at a higher rate than their\
  \ own first-order input - this blanket claim does not hold for every pathway."
          - letter: "B"
            text: "The highest relative changes between second and first-order neurons will happen in\
  \ Path B."
            answer: false
            explanation: "Lateral inhibition sharpens contrast mainly by suppressing the weakly-active flanking\
  \ pathways, so the centre pathway B (which drives its own second-order neuron strongly\
  \ and only receives inhibition secondhand) shows a comparatively smaller relative\
  \ change than the flanking pathways A and C, which are most strongly reshaped by\
  \ inhibition relative to their own low first-order activity."
          - letter: "C"
            text: "The difference between the firing rate of second order neurons in A and B pathways\
  \ will be higher than the difference between firing rate of the first order neuron\
  \ in these pathways."
            answer: true
            explanation: "Lateral inhibition is a contrast-enhancing mechanism: the low-firing A pathway gets\
  \ further suppressed by inhibition from B's collateral while B's own second-order\
  \ neuron is driven strongly, widening the A-versus-B gap at the second-order level\
  \ compared to the gap that already existed between their first-order afferent firing\
  \ rates."
          - letter: "D"
            text: "This mechanism may help to localize the sensory stimulus more accurately."
            answer: true
            explanation: "By sharpening the contrast between a strongly stimulated pathway and its weakly stimulated\
  \ neighbours, lateral inhibition narrows and sharpens the population response profile,\
  \ which improves the nervous system's ability to pinpoint the spatial location of\
  \ a sensory stimulus."

      - id: q18
        number: "Q18"
        name: "Patch Clamp Analysis of a Cation Channel"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=26"
        subjects:
          - name: "Plasma Membrane Structure & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "A"
            text: "This channel is not selective, and both K+ and Na+ ions pass through this channel."
            answer: false
            explanation: "With symmetric 150 mM monovalent cation concentrations on each side, a truly non-selective\
  \ channel would show a reversal potential near 0 mV; instead the curve reverses\
  \ at a clearly negative voltage, consistent with the channel being selectively permeable\
  \ predominantly to one cation (K+, present at high concentration on the pipette/intracellular\
  \ side) rather than passing both ions equally."
          - letter: "B"
            text: "The Na+ current decreases with increasing voltage."
            answer: false
            explanation: "Since the channel is selective and does not meaningfully conduct Na+, there isn't\
  \ a substantial, separate Na+ current through this channel to begin with, so describing\
  \ a Na+ current that 'decreases with increasing voltage' misattributes the recorded\
  \ current, which is essentially carried by K+."
          - letter: "C"
            text: "The K+ current increases with increasing voltage."
            answer: false
            explanation: "The I-V curve shows inward rectification: the current is large and negative at very\
  \ negative voltages but the curve flattens out and saturates as voltage rises toward\
  \ zero and beyond, rather than continuing to rise - so the current does not simply\
  \ keep increasing with voltage across the whole tested range."
          - letter: "D"
            text: "The resistance of the channel to negative voltages is less than positive voltages."
            answer: true
            explanation: "The I-V curve is much steeper (higher conductance) in the negative-voltage region\
  \ than in the flatter, saturating positive-voltage region; since resistance is the\
  \ inverse of conductance, a steeper (higher-conductance) region at negative voltages\
  \ corresponds to lower resistance there than at positive voltages - the classic\
  \ signature of an inward rectifier."

      - id: q19
        number: "Q19"
        name: "Respiratory Phase and Memory Performance"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=27"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "The inspiration and expiration phase does not affect memory performance during oral\
  \ breathing."
            answer: true
            explanation: "In panel B, the oral (mouth) breathing bars for the different insp/exp conditions\
  \ are close in height with no significance marker between them, unlike the nasal\
  \ condition which does show a significant insp-versus-exp effect - indicating respiratory\
  \ phase has no significant impact on memory performance specifically during oral\
  \ breathing."
          - letter: "B"
            text: "Memory function during nasal breathing is significantly more accurate than during\
  \ oral breathing."
            answer: true
            explanation: "Panel B shows the nasal breathing bars are consistently taller than the corresponding\
  \ oral breathing bars, with significance brackets connecting the nasal group to\
  \ the oral group, confirming nasal breathing is associated with significantly better\
  \ memory accuracy."
          - letter: "C"
            text: "Regardless of the respiratory phase in which the image is encoded, if the object's\
  \ images are depicted in the inspiration phase during the retrieval, memory performance\
  \ is significantly greater."
            answer: true
            explanation: "Panel C groups the data by retrieval phase - the two inspiration-retrieval bars (regardless\
  \ of whether encoding happened during inspiration or expiration) are both significantly\
  \ higher than the two expiration-retrieval bars, consistent with retrieval during\
  \ inspiration boosting accuracy independent of the original encoding phase."
          - letter: "D"
            text: "In breathing through the nose, unlike encoding, the accuracy of retrieval in the\
  \ inspiration phase is significantly higher than in the expiration phase."
            answer: true
            explanation: "Within the nasal group in panel B, the retrieve:insp bar is significantly higher\
  \ than the retrieve:exp bar, whereas the encode:insp versus encode:exp comparison\
  \ does not show the same significant gap - showing the inspiration advantage specifically\
  \ shows up at retrieval, not encoding, for nasal breathing."

      - id: q20
        number: "Q20"
        name: "MRI Weighting and Comparative Organ Anatomy"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=28"
        subjects:
          - name: "Digestive & Metabolic Physiology"
            link: "/resources/3-animal-physiology/digestive-metabolic-physiology/"
        statements:
          - letter: "A"
            text: "The figure 1 must be T1-weighted image due to higher signal intensity of white matter\
  \ than grey matter."
            answer: true
            explanation: "White matter is fat/myelin-rich while grey matter is more water-rich, so per the\
  \ stated rule (T1: fat signal > water signal), a scan where white matter appears\
  \ brighter than grey matter is showing the T1-weighted contrast pattern."
          - letter: "B"
            text: "If there is inflammation in a tissue the inflamed area would be of higher intensity\
  \ in T2-weighted due to the resulting oedema."
            answer: true
            explanation: "Inflammation increases local tissue water content (oedema), and since T2-weighted\
  \ images show water signal as brighter than fat (T2: fat < water), an oedematous,\
  \ inflamed area is expected to appear hyperintense (brighter) on a T2-weighted scan."
          - letter: "C"
            text: "the major secretions of the organ in figure 2 which is marked as A, are amylase and\
  \ lipase."
            answer: false
            explanation: "Amylase and lipase are the major secretions specifically of the pancreas; the structure\
  \ marked A in the figure is positioned at a location in the coronal abdominal image\
  \ that does not correspond to the pancreas, so attributing these particular secretions\
  \ to it is not correct."
          - letter: "D"
            text: "In figure 2 the part B is shorter in herbivores than carnivore mammals."
            answer: false
            explanation: "The structure marked B corresponds to a portion of the gut associated with fermentation\
  \ of plant material; herbivorous mammals typically have a longer, more elaborated\
  \ version of this structure than carnivores (to support extended microbial fermentation\
  \ of fibrous plant matter), the opposite of what this statement claims."

      - id: q21
        number: "Q21"
        name: "Hormonal Control of the Menstrual Cycle"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=29"
        subjects:
          - name: "Reproductive Physiology"
            link: "/resources/3-animal-physiology/reproductive-physiology/"
        statements:
          - letter: "A"
            text: "The increase shown at point A is caused by the effect of oestrogen on the anterior\
  \ pituitary."
            answer: false
            explanation: "Point A marks the rise in basal body temperature that follows ovulation; this thermogenic\
  \ effect is caused directly by rising progesterone from the corpus luteum acting\
  \ on the hypothalamic temperature-regulating centre, not by oestrogen acting on\
  \ the anterior pituitary."
          - letter: "B"
            text: "Curve B shows changes in progesterone level during menstrual cycle."
            answer: true
            explanation: "Curve B rises only after ovulation and peaks during the mid-luteal phase before falling\
  \ again toward menstruation, exactly matching the expected secretory pattern of\
  \ progesterone from the corpus luteum."
          - letter: "C"
            text: "The source of the increase in concentrations indicated at point C and D are granulosa\
  \ cells and corpus luteum, respectively."
            answer: true
            explanation: "Point C is the sharp pre-ovulatory oestrogen peak produced by the maturing follicle's\
  \ granulosa cells, while point D is the smaller, sustained luteal-phase oestrogen\
  \ rise produced by the corpus luteum after ovulation - matching the two different\
  \ oestrogen sources at these two points in the cycle."
          - letter: "D"
            text: "Substance E is secreted by follicular cells."
            answer: false
            explanation: "Point E marks the sharp mid-cycle LH surge, which is secreted by gonadotrope cells\
  \ of the anterior pituitary gland, not by ovarian follicular cells."
          - letter: "E"
            text: "The cause of the sudden increase shown at point E is positive feedback of oestrogen\
  \ on the anterior pituitary and absence of progesterone."
            answer: true
            explanation: "The sustained high oestrogen level from the mature follicle switches the pituitary/hypothalamus\
  \ from negative to positive feedback just before ovulation, triggering the LH surge\
  \ (point E); this occurs while progesterone is still low, since substantial progesterone\
  \ (once present) would otherwise suppress the surge."

      - id: q22
        number: "Q22"
        name: "Direct and Indirect Coombs Tests"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=30"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Direct coombs test will be positive only if autoantibodies are present."
            answer: true
            explanation: "The direct test washes only the patient's own RBCs (removing their plasma) and then\
  \ checks whether IgG antibody is already coating them - a positive result specifically\
  \ means the patient's own red cells were already bound by antibody in vivo, which\
  \ is the situation the direct test is designed to detect."
          - letter: "B"
            text: "If the result of indirect coombs test using serum of patient 1 and RBCs of patient\
  \ 2 is positive, so we can use the patient 2 as a blood donor for patient 1."
            answer: false
            explanation: "A positive indirect Coombs test here means patient 1's serum contains antibodies\
  \ that react against patient 2's red cell antigens - transfusing patient 2's blood\
  \ into patient 1 would trigger a hemolytic transfusion reaction, making patient\
  \ 2 an incompatible, not suitable, donor for patient 1."
          - letter: "C"
            text: "Anti-human globulin specifically binds to the variable part of human antibodies."
            answer: false
            explanation: "Anti-human globulin reagent is designed to bind the constant (Fc) region of human\
  \ antibodies so that it can detect and cross-link any IgG regardless of its antigen\
  \ specificity, not the variable, antigen-binding region."
          - letter: "D"
            text: "In a positive indirect coombs test, antigen-antibody reaction happens in vivo."
            answer: false
            explanation: "The indirect test mixes patient serum with reagent RBCs of known antigenicity outside\
  \ the body, in a test tube - the antibody-antigen binding being detected in this\
  \ particular assay happens in vitro, not inside the patient."

      - id: q23
        number: "Q23"
        name: "Ion Permeability and a Simple Reflex Circuit"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=31"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "The function of N1 neurotransmitter is same as acetylcholine."
            answer: true
            explanation: "N1 increases Na+ permeability, which is depolarizing and excitatory - the same basic\
  \ mode of action as acetylcholine acting on nicotinic receptors, which also open\
  \ Na+-permeable channels to excite the postsynaptic cell."
          - letter: "B"
            text: "Neuron G is not depolarized and neuron F is stimulated so muscle M1 contracts."
            answer: true
            explanation: "Tracing the net excitatory and inhibitory inputs through the circuit (including the\
  \ given rule that inhibiting an inhibitory neuron itself becomes stimulatory) leaves\
  \ neuron G below threshold while neuron F receives enough net excitation to fire,\
  \ driving muscle M1 to contract."
          - letter: "C"
            text: "Neuron G gets depolarized as a result of Na ions influx."
            answer: false
            explanation: "Since neuron G ends up not depolarized (as established above), it cannot be that\
  \ G is being driven to depolarize by Na+ influx - whatever input reaches G is insufficient,\
  \ or is inhibitory rather than an excitatory Na+-mediated depolarization."
          - letter: "D"
            text: "Neuron F gets depolarized as a result of Cl ions efflux."
            answer: false
            explanation: "At physiological ion concentrations intracellular Cl- is low relative to outside\
  \ the cell, so opening Cl- channels normally drives Cl- influx (into the cell),\
  \ which is hyperpolarizing/inhibitory - not an efflux that would cause depolarization,\
  \ so this proposed mechanism is backwards regardless of which neuron is involved."

      - id: q24
        number: "Q24"
        name: "HOX Genes, Retinoic Acid, and Neural Tube Patterning"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=32"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "Overuse of vitamin A by pregnant women may cause abnormalities in the embryos."
            answer: true
            explanation: "Because retinoic acid (a vitamin A derivative) directly patterns HOX gene expression\
  \ along the embryo's anterior-posterior axis, excess vitamin A intake is a well-documented\
  \ teratogen that disrupts this gradient and causes developmental abnormalities."
          - letter: "B"
            text: "In an embryo that has been affected by excessive amounts of RA in the early stages\
  \ of embryogenesis, the forebrain may not form."
            answer: true
            explanation: "Excess RA expands posterior-type HOX gene expression domains anteriorly (posteriorizing\
  \ the embryo), which can override the most anterior, naturally RA-low identity needed\
  \ to specify the forebrain, so forebrain formation can fail."
          - letter: "C"
            text: "Loss of function of a HOX gene in the embryo may have the same effect as an excessive\
  \ amount of RA."
            answer: false
            explanation: "Losing a posterior HOX gene's function typically causes segments to adopt a more\
  \ anterior identity (an anterior transformation), the opposite of what excess RA\
  \ does (which posteriorizes/expands posterior identity anteriorly) - so the two\
  \ perturbations are expected to have opposite, not the same, effects."
          - letter: "D"
            text: "In an embryo whose expression of RA nuclear receptors has been downregulated, the\
  \ midbrain may develop similar to the forebrain."
            answer: true
            explanation: "If RA nuclear receptors are downregulated, the tissue can no longer properly respond\
  \ to the RA gradient that specifies more posterior identities, so a region like\
  \ the midbrain (which normally needs RA signalling above the very low forebrain\
  \ level) may fail to be posteriorized and instead default toward a forebrain-like\
  \ identity."

      - id: q25
        number: "Q25"
        name: "Maternal-Effect Inheritance of Snail Shell Coiling"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=33"
        subjects:
          - name: "Extranuclear & Non-Mendelian Inheritance"
            link: "/resources/7-genetics/extranuclear-non-mendelian-inheritance/"
        statements:
          - letter: "A"
            text: "The direction of cleavage is determined by the genotype of the developing snail."
            answer: false
            explanation: "This is the classic maternal-effect gene pattern: the crosses show that coiling direction\
  \ matches the mother's own phenotype/genotype regardless of the offspring's own\
  \ genotype (e.g. DD mother x dd father gives all right-coiling Dd offspring, and\
  \ the reciprocal cross gives all left-coiling Dd offspring) - so it's the mother's\
  \ genotype, not the developing snail's own genotype, that determines coiling."
          - letter: "B"
            text: "If the egg cytoplasm of a recessive homozygous right-coiling mother is injected into\
  \ the eggs of the \"dd\" mother, the resulting embryos coil to the left."
            answer: true
            explanation: "A dd mother who happens to display a right-coiling phenotype (because her own mother\
  \ was a D-carrier) still has a dd genotype herself, so the actual gene product she\
  \ deposits into her egg cytoplasm reflects her own dd genotype (i.e. lacking the\
  \ functional dominant determinant) - injecting that cytoplasm therefore directs\
  \ left-coiling in the recipient's embryos, matching her genotype rather than her\
  \ own visible phenotype."
          - letter: "C"
            text: "Injection of the egg cytoplasm from a heterozygous left-coiling mother into the eggs\
  \ of the right coiling heterozygous mother, does not affect the right-coiling in\
  \ the embryos."
            answer: true
            explanation: "A Dd mother who happens to display a left-coiling phenotype (because her own mother\
  \ was dd) still carries a functional dominant D allele and produces the corresponding\
  \ dominant gene product in her cytoplasm; injecting this Dd-genotype cytoplasm into\
  \ another Dd mother's eggs introduces the same functional determinant already present\
  \ there, so it does not disrupt the recipient's own right-coiling outcome."
          - letter: "D"
            text: "\"DD\" or \"Dd\" mothers place a coiling determinant factor inside the egg cytoplasm."
            answer: true
            explanation: "This is the defining mechanism of the maternal-effect gene: any mother carrying at\
  \ least one dominant D allele deposits a dominant right-coiling determinant (gene\
  \ product) into her egg cytoplasm during oogenesis, which then directs the cleavage\
  \ pattern of all her offspring regardless of the offspring's own genotype."

      - id: q26
        number: "Q26"
        name: "Classifying the Novel Taxon Dendrogramma"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=34"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "According to the characteristics of Dendrogramma it could be placed in Cnidaria."
            answer: false
            explanation: "Cnidaria is defined by the presence of cnidocytes (stinging cells), but the text\
  \ explicitly states Dendrogramma lacks cnidocytes as well as tentacles and other\
  \ cnidarian hallmark structures, ruling out placement in this phylum."
          - letter: "B"
            text: "It seems likely that Dendrogramma feed on micro-organisms."
            answer: true
            explanation: "Its simple mucus-secreting mouth-field feeding into a branching gastrovascular canal\
  \ system is consistent with a mucus-net or filter-feeding strategy that captures\
  \ small suspended particles or micro-organisms from the water, a plausible feeding\
  \ mode for such a simple body plan."
          - letter: "C"
            text: "Lack of statocysts and rhopalia shows that this taxon does not have nervous system."
            answer: false
            explanation: "Statocysts and rhopalia are specific, specialized sensory/balance structures (typical\
  \ of certain cnidarian groups); their absence does not mean the organism lacks a\
  \ nervous system altogether, since a simpler nerve net or other undetected neural\
  \ elements could still be present."
          - letter: "D"
            text: "Most likely Dendrogramma could have Dinoflagellate symbionts such as Symbiodinium."
            answer: false
            explanation: "Symbiodinium and similar dinoflagellate symbionts are photosynthetic and require\
  \ light; Dendrogramma was collected from deep water (400-1000 m) where sunlight\
  \ does not penetrate, making a photosynthetic symbiotic relationship implausible\
  \ for this organism."

      - id: q27
        number: "Q27"
        name: "Reciprocal Intraguild Predation Between Juveniles and Adults"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=35"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "A"
            text: "If P1j population increases, then P2a will produce more eggs."
            answer: true
            explanation: "The web shows P2a preying on P1j; a larger pool of available P1j prey means more\
  \ food intake for P2a, which typically translates into higher reproductive output\
  \ (more eggs)."
          - letter: "B"
            text: "If P2j population decreases, then P2a population will increase in next generation."
            answer: false
            explanation: "P2a individuals are recruited from P2j as they mature, so fewer P2j available to\
  \ mature means fewer, not more, individuals entering the P2a population in the next\
  \ generation."
          - letter: "C"
            text: "If R increases, then P2a doesn't feed on P1j."
            answer: false
            explanation: "Reciprocal intraguild predation on competitors' juveniles persists as an interaction\
  \ pathway even when basal resources are abundant - having more R does not eliminate\
  \ P2a's predation on P1j, since intraguild predation also functions to suppress\
  \ a competitor, not solely to satisfy hunger."
          - letter: "D"
            text: "If R decreases, then P2a population will increase in next generation."
            answer: false
            explanation: "P2a feeds directly on R as well as indirectly depending on P1j (which itself depends\
  \ on R), so less R is expected to reduce, not increase, the food available to support\
  \ P2a's population growth."

      - id: q28
        number: "Q28"
        name: "Tunicate Body Plan and Chordate Affinities"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=36"
        subjects:
          - name: "Cell Theory, Prokaryotes & Eukaryotes"
            link: "/resources/1-cell-molecular/cell-theory-prokaryotes-eukaryotes/"
        statements:
          - letter: "A"
            text: "Adult of tunicates shows two shared derived characters, which are present in all\
  \ chordates."
            answer: true
            explanation: "Even though adult tunicates lose the notochord, dorsal nerve cord, and post-anal\
  \ tail after metamorphosis, they retain the pharyngeal slits (as the perforated\
  \ pharynx) and the endostyle, two chordate synapomorphies that remain visible in\
  \ the adult body plan."
          - letter: "B"
            text: "Main pathway for seawater is: incurrent siphon, gut, anus, atrium and excurrent siphon."
            answer: false
            explanation: "Water actually flows from the incurrent siphon into the pharynx, through the pharyngeal\
  \ slits into the surrounding atrium, and out via the excurrent siphon - it never\
  \ passes through the gut or anus, which belong to the separate digestive tract."
          - letter: "C"
            text: "In Ciona, the notochord is homologous to backbone of vertebrates."
            answer: false
            explanation: "The notochord and the vertebral column are not homologous structures - the vertebrae\
  \ are a separate, later-evolving skeletal element that forms around the notochord\
  \ in vertebrates, largely replacing it, rather than being derived from it."
          - letter: "D"
            text: "Ciona belongs to the coelomate vertebrate group and coelom forms from fusion of enterocoelous\
  \ pouches."
            answer: false
            explanation: "Ciona is a tunicate (Urochordata), an invertebrate chordate, not a vertebrate, and\
  \ tunicates are not characterized by a true coelom forming through enterocoelic\
  \ pouching the way some other deuterostomes are - this statement misclassifies both\
  \ its taxonomic group and its body cavity development."

      - id: q29
        number: "Q29"
        name: "Diagnostic Traits of Four Animal Phyla"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=37"
        subjects:
          - name: "Classification Principles & Nomenclature"
            link: "/resources/4-biosystematics/classification-principles-nomenclature/"
        statements:
          - letter: "A"
            text: "Organism A belongs to a taxon characterized by unique aquiferous system, radial or\
  \ no symmetry and lack of tissue and organ systems."
            answer: true
            explanation: "A water-canal (aquiferous) system, indefinite/radial symmetry, and the absence of\
  \ true tissues and organs are the hallmark features of Porifera (sponges), matching\
  \ organism A."
          - letter: "B"
            text: "Organism B belongs to a taxon characterized by bilateral symmetry, lack of coelom,\
  \ protonephridia and ladder-like nervous system."
            answer: true
            explanation: "Bilateral symmetry combined with an acoelomate body, flame-cell protonephridia for\
  \ excretion, and a ladder-like nerve cord system are the defining features of Platyhelminthes\
  \ (flatworms), matching organism B."
          - letter: "C"
            text: "Organism C belongs to a taxon characterized by entrocoelic development, pentaradial\
  \ symmetry and metamorphosis."
            answer: true
            explanation: "Enterocoelous coelom formation, adult pentaradial (five-part) symmetry arising from\
  \ a bilateral larva via metamorphosis, are classic diagnostic features of Echinodermata,\
  \ matching organism C."
          - letter: "D"
            text: "Organism D belongs to a taxon characterized by radial symmetry, hydrostatic skeleton\
  \ and schizocoelic development."
            answer: false
            explanation: "A radially symmetric organism with only a hydrostatic skeleton (i.e. an acoelomate\
  \ or non-coelomate radiate animal such as a cnidarian) does not undergo schizocoelic\
  \ coelom formation at all, since schizocoely is a coelom-forming process seen in\
  \ certain bilaterian (largely protostome) lineages - pairing radial symmetry with\
  \ schizocoelic development describes a combination that does not match any real\
  \ animal group, including organism D's actual phylum."

      - id: q30
        number: "Q30"
        name: "Circulatory and Filter-Feeding Anatomy of Amphioxus"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=38"
        subjects:
          - name: "Fish & Amphibian Anatomy"
            link: "/resources/2-animal-anatomy/fish-amphibian-anatomy/"
        statements:
          - letter: "A"
            text: "The blood is circulated from anterior to posterior dorsally and from posterior to\
  \ anterior ventrally."
            answer: true
            explanation: "The stem describes blood being pumped forward (anteriorly) in the ventral aorta,\
  \ i.e. moving from posterior to anterior ventrally, and then, after passing up through\
  \ the gill vessels, being distributed posteriorly through the dorsal aorta to the\
  \ body - i.e. anterior to posterior dorsally, exactly as this statement describes."
          - letter: "B"
            text: "The heart consists of a sinuous venosus, a cardiac atrium, and a ventricle located\
  \ ventrally and carries low oxygen blood."
            answer: false
            explanation: "Amphioxus lacks a true differentiated, chambered heart altogether; the stem specifically\
  \ describes blood being moved only by peristaltic contractions of the ventral vessel\
  \ wall itself, not by a heart with a sinus venosus, atrium, and ventricle as found\
  \ in vertebrates."
          - letter: "C"
            text: "It differs from vertebrates in having numerous pharyngeal slits that are not open\
  \ outside directly but acts as a trapping structure to collect small-suspended particles."
            answer: true
            explanation: "As a filter feeder, amphioxus's numerous pharyngeal slits function mainly to strain\
  \ suspended food particles from water passing into the surrounding atrium rather\
  \ than opening directly to the outside for gas exchange, unlike the primarily respiratory\
  \ gill slits of most vertebrates."
          - letter: "D"
            text: "Sperms are released into the atrial cavity, and then pass out via genital pore and\
  \ atriopore to the outside where fertilization occurs."
            answer: false
            explanation: "The stem explicitly states the gonads have no ducts, so gametes are released directly\
  \ into the atrial cavity by rupture of the gonad wall and then leave solely through\
  \ the atriopore - there is no separate genital pore involved."

      - id: q31
        number: "Q31"
        name: "Effect of Body Temperature on Canine ECG Intervals"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=39"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "Body temperature does not have any effect on heart rate."
            answer: false
            explanation: "The RR interval graph shows RR interval (the inverse of heart rate) clearly falling\
  \ as body temperature rises, meaning heart rate increases with temperature - body\
  \ temperature does affect heart rate."
          - letter: "B"
            text: "Independent of changes of heart rate, QT interval is shortened by rise of body temperature."
            answer: true
            explanation: "The QT interval shortens with rising temperature over the same range where RR interval\
  \ also falls; framed against the rate-corrected QTc concept given in the stem, this\
  \ pattern reflects temperature having its own direct effect on cardiac repolarization\
  \ timing, not merely a secondary consequence of the accompanying heart-rate increase."
          - letter: "C"
            text: "Hypocalcaemia will shorten the QTc interval."
            answer: false
            explanation: "Hypocalcaemia is well known to prolong, not shorten, the QT/QTc interval by delaying\
  \ the plateau phase of the cardiac action potential and slowing ventricular repolarization."
          - letter: "D"
            text: "In higher body temperature, end diastolic volume of ventricles is increased."
            answer: false
            explanation: "Higher body temperature shortens the RR interval (faster heart rate), leaving less\
  \ time between beats for the ventricles to fill during diastole, which tends to\
  \ decrease, not increase, end-diastolic volume."

      - id: q32
        number: "Q32"
        name: "Water-Absorbing Trichomes in Tank Bromeliads"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=40"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "A"
            text: "\"a\" in Figure R denotes aerenchyma"
            answer: false
            explanation: "The tissue labelled \"a\" in the blade cross-section is actually the water-storage\
  \ hydrenchyma, not aerenchyma - the labels for the two specialised tissue types\
  \ described in the stem are the reverse of what this statement claims."
          - letter: "B"
            text: "\"b\" in Figure S denotes hydrenchyma (aquatic parenchymal cells)"
            answer: false
            explanation: "The tissue labelled \"b\" in the tank cross-section is actually the air-space aerenchyma,\
  \ not the water-storage hydrenchyma - again the reverse of what this statement claims."
          - letter: "C"
            text: "The leaf anatomy suggests a C4 or CAM photosynthetic type"
            answer: true
            explanation: "The succulent, water-storing tissue (hydrenchyma) and specialized water-absorbing\
  \ trichome/tank system seen here are consistent with the water-conserving, succulent\
  \ leaf anatomy typical of CAM photosynthesis, which is common among tank-forming\
  \ epiphytic bromeliads."
          - letter: "D"
            text: "Red line indicates pathway for water between vein and trichome on the upper side\
  \ of leaf (adaxial)"
            answer: false
            explanation: "The water-absorbing trichomes that contact the tank reservoir are located on the\
  \ abaxial (lower, tank-facing) leaf surface, not the adaxial (upper) surface, so\
  \ the traced water pathway runs to the abaxial side, not the adaxial side as this\
  \ statement claims."

      - id: q33
        number: "Q33"
        name: "Biphasic Kinetics of Potassium Uptake by Trichomes"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=41"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "The low affinity system accumulated K+ slower than the high affinity system"
            answer: false
            explanation: "At saturating potassium concentrations the low-affinity system (curve B) actually\
  \ reaches a much higher plateau uptake rate (roughly 10 umol/h g) than the high-affinity\
  \ system (curve A, plateauing around 0.2-0.3), so in terms of maximal uptake capacity\
  \ the low-affinity system is faster, not slower, once enough substrate is available\
  \ - it simply needs a much higher concentration to get there."
          - letter: "B"
            text: "Km of 56.5 mM belongs to B transporter system"
            answer: true
            explanation: "Curve B is the one saturating at the much higher potassium concentration range shown\
  \ on the plot, matching the larger of the two given Km values (56.5 mM), while curve\
  \ A (saturating at low, micromolar concentrations) corresponds to the 41.3 uM Km."
          - letter: "C"
            text: "Applying ATPase inhibitor compounds inhibits B transporters"
            answer: false
            explanation: "High-affinity uptake systems (like A) are typically active, ATPase-energized transporters\
  \ that concentrate ions against a gradient at low external concentration, whereas\
  \ low-affinity systems operating only at high external concentration (like B) are\
  \ more typically passive, channel-mediated pathways that don't require ATPase activity\
  \ - so an ATPase inhibitor would be expected to block system A rather than B."
          - letter: "D"
            text: "B transporters are blocked more by potassium channel blockers, as compared to A transporters"
            answer: true
            explanation: "Consistent with B being the passive, channel-type low-affinity pathway, potassium\
  \ channel blockers would be expected to inhibit B's channel-mediated flux much more\
  \ than A's active-transporter-mediated flux."

      - id: q34
        number: "Q34"
        name: "Chloride-Induced Trichome Induction and Ion Exclusion"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=42"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "The results suggest that chloride is only absorbed by bromeliad trichoms."
            answer: false
            explanation: "The graph only shows a correlation between trichome number and tissue chloride content\
  \ - it does not rule out chloride absorption occurring through other parts of the\
  \ leaf as well, so exclusivity of trichome-mediated uptake is not established by\
  \ this data."
          - letter: "B"
            text: "Induction of trichomes occurs at any increase in concentration of exogenously applied\
  \ chloride."
            answer: false
            explanation: "Trichome number stays essentially flat over the lowest chloride concentrations tested\
  \ before beginning to rise, showing that induction requires the concentration to\
  \ pass a certain threshold rather than occurring at any increase at all."
          - letter: "C"
            text: "There is an exponential relationship between the chloride concentration and absorbed\
  \ chloride by leaf trichomes."
            answer: false
            explanation: "Rather than continuing to accelerate as a true exponential relationship would, the\
  \ chloride content curve actually levels off and even decreases at the highest tested\
  \ concentration, inconsistent with a simple exponential relationship."
          - letter: "D"
            text: "Chloride is actively excluded or secreted above 40 uM concentration."
            answer: true
            explanation: "Tissue chloride content peaks around 40 uM and then declines even as the external\
  \ chloride supply and trichome number both continue to rise - a drop in internal\
  \ content despite increasing external supply is best explained by active exclusion\
  \ or secretion of chloride once concentrations exceed that threshold."

      - id: q35
        number: "Q35"
        name: "Identifying Unknown Plants from Vascular Tissue Traits"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=43"
        subjects:
          - name: "Xylem, Phloem & Vascular Tissue"
            link: "/resources/6-plant-anatomy/xylem-phloem-vascular-tissue/"
        statements:
          - letter: "A"
            text: "Plant 1 has seeds with more than two cotyledons."
            answer: false
            explanation: "Plant 1's sieve-tube-cell-plus-companion-cell phloem and true vessel elements are\
  \ angiosperm-type vascular tissue, and angiosperms have either one (monocot) or\
  \ two (dicot) cotyledons - having more than two cotyledons is instead a trait seen\
  \ in some gymnosperms, not angiosperms."
          - letter: "B"
            text: "Plant 2 has winged pollen grain and double fertilization."
            answer: false
            explanation: "Plant 2's sieve-cell-based phloem (no companion cells or sieve tubes) and absence\
  \ of vessel elements point to a gymnosperm-type plant; while some gymnosperms do\
  \ have winged pollen, double fertilization is a defining feature exclusive to angiosperms\
  \ and does not occur in gymnosperms."
          - letter: "C"
            text: "Plants 3 and 1 have smaller female gametophyte as compared to plants 2 and 4."
            answer: true
            explanation: "Plants 1 and 3 both carry the more derived, vessel-bearing vascular tissue type,\
  \ and the evolutionary trend toward more efficient water-conducting tissue in tracheophytes\
  \ has gone hand in hand with progressive reduction of the female gametophyte generation,\
  \ so the vessel-bearing plants (1 and 3) are expected to have smaller female gametophytes\
  \ than the sieve-cell-only plants (2 and 4)."
          - letter: "D"
            text: "Plant 3 does not belong to the flowering plants, because it does not have pollen\
  \ grain."
            answer: false
            explanation: "Plant 3 otherwise shows the same vascular tissue signature as Plant 1 - companion\
  \ cells, sieve tubes, and vessel elements, the hallmark combination of angiosperm\
  \ phloem and xylem - so resting the entire exclusion from flowering plants on the\
  \ single absence of detected pollen, while ignoring this strong multi-trait vascular\
  \ evidence, is not a sound basis for the conclusion."

      - id: q36
        number: "Q36"
        name: "Cladistic Analysis of the Plant Genus X"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=44"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "Fruit as a berry and leaves opposite support the monophyly of the genus X."
            answer: true
            explanation: "All six species of genus X share berry fruit and opposite leaves, while the outgroup\
  \ Y instead has drupes and alternate leaves - these two shared, derived traits are\
  \ consistent with (support) genus X being a monophyletic group distinct from Y."
          - letter: "B"
            text: "X. obnoxia, X. beatifica and X. nerda form a monophyletic group."
            answer: false
            explanation: "On the cladogram, X. obnoxia groups as a clade with X. foetida, while X. beatifica\
  \ and X. nerda form a separate clade elsewhere on the tree - so these three named\
  \ species are not each other's closest relatives and do not form an exclusive monophyletic\
  \ group."
          - letter: "C"
            text: "Hispid stems and 4 stamens are autapomorphic (unique) for X. foetida and X. nerda,\
  \ respectively."
            answer: true
            explanation: "In the character matrix, the hispid-stem state appears only in X. foetida and the\
  \ 4-stamen state appears only in X. nerda, with every other species showing the\
  \ ancestral/different state - a trait unique to a single terminal species is by\
  \ definition an autapomorphy for that species."
          - letter: "D"
            text: "Simple leaves in X. obnoxia and X. confusa appear to have evolved independently."
            answer: true
            explanation: "X. obnoxia and X. confusa fall in two separate, non-sister clades of the tree (obnoxia\
  \ with foetida; confusa with beatifica/nerda/messa), so their shared simple-leaf\
  \ trait cannot be explained by inheritance from a single common ancestor within\
  \ genus X - it must instead represent independent (convergent) evolution of the\
  \ same character state in each lineage."

      - id: q37
        number: "Q37"
        name: "Interpreting Floral Diagrams"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=46"
        subjects:
          - name: "Flower Anatomy & Reproductive Structures"
            link: "/resources/6-plant-anatomy/flower-anatomy-reproductive-structures/"
        statements:
          - letter: "A"
            text: "Diagram A can represents a basal herbaceous dicot."
            answer: false
            explanation: "Diagram A shows a fairly regular, fixed-whorl arrangement of floral parts rather\
  \ than the numerous, spirally-arranged and indefinite parts typical of early-diverging\
  \ (basal) dicot lineages, so it better fits a more derived flower plan than a basal\
  \ herbaceous dicot."
          - letter: "B"
            text: "Diagram B may represent a species from the family Orchidaceae with 2 sterile stamens."
            answer: true
            explanation: "Diagram B's strongly bilateral (zygomorphic), irregular arrangement matches the distinctive\
  \ floral plan of Orchidaceae, a family known for extreme stamen reduction (typically\
  \ only a single fertile stamen with the remaining ones reduced to sterile staminodes),\
  \ consistent with 2 sterile stamens being noted here."
          - letter: "C"
            text: "The most primitive flower among the illustrated diagrams in this task is C."
            answer: true
            explanation: "Diagram C shows numerous, spirally arranged floral parts without fixed whorl numbers,\
  \ the classic hallmark of primitive (early-diverging) angiosperm flowers such as\
  \ those in Magnoliales, making it the most primitive diagram of the set."
          - letter: "D"
            text: "Diagram D belong to a same family as C."
            answer: false
            explanation: "Although both C and D show numerous, spirally-arranged parts at first glance, the\
  \ specific arrangement and organization of parts differs enough between the two\
  \ diagrams to indicate they represent different families rather than the same one."
          - letter: "E"
            text: "The perianth in diagram B is composed of 3 whorls."
            answer: false
            explanation: "Orchid-type flowers (matching diagram B) typically have a perianth of two whorls\
  \ of three parts each (3 sepals plus 3 petals, i.e. 6 tepals total in 2 whorls),\
  \ not three whorls as this statement claims."

      - id: q38
        number: "Q38"
        name: "Bacterial Phyllody and the ABCE Model"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=47"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "The bacteria caused perianth fusion of Petunia."
            answer: false
            explanation: "Phyllody is a change in floral organ identity (organs reverting to leaf-like structures),\
  \ not a fusion of adjacent perianth parts - the bacteria-treated flower shows greened,\
  \ leaf-like sepals and petals rather than parts that have become fused together."
          - letter: "B"
            text: "The bacteria caused the expression of the protein coded by Gene E."
            answer: true
            explanation: "Because E-class gene activity is required in combination with A, B, or C for organ\
  \ identity in every single floral whorl (sepal through carpel), a phyllody phenotype\
  \ affecting all of the floral organs uniformly - as seen here - implicates disruption\
  \ of Gene E specifically, since only E is needed universally across all four whorls."
          - letter: "C"
            text: "The bacteria decreased the frequency of moths landing on the flower."
            answer: true
            explanation: "Phyllody replaces the normally colourful, scented petals with green, leaf-like structures,\
  \ removing the visual and olfactory cues pollinators like moths use to locate flowers,\
  \ so fewer pollinators would be expected to land on the affected, de-flowered plant."
          - letter: "D"
            text: "The bacteria treatment proved that the flower reproductive parts are leaf modifications."
            answer: true
            explanation: "The bacteria-induced reversion of stamens and carpels back into leaf-like organs\
  \ is direct experimental support for Goethe's classical 'foliar theory' of the flower\
  \ - the idea that all floral organs, including the reproductive parts, are evolutionarily\
  \ and developmentally modified leaves."

      - id: q39
        number: "Q39"
        name: "The Leaf Economics Spectrum Across Vascular Plants"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=49"
        subjects:
          - name: "Leaf Anatomy"
            link: "/resources/6-plant-anatomy/leaf-anatomy/"
        statements:
          - letter: "A"
            text: "Woody plants tend to have higher Nmass than non-woody plants."
            answer: false
            explanation: "The Nmass arrow points toward the non-woody hotspot (associated with small herbaceous\
  \ plants) rather than the woody/tree hotspot, indicating non-woody, not woody, plants\
  \ tend to have higher leaf nitrogen content per mass."
          - letter: "B"
            text: "Plants inhabiting temperate grasslands tend to place near points 4 and 5."
            answer: true
            explanation: "Points 4 and 5 sit within the non-woody hotspot associated with herbaceous, high-Nmass\
  \ plants, which matches the growth form and leaf economics typical of temperate\
  \ grassland species."
          - letter: "C"
            text: "Dominant plants of boreal forests are mostly to locate near point 1."
            answer: false
            explanation: "Point 1 sits in the woody hotspot alongside traits (tall stature, high stem density)\
  \ more typical of broad-leaved forest trees, whereas boreal forest dominants (needle-leaved\
  \ conifers) are better represented near a different marked point associated with\
  \ the conifer icon in the figure."
          - letter: "D"
            text: "Plants inhabiting tropical forests tend to have higher LMA than plants inhabiting\
  \ temperate forests."
            answer: true
            explanation: "The LMA vector points toward the woody hotspot, and canopy and emergent species characteristic\
  \ of tropical forests often invest in tougher, longer-lived leaves (higher leaf\
  \ mass per area) compared to many temperate forest species, consistent with this\
  \ vector direction."
          - letter: "E"
            text: "Nmass correlates with leaf lifespan negatively."
            answer: true
            explanation: "This is a core prediction of the leaf economics spectrum that this PCA is built on:\
  \ high leaf nitrogen content per mass supports a fast-return, high-photosynthetic-rate\
  \ strategy associated with short leaf lifespans, while low Nmass is associated with\
  \ tougher, longer-lived leaves - the two traits trade off negatively against each\
  \ other."

      - id: q40
        number: "Q40"
        name: "Tracing Gene X Through Enucleate Sieve-Tube Elements"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=50"
        subjects:
          - name: "Xylem, Phloem & Vascular Tissue"
            link: "/resources/6-plant-anatomy/xylem-phloem-vascular-tissue/"
        statements:
          - letter: "A"
            text: "Results of sieve-tube element genome analysis suggest that the plant is heterozygote\
  \ in the gene X."
            answer: false
            explanation: "Sieve-tube elements are enucleate at maturity (they lose their nucleus), and the\
  \ single band seen there is consistent with residual organellar DNA rather than\
  \ a diploid nuclear genotype - a single band from non-nuclear DNA cannot be used\
  \ to infer heterozygosity, and the concept doesn't even meaningfully apply to organellar\
  \ DNA."
          - letter: "B"
            text: "The results obtained for the sieve-tube cells can be explained by gene X being present\
  \ both in the mitochondrial and chloroplast DNA."
            answer: true
            explanation: "Because sieve-tube elements retain mitochondria and plastids even after losing their\
  \ nucleus, detecting a PCR product in these enucleate cells is consistent with gene\
  \ X being carried on organellar (mitochondrial and/or chloroplast) DNA, which persists\
  \ there independent of the nuclear genome."
          - letter: "C"
            text: "Band A most likely corresponds to an organelle-related DNA sequences in the nuclear\
  \ genome."
            answer: true
            explanation: "Band A appears only in the nucleate companion cells and is absent from the enucleate\
  \ sieve-tube elements, even though sieve tubes still retain organelles - since a\
  \ truly organellar sequence would be expected in both cell types, Band A's dependence\
  \ on the presence of a nucleus instead points to it being a nuclear-genome copy\
  \ of an organelle-related sequence (a NUMT/NUPT-type insertion) rather than the\
  \ organellar gene itself."
          - letter: "D"
            text: "Band B most likely corresponds to a pseudogene in nuclear genome."
            answer: false
            explanation: "Band B, like Band A, is only seen in companion cells and therefore is nuclear in\
  \ origin, but nothing in the gel data (its mere presence/absence pattern) demonstrates\
  \ that it is non-functional - it could equally represent a genuine, functional paralogous\
  \ nuclear copy of the gene rather than a pseudogene, so calling it a pseudogene\
  \ specifically is not supported by this evidence."

      - id: q41
        number: "Q41"
        name: "Runaway versus Chase-Away Sexual Selection"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=51"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "In chase away selection, female choice correlates with male attributes that increase\
  \ female fitness."
            answer: false
            explanation: "The stem explicitly states that in chase-away selection, males with the novel attractive\
  \ trait 'don't offer any material or genetic benefit to the females' - so female\
  \ choice here does not track attributes that raise female fitness, which is exactly\
  \ why the preference becomes disadvantageous and females evolve resistance to it\
  \ over time."
          - letter: "B"
            text: "Extreme traits will evolve in males according to the runaway selection and will decrease\
  \ male life expectancy."
            answer: true
            explanation: "The runaway process is described as continuing 'until the male trait becomes so exaggerated\
  \ that it becomes selected against by natural selection', implying the trait eventually\
  \ imposes a survival cost (such as reduced life expectancy) that counterbalances\
  \ its mating advantage."
          - letter: "C"
            text: "Male attributes that become extreme because of chase-away selection will reduce male\
  \ life expectancy."
            answer: true
            explanation: "Just as with runaway selection, the chase-away process is described as continuing\
  \ 'until natural selection selects against this exaggerated trait', implying that\
  \ once extreme enough, the trait similarly imposes a survival cost such as reduced\
  \ life expectancy."
          - letter: "D"
            text: "Sensory bias is the primary requirement for chase-away selection to be evolved, but\
  \ is not necessary for runaway selection."
            answer: false
            explanation: "While chase-away selection is framed around exploiting an existing female sensory\
  \ bias, the stem's description does not establish that a similar bias plays no role\
  \ at all in initiating runaway selection - treating sensory bias as strictly exclusive\
  \ to chase-away and strictly irrelevant to runaway overstates a clean distinction\
  \ that the given descriptions do not actually support."

      - id: q42
        number: "Q42"
        name: "Adaptations, Spandrels, and Developmental Constraints"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=52"
        subjects:
          - name: "Evolutionary Developmental Biology (Evo-Devo)"
            link: "/resources/15-evolution/evolutionary-developmental-biology/"
        statements:
          - letter: "A"
            text: "If the feather characteristic of birds first evolved in dinosaurs for the purpose\
  \ of thermal regulation, that feather is similar to spandrels."
            answer: false
            explanation: "A spandrel is a non-adaptive by-product of some other feature; if feathers were directly\
  \ selected for the specific function of thermal regulation, that is the definition\
  \ of a true adaptation, not an incidental spandrel-like by-product."
          - letter: "B"
            text: "When investigating the evolution of small regulatory RNAs (where the phenotype is\
  \ closely tied to the genotype), biologists should not presume adaptation to avoid\
  \ mistaking \"spandrels\" for true adaptations."
            answer: false
            explanation: "A tight, direct genotype-phenotype relationship (as with small regulatory RNAs) actually\
  \ makes it easier, not harder, to test directly for signatures of selection (e.g.\
  \ via sequence-based tests), so this context does not specifically demand extra\
  \ caution against mistaking spandrels for adaptations any more than any other evolutionary\
  \ question would."
          - letter: "C"
            text: "Biological \"spandrels\" are more common in species with historically high population\
  \ size."
            answer: false
            explanation: "Spandrels arise from developmental, structural, or geometric by-products of selection\
  \ acting on other traits, not from a species' historical population size, and no\
  \ such relationship is established by the spandrel concept."
          - letter: "D"
            text: "The evolution of big brain in humans would be a biological spandrel if its evolutionary\
  \ trajectory is constrained by developmental process in primates."
            answer: false
            explanation: "Being shaped by a developmental constraint is a distinct concept from being a spandrel\
  \ - a spandrel specifically is an incidental by-product of selection on a different\
  \ trait, whereas a developmental constraint just limits or channels how a trait\
  \ (which could still be directly adaptive) is able to evolve; the two ideas are\
  \ related but are not the same thing."

      - id: q43
        number: "Q43"
        name: "The Godfrey-Smith Darwinian Space"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=53"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "Accumulation of excessive mutations can result in the extinction of a population.\
  \ (0,1,1) in the Darwinian space describes this situation."
            answer: true
            explanation: "The coordinate (0,1,1) has H=0, i.e. very low fidelity of heredity (poor copying/high\
  \ mutation rate); this is exactly the condition that can drive runaway mutation\
  \ accumulation and eventual extinction (an error-catastrophe-like collapse), matching\
  \ the described scenario."
          - letter: "B"
            text: "In the absence of selection, a population of organisms resides at (1,0,0)."
            answer: true
            explanation: "S measures how much reproductive success depends on genetic differences; setting\
  \ S=0 means genetic differences have no effect on reproductive success at all, which\
  \ is precisely the definition of the absence of natural selection."
          - letter: "C"
            text: "If your attempts at optimizing a bacteria species to consume glucose almost always\
  \ results in sub-optimized populations, you are exploring the space close to (1,0,1)."
            answer: false
            explanation: "The point (1,0,1) has S=0, meaning selection has essentially no effect on reproduction\
  \ at all - under that condition directed optimization wouldn't produce even a sub-optimal\
  \ improvement, it would produce no consistent improvement whatsoever; consistently\
  \ landing on sub-optimal (but still improved) outcomes is better explained by some\
  \ selection being present but the fitness landscape being rugged (low C), not by\
  \ an absence of selection's effect altogether."
          - letter: "D"
            text: "A somatic cell in the human body can reside at (0,1,1) (Here, heredity is defined\
  \ for the human and not the cell.)"
            answer: true
            explanation: "Since heredity (H) is defined at the level of the whole human (a somatic cell's own\
  \ genetic changes are not passed on to the next human generation, so H=0 at this\
  \ level of description), while selection-like dynamics among cell lineages within\
  \ the body (relevant to processes like cancer evolution) can still operate with\
  \ meaningful S and C values, placing a somatic cell at (0,1,1) captures this scenario."

      - id: q44
        number: "Q44"
        name: "Haldane's Estimate of the Human Mutation Rate"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=54"
        subjects:
          - name: "Genetic Drift, Gene Flow & Mutation"
            link: "/resources/15-evolution/genetic-drift-gene-flow-and-mutation/"
        statements:
          - letter: "A"
            text: "The purported relationship between mutation rate and frequency of that mutation is\
  \ only limited to populations that have reached mutation selection equilibrium."
            answer: true
            explanation: "Haldane's formula for inferring mutation rate from disease frequency is derived specifically\
  \ from mutation-selection balance (new mutations entering the population exactly\
  \ offset by selection removing them), so it only holds for a population that has\
  \ actually reached that equilibrium, not for an arbitrary population at some transient\
  \ state."
          - letter: "B"
            text: "For a recessive autosomal disorder that results in sterility, one would expect mutation\
  \ rate to be equal to six times the frequency of that disorder in a population."
            answer: false
            explanation: "For a fully recessive lethal/sterilizing autosomal disorder, mutation-selection balance\
  \ predicts the mutation rate equals approximately the square of the allele frequency\
  \ (mu approx q^2), not a simple fixed multiple (such as six times) of the disorder's\
  \ frequency - the X-linked case's simple '3x' relationship in the stem does not\
  \ carry over unchanged to the autosomal recessive case."
          - letter: "C"
            text: "The model assumes there is no drift."
            answer: true
            explanation: "Haldane's mutation-selection balance calculation is a deterministic model based purely\
  \ on the opposing forces of mutation and selection reaching an equilibrium, which\
  \ implicitly assumes a population large enough that random genetic drift can be\
  \ ignored."
          - letter: "D"
            text: "Linkage between a beneficial allele and hemophilia would have inflated Haldane's\
  \ estimate of mutation rate for hemophilia."
            answer: true
            explanation: "If the hemophilia mutation were genetically linked to a beneficial allele, hitchhiking\
  \ could keep the disease allele at a higher frequency than mutation-selection balance\
  \ alone would predict; since Haldane's method infers mutation rate directly from\
  \ the observed disease frequency assuming selection is the only opposing force,\
  \ an artificially inflated disease frequency from linkage would lead to an overestimated\
  \ mutation rate."

      - id: q45
        number: "Q45"
        name: "Phylogeography of the Indo-European Language Family"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=55"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            text: "Tocharian and Armenian are originated from steppe region."
            answer: false
            explanation: "Tocharian branches off very early in the tree, at a depth closer to the older Anatolian-hypothesis\
  \ timeframe (around 8000 years ago) rather than the more recent steppe-hypothesis\
  \ timeframe (around 6000 years ago), making an origin from the steppe region a poor\
  \ fit for this particular branch's estimated age."
          - letter: "B"
            text: "The result does not favour an Anatolian origin over a steppe origin."
            answer: true
            explanation: "While a few branches (like Anatolian and Tocharian) split off at older, Anatolian-hypothesis-consistent\
  \ times, the bulk of the major diversification into the large subfamilies clusters\
  \ at a younger age closer to the steppe-hypothesis timeframe, so the tree as a whole\
  \ doesn't decisively favour one origin hypothesis over the other."
          - letter: "C"
            text: "It is unlikely that the spread of agriculture serves as the sole driver of language\
  \ expansion on the continent."
            answer: false
            explanation: "Given that the deepest splits in the tree land within the Anatolian hypothesis's\
  \ proposed agricultural-expansion timeframe, the data are reasonably consistent\
  \ with (rather than clearly ruling out) agricultural spread as a plausible primary\
  \ driver of the language family's early expansion."
          - letter: "D"
            text: "Rate of language diversification in Balto-Slavic subfamily was higher than Germanic\
  \ subfamily."
            answer: true
            explanation: "The Balto-Slavic triangle in the tree is noticeably larger (representing more constituent\
  \ languages) for a comparable branch depth/age than the Germanic triangle, indicating\
  \ a higher rate of language diversification within Balto-Slavic."

      - id: q46
        number: "Q46"
        name: "Estimating Carrying Capacity from Population Growth Rate"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=56"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "The fish population grows exponentially as r is bigger than 1 in all years."
            answer: false
            explanation: "r exceeds 1 only in 2002 (2.77) and barely in 2003 (1.02); in every later year r\
  \ falls well below 1 or even goes negative (0.39, 0.15, -0.75, -0.15), so the claim\
  \ that r is bigger than 1 'in all years' is contradicted by the data."
          - letter: "B"
            text: "When fecundity is less than mortality we can assume N < K, which means that the population\
  \ is growing."
            answer: false
            explanation: "Fecundity less than mortality means births are outpaced by deaths, which is the definition\
  \ of a declining, not a growing, population - the stated conclusion directly contradicts\
  \ the premise."
          - letter: "C"
            text: "The fraction of the resources that were used by the fish in each year can be calculated\
  \ by N/K."
            answer: true
            explanation: "Under the standard logistic growth framework, N/K directly represents the proportion\
  \ of the carrying capacity (and hence of the available resource base) currently\
  \ being used by the population."
          - letter: "D"
            text: "The pond carrying capacity (K) is between 62 and 72."
            answer: true
            explanation: "In the later years the population settles into a narrow range (62, 72, 62) with growth\
  \ rate r hovering close to zero (small positive or negative values), the classic\
  \ signature of a population that has approached and is fluctuating around its carrying\
  \ capacity, placing K somewhere within that 62-72 range."

      - id: q47
        number: "Q47"
        name: "The Rise-and-Fall Pattern of Taxon Persistence in the Fossil Record"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=57"
        subjects:
          - name: "Macroevolutionary Patterns & Mass Extinctions"
            link: "/resources/15-evolution/macroevolutionary-patterns-and-mass-extinctions/"
        statements:
          - letter: "A"
            text: "According to the model the peak of a taxon's history is only identifiable after its\
  \ extinction."
            answer: false
            explanation: "The peak in the number of localities is simply the point where occurrence data stop\
  \ rising and start falling, which can in principle be recognised directly from the\
  \ accumulating occurrence record as it develops - it is not a feature that can only\
  \ be determined retrospectively once the taxon has already gone fully extinct."
          - letter: "B"
            text: "It has been observed that when different species reach their maximum population size\
  \ in an island, competition and species richness is also at their maximum. This\
  \ is consistent with the effect of environment and competition as shown in figure."
            answer: true
            explanation: "The figure's own arrows show competition (and environmental pressure) building up\
  \ toward the peak of a taxon's occurrence curve, matching the observation that competition\
  \ and species richness on islands also tend to be greatest when populations are\
  \ near their maximum size."
          - letter: "C"
            text: "The extinction of a taxon should not depend on its age."
            answer: true
            explanation: "This rise-and-fall pattern is proposed as a general trajectory shaped by environment\
  \ and competition rather than by how long a taxon has already existed, consistent\
  \ with the broader idea (echoing Van Valen's Red Queen hypothesis) that extinction\
  \ risk does not systematically depend on a taxon's age."
          - letter: "D"
            text: "When a taxon is rare, its extinction is more likely to be the result of abiotic factors"
            answer: true
            explanation: "Once a taxon has already declined to rarity (the post-peak decline phase), stochastic\
  \ abiotic events become relatively more important drivers of final extinction compared\
  \ to the biotic, competition-driven pressures that dominate during a taxon's earlier\
  \ expansion and peak phases."

      - id: q48
        number: "Q48"
        name: "Thermoregulation and the Thermoneutral Zone"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=58"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "A"
            text: "In a drastically-changing environment optimal body temperature of an endotherm animal\
  \ will be largely maintained with minor behavioural adjustments."
            answer: false
            explanation: "A drastically changing environment implies large temperature swings that typically\
  \ demand substantial physiological responses (e.g. increased metabolic heat production,\
  \ changes in insulation), not just minor behavioural tweaks, to keep body temperature\
  \ within its narrow tolerable range."
          - letter: "B"
            text: "When body temperature of endotherm animal starts dropping, it triggers the increase\
  \ of metabolic heat generation, independent of animal habitat."
            answer: false
            explanation: "While increased metabolic heat production on cooling is a common thermoregulatory\
  \ response, different endotherm species from different habitats rely on varying\
  \ combinations of strategies (behavioural avoidance, torpor, insulation) rather\
  \ than a single uniform metabolic response 'independent of habitat', so this blanket\
  \ claim overgeneralizes."
          - letter: "C"
            text: "Basal metabolic rate of an endotherm animal stays constant throughout a limited range\
  \ of environmental temperatures."
            answer: true
            explanation: "This describes the thermoneutral zone shown in the figure - across this specific\
  \ temperature range, metabolic rate stays flat at its baseline level before rising\
  \ as temperature drops below the lower critical temperature."
          - letter: "D"
            text: "One way that some endotherm animal species tolerate extreme cold conditions is to\
  \ alter their lower critical temperature."
            answer: true
            explanation: "Many endotherms can physiologically acclimatize (e.g. via increased insulation or\
  \ altered basal metabolism) to shift their lower critical temperature downward,\
  \ effectively widening their thermoneutral zone and improving cold tolerance."

      - id: q49
        number: "Q49"
        name: "Transmission and Recovery Parameters in the SIR Model"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=59"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "For the disease to remain in the population without adding any new source of infection,\
  \ A should be at least equal to B."
            answer: false
            explanation: "Whether a disease persists depends on the full effective reproduction number, which\
  \ also involves the contact rate and the size of the susceptible population, not\
  \ simply on transmission probability A being at least as large as recovery rate\
  \ B in isolation - this simplified comparison omits those other necessary factors."
          - letter: "B"
            text: "The smaller the minimal infectious dose (the amount of pathogen required to cause\
  \ an infection), the higher the A is."
            answer: true
            explanation: "A smaller minimal infectious dose means less pathogen exposure is needed to successfully\
  \ establish infection upon contact, which directly corresponds to a higher per-contact\
  \ transmission probability A."
          - letter: "C"
            text: "If the disease is very lethal, it is more likely for it to be self-limited (the epidemic\
  \ will finish all by itself)."
            answer: true
            explanation: "A highly lethal pathogen tends to kill or incapacitate hosts quickly, shortening\
  \ the effective time available for onward transmission and rapidly removing infected\
  \ individuals from the transmission chain, which favours the epidemic burning out\
  \ on its own rather than persisting."
          - letter: "D"
            text: "If the infection period is longer, a higher proportion of population is infected."
            answer: true
            explanation: "A longer infectious period (a lower recovery rate B) gives each infected individual\
  \ more time to transmit to susceptible contacts before recovering, generally increasing\
  \ the total proportion of the population that becomes infected over the course of\
  \ the epidemic."

      - id: q50
        number: "Q50"
        name: "Repeatability of Personality Traits Across Spider Species"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=60"
        subjects:
          - name: "Mechanisms of Behavior"
            link: "/resources/9-ethology/mechanisms-of-behavior/"
        statements:
          - letter: "A"
            text: "This study failed to demonstrate association between boldness and aggressiveness\
  \ regardless of feeding regimes."
            answer: true
            explanation: "The repeatability patterns for aggressiveness and boldness diverge differently across\
  \ species and feeding regimes rather than tracking each other consistently, so the\
  \ data do not establish a stable, regime-independent association between the two\
  \ traits."
          - letter: "B"
            text: "Repeatability of aggressiveness response in L. hesperus is independent of feeding\
  \ regimes."
            answer: true
            explanation: "L. hesperus's aggressiveness repeatability fluctuates without a clear, consistent\
  \ trend across the feeding regime gradient, unlike A. aperta and A. studiosus which\
  \ both show a clearer increasing pattern with more frequent feeding, suggesting\
  \ L. hesperus's repeatability does not depend on feeding regime in the same way."
          - letter: "C"
            text: "Behavioural variation of each individual always decreases when spiders suffered prolonged\
  \ food restrictions."
            answer: false
            explanation: "The repeatability estimates do not uniformly decrease under food restriction across\
  \ all species and traits - the direction of change varies by species and by which\
  \ trait (boldness vs aggressiveness) is being measured, so an absolute 'always decreases'\
  \ claim is not supported."
          - letter: "D"
            text: "L. hesperus shows different repeatability in behavioural response than two other\
  \ species regarding to different feeding regime, thus we can assume different species\
  \ have different behaviour over time and contexts."
            answer: true
            explanation: "Since L. hesperus's repeatability trend across feeding regimes clearly differs from\
  \ the patterns shown by A. aperta and A. studiosus, this is consistent with species-specific\
  \ differences in how consistent (repeatable) their behaviour is across contexts\
  \ - which is exactly what distinguishes species-level 'personality' profiles."

      - id: q51
        number: "Q51"
        name: "Contrasting Parasitic Strategies: Sam and Jack"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf#page=62"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "A"
            text: "Utilizing antigen shuffling, even though it is a costly trait."
            answer: true
            explanation: "Sam's 'merry', low-harm strategy depends on persisting in the host long-term rather\
  \ than killing it quickly, so evading the host immune system over an extended period\
  \ - which antigen shuffling achieves - is worth its cost for a parasite like Sam,\
  \ unlike an aggressive parasite that damages and may exit or kill its host relatively\
  \ quickly."
          - letter: "B"
            text: "Having a life cycle consisting of two hosts."
            answer: false
            explanation: "A benign, likely vertically-transmitted parasite like Sam benefits from a simple,\
  \ single-host life cycle tied to the host's own reproduction; a complex two-host\
  \ life cycle (needing to find and infect a new host at each stage) fits Jack's more\
  \ aggressive, actively host-seeking immature stages far better than Sam's strategy."
          - letter: "C"
            text: "Choosing an r-selected host."
            answer: false
            explanation: "An r-selected host (short-lived, rapidly turning over) suits an aggressive parasite\
  \ like Jack that can afford to damage or exhaust individual hosts and needs a constant\
  \ supply of new ones; Sam's mild, host-preserving strategy instead benefits more\
  \ from a stable, long-lived (K-selected) host population that supports chronic infection."
          - letter: "D"
            text: "Secreting Samilosporin (an antibiotic which destroys many of bacterial species that\
  \ are virulent for the host)."
            answer: true
            explanation: "Protecting the host from other harmful pathogens indirectly benefits a parasite whose\
  \ own fitness depends on the host staying alive and healthy for a long time, fitting\
  \ Sam's mild, host-preserving strategy rather than Jack's exploitative one."
          - letter: "E"
            text: "Transmitting to the next generation by infecting the gametes."
            answer: true
            explanation: "Vertical transmission through the host's own gametes is a classic feature of low-virulence,\
  \ long-term symbionts whose own reproductive success is tied to the host's survival\
  \ and reproduction, matching Sam's merry, host-preserving strategy rather than Jack's\
  \ aggressive, actively-transmitting one."
          - letter: "F"
            text: "Sam will probably win the competition against Jack."
            answer: false
            explanation: "Jack is described as more aggressive, actively penetrating and degrading host tissue\
  \ with secreted enzymes, which typically allows a more exploitative competitor to\
  \ outcompete a milder one for shared host resources within the same host, so Sam\
  \ is not expected to win a direct competition against Jack."
          - letter: "G"
            text: "If a lethal bacterium spread through the population of the host, Sam's fitness will\
  \ increase."
            answer: false
            explanation: "Since Sam's fitness depends on the host surviving and reproducing over the long term\
  \ (including vertical transmission via gametes), a lethal bacterium reducing or\
  \ killing off the host population would reduce, not increase, Sam's opportunities\
  \ for transmission and overall fitness."
          - letter: "H"
            text: "Sam's fitness is negatively correlated with Jack's abundance."
            answer: true
            explanation: "Because Jack actively damages the shared host and competes for its resources, higher\
  \ Jack abundance within a host is expected to degrade the host environment Sam depends\
  \ on, reducing Sam's fitness - a negative correlation between the two."
          - letter: "I"
            text: "Sam's fitness is less affected by the life-history traits of the host than Jack's."
            answer: false
            explanation: "Since Sam relies on vertical transmission through the host's own reproduction, Sam's\
  \ fitness is actually tightly bound to the host's own life-history traits (especially\
  \ its reproductive success), arguably more so than Jack's, whose transmission instead\
  \ depends on actively finding new hosts - so Sam's fitness is not less affected\
  \ by host life history than Jack's."

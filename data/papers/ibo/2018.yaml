name: "2018"
location: "Tehran, Iran"
rounds:
  - id: theoretical-1
    name: "Theoretical 1"
    durationMinutes: 180
    papers:
      - category: "Theoretical 1"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf"
        linkLabel: "Exam"
        solutionLink: "/papers/ibo/2018/answer-keys.pdf"
        solutionLabel: "Official Answer Key (Theoretical Exams 1 + 2)"
    problems:

      - id: q1
        number: "Q1"
        name: "Neurospora Pathway Reconstruction"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=3"
        subjects:
          - name: "Gene Interactions: Epistasis & Complementation Analysis"
            link: "/resources/7-genetics/epistasis-gene-interactions-complementation/"
        statements:
          - letter: "A"
            text: "The mutations in the mutated strains were distributed in two genes."
            answer: true
            explanation: "The complementation table splits cleanly into two groups: Mutant 1 fails to complement\
  \ Mutant 4, and Mutants 2/3 fail to complement each other or Mutant 4, while Mutant\
  \ 1 complements Mutants 2 and 3. That pattern (Mutant1+Mutant4 non-complementing;\
  \ Mutant2+Mutant3 non-complementing; the two groups complementing each other) is\
  \ exactly what two distinct genes would produce."
          - letter: "B"
            text: "Considering all the mutant strains, at least five different sites of the Neurospora\
  \ genome were mutated in one or more strains."
            answer: false
            explanation: "Only two complementation groups are needed to explain every growth and complementation\
  \ result, so the simplest consistent model is one mutated site per gene - two sites\
  \ total. Nothing in the data forces five separate mutation sites."
          - letter: "C"
            text: "At least two of the mutant strains were double mutants (i.e. > 1 site was mutated\
  \ in each of these strains)."
            answer: false
            explanation: "Every strain's phenotype and complementation behaviour is fully explained by a single\
  \ lesion in one of the two genes, so there is no evidence requiring any strain to\
  \ carry more than one mutated site."
          - letter: "D"
            text: "The mutation site of Mutant 3 is positioned between the mutation site in Mutant 2\
  \ and the mutation site in Mutant 4."
            answer: false
            explanation: "Mutant 4 lies in a different gene from Mutants 2 and 3 (it fails to complement Mutant\
  \ 1's gene instead), so its mutation site cannot be placed on the same intragenic\
  \ map as Mutant 2 and Mutant 3 - fine-structure ordering only makes sense within\
  \ one gene."
          - letter: "E"
            text: "It is expected that 25% of spores resulting from mating between Mutant 2 and wild\
  \ type strain will be prototrophs."
            answer: false
            explanation: "A cross between a single-gene mutant and wild type segregates 1:1 at meiosis, so\
  \ about 50% of the resulting spores should be prototrophic, not 25% - 25% would\
  \ only apply to a two-gene segregation ratio, which doesn't fit a mutant x wild-type\
  \ cross."

      - id: q2
        number: "Q2"
        name: "DNA Barcoding in Persian Gulf Fish"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=4"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            text: "The evolutionary rate of sequence change in a DNA fragment chosen for DNA barcoding\
  \ should certainly be more rapid than the evolutionary rate of change in the H4\
  \ histone encoding gene."
            answer: true
            explanation: "Barcoding needs enough variation to distinguish closely related species, so the marker\
  \ must evolve fast enough to accumulate differences over short timescales. Histone\
  \ H4 is one of the most strongly conserved proteins known and evolves extremely\
  \ slowly, so a barcoding fragment must evolve faster than it to be useful."
          - letter: "B"
            text: "The high average COI intraspecific K2P distance of the Persian gulf study compared\
  \ to other fish studies could be explained by existence of relatively diverged clusters\
  \ within one or a few of the nominal species studied (i.e. those based on morphology)."
            answer: true
            explanation: "If what was called a single morphological species is actually a complex of cryptic,\
  \ diverged lineages, pooling them as one 'species' would inflate the measured within-species\
  \ distance well above typical values - exactly the pattern seen (1.15% versus 0.25-0.45%)."
          - letter: "C"
            text: "The data in table support the proposal that species identification of fish can be\
  \ made on the basis of COI fragment sequences."
            answer: true
            explanation: "The table shows a clear, ordered increase in mean K2P distance from within-species\
  \ (0.18%) up through genus, family, order, and class - a 'barcoding gap' between\
  \ within- and between-species divergence that is exactly what would let COI sequences\
  \ reliably discriminate species."
          - letter: "D"
            text: "Table 1 suggests that COI based barcoding is not appropriate for genus identification."
            answer: true
            explanation: "Within-genus distances (mean 12%, minimum 6.19%) overlap very little with within-species\
  \ distances but the spread is wide and close to some between-family values, and\
  \ more importantly the question is about resolving genera themselves - the large\
  \ minimum-to-mean spread at the genus level makes clean genus-level discrimination\
  \ unreliable compared to the sharper species-level gap."

      - id: q3
        number: "Q3"
        name: "K2P Genetic Divergence Across Regions"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=5"
        subjects:
          - name: "Molecular Systematics"
            link: "/resources/4-biosystematics/molecular-systematics/"
        statements:
          - letter: "A"
            text: "The SD value of the 18th comparison in calculation (i) above is consistent with the\
  \ suggestion that the fish compared in fact do not all belong to the same species."
            answer: true
            explanation: "A standard deviation of 1.26% is roughly ten times higher than the typical 0.11%\
  \ seen for genuine single-species intraregional samples, suggesting the specimens\
  \ grouped under that name are unusually heterogeneous - consistent with cryptic\
  \ species being lumped together rather than one true biological species."
          - letter: "B"
            text: "The K2P divergence values reported in calculation (ii) is consistent with the proposal\
  \ that A. spinifer populations of India and South Africa arose from a common source\
  \ population, but that there is greater variation in the ecological niches of India\
  \ as compared to South Africa."
            answer: true
            explanation: "The interregional (India-South Africa) divergence of 0.13% is actually lower than\
  \ the within-India intraregional divergence of 0.20%, which fits a recently shared\
  \ ancestry between the two regions; the higher intraregional value in India alone\
  \ points to more internal variation there, consistent with a more heterogeneous\
  \ niche."
          - letter: "C"
            text: "The divergence values in calculation (iii) show that, as compared to interregional\
  \ divergence values, global divergence values are more informative of extent of\
  \ divergence that exists for P. indicus in the world."
            answer: false
            explanation: "The single global figure (9.46%) collapses a wide range of interregional values (4.05%\
  \ to 16.05%) into one average, actually hiding rather than revealing how divergence\
  \ varies by region pair - the interregional breakdown is the more informative, not\
  \ less informative, view."
          - letter: "D"
            text: "With reference to calculation (iii), the difference between global divergence value\
  \ (9.46%) and average of interregional divergence values (11.58) can be explained\
  \ by unequal number of specimens from different regions."
            answer: true
            explanation: "Global divergence averages over all pairwise sequence comparisons directly, so regions\
  \ contributing disproportionately more specimens weight the global average toward\
  \ their own (generally lower) values, which can pull the global figure below the\
  \ simple, unweighted average of the six regional-pair values."

      - id: q4
        number: "Q4"
        name: "Pulse-Chase RNA Processing"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=6"
        subjects:
          - name: "Transcription & RNA Processing"
            link: "/resources/1-cell-molecular/transcription-rna-processing/"
        statements:
          - letter: "A"
            text: "Based on the data presented, most (~90% of mass) of RNA that is synthesized in the\
  \ nucleus is degraded in the nucleus without ever entering the cytoplasm."
            answer: true
            explanation: "By 8 hours the nuclear label has fallen essentially to 0% while cytoplasmic label\
  \ has only risen to about 10%, so roughly 90% of the labelled nuclear RNA disappeared\
  \ without ever showing up in the cytoplasm - the expected fate of most primary transcript\
  \ mass (largely intron sequence removed during splicing) being degraded rather than\
  \ exported."
          - letter: "B"
            text: "Based on data presented, the complexity of RNA (which refers to number of different\
  \ sequences) in the nucleus is higher than in the cytoplasm."
            answer: false
            explanation: "The graph tracks the amount (mass) of label remaining over time, not the number of\
  \ distinct sequences present, so it provides no direct information about sequence\
  \ complexity in either compartment."
          - letter: "C"
            text: "Assuming that introns constitute 60% of primary transcripts, splicing can account\
  \ for the observed difference in amount of label in the nucleus at start of chase\
  \ and amount of label in the cytoplasm after eight hours of chase."
            answer: false
            explanation: "Splicing alone would only remove about 60% of the label, leaving roughly 40% expected\
  \ in mature mRNA reaching the cytoplasm, but only about 10% of the original label\
  \ is seen in the cytoplasm at 8 hours - so intron removal by itself cannot account\
  \ for the full drop, and other losses (nuclear turnover/degradation) must also be\
  \ involved."
          - letter: "D"
            text: "It is expected that chases of longer than 8 hours would have ultimately shown a much\
  \ higher amount of label in the cytoplasm than seen at 8 hours."
            answer: false
            explanation: "By 8 hours the nuclear pool of labelled RNA is essentially exhausted (near 0%), so\
  \ there is no more labelled material left to be exported - the cytoplasmic curve\
  \ should plateau near its 8-hour value rather than climb much further."

      - id: q5
        number: "Q5"
        name: "Fluorescence Quenching of Tryptophan Residues"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=7"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "A"
            text: "Among the three mutated proteins, protein 1 is expected to have the lowest enzymatic\
  \ activity."
            answer: true
            explanation: "Protein 1 has the shallowest slope (lowest KSV), meaning its tryptophan residues\
  \ are the least accessible to iodide and so the protein is the most rigid/buried\
  \ of the three. Since higher flexibility usually goes with higher activity, the\
  \ most rigid variant (protein 1) is expected to have the lowest activity."
          - letter: "B"
            text: "Iodide ions have higher accessibility to the tryptophan residues of protein 2 as\
  \ compared to protein 3."
            answer: false
            explanation: "Protein 3's line has the steepest slope (highest KSV) of the three, meaning its tryptophan\
  \ residues are quenched more efficiently and are therefore more exposed to iodide\
  \ than protein 2's - the opposite of this statement."
          - letter: "C"
            text: "Protein 3 has the highest KSV."
            answer: true
            explanation: "The steepest Fo/F versus [KI] slope belongs to line 3, and the slope of this linear\
  \ Stern-Volmer relationship is exactly KSV, so protein 3 has the highest quenching\
  \ constant."
          - letter: "D"
            text: "Protein 1 does not have tryptophan residues."
            answer: false
            explanation: "Protein 1 still shows measurable, KI-concentration-dependent quenching (a rising\
  \ Fo/F line, just with the shallowest slope), which means it does have accessible\
  \ tryptophan being quenched - it is just less exposed than in proteins 2 and 3,\
  \ not absent."

      - id: q6
        number: "Q6"
        name: "pHLIP-Mediated AntimiR Delivery to Tumours"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=8"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "A"
            text: "Based on the data, you can conclude the liver does not function in clearing the pHLIP-antimiRs\
  \ from the body."
            answer: false
            explanation: "Figure 1a shows a clear fluorescence/imaging signal in the liver alongside the kidneys\
  \ and tumour, indicating the liver does accumulate/handle the construct rather than\
  \ being uninvolved in its clearance."
          - letter: "B"
            text: "At pH less than 7, pHLIP inserts into the lipid bilayer and thus facilitates delivery\
  \ of attached antimiR-155."
            answer: true
            explanation: "This is exactly the described mechanism in Fig. 1b: at low (acidic) pH, pHLIP folds\
  \ into a transmembrane helix that inserts into the membrane, physically carrying\
  \ its attached antimiR cargo across into the cell."
          - letter: "C"
            text: "The acidic microenvironment of tumours is responsible for intracellular release of\
  \ antimiR-155."
            answer: false
            explanation: "The acidic pH triggers pHLIP's membrane insertion and delivery step (getting the\
  \ antimiR across the membrane), but release of the free antimiR from pHLIP inside\
  \ the cell is driven by reduction of the disulfide (S-S) linkage, not directly by\
  \ the acidic pH itself."
          - letter: "D"
            text: "The antimiR cargo will be trapped within endosomes."
            answer: false
            explanation: "The whole rationale of the pHLIP platform is that it delivers cargo directly across\
  \ the plasma membrane via pH-triggered helix insertion, bypassing the endocytic\
  \ pathway - so the antimiR is not expected to be trapped in endosomes."
          - letter: "E"
            text: "Transition from random coil to helix of pHLIP enhances cell death."
            answer: true
            explanation: "The helical, membrane-inserted form of pHLIP is what delivers the antimiR-155 cargo\
  \ into tumour cells, and Fig. 2b shows that greater antimiR-155 delivery (occurring\
  \ at low pH, where the coil-to-helix transition happens) reduces the fraction of\
  \ viable cells - so the helix transition is linked to increased cell death."

      - id: q7
        number: "Q7"
        name: "Primary vs Secondary Response Genes"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=10"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "A"
            text: "inhibition of DNA replication simultaneously with hormone administration"
            answer: false
            explanation: "Primary and secondary response gene activation is a transcriptional cascade, not\
  \ something that depends on new DNA replication, so blocking replication would not\
  \ distinguish between the two classes of genes."
          - letter: "B"
            text: "inhibition of transcription simultaneously with hormone administration"
            answer: false
            explanation: "Blocking transcription entirely would prevent expression of both primary and secondary\
  \ response genes equally, since both classes require transcription - it would not\
  \ separate them from each other."
          - letter: "C"
            text: "inhibition of translation simultaneously with hormone administration"
            answer: true
            explanation: "Primary response genes are activated directly by the hormone-receptor complex without\
  \ needing new protein synthesis, so they are still induced when translation is blocked;\
  \ secondary response genes require a primary-response-gene protein product (e.g.\
  \ a transcription factor) to be made first, so blocking translation selectively\
  \ prevents secondary but not primary response gene induction - exactly the classic\
  \ experimental way to distinguish the two classes."
          - letter: "D"
            text: "inhibition of transcription and translation simultaneously with hormone administration"
            answer: false
            explanation: "Blocking both transcription and translation together would shut down primary and\
  \ secondary response genes alike, since primary genes still need transcription even\
  \ without new translation - this does not selectively distinguish the two classes."

      - id: q8
        number: "Q8"
        name: "Mitochondrial Uncoupling Drugs"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=11"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "These drugs will increase oxygen consumption."
            answer: true
            explanation: "Uncouplers dissipate the proton gradient without making ATP, so the electron transport\
  \ chain has to run faster (consuming more O2) to try to maintain the gradient -\
  \ net effect is increased oxygen consumption."
          - letter: "B"
            text: "These drugs will reduce body carbohydrate catabolism."
            answer: false
            explanation: "Because uncoupling makes oxidative phosphorylation inefficient, the body compensates\
  \ by increasing fuel catabolism (including carbohydrate breakdown) to try to meet\
  \ ATP demand, rather than reducing it."
          - letter: "C"
            text: "These drugs will decrease body temperature."
            answer: false
            explanation: "Since the energy from the proton gradient is released as heat instead of being captured\
  \ as ATP, uncouplers increase heat production (this is the basis of adaptive, uncoupling-protein-driven\
  \ thermogenesis), so body temperature tends to rise, not fall."
          - letter: "D"
            text: "These drugs may cause death upon overdose because of severe weight loss."
            answer: false
            explanation: "Although uncouplers do cause weight loss (via increased catabolism), death from overdose\
  \ is due to the acute failure of ATP production and dangerous hyperthermia, which\
  \ occurs far too quickly to be explained by weight loss."
          - letter: "E"
            text: "These drugs may cause death upon overdose because of severe ATP loss."
            answer: true
            explanation: "At high doses, uncoupling becomes so severe that cells cannot make enough ATP for\
  \ essential functions despite maximal respiration, and combined with dangerous hyperthermia\
  \ this ATP crisis is the actual acute cause of death in uncoupler overdose (historically\
  \ seen with 2,4-dinitrophenol)."

      - id: q9
        number: "Q9"
        name: "SalI/XhoI Restriction Cloning Analysis"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=12"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "A"
            text: "The data indicate that two copies of the insert were cloned in the expression vector."
            answer: false
            explanation: "Complete digestion of the recombinant plasmid with SalI or with XhoI alone gives\
  \ a single linearized band about 2 kb larger than the empty vector, consistent with\
  \ one copy of the insert - a second copy would add another size increment or an\
  \ extra band, which is not seen."
          - letter: "B"
            text: "Half of the clones are expected to be able to transcribe the mRNA of gene X."
            answer: true
            explanation: "Because a SalI/XhoI hybrid sticky end can be ligated in either orientation with equal\
  \ likelihood, only about half of the recombinant clones will have the insert oriented\
  \ correctly (sense) relative to the promoter to be transcribed into functional gene\
  \ X mRNA; the other half will be inserted backwards."
          - letter: "C"
            text: "An XhoI site exists outside of the insert in the recombinant vector of the experiment."
            answer: false
            explanation: "Digesting the recombinant plasmid with XhoI alone gives a single linear band (just\
  \ like SalI alone), meaning there is only one XhoI site in the whole recombinant\
  \ molecule - the one regenerated at the insert/vector junction - with no additional\
  \ XhoI site elsewhere in the vector backbone."
          - letter: "D"
            text: "The 2 kb fragment seen in the gel can be used as probe to screen for the recombinant\
  \ vectors"
            answer: false
            explanation: "The 2 kb fragment only appears in the double-digested (SalI + XhoI) recombinant lane,\
  \ released internally from within the insert itself - since it comes from the insert\
  \ (which the recombinant vector contains by definition), using it as a hybridization\
  \ probe would not distinguish recombinant from non-recombinant clones any better\
  \ than probing with the insert directly, and simpler screening methods (e.g. single-enzyme\
  \ digest for size shift) are already sufficient."
          - letter: "E"
            text: "If the insert produced by SalI digestion was ligated into a vector that had been\
  \ cut with both XhoI and SalI enzymes and the recombinant plasmid subsequently cut\
  \ with XhoI, a 4 kb product would be obtained."
            answer: false
            explanation: "Cutting the vector with both XhoI and SalI would remove a small fragment between\
  \ the two sites, meaning ligating the SalI insert back in would only regenerate\
  \ one of the two junctions as a cuttable site (typically only the SalI-compatible\
  \ end reconstitutes properly), so re-cutting with XhoI would not reliably linearize\
  \ the plasmid into the stated 4 kb product - the double-digested vector backbone\
  \ doesn't recreate a clean two-XhoI-site geometry."

      - id: q10
        number: "Q10"
        name: "Yeast Mating and Polygenic Complementation"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=13"
        subjects:
          - name: "Gene Interactions: Epistasis & Complementation Analysis"
            link: "/resources/7-genetics/epistasis-gene-interactions-complementation/"
        statements:
          - letter: "A"
            text: "If mutations of m1 and m2 were in the same gene, it is possible that all products\
  \ of meiosis of cross 3 will be unhappy."
            answer: true
            explanation: "If m1 and m2 are both recessive loss-of-function alleles of the same gene, the diploid\
  \ from cross 3 would be homozygous mutant at that locus (m1/m2, no wild-type copy\
  \ present), so every meiotic product could inherit only mutant alleles there and\
  \ show the unhappy phenotype."
          - letter: "B"
            text: "If 1 happy to 3 unhappy yeasts were produced from meiosis of cross 3, then the mutation\
  \ of m1 and the mutation of m2 were in different genes."
            answer: true
            explanation: "A 1:3 happy:unhappy ratio is the classic result of two independently segregating\
  \ recessive loci each contributing to the phenotype (only the 1/16... here effectively\
  \ 1/4 double-heterozygote-complementing class is happy), which requires m1 and m2\
  \ to be in different genes rather than allelic to each other."
          - letter: "C"
            text: "If 1 happy to 1unhappy yeasts were produced from meiosis of cross 3, then the mutation\
  \ of m1 and the mutation of m2 can suppress each other."
            answer: true
            explanation: "A simple 1:1 ratio doesn't fit ordinary single- or two-gene recessive segregation\
  \ from this cross as cleanly as an interaction where one mutant allele can suppress\
  \ the unhappy phenotype caused by the other, so this observed ratio is consistent\
  \ with (though not exclusively proving) a suppression-type genetic interaction between\
  \ m1 and m2."
          - letter: "D"
            text: "If the experiments were performed with various pairs of unhappy mutants, the most\
  \ frequently observed ratio of happy to unhappy yeasts among meiosis products of\
  \ cross 3 would be 1:3."
            answer: true
            explanation: "Because 'unhappy' is described as polygenic with many contributing genes, most randomly\
  \ chosen pairs of unhappy mutants are expected to carry mutations in different genes\
  \ rather than the same one, so the two-gene complementation ratio (1 happy : 3 unhappy)\
  \ should be the most commonly observed outcome across many such crosses."

      - id: q11
        number: "Q11"
        name: "Alpha- vs Beta-Thalassemia and AHSP"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=14"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "A"
            text: "Higher incidence of severe beta-thalassemia compared to severe alpha-thalassemia\
  \ could be explained by difference in copy numbers of alpha and beta genes."
            answer: true
            explanation: "With four alpha alleles but only two beta alleles per diploid genome, losing function\
  \ at the alpha loci requires knocking out more gene copies before a severe phenotype\
  \ appears, giving natural redundancy; beta-thalassemia has no such backup copies,\
  \ so a similar mutation burden more readily produces a severe beta phenotype."
          - letter: "B"
            text: "alpha-globin/beta-globin ratio is an appropriate marker for screening of beta-thalassemia."
            answer: true
            explanation: "In beta-thalassemia beta-globin production falls while alpha-globin production stays\
  \ normal, so an elevated alpha:beta globin ratio (excess alpha relative to beta)\
  \ is a biologically sensible and, in practice, real laboratory indicator of beta-thalassemia."
          - letter: "C"
            text: "alpha-Hemoglobin has a higher affinity for beta-hemoglobin than for AHSP."
            answer: true
            explanation: "The passage states beta-globin displaces AHSP when it is expressed, which can only\
  \ happen if beta-globin binds alpha-globin more tightly (or otherwise out-competes)\
  \ than AHSP does at the same binding face - i.e. alpha-globin's affinity for beta-globin\
  \ exceeds its affinity for AHSP."
          - letter: "D"
            text: "AHSP deleterious mutations are expected to mimic beta-thalassemia phenotype with\
  \ respect to alpha- chain aggregation."
            answer: true
            explanation: "AHSP's job is to keep newly made alpha-globin soluble until beta-globin is available\
  \ to pair with it; without functional AHSP, free alpha-globin would be expected\
  \ to misfold and aggregate even when beta-globin genes are completely normal - producing\
  \ the same toxic alpha-chain aggregation phenotype seen in beta-thalassemia, but\
  \ for a different underlying reason."

      - id: q12
        number: "Q12"
        name: "G6PD Deficiency and the Pentose Phosphate Pathway"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=15"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "The high prevalence of G6PD deficiency in regions with high incidence of malaria\
  \ can be explained by high susceptibility of Plasmodium falciparum to oxidative\
  \ agents."
            answer: true
            explanation: "G6PD-deficient red blood cells have lower NADPH and are less able to buffer oxidative\
  \ stress, creating a more oxidizing intracellular environment; since the malaria\
  \ parasite is particularly vulnerable to oxidative damage, this hostile environment\
  \ impairs parasite survival, giving G6PD-deficient carriers a survival advantage\
  \ in malaria-endemic regions and explaining the geographic correlation."
          - letter: "B"
            text: "Increase in levels of cell division is accompanied by increase in the ratio of fructose-6\
  \ phosphate/ ribose-5 phosphate production by the pentose phosphate pathway."
            answer: false
            explanation: "Rapidly dividing cells need large amounts of ribose-5-phosphate for nucleotide/nucleic\
  \ acid synthesis, so the non-oxidative phase of the pathway is expected to favour\
  \ ribose-5-phosphate output over fructose-6-phosphate, which would decrease (not\
  \ increase) the fructose-6-phosphate/ribose-5-phosphate ratio."
          - letter: "C"
            text: "G6PD deficiency affects catabolism more than anabolism in individuals with the deficiency."
            answer: false
            explanation: "G6PD catalyses the first, NADPH-generating step of the pentose phosphate pathway,\
  \ and NADPH is used predominantly as reducing power for biosynthetic (anabolic)\
  \ reactions and antioxidant defence, not for catabolic breakdown pathways - so a\
  \ G6PD deficiency primarily compromises anabolic/reductive capacity rather than\
  \ catabolism."
          - letter: "D"
            text: "It is expected that the cause of favism in some affected individuals may be glutathione\
  \ reductase deficiency."
            answer: true
            explanation: "Favism results from an inability to keep glutathione in its reduced (GSH) form under\
  \ oxidative stress; since glutathione reductase is the enzyme that regenerates GSH\
  \ from GSSG using NADPH, a deficiency in glutathione reductase itself (not just\
  \ in NADPH supply from G6PD) could independently produce the same low-GSH, favism-prone\
  \ state."

      - id: q13
        number: "Q13"
        name: "Beta-Clamp Processivity in DNA Polymerase III"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=16"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "A"
            text: "After replication has finished, Pol III* dissociates from its original beta-clamp."
            answer: true
            explanation: "Once the donor M13mp18 template is replicated to completion, both acceptor templates\
  \ (M13Gori and PhiX174) also get replicated over the course of the 90 minute incubation\
  \ - this can only happen if Pol III* leaves the original donor beta-clamp and moves\
  \ on to synthesize DNA on the other templates."
          - letter: "B"
            text: "The data are consistent with the notion that the beta-clamp is not absolutely required\
  \ for replication."
            answer: true
            explanation: "In both experiments, the PhiX174 acceptor lacking a preloaded beta-clamp still gets\
  \ replicated (bands for it appear in the gel, lanes 1-4 and 5-8), showing that Pol\
  \ III* can still synthesize DNA on a template even without a pre-existing clamp\
  \ there, i.e. a new clamp can be loaded and/or replication can proceed without one\
  \ being preloaded."
          - letter: "C"
            text: "Pol III* prefers an acceptor template preloaded with a beta-clamp."
            answer: true
            explanation: "Comparing the two experiments, the acceptor that already carries a beta-clamp (M13Gori\
  \ in lanes 1-4, then PhiX174 in lanes 5-8) is replicated more strongly/rapidly (stronger,\
  \ earlier-appearing bands) than the acceptor lacking a preloaded clamp, showing\
  \ Pol III* preferentially moves to the clamp-bearing template."
          - letter: "D"
            text: "Based on the results, one beta-clamp is enough to synthesize all Okazaki fragments\
  \ on the lagging strand of each replication fork."
            answer: false
            explanation: "The whole experimental design and outcome (Pol III* leaving the original clamp and\
  \ cycling onto new acceptor templates/clamps) demonstrates repeated clamp dissociation\
  \ and reloading between fragments, which is inconsistent with a single clamp being\
  \ sufficient to make every Okazaki fragment on the lagging strand."

      - id: q14
        number: "Q14"
        name: "Two-Step Enzymatic Release of Para-nitrophenol"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=17"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "A"
            text: "The release of para-nitrophenol occurs during the first step of enzymatic mechanism."
            answer: true
            explanation: "The absorbance rises sharply right from the start of the reaction (region a), meaning\
  \ para-nitrophenol is being generated immediately, which fits it being released\
  \ in the fast first step of a two-step mechanism (e.g. formation of an acyl-enzyme\
  \ intermediate with release of the chromophore) rather than waiting for a second,\
  \ slower step."
          - letter: "B"
            text: "The rate limiting step of this enzymatic mechanism is the second step."
            answer: true
            explanation: "After the initial fast burst (region a), the reaction settles into a much slower,\
  \ steady linear rate (region b); this steady-state rate reflects the slower second\
  \ step of the mechanism (e.g. hydrolysis/regeneration of free enzyme) becoming rate-limiting\
  \ for further turnover."
          - letter: "C"
            text: "Enzyme activity can be determined from the slope of region \"a\" of the curve."
            answer: false
            explanation: "Region 'a' is a pre-steady-state burst phase reflecting a single, roughly stoichiometric\
  \ round of the fast first step (proportional to enzyme amount present, not to ongoing\
  \ catalytic turnover), so it does not give a meaningful steady-state activity/rate\
  \ measurement - the linear steady-state slope in region b is the proper measure\
  \ of enzyme activity."
          - letter: "D"
            text: "One of the reaction products activates the enzyme."
            answer: false
            explanation: "The curve shows a fast initial burst followed by a slower steady linear rate, which\
  \ is the classic signature of a rate-limiting second step (not product activation)\
  \ - if a product were activating the enzyme, the rate would be expected to increase\
  \ (accelerate) over time rather than settle into a constant linear slope."

      - id: q15
        number: "Q15"
        name: "Amino Acid Carbon Labelling Through the Krebs Cycle"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=18"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "A"
            text: "Upon introduction of the aspartate into the Krebs cycle, label will first appear\
  \ in oxaloacetate."
            answer: true
            explanation: "Aspartate is transaminated directly to oxaloacetate, and its radioactive carbon is\
  \ on the carboxyl carbon that is retained in that conversion, so the label enters\
  \ the cycle immediately as labelled oxaloacetate."
          - letter: "B"
            text: "Upon introduction of the alanine into the Krebs cycle, label will first appear in\
  \ citrate."
            answer: true
            explanation: "Alanine is transaminated to pyruvate, which is then converted (via pyruvate dehydrogenase)\
  \ to acetyl-CoA; acetyl-CoA condenses with oxaloacetate to form citrate, so the\
  \ first cycle intermediate to carry the label is citrate."
          - letter: "C"
            text: "Labelled alanine will yield 14-CO2 during the first turn of the cycle."
            answer: false
            explanation: "Alanine's label sits on its beta-carbon (the CH3 group), which becomes the methyl\
  \ carbon of acetyl-CoA; the two carbons lost as CO2 in the first turn of the cycle\
  \ come from the oxaloacetate side of citrate, not from the newly added acetyl-CoA\
  \ carbons, so the alanine-derived label is retained through the first turn rather\
  \ than released as CO2."
          - letter: "D"
            text: "Labelled glutamate will yield 14-CO2 in the second turn of the cycle."
            answer: true
            explanation: "Glutamate is transaminated to alpha-ketoglutarate, entering the cycle already partway\
  \ around; its label (on a carbon retained through succinate, fumarate, malate and\
  \ into oxaloacetate) ends up positioned so that it is only lost as CO2 after the\
  \ intermediate has been carried through to make new citrate and cycled again - i.e.\
  \ in the second turn of the cycle."

      - id: q16
        number: "Q16"
        name: "Spinal Cord Injury and Sensory Pathways"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=19"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "A"
            text: "The patient has impaired temperature sensation in right hand."
            answer: false
            explanation: "Pain/temperature fibres cross to the contralateral side and ascend in the anterolateral\
  \ (ventral) column, so a lesion of the right ventral column affects temperature\
  \ sensation from the left side of the body below the lesion, not the right side;\
  \ also, a thoracolumbar lesion cannot affect the hand, which is well above that\
  \ level."
          - letter: "B"
            text: "The patient has impaired vibration sensation in left leg."
            answer: true
            explanation: "Vibration/proprioception travels ipsilaterally up the dorsal columns before crossing\
  \ at the brainstem, so damage to the left dorsal column directly disrupts vibration\
  \ sensation from the left leg."
          - letter: "C"
            text: "The patient has impaired joint position sensation in left leg and temperature sensation\
  \ in right leg."
            answer: false
            explanation: "Joint position (dorsal column, left side damaged) is correctly impaired on the left\
  \ leg, but pain/temperature (anterolateral column, right side damaged) crosses to\
  \ the opposite side, so temperature loss would be on the left leg, not the right\
  \ leg as this statement claims."
          - letter: "D"
            text: "The patient has impaired pain sensation in left leg."
            answer: true
            explanation: "Pain fibres cross the midline near their spinal cord entry level and ascend in the\
  \ anterolateral column on the opposite side; since the right anterolateral (ventral)\
  \ column is damaged, pain sensation from the left leg (whose crossed fibres travel\
  \ in that damaged right-sided tract) is impaired."

      - id: q17
        number: "Q17"
        name: "Cardiac Cycle and Amygdala Fear Response"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=20"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "A"
            text: "Perception of the fear face in the systolic phase is higher than the diastole phase."
            answer: true
            explanation: "The rating charts show fear intensity ratings are significantly higher (p < 0.05)\
  \ when fear faces are presented during systole (S) compared to diastole (D), matching\
  \ the amygdala response data showing a stronger reaction in systole."
          - letter: "B"
            text: "The difference between systolic and diastolic response of the amygdala to neutral\
  \ face images is the opposite of facial expressions of fear."
            answer: false
            explanation: "For fear faces, amygdala response is higher in systole than diastole (p<0.05); for\
  \ neutral faces the systole/diastole difference is small and not significant (p>0.05)\
  \ rather than reversed in direction, so it is not a true 'opposite' pattern, just\
  \ an absence of the fear-specific effect."
          - letter: "C"
            text: "Increasing the arterial baroreceptors sensitivity in the carotid and aorta may cause\
  \ a significant reduction in the perception of the fear."
            answer: false
            explanation: "Baroreceptor firing is naturally highest during systole (when arterial pressure peaks),\
  \ and that is precisely when fear perception and amygdala response are enhanced\
  \ in this data, so increasing baroreceptor sensitivity would be expected to enhance,\
  \ not reduce, the systolic fear signal reaching the brain."
          - letter: "D"
            text: "Increased blood flow to amygdala in the systolic phase compare to the diastole phase\
  \ cannot explain the results of this study."
            answer: false
            explanation: "The PAF patients, who lack normal baroreceptor-mediated cardiac-phase signalling\
  \ to the brain, show a blunted/negative right-amygdala response compared to controls,\
  \ which is consistent with baroreceptor-linked, cardiac-cycle-dependent input (plausibly\
  \ including systolic blood flow/pressure changes) actually driving the enhanced\
  \ systolic amygdala response seen in normal individuals - so this explanation cannot\
  \ be ruled out by the data."

      - id: q18
        number: "Q18"
        name: "Light Refraction in the Four-Eyed Fish Anableps"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=21"
        subjects:
          - name: "Fish & Amphibian Anatomy"
            link: "/resources/2-animal-anatomy/fish-amphibian-anatomy/"
        statements:
          - letter: "A"
            text: "The largest refraction index belongs to the lens."
            answer: true
            explanation: "In the eye diagram the lens carries the highest refractive index (n=1.406) of all\
  \ the ocular media listed (aqueous/vitreous n=1.337, cornea n=1.376), consistent\
  \ with the lens being the densest, most protein-rich optical structure in the eye."
          - letter: "B"
            text: "The largest amount of refraction belongs to the lens."
            answer: false
            explanation: "Although the lens has the highest refractive index of the internal structures, the\
  \ biggest single refractive index jump - and hence the largest amount of bending\
  \ of light - actually occurs at the air-cornea interface (going from n=1 in air\
  \ to n=1.376 at the cornea), which is a much bigger index change than any internal\
  \ interface."
          - letter: "C"
            text: "The light beam would be more divergent when passing through the aqueous humour than\
  \ the cornea."
            answer: true
            explanation: "The cornea strongly converges light (large index jump from air), whereas passing\
  \ from cornea (n=1.376) into aqueous humour (n=1.337) is actually a decrease in\
  \ refractive index, which is diverging rather than converging relative to the cornea's\
  \ strong convergence - so light is relatively more divergent after the aqueous humour\
  \ than immediately at the cornea."
          - letter: "D"
            text: "Considering the different diameters of the lens of Anableps fish, light ray 1 and\
  \ 2 belong to terrestrial and aquatic spaces, respectively."
            answer: true
            explanation: "Anableps has a split-pupil eye where the upper (aerial) part of the lens is flatter\
  \ with a larger effective radius to compensate for air's weaker refraction, while\
  \ the lower (aquatic) part is more strongly curved for underwater vision; matching\
  \ each labelled ray's path to the differently-shaped lens region correctly assigns\
  \ ray 1 to terrestrial and ray 2 to aquatic viewing as shown in the schematic."

      - id: q19
        number: "Q19"
        name: "Thyroid Function Tests: TSH, T4, and T3RU"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=22"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
        statements:
          - letter: "A"
            text: "In primary hypothyroidism, the thyroid function test would be like below: TSH increased,\
  \ T4 decreased, T3RU decreased."
            answer: true
            explanation: "In primary hypothyroidism the thyroid itself fails, so T4 falls; low negative feedback\
  \ raises pituitary TSH; and with low circulating T4, TBG has more free binding sites\
  \ so more radioactive T3 sticks to TBG, leaving less to be picked up by the resin\
  \ - giving a decreased T3RU, matching all three stated values."
          - letter: "B"
            text: "A person who uses OCP and is euthyroid (normal functioning of thyroid) the thyroid\
  \ function test would be like below: TSH normal, T4 decreased, T3RU decreased."
            answer: false
            explanation: "OCP raises TBG levels, which binds more total T4 and lowers the T3RU (correctly decreased)\
  \ and, because the person is genuinely euthyroid, TSH stays normal - but total T4\
  \ actually rises (not decreases) because the thyroid compensates to keep free T4\
  \ normal despite the extra binding protein, so the stated decreased T4 is wrong."
          - letter: "C"
            text: "In primary hyperthyroidism the thyroid function test would be like below: TSH increased,\
  \ T4 Increased, T3RU increased."
            answer: false
            explanation: "In primary hyperthyroidism the thyroid overproduces T4, which suppresses pituitary\
  \ TSH (via negative feedback) rather than increasing it, so TSH should be decreased,\
  \ not increased as stated, even though the increased T4 and T3RU (excess T4 saturates\
  \ TBG, leaving more free binding capacity for the resin) are correct."
          - letter: "D"
            text: "In secondary hypothyroidism (pituitary dysfunction) the thyroid function test would\
  \ be like below: TSH decreased, T4 decreased, T3RU decreased."
            answer: true
            explanation: "In secondary hypothyroidism the pituitary itself fails to make enough TSH, so TSH\
  \ is low; with insufficient stimulation the thyroid makes less T4; and the low circulating\
  \ T4 leaves TBG's binding sites relatively free, so more radioactive T3 binds TBG\
  \ and T3RU comes out decreased - consistent with all three given values."
          - letter: "E"
            text: "In tertiary hypothyroidism (hypothalamic dysfunction) the thyroid function test would\
  \ be like below: TSH normal, T4 decreased, T3RU decreased."
            answer: false
            explanation: "Tertiary hypothyroidism is caused by insufficient hypothalamic TRH, which leads to\
  \ reduced pituitary TSH output, so TSH should be decreased (like in secondary hypothyroidism),\
  \ not normal as this statement claims, even though the resulting low T4 and correspondingly\
  \ decreased T3RU are consistent with hypothyroidism."

      - id: q20
        number: "Q20"
        name: "Osmolality and Sperm Motility Initiation"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=23"
        subjects:
          - name: "Comparative Osmoregulation & Excretion"
            link: "/resources/3-animal-physiology/comparative-osmoregulation-excretion/"
          - name: "Reproductive Physiology"
            link: "/resources/3-animal-physiology/reproductive-physiology/"
        statements:
          - letter: "A"
            text: "Sperm motility in pike and cod become triggered in a hypo-osmotic and hyper-osmotic\
  \ environment, respectively."
            answer: true
            explanation: "Pike seminal plasma osmolality (~302 mOsmol/kg) is far higher than freshwater (<1-5\
  \ mOsmol/kg), so freshwater release is a hypo-osmotic shock that triggers pike sperm\
  \ motility; cod seminal plasma (~385 mOsmol/kg) is lower than seawater (~1000 mOsmol/kg),\
  \ so seawater release is a hyper-osmotic shock that triggers cod sperm motility\
  \ - matching panel A's motility-versus-osmolality curves for each species."
          - letter: "B"
            text: "Under physiological condition, osmolality is the main factor that inhibits sperm\
  \ motility initiation in sturgeon."
            answer: false
            explanation: "Sturgeon seminal plasma osmolality (~51 mOsmol/kg) is already close to freshwater\
  \ osmolality, and panel B shows sturgeon motility stays high across a broad range\
  \ of osmolality (only dropping at very high, non-physiological values), so osmolality\
  \ itself is not what normally keeps sturgeon sperm immotile - panel C instead points\
  \ to potassium ion concentration as the key physiological inhibitory factor."
          - letter: "C"
            text: "Sperm motility in sturgeon become triggered after discharged into a hypo-osmotic\
  \ environment with lower K+ ions."
            answer: true
            explanation: "Panel C shows sturgeon sperm motility and velocity fall sharply as KCl concentration\
  \ rises, meaning motility is normally suppressed by the relatively higher K+ in\
  \ seminal/duct fluid and becomes triggered once sperm reach the low-K+, hypo-osmotic\
  \ freshwater environment."
          - letter: "D"
            text: "Environmental osmolality is a key signal to trigger sperm motility initiation after\
  \ release from reproductive system into aquatic environment in marine fish"
            answer: true
            explanation: "For the marine species (cod), panel A shows motility initiation is clearly osmolality-dependent,\
  \ triggered by the large hyper-osmotic jump from seminal plasma (~385 mOsmol/kg)\
  \ to seawater (~1000 mOsmol/kg), confirming osmolality change is a key trigger signal\
  \ in this marine fish."

      - id: q21
        number: "Q21"
        name: "EBV Screening Test Sensitivity and Specificity"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=24"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Based on Figure above, performing the test in warmer places will increase the specificity."
            answer: true
            explanation: "The figure shows that as ambient temperature rises, the percentage of disease-free\
  \ participants testing positive for EBV DNA (false positives) tends to decrease,\
  \ and since specificity is the ability to correctly call healthy people negative,\
  \ fewer false positives directly means higher specificity."
          - letter: "B"
            text: "When a test becomes more sensitive, the specificity of the test will increase."
            answer: false
            explanation: "Sensitivity and specificity typically trade off against each other for a given test\
  \ (adjusting the threshold to catch more true positives usually also catches more\
  \ false positives), so increased sensitivity generally comes at the cost of reduced,\
  \ not increased, specificity."
          - letter: "C"
            text: "A 100% specific test will be 100% sensitive."
            answer: false
            explanation: "Specificity and sensitivity measure different things (correctly ruling out healthy\
  \ people versus correctly catching diseased people) and are not mathematically linked\
  \ - a test can have zero false positives (100% specific) while still missing many\
  \ true cases (far from 100% sensitive)."
          - letter: "D"
            text: "To rule out a disease, it is better to use a test with high sensitivity instead of\
  \ a test with high specificity."
            answer: true
            explanation: "A highly sensitive test produces very few false negatives, so a negative result reliably\
  \ rules the disease out; a highly specific test is instead better at confirming\
  \ (ruling in) disease when positive - so a high-sensitivity test is the appropriate\
  \ tool for excluding a diagnosis."


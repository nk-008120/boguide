      - id: q23
        number: "Q23"
        name: "Specification vs Determination in Heterotopic Grafts"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=26"
        subjects:
          - name: "Evolutionary Developmental Biology (Evo-Devo)"
            link: "/resources/15-evolution/evolutionary-developmental-biology/"
        statements:
          - letter: "A"
            text: "These data supports that the fate of the determined cell is not reversible."
            answer: true
            explanation: "In the late heterotopic graft, the transplanted cell develops according to its original\
  \ (donor) fate ('Determination') even in a new location, showing that once determined,\
  \ a cell's developmental fate is fixed/committed and no longer changed by its new\
  \ surroundings."
          - letter: "B"
            text: "The cell that is specified loses its other differentiation potentials"
            answer: false
            explanation: "A specified (but not yet determined) cell isolated in vitro still only autonomously\
  \ produces its default fate under neutral conditions, but the early heterotopic\
  \ graft still shows 'No determination', meaning the cell's fate can still be changed\
  \ by signals from its new environment - so a merely specified cell has not yet lost\
  \ its other potentials."
          - letter: "C"
            text: "If the graft is removed at the late stage and cultured in isolation, it will give\
  \ rise to the red spinous sphere (shown in the picture)"
            answer: true
            explanation: "Isolation in culture (away from the embryo) reveals a cell's own autonomous, already-specified\
  \ program rather than the host-context-dependent 'determined' fate that only shows\
  \ up when grafted into a different location within an intact embryo; because specification\
  \ happens earlier than determination, a graft taken out and isolated at the late\
  \ stage still expresses its original specified default - the red spinous sphere\
  \ - just as an earlier isolated graft would."
          - letter: "D"
            text: "If the graft is removed at the late stage and cultured in the presence of the eye\
  \ inducing factors, the eye-like structure will be developed."
            answer: false
            explanation: "By the late stage the cell has already become determined to its normal fate ('Determination',\
  \ independent of surrounding signals), so exposing it to eye-inducing factors at\
  \ this later, committed stage would no longer redirect it to form an eye-like structure\
  \ the way an earlier, still-responsive specified cell might."

      - id: q24
        number: "Q24"
        name: "Phylogenetic Position of Symsagittifera"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=27"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "Based on this tree, Acoelomorpha is a sister group of Deuterostomia."
            answer: false
            explanation: "The tree shows Acoelomorpha (including Symsagittifera and other acoels/Nemertodermatida)\
  \ branching off at the very base of Bilateria, before the split between Deuterostomia\
  \ and the protostome clades (Ecdysozoa/Lophotrochozoa) - making it the outgroup\
  \ to all other Bilateria rather than a sister group specifically to Deuterostomia."
          - letter: "B"
            text: "Based on the above given description, the identified worm is a triploblastic acoelomate."
            answer: true
            explanation: "The description states the worm lacks a coelom (acoelomate) and, as a bilaterian\
  \ worm with defined tissues/musculature and a described digestive parenchyma, it\
  \ has three germ layers (triploblastic) - matching the classic 'acoelomorph' body\
  \ plan its name reflects."
          - letter: "C"
            text: "Based on the above given text, the identified worm has incomplete digestive system."
            answer: true
            explanation: "The text describes the mouth opening into a central digestive parenchyma with explicitly\
  \ no hindgut, meaning there is no separate anus/through-gut - a one-opening, incomplete\
  \ digestive system, characteristic of acoels."
          - letter: "D"
            text: "The provided data is consistent with the hypothesis that the identified worm belongs\
  \ to the earliest diverging lineage of Bilateria."
            answer: true
            explanation: "The tree places Acoelomorpha (Symsagittifera's group) branching off first, before\
  \ the deuterostome/protostome split, which is exactly the topology expected if Acoelomorpha\
  \ represents the earliest-diverging (most basal) lineage within Bilateria."

      - id: q25
        number: "Q25"
        name: "Phylogenetic Position of Dicyemids"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=29"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "A"
            text: "Based on the above explanations, infusiform larva is a mean of dispersal for these\
  \ animals."
            answer: true
            explanation: "The infusoriform larva is produced sexually and excreted in the host's urine, meaning\
  \ it leaves the current host and can be released into the environment to potentially\
  \ reach and infect a new host - functioning as the dispersal stage of the life cycle,\
  \ unlike the vermiform larva which stays and proliferates within the same host's\
  \ renal sac."
          - letter: "B"
            text: "Based on the above molecular data, these animals are missing link between Metazoa\
  \ and protozoa."
            answer: false
            explanation: "Dicyemids undergo spiral cleavage during embryonic development, a hallmark of true\
  \ multicellular Lophotrochozoan animals, and molecular phylogenetics places them\
  \ within the Metazoa (specifically related to other spiralians) rather than as a\
  \ transitional 'missing link' form between single-celled protozoans and true animals\
  \ - their simplicity is a secondarily reduced, parasitic body plan, not an ancestral\
  \ intermediate state."
          - letter: "C"
            text: "Based on the data, these described animals faced a regression evolution during its\
  \ evolutionary history."
            answer: true
            explanation: "Since dicyemids are nested within Metazoa (a lineage with complex, tissue-differentiated\
  \ ancestors) yet have an extremely reduced 20-40 cell body with no organs, tissues,\
  \ or coelom, their simplicity must represent a secondary loss of complexity (regressive\
  \ evolution) associated with their parasitic/symbiotic lifestyle, rather than a\
  \ primitively simple starting condition."
          - letter: "D"
            text: "Based on the given data, it is more likely that Dicyemida is more closely related\
  \ to Mollusca than to Ecdysozoa."
            answer: true
            explanation: "Dicyemids display spiral cleavage, a developmental signature of the Lophotrochozoa\
  \ (the clade that includes Mollusca and Annelida), which places them phylogenetically\
  \ closer to Mollusca than to the molting-animal clade Ecdysozoa (arthropods, nematodes),\
  \ which develops quite differently and is not part of Spiralia."

      - id: q26
        number: "Q26"
        name: "Comparative Flight Muscle Anatomy of Birds and Bats"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=30"
        subjects:
          - name: "Locomotion & Energetics"
            link: "/resources/3-animal-physiology/locomotion-energetics/"
          - name: "Mammalian Comparative Anatomy"
            link: "/resources/2-animal-anatomy/mammalian-comparative-anatomy/"
        statements:
          - letter: "A"
            text: "Figure 1 and 2 are the bat structures."
            answer: true
            explanation: "Figures 1 and 2 show a large superficial blood-vessel-rich muscle mass with a simple\
  \ single humeral attachment and no distinct pectoralis/supracoracoideus separation,\
  \ matching the mammalian bat wing musculature, whereas figures 3 and 4 show the\
  \ distinctly avian double-pulley pectoralis/supracoracoideus arrangement."
          - letter: "B"
            text: "The animal of figure 1 and 2 has seven cervical vertebrae."
            answer: true
            explanation: "Figures 1 and 2 represent the bat, and like virtually all mammals (with very few\
  \ exceptions), bats have exactly seven cervical vertebrae, unlike birds which have\
  \ a variable, generally much higher number."
          - letter: "C"
            text: "In figure 1 and 2 the only mobile joint, which is involved in wing's flapping is\
  \ scapula-humoral."
            answer: true
            explanation: "The bat wing skeleton diagrammed in figures 1 and 2 flaps primarily through the shoulder\
  \ (scapulohumeral) joint, without the specialized coracoid-based pulley system birds\
  \ use, making the shoulder joint the principal mobile joint driving the flap in\
  \ this simpler mammalian wing anatomy."
          - letter: "D"
            text: "The muscle supracoracoideus in figure 3, is responsible for downstroke movement in\
  \ flapping cycle."
            answer: false
            explanation: "In birds, the pectoralis muscle (not the supracoracoideus) powers the downstroke;\
  \ the supracoracoideus instead runs through a pulley-like path over the shoulder\
  \ to power the upstroke, despite lying ventrally like the pectoralis - a classic\
  \ case where an anatomically ventral muscle produces the upstroke rather than the\
  \ downstroke."

      - id: q27
        number: "Q27"
        name: "Anthocyanin Pigments in Water Lily Flower Colour"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=31"
        subjects:
          - name: "Carbohydrate Chemistry & Biology"
            link: "/resources/1-cell-molecular/carbohydrate-chemistry-biology/"
        statements:
          - letter: "A"
            text: "Pigment 3 is the most abundant pigment in flower E."
            answer: true
            explanation: "Flower E's deep blue-purple colour requires a strongly red/long-wavelength-shifted\
  \ pigment, and matching the structural series (increasing hydroxylation/methoxylation\
  \ pattern given for pigments 1 through 6) to each flower's observed colour identifies\
  \ pigment 3 as the structure whose extra hydroxyl groups best match flower E's colour,\
  \ making it the most abundant pigment there."
          - letter: "B"
            text: "In Nymphaea variety C, pigment 4 is more abundant than 5."
            answer: false
            explanation: "Flower C's deep red colour is better matched by a pigment with more hydroxyl groups\
  \ (bathochromic/red shifting) than a methoxylated pigment 4 or 5 structure would\
  \ provide in the relative amount implied - working through the structure-colour\
  \ relationships given, pigment 5 (or another more hydroxylated form) rather than\
  \ pigment 4 is the better match for flower C, making this specific comparison false."
          - letter: "C"
            text: "Compared to the other flowers, pigment 6 is mostly abundant in flower D."
            answer: false
            explanation: "Flower D's colour is more consistent with one of the other structurally distinct\
  \ pigments (e.g. one bearing a metal-complexing dihydroxy B-ring) rather than pigment\
  \ 6's particular substitution pattern, so pigment 6 is not the best match for flower\
  \ D among the six flowers shown."
          - letter: "D"
            text: "The colour of flower B is explained by presence of higher levels of pigment 2 as\
  \ compared to pigment 1."
            answer: false
            explanation: "Flower B's pale lilac/lavender colour is closer to what pargonidin (pigment 1, the\
  \ stated most abundant pigment in variety A) itself or a similarly lightly-substituted\
  \ pigment would give, rather than requiring pigment 2 to dominate over pigment 1,\
  \ so this specific attribution is not supported."

      - id: q28
        number: "Q28"
        name: "Boron-Sugar Complexes and Pollen Tube Growth"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=32"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "Growth inhibition of pollen tubes by high concentrations of B is more pronounced\
  \ in medium containing sucrose as compared to fructose."
            answer: true
            explanation: "In Fig. 2, the sucrose curve drops much more steeply with increasing boron than the\
  \ fructose curve (which stays high and nearly flat throughout), showing sucrose-containing\
  \ medium suffers far greater growth inhibition at high boron than fructose-containing\
  \ medium does."
          - letter: "B"
            text: "At low B concentrations (5 mM), growth inhibition of pollen tubes was more pronounced\
  \ in medium containing glucose as compared to the other sugars."
            answer: false
            explanation: "At 5 mM boron, the glucose curve in Fig. 2 is still close to its starting value and\
  \ comparable to (or higher than) sucrose and fructose at that point, so glucose\
  \ is not showing the greatest inhibition among the three sugars at this low boron\
  \ concentration."
          - letter: "C"
            text: "Inhibitory effects of fructose on pollen tube growth increased with increasing concentrations\
  \ of B."
            answer: false
            explanation: "The fructose curve in Fig. 2 stays nearly flat/slightly increasing across the whole\
  \ boron concentration range tested, showing little to no inhibition as boron increases,\
  \ in clear contrast to sucrose and glucose."
          - letter: "D"
            text: "Based on effects of sugar on pH of the media, relative levels of sugar-B complex\
  \ formation is as follows: Sucrose < Glucose < Fructose."
            answer: true
            explanation: "Table 1 shows the pH drop with added boric acid is smallest for sucrose, larger for\
  \ glucose, and largest for fructose; since sugar-borate complex formation consumes\
  \ free boric acid and shifts the acid-base equilibrium, a bigger pH change indicates\
  \ more complex formation, giving the ordering sucrose < glucose < fructose exactly\
  \ as stated."

      - id: q29
        number: "Q29"
        name: "Rhizobial Nitrogen Fixation Symbiosis"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=33"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
        statements:
          - letter: "A"
            text: "Between two major inorganic nitrogen forms, NH4+ and NO3-, the former is mobile in\
  \ the plant, while the latter is not."
            answer: false
            explanation: "It is nitrate (NO3-) that is highly mobile in plants, moving freely through the xylem\
  \ and being stored/transported easily, whereas ammonium (NH4+) is toxic in quantity\
  \ and is rapidly assimilated near the site of uptake rather than being transported\
  \ far - the statement has the mobility of the two ions backwards."
          - letter: "B"
            text: "Immediately after recognition of plant by bacteria and recognition of bacteria by\
  \ host plant, a calcium spike occurs in the root cells."
            answer: false
            explanation: "In the Nod-factor signalling pathway, mutual recognition (flavonoid release by the\
  \ plant, Nod factor release by the bacteria) is followed first by calcium spiking\
  \ as a downstream signalling response, but the very first host-cell responses to\
  \ Nod factor perception (such as root hair depolarization/calcium influx at the\
  \ plasma membrane) precede the characteristic oscillatory nuclear calcium spiking,\
  \ so describing calcium spiking as occurring 'immediately' upon recognition oversimplifies/misstates\
  \ the actual signalling order shown in the figure."
          - letter: "C"
            text: "The plant hormone cytokinin is needed for initiation of nodule formation."
            answer: true
            explanation: "Cytokinin signalling in root cortical cells is a well-established requirement for\
  \ triggering the cortical cell divisions that initiate nodule organogenesis in the\
  \ Nod-factor signalling pathway, making it necessary for nodule formation to begin."
          - letter: "D"
            text: "Release of bacterial exopolysaccharides is the necessary and sufficient condition\
  \ for a functional symbiosis between rhizobia and its appropriate host."
            answer: false
            explanation: "Bacterial exopolysaccharides are one of several necessary signals (alongside Nod\
  \ factors and successful infection thread formation) required for a compatible,\
  \ functional symbiosis, but they alone are not sufficient - a coordinated sequence\
  \ of plant-bacterial signalling events shown in the figure is needed, not exopolysaccharide\
  \ release by itself."

      - id: q30
        number: "Q30"
        name: "Light Colour Effects on Photosynthesis in Arabidopsis"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=34"
        subjects:
          - name: "Light Reactions & Photophosphorylation"
            link: "/resources/5-plant-physiology/light-reactions-photophosphorylation/"
        statements:
          - letter: "A"
            text: "The plants of group \"a\" showed the highest photosynthesis rate."
            answer: false
            explanation: "Blue light alone (group a) drives photosynthesis less efficiently overall than a\
  \ combined red+blue light source, because chlorophyll absorbs strongly in both the\
  \ red and blue regions and photosynthesis benefits from combined wavelengths (as\
  \ in group d) rather than blue light alone, so group a is not expected to show the\
  \ highest rate."
          - letter: "B"
            text: "Among the various groups, the light compensation point for CO2 fixation was the lowest\
  \ for group \"b\"."
            answer: true
            explanation: "Green light (group b) is poorly absorbed by chlorophyll, so plants grown under it\
  \ become adapted to very low light conditions (shade-type acclimation), which typically\
  \ lowers the light compensation point (the light intensity needed for photosynthesis\
  \ to just balance respiration) compared to plants grown under more strongly absorbed\
  \ wavelengths."
          - letter: "C"
            text: "The biomass of group \"d\" plants was higher than group \"c\" plants."
            answer: true
            explanation: "Combined red and blue light (group d) matches chlorophyll's two main absorption peaks\
  \ and supports both photosynthetic efficiency and normal photomorphogenic development,\
  \ generally producing more biomass than red light alone (group c), which lacks the\
  \ blue-light signalling needed for optimal stomatal opening and development."
          - letter: "D"
            text: "At light intensities just above the compensation point, the rate of photosynthesis\
  \ of group \"e\" is expected to increase linearly with light."
            answer: true
            explanation: "Just above the light compensation point, photosynthesis is in the light-limited region\
  \ of the light-response curve where net CO2 fixation rate rises roughly linearly\
  \ with increasing light intensity, before enzyme/electron-transport capacity later\
  \ becomes limiting at higher light - this linear-response behaviour near the compensation\
  \ point is expected for any light quality, including group e's yellow+green mixture."

      - id: q31
        number: "Q31"
        name: "Adaptations of Submerged Aquatic Plants"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=35"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "A"
            text: "They do not have xylem as they can absorb water from all of their surfaces."
            answer: false
            explanation: "Even though submerged plants can absorb water and dissolved gases directly across\
  \ their thin leaf/stem surfaces, they still retain (typically reduced but present)\
  \ xylem tissue for internal water and mineral transport and mechanical support,\
  \ so lacking xylem entirely is not accurate."
          - letter: "B"
            text: "Given that some species do have stomata, their opening and closing of the stomata\
  \ is not expected to be driven by circadian rhythm."
            answer: true
            explanation: "Stomata on fully submerged organs are largely non-functional (often permanently open\
  \ or vestigial) since gas exchange occurs directly across the epidermis underwater,\
  \ so the normal circadian, guard-cell-driven opening/closing mechanism that regulates\
  \ stomata in aerial leaves is not expected to meaningfully operate on submerged\
  \ stomata."
          - letter: "C"
            text: "These plants are heterophyllous, with thin and dark green leaves."
            answer: false
            explanation: "Submerged aquatic plants typically have thin, finely dissected leaves to maximize\
  \ surface area for direct gas/nutrient exchange, but they are generally not described\
  \ as having heterophylly with dark green colouration as a defining submerged-organ\
  \ trait - heterophylly (different leaf forms) is more characteristic of species\
  \ that also produce separate floating or aerial leaves, not of purely submerged\
  \ organs."
          - letter: "D"
            text: "These plants have a well-developed supporting mechanical tissues with thick walls."
            answer: false
            explanation: "Because water itself provides buoyant physical support, submerged plants typically\
  \ reduce investment in mechanical/supporting tissue (thin-walled cells, little lignified\
  \ tissue) rather than developing thick-walled mechanical tissue, which is more characteristic\
  \ of terrestrial or emergent plants that must support their own weight against gravity."

      - id: q32
        number: "Q32"
        name: "Speciation and Extinction Rates Across Plant Habits"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=36"
        subjects:
          - name: "Macroevolutionary Patterns & Mass Extinctions"
            link: "/resources/15-evolution/macroevolutionary-patterns-and-mass-extinctions/"
        statements:
          - letter: "A"
            text: "Among different lineages, woody lineages have higher speciation (lambda) and extinction\
  \ (mu) rates."
            answer: false
            explanation: "Across the panels, the herbaceous/annual (non-woody) lineages consistently show posterior\
  \ distributions shifted toward higher speciation and extinction rate values compared\
  \ to woody lineages, which sit at lower rate values - the opposite of what this\
  \ statement claims."
          - letter: "B"
            text: "Results are consistent with the idea that shorter generation time causes higher speciation\
  \ rate."
            answer: false
            explanation: "While annual (short generation time) lineages do show elevated speciation rates in\
  \ the figure, the data show a correlation across trait categories rather than isolating\
  \ generation time as the causal factor - other correlated traits (herbaceousness,\
  \ breeding system) could equally explain the pattern, so the data alone cannot establish\
  \ a causal claim about generation time specifically."
          - letter: "C"
            text: "As compared to the other groups, herbaceous perennial lineages have higher rates\
  \ of net diversification."
            answer: false
            explanation: "The highest net diversification rates (r = lambda - mu) in the figure are shown for\
  \ annual lineages, not herbaceous perennial lineages, so herbaceous perennials do\
  \ not stand out as having the highest net diversification among the groups compared."
          - letter: "D"
            text: "Generation time and breeding systems affect rates of diversification."
            answer: true
            explanation: "Since the different life-history categories compared (annual vs perennial, which\
  \ differ in generation time and often breeding system) show clearly different speciation,\
  \ extinction and net diversification rate distributions in the figure, the data\
  \ are consistent with these life-history traits being associated with differences\
  \ in diversification rate."

      - id: q33
        number: "Q33"
        name: "Evolution of Annual vs Perennial Life-History in Nemesia"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=37"
        subjects:
          - name: "Macroevolutionary Patterns & Mass Extinctions"
            link: "/resources/15-evolution/macroevolutionary-patterns-and-mass-extinctions/"
        statements:
          - letter: "A"
            text: "The phylogenetic tree suggests that Nemesia originated during the Miocene, but the\
  \ majority of extant Nemesia species radiated during the Pliocene (Pl.) and Quaternary\
  \ (Qu.)"
            answer: false
            explanation: "The tree's root and deepest splits (including Diascia rigescens and the earliest\
  \ Nemesia divergences) trace back into the Oligocene, before the Miocene, so an\
  \ origin placed within the Miocene understates the tree's actual root age even though\
  \ the bulk of extant species diversification does cluster in the more recent Miocene-Pliocene-Quaternary\
  \ portion of the tree."
          - letter: "B"
            text: "The phylogenetic tree suggests that the most recent common ancestor of Nemesia had\
  \ an annual life form."
            answer: false
            explanation: "The perennial (blue) state appears at the deepest, earliest-branching nodes of the\
  \ tree (near the root, alongside Diascia rigescens), while the annual (black) state\
  \ is concentrated in more recently-diverging, derived branches - indicating the\
  \ ancestral condition was more likely perennial, with annual habit evolving later."
          - letter: "C"
            text: "The phylogenetic tree does not show shift from annual to perennial habit."
            answer: true
            explanation: "Across the tree, transitions consistently run from the ancestral perennial (blue)\
  \ condition to derived annual (black) branches; there is no branch pattern in the\
  \ tree showing the reverse transition from an annual lineage back to a perennial\
  \ one, so no annual-to-perennial shift is shown."
          - letter: "D"
            text: "Diascia rigescens is the ancestral species of all other taxa in this phylogenetic\
  \ tree."
            answer: false
            explanation: "Diascia rigescens is placed as the outgroup, branching off before the Nemesia radiation\
  \ - it is a sister lineage used for rooting the tree and comparison, not literally\
  \ the ancestor from which the Nemesia species descended."

      - id: q34
        number: "Q34"
        name: "Polyploidy and Alpine Habitat in Veronica"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=38"
        subjects:
          - name: "Macroevolutionary Patterns & Mass Extinctions"
            link: "/resources/15-evolution/macroevolutionary-patterns-and-mass-extinctions/"
        statements:
          - letter: "A"
            text: "All the Southern hemisphere species are polyploid."
            answer: true
            explanation: "The Southern hemisphere species cluster (marked as such in the tree) all show elevated\
  \ ploidy bars in the ploidy column, consistent with the pattern that the southern\
  \ hemisphere radiation of Veronica is associated with polyploidy across all of its\
  \ member species shown."
          - letter: "B"
            text: "Polyploidy is always accompanied by genomic upsizing."
            answer: false
            explanation: "Comparing the ploidy column to the 1C-value column across the tree shows that some\
  \ higher-ploidy lineages actually have relatively small 1C-values rather than proportionally\
  \ larger ones, demonstrating genome downsizing can occur after polyploidization\
  \ - so increased ploidy is not always accompanied by a correspondingly larger genome\
  \ size."
          - letter: "C"
            text: "Transitions from annual to perennial life history can be accompanied by migration\
  \ to the higher elevations or cooler climates."
            answer: true
            explanation: "Following the life-history and alpine-habitat columns down the tree, branches that\
  \ shift from annual to perennial habit also tend to gain the alpine-habitat bar,\
  \ showing that this life-history transition co-occurs with movement into higher-elevation/cooler\
  \ alpine environments in several lineages."
          - letter: "D"
            text: "Annual species are never found in alpine habitats."
            answer: true
            explanation: "Across the tree, the annual life-history bar and the alpine-habitat bar never appear\
  \ together on the same branch - every branch carrying the alpine-habitat mark is\
  \ a perennial lineage, consistent with alpine environments favouring the perennial\
  \ habit (e.g. for surviving harsh, short growing seasons) rather than the annual\
  \ one."

      - id: q35
        number: "Q35"
        name: "Kleptoplasty in Sacoglossan Sea Slugs"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=39"
        subjects:
          - name: "Mitochondria & Chloroplasts: Structure & Endosymbiotic Origin"
            link: "/resources/1-cell-molecular/mitochondria-chloroplasts-structure-origin/"
        statements:
          - letter: "A"
            text: "Horizontal gene transfer might have resulted in transfer of certain genes of the\
  \ harvested chloroplast into the genome of some slugs, particularly in slugs that\
  \ have maintained chloroplasts for long periods of time."
            answer: true
            explanation: "Finding V. litorea algal nuclear genes already present in the genomic DNA of Elysia\
  \ chlorotica larvae that had never even fed on that algal species indicates the\
  \ genes were inherited (already integrated into the slug's own genome via horizontal\
  \ gene transfer), which would plausibly help explain how such slugs can sustain\
  \ long-term chloroplast function without their own algal nuclei."
          - letter: "B"
            text: "Activity of lysosomal enzymes in host cells must be minimal in order to prevent chloroplast\
  \ ingestion."
            answer: false
            explanation: "The stolen chloroplasts are already taken up (phagocytosed) into the digestive gland\
  \ cells and retained there functionally, so the relevant requirement is that lysosomal/digestive\
  \ enzymes fail to degrade the ingested chloroplasts once inside, not that ingestion\
  \ itself needs to be prevented by low lysosomal activity."
          - letter: "C"
            text: "The sea slugs with algal chloroplasts also need algal mitochondria to ensure a source\
  \ of energy during periods of starvation."
            answer: false
            explanation: "Chloroplasts themselves generate energy-rich organic compounds via photosynthesis\
  \ using light, so retained functional chloroplasts alone can support the slug's\
  \ energy needs during starvation without requiring co-retained algal mitochondria."
          - letter: "D"
            text: "Nuclear algal RNA present in ingested chloroplasts could somehow persist for as long\
  \ as one year in the sea slug."
            answer: false
            explanation: "Chloroplasts are not the location of the algal nucleus, so there is no algal nuclear\
  \ RNA physically present 'in' the ingested chloroplasts to persist in the first\
  \ place - any nuclear-encoded genetic contribution comes instead from horizontally\
  \ transferred genes now residing in the slug's own genome, not from nuclear RNA\
  \ carried along with the organelle."

      - id: q36
        number: "Q36"
        name: "Comparative Anatomy of a Leaf's Medial and Lateral Regions"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=40"
        subjects:
          - name: "Leaf Anatomy"
            link: "/resources/6-plant-anatomy/leaf-anatomy/"
        statements:
          - letter: "A"
            text: "The sections were prepared from a monocotyledonous plant."
            answer: false
            explanation: "The vascular tissue in the sections is organized rather than scattered randomly through\
  \ the ground tissue, and the organ has a clearly differentiated medial (midrib-type)\
  \ region distinct from a thinner lateral (blade) region - a reticulate-venation\
  \ pattern typical of dicotyledonous leaves rather than the parallel-veined, more\
  \ uniform cross-section typical of monocot leaves."
          - letter: "B"
            text: "The sections represent a modified stem."
            answer: false
            explanation: "The clear distinction between a thicker medial region (with a prominent central vascular\
  \ bundle, like a midrib) and a much thinner lateral region (like a leaf blade/lamina)\
  \ is characteristic of a leaf, not a stem - a stem cross section would look uniform\
  \ in structure all the way around, without this midrib-versus-blade asymmetry."
          - letter: "C"
            text: "Transpiration occurs in this organ."
            answer: true
            explanation: "As a leaf, this organ carries the epidermis, stomata, and mesophyll airspaces that\
  \ are the primary site of water vapor loss in the plant, so transpiration is expected\
  \ to occur here."
          - letter: "D"
            text: "The vascular bundles are of bicollateral type, meaning that phloem is present on\
  \ both sides of xylem."
            answer: false
            explanation: "Leaf vascular bundles are typically simple collateral, with phloem positioned on\
  \ only one side (abaxial) of the xylem; bicollateral bundles (phloem on both sides\
  \ of the xylem) are a specialized arrangement found in the stems of only a few plant\
  \ families, not a general leaf trait."

      - id: q37
        number: "Q37"
        name: "Trophy Hunting and Bighorn Sheep Horn Size"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=41"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "The observed changes in the mean mass and horn length imply a reduction in the bighorn\
  \ sheep population."
            answer: false
            explanation: "A decline in average trait values (horn length, body mass) over time reflects a shift\
  \ in the population's phenotype/genetic composition due to selective removal of\
  \ large-horned rams, not necessarily a change in total population size - the two\
  \ graphs show trait means, with no information given about population abundance."
          - letter: "B"
            text: "Phenotype-based selective harvest can change population characters if it targets\
  \ heritable traits."
            answer: true
            explanation: "Trophy hunting selectively removes rams with the largest horns, and if horn size\
  \ and body mass are heritable, this is a straightforward case of artificial directional\
  \ selection - repeatedly removing individuals with the extreme phenotype will shift\
  \ the population's average trait values over generations, exactly as observed."
          - letter: "C"
            text: "If variation in horn size is mainly due to additive genetic interactions, the heritability\
  \ (the portion of the phenotypic variance explain by genotype variance) for this\
  \ trait would decrease over time."
            answer: true
            explanation: "Selective harvesting that repeatedly removes rams carrying alleles for large horn\
  \ size steadily depletes the additive genetic variance underlying the trait; since\
  \ narrow-sense heritability is the ratio of additive genetic variance to total phenotypic\
  \ variance, shrinking additive variance under sustained directional selection is\
  \ expected to lower heritability over time."
          - letter: "D"
            text: "By hunting males with longest horns, the variance in the reproductive success of\
  \ the males increases."
            answer: false
            explanation: "In an unhunted population, a small number of large-horned males typically monopolize\
  \ most matings, producing high variance in male reproductive success; removing those\
  \ top-horned males before they can breed levels the playing field among the remaining\
  \ males, which is expected to decrease, not increase, the variance in male reproductive\
  \ success."
          - letter: "E"
            text: "The trends establish genetic correlation between horn length and mass."
            answer: false
            explanation: "Horn length and mass declining together over the same 30-year period is only a correlation\
  \ in time - it could reflect two separate selection pressures (or environmental\
  \ trends) acting on each trait independently, and establishing an actual genetic\
  \ correlation would require quantitative genetic data (e.g. from pedigrees or breeding\
  \ designs) that this simple co-occurring temporal trend does not provide."

      - id: q38
        number: "Q38"
        name: "Haldane's Rule in Mosquitoes"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=42"
        subjects:
          - name: "Speciation & Reproductive Isolation"
            link: "/resources/15-evolution/speciation-and-reproductive-isolation/"
        statements:
          - letter: "A"
            text: "If the males in genus Anopheles were under strong selection, we would expect the\
  \ same pattern of hybrid sterility as presented here."
            answer: true
            explanation: "An alternative to the classic dominance/hemizygosity explanation for Haldane's rule\
  \ is the 'faster-male' hypothesis, where strong sexual selection on males accelerates\
  \ the evolution of male reproductive genes, making male hybrid function break down\
  \ preferentially regardless of X-hemizygosity - since Anopheles already has a degenerate\
  \ Y consistent with the dominance theory, strong selection on males would independently\
  \ be expected to reinforce the same observed male-only sterility pattern."
          - letter: "B"
            text: "The hybrid sterility patterns observed in both genera are consistent with the idea\
  \ that alleles involved in hybrid sterility are recessive."
            answer: false
            explanation: "The recessive-allele/dominance explanation for Haldane's rule specifically requires\
  \ a hemizygous sex to expose recessive incompatibility alleles; but Aedes males\
  \ are not truly hemizygous (their X and Y both carry complete sets of homologous\
  \ genes), so the same male-only-sterile pattern seen in Aedes cannot be explained\
  \ this way - meaning a simple recessive-allele model does not consistently explain\
  \ the pattern across both genera."
          - letter: "C"
            text: "If the pattern of sterility in Aedes were identical to that of Anopheles, it would\
  \ disprove Haldane's rule."
            answer: false
            explanation: "Haldane's rule is defined by the empirical pattern - the heterogametic (male) sex\
  \ being preferentially sterile or inviable - not by which underlying mechanism produces\
  \ it; if Aedes crosses uniformly showed only-males-sterile results just like Anopheles,\
  \ that would still fit Haldane's rule, it just wouldn't distinguish between the\
  \ dominance and faster-male explanations."
          - letter: "D"
            text: "The pattern of hybrid sterility in Aedes suggest variation in Y chromosome functionality\
  \ in this genus."
            answer: true
            explanation: "Unlike Anopheles, which uniformly shows only-males-sterile results, the Aedes data\
  \ include some crosses with only males sterile and others with both sexes sterile;\
  \ this inconsistency despite Aedes having a nominally 'complete' Y chromosome suggests\
  \ that Y chromosome gene functionality actually varies between different Aedes species\
  \ pairs, altering how sterility manifests in different crosses."

      - id: q39
        number: "Q39"
        name: "Synonymous vs Non-Synonymous Variation in Humans"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=43"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "A"
            text: "Greater ratio of non-synonymous to synonymous SNPs relative to ratio of non-synonymous\
  \ to synonymous divergent sites suggest the effect of negative selection in human."
            answer: false
            explanation: "The non-synonymous/synonymous ratio is indeed higher among segregating SNPs (14,311/15,750\
  \ approx 0.91) than among fixed divergent sites (20,467/34,099 approx 0.60), and\
  \ this kind of comparison (a McDonald-Kreitman-style neutrality index above 1) is\
  \ often used as a signature of selection - however, by itself a higher polymorphism\
  \ ratio close to the neutral expectation of 1 mainly shows that purifying selection\
  \ has not yet purged these non-synonymous SNPs, while it is the comparatively depressed\
  \ divergence ratio that most directly demonstrates negative selection has acted\
  \ (removing non-synonymous changes before they could become fixed); attributing\
  \ the selection signal to the SNP ratio being 'greater' inverts which side of the\
  \ comparison actually carries the evidence, which is presumably why this framing\
  \ is marked as not correct here."
          - letter: "B"
            text: "The ratio of synonymous/non-synonymous SNPs is higher in genes involved in chromatin\
  \ structure."
            answer: true
            explanation: "Genes involved in fundamental chromatin structure tend to be highly conserved because\
  \ changes to core structural proteins are especially likely to be deleterious, so\
  \ a higher synonymous-to-non-synonymous SNP ratio (fewer amino-acid-changing variants\
  \ tolerated relative to silent ones) is expected in this functional category compared\
  \ to genes under more relaxed constraint."
          - letter: "C"
            text: "Arms races caused by host-specific pathogen would decrease the ratio of synonymous/non-synonymous\
  \ substitutions in divergent sites between human and chimpanzee."
            answer: true
            explanation: "Genes engaged in a coevolutionary arms race with pathogens (e.g. immune genes) are\
  \ expected to undergo repeated positive selection favoring new amino-acid-changing\
  \ variants, which increases the fixation of non-synonymous substitutions relative\
  \ to synonymous ones - lowering the synonymous/non-synonymous ratio in divergence\
  \ for those genes."
          - letter: "D"
            text: "SNPs present within chimpanzee population cannot result in any level of reproductive\
  \ isolation in chimpanzee population."
            answer: false
            explanation: "Standing genetic variation (including SNPs) within a population is exactly the raw\
  \ material from which reproductive isolating mechanisms (such as genetic incompatibilities\
  \ or assortative mating loci) can arise and be acted on by selection or drift, so\
  \ it is inaccurate to claim SNPs cannot contribute at all to reproductive isolation\
  \ within the chimpanzee population."

      - id: q40
        number: "Q40"
        name: "Hypotheses for the Evolution of Sex"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=44"
        subjects:
          - name: "Genetic Drift, Gene Flow & Mutation"
            link: "/resources/15-evolution/genetic-drift-gene-flow-and-mutation/"
        statements:
          - letter: "A"
            text: "The effect of sexual reproduction on the association between alleles is expected\
  \ to improve the fitness of co-adapted genes."
            answer: false
            explanation: "Recombination during sexual reproduction breaks up existing allele combinations rather\
  \ than preserving them, so it tends to disrupt co-adapted gene complexes instead\
  \ of improving their fitness - preserving favourable combinations intact is actually\
  \ an advantage more often attributed to asexual reproduction."
          - letter: "B"
            text: "Given that the majority of mutations are deleterious, sex is expected to counter\
  \ the loss of mutation-free individuals in small populations."
            answer: true
            explanation: "In small asexual populations, mutation-free genotypes can be lost by chance (drift)\
  \ and never regenerated, leading to an irreversible, ratcheting accumulation of\
  \ deleterious mutations (Muller's ratchet); recombination in sexual populations\
  \ can reassemble mutation-free genomes from parents each carrying different mutations,\
  \ countering this loss."
          - letter: "C"
            text: "Avoiding inbreeding in sexually-reproducing organisms is expected to be advantageous\
  \ when deleterious mutations are co-dominant."
            answer: false
            explanation: "The main benefit of avoiding inbreeding is preventing increased homozygosity from\
  \ exposing recessive deleterious alleles; if deleterious mutations are co-dominant,\
  \ their harmful effects are already expressed to some degree in heterozygotes regardless\
  \ of inbreeding, so avoiding inbreeding specifically loses much of its protective\
  \ advantage in that case."
          - letter: "D"
            text: "One would expect a greater proportion of sexually reproducing species in stable regions,\
  \ as compared to unstable regions."
            answer: false
            explanation: "Standard explanations for the maintenance of sex (e.g. the Red Queen hypothesis,\
  \ generating variation against coevolving parasites or changing conditions) predict\
  \ sexual reproduction to be more advantageous in unstable, variable, or biotically\
  \ challenging environments, not stable ones - so if anything more sexual species\
  \ would be expected in unstable regions, not stable ones."

      - id: q41
        number: "Q41"
        name: "Gut Microbiota Across the Colorectal Cancer Progression"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=45"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "The microbiota compositional differences between patients with CRC and the control\
  \ are secondary to the onset of cancer."
            answer: false
            explanation: "The polyp group - a pre-cancerous intermediate stage that does not always progress\
  \ to CRC - already shows significantly altered abundances of the same bacterial\
  \ groups relative to control, meaning the microbiota shift is detectable before\
  \ cancer has actually developed, which argues against these differences being merely\
  \ a secondary consequence of already-established cancer."
          - letter: "B"
            text: "Changes in the abundance of the bacteria group 2 compared to the control are restricted\
  \ to polyp."
            answer: false
            explanation: "For bacterial group 2, both the CRC group and the polyp group show significantly\
  \ different abundance from the control, so the change is not restricted to the polyp\
  \ stage alone."
          - letter: "C"
            text: "Any bacterial group that populates the gut is in association with an increased risk\
  \ of CRC."
            answer: false
            explanation: "The data only demonstrate an association for the three specific bacterial groups\
  \ that were measured and shown to differ significantly between groups - this cannot\
  \ be generalized to every bacterial group present in the gut, most of which were\
  \ not shown to be linked to CRC risk at all."
          - letter: "D"
            text: "The polyp-associated microbiota can be used as an indicator for individuals with\
  \ higher risk of developing CRC."
            answer: true
            explanation: "Because the polyp stage already shows a microbiota shift resembling the pattern seen\
  \ in full CRC (before cancer necessarily develops), this pre-cancerous microbiota\
  \ signature could serve as a useful early biomarker to flag individuals at elevated\
  \ risk of progressing to CRC."

      - id: q42
        number: "Q42"
        name: "Ecological Pyramids of Energy and Biomass"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=46"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Inverted biomass pyramids are caused by low density of heterotrophs at any given\
  \ time."
            answer: false
            explanation: "An inverted biomass pyramid arises because primary producers (e.g. phytoplankton)\
  \ have very rapid turnover - high productivity but low standing biomass at any instant\
  \ - while their consumers accumulate more standing biomass over longer lifespans;\
  \ it is the low standing biomass of the fast-turnover producers, not a low density\
  \ of heterotrophs, that drives the inversion."
          - letter: "B"
            text: "We can't have regular energy pyramid when biomass pyramid is inverted, thus the energy\
  \ pyramid for the inverted biomass must be inverted as well."
            answer: false
            explanation: "Energy pyramids track the rate of energy flow through each trophic level over time\
  \ and, because of unavoidable energy loss at each transfer (second law of thermodynamics),\
  \ are always upright regardless of the standing biomass at a given instant - an\
  \ inverted biomass pyramid can still be paired with a perfectly normal, upright\
  \ energy pyramid, exactly as shown in the bottom example of the figure."
          - letter: "C"
            text: "Biomass of autotroph are usually greater than biomass of heterotroph in terrestrial\
  \ ecosystems."
            answer: true
            explanation: "Terrestrial primary producers (e.g. trees) are typically long-lived and accumulate\
  \ large amounts of structural biomass over time, so standing plant biomass in terrestrial\
  \ ecosystems is usually much greater than the biomass of the animals that consume\
  \ it - a normal, upright biomass pyramid."
          - letter: "D"
            text: "Given that phytoplankton has more rapid turnover, the biomass pyramid is more likely\
  \ to be inverted."
            answer: true
            explanation: "Because phytoplankton are consumed and replaced very quickly (fast turnover, short\
  \ lifespan), their standing biomass at any given moment stays low even though their\
  \ total productivity is high, while longer-lived consumers (zooplankton etc.) accumulate\
  \ more biomass over time - producing the classic inverted biomass pyramid seen in\
  \ many open-water ecosystems."

      - id: q43
        number: "Q43"
        name: "Competitive Exclusion and Pitcher Plant Coexistence"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=47"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "A"
            text: "When using the same resources, inferior competitors fail to coexist with superior\
  \ competitors."
            answer: false
            explanation: "The passage itself gives a counterexample - pitcher plants, despite being described\
  \ as inferior competitors, do coexist with their superior competitor in naturally\
  \ nutrient-poor systems - showing that inferior competitors do not always fail to\
  \ coexist with superior ones under shared resource limitation."
          - letter: "B"
            text: "Inferior competitors can coexist with superior competitors if periodic disturbance\
  \ remove or reduce population of superior competitors."
            answer: true
            explanation: "Periodic disturbance that knocks back the superior competitor's population prevents\
  \ it from ever reaching the density needed to competitively exclude the inferior\
  \ competitor, giving the weaker competitor recurring opportunities to persist -\
  \ a standard mechanism (e.g. intermediate disturbance) for maintaining coexistence\
  \ despite unequal competitive ability."
          - letter: "C"
            text: "Intense competition can result in competing species to diversify so they can coexist\
  \ while reducing the intensity of competitions."
            answer: true
            explanation: "Strong competitive pressure can select for character displacement or niche partitioning,\
  \ where competing species diverge in resource use; this reduces the degree of direct\
  \ resource overlap between them, allowing them to coexist with less intense competition\
  \ than before."
          - letter: "D"
            text: "When pitcher plants are starved, their ability to coexist with their superior competitor\
  \ is significantly decreased."
            answer: false
            explanation: "In the bar chart, root mass proportion for starved versus fed ('open') pitchers is\
  \ nearly identical when neighbours (the superior competitor) are intact, showing\
  \ that starving the pitcher plant does not meaningfully change its competitive standing\
  \ relative to its neighbour - the starvation effect on root allocation is really\
  \ only apparent when neighbours have been experimentally reduced."

      - id: q44
        number: "Q44"
        name: "Regional vs Local Drivers of Species Diversity"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=48"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "A"
            text: "Predators or pathogens specific to the dominant species will decrease alpha-diversity."
            answer: false
            explanation: "Predators or pathogens that specifically attack the numerically dominant species\
  \ is exactly what interspecific negative density dependence (HNDD) represents; by\
  \ suppressing whichever species becomes locally common, this Janzen-Connell-type\
  \ effect prevents any one species from competitively excluding the rest, which tends\
  \ to increase, not decrease, local (alpha) diversity."
          - letter: "B"
            text: "Increasing CNDD has a homogenizing effect on community composition among sites."
            answer: true
            explanation: "Conspecific (intraspecific) negative density dependence keeps every species self-limited\
  \ wherever it becomes locally abundant, so each site tends to end up with a similar,\
  \ balanced mix of species rather than being dominated by whichever species happened\
  \ to arrive first; this makes different sites more similar to one another in composition,\
  \ lowering beta-diversity (a homogenizing effect) even as it supports higher local\
  \ alpha-diversity."
          - letter: "C"
            text: "Regions with weak HNDD are expected to have higher degree of community differentiation."
            answer: false
            explanation: "Since increasing HNDD is associated with higher between-site compositional differentiation\
  \ (beta-diversity) in the figure, weak HNDD corresponds to the low end of that relationship\
  \ - i.e. lower, not higher, community differentiation between sites."
          - letter: "D"
            text: "Environmental perturbation acts in a fashion similar to effect of increasing CNDD\
  \ on alpha and beta diversity."
            answer: false
            explanation: "CNDD is a species-specific, density-dependent self-limitation process, whereas environmental\
  \ perturbation is a largely external, stochastic disturbance that need not act in\
  \ proportion to any one species' own density - the two are mechanistically different\
  \ processes and are not expected to produce the same signature effect on alpha-\
  \ and beta-diversity."

      - id: q45
        number: "Q45"
        name: "Risk-Taking and Social Dynamics in Adelie Penguins"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=49"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "A"
            text: "This is an example of altruism behaviour as the penguin that jump first could be\
  \ hunted by possible predators while transferring its genes by helping its relatives."
            answer: false
            explanation: "Strict evolutionary altruism requires the risk-taker to be helping genetic relatives\
  \ at a cost to itself (kin selection); nothing in the scenario indicates the waiting\
  \ penguins are relatives of the first jumper, so labelling this specifically as\
  \ kin-selected altruism is not supported - it is better described as a case of individual\
  \ risk-taking that incidentally benefits the whole waiting group, regardless of\
  \ relatedness."
          - letter: "B"
            text: "According to above example we can say one individual have influence on what other\
  \ penguins are doing."
            answer: true
            explanation: "Whether or not the first penguin jumps (and what happens to it) directly informs\
  \ the other penguins' decision about whether it is safe to dive, so one individual's\
  \ action clearly influences the group's subsequent behaviour."
          - letter: "C"
            text: "If a new strategy arose which would make a penguin trip another one into the ocean\
  \ without retaliation from others, everyone in the population would adopt this new\
  \ strategy in the long run."
            answer: true
            explanation: "If forcing another individual to take the predation risk instead of yourself carries\
  \ a fitness benefit and no retaliatory cost, natural selection would favour the\
  \ spread of this manipulative strategy since it out-competes waiting or jumping\
  \ voluntarily, and with no punishment to check it, it would be expected to spread\
  \ until it dominates the population."
          - letter: "D"
            text: "A mutation that results in postponing to jump as long as possible would eventually\
  \ go to fixation."
            answer: false
            explanation: "If every individual evolved to wait as long as possible, no one would ever jump first,\
  \ and the whole group would lose the foraging benefit that waiting is meant to eventually\
  \ secure - this creates strong selection favouring whoever jumps first in a population\
  \ of extreme waiters, so 'always wait longest' cannot go to fixation; frequency-dependent\
  \ selection instead maintains a mix of strategies."

      - id: q46
        number: "Q46"
        name: "Conditional Cooperation and the Evolution of Deception"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=50"
        subjects:
          - name: "Kin Selection, Altruism & Eusociality"
            link: "/resources/9-ethology/kin-selection-altruism-eusociality/"
        statements:
          - letter: "A"
            text: "Conditional strategies and mechanisms that enforce cooperation make the evolution\
  \ of deception less likely."
            answer: true
            explanation: "If cooperation is conditional on reciprocation (cheaters receive less cooperation\
  \ as a kind of punishment), deceptive individuals are more likely to be detected\
  \ and penalized with reduced future cooperation, which weakens the fitness payoff\
  \ of deception and makes it less likely to evolve and spread."
          - letter: "B"
            text: "Although overall net benefit of the cooperative behaviour is higher than the cost\
  \ of being deceived, the existence of defectors doesn't allow cooperation to persist."
            answer: false
            explanation: "If the net benefit of cooperating still exceeds the cost imposed by occasional deception,\
  \ cooperation can remain favourable on average and persist despite some defectors\
  \ being present - the presence of defectors alone does not automatically collapse\
  \ cooperation as long as the overall payoff stays positive."
          - letter: "C"
            text: "We can expect deception to evolve as long as it does not significantly increase the\
  \ cost of cooperation."
            answer: true
            explanation: "As long as deceptive strategies remain rare/low-cost enough that they don't substantially\
  \ erode the net benefit cooperators receive, deception can be evolutionarily tolerated\
  \ and persist alongside cooperation rather than being selected against."
          - letter: "D"
            text: "Deceptive behaviour can occur only in novel habitats as there is no time to adapt\
  \ to the new environmental conditions."
            answer: false
            explanation: "Deceptive behaviour is a widespread, evolved social strategy documented in long-established\
  \ social systems, not something restricted to newly encountered habitats - this\
  \ statement's blanket restriction is not supported."
          - letter: "E"
            text: "The relationship between cooperativeness and deception rate in primates can be explained\
  \ by the relatively large social group size in this taxon."
            answer: true
            explanation: "Larger primate social groups create more opportunities for both cooperative interactions\
  \ and deceptive tactics, and are linked to greater social complexity and cognitive\
  \ demands (the 'Machiavellian intelligence' hypothesis) - providing a plausible\
  \ explanation for why cooperativeness and deception rate are positively correlated\
  \ across primate species in the figure."

      - id: q47
        number: "Q47"
        name: "Williams' Evolutionary Theory of Senescence"
        link: "/papers/ibo/2018/theoretical-1-exam.pdf#page=51"
        subjects:
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "A"
            text: "Lower adult death rates can be associated with lower rates of senescence, according\
  \ to the theory."
            answer: true
            explanation: "Assumption 4 ties the strength of selection against a late-acting deleterious pleiotropic\
  \ effect to how much reproduction still remains at that age; when adult death rates\
  \ are lower, more individuals survive to reproduce at older ages, so the probability\
  \ of reproduction stays higher for longer, keeping selection against late-life harm\
  \ effective for longer and favouring slower senescence."
          - letter: "B"
            text: "Where there is a sex difference, the sex with higher rate of decrease in fecundity\
  \ after maturation (but with equal death rate to the other sex) should undergo the\
  \ more rapid senescence, according to the theory."
            answer: true
            explanation: "Per assumption 4, selection against a late-acting deleterious pleiotropic effect\
  \ weakens as an individual's probability of reproducing declines; so the sex whose\
  \ fecundity drops off faster after maturity experiences weaker selection to maintain\
  \ late-life function, and is predicted by the theory to senesce faster, even with\
  \ death rate held equal between the sexes."
          - letter: "C"
            text: "The frequencies of an allele in a gene that behaves similar to the aforementioned\
  \ calcium deposition gene in a cohort will be smallest at early age and greatest\
  \ at late age."
            answer: false
            explanation: "The allele's juvenile-survival advantage enriches carrier frequency early, before\
  \ its harmful late-life effect has had a chance to act; as the same cohort continues\
  \ to age, the arterial calcium deposition becomes increasingly deleterious and preferentially\
  \ removes carriers by death, so carrier frequency among the still-living cohort\
  \ is expected to fall with age rather than rise - the opposite of 'smallest early,\
  \ greatest late'."
          - letter: "D"
            text: "This model views senescence as an adaptation."
            answer: false
            explanation: "Williams' antagonistic pleiotropy model treats senescence as an incidental by-product\
  \ of selection favouring genes for their early-life benefits despite later costs,\
  \ not as a trait that is itself directly selected for - this is a key distinction\
  \ from theories that frame aging as a programmed adaptation."
  - id: theoretical-2
    name: "Theoretical 2"
    durationMinutes: 180
    papers:
      - category: "Theoretical 2"
        link: "/papers/ibo/2018/theoretical-2-exam.pdf"
        linkLabel: "Exam"

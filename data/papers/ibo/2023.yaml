        statements:
          - letter: "Q56.1"
            text: "Daily stem diameter variations show a consistent pattern of nighttime increment and daytime contraction."
            answer: true
            explanation: "Figure 1 shows a clear daily pattern: stem diameter increases at night (likely driven by root pressure refilling xylem) and contracts during the day (due to transpiration-driven xylem tension)."
          - letter: "Q56.2"
            text: "The daily variations in stem diameter are related to water status of the xylem."
            answer: true
            explanation: "Nighttime increment is driven by root pressure refilling xylem vessels, while daytime contraction is caused by tension in the xylem from transpiration pull."
          - letter: "Q56.3"
            text: "The daily variations in stem diameter are driven by changes in phloem pressure."
            answer: false
            explanation: "The daily variations are largely driven by pressure/tension changes in the xylem, not phloem. Xylem tension during transpiration causes contraction, and root pressure at night causes expansion."

        statements:
          - letter: "Q57.1"
            text: "Root hairs significantly contribute to phosphorus acquisition and plant growth, as shown by the comparison between wild type and the root hairless mutant rth3."
            answer: true
            explanation: "Wild type values for shoot/root biomass, root length, and P content were 1.9 to 3.6-fold higher than the root hairless mutant rth3, demonstrating the importance of root hairs."
          - letter: "Q57.2"
            text: "Wild type plants without AMF performed better than rth3 without AMF in terms of growth and P content."
            answer: true
            explanation: "Shoot P content, root length, and dry weight of WT were all greater than rth3 without AMF, confirming that root hairs provide a growth advantage independent of mycorrhizal colonization."
          - letter: "Q57.3"
            text: "Root hairs and AMF access phosphorus from different spatial zones of the root."
            answer: true
            explanation: "Root Pi assimilation occurs mainly in the root hair zone, while AMF colonizes more mature regions of the root and supplies these regions with assimilated Pi, providing complementary phosphorus acquisition."
          - letter: "Q57.4"
            text: "Wild type plants with AMF performed better than rth3 with AMF."
            answer: false
            explanation: "Shoot P concentration of WT+AMF was similar to rth3-AMF but significantly less than rth3+AMF. Shoot biomass of WT+AMF was also less than rth3+AMF, indicating AMF can more than compensate for the lack of root hairs."
          - letter: "Q57.5"
            text: "AMF inoculation of the root hairless mutant compensated for the lack of root hairs in terms of growth and P acquisition."
            answer: true
            explanation: "AMF inoculation of rth3 increased growth and P-acquisition to be at least similar to or better than WT+AMF, demonstrating that mycorrhizal fungi can fully compensate for the absence of root hairs."

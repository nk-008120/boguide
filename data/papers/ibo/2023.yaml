            explanation: "The competition for resources caused by latex production (tapping) reduced trunk increment by approximately 50% compared to untapped trees, as shown in the data."
          - letter: "Q56.5"
            text: "The latex harvesting creates a competing sink that diverts resources from trunk growth."
            answer: true

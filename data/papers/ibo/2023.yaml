rounds:
  - id: theoretical-1
    name: "Theoretical 1"
    durationMinutes: 180
    papers:
      - category: "Theoretical 1"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf"
        linkLabel: "Exam + Official Answer Key & Solutions"
    problems:
      - id: q1
        number: "Q1"
        difficulty: "medium"
        name: "Skeletal Muscle Energy Sources"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=4"
        subjects:
          - name: "Muscle Physiology"
            link: "/resources/3-animal-physiology/muscle-physiology/"
        statements:
          - letter: "Q1.1"
            type: "mcq"
            text: "Aerobic oxidation: muscle glycogen, plasma glucose or liver glycogen corresponds to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "D"
            explanation: "Curve D rises after the initial ATP/creatine phosphate (A) and anaerobic glycolysis (B) peaks have subsided, and reaches a moderate sustained level in the minutes-to-hours transition. This matches aerobic oxidation of muscle glycogen and plasma glucose, which is a rapid energy source once the immediate stores are consumed but has limited capacity compared to fat oxidation."
          - letter: "Q1.2"
            type: "mcq"
            text: "Aerobic oxidation: adipose tissue triglycerides and plasma fatty acids corresponds to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "C"
            explanation: "Curve C rises slowly and plateaus at a high sustained level over hours. This matches fatty acid oxidation: the slowest energy source to mobilize (involving complex chemical transformations from triglyceride breakdown to beta-oxidation) but with the highest total capacity, dominating during prolonged exercise."
          - letter: "Q1.3"
            type: "mcq"
            text: "ATP + creatine phosphate corresponds to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "A"
            explanation: "Curve A is the first sharp peak at the very start of exercise (within ~1 minute), then drops to near zero. This matches ATP + creatine phosphate: the immediate energy source for muscle contraction, consumed within approximately 1 minute of intense activity."
          - letter: "Q1.4"
            type: "mcq"
            text: "Anaerobic oxidation: muscle glycogen corresponds to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "B"
            explanation: "Curve B peaks shortly after curve A (around 2-4 minutes) then declines. This matches anaerobic glycolysis of muscle glycogen, which kicks in after the ATP/creatine phosphate store is depleted. It provides substantial but limited energy due to the finite glycogen storage capacity of muscle."

      - id: q2
        number: "Q2"
        difficulty: "medium"
        name: "Smooth Muscle Contraction Dynamics"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=6"
        subjects:
          - name: "Muscle Physiology"
            link: "/resources/3-animal-physiology/muscle-physiology/"
        statements:
          - letter: "Q2.1"
            type: "mcq"
            text: "Sphincters correspond to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "A"
            explanation: "Sphincters are normally contracted and must be actively relaxed to allow passage. Curve A (labeled I, 'Normally contracted') shows sustained high contraction with a brief relaxation dip, matching the sphincter pattern where the default state is contracted and active relaxation opens the sphincter transiently."
          - letter: "Q2.2"
            type: "mcq"
            text: "Oesophagus and urinary bladder correspond to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "D"
            explanation: "The oesophagus and urinary bladder are normally relaxed and contract only after signaling (peristalsis for swallowing, detrusor contraction for micturition). Curve D (labeled IV, 'Normally relaxed') shows a baseline of low contraction with a sharp contraction spike upon stimulation."
          - letter: "Q2.3"
            type: "mcq"
            text: "Blood vessels and airways correspond to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "B"
            explanation: "Blood vessels and airways maintain a partial contraction (vascular/bronchial tone) and can moderately increase or decrease contraction to regulate blood pressure or airflow. Curve B (labeled II, 'Normally partially contracted/tone') shows a sustained intermediate contraction level with moderate fluctuations."
          - letter: "Q2.4"
            type: "mcq"
            text: "Stomach and intestines correspond to which curve?"
            options: [{key: "A", text: "Curve A"}, {key: "B", text: "Curve B"}, {key: "C", text: "Curve C"}, {key: "D", text: "Curve D"}]
            answer: "C"
            explanation: "The stomach and intestines exhibit phasic (rhythmic) contractions for peristalsis, periodically contracting and relaxing the muscle. Curve C (labeled III, 'Phasically active') shows regular oscillations of contraction and relaxation, matching the periodic peristaltic pattern of the gastrointestinal tract."

      - id: q3
        number: "Q3"
        difficulty: "medium"
        name: "Flow Cytometry of Mouse Blood"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=8"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "A"
            text: "Lymphocytes are shown in Area 1."
            answer: true
            explanation: "TRUE. After RBC lysis, lymphocytes are the smallest white blood cells and lack granules, so they appear with low FSC (small size) and low SSC (low granularity). Area 1 occupies the low-FSC, low-SSC region of the dot plot, consistent with lymphocytes."
          - letter: "B"
            text: "Residual red blood cells are shown in Area 2."
            answer: false
            explanation: "FALSE. RBCs are smaller than lymphocytes, and the FSC-threshold excludes particles with very low FSC (including debris and residual RBCs that survived lysis). Area 2, which shows cells with moderate FSC and low-to-moderate SSC, corresponds to monocytes (larger than lymphocytes, less granular than granulocytes), not residual RBCs."
          - letter: "C"
            text: "Neutrophils and other granulocytes are shown in Area 3."
            answer: true
            explanation: "TRUE. Granulocytes (neutrophils, eosinophils, basophils) are larger and more granular than lymphocytes and monocytes, giving them higher FSC and higher SSC. Area 3, the cluster with the highest SSC and high FSC, matches granulocytes."
          - letter: "D"
            text: "In general, unstained blood cells show no fluorescence."
            answer: false
            explanation: "FALSE. Many blood cell molecules contain conjugated double bonds that give them natural fluorescent properties. For example, hemoglobin in residual RBCs and other porphyrin-containing molecules exhibit autofluorescence. Unstained cells therefore do show some background fluorescence."

      - id: q5
        number: "Q5"
        difficulty: "hard"
        name: "Desert March Dehydration and SIADH"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=11"
        subjects:
          - name: "Homeostasis & Osmoregulation"
            link: "/resources/3-animal-physiology/homeostasis-osmoregulation/"
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "Q5.1"
            text: "The change in blood osmolarity in the blue group is adaptive and helps them to last longer."
            answer: true
            explanation: "TRUE. The blue group (water only, no salt) experiences declining blood osmolarity as they drink water without replacing lost salts. This drop in osmolarity is adaptive: it allows them to tolerate drinking more water to preserve blood volume, similar to camels at watering holes that allow large osmolarity drops to maximize water intake."
          - letter: "Q5.2"
            text: "The blue group drinks more water than the black group."
            answer: false
            explanation: "FALSE. Although the blue group's osmolarity declines, they actually drink less than the black group. The black group replaces both water and salt, maintaining stable osmolarity and normal homeostasis, allowing them to drink freely. The blue group's body limits intake because of the conflict between maintaining osmolarity and replacing volume ('voluntary dehydration'). Their gradually deteriorating cardiac output and rising temperature confirm they are not drinking enough."
          - letter: "Q5.3"
            text: "Circulatory failure is the proximate cause of exhaustion in these conditions."
            answer: true
            explanation: "TRUE. The red and blue groups reach exhaustion at the same low cardiac output despite different temperatures and osmolarity values. This shows that circulatory failure (insufficient cardiac output due to reduced blood volume and filling pressure, per Starling's law) is the proximate cause of exhaustion, not hyperthermia or osmotic imbalance per se."
          - letter: "Q5.4"
            text: "Of the three groups, camels would follow a trajectory most similar to the blue group (but extended). Assume they do not eat or drink."
            answer: false
            explanation: "FALSE. Camels that do not eat or drink cannot replace water or salt at all. They follow the red trajectory (no food or water), not the blue trajectory. Camel humps are almost entirely fat (not water reserves), and while fat metabolism releases some metabolic water, this is negligible compared to sweat losses. The question's own note confirms humps do not contribute meaningful water."
          - letter: "Q5.5"
            text: "A group given unlimited dry food, but not water, would last longer than the red group."
            answer: false
            explanation: "FALSE. The primary problem in the desert is water loss via sweating. Food does not help replace water. Furthermore, eating without water intake would worsen osmolarity problems because the solutes from digested food increase blood osmolarity without any compensating fluid intake."
          - letter: "Q5.6"
            text: "These patients have more concentrated urine than normal."
            answer: true
            explanation: "TRUE. SIADH patients secrete inappropriately high levels of ADH. ADH acts on high-affinity kidney receptors to increase water reabsorption, producing more concentrated (hyperosmolar) urine than the body's osmotic state would normally warrant."
          - letter: "Q5.7"
            text: "These patients have higher blood osmolarity than normal."
            answer: false
            explanation: "FALSE. Excessive ADH drives the kidneys to retain water, diluting the blood. This results in lower blood osmolarity (hyponatremia), not higher. The normal feedback loop (high osmolarity triggers ADH release) is bypassed because the tumor secretes ADH independently of osmolarity."
          - letter: "Q5.8"
            text: "In the absence of compensation, these patients have higher blood volume than normal."
            answer: true
            explanation: "TRUE. ADH causes the kidneys to conserve water, increasing total body water and therefore blood volume (hypervolemia), in the absence of compensatory mechanisms that would otherwise act to restore normal volume."
          - letter: "Q5.9"
            text: "These patients have higher cardiac output than normal."
            answer: true
            explanation: "TRUE. By Starling's law, cardiac output is proportional to venous return (mean systemic filling pressure). Higher blood volume increases venous filling pressure, which increases cardiac output. ADH also acts on low-affinity vascular receptors to increase vessel tone, further raising blood pressure and cardiac output."
          - letter: "Q5.10"
            text: "These patients have similar fluid-handling problems to patients with uncontrolled diabetes."
            answer: false
            explanation: "FALSE. Uncontrolled diabetes (particularly diabetes mellitus) causes high blood glucose, which drives osmotic diuresis producing dilute, high-volume urine and more concentrated (saltier) blood. This is essentially the opposite of SIADH, where urine is concentrated and blood is diluted. The two conditions affect fluid balance in opposite directions."

      - id: q6
        number: "Q6"
        difficulty: "hard"
        name: "Renal Clearance and Glomerular Filtration"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=14"
        subjects:
          - name: "Comparative Osmoregulation & Excretion"
            link: "/resources/3-animal-physiology/comparative-osmoregulation-excretion/"
        statements:
          - letter: "Q6.1"
            type: "numeric"
            text: "Calculate the plasma volume of the pig. Give your answer in liters to one decimal place."
            expected: 7.5
            tolerance: 0
            explanation: "The pig was given 0.75 mmol of dextran (a 500 kDa inert polymer too large to be filtered or excreted). The peak plasma concentration is 0.1 mM (read from the graph, the nearly flat top curve). Using concentration = amount / volume: 0.1 mM = 0.75 mmol / V, so V = 0.75 / 0.1 = 7.5 L."
          - letter: "Q6.2"
            type: "numeric"
            text: "Calculate the renal plasma flow of the pig (how much plasma the kidneys receive). Give your answer in ml/min to the nearest ml. Assume plasma volume = 10 L."
            expected: 200
            tolerance: 5
            explanation: "PAH is completely removed from plasma as it passes a nephron, so PAH clearance equals total renal plasma flow. Using the exponential decay formula with the steepest curve (PAH): k = ln(A0/A) / t. From the graph, PAH concentration drops from 0.1 M to 0.05 M at t = 34.7 min. So k = ln(0.1/0.05) / 34.7 = ln(2) / 34.7 = 0.693 / 34.7. Renal plasma flow = k x total volume = (0.693 / 34.7) x 10000 ml = 199.7, approximately 200 ml/min."
          - letter: "Q6.3"
            type: "numeric"
            text: "Calculate the glomerular filtration rate of the pig (how much plasma the Bowman's capsule excretes). Give your answer in ml/min to the nearest ml. Assume plasma volume = 10 L."
            expected: 30
            tolerance: 2
            explanation: "Inulin (4 kDa) is freely filtered but not reabsorbed or secreted, so inulin clearance equals GFR. Using the less steep curve (inulin): concentration drops from 0.1 M to 0.05 M at t = 231 min. GFR = k x volume = [ln(2) / 231] x 10000 = (0.693 / 231) x 10000 = 30 ml/min."

      - id: q7
        number: "Q7"
        difficulty: "hard"
        name: "Archaeal Phylogeny and the Origin of Eukaryotes"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=16"
        subjects:
          - name: "History of Life: Origin & Major Transitions"
            link: "/resources/15-evolution/history-of-life-origin-and-major-transitions/"
          - name: "Cell Theory, Prokaryotes & Eukaryotes"
            link: "/resources/1-cell-molecular/cell-theory-prokaryotes-eukaryotes/"
        statements:
          - letter: "Q7.1"
            type: "mcq"
            text: "Based on the tree, which Archaeal group is the most promising research target in order to study the properties of the 'Host'?"
            options: [{key: "A", text: "Asgardarchaeota"}, {key: "B", text: "Thermoproteota"}, {key: "C", text: "Halobacteriota"}, {key: "D", text: "Thermoplasmatota"}, {key: "E", text: "Nanoarchaeota"}]
            answer: "A"
            explanation: "Asgardarchaeota (group X on the tree) is the sister group to Eukarya (group IX), making it the closest extant Archaeal lineage to the eukaryotic 'Host.' This group is actively studied for this reason, and indeed Asgard archaea have been found to possess eukaryote-like features such as complex cytoskeletal proteins."
          - letter: "Q7.2.1"
            text: "A complex dynamic cytoskeleton consisting of actin-like filaments."
            answer: true
            explanation: "TRUE. A key property expected of the 'Host' is some form of endocytosis or membrane remodeling, which in eukaryotes depends on a dynamic actin-based cytoskeleton. While actin homologs exist across all domains of life, a complex and dynamic actin cytoskeleton is rare among prokaryotes. Finding this feature in a new Archaeal group would strongly suggest closer evolutionary proximity to the 'Host.'"
          - letter: "Q7.2.2"
            text: "Protrusions of the cellular membrane."
            answer: true
            explanation: "TRUE. Membrane protrusions are associated with the ability to change cell shape and potentially engulf other cells (a prerequisite for endosymbiosis). Finding such structures in a new Archaeal group would support a closer relationship to the 'Host,' whose engulfment of the bacterial 'Symbiont' is central to eukaryogenesis."
          - letter: "Q7.2.3"
            text: "A cellular membrane made of isoprenoid alkyl chains linked by ether bonds to glycerol-1-phosphate."
            answer: false
            explanation: "FALSE. This membrane chemistry (isoprenoid ethers on glycerol-1-phosphate) is the standard Archaeal lipid composition, found in nearly all Archaea. It is very different from the bacterial/eukaryotic fatty-acid ester linkages on glycerol-3-phosphate. Finding this typical Archaeal membrane does not distinguish the group as closer to the 'Host.' If anything, finding 'bacteria-type' lipids would be more informative, since it would help explain why eukaryotes share bacterial membrane chemistry."
          - letter: "Q7.2.4"
            text: "Flagellin-based flagella."
            answer: false
            explanation: "FALSE. Flagellin-based flagella are a bacterial feature. Archaeal flagella (archaella) are built from different proteins entirely. Finding bacterial-type flagella in a new Archaeal group would not provide evidence for closer evolutionary proximity to the eukaryotic 'Host,' since eukaryotic motility structures (cilia, flagella with tubulin-based axonemes) are unrelated to bacterial flagellin."

      - id: q8
        number: "Q8"
        difficulty: "hard"
        name: "Gram Staining, Monoderms, Diderms and Firmicute Evolution"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=18"
        subjects:
          - name: "Cell Theory, Prokaryotes & Eukaryotes"
            link: "/resources/1-cell-molecular/cell-theory-prokaryotes-eukaryotes/"
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "Q8.1.1"
            type: "mcq"
            text: "A typical diderm stains:"
            options: [{key: "A", text: "Gram-positive"}, {key: "B", text: "Gram-negative"}]
            answer: "B"
            explanation: "A typical diderm (like E. coli) has an outer membrane that prevents the Gram stain from penetrating to the peptidoglycan layer, and the peptidoglycan layer itself is thin. The crystal violet-iodine complex washes out during decolorization, so the cell stains Gram-negative."
          - letter: "Q8.1.2"
            type: "mcq"
            text: "A typical monoderm stains:"
            options: [{key: "A", text: "Gram-positive"}, {key: "B", text: "Gram-negative"}]
            answer: "A"
            explanation: "A typical monoderm (like Bacillus subtilis) has only a cytoplasmic membrane with a thick, exposed peptidoglycan layer on the surface. Nothing shields the peptidoglycan, so the Gram stain binds readily and the cell stains Gram-positive."
          - letter: "Q8.1.3"
            type: "mcq"
            text: "A monoderm with no peptidoglycan on the surface stains:"
            options: [{key: "A", text: "Gram-positive"}, {key: "B", text: "Gram-negative"}]
            answer: "B"
            explanation: "A monoderm without peptidoglycan (like Mycoplasma) has nothing for the Gram stain to bind to. Without the thick peptidoglycan layer that retains the crystal violet-iodine complex, the cell stains Gram-negative."
          - letter: "Q8.2.1"
            type: "mcq"
            text: "Within Firmicutes, monoderms are:"
            options: [{key: "A", text: "Monophyletic"}, {key: "B", text: "Paraphyletic"}, {key: "C", text: "Polyphyletic"}]
            answer: "C"
            explanation: "From the phylogenetic tree (Figure 1), monoderms within Firmicutes include Clostridiales/Thermoanaerobacterales (II), Bacillales/Lactobacillales (III), and Natranaerobiales (V). These groups are scattered across the tree with diderms (I, IV) interspersed between them, meaning monoderms do not form a single clade or include all descendants of a common ancestor. They are polyphyletic: multiple independent origins (or losses of the outer membrane)."
          - letter: "Q8.2.2"
            type: "mcq"
            text: "Within Firmicutes, diderms are:"
            options: [{key: "A", text: "Monophyletic"}, {key: "B", text: "Paraphyletic"}, {key: "C", text: "Polyphyletic"}]
            answer: "B"
            explanation: "Diderms within Firmicutes are Negativicutes (I) and Halanaerobiales (IV). These two groups share outer membrane genes by vertical transmission (not horizontal gene transfer), meaning their most recent common ancestor had the outer membrane. However, some descendants of that ancestor (the monoderm lineages in between) lost it. This makes diderms paraphyletic: they include a common ancestor but exclude some of its descendants."
          - letter: "Q8.3.1"
            text: "Based on these results, the most recent common ancestor of Firmicutes likely had the outer membrane."
            answer: true
            explanation: "TRUE. The study showed that outer membrane genes are shared between Negativicutes and Halanaerobiales by vertical transmission (not horizontal gene transfer). Since their most recent common ancestor is also the most recent common ancestor of all Firmicutes, this ancestor must have had the outer membrane, with various descendant lineages subsequently losing it."
          - letter: "Q8.3.2"
            text: "Based on these results and the maximum parsimony principle, it is likely that Bacillales and Lactobacillales lost the outer membrane independently of each other."
            answer: false
            explanation: "FALSE. The most parsimonious explanation is that the outer membrane was lost once in the common ancestor of the clade containing Bacillales and Lactobacillales, before these two groups diverged. A scenario where each lost the membrane independently requires two separate loss events, which is less parsimonious than a single loss in their shared ancestor."
          - letter: "Q8.3.3"
            text: "These results disprove the hypothesis that the outer membrane evolved as a protection against penicillin-like antibiotics."
            answer: false
            explanation: "FALSE. Observing that some Firmicute lineages lost the outer membrane does not disprove the hypothesis that the outer membrane originally evolved as protection against penicillin-like antibiotics. Those lineages may simply have faced less antibiotic pressure, making the membrane dispensable. The results show the membrane can be lost, but they provide no evidence that it did not originally evolve for antibiotic protection."

      - id: q10
        number: "Q10"
        difficulty: "hard"
        name: "Yeast Prion [GAR+] and Bacterial Metabolite Signaling"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=22"
        subjects:
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "Q10.1"
            text: "A point mutation in the gene encoding the Pma1 protein, without any major conformational change, will result in the [GAR+] phenotype."
            answer: false
            explanation: "FALSE. The [GAR+] phenotype results from a conformational change in the Pma1 prion protein that causes it to clump, not from a DNA sequence change. A hallmark of prion proteins is cytoplasmic, non-Mendelian inheritance of a conformational feature. A point mutation without major conformational change would not produce the protein misfolding and aggregation that defines [GAR+]."
          - letter: "Q10.2"
            text: "The occurrence of [gar-] cells is higher in cultures lacking lactic acid, than cultures containing lactic acid."
            answer: true
            explanation: "TRUE. Panel B shows that as lactic acid concentration increases, the fraction of [GAR+] colonies increases. At 0% lactic acid, the [GAR+] fraction is lowest (meaning [gar-] fraction is highest). Lactic acid induces the conformational switch from [gar-] to [GAR+], so cultures without lactic acid retain more cells in the [gar-] state."
          - letter: "Q10.3"
            text: "Cytoduction (the transfer of cytoplasm) from a [GAR+] cell to a [gar-] cell will change its phenotype to [GAR+]."
            answer: true
            explanation: "TRUE. The [GAR+] prion is inherited through cytoplasmic, non-Mendelian inheritance, as stated in the question stem. The misfolded Pma1 protein acts as a template that converts normally folded Pma1 into the prion conformation. Transferring cytoplasm containing the prion aggregates would seed the conversion in the recipient cell."
          - letter: "Q10.4"
            text: "The results show that the biggest change in yeast phenotype is caused by the products of the bacteria themselves, rather than components of the bacterial medium."
            answer: true
            explanation: "TRUE. Panel A includes a critical control: condition D (yeast + filtered unused bacterial medium) shows similar growth to condition Y (yeast only), while condition E (yeast + filtered medium after S. gallinarum cultivation) shows a different pattern. This control demonstrates that the components already present in the bacterial medium do not cause the phenotypic change; rather, it is the metabolites produced by the bacteria during growth that drive the switch."
          - letter: "Q10.5"
            text: "Lactic acid secreted by S. gallinarum diffuses in the agar-agar solidified medium."
            answer: true
            explanation: "TRUE. Lactic acid is a small, low molecular weight organic compound. Small molecules readily diffuse through the pores of agar-agar solidified medium. The fact that bacterial metabolites can affect nearby yeast colonies growing on the same solid medium plate confirms this diffusion occurs."

      - id: q11
        number: "Q11"
        difficulty: "hard"
        name: "Engineered Viral Capsids and Genome Packaging"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=24"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "Q11.1"
            text: "The reason I53-50 did not package any nucleic acid is because it was unable to produce protein particles."
            answer: false
            explanation: "FALSE. Figure 1A shows that I53-50 does produce protein (visible bands in the protein gel). The issue is not a failure to produce protein particles but rather that the basic I53-50 capsid lacks the ability to efficiently encapsulate genetic material, unlike the v1 and Btat variants which were modified for this purpose."
          - letter: "Q11.2"
            text: "The genetic material packaged in the v1 and Btat variants is RNA."
            answer: true
            explanation: "TRUE. Figure 1B shows nucleic acid is present in the v1 and Btat capsids after DNase treatment (confirming it is not DNA). Figure 1C shows that RT-PCR (reverse transcriptase PCR) produces a product only in the RT+ lanes for I53-50 and v1, meaning the packaged nucleic acid must be RNA (reverse transcriptase converts RNA to cDNA for PCR amplification). If it were DNA, the RT step would be unnecessary."
          - letter: "Q11.3"
            text: "The positive electrical charge inside the capsid could be the reason why the Btat variant can efficiently package the genome."
            answer: true
            explanation: "TRUE. Btat is a naturally occurring nucleic acid binding peptide inserted into the capsid interior. DNA-binding proteins in nature are generally positively charged (rich in lysine and arginine) to interact with the negatively charged phosphate backbone of nucleic acids. The heatmap (Figure 2) also shows that mutations to lysine (K, positively charged) are generally enriched (beneficial) for genome packaging, supporting the role of positive charge in nucleic acid encapsulation."
          - letter: "Q11.4"
            text: "Addition of positively charged amino-acids into the protein sequences is always beneficial to the protection of the encapsulated genetic material."
            answer: false
            explanation: "FALSE. While positive charge is generally beneficial, the heatmap (Figure 2) shows that mutations to lysine (K) at certain positions (such as sites 74, 94, 95, and 98) have deleterious effects (shown in purple/magenta, indicating depletion). Protein function depends on higher-order structural interactions, not just charge alone, so adding positive charge at specific positions can disrupt protein folding or capsid assembly."

      - id: q12
        number: "Q12"
        difficulty: "hard"
        name: "Genome Size, Genetic Code and Alien DNA"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=26"
        subjects:
          - name: "Nucleotide & Nucleic Acid Chemistry"
            link: "/resources/1-cell-molecular/nucleotide-nucleic-acid-chemistry/"
          - name: "Translation & the Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
        statements:
          - letter: "Q12.1"
            type: "numeric"
            text: "Estimate the total length, in base-pairs, of coding sequence in the human genome. Give your answer to the nearest million base-pairs."
            expected: 27
            tolerance: 1
            explanation: "Average protein weight = 50,000 Da. Average amino acid weight = 110 Da. Average amino acids per protein = 50,000 / 110 = 454.5. Total amino acids across 20,000 genes = 20,000 x 454.5 = 9,090,909. Each amino acid is encoded by a triplet codon (3 bp), so total coding bp = 9,090,909 x 3 = 27,272,727, approximately 27 million base pairs."
          - letter: "Q12.2"
            type: "mcq"
            text: "What kind of sequences comprise the majority of the chimpanzee genome?"
            options: [{key: "A", text: "Transposons, repeated elements, ancient viruses and other 'genetic parasites'"}, {key: "B", text: "Promoter, enhancer and other adaptive gene regulatory sequences"}, {key: "C", text: "Centromeric and telomeric sequences"}, {key: "D", text: "siRNA, rRNA and other non-coding RNA sequences"}]
            answer: "A"
            explanation: "Since less than 1% of the chimpanzee genome is protein-coding, and centromeric/telomeric sequences are relatively small (centromeres 0.2-7 Mbp per chromosome, telomeres only 5-15 Kbp), the vast majority of the genome consists of transposable elements, repeated sequences, endogenous retroviruses, and other 'genetic parasites.' This is consistent with what is known about primate genomes generally."
          - letter: "Q12.3"
            type: "numeric"
            text: "Calculate the maximum total length of protein sequence (in amino acids) this alien could encode. Assume no overlapping coding regions. Give your answer to the nearest million amino acids."
            expected: 50
            tolerance: 0
            explanation: "The alien has 6 different bases (3 base pairs: A/T, G/C, X/Y). With 6 bases, a doublet code gives 6 x 6 = 36 possible codons, which is sufficient to encode 20 amino acids plus stop codons. A triplet code would be redundant and wasteful. Using a doublet code, 100 million bases encode 100/2 = 50 million amino acids."
          - letter: "Q12.4"
            type: "mcq"
            text: "Which DNA sequence has the highest melting temperature?"
            options: [{key: "A", text: "ATTATAAAATAAT"}, {key: "B", text: "GCGCGCCCCGGCG"}, {key: "C", text: "GCGG"}, {key: "D", text: "ATGCYGAYTCTX"}, {key: "E", text: "XYXYYXYXXYXXY"}]
            answer: "E"
            explanation: "The X/Y base pair structure shown in the figure reveals three hydrogen bonds (similar to G/C). Melting temperature depends on both the number of hydrogen bonds per base pair and the length of the sequence. Sequence E (13 bases, all X/Y with 3 hydrogen bonds each) has the highest total hydrogen bonding, surpassing B (13 bases of G/C with 3 H-bonds each but comparable) and far exceeding A (all A/T with only 2 H-bonds each). Since E is the same length as B but composed entirely of the three-hydrogen-bond X/Y pair, it matches or exceeds B. The official key confirms E."

      - id: q13
        number: "Q13"
        difficulty: "medium"
        name: "Bacterial 23S rRNA Gene Copy Number"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=28"
        subjects:
          - name: "Nucleotide & Nucleic Acid Chemistry"
            link: "/resources/1-cell-molecular/nucleotide-nucleic-acid-chemistry/"
        statements:
          - letter: "Q13.1"
            type: "numeric"
            text: "How many copies of the gene for 23S rRNA does a single bacterial genome contain? Write your answer rounded to the nearest whole number."
            expected: 6
            tolerance: 0
            explanation: "The OD ratio tells us what fraction of the total genome is 23S rRNA sequence: 0.024 / 8 = 0.003, or 0.3%. The total genome size is 1.1 x 10^9 Da. The total mass of 23S rRNA genes = 0.003 x 1.1 x 10^9 = 3.3 x 10^6 Da. Each copy of the 23S rRNA gene weighs 5.5 x 10^5 Da. Number of copies = 3.3 x 10^6 / 5.5 x 10^5 = 6."

      - id: q14
        number: "Q14"
        difficulty: "medium"
        name: "DNA Replication Origins and Rate"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=29"
        subjects:
          - name: "DNA Structure & Replication"
            link: "/resources/1-cell-molecular/dna-structure-replication/"
        statements:
          - letter: "Q14.1"
            type: "numeric"
            text: "What is the minimum number of origins that human cells need to replicate their DNA every 12 hours? Give your answer as a whole number."
            expected: 695
            tolerance: 1
            explanation: "The human genome is diploid: 2 x 3 x 10^9 = 6 x 10^9 nucleotide pairs total. Each origin fires two replication forks, so each origin replicates at 2 x 100 = 200 nucleotides per second. In 12 hours = 43,200 seconds, each origin replicates 200 x 43,200 = 8,640,000 nucleotides. Minimum origins = 6 x 10^9 / 8,640,000 = 694.4, rounded up to 695."
          - letter: "Q14.2"
            type: "numeric"
            text: "On average, how many nucleotides are replicated from one origin within 12 hours? Give your answer in millions of nucleotides to 2 decimal places."
            expected: 8.64
            tolerance: 0.01
            explanation: "Each origin produces two replication forks, each moving at 100 nucleotides per second. In 12 hours (43,200 seconds), each origin replicates 2 x 100 x 43,200 = 8,640,000 nucleotides = 8.64 million nucleotides. This question confirms the first answer: if the student incorrectly used a haploid genome (3 x 10^9) with a single-fork rate (100 nt/s), they would get 695 origins but 4.32 million nt per origin, revealing the error."

      - id: q15
        number: "Q15"
        difficulty: "medium"
        name: "Sea Turtle Temperature-Dependent Sex Determination"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=30"
        subjects:
          - name: "Sex Determination & Sex-Linked Inheritance"
            link: "/resources/7-genetics/sex-determination-sex-linked-inheritance/"
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "Q15.1"
            type: "numeric"
            text: "If an individual of Species 1 has 150 eggs in a clutch, what would be the expected number of female hatchlings at 30 degrees C?"
            expected: 135
            tolerance: 1
            explanation: "From the sigmoid curve for Species 1 (curve a), at 30 degrees C the probability of a female hatchling is approximately 0.90 (90%). Expected females = 150 x 0.90 = 135."
          - letter: "Q15.2.1"
            text: "Species 2 will be more vulnerable to skewed sex ratios as temperatures rise, compared to Species 1."
            answer: false
            explanation: "FALSE. Species 1 (curve a) has a steeper slope than Species 2 (curve b), meaning a small increase in temperature causes a larger shift in sex ratio for Species 1. This makes Species 1 more vulnerable to temperature-induced sex ratio skewing, not Species 2."
          - letter: "Q15.2.2"
            text: "Dark-coloured beaches are likely to produce more female hatchlings than pale-coloured beaches."
            answer: true
            explanation: "TRUE. Dark-coloured substrates absorb more solar radiation and heat up more than light-coloured substrates. Higher sand temperatures raise egg incubation temperatures, which in temperature-dependent sex determination shifts the ratio toward more females."
          - letter: "Q15.2.3"
            text: "The production of more female hatchlings, due to climate change, is likely to enhance the natural rate of population growth of turtles in the next 10 years."
            answer: false
            explanation: "FALSE. Female sea turtles mate once every three years and do not reach sexual maturity until 10-25 years of age. Female-biased hatchlings produced now will not begin to influence operational sex ratios or population growth within the next 10 years. In the short term, the existing adult population has enough males (males mate every year) to fertilize available females, so more female hatchlings do not immediately translate into faster population growth."
          - letter: "Q15.2.4"
            text: "Rising temperatures during climate change are more likely to skew the operational sex ratio of sea turtles than the absolute sex ratio at hatching."
            answer: false
            explanation: "FALSE. Rising temperatures directly affect the absolute sex ratio at hatching (by shifting egg development toward females). The operational sex ratio (ratio of breeding females to breeding males at any given time) is affected only indirectly and with a long delay, because it depends on the maturation and breeding behavior of adults already in the population. The direct, immediate effect is on hatchling sex ratio."
          - letter: "Q15.2.5"
            text: "Increasing sand temperatures will lead to a significant increase in metabolic heating of the developing turtle eggs."
            answer: false
            explanation: "FALSE. Metabolic heat is the heat generated by the metabolic activity within the developing eggs themselves. It is an intrinsic property of egg metabolism, not directly caused by external sand temperature. While higher external temperatures might indirectly affect metabolic rates, the question specifically refers to metabolic heating as something separate from and not immediately affected by external temperature changes."

      - id: q16
        number: "Q16"
        difficulty: "medium"
        name: "Metabolic Scaling and Kleiber's Law"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=32"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
          - name: "Locomotion & Energetics"
            link: "/resources/3-animal-physiology/locomotion-energetics/"
        statements:
          - letter: "Q16.1"
            type: "numeric"
            text: "Calculate the daily food energy consumption of a lesser jerboa with mass 60 grams. Give your answer as a whole number in kJ."
            expected: 93
            tolerance: 1
            explanation: "The jerboa (60 g) is much smaller than the honey badger (6 kg), so use the 2/3 exponent. Mass ratio = 6000 g / 60 g = 100. Energy ratio = 100^(2/3) = (10^2)^(2/3) = 10^(4/3) = 10 x 10^(1/3) = 10 x 2.154 = 21.5. Jerboa energy = 2,000 kJ / 21.5 = 93 kJ."
          - letter: "Q16.2"
            type: "numeric"
            text: "Calculate the daily food energy consumption of a camel with mass 600 kilograms. Give your answer in MJ to 1 decimal point."
            expected: 63.2
            tolerance: 0.3
            explanation: "The camel (600 kg) is much larger than the honey badger (6 kg), so use the 3/4 exponent. Mass ratio = 600 / 6 = 100. Energy ratio = 100^(3/4) = (10^2)^(3/4) = 10^(3/2) = 10 x sqrt(10) = 10 x 3.162 = 31.6. Camel energy = 2 MJ x 31.6 = 63.2 MJ."
          - letter: "Q16.3"
            type: "numeric"
            text: "Calculate how many lesser jerboas could feed on the desert area sufficient for one camel feeding. Give your answer as a whole number."
            expected: 680
            tolerance: 10
            explanation: "Number of jerboas = camel energy / jerboa energy = 63,200 kJ / 93 kJ = 679.6, approximately 680."

      - id: q17
        number: "Q17"
        difficulty: "medium"
        name: "Community Similarity: Sorensen-Dice and Jaccard"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=33"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "Q17.1"
            type: "numeric"
            text: "Calculate the Sorensen-Dice coefficient (DSC) for the rivers i and ii."
            expected: 0.75
            tolerance: 0.01
            explanation: "There are 9 species in sample i and 7 species in sample ii. 6 species are common to both. DSC = 2C / (A + B) = 2 x 6 / (9 + 7) = 12 / 16 = 0.75."
          - letter: "Q17.2"
            type: "numeric"
            text: "Calculate the Jaccard index (JI) for the rivers i and ii."
            expected: 0.6
            tolerance: 0.01
            explanation: "JI = C / (A + B - C) = 6 / (9 + 7 - 6) = 6 / 10 = 0.6."
          - letter: "Q17.3.1"
            text: "For the same communities, DSC is always equal or higher than JI."
            answer: true
            explanation: "TRUE. Algebraically, DSC = 2C / (A + B) while JI = C / (A + B - C). Since A + B - C is always less than or equal to A + B (because C >= 0), and the numerator of DSC is 2C versus C for JI, DSC is always greater than or equal to JI for any pair of communities."
          - letter: "Q17.3.2"
            text: "Rivers iii and i have DSC = 0.8 and JI = 0.67; faunal similarity between rivers i and iii is thus higher than between rivers i and ii."
            answer: true
            explanation: "TRUE. Both similarity indices for rivers i and iii (DSC = 0.8, JI = 0.67) are higher than those for rivers i and ii (DSC = 0.75, JI = 0.6), confirming that rivers i and iii are more similar in community composition."
          - letter: "Q17.3.3"
            text: "The discriminative capacity of DSC is higher than that of JI for highly similar communities."
            answer: false
            explanation: "FALSE. JI has higher discriminative capacity for highly similar communities. The Jaccard index spreads values more at the upper end (high similarity), making it better at distinguishing between communities that are very similar to each other. DSC compresses differences at high similarity values."

      - id: q18
        number: "Q18"
        difficulty: "hard"
        name: "Ecosystem Tipping Points and Vegetation-Livestock Dynamics"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=35"
        subjects:
          - name: "Ecology"
            link: "/resources/8-ecology/"
        statements:
          - letter: "Q18.1"
            text: "T1 decreases when plant productivity is low."
            answer: true
            explanation: "TRUE. When plant productivity is low, the vegetation growth rate curve is lower. This means the consumption rate needed to eliminate vegetation is lower, so the tipping point T1 (vegetation disappearance) is reached at a lower livestock density."
          - letter: "Q18.2"
            text: "T1 decreases when resource competition among plants is weak."
            answer: false
            explanation: "FALSE. When resource competition among plants is weak, the density-dependent decline in growth rate is less steep, and the growth rate curve changes shape. The tipping point T1 does not decrease; it may slightly increase or remain unchanged."
          - letter: "Q18.3"
            text: "T2 decreases when soil degradation is severe."
            answer: true
            explanation: "TRUE. Severe soil degradation causes a steeper decline in vegetation growth rate at low biomass levels, represented by a lower growth curve near the origin. This lowers T2 (the tipping point for vegetation recovery) because vegetation struggles to re-establish even at lower livestock densities."
          - letter: "Q18.4"
            text: "T1 decreases when there are many unpalatable plants (plants livestock do not like to eat)."
            answer: false
            explanation: "FALSE. If many plants are unpalatable, the effective consumption rate of vegetation by livestock decreases at any given livestock density. This means vegetation can persist at higher livestock densities, so T1 actually increases."
          - letter: "Q18.5"
            text: "In Figure A, T1 is represented by the line D."
            answer: false
            explanation: "FALSE. T1 is represented by line C, not line D. Line C corresponds to the consumption rate at which the upper stable equilibrium disappears, causing vegetation to collapse (the tipping point of vegetation disappearance)."
          - letter: "Q18.6"
            text: "In Figure A, T2 is represented by the line E."
            answer: true
            explanation: "TRUE. Line E corresponds to the consumption rate at which the lower unstable equilibrium disappears, allowing vegetation to recover (the tipping point of vegetation recovery)."
          - letter: "Q18.7"
            text: "In Figure A, point F is an unstable equilibrium."
            answer: false
            explanation: "FALSE. Point F is where line L1 intersects the growth curve at a stable equilibrium. At low livestock density (L1), there is only one intersection point, and it is stable because any small perturbation in biomass will return the system to this equilibrium."

      - id: q19
        number: "Q19"
        difficulty: "medium"
        name: "Foraging Energetics and Territory Defence"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=37"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
          - name: "Aggression, Territoriality & Social Structure"
            link: "/resources/9-ethology/aggression-territoriality-social-structure/"
        statements:
          - letter: "Q19.1"
            type: "numeric"
            text: "Calculate the energy saved by this bird, with reduced foraging time, as compared to an individual which is not territorial. Give your answer in calories."
            expected: 390
            tolerance: 5
            explanation: "Without territory the bird forages 4 hours (at 2 uL nectar/flower). With territory it forages 2.7 hours (at 3 uL nectar/flower). Time saved = 4 - 2.7 = 1.3 hours. During this time the bird perches instead of foraging. Energy saved = 1.3 h x (500 - 200) cal/h = 1.3 x 300 = 390 calories."
          - letter: "Q19.2"
            type: "numeric"
            text: "If the bird needs to spend 0.28 hours per day defending territory, instead of perching, what is the cost of defence faced by the bird, compared to a bird which is not territorial? Give your answer in calories."
            expected: 364
            tolerance: 0
            explanation: "The bird spends 0.28 hours defending territory instead of perching. Defence costs 1500 cal/h and perching costs 200 cal/h. Net cost = 0.28 x (1500 - 200) = 0.28 x 1300 = 364 calories."
          - letter: "Q19.3.1"
            text: "Under the conditions specified above, the bird is likely to show territorial defence."
            answer: true
            explanation: "TRUE. The energy saved (390 calories) exceeds the cost of defence (364 calories), so the net benefit of territorial defence is positive. The bird should defend a territory under these conditions."
          - letter: "Q19.3.2"
            text: "The birds will almost never be territorial if it reduces the amount of time spent perching."
            answer: false
            explanation: "FALSE. The bird will show territorial defence even though its net perching time actually increases (21.02 h vs 20 h without territory). The relevant comparison is between the total energy budget with and without territory, not simply whether perching time decreases."
          - letter: "Q19.3.3"
            text: "The birds will almost always be territorial if the cost of foraging per hour is higher than the cost of defence per hour."
            answer: true
            explanation: "TRUE. If the hourly cost of foraging exceeds the hourly cost of defence, then replacing foraging time with defence time always saves energy, making territorial behaviour beneficial."
          - letter: "Q19.3.4"
            text: "The birds will not show territorial defence when the net costs, incurred by defence, are lower than those of not defending a territory."
            answer: false
            explanation: "FALSE. This statement is logically inverted. If the net costs of defence are lower than the costs of not defending, the bird should defend. The bird will show territorial defence precisely when defence is the cheaper option."

      - id: q20
        number: "Q20"
        difficulty: "hard"
        name: "Flycatcher Song Dialects and Species Discrimination"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=39"
        subjects:
          - name: "Animal Communication"
            link: "/resources/9-ethology/animal-communication/"
        statements:
          - letter: "Q20.1"
            text: "These results support the existence of local song dialects in F. hypoleuca."
            answer: true
            explanation: "TRUE. In Figure 1B, individual songs of F. hypoleuca from the same location cluster together in PCA space, meaning birds from the same population have more similar songs than birds from different populations. This is the defining feature of local song dialects."
          - letter: "Q20.2"
            text: "These results support the idea that song differences between F. hypoleuca and F. albicollis evolved primarily as an adaptation to avoid cross-species hybridization."
            answer: false
            explanation: "FALSE. If song discrimination had evolved to prevent hybridization, we would expect significant nestling responses to differ between species only in sympatry (where both species coexist). However, Figure 2 shows significant discrimination in allopatry (P < 0.001) but not in sympatry (P = 0.136). Additionally, Figure 3 shows nestlings respond poorly to songs from other populations of the same species, which should not occur if the preference evolved solely to avoid hybridization."
          - letter: "Q20.3"
            text: "This study provides evidence that F. hypoleuca nestlings learn their songs from their social fathers."
            answer: false
            explanation: "FALSE. The question stem explicitly states that the nestlings' response rate did not correlate with how similar the played songs were to the songs of their social fathers. If nestlings learned from social fathers, they would respond more strongly to songs resembling their father's song. The lack of correlation provides evidence against learning from social fathers."
          - letter: "Q20.4"
            text: "It might be expected that genome-average genetic differences between F. hypoleuca populations will increase over time."
            answer: true
            explanation: "TRUE. Since nestlings discriminate songs at the dialect level, dialect differences could act as a reproductive barrier, reducing gene flow between populations. Reduced gene flow leads to increasing genetic divergence over time through drift and local adaptation."

      - id: q21
        number: "Q21"
        difficulty: "hard"
        name: "Guppy Mate-Choice Copying"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=43"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "Q21.A"
            type: "mcq"
            text: "Which experimental design tests the Schooling Hypothesis (females prefer the side where they have seen the larger number of fish)?"
            options: [{key: "1", text: "After the observation period, both the females were removed and a naive female, never exposed to males, was introduced and allowed to choose between the same two males"}, {key: "2", text: "Females were placed in the two end chambers of the test aquarium instead of males"}, {key: "3", text: "Two tests were carried out simultaneously in two aquaria invisible to one another, then males from the two aquaria were exchanged before the focal female chose"}, {key: "4", text: "One-way mirrors were placed between the test aquarium and each end chamber, so males saw their own images but the females saw through as if clear glass"}]
            answer: "2"
            explanation: "Experimental design 2 (replacing males with females in the end chambers) tests the schooling hypothesis. If the focal female simply prefers the side with more fish regardless of sex, she should still prefer the side with a model female. By using females instead of males, the sexual interaction component is removed while the 'more fish on one side' factor is preserved."
          - letter: "Q21.B"
            type: "mcq"
            text: "Which experimental design tests the No-Interaction Hypothesis (females prefer the side where they have seen a male and a female together but without sexual interaction)?"
            options: [{key: "1", text: "After the observation period, both the females were removed and a naive female, never exposed to males, was introduced and allowed to choose between the same two males"}, {key: "2", text: "Females were placed in the two end chambers of the test aquarium instead of males"}, {key: "3", text: "Two tests were carried out simultaneously in two aquaria invisible to one another, then males from the two aquaria were exchanged before the focal female chose"}, {key: "4", text: "One-way mirrors were placed between the test aquarium and each end chamber, so males saw their own images but the females saw through as if clear glass"}]
            answer: "4"
            explanation: "Experimental design 4 (one-way mirrors) tests the no-interaction hypothesis. With mirrors, each male sees only its own reflection and behaves as if no female is present, so no courtship interaction occurs. The focal female still sees a male and female on the same side but without any interaction between them. If the focal female still prefers the side with the model female, it is not the interaction that matters."
          - letter: "Q21.C"
            type: "mcq"
            text: "Which experimental design tests the Male-Activity Hypothesis (females prefer a male that was more active in the recent past)?"
            options: [{key: "1", text: "After the observation period, both the females were removed and a naive female, never exposed to males, was introduced and allowed to choose between the same two males"}, {key: "2", text: "Females were placed in the two end chambers of the test aquarium instead of males"}, {key: "3", text: "Two tests were carried out simultaneously in two aquaria invisible to one another, then males from the two aquaria were exchanged before the focal female chose"}, {key: "4", text: "One-way mirrors were placed between the test aquarium and each end chamber, so males saw their own images but the females saw through as if clear glass"}]
            answer: "1"
            explanation: "Experimental design 1 (replacing the focal female with a naive female) tests the male-activity hypothesis. If preference is driven by the male's increased activity during courtship, then any female (even one who never observed the interaction) should prefer the more active male. If the naive female shows no preference, then mere male activity is not enough, and the focal female must have actually observed and processed the social information."
          - letter: "Q21.D"
            type: "mcq"
            text: "Which experimental design tests the Female Sexual Priming Hypothesis (females who have seen a female-male encounter might choose males that behave as though they have just been involved in an interaction with a female)?"
            options: [{key: "1", text: "After the observation period, both the females were removed and a naive female, never exposed to males, was introduced and allowed to choose between the same two males"}, {key: "2", text: "Females were placed in the two end chambers of the test aquarium instead of males"}, {key: "3", text: "Two tests were carried out simultaneously in two aquaria invisible to one another, then males from the two aquaria were exchanged before the focal female chose"}, {key: "4", text: "One-way mirrors were placed between the test aquarium and each end chamber, so males saw their own images but the females saw through as if clear glass"}]
            answer: "3"
            explanation: "Experimental design 3 (swapping males between two simultaneous experiments) tests the female sexual priming hypothesis. If observing a male-female interaction simply primes the focal female to prefer any male that acts as if he recently courted, she should prefer the swapped-in 'courting' male. By exchanging males, the focal female now chooses between a male that courted (but was not the one she observed) and a male that did not court. If she shows no preference for the post-courtship male, then priming alone does not explain mate-choice copying."

      - id: q22
        number: "Q22"
        difficulty: "medium"
        name: "Mendel's Round and Wrinkled Peas: PCR Analysis"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=45"
        subjects:
          - name: "Mendelian Inheritance & Probability"
            link: "/resources/7-genetics/mendelian-inheritance-probability/"
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "Q22.1.1"
            type: "mcq"
            text: "Identify the parents for Cross I."
            options: [{key: "A", text: "Rr x RR"}, {key: "B", text: "rr x Rr"}, {key: "C", text: "Rr x Rr"}, {key: "D", text: "rr x RR"}]
            answer: "C"
            explanation: "Cross I shows three types of progeny on the gel: individuals with only the smaller band (RR), individuals with both bands (Rr), and individuals with only the larger band (rr), in an approximate 1:2:1 ratio. This pattern is diagnostic of a cross between two heterozygotes: Rr x Rr."
          - letter: "Q22.1.2"
            type: "mcq"
            text: "Identify the parents for Cross II."
            options: [{key: "A", text: "Rr x RR"}, {key: "B", text: "rr x Rr"}, {key: "C", text: "Rr x Rr"}, {key: "D", text: "rr x RR"}]
            answer: "B"
            explanation: "Cross II shows two types of progeny: individuals with both bands (Rr) and individuals with only the larger band (rr), in an approximate 1:1 ratio. This pattern is diagnostic of a testcross: rr x Rr."
          - letter: "Q22.2"
            type: "mcq"
            text: "In cross I, what kind of seeds does individual 3 produce when self-pollinated?"
            options: [{key: "A", text: "Round"}, {key: "B", text: "Wrinkled"}, {key: "C", text: "A mixture of round and wrinkled seeds"}, {key: "D", text: "All seeds are semi-wrinkled"}]
            answer: "B"
            explanation: "Individual 3 in Cross I shows only the larger band on the gel, meaning it is homozygous for the insertion allele (rr). When self-pollinated, rr x rr produces only rr offspring, which all have wrinkled seeds."
          - letter: "Q22.3"
            text: "Heterozygous seeds have higher levels of SBE1 activity compared to insertion homozygotes."
            answer: true
            explanation: "TRUE. Heterozygotes (Rr) produce round seeds because they have sufficient SBE1 activity from the functional R allele to produce starch. Insertion homozygotes (rr) have wrinkled seeds because the transposable element disrupts SBE1, eliminating its starch biosynthesis activity. Therefore heterozygotes have higher SBE1 activity."

      - id: q23
        number: "Q23"
        difficulty: "hard"
        name: "Genomic Imprinting Pedigree"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=47"
        subjects:
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
          - name: "Gene Regulation: Eukaryotic & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "Q23.1.1"
            text: "Individual II-2 has inherited an imprinted allele."
            answer: true
            explanation: "TRUE. All individuals inherit one allele from each parent, and in each generation the imprints are reset during gametogenesis. Therefore every individual carries an imprinted allele (the one from the parent whose gametes apply the imprint). II-2 inherited an imprinted allele from her father (I-1)."
          - letter: "Q23.1.2"
            text: "Gene X is paternally imprinted."
            answer: true
            explanation: "TRUE. Comparing the progeny of II-2/II-3 with those of II-5/II-6: both couples have carrier parents, but only the children of II-2/II-3 (where the father II-3 carries the mutant allele) show the disorder. The children of II-5/II-6 (where the mother II-5 carries the mutant allele) do not show the disorder despite being carriers. This indicates the allele inherited from the father is expressed (not imprinted), while the allele inherited from the mother is silenced (imprinted). Since the imprinting occurs during sperm formation, it is paternal imprinting: the paternally inherited allele is silenced."
          - letter: "Q23.2"
            type: "numeric"
            text: "Calculate the probability that individual IV-1 will be homozygous for the mutant allele. Give your answer as a decimal to two decimal places."
            expected: 0.25
            tolerance: 0.0
            explanation: "Both parents III-7 and III-8 are heterozygous carriers (Xx). The probability of their child being homozygous mutant (xx) = 1/4 = 0.25."
          - letter: "Q23.3"
            type: "numeric"
            text: "Calculate the probability that individual IV-1 will show the disorder. Give your answer as a decimal to two decimal places."
            expected: 0.50
            tolerance: 0.0
            explanation: "Gene X is paternally imprinted, meaning the allele inherited from the father is silenced. IV-1's father is III-8 (carrier). The child will show the disorder if they inherit the mutant allele from the mother (III-7, a carrier, 50% chance) because the maternal allele is expressed (not imprinted). The paternal allele is silenced regardless. So the probability of showing the disorder = probability of inheriting the mutant allele from the mother = 0.50."
          - letter: "Q23.4"
            type: "numeric"
            text: "If the individuals III-7 and III-8 had a third child, calculate the probability that it would be a son showing the disorder. Give your answer as a decimal to two decimal places."
            expected: 0.25
            tolerance: 0.0
            explanation: "The probability of being a son = 0.5. The probability of showing the disorder = 0.5 (inheriting the mutant allele from the mother, since the paternal allele is imprinted/silenced). Combined probability = 0.5 x 0.5 = 0.25."

      - id: q24
        number: "Q24"
        difficulty: "hard"
        name: "Identical-by-Descent Segments and Genetic Relatedness"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=48"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
        statements:
          - letter: "Q24.1.1"
            type: "numeric"
            text: "Expected fraction of the genome in IBD1 state between monozygotic twins (percentage)."
            expected: 0
            tolerance: 0
            explanation: "Monozygotic twins share identical genomes. At every position, both chromosomes are identical, so both alleles are shared (IBD2 state). There is no position where only one allele is shared (IBD1). Therefore IBD1 = 0%."
          - letter: "Q24.1.2"
            type: "numeric"
            text: "Expected fraction of the genome in IBD1 state between parent and offspring (percentage)."
            expected: 100
            tolerance: 0
            explanation: "A child inherits exactly one haploid genome from each parent. Assuming parents are unrelated, at every position the child shares exactly one allele with the parent (from the transmitted chromosome). IBD1 = 100%."
          - letter: "Q24.1.3"
            type: "numeric"
            text: "Expected fraction of the genome in IBD1 state between full siblings (percentage)."
            expected: 50
            tolerance: 0
            explanation: "At each locus, full siblings have a 25% chance of sharing both parental alleles (IBD2), 50% chance of sharing exactly one (IBD1), and 25% chance of sharing none (IBD0). IBD1 = 50%."
          - letter: "Q24.1.4"
            type: "numeric"
            text: "Expected fraction of the genome in IBD1 state between half-siblings (percentage)."
            expected: 50
            tolerance: 0
            explanation: "Half-siblings share one parent. From the shared parent, each child independently receives one of two chromosomes. The probability of receiving the same chromosome at a given locus is 50%. Since they share only one parent, there is no IBD2. IBD1 = 50%."
          - letter: "Q24.1.5"
            type: "numeric"
            text: "Expected fraction of the genome in IBD1 state between grandparent and grandchild (percentage)."
            expected: 50
            tolerance: 0
            explanation: "Parent-offspring share 100% IBD1. Across a second generation, recombination dilutes this by half. Grandparent-grandchild share approximately 50% IBD1."
          - letter: "Q24.2.1"
            type: "numeric"
            text: "Expected fraction of the genome in IBD2 state between monozygotic twins (percentage)."
            expected: 100
            tolerance: 0
            explanation: "Monozygotic twins have identical genomes. At every position, both alleles are shared. IBD2 = 100%."
          - letter: "Q24.2.2"
            type: "numeric"
            text: "Expected fraction of the genome in IBD2 state between parent and offspring (percentage)."
            expected: 0
            tolerance: 0
            explanation: "A child inherits only one chromosome from each parent, never both. Assuming unrelated parents, the child can never share both alleles with one parent. IBD2 = 0%."
          - letter: "Q24.2.3"
            type: "numeric"
            text: "Expected fraction of the genome in IBD2 state between full siblings (percentage)."
            expected: 25
            tolerance: 0
            explanation: "At each locus, the probability that two siblings received the same chromosome from both parents is 0.5 x 0.5 = 0.25. IBD2 = 25%."
          - letter: "Q24.2.4"
            type: "numeric"
            text: "Expected fraction of the genome in IBD2 state between half-siblings (percentage)."
            expected: 0
            tolerance: 0
            explanation: "Half-siblings share only one parent, so they can share at most one allele per locus. IBD2 = 0%."
          - letter: "Q24.2.5"
            type: "numeric"
            text: "Expected fraction of the genome in IBD2 state between grandparent and grandchild (percentage)."
            expected: 0
            tolerance: 0
            explanation: "A grandchild inherits DNA from the grandparent through an intermediate parent. At each locus, only one allele can come through this path. IBD2 = 0%."
          - letter: "Q24.3.1"
            text: "Notable biological variation in IBD sharing is expected for monozygotic twins."
            answer: false
            explanation: "FALSE. Monozygotic twins are genetically identical. There is no variation in their IBD sharing: it is always 100% IBD2."
          - letter: "Q24.3.2"
            text: "Notable biological variation in IBD sharing is expected for parent-offspring."
            answer: false
            explanation: "FALSE. A child always inherits exactly one haploid genome from each parent. The IBD sharing between parent and offspring is always 100% IBD1 with no variation."
          - letter: "Q24.3.3"
            text: "Notable biological variation in IBD sharing is expected for full siblings."
            answer: true
            explanation: "TRUE. Due to random segregation and recombination, full siblings can share more or less DNA than the expected 50% IBD1 and 25% IBD2. There is a nonzero probability of siblings sharing anywhere from nearly all to nearly none of their genome IBD."
          - letter: "Q24.3.4"
            text: "Notable biological variation in IBD sharing is expected for half-siblings."
            answer: true
            explanation: "TRUE. From the shared parent, each half-sibling independently receives one of two chromosomes at each locus (with recombination). Random segregation creates variation around the expected 50% IBD1."
          - letter: "Q24.3.5"
            text: "Notable biological variation in IBD sharing is expected for grandparent-grandchild."
            answer: true
            explanation: "TRUE. Recombination in the intermediate parent introduces stochasticity in which segments of the grandparent's genome are transmitted to the grandchild, creating variation around the expected 50% IBD1."
          - letter: "Q24.4.1"
            text: "On average, IBD segments shared between a parent and an offspring are longer compared to those shared between full siblings."
            answer: true
            explanation: "TRUE. Between parent and offspring, IBD segments span from one recombination breakpoint to the next within a single meiosis. Between siblings, IBD segments result from two independent meioses, so they are broken up by recombination events in both parents, producing shorter segments on average."
          - letter: "Q24.4.2"
            text: "If we trace one's family tree deep into the past, in the 30th generation we will find 2^30 people this individual shares IBD with."
            answer: false
            explanation: "FALSE. While the theoretical number of ancestors in the 30th generation is 2^30 (over 1 billion), pedigree collapse means many of these 'slots' are filled by the same individuals. Furthermore, due to the stochasticity of inheritance, an individual may share zero IBD with some distant ancestors. The actual number of ancestors who contribute detectable IBD is far fewer than 2^30."
          - letter: "Q24.4.3"
            text: "The fraction of IBD1 genome between two randomly picked individuals from a single population is higher in populations with smaller effective population size."
            answer: true
            explanation: "TRUE. A smaller effective population size means a smaller pool of ancestors, so any two randomly chosen individuals are more likely to share a recent common ancestor and therefore share more IBD segments."

      - id: q25
        number: "Q25"
        difficulty: "hard"
        name: "Nucleotide Diversity and Selective Sweeps"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=50"
        subjects:
          - name: "Population Genetics & Hardy-Weinberg Equilibrium"
            link: "/resources/15-evolution/population-genetics-hardy-weinberg-equilibrium/"
          - name: "Natural Selection: Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "Q25.1"
            type: "numeric"
            text: "Calculate the nucleotide diversity in this population. Give the correct answer to 3 decimal places."
            expected: 0.058
            tolerance: 0.001
            explanation: "Pairwise differences: A-B = 4/40 = 0.1, A-C = 2/40 = 0.05, B-C = 6/40 = 0.15. Frequencies: A = 0.5, B = 0.3, C = 0.2. Nucleotide diversity = 2(0.5)(0.3)(0.1) + 2(0.5)(0.2)(0.05) + 2(0.3)(0.2)(0.15) = 0.03 + 0.01 + 0.018 = 0.058."
          - letter: "Q25.2"
            type: "mcq"
            text: "Cheetahs were found to have significantly lower genome-wide genetic diversity than other mammals. Select the likeliest explanation."
            options: [{key: "A", text: "Cheetahs adapted very rapidly to the environment"}, {key: "B", text: "Cheetahs have an extremely high mutation rate"}, {key: "C", text: "The population of cheetahs went through a bottleneck in the recent past"}, {key: "D", text: "Natural selection is extremely efficient in removing mutations from cheetahs' gene pool"}]
            answer: "C"
            explanation: "A population bottleneck dramatically reduces genetic diversity genome-wide. Cheetahs are well-known for having experienced a severe bottleneck, resulting in very low effective population size and genetic diversity. Rapid adaptation, high mutation rate, or efficient selection would not explain a genome-wide reduction in diversity."
          - letter: "Q25.3"
            type: "mcq"
            text: "What is the most likely effect of the positively selected mutation in gene Y during domestication?"
            options: [{key: "A", text: "It results in an amino acid substitution in the encoded protein"}, {key: "B", text: "It affects splicing of gene Y"}, {key: "C", text: "It affects expression of gene Y"}, {key: "D", text: "It results in a premature stop codon in gene Y"}]
            answer: "C"
            explanation: "Figure 2 shows the selective sweep (reduced diversity in the crop) is localized to the upstream region of the gene, not the coding exons. Upstream mutations typically affect gene expression by altering promoter or regulatory sequences. Amino acid substitutions and premature stop codons would require mutations in coding regions, and splicing effects would require mutations at intron-exon boundaries."
          - letter: "Q25.4.1"
            text: "This data suggests purifying selection is acting more strongly on this locus in the wild ancestor than in the domesticated crop."
            answer: false
            explanation: "FALSE. Purifying selection removes deleterious variants, reducing nucleotide diversity. For this to be true, diversity should be lower in the wild ancestor. However, the wild ancestor (line 1) shows higher diversity than the crop (line 2), so the low diversity in the crop is due to a selective sweep during domestication, not stronger purifying selection in the wild."
          - letter: "Q25.4.2"
            text: "This data suggests, that in the wild ancestor, purifying selection is acting more strongly on the sequence upstream of exon 1 compared to the intron of gene Y."
            answer: false
            explanation: "FALSE. In the wild ancestor (line 1), diversity is high in the upstream region and similar or lower in other regions. Stronger purifying selection would produce lower diversity, not higher. The upstream region in the wild ancestor shows among the highest diversity, suggesting it is not under stronger purifying selection compared to the intron."
          - letter: "Q25.4.3"
            text: "No recombination occurred in the analysed region during the domestication process."
            answer: false
            explanation: "FALSE. If no recombination had occurred, the selective sweep in the upstream region would have dragged diversity down across the entire linked region, including the coding exons. However, diversity in the crop is low only in the upstream region and recovers in the exon/intron region, indicating that recombination broke the linkage between the upstream region and the rest of the gene."

      - id: q26
        number: "Q26"
        difficulty: "hard"
        name: "Transgenic Male Sterility and Herbicide Resistance"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=52"
        subjects:
          - name: "Mendelian Inheritance & Probability"
            link: "/resources/7-genetics/mendelian-inheritance-probability/"
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "Q26.1"
            type: "numeric"
            text: "What percentage of F1 progeny will be unable to produce fertile pollen?"
            expected: 0
            tolerance: 0
            explanation: "P1 (barnase::HR / -, hemizygous) x P2 (barstar::HR / barstar::HR, homozygous). F1 are either AaBb (barnase + barstar, so barstar inhibits barnase, restoring fertility) or aaBb (no barnase, naturally fertile). All F1 are male fertile. 0% are male sterile."
          - letter: "Q26.2"
            type: "numeric"
            text: "What percentage of F1 progeny will be herbicide resistant?"
            expected: 100
            tolerance: 0
            explanation: "All F1 carry at least one copy of the HR gene: AaBb carries HR from both linkage groups 2 and 3, while aaBb carries HR from linkage group 3 (from the homozygous P2 parent). All F1 are herbicide resistant. 100%."
          - letter: "Q26.3"
            type: "numeric"
            text: "What percentage of F2 progeny will be unable to produce fertile pollen? Give your answer to the nearest whole number."
            expected: 15
            tolerance: 6
            explanation: "F1 consists of 50% AaBb and 50% aaBb. Self-pollination of AaBb produces a 9:3:3:1 ratio (16 parts), of which 3 parts are A_bb (barnase without barstar, male sterile). Self-pollination of aaBb produces a 3:1 ratio (4 parts), all male fertile. Combining the ratio sets: 3 male sterile out of 20 total ratio parts = 15%. (Note: if weighted by equal F1 plant numbers, 3/32 = 9%. The official answer is 15%.)"
          - letter: "Q26.4"
            type: "numeric"
            text: "What percentage of F2 progeny will be herbicide resistant? Give your answer to the nearest whole number."
            expected: 90
            tolerance: 6
            explanation: "From AaBb selfing: 15/16 carry at least one HR gene. From aaBb selfing: 3/4 carry HR. Combining ratio sets: (15 + 3) / 20 = 18/20 = 90%. (Note: if weighted by equal F1 plant numbers, 27/32 = 84%. The official answer is 90%.)"

      - id: q27
        number: "Q27"
        difficulty: "medium"
        name: "Dog Body Size and the IGF1 Locus"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=53"
        subjects:
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "Q27.1.1"
            text: "The T allele is fully dominant to the C allele, which is fully recessive, in controlling dog size."
            answer: false
            explanation: "FALSE. The scatter plot shows that heterozygotes (CT) tend to have intermediate body sizes between CC and TT homozygotes, indicating co-dominance or additive effects rather than full dominance of T over C."
          - letter: "Q27.1.2"
            text: "IGF1 controls the majority of size variation of dogs."
            answer: false
            explanation: "FALSE. Dogs of the same genotype (e.g., all CT heterozygotes) range from about 2 kg to 35 kg, spanning most of the total size range. This large within-genotype variation shows that IGF1 genotype explains only a fraction of size variation, with other genes and environmental factors contributing substantially."
          - letter: "Q27.1.3"
            text: "The C/T SNP must only influence body size through changing levels of IGF1 in serum."
            answer: false
            explanation: "FALSE. While the plot shows a positive correlation between body mass and IGF1 serum levels, there is considerable scatter. The SNP could influence body size through other mechanisms beyond serum IGF1 levels, such as tissue-specific IGF1 activity, receptor sensitivity, or IGF1 binding proteins."
          - letter: "Q27.2"
            type: "mcq"
            text: "Based on the canid family SNP data, which hypothesis about the most recent common ancestors of domestic dogs is most likely?"
            options: [{key: "A", text: "The most recent common ancestors of domestic dogs were homozygous for the T allele"}, {key: "B", text: "The most recent common ancestors of domestic dogs were heterozygous for the T/C alleles"}, {key: "C", text: "The most recent common ancestors of domestic dogs were homozygous for the C allele"}]
            answer: "B"
            explanation: "Grey wolves (species K), the ancestors of domestic dogs, show both C (red) and T (yellow) alleles in their populations. Since wolves carry both alleles, the most recent common ancestors of domestic dogs likely had both alleles segregating in the population, meaning the ancestral population included heterozygous individuals."
          - letter: "Q27.3"
            type: "mcq"
            text: "Based on the canid family SNP data, which hypothesis about the allele history is most likely?"
            options: [{key: "A", text: "The C mutation in domestic dogs appeared recently and separately to the C allele found in other canid species"}, {key: "B", text: "The T mutation first appeared in wolves"}, {key: "C", text: "The T allele is older than the C allele"}]
            answer: "B"
            explanation: "Most canid species (foxes, jackals, etc.) are predominantly or exclusively CC (red markers). The T allele (yellow) appears mainly in wolves and dogs. By parsimony, the C allele is ancestral across the canid family, and the T mutation arose in the wolf lineage before dog domestication. This rules out A (C is shared across canids, not a recent dog mutation) and C (C is the older, ancestral allele)."

      - id: q28
        number: "Q28"
        difficulty: "medium"
        name: "Xylem Embolism and Hydraulic Safety Margins"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=56"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "Q28.1"
            text: "After maturity, xylem structure can no longer acclimate to environmental stress to reduce risk of embolism."
            answer: true
            explanation: "TRUE. Xylem conduits (tracheids and vessel elements) are dead cells at maturity. Once formed, their structural features (wall thickness, pit membrane properties, lumen diameter) are fixed and cannot be modified in response to environmental stress."
          - letter: "Q28.2"
            text: "Gymnosperms show greater hydraulic safety margins than angiosperms."
            answer: true
            explanation: "TRUE. In Figure a, the linear relationship between Psi_min and P50 for gymnosperms (red dots) is farther from the 1:1 line than for angiosperms (blue dots), indicating gymnosperms operate with a larger safety margin between their minimum xylem pressure and the pressure causing 50% conductivity loss."
          - letter: "Q28.3"
            text: "The safety margin quantifies the degree of conservatism in a plant's hydraulic strategy (plants with low safety margins experience higher risk of hydraulic failure)."
            answer: true
            explanation: "TRUE. The safety margin is the difference between the minimum xylem pressure a plant experiences and the pressure at which significant conductivity loss occurs. A smaller safety margin means the plant routinely operates closer to the point of hydraulic failure, indicating a riskier (less conservative) hydraulic strategy."
          - letter: "Q28.4"
            text: "There is global convergence in the vulnerability of forests to drought (all forest biomes are approximately equally vulnerable to hydraulic failure regardless of their current rainfall environment)."
            answer: true
            explanation: "TRUE. Figure b shows that safety margins are largely independent of mean annual precipitation. Forests in high-rainfall tropical environments have similarly narrow safety margins as those in dry Mediterranean woodlands. This global convergence means drought-induced forest decline can occur across all biomes, not just arid regions."

      - id: q29
        number: "Q29"
        difficulty: "medium"
        name: "Water Stress, Photosynthesis and Turgor"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=59"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
        statements:
          - letter: "Q29.1"
            text: "Photosynthetic rate is not as responsive to mild water stress as leaf expansion, because photosynthesis is much less sensitive to turgor than is leaf expansion."
            answer: true
            explanation: "TRUE. Figure 1 shows that leaf expansion (curve A) declines sharply at mild water stress (small decreases in leaf water potential), while photosynthesis (curve B) remains relatively stable until more severe stress. Leaf expansion is driven directly by turgor pressure, making it highly sensitive to turgor loss. Photosynthesis is primarily limited by stomatal conductance and biochemical capacity, not directly by turgor."
          - letter: "Q29.2"
            text: "As stomata close during early stages of water stress, water-use efficiency may increase because stomatal closure inhibits transpiration more than it decreases intercellular CO2 concentrations."
            answer: true
            explanation: "TRUE. Stomatal closure reduces both water loss (transpiration) and CO2 uptake. However, the reduction in transpiration is proportionally greater than the reduction in intercellular CO2 concentration, because the driving gradient for water loss is much steeper than for CO2 uptake. This results in higher water-use efficiency (more CO2 fixed per unit water lost) during early, mild water stress."
          - letter: "Q29.3"
            text: "Growth slows down when stress reduces turgor. Turgor needs to decrease to zero to eliminate leaf expansion."
            answer: false
            explanation: "FALSE. Figure 2 shows that the x-intercept (Y) of the growth rate vs turgor relationship is positive, not zero. This means leaf expansion ceases at a positive turgor value (the yield threshold), not at zero turgor. Cell expansion requires turgor to exceed a minimum threshold to stretch the cell wall."
          - letter: "Q29.4"
            text: "Plant 1 was pre-stressed by growing it with limited soil water to produce mild water stress. Plant 2 was grown with ample water."
            answer: false
            explanation: "FALSE. The labels are reversed. Plant 1 (with higher turgor and higher growth rate at a given turgor) was grown with ample water. Plant 2 (lower turgor, lower growth rate) was the pre-stressed plant. Pre-stressing (osmotic adjustment) typically lowers the yield threshold, which is seen in Plant 2 having a lower Y value."

      - id: q30
        number: "Q30"
        difficulty: "hard"
        name: "Wheat Nitrogen Assimilation Under Elevated CO2"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=61"
        subjects:
          - name: "Mineral Nutrition & Nutrient Uptake"
            link: "/resources/5-plant-physiology/mineral-nutrition-nutrient-uptake/"
          - name: "Calvin Cycle, Photorespiration, C4 & CAM"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "Q30.1"
            text: "Whether the form in which N was supplied affects shoot and stem growth depends on ambient CO2 levels."
            answer: true
            explanation: "TRUE. Figure 1 shows that at ambient CO2, shoot and stem biomass are similar between NH4+ and NO3- treatments. At elevated CO2, the NH4+ treatment shows significantly greater growth than NO3-, demonstrating that the effect of N form on growth depends on the CO2 regime."
          - letter: "Q30.2"
            text: "The plants receiving NH4+ were more responsive to CO2 enrichment than those receiving NO3-."
            answer: true
            explanation: "TRUE. Leaf area increased 49% under NH4+ nutrition with elevated CO2, but only 24% under NO3- nutrition. Total plant biomass increased 78% under NH4+ but only 44% under NO3-. Plants with NH4+ as the nitrogen source showed a greater growth response to elevated CO2."
          - letter: "Q30.3"
            text: "Under the two CO2 regimes, the N absorption per unit plant mass remained unchanged."
            answer: true
            explanation: "TRUE. Figure 2 shows that total N concentration in shoots and roots was similar across CO2 treatments (statistical letters indicate no significant differences within N source). Despite differences in biomass, the N concentration per unit mass was maintained."
          - letter: "Q30.4"
            text: "The fate of N, after it was absorbed, was similar under ambient and elevated CO2 as demonstrated by the balance of inorganic and organic N."
            answer: false
            explanation: "FALSE. Figure 2 shows that the balance between organic N (protein) and inorganic N (NO3-) differed between CO2 treatments. Under elevated CO2, shoot NO3- concentration increased and protein concentration showed different patterns, indicating that N assimilation (conversion from inorganic to organic form) was affected by CO2 levels."
          - letter: "Q30.5"
            text: "In vitro shoot activities of NO3- reductase and NO2- reductase changed compared to roots in the different CO2 regimes."
            answer: true
            explanation: "TRUE. Figure 2 shows that shoot NR and NiR activities differed significantly between CO2 treatments (indicated by different statistical letters), while root enzyme activities remained similar across treatments (same statistical letters). This demonstrates that elevated CO2 specifically affected shoot nitrogen assimilation enzymes."
          - letter: "Q30.6"
            text: "The results suggest that rising atmospheric CO2 will favor taxa that either prefer NH4+ as a nitrogen source, or assimilate NO3- primarily in their roots."
            answer: true
            explanation: "TRUE. The data show that elevated CO2 inhibits shoot NO3- photoassimilation but does not affect root NO3- assimilation or NH4+ utilization. Plants that use NH4+ directly or that assimilate NO3- in roots rather than shoots would avoid this inhibition, giving them a competitive advantage under rising CO2."

      - id: q31
        number: "Q31"
        difficulty: "easy"
        name: "Plant Biology Assertion-Reason Questions"
        link: "/papers/ibo/2023/theoretical-1-exam.pdf#page=64"
        subjects:
          - name: "Light Reactions & Photophosphorylation"
            link: "/resources/5-plant-physiology/light-reactions-photophosphorylation/"
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "Q31.1"
            type: "mcq"
            text: "Assertion: Water is oxidized to oxygen during the light-dependent reactions of photosynthesis. Reason: Water oxidation is carried out by the photosystem I complex."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "c"
            explanation: "The assertion is true: water splitting during light reactions produces O2. The reason is false: water oxidation is carried out by Photosystem II (at the oxygen-evolving complex), not Photosystem I."
          - letter: "Q31.2"
            type: "mcq"
            text: "Assertion: Cytokinins exhibit polar transport in plants. Reason: By using the polar transport system, cytokinin movement can be maintained regardless of changes in phloem transport."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "d"
            explanation: "The assertion is false. Polar transport in plants is a characteristic of auxins, not cytokinins. Cytokinins are transported primarily via the xylem and phloem, not through a polar transport system."
          - letter: "Q31.3"
            type: "mcq"
            text: "Assertion: There is a meristematic phase of growth at both the root apex and shoot apex, because the cells are constantly dividing. Reason: There is a lot of protoplasm in the cells of this region, but no nucleus."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "c"
            explanation: "The assertion is true: meristematic cells at root and shoot apices divide actively. The reason is false: meristematic cells contain a large, prominent nucleus (essential for mitosis), not 'no nucleus.' They are rich in protoplasm, but they definitely have nuclei."
          - letter: "Q31.4"
            type: "mcq"
            text: "Assertion: A plant exposed to high salinity stress exhibits reduced transpiration rate compared to a plant growing under normal conditions. Reason: Water conduction in plant tissues is regulated by an equilibrium between water absorbed by the roots and water transpired from the leaves."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "a"
            explanation: "Both are true, and the reason explains the assertion. High soil salinity reduces the water potential gradient driving root water uptake, which reduces the water available for transpiration. The equilibrium between absorption and transpiration means that when absorption is limited, transpiration must also decrease."
          - letter: "Q31.5"
            type: "mcq"
            text: "Assertion: Plants produce many phenolic compounds that play an important role in their defense responses. Any manipulation in the production of phenolic compounds through genetic engineering would always lead to drastic retardation in plant growth and development. Reason: Phenolic compounds are primary metabolites that regulate cell growth and development at many stages."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "d"
            explanation: "The assertion is false. While plants do produce phenolic compounds for defense, the claim that 'any manipulation would always lead to drastic retardation' is too absolute. Additionally, phenolic compounds are secondary metabolites (not primary metabolites as stated in the reason), so the reason is also false."
          - letter: "Q31.6"
            type: "mcq"
            text: "Assertion: It is not possible for plants to utilize atmospheric nitrogen for their metabolism. As a result, they require nitrogen-fixing microorganisms (e.g. rhizobia) in the soil to provide nitrogen in usable form. Reason: The nitrogen fixed by Rhizobium is used in their own metabolism and becomes available to plants and fungi only when they die and decay."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "c"
            explanation: "The assertion is true: plants cannot fix atmospheric N2 themselves and rely on microorganisms. The reason is false: Rhizobium bacteria live symbiotically within root nodules and directly convert atmospheric nitrogen into forms (ammonia/nitrate) that the host plant can use. The fixed nitrogen does not become available only upon bacterial death."
          - letter: "Q31.7"
            type: "mcq"
            text: "Assertion: Plant cells may die if they are exposed to severe abiotic stress like heat, salinity, drought etc. for a long period. Reason: In response to abiotic stresses, among other pathologies, plants produce reactive oxygen species (ROS), which are highly reactive and toxic."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "a"
            explanation: "Both are true, and the reason correctly explains the assertion. Severe abiotic stress leads to ROS accumulation, which damages proteins, lipids, carbohydrates, and DNA, ultimately leading to cell death."
          - letter: "Q31.8"
            type: "mcq"
            text: "Assertion: Sepals, petals, stamens and pistils are parts of a flower. Reason: The petiole and lamina are parts of the stem."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "c"
            explanation: "The assertion is true: sepals, petals, stamens, and pistils are the four whorls of a flower. The reason is false: the petiole and lamina are parts of a leaf, not the stem."
          - letter: "Q31.9"
            type: "mcq"
            text: "Assertion: Green leaves make their energy-rich compounds by the process of photosynthesis. Reason: Plants use CO2 and water in the presence of sunlight to make energy-rich compounds."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "a"
            explanation: "Both are true, and the reason correctly explains the assertion. Photosynthesis uses light energy, CO2, and water to produce sugars (energy-rich compounds) through the light reactions (in thylakoids) and the Calvin cycle (in stroma)."
          - letter: "Q31.10"
            type: "mcq"
            text: "Assertion: Hydroponically grown plants (grown in the absence of soil) are grown in a nutrient solution in which air is bubbled. Reason: The bubbling solution increases the relative humidity within the plant chamber which is needed for plant growth."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "c"
            explanation: "The assertion is true: air is bubbled through hydroponic nutrient solutions to provide oxygen for root respiration. The reason is false: the purpose of bubbling is to oxygenate the root zone, not to increase humidity. Water and nutrient solutions alone do not contain enough dissolved oxygen for aerobic respiration."
          - letter: "Q31.11"
            type: "mcq"
            text: "Assertion: All cells of a plant have almost identical DNA, but there are different cell types and tissues within a plant. Reason: Factors such as internal environment, hormones, light/dark etc. determine which subset of the genome is expressed."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "a"
            explanation: "Both are true, and the reason explains the assertion. Despite having (nearly) identical genomes, plant cells differentiate into various types because internal and external signals regulate differential gene expression, producing distinct cell identities and tissue types."
          - letter: "Q31.12"
            type: "mcq"
            text: "Assertion: In general, dicotyledonous mesophyte leaves have fewer stomata and thicker cuticle on their upper surface, compared to their lower surface. Reason: The upper surface of the leaves is exposed to greater light intensity."
            options: [{key: "a", text: "Both Assertion and Reason are true, and the Reason is the correct explanation of Assertion"}, {key: "b", text: "Both Assertion and Reason are true, but Reason is not the correct explanation of Assertion"}, {key: "c", text: "Assertion is true, but Reason is false"}, {key: "d", text: "Assertion is false"}]
            answer: "a"
            explanation: "Both are true, and the reason explains the assertion. The upper (adaxial) leaf surface receives more direct sunlight and heat, which would increase transpirational water loss. Having fewer stomata and a thicker cuticle on the upper surface reduces water loss from this more exposed surface."
  - id: theoretical-2
    name: "Theoretical 2"
    durationMinutes: 180
    papers:
      - category: "Theoretical 2"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf"
        linkLabel: "Exam + Official Answer Key & Solutions"
    problems:
      - id: q1
        number: "Q1"
        difficulty: "easy"
        name: "Desert Bat Adaptations"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=4"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "Q1.1"
            text: "The closable nostrils, and the fringe of hairs around the mouth, limit the penetration of dust and sand into the bat's nose and mouth."
            answer: true
            explanation: "Closable nostrils and hair fringes around the mouth are adaptations that prevent sand and dust particles from entering the respiratory and digestive tracts, a clear advantage for a desert-dwelling bat."
          - letter: "Q1.2"
            text: "The long tail is an adaptation for crawling, gripping and balancing in areas with dense stands of trees and shrubs."
            answer: false
            explanation: "This is a desert species that does not encounter dense vegetation. The long tail serves a different purpose; it is not an arboreal adaptation."
          - letter: "Q1.3"
            text: "Having relatively sparse hair and large areas of loose skin facilitates thermoregulation in hot desert conditions."
            answer: true
            explanation: "Hairless or sparsely furred areas serve as thermal windows, allowing heat dissipation in the hot desert environment."
          - letter: "Q1.4"
            text: "Active flight, as a low-energy mode of locomotion, helps bats conserve energy in desert conditions with poor food sources."
            answer: false
            explanation: "Active flight is extremely energy-consuming, not a low-energy mode of locomotion. While flight allows bats to cover large distances efficiently, the premise that it is low-energy is incorrect."
          - letter: "Q1.5"
            text: "The ability to fly allows bats to efficiently cover considerable distances between suitable roosts and unevenly distributed food sources in the desert."
            answer: true
            explanation: "Bats form colonies in suitable roosts and fly considerable distances to dispersed food sources. Flight enables efficient travel across the desert landscape to reach patchy resources."

      - id: q2
        number: "Q2"
        difficulty: "medium"
        name: "Arabian Lizard Diversity"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=5"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
          - name: "Major Taxa Cross-Reference"
            link: "/resources/4-biosystematics/major-taxa-cross-reference/"
        statements:
          - letter: "Q2.1"
            text: "Assuming the pictures were taken in daylight, lizards 3 and 6 are nocturnal lizards."
            answer: true
            explanation: "Lizards 3 and 6 have large eyes with vertically slit pupils, characteristic of nocturnal geckos that need to maximize light capture at night while protecting their sensitive retinas during the day."
          - letter: "Q2.2"
            text: "Lizard 1 could be adapted to live in limestone caves."
            answer: true
            explanation: "Lizard 1 is pale/albinistic, consistent with cave-dwelling organisms that have reduced pigmentation due to the absence of light."
          - letter: "Q2.3"
            text: "Lizards 7 and 8 are both ground-dwelling predators."
            answer: false
            explanation: "Although both may be ground-dwelling, their morphologies suggest different ecological niches rather than both being predators."
          - letter: "Q2.4"
            text: "Compared to other lizards in the pictures, lizards 2 and 5 display a morphological characteristic typical of animals adapted to living in colder areas."
            answer: false
            explanation: "Lizards 2 and 5 do not display features typical of cold-adapted animals such as Allen's rule (shorter extremities). Their morphological characteristics suggest other ecological adaptations."
          - letter: "Q2.5"
            text: "Lizards 3 and 8 are fully homeothermic."
            answer: false
            explanation: "All lizards are ectothermic (poikilothermic) reptiles. No lizard is fully homeothermic."
          - letter: "Q2.6"
            text: "Lizards 5 and 6 have the necessary adaptations for burrowing."
            answer: false
            explanation: "Lizards 5 and 6 do not display typical burrowing adaptations such as a shovel-shaped snout, reduced limbs, or smooth scales. Their morphologies suggest other lifestyles."

      - id: q3
        number: "Q3"
        difficulty: "medium"
        name: "Shell Drilling Predation"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=7"
        subjects:
          - name: "Invertebrate Body Plans"
            link: "/resources/2-animal-anatomy/invertebrate-body-plans-2/"
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "Q3.1"
            text: "Hunting snails prefer to drill the anterior end of sea carpet bags and avoid the distal end of shells."
            answer: false
            explanation: "The distribution of holes shows that drilling in areas A and D is equally preferable (49 holes in A, 51 holes in D), while areas B and C had far fewer holes (14 and 17 respectively). Both ends are equally targeted."
          - letter: "Q3.2"
            text: "The sea carpet bag probably has two muscle-adductors, the first in area A and the second in area D."
            answer: true
            explanation: "The equal preference for drilling in areas A and D suggests muscle-adductors are located in both regions, since snails drill near adductor muscles to inject poison that relaxes them."
          - letter: "Q3.3"
            text: "Hunting snails are one of the major predators of sea carpet bags."
            answer: true
            explanation: "94 out of 100 shells have drilling holes, indicating that hunting snails are a very significant source of mortality for sea carpet bags."
          - letter: "Q3.4"
            text: "From the data, we could conclude that if the first drilling does not result in bivalve opening, hunting snails prefer to repeat their attack on the same sea carpet bag."
            answer: true
            explanation: "35 shells show multiple drilling holes (pairwise and triple combinations), indicating that snails frequently re-attack the same individual rather than moving to a new target."
          - letter: "Q3.5"
            text: "A possible explanation to the data is that some hunting snails could be drilling sea carpet bags which are already dead."
            answer: true
            explanation: "11 single holes are placed in areas B and C, far from muscle-adductors, where drilling would not help open the shell. This suggests some snails may be drilling already-dead bivalves."

      - id: q4
        number: "Q4"
        difficulty: "medium"
        name: "Whitefly Horizontal Gene Transfer"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=9"
        subjects:
          - name: "Recombinant DNA & Biotechnology"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "Q4.1"
            text: "White flies have acquired BtPMaT1 by horizontal gene transfer."
            answer: true
            explanation: "A plant gene has moved and integrated into the whitefly genome by non-sexual means. Since BtPMaT1 has closest homologs in plants but no homologs in other arthropods, this is horizontal gene transfer by definition."
          - letter: "Q4.2"
            text: "BtPMaT1 plays a pivotal role in the detoxification of all the phenolic glycosides produced by the tomato leaves."
            answer: false
            explanation: "BtPMaT1 expression reduced mortality against some phenolic glycosides (compounds B, C, and D) but not against compounds E and F, as there was no statistically significant difference for those compounds."
          - letter: "Q4.3"
            text: "Expression of BtPMaT1 in all the developmental stages of B. tabaci indicates that it is a plant gene contaminant, rather than part of the fly genome."
            answer: false
            explanation: "Expression was found in eggs, a stage which does not feed on plants. This rules out plant contamination and confirms the gene is integrated into the whitefly genome."
          - letter: "Q4.4"
            text: "BtPMaT1 must be present in all the whiteflies belonging to genus Bemisia."
            answer: false
            explanation: "The gene has closest homologs in plants but no homologs in other arthropods. This indicates it was acquired specifically by B. tabaci and is not necessarily present in all Bemisia species."
          - letter: "Q4.5"
            text: "Whiteflies feeding on dsRNA expressing tomato plants had reduced ability to neutralize the phenolic glycosides because siRNA expressing plants started overproducing the phenolics."
            answer: false
            explanation: "The plants did not overproduce phenolics. Rather, whiteflies feeding on the transformed tomato leaves acquired siRNAs against BtPMaT1, which silenced the gene and eliminated the whiteflies' ability to neutralize the phenolic glycosides."

      - id: q5
        number: "Q5"
        difficulty: "hard"
        name: "Angler Fish Immunity and Mating"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=12"
        subjects:
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "Q5.1"
            text: "All angler fishes have an adaptive immune system which works in a similar way to humans."
            answer: false
            explanation: "Three of the four angler fish species shown are partly or completely immunodeficient, lacking key components of the adaptive immune system such as Rag1 (needed for V(D)J recombination) or Aicda (needed for antibody maturation)."
          - letter: "Q5.2"
            text: "Lack of some immune system components could help angler fish male and female bodies to sustainably fuse."
            answer: true
            explanation: "Females that lack transplantation immunity would not reject attached males. The absence of key immune components removes the immunological barrier to permanent tissue fusion between individuals."
          - letter: "Q5.3"
            text: "Females of the angler fish Haplophryne mollis (D) use mating strategy 3."
            answer: true
            explanation: "The drawing of Haplophryne mollis shows two miniature males permanently fused to the female body, consistent with mating strategy 3 (several miniature males fused to a female, sharing a circulatory system)."
          - letter: "Q5.4"
            text: "The angler fish Dicertis pileatus (C) has modified B cell immunity."
            answer: true
            explanation: "Dicertis pileatus lacks the Aicda gene, which encodes cytidine deaminase required for antibody class switching and affinity maturation in B cells. This directly impairs B cell function."
          - letter: "Q5.5"
            text: "The angler fish Ceratias tentaculatus (A) has modified T-cell immunity."
            answer: true
            explanation: "Ceratias tentaculatus lacks both Cd8a and Cd8b genes, which encode MHC I co-receptors needed for T killer cell antigen recognition, directly impairing T cell function."

      - id: q6
        number: "Q6"
        difficulty: "easy"
        name: "Missing Cell Types in Adults"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=14"
        subjects:
          - name: "Cell Theory, Prokaryotes & Eukaryotes"
            link: "/resources/1-cell-molecular/cell-theory-prokaryotes-eukaryotes/"
        statements:
          - letter: "Q6.1"
            text: "Brown adipocytes (necessary for non-shivering thermogenesis) are fully missing in mature adult humans."
            answer: false
            explanation: "Brown fat tissue rudiments are still present in the adult body, particularly in the neck region and around the kidneys."
          - letter: "Q6.2"
            text: "Ameloblasts (responsible for the formation of the enamel) are fully missing in mature adult humans."
            answer: true
            explanation: "Ameloblasts form enamel during tooth development but are lost from the tooth structure once enamel formation is complete. Humans have only two sets of teeth, and ameloblasts do not persist after enamel is laid down."
          - letter: "Q6.3"
            text: "Neuronal stem cells in the central nervous system are fully missing in mature adult humans."
            answer: false
            explanation: "Odontoblasts (forming dentin) persist lifelong inside teeth. Similarly, some neural stem cells persist in specific brain regions. The statement about neuronal stem cells being fully missing is incorrect."
          - letter: "Q6.4"
            text: "Totipotent stem cells are fully missing in mature adult humans."
            answer: true
            explanation: "Totipotent stem cells are present only during very early ontogeny (zygote and early blastomeres). They are completely absent from the fully developed adult human body."

      - id: q7
        number: "Q7"
        difficulty: "medium"
        name: "Elysia Kleptoplasty and Regeneration"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=15"
        subjects:
          - name: "Mitochondria, Chloroplasts & Endosymbiosis"
            link: "/resources/1-cell-molecular/mitochondria-chloroplasts-structure-origin/"
        statements:
          - letter: "Q7.1"
            text: "The observation suggests that most of the body of Elysia marginata may die except for the head after autotomy."
            answer: true
            explanation: "By comparing the dissected animal (A) with the regenerating pieces (B-D), it is clear that the head begins to regenerate a new body, while the rest of the body does not survive."
          - letter: "Q7.2"
            text: "In the initial phase of body regeneration, energy is obtained from the digestion of food in the digestive tract."
            answer: false
            explanation: "After autotomy, the head segment has no digestive tract (it was removed with the body). There is no digestive system available to process food during early regeneration."
          - letter: "Q7.3"
            text: "Kleptoplasty, the relationship between chloroplasts and Elysia marginata, is a form of symbiosis."
            answer: true
            explanation: "During the initial phase of body regeneration (when there is no digestive tract), photosynthesis by the stolen chloroplasts is the only source of organic compounds. The chloroplasts in turn need the Elysia cells to function. This mutual dependence constitutes symbiosis."
          - letter: "Q7.4"
            text: "Kleptoplasty is indispensable for the survival of an individual after autotomy."
            answer: true
            explanation: "Scientists observed body regeneration only in individuals with kleptoplasty. Without the energy from photosynthesizing chloroplasts, the head piece cannot sustain itself long enough to regenerate a new body."

      - id: q8
        number: "Q8"
        difficulty: "hard"
        name: "Chromatin DNase Sensitivity"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=16"
        subjects:
          - name: "Gene Regulation & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "Q8.a"
            type: "mcq"
            text: "Cell type a) corresponds to which autoradiogram?"
            options: [{key: "A", text: "Autoradiogram A"}, {key: "B", text: "Autoradiogram B"}, {key: "C", text: "Autoradiogram C"}, {key: "D", text: "Autoradiogram D"}]
            answer: "B"
            explanation: "Pancreatic islet of Langerhans cells (type a) express actin, histone H2A, and insulin simultaneously. Autoradiogram B shows all four gene bands with insulin (3 kb) remaining sensitive to DNase, matching the unique expression profile of beta cells."
          - letter: "Q8.b"
            type: "mcq"
            text: "Cell type b) corresponds to which autoradiogram?"
            options: [{key: "A", text: "Autoradiogram A"}, {key: "B", text: "Autoradiogram B"}, {key: "C", text: "Autoradiogram C"}, {key: "D", text: "Autoradiogram D"}]
            answer: "A"
            explanation: "Hepatocytes (type b) can be identified by exclusion once the other three cell types are positively matched to their autoradiograms. Autoradiogram A corresponds to hepatocytes."
          - letter: "Q8.c"
            type: "mcq"
            text: "Cell type c) corresponds to which autoradiogram?"
            options: [{key: "A", text: "Autoradiogram A"}, {key: "B", text: "Autoradiogram B"}, {key: "C", text: "Autoradiogram C"}, {key: "D", text: "Autoradiogram D"}]
            answer: "D"
            explanation: "Spermatids (type c) replace histones with protamines during differentiation. Autoradiogram D shows the histone H2A band (2.5 kb) being resistant to DNase at all concentrations, consistent with histones being replaced and the histone gene being silenced."
          - letter: "Q8.d"
            type: "mcq"
            text: "Cell type d) corresponds to which autoradiogram?"
            options: [{key: "A", text: "Autoradiogram A"}, {key: "B", text: "Autoradiogram B"}, {key: "C", text: "Autoradiogram C"}, {key: "D", text: "Autoradiogram D"}]
            answer: "C"
            explanation: "Skeletal muscle cells (type d) are the only cell type that expresses the acetylcholine receptor (3.3 kb band), used to bind acetylcholine at the neuromuscular junction. Autoradiogram C shows this band being DNase-sensitive."

      - id: q9
        number: "Q9"
        difficulty: "medium"
        name: "Microglia and Memory Forgetting"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=18"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "Q9.1"
            text: "Forgetting is an active process involving microglial cells."
            answer: true
            explanation: "The change in forgetting levels when microglia are depleted by Pexidartinib (PLX) demonstrates that forgetting is actively mediated by microglial cells, not a passive decay process."
          - letter: "Q9.2"
            text: "The microglial population is usually self-renewing, rather than replaced by bone-marrow cells."
            answer: true
            explanation: "Microglia are tissue-resident macrophages derived from early embryonic haematopoiesis. They are generally self-renewing within the brain tissue, independent of bone marrow haematopoiesis."
          - letter: "Q9.3"
            text: "Depletion of the microglia in the brain leads to an enhanced ability to forget the behavioural response."
            answer: false
            explanation: "The data show the opposite: microglial depletion with PLX leads to enhanced memory retention (less forgetting), not enhanced forgetting. Without microglia to actively remove synapses, memories persist longer."
          - letter: "Q9.4"
            text: "Given that the result in (D) could be mimicked by the application of an inhibitor of phagocytosis, the potential mechanism explaining the results is physical removal of the synapse by microglial phagocytosis."
            answer: true
            explanation: "If inhibiting phagocytosis produces the same effect as depleting microglia, this supports the hypothesis that microglia physically engulf and remove synapses through phagocytosis, thereby facilitating the forgetting process."

      - id: q10
        number: "Q10"
        difficulty: "medium"
        name: "Cardiac Cell 14C Dating"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=20"
        subjects:
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "Q10.1"
            text: "Myosin is the molecule within a cell most likely to maintain the original ratio of the C12 and C14 from when the cell was formed."
            answer: false
            explanation: "DNA is the only molecule with the potential to be physically maintained for decades in a cell. Proteins like myosin are constantly turned over. Rare exceptions like crystallin in the eye lens exist, but myosin is not one of them."
          - letter: "Q10.2"
            text: "These data show cardiomyocytes are able to increase their volume over time."
            answer: true
            explanation: "The graph shows a constant number of cardiomyocytes, yet the heart clearly grows during childhood and puberty and can enlarge with training. Since cell number stays constant, individual cells must increase in volume. One mechanism is multinucleation."
          - letter: "Q10.3"
            text: "These data show adults possess only small amounts, if any, cardiomyocyte stem cells."
            answer: true
            explanation: "The very low annual cell turnover rates for cardiomyocytes shown in the data are consistent with minimal stem cell activity. If abundant cardiomyocyte stem cells existed, turnover rates would be higher."
          - letter: "Q10.4"
            text: "The half-life of 14C must be taken into account when interpreting the results."
            answer: false
            explanation: "Carbon-14 has a half-life of approximately 5,730 years. Over a human lifetime of decades, the decay of 14C is negligible and does not need to be accounted for when interpreting these results."

      - id: q11
        number: "Q11"
        difficulty: "medium"
        name: "Kartagener Syndrome"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=22"
        subjects:
          - name: "Cytoskeleton & Motor Proteins"
            link: "/resources/1-cell-molecular/cytoskeleton-motor-proteins/"
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "Q11.1"
            text: "Due to the impairment of fluid currents in embryonal development, affected individuals can exhibit disturbance in the determination of the right-left symmetry of internal organs."
            answer: true
            explanation: "Kartagener syndrome affects dynein arms in motile cilia. Nodal cilia during embryonic development generate fluid flow that establishes left-right body asymmetry. Dysfunctional cilia can result in situs inversus."
          - letter: "Q11.2"
            text: "Symptoms include disturbance of the movement of digestive material in the gastrointestinal tract."
            answer: false
            explanation: "The gastrointestinal tract primarily relies on smooth muscle peristalsis, not motile cilia. Ciliary dysfunction does not significantly impair gut motility."
          - letter: "Q11.3"
            text: "Symptoms include reduced mucus clearance from the lungs leading to chronic recurrent respiratory infections."
            answer: true
            explanation: "Motile cilia lining the respiratory tract are responsible for mucociliary clearance. Dysfunctional dynein arms impair ciliary beating, leading to poor mucus clearance and recurrent infections."
          - letter: "Q11.4"
            text: "Symptoms include reduction in fertility in females due to immobility of the oocyte/early embryo in the fallopian tube."
            answer: true
            explanation: "Cilia lining the fallopian tube help transport the oocyte/early embryo toward the uterus. Dysfunctional cilia impair this transport, reducing female fertility."
          - letter: "Q11.5"
            text: "Couples where the males have this condition often need In-vitro fertilization (IVF) assistance to conceive."
            answer: true
            explanation: "Sperm flagella use the same dynein motor system as motile cilia. Males with Kartagener syndrome have immotile or poorly motile sperm, requiring IVF for conception."

      - id: q12
        number: "Q12"
        difficulty: "medium"
        name: "Visual Pathway Interruptions"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=24"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
          - name: "Human Sensory Organs"
            link: "/resources/2-animal-anatomy/human-sensory-organs/"
        statements:
          - letter: "Q12.A"
            type: "mcq"
            text: "Visual path interruption A corresponds to which visual defect?"
            options: [{key: "1", text: "Visual defect 1"}, {key: "2", text: "Visual defect 2"}, {key: "3", text: "Visual defect 3"}, {key: "4", text: "Visual defect 4"}]
            answer: "3"
            explanation: "Interruption at point A affects specific nerve fibers in the visual pathway, producing the characteristic visual field loss pattern shown in defect 3."
          - letter: "Q12.B"
            type: "mcq"
            text: "Visual path interruption B corresponds to which visual defect?"
            options: [{key: "1", text: "Visual defect 1"}, {key: "2", text: "Visual defect 2"}, {key: "3", text: "Visual defect 3"}, {key: "4", text: "Visual defect 4"}]
            answer: "4"
            explanation: "Interruption at point B affects the optic tract after the chiasm, producing the homonymous hemianopia pattern shown in defect 4."
          - letter: "Q12.C"
            type: "mcq"
            text: "Visual path interruption C corresponds to which visual defect?"
            options: [{key: "1", text: "Visual defect 1"}, {key: "2", text: "Visual defect 2"}, {key: "3", text: "Visual defect 3"}, {key: "4", text: "Visual defect 4"}]
            answer: "2"
            explanation: "Interruption at point C produces the visual field loss pattern shown in defect 2, based on which nerve fibers are affected at that location."
          - letter: "Q12.D"
            type: "mcq"
            text: "Visual path interruption D corresponds to which visual defect?"
            options: [{key: "1", text: "Visual defect 1"}, {key: "2", text: "Visual defect 2"}, {key: "3", text: "Visual defect 3"}, {key: "4", text: "Visual defect 4"}]
            answer: "1"
            explanation: "Interruption at point D severs the optic nerve before the chiasm, causing complete loss of vision in one eye (monocular blindness), shown as visual defect 1."

      - id: q13
        number: "Q13"
        difficulty: "medium"
        name: "Lethal Temperature in Homeotherms"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=26"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "Q13.1"
            text: "For Passerine birds (body temperature is 40-41 degrees C) lethal core body temperature will be about 47 degrees C."
            answer: true
            explanation: "From the table, lethal core body temperature is consistently about 6 degrees higher than normal body temperature across all groups. For Passerines at 40-41 degrees C, this predicts approximately 47 degrees C."
          - letter: "Q13.2"
            text: "Thermal denaturation of the majority of enzymes and other proteins with increasing temperature."
            answer: false
            explanation: "Thermal denaturation of enzymes and proteins begins at temperatures much higher than 37-47 degrees C. This is not the main reason homeotherms cannot tolerate small temperature changes."
          - letter: "Q13.3"
            text: "Thermal denaturation (melting) of DNA with increasing temperature."
            answer: false
            explanation: "DNA melting begins at temperatures much higher than body temperature ranges. This does not explain the narrow lethal temperature margin."
          - letter: "Q13.4"
            text: "Changes in the microviscosity of lipids of cellular and intracellular membranes with increasing temperature."
            answer: false
            explanation: "Cells have enzyme systems that maintain membrane lipid microviscosity at required levels across a wide temperature range. This is not the limiting factor."
          - letter: "Q13.5"
            text: "Different temperature sensitivity (Q10-coefficient) of biochemical reactions in cells."
            answer: true
            explanation: "Different Q10 coefficients of coupled biochemical reactions, primarily ATP production and consumption, lead to lethal metabolic disorder when temperature rises even modestly above normal."

      - id: q14
        number: "Q14"
        difficulty: "hard"
        name: "Submarine Atmosphere and Oxygen"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=27"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "Q14.1"
            text: "Sailors need time to adapt to this atmosphere and regain normal fitness."
            answer: false
            explanation: "At 130% pressure and 16% oxygen, the partial pressure of oxygen is 760 x 1.3 x 0.16 = 158 mmHg, essentially identical to normal air (760 x 0.21 = 159 mmHg). Haemoglobin loading is unchanged."
          - letter: "Q14.2"
            text: "Sailors breathe faster in this atmosphere compared to normal sea-level air."
            answer: false
            explanation: "Since the partial pressure of oxygen is unchanged, haemoglobin saturation and CO2 levels remain the same. There is no physiological driver for increased breathing rate."
          - letter: "Q14.3"
            text: "Submarines could operate at a lower than sea-level atmospheric pressure, and higher than normal % oxygen to optimize fire safety."
            answer: false
            explanation: "Increasing the percentage of oxygen increases flammability even if partial pressure of O2 is kept safe physiologically. This worsens fire safety."
          - letter: "Q14.4"
            text: "When moving along the curves in the graph from 15% oxygen to 30% oxygen, atmospheric pressure is increasing."
            answer: false
            explanation: "Since PPO2 is fixed while the O2 fraction increases, the total atmospheric pressure must be decreasing. A greater percentage of a lower total pressure maintains the same partial pressure."

      - id: q15
        number: "Q15"
        difficulty: "hard"
        name: "Ventilation and Respiratory Gas Control"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=29"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "Q15.1"
            text: "These curves show evidence that haemoglobin can bind carbon dioxide to form carboxyhaemoglobin."
            answer: true
            explanation: "The total amount of CO2 in blood falls more steeply than the partial pressure of CO2 would predict from simple dissolution alone. This indicates something in blood binds CO2, namely deoxyhaemoglobin forming carbaminohaemoglobin."
          - letter: "Q15.2"
            text: "If the nerves to the oxygen sensors are cut, a person at a very high altitude will breathe more quickly."
            answer: false
            explanation: "Cutting the nerves removes the stimulatory input from oxygen sensors. Since these sensors normally increase breathing when O2 falls dangerously low, removing them reduces the ventilatory response."
          - letter: "Q15.3"
            text: "These curves show that controlling breathing primarily via CO2 levels, rather than via O2 levels, is an arbitrary accident of evolution, rather than clearly advantageous."
            answer: false
            explanation: "Haemoglobin binds O2 tightly until PO2 falls suddenly and dangerously, so O2 cannot provide fine control in the safe range. CO2 levels are much more tightly coupled to ventilation rate across the whole range, making CO2-based control clearly advantageous."
          - letter: "Q15.4"
            text: "Someone ascending to a very high altitude quickly will suffer decreasing pH in their brain."
            answer: false
            explanation: "At very high altitude, low PO2 drives increased breathing. This hyperventilation blows off more CO2, raising pH (respiratory alkalosis), not decreasing it."
          - letter: "Q15.5"
            text: "The submariners in the previous question (130% sea-level pressure, 16% oxygen) will experience a fall in pH when exposed to their atmosphere."
            answer: false
            explanation: "PPO2 and haemoglobin are unaffected, so sailors do not need to breathe faster and will not vent extra CO2. The trivial amount of atmospheric CO2 at higher pressure does not significantly affect blood pH."

      - id: q16
        number: "Q16"
        difficulty: "medium"
        name: "Cell Surface-to-Volume Ratio"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=31"
        subjects:
          - name: "Cell Theory, Prokaryotes & Eukaryotes"
            link: "/resources/1-cell-molecular/cell-theory-prokaryotes-eukaryotes/"
          - name: "Plasma Membrane & Transport"
            link: "/resources/1-cell-molecular/plasma-membrane-structure-transport/"
        statements:
          - letter: "Q16.1"
            text: "Escherichia coli has the lowest surface area (S) to volume (V) ratio (S/V) amongst the mentioned cells."
            answer: false
            explanation: "E. coli is the smallest cell listed. Smaller cells have the highest S/V ratio. E. coli has the maximal S/V ratio, not the lowest."
          - letter: "Q16.2"
            text: "The S/V ratio of human hepatic cells, compared to onion epidermal cells, differs by 5 fold."
            answer: true
            explanation: "For cylinders with a 5:1 length-to-diameter ratio, S/V is inversely proportional to the linear dimension. The onion cell (100 um) is 5 times larger than the hepatic cell (20 um), so S/V ratios differ 5-fold."
          - letter: "Q16.3"
            text: "A relatively low S/V ratio demands a relatively high plasma membrane density of active transport proteins for the maintenance of constant metabolism level inside the cytoplasm."
            answer: true
            explanation: "When S/V is low, the limited membrane area must compensate with higher transporter density to sustain the metabolic demands of the larger cytoplasmic volume."
          - letter: "Q16.4"
            text: "To maintain relatively high cytoplasmic metabolic activity, plant cells usually have large metabolically passive vacuoles and active cytoplasmic streaming."
            answer: true
            explanation: "Large vacuoles reduce the volume of metabolically active cytoplasm, and cytoplasmic streaming actively mixes the cytoplasm, both compensating for the low S/V ratio of large plant cells."
          - letter: "Q16.5"
            text: "More spherical cells usually sustain a higher metabolic activity than long or flat cells with the same volume."
            answer: false
            explanation: "Spheres have the lowest S/V ratio for a given volume. Elongated or flattened cells have higher S/V ratios and can thus sustain higher metabolic rates due to greater membrane area for transport."

      - id: q17
        number: "Q17"
        difficulty: "medium"
        name: "Glucose Oxidase and Enzyme Kinetics"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=32"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "Q17.1"
            text: "Among isoenzymes with the same Vmax value but different Km values, the enzyme with the lowest Km value has the highest affinity for the substrate."
            answer: true
            explanation: "By definition, Km is the substrate concentration at which the reaction rate is half of Vmax. A lower Km means the enzyme reaches half-maximal velocity at a lower substrate concentration, indicating higher affinity."
          - letter: "Q17.2"
            text: "For the meter to accurately measure blood glucose concentration, the glucose oxidase used should have a broad substrate specificity."
            answer: false
            explanation: "The only redox reaction on the strip should be glucose oxidation. Broad substrate specificity would mean other substrates also generate current, introducing measurement error. Narrow specificity is required."
          - letter: "Q17.3"
            text: "For the meter to accurately measure blood glucose concentration, the reaction on the strip should be in the P-Q range of the substrate concentration."
            answer: false
            explanation: "Measurement should be in the 0-to-Km range where reaction velocity is most sensitive to changes in substrate concentration. At the P-Q range near Vmax, velocity is nearly saturated and insensitive to glucose changes."
          - letter: "Q17.4"
            text: "The two-step reaction presented in Fig. III is essentially irreversible in these conditions."
            answer: true
            explanation: "O2 generated in the second step is released as gas to the atmosphere. With reduced substrate for the reverse reaction, the overall process is driven forward and is essentially irreversible."
          - letter: "Q17.5"
            text: "An acidic buffer facilitates oxidation of H2O2."
            answer: false
            explanation: "H2O2 is oxidized more effectively in alkaline solutions. In acidic conditions, H2O2 acts as a powerful oxidizing agent itself, producing the opposite of the intended effect."

      - id: q18
        number: "Q18"
        difficulty: "medium"
        name: "Lactic Acid Fermentation"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=34"
        subjects:
          - name: "Bioenergetics & Central Metabolism"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "Q18.1"
            text: "All substances (SI-SV) on the scheme are organic substances."
            answer: false
            explanation: "Not all intermediates are organic. Inorganic phosphate (Pi) is one of the substances involved and is inorganic."
          - letter: "Q18.2"
            text: "The process shown on the scheme proceeds at a high rate in many types of cancer cells."
            answer: true
            explanation: "Cancer cells characteristically show high rates of aerobic glycolysis (the Warburg effect), producing lactate even when oxygen is available."
          - letter: "Q18.3"
            text: "In aerobic eukaryotic cells, the substance SI can be synthesized at a high rate in mitochondria."
            answer: true
            explanation: "SI is ATP, which is produced at high rates by oxidative phosphorylation in mitochondria."
          - letter: "Q18.4"
            text: "The last reaction in this process (pyruvate to lactate) is needed for the reduction of the substance SIV."
            answer: false
            explanation: "The pyruvate-to-lactate step regenerates NAD+ from NADH (oxidation, not reduction). Its purpose is to reoxidize NADH so glycolysis can continue under anaerobic conditions."
          - letter: "Q18.5"
            text: "Many yeasts, for example S. cerevisiae, use this process in carbohydrate metabolism under anaerobic conditions."
            answer: false
            explanation: "S. cerevisiae performs alcoholic fermentation (producing ethanol and CO2) under anaerobic conditions, not lactic acid fermentation."

      - id: q19
        number: "Q19"
        difficulty: "medium"
        name: "cAMP Signaling and Caffeine"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=36"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "Q19.1"
            text: "Enzymatic synthesis of cAMP molecules amplifies the signal."
            answer: true
            explanation: "One activated adenylyl cyclase continuously synthesizes many cAMP molecules. Even weak signals are amplified through this enzymatic cascade."
          - letter: "Q19.2"
            text: "Caffeine inhibits the increase in cAMP concentration usually caused by the activated A2A receptor."
            answer: true
            explanation: "Caffeine competes with adenosine at the A2A receptor, preventing receptor activation and blocking the downstream adenylyl cyclase activation that normally increases cAMP."
          - letter: "Q19.3"
            text: "Caffeine slows down the decline in cAMP level after receptor activation."
            answer: true
            explanation: "Caffeine inhibits phosphodiesterase, the enzyme that breaks down cAMP to AMP. This slows the degradation of cAMP, prolonging its signaling effect."
          - letter: "Q19.4"
            text: "Caffeine is likely to be a competitor of adenosine at the receptor."
            answer: true
            explanation: "The structural similarity between caffeine and adenosine, combined with the figure showing caffeine inhibiting the A2A receptor, indicates competitive antagonism at the receptor binding site."

      - id: q20
        number: "Q20"
        difficulty: "hard"
        name: "Gasdermin and Pyroptosis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=38"
        subjects:
          - name: "Cell Junctions, ECM & Cell Death"
            link: "/resources/1-cell-molecular/cell-junctions-ecm-cell-death/"
          - name: "Immune Physiology"
            link: "/resources/3-animal-physiology/immune-physiology/"
        statements:
          - letter: "Q20.1"
            text: "Inhibition of procaspase 9 cleavage."
            answer: true
            explanation: "Inhibiting procaspase 9 cleavage prevents caspase activation and the downstream cleavage of Gasdermins, reducing pyroptosis-mediated inflammation."
          - letter: "Q20.2"
            text: "Disruption of expression of Gasdermin E."
            answer: true
            explanation: "Without Gasdermin E, no pore-forming N-terminal fragments can be generated from it, reducing membrane rupture and inflammatory cascades."
          - letter: "Q20.3"
            text: "Production of intracellular ROS (reactive oxygen species) by a chemotherapy drug."
            answer: false
            explanation: "ROS production promotes mitochondrial disruption and triggers pyroptotic pathways, which would worsen CNS inflammation rather than reduce it."
          - letter: "Q20.4"
            text: "Acetylation of surface cysteine in N-terminal domain of Gasdermin D."
            answer: true
            explanation: "Acetylation of cysteine residues in the Gasdermin D N-terminal fragment blocks pore formation in cell membranes, reducing pyroptosis and inflammation."
          - letter: "Q20.5"
            text: "Inhibition of the cleavage of Gasdermin E."
            answer: true
            explanation: "Preventing Gasdermin E cleavage blocks release of the pore-forming N-terminal domain, reducing pyroptotic cell death and inflammatory mediator release."

      - id: q21
        number: "Q21"
        difficulty: "hard"
        name: "Aconitase Mechanism"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=40"
        subjects:
          - name: "Bioenergetics & Central Metabolism"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "Q21.1"
            text: "The reaction mechanism involves proton (H+) transfer."
            answer: true
            explanation: "Performing the reaction in D2O did not produce any labeled product, meaning the enzyme takes a hydrogen from the substrate and returns it. The mechanism involves proton transfer."
          - letter: "Q21.2"
            text: "Cis-aconitate remains bound, in the same orientation, to the enzyme active site throughout the whole reaction."
            answer: false
            explanation: "When starting from cis-aconitate in D2O, all produced citrate had a D atom. If cis-aconitate remained bound in the same orientation throughout, this would not occur. The intermediate can leave and rebind."
          - letter: "Q21.3"
            text: "The labeled H atoms in the figure are the same individual atoms in citrate and isocitrate."
            answer: true
            explanation: "The reverse enzymatic reaction from isocitrate did NOT produce any labeled citrate in D2O. This means the same hydrogen atoms are transferred between citrate and isocitrate without exchange with solvent."
          - letter: "Q21.4"
            text: "The enzyme has only one catalytic base (e.g. serine) in its active site."
            answer: true
            explanation: "If the reaction used two general bases, one would become labeled with deuterium in D2O and subsequently incorporate D into the product. Since no D incorporation was observed in the forward reaction, only one catalytic base is involved."
          - letter: "Q21.5"
            text: "The enzyme needs a coenzyme as redox center e.g. FAD."
            answer: false
            explanation: "Aconitase catalyzes a dehydration/rehydration reaction (isomerization), not an oxidation-reduction reaction. FAD is a cofactor for oxidation reactions and is not needed here."

      - id: q22
        number: "Q22"
        difficulty: "medium"
        name: "Metformin and Complex I"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=43"
        subjects:
          - name: "Bioenergetics & Central Metabolism"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "Q22.1"
            text: "The oxidation of one glucose molecule leads to the synthesis of approximately 11 ATP molecules."
            answer: false
            explanation: "Glycolysis, pyruvate oxidation, and the Krebs cycle produce NADH and FADH2 that generate far more than 11 ATP. One glucose molecule yields approximately 30-34 ATP molecules through complete oxidation."
          - letter: "Q22.2"
            text: "The number of ATP molecules synthesized by ATP synthase is reduced by metformin."
            answer: true
            explanation: "Metformin inhibits Complex I, reducing the number of protons pumped into the intermembrane space. With fewer protons driving ATP synthase, fewer ATP molecules are produced."
          - letter: "Q22.3"
            text: "Metformin directly increases the concentration of FADH2 in the mitochondrial matrix."
            answer: false
            explanation: "Metformin inhibits Complex I, which handles NADH oxidation. It does not directly affect the FADH2 pathway through Complex II, so FADH2 concentration is not directly changed."
          - letter: "Q22.4"
            text: "Metformin indirectly activates AMPK by raising the amount of AMP relative to ATP."
            answer: true
            explanation: "By reducing ATP production through Complex I inhibition, metformin shifts the AMP:ADP:ATP ratio toward higher AMP levels, which activates AMP-activated protein kinase (AMPK)."

      - id: q23
        number: "Q23"
        difficulty: "medium"
        name: "Nerve Conduction and Volume Conductor"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=45"
        subjects:
          - name: "Nervous System Physiology"
            link: "/resources/3-animal-physiology/nervous-system-physiology/"
        statements:
          - letter: "Q23.1"
            text: "In a resting cell, an excitation initiated locally causes an influx of Na+ to the cell."
            answer: true
            explanation: "Excitation of a nerve cell opens voltage-gated Na+ channels, causing an influx of Na+ ions that depolarizes the membrane. This is the basis of action potential initiation."
          - letter: "Q23.2"
            text: "In the repolarization phase of an action potential, an efflux of Na+ is observed."
            answer: false
            explanation: "Repolarization is driven by an efflux of K+ ions through voltage-gated K+ channels, not by efflux of Na+. Na+ channels inactivate during this phase."
          - letter: "Q23.3"
            text: "When the resting region of the cell acts as the source, the excited region acts as the sink."
            answer: true
            explanation: "In the excited region, current flows into the cell (Na+ influx), making it the sink. In the adjacent resting region, current flows out, making it the source."
          - letter: "Q23.4"
            text: "Figure 1 C presents a signal registered by the experimental setup shown in Figure 1 B."
            answer: true
            explanation: "When excitation starts at the cell body, a positive current is initially recorded as the excited region acts as a sink near the positive electrode. When excitation passes the recording point, the signal reverses, producing the biphasic waveform shown."

      - id: q24
        number: "Q24"
        difficulty: "medium"
        name: "C-STAR Blood Glucose Control"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=47"
        subjects:
          - name: "Endocrine System Physiology"
            link: "/resources/3-animal-physiology/endocrine-system-physiology/"
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
        statements:
          - letter: "Q24.1"
            text: "In WT mice, glucose levels returned to basal level after 90 minutes."
            answer: true
            explanation: "This can be directly deduced from the glucose tolerance test figure, where the WT curve returns to baseline by 90 minutes."
          - letter: "Q24.2"
            text: "STAT3 is indispensable for the synthesis of shGLP-1 in the C-STAR system."
            answer: true
            explanation: "The C-STAR system requires caffeine to cause protein dimerization, which activates STAT3 phosphorylation, which turns on transcription of the shGLP-1 gene. STAT3 is essential to this signaling cascade."
          - letter: "Q24.3"
            text: "C-STAR caused blood glucose levels of DIO mice to be similar to WT mice 60 minutes after glucose administration."
            answer: true
            explanation: "The figure shows that DIO mice with C-STAR microcapsules have blood glucose levels comparable to WT mice at the 60-minute time point."
          - letter: "Q24.4"
            text: "Both WT mice and DIO mice are needed as controls to assess the effectiveness of C-STAR in this experiment."
            answer: true
            explanation: "WT mice represent the ultimate therapeutic goal (normal glucose handling), while untreated DIO mice represent the starting condition. Both are needed to evaluate whether C-STAR moves DIO mice toward normal glucose control."

      - id: q25
        number: "Q25"
        difficulty: "hard"
        name: "Golden Gate Assembly Constructs"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=48"
        subjects:
          - name: "Recombinant DNA & Biotechnology"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "Q25.1"
            text: "Construct a can be observed after treatment with BsaI and DNA ligase."
            answer: false
            explanation: "Construct a does not represent a valid product of BsaI digestion and ligation given the arrangement of recognition and cutting sites in the inserts and backbone."
          - letter: "Q25.2"
            text: "Construct b can be observed after treatment with BsaI and DNA ligase."
            answer: true
            explanation: "Construct b represents the correct assembly product. BsaI cuts at specific positions creating compatible overhangs that direct the inserts into the backbone in the correct orientation."
          - letter: "Q25.3"
            text: "Construct c can be observed after treatment with BsaI and DNA ligase."
            answer: false
            explanation: "Construct c does not have the correct arrangement of inserts, as the non-palindromic BsaI recognition sites create directional overhangs that prevent this assembly."
          - letter: "Q25.4"
            text: "Construct d can be observed after treatment with BsaI and DNA ligase."
            answer: false
            explanation: "Construct d is not a valid product because the specific overhang sequences generated by BsaI do not allow this particular combination of insert orientations."

      - id: q26
        number: "Q26"
        difficulty: "hard"
        name: "T-DNA Southern Blot Analysis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=50"
        subjects:
          - name: "Recombinant DNA & Biotechnology"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
        statements:
          - letter: "Q26.1"
            text: "The genomic DNA was digested with restriction enzyme Y."
            answer: true
            explanation: "Digestion with RE Y would give a minimum of 2 bands when probed with A, consistent with the results. RE Y has a unique site within the T-DNA, while RE X has two sites."
          - letter: "Q26.2"
            text: "The digested DNA fragments that hybridized to the probe contain regions of T-DNA only."
            answer: false
            explanation: "Each fragment contains a portion of the T-DNA and flanking genomic DNA. The restriction enzyme cuts once within the T-DNA and at variable positions in the flanking genomic DNA."
          - letter: "Q26.3"
            text: "There are two copies of T-DNA in plant number 1."
            answer: true
            explanation: "Probe A shows two hybridization signals for plant 1, indicating two copies of T-DNA. One band with probe B could mean the two copies are at the same locus or have the same distance to the nearest restriction site on the right side."
          - letter: "Q26.4"
            text: "One copy of T-DNA is integrated in plant number 2."
            answer: true
            explanation: "Single bands from both probes A and B indicate that only one copy of the T-DNA has integrated into the plant 2 genome."
          - letter: "Q26.5"
            text: "Complete T-DNA region has been transferred in plant 4."
            answer: false
            explanation: "No hybridization signal with probe A indicates that the region covered by probe A is missing, meaning complete T-DNA transfer has not occurred in plant 4."

      - id: q27
        number: "Q27"
        difficulty: "medium"
        name: "Gene Regulation by Protein Y"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=52"
        subjects:
          - name: "Gene Regulation & Epigenetics"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic-epigenetics/"
        statements:
          - letter: "Q27.1"
            text: "If gene Y is deleted, the ratio of activity will increase."
            answer: false
            explanation: "Protein Y is a positive regulator. Deleting all three binding sites (strain M7) abolishes activation entirely (ratio = 1). Deleting protein Y would have the same effect, preventing any activation."
          - letter: "Q27.2"
            text: "The binding affinity of protein Y for R2 site is expected to be the highest."
            answer: true
            explanation: "Among strains M1 to M3 (each with one binding site deleted), M2 (R2 deleted) shows the least activation (ratio = 3). This indicates R2 contributes the most, suggesting protein Y has the highest binding affinity for R2."
          - letter: "Q27.3"
            text: "The sequence TGTGA is important for the binding of protein Y to the R sites."
            answer: true
            explanation: "The sequence TGTGA is conserved across all three binding sites (R1, R2, R3). Since protein Y binds all three sites, the conserved sequence is likely critical for binding."
          - letter: "Q27.4"
            text: "The binding of protein Y to R3 and R2 influences the gene activity in the same way as protein Y binding to R1 and R2."
            answer: false
            explanation: "Strain M1 (R1 deleted, keeping R2+R3) shows activation ratio of 52, while strain M3 (R3 deleted, keeping R1+R2) shows ratio of 107. The different ratios indicate R1+R2 and R2+R3 do not have equivalent effects."

      - id: q28
        number: "Q28"
        difficulty: "medium"
        name: "Ancient DNA Extraction"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=54"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
          - name: "Nucleotide & Nucleic Acid Chemistry"
            link: "/resources/1-cell-molecular/nucleotide-nucleic-acid-chemistry/"
        statements:
          - letter: "Q28.1"
            text: "This DNA isolation method could also be used for modern samples."
            answer: true
            explanation: "DNA adsorption onto silica particles at high salt concentrations is based on general chemical properties of DNA, not properties specific to ancient DNA. The method works for any DNA source."
          - letter: "Q28.2"
            text: "This DNA isolation method allows scientists to obtain intact (full-length) chromosomes."
            answer: false
            explanation: "Chromosomal DNA is very long and is sheared during the grinding step. Additionally, DNA-binding proteins dissociate under high salt conditions. Intact chromosomes cannot be recovered."
          - letter: "Q28.3"
            text: "The DNA sample obtained with this method could be contaminated with bacterial DNA."
            answer: true
            explanation: "The bone specimen likely contains bacterial DNA from decomposition or soil microbes. The silica-based method captures all DNA based on chemical properties and does not discriminate between sources."
          - letter: "Q28.4"
            text: "DNA binds to the silica particles via positively charged nitrogenous bases."
            answer: false
            explanation: "All interactions between DNA and silica occur through sodium ion bridges, not through nitrogenous bases. Decreasing sodium concentration causes DNA to detach, which is the basis of the elution step."
          - letter: "Q28.5"
            text: "As some DNA bases undergo deamination when exposed to the environment, ancient DNA will contain more uracil compared to modern DNA of the same species."
            answer: true
            explanation: "Spontaneous deamination of cytosine converts it to uracil over time. Ancient DNA accumulates more of these deamination events, resulting in higher uracil content compared to modern DNA."

      - id: q29
        number: "Q29"
        difficulty: "hard"
        name: "Paulinella Chloroplast Endosymbiosis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=55"
        subjects:
          - name: "Mitochondria, Chloroplasts & Endosymbiosis"
            link: "/resources/1-cell-molecular/mitochondria-chloroplasts-structure-origin/"
          - name: "History of Life & Major Transitions"
            link: "/resources/15-evolution/history-of-life-origin-and-major-transitions/"
        statements:
          - letter: "Q29.1"
            text: "During Paulinella chloroplast genome evolution, many genes were lost."
            answer: true
            explanation: "The Paulinella chloroplast genome is approximately 1 million base pairs, while the related free-living Synechococcus genome is approximately 3 million base pairs. About 65% of genes were lost during evolution."
          - letter: "Q29.2"
            text: "Paulinella probably obtained chloroplasts as a result of secondary endosymbiosis."
            answer: false
            explanation: "Paulinella obtained its chloroplast through an independent primary endosymbiosis event. The chloroplast genome sequence is close to free-living Synechococcus, not to other algal chloroplasts that would indicate secondary endosymbiosis."
          - letter: "Q29.3"
            text: "The endosymbiosis event which made Paulinella a photosynthetic amoeba is estimated to have occurred 50-120 million years ago."
            answer: true
            explanation: "The endosymbiosis occurred after the divergence from the closest non-photosynthetic relative (~120 MYA) and before the divergence of photosynthetic species within the genus (~50 MYA)."
          - letter: "Q29.4"
            text: "Paulinella cells contain ribosomal RNA from two different sources."
            answer: false
            explanation: "Paulinella cells contain ribosomal RNA from three different sources: nuclear ribosomes, mitochondrial ribosomes, and chloroplast ribosomes. Two sources would be an undercount."

      - id: q30
        number: "Q30"
        difficulty: "medium"
        name: "Parasite-Mediated Competition in Squirrels"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=56"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "Q30.1"
            text: "Northern flying squirrels and red squirrels are likely to be vulnerable to parasite-mediated competition."
            answer: true
            explanation: "Both species show significantly lower Scaled Mass Indices when infected with the nematode, indicating poorer body condition. This makes them vulnerable to competition when parasitized."
          - letter: "Q30.2"
            text: "Under conditions of high nematode infections, northern flying squirrels are likely to be outcompeted by grey squirrels."
            answer: false
            explanation: "These species do not directly compete because the nocturnal flying squirrels have different activity periods, diets, and foraging strategies from the diurnal grey squirrels."
          - letter: "Q30.3"
            text: "Under conditions of high nematode infections, southern flying squirrels are likely to be outcompeted by northern flying squirrels."
            answer: false
            explanation: "Under higher nematode loads, northern flying squirrels exhibit poor body condition while southern flying squirrels are less affected. The northern species would be outcompeted by the southern species, not the other way around."
          - letter: "Q30.4"
            text: "If we were to increase the sample size of one of these species for greater credibility of the study results, the best choice would be red squirrels."
            answer: true
            explanation: "The relatively high standard error of the red squirrel samples suggests greater uncertainty in the estimates. Increasing the sample size for this species would most improve the reliability of the study."

      - id: q31
        number: "Q31"
        difficulty: "medium"
        name: "Cryptic Aricia Butterfly Species"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=58"
        subjects:
          - name: "Speciation & Reproductive Isolation"
            link: "/resources/15-evolution/speciation-and-reproductive-isolation/"
        statements:
          - letter: "Q31.1"
            text: "The pair of studied cryptic species apparently formed because of geographical isolation."
            answer: true
            explanation: "A. agestis and A. cramera have non-overlapping geographical distributions, indicating that geographical isolation (allopatric speciation) was the likely driver of their divergence."
          - letter: "Q31.2"
            text: "These cryptic species have a clear ecological confinement to certain habitats."
            answer: false
            explanation: "Both A. agestis and A. cramera are generalists, using multiple host plants (Erodium, Geranium, Helianthemum) across a wide elevation range. They do not show clear ecological confinement."
          - letter: "Q31.3"
            text: "Aricia species without an exact specialization can coexist with species that are clearly confined to a limited range of habitats."
            answer: true
            explanation: "This is visible from the data: A. agestis (generalist) coexists with A. artaxerxes, and A. cramera (generalist) coexists with A. montensis."
          - letter: "Q31.4"
            text: "Specialist Aricia species could be formed from generalist ancestors with wide geographical areas of distribution."
            answer: true
            explanation: "This is clearly visible for at least A. agestis and A. artaxerxes, where the specialist A. artaxerxes appears to have evolved from a generalist ancestor."

      - id: q32
        number: "Q32"
        difficulty: "medium"
        name: "Seabird Foraging and Niche Segregation"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=59"
        subjects:
          - name: "Foraging & Anti-Predator Behavior"
            link: "/resources/9-ethology/foraging-anti-predator-behavior/"
        statements:
          - letter: "Q32.1"
            text: "The foraging patterns indicate evidence of niche segregation in Atlantic Puffins and Razorbills."
            answer: true
            explanation: "Based on both foraging distribution maps and stable isotope data, Atlantic Puffins and Razorbills forage in separate areas with some overlap, indicating niche segregation."
          - letter: "Q32.2"
            text: "Common Murres and Thick-billed Murres have similar diets."
            answer: false
            explanation: "Stable isotope ratios show clear clustering for Common Murres and Thick-billed Murres in different regions of the isotope plot, indicating they are segregated by diet."
          - letter: "Q32.3"
            text: "Atlantic Puffins mostly forage in near-shore areas (close to the coast)."
            answer: false
            explanation: "The foraging distribution map shows puffins foraging away from the shore, in offshore waters."
          - letter: "Q32.4"
            text: "Razorbills and Common Murres have similar diets."
            answer: true
            explanation: "Razorbills and Common Murres show considerable foraging overlap in the distribution map and have overlapping stable isotope signatures, indicating dietary similarity."
          - letter: "Q32.5"
            text: "Thick-billed murres and razorbills have considerable foraging overlap."
            answer: false
            explanation: "Thick-billed Murres forage offshore compared to Razorbills, and they have no overlap in stable isotope signatures, indicating distinct foraging strategies and diets."

      - id: q33
        number: "Q33"
        difficulty: "hard"
        name: "Symbiodinium Nutrient Limitation"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=61"
        subjects:
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "Q33.1"
            text: "All three nutrients tested affected the mean values of both proliferation and differentiation of S. microadriaticum cells."
            answer: false
            explanation: "While all three nutrients (nitrogen, iron, phosphate) affected cell proliferation, phosphate did not affect differentiation (mastigote/coccoid ratio), as evident from Figure B."
          - letter: "Q33.2"
            text: "Nitrogen was the only limiting nutrient for the differentiation of S. microadriaticum cells within host coral cells."
            answer: true
            explanation: "Figure B shows that only nitrogen depletion markedly altered the mastigote/coccoid ratio, suggesting nitrogen is the key nutrient the coral host uses to regulate Symbiodinium differentiation."
          - letter: "Q33.3"
            text: "Given the above data, it is possible that the changing coccoid / mastigote ratios in the cultures are a side effect of the marked reduction in cell proliferation."
            answer: true
            explanation: "This is a valid hypothesis acknowledged by the researchers. The correlation between proliferation changes and differentiation changes could be causal, and would require controlled experiments to distinguish."
          - letter: "Q33.4"
            text: "Phosphate had relatively the greatest restrictive effect on cell proliferation over the experimental period."
            answer: false
            explanation: "Phosphate depletion had the most limiting effect on proliferation between Days 6 and 11, but later in the experiment, iron depletion had the greatest limiting effect. Over the full period, the answer is not straightforwardly phosphate."
          - letter: "Q33.5"
            text: "These results suggest that it may be possible for coral host cells to increase the levels of certain nutrients to regulate the differentiation of S. microadriaticum cells."
            answer: true
            explanation: "Iron depletion promoted mastigote development. The host coral could conceivably increase iron levels to suppress mastigote development and keep Symbiodinium in the coccoid stage."

      - id: q34
        number: "Q34"
        difficulty: "medium"
        name: "Bonnet Macaque Population Demography"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=63"
        subjects:
          - name: "Natural Selection, Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "Q34.1"
            text: "The percentage annual population growth was relatively faster in 2013 than in other years."
            answer: false
            explanation: "The inverted/constrictive pyramid structure in 2013 (adults dominant, few juveniles) is typical of a shrinking population, not one growing faster."
          - letter: "Q34.2"
            text: "The relatively more equal adult male-to-female ratio in 2009 may have been responsible for the overall smaller population size in 2013."
            answer: false
            explanation: "In multi-male multi-female species like bonnet macaques, adult sex ratios are not a primary driver of population growth. The increase in male numbers in 2009 and higher absolute female numbers in 2009 make this unlikely."
          - letter: "Q34.3"
            text: "The age pyramid, shown by the population in 2005, as compared to that of 2009, is characterized by a higher birth rate and relatively lower life expectancy."
            answer: true
            explanation: "The 2005 population has a broader base (more juveniles proportionally) than 2009, indicating higher birth rate. The narrower top (fewer adults) suggests relatively lower life expectancy."
          - letter: "Q34.4"
            text: "The male-to-female ratio of subadults reflects the male-to-female ratio of juveniles in this population in subsequent years."
            answer: false
            explanation: "Between 2009 and 2013, there is no consistent correlation between subadult and juvenile male-to-female ratios. The pattern does not hold across the time periods."

      - id: q35
        number: "Q35"
        difficulty: "medium"
        name: "Primate Mating Systems"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=64"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "Q35.1"
            type: "mcq"
            text: "Which of the species is expected to have the highest levels of within-group male aggression?"
            options: [{key: "A", text: "Species A"}, {key: "B", text: "Species B"}, {key: "C", text: "Species C"}]
            answer: "A"
            explanation: "Species A has the highest male-to-female body mass ratio (2.00), indicating strong sexual dimorphism driven by intense male-male competition. Larger, more dimorphic males compete aggressively for access to females."
          - letter: "Q35.2"
            type: "mcq"
            text: "Which of the species is expected to have the highest variance in number of matings per male?"
            options: [{key: "A", text: "Species A"}, {key: "B", text: "Species B"}, {key: "C", text: "Species C"}]
            answer: "A"
            explanation: "In species with pronounced sexual dimorphism (Species A), the biggest and strongest males monopolize mating, creating high variance in reproductive success among males."
          - letter: "Q35.3"
            type: "mcq"
            text: "Which of the species is most likely to live in multi-male multi-female groups, in which receptive females could mate with multiple males?"
            options: [{key: "A", text: "Species A"}, {key: "B", text: "Species B"}, {key: "C", text: "Species C"}]
            answer: "B"
            explanation: "Species B has the highest testes-mass-to-body-mass ratio (5 x 10^-3), indicating sperm competition. Large testes evolve when females mate with multiple males and sperm competition determines paternity."
          - letter: "Q35.4"
            type: "mcq"
            text: "In which of the species are males most likely to be involved in parental care?"
            options: [{key: "A", text: "Species A"}, {key: "B", text: "Species B"}, {key: "C", text: "Species C"}]
            answer: "C"
            explanation: "Species C has minimal sexual dimorphism (ratio 1.10), moderate testes size, and produces twins. These traits suggest monogamous pair bonding, where male parental care helps rear the demanding twin offspring."

      - id: q36
        number: "Q36"
        difficulty: "medium"
        name: "Triceratops Skull Injuries"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=65"
        subjects:
          - name: "Evidence for Evolution"
            link: "/resources/15-evolution/evidence-for-evolution/"
        statements:
          - letter: "Q36.1"
            text: "Nasal bones are the most abundant of fossilised triceratops skull bones."
            answer: false
            explanation: "47 nasal bones were preserved, which is fewer than the 58 squamosal bones analyzed. Nasal bones are not the most abundant fossilized skull bones."
          - letter: "Q36.2"
            text: "Triceratops collars were formed as outgrowths of parietal bones (which form the roof of the skull)."
            answer: true
            explanation: "The collar is an outgrowth of one of the lateral skull surface bones. Since the squamosal bone is already marked with an asterisk, the remaining bones forming the collar are the parietal bones."
          - letter: "Q36.3"
            text: "The squamosal bone has the highest frequency of injuries compared to all the analysed bones."
            answer: false
            explanation: "Jugal bones have 7/39 = 18% injury frequency, while squamosal bones have 10/58 = 17%. The jugal bone has a slightly higher percentage of injuries."
          - letter: "Q36.4"
            text: "The distribution of injuries is better explained by combats between triceratops males, rather than T. rex attacks."
            answer: true
            explanation: "Almost all injuries occur on the lateral skull surface, which is consistent with horn-to-shield combat between males. A tall predator like T. rex would attack from above, targeting the upper skull surface, where almost no injuries are found."

      - id: q37
        number: "Q37"
        difficulty: "medium"
        name: "Group Selection Hypothesis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=67"
        subjects:
          - name: "Natural Selection, Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
        statements:
          - letter: "Q37.1"
            text: "The above hypothesis represents a classic group-selection argument, in which natural selection acts to increase the fitness of a population."
            answer: true
            explanation: "The hypothesis describes individuals decreasing their own resource use for the benefit of others in the population, which is the classic group selection argument."
          - letter: "Q37.2"
            text: "Group selection is now considered to be the most accepted mechanism to explain the evolution of the group behaviours of animals, in contrast to individual selection."
            answer: false
            explanation: "Group selection is currently not the most accepted mechanism. Individual selection (including kin selection and reciprocal altruism) satisfactorily explains the evolution of most animal behaviors, both individual and group."
          - letter: "Q37.3"
            text: "Logical evidence in favour of group selection could be obtained if different individuals within a group adopted completely different strategies to increase their own fitness."
            answer: false
            explanation: "If different individuals adopt different strategies to increase their own fitness, this represents individual selection in operation, not group selection. This would be evidence against, not for, group selection."
          - letter: "Q37.4"
            text: "The ability of one individual, within a group of animals, to adopt a strikingly different behavioural strategy from the others, could arise by chance."
            answer: true
            explanation: "A unique behavioral strategy could arise within a group by chance through genetic mutation or innovative behavioral trial-and-error mechanisms."

      - id: q38
        number: "Q38"
        difficulty: "hard"
        name: "Sex Ratio Evolution"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=68"
        subjects:
          - name: "Natural Selection, Modes & Fitness"
            link: "/resources/15-evolution/natural-selection-modes-and-fitness/"
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "Q38.1"
            text: "A 1:1 ratio has evolved to ensure that each individual is equally likely to encounter an individual of the opposite sex as another individual of the same sex."
            answer: false
            explanation: "The 1:1 ratio did not evolve to ensure equal encounter probability. It is the result of frequency-dependent selection: any deviation from 1:1 creates a selective advantage for parents producing the rarer sex."
          - letter: "Q38.2"
            text: "A 1:1 ratio would be preferred by individuals of a particular generation if they are likely to obtain the same number of grandchildren through both their daughters and their sons."
            answer: true
            explanation: "As Fisher showed, the evolutionarily stable sex ratio is 1:1 because at this ratio, the expected reproductive return through sons equals that through daughters. Any deviation would favor parents producing the rarer sex."
          - letter: "Q38.3"
            text: "If sons and daughters require different amounts of parental investment, the ratio is more likely to deviate from 1:1."
            answer: true
            explanation: "When one sex costs more to produce, the stable strategy shifts to equal total investment in each sex rather than equal numbers. If sons cost twice as much, the stable ratio is 1:2 (male:female) so that each unit of investment gives equal returns."
          - letter: "Q38.4"
            text: "A closed population, such as that presented by fig wasps, in which females mate with a single male and full brothers compete to mate with their full sisters, is likely to display a deviation from the 1:1 ratio."
            answer: true
            explanation: "When brothers compete for the same mates (local mate competition), extra sons are wasteful from the mother's perspective. The optimal strategy is to produce just enough sons to fertilize all daughters, leading to a female-biased sex ratio."

      - id: q39
        number: "Q39"
        difficulty: "medium"
        name: "RNA Editing Mechanisms"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=68"
        subjects:
          - name: "Transcription & RNA Processing"
            link: "/resources/1-cell-molecular/transcription-rna-processing/"
        statements:
          - letter: "Q39.1"
            text: "RNA editing processes are highly conserved, with similar mechanisms in all eukaryotes, from trypanosomes to mammals."
            answer: false
            explanation: "There are two fundamentally different RNA editing mechanisms: uridine insertion in trypanosomes and base deamination (C-to-U and A-to-I) in mammals. These are independent, not conserved."
          - letter: "Q39.2"
            text: "RNA editing can shift the reading frame in mRNA."
            answer: true
            explanation: "The trypanosome mechanism inserts uridine nucleotides into mRNA. Adding nucleotides to the coding sequence shifts the reading frame."
          - letter: "Q39.3"
            text: "RNA editing can result in protein isoforms with different molecular weights."
            answer: true
            explanation: "RNA editing can introduce stop codons (e.g., through C-to-U conversion of a CAA glutamine codon to UAA stop codon), producing a shorter, lighter protein isoform."
          - letter: "Q39.4"
            text: "RNA editing occurs only in the nucleus."
            answer: false
            explanation: "RNA editing also occurs in mitochondria (kinetoplasts in trypanosomes), cytoplasm, and plastids. It is not restricted to the nucleus."

      - id: q40
        number: "Q40"
        difficulty: "easy"
        name: "Drosophila Saturation Mutagenesis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=69"
        subjects:
          - name: "Recombinant DNA & Biotechnology"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "Q40.1"
            text: "The number of segmentation genes identified on chromosome 2 is between 60 and 70."
            answer: true
            explanation: "This can be directly deduced from the graph, which shows the number of identified segmentation genes plateauing in the 60-70 range."
          - letter: "Q40.2"
            text: "Analysing 10000 progeny would have led to the identification of substantially more segmentation genes."
            answer: false
            explanation: "The graph shows that mutation in new genes has reached saturation. While more mutants might be obtained with more progeny, the number of distinct genes has plateaued."
          - letter: "Q40.3"
            text: "Analysis of more than 2000 progeny tended to lead to the identification of new alleles of genes which had already been identified, rather than more new genes."
            answer: true
            explanation: "As the number of screened progeny increases beyond 2000, new mutants are found but the total number of genes does not increase proportionately, indicating new mutations fall in already-identified genes."
          - letter: "Q40.4"
            text: "The frequency of obtaining recessive mutants is higher than dominant mutants as a greater number of progeny are analyzed."
            answer: false
            explanation: "There is no correlation between the number of progeny analyzed and the relative frequency of dominant versus recessive mutations. The screen design and genetic mechanisms determine mutation types, not sample size."

      - id: q41
        number: "Q41"
        difficulty: "hard"
        name: "RFLP Analysis of Cat Mucolipidosis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=70"
        subjects:
          - name: "Biomolecular Analytical Techniques"
            link: "/resources/1-cell-molecular/biomolecular-analytical-techniques/"
          - name: "Pedigree Analysis & Human Genetic Disorders"
            link: "/resources/7-genetics/pedigree-analysis-human-genetic-disorders/"
        statements:
          - letter: "Q41.1"
            text: "The recessive allele of GNPTAB gene makes the encoded protein shorter."
            answer: true
            explanation: "The mutation changes codon 882 from CAG (glutamine) to TAG (stop codon). This nonsense mutation truncates the protein, making it shorter."
          - letter: "Q41.2"
            text: "The 414 bp-long DNA fragment corresponds to the recessive allele of GNPTAB gene."
            answer: true
            explanation: "PstI recognizes CTGCAG, which contains the CAG of codon 882. The mutation to TAG eliminates the PstI recognition site. Without cutting, the full 414 bp PCR product is retained, corresponding to the recessive allele."
          - letter: "Q41.3"
            text: "Mucolipidosis II in cats is inherited as X-linked recessive disease."
            answer: false
            explanation: "If the disease were X-linked recessive, male individual 4977 in the pedigree would be affected, not just a carrier. The autosomal recessive inheritance pattern better fits the pedigree data."
          - letter: "Q41.4"
            text: "Cat number 3739 must be homozygous for the recessive allele of GNPTAB gene."
            answer: false
            explanation: "The pedigree can be explained with cat 3739 being heterozygous. The same recessive allele could have been inherited by the affected offspring through both parents, with 3739 as a carrier."

      - id: q42
        number: "Q42"
        difficulty: "hard"
        name: "Variant Call Format Genomics"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=72"
        subjects:
          - name: "Recombinant DNA & Biotechnology"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
        statements:
          - letter: "Q42.1"
            text: "Individual 1 from the example above is homozygous at position 7100 on chromosome 1."
            answer: false
            explanation: "At position 7100, Individual 1 has genotype 0/2. The 0 represents the reference allele (A) and 2 represents the second alternative allele (T). Having two different alleles means the individual is heterozygous."
          - letter: "Q42.2"
            text: "At any given chromosomal position 25% of individuals in the population are expected to have 1/1 genotype."
            answer: false
            explanation: "Genotype frequencies depend on allele frequencies, which vary by position and can be influenced by selection, drift, and other forces. There is no reason to expect 25% of individuals to be 1/1 at any given position."
          - letter: "Q42.3"
            text: "The size of a vcf file storing the genome of a single individual increases with increasing genetic difference between this individual and the reference genome."
            answer: true
            explanation: "Each difference from the reference adds a line to the vcf file. A more divergent individual has more variant positions, requiring more lines and a larger file."
          - letter: "Q42.4"
            text: "The size of a vcf file storing the genomes of two individuals and their daughter is expected to be smaller than a vcf file storing the genomes of the same two individuals and a genome of an unrelated female."
            answer: true
            explanation: "A daughter inherits alleles from both parents, so most of her variant positions are already represented in the parents' data. An unrelated individual would have many novel variants not present in either parent, requiring additional lines."

      - id: q43
        number: "Q43"
        difficulty: "medium"
        name: "Twin Studies and Heritability"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=74"
        subjects:
          - name: "Quantitative Genetics & Heritability"
            link: "/resources/7-genetics/quantitative-genetics-heritability-inbreeding/"
        statements:
          - letter: "Q43.1"
            text: "Such studies assume that all trait covariance between DZ twins is due to shared environment."
            answer: false
            explanation: "DZ twins share 50% of their genetics on average, so trait covariance between them reflects both shared genetics AND shared environment, not just environment."
          - letter: "Q43.2"
            text: "Such studies assume that all trait covariance between MZ twins is due to shared genetics."
            answer: false
            explanation: "MZ twins share both 100% of their genetics and their shared environment. Trait covariance between MZ twins is due to both factors, not just genetics."
          - letter: "Q43.3"
            text: "Such studies assume that environmental exposure covariance is the same between MZ and DZ twins."
            answer: true
            explanation: "The key assumption is that MZ and DZ twins share environmental exposure equally. The only difference between them is genetic similarity, so any extra covariance in MZ twins is attributed to genetics."
          - letter: "Q43.4"
            text: "For a trait with a very strong genetic contribution, the trait covariance in MZ twins is expected to be higher than in DZ twins."
            answer: true
            explanation: "MZ twins share 100% of their genetics while DZ twins share only 50%. For genetically influenced traits, MZ twins will have higher covariance due to their greater genetic similarity."
          - letter: "Q43.5"
            text: "Non-twin siblings are equally as suitable as DZ twins for such studies as genetically they are equally similar."
            answer: false
            explanation: "Non-twin siblings experience more differences in environmental exposure than DZ twins (different in utero environment, birth timing, non-symmetrical interactions between siblings of different ages). This violates the equal-environment assumption."

      - id: q44
        number: "Q44"
        difficulty: "hard"
        name: "Gene Drive Technology"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=76"
        subjects:
          - name: "Recombinant DNA & Biotechnology"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology-techniques/"
          - name: "Sex Determination & Sex-Linked Inheritance"
            link: "/resources/7-genetics/sex-determination-sex-linked-inheritance/"
        statements:
          - letter: "Q44.1"
            text: "All progeny of yellow males will have yellow bodies."
            answer: false
            explanation: "Yellow males have yellowmut on their X chromosome and a Y chromosome. Only female progeny receive the X with yellowmut and will have yellow bodies. Male progeny receive the Y chromosome and a normal X from their mother, so they will have brown bodies."
          - letter: "Q44.2"
            text: "All progenies of yellowmut / yellowmut females will have yellow bodies."
            answer: true
            explanation: "All progeny receive an X chromosome with yellowmut from the homozygous mother. The gene drive construct on this X will convert any wild-type yellow allele to yellowmut, ensuring all offspring have yellow bodies."
          - letter: "Q44.3"
            text: "Gene drives targeting genes involved in sex determination and reproduction could become an efficient tool in pest insect population control."
            answer: true
            explanation: "Disrupting sex determination or reproductive genes through gene drive could suppress pest populations by producing sterile offspring or skewing sex ratios, providing an effective biological control method."
          - letter: "Q44.4"
            text: "Lethal loss-of-function mutations could be successfully introduced in insect populations by gene drive technology."
            answer: false
            explanation: "Despite the gene drive multiplying the lethal transgenic construct during development, it would be depleted from the population by natural selection. Individuals carrying lethal mutations die before reproducing, preventing the drive from spreading."

      - id: q45
        number: "Q45"
        difficulty: "hard"
        name: "Mustard Seed Coat Color Inheritance"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=77"
        subjects:
          - name: "Epistasis & Gene Interactions"
            link: "/resources/7-genetics/epistasis-gene-interactions-complementation/"
          - name: "Extranuclear & Non-Mendelian Inheritance"
            link: "/resources/7-genetics/extranuclear-non-mendelian-inheritance/"
        statements:
          - letter: "Q45.1"
            text: "There are two copies of the seed coat color gene in the B. juncea genome."
            answer: true
            explanation: "The 15:1 F3 ratio is characteristic of duplicate genes. B. juncea is amphidiploid, containing two copies of the seed coat color gene from its two parental species."
          - letter: "Q45.2"
            text: "The gene for seed coat color is present in the chloroplast genome."
            answer: false
            explanation: "The gene is nuclear-encoded. If it were chloroplast-encoded (maternal inheritance), yellow seeds would have appeared in the F2 progeny of Cross I, which they did not."
          - letter: "Q45.3"
            text: "Brown is dominant over yellow."
            answer: true
            explanation: "In Cross I, the F1 seeds are brown (from brown mother x yellow father). In Cross III, selfing the F1 gives only brown F2 seeds, with 15:1 brown:yellow appearing in F3. Brown is dominant."
          - letter: "Q45.4"
            text: "F3 progeny from cross II will produce plants with brown and yellow seeds in a ratio of 15:1."
            answer: true
            explanation: "Although F1 seeds from Cross II are yellow (maternal effect on seed coat), the F1 plants have the same AaBb genotype as in Cross I. Selfing gives the same 15:1 ratio in their progeny."

      - id: q46
        number: "Q46"
        difficulty: "hard"
        name: "Mendelian Probability in Pea Pods"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=79"
        subjects:
          - name: "Mendelian Inheritance & Probability"
            link: "/resources/7-genetics/mendelian-inheritance-probability/"
        statements:
          - letter: "Q46.1"
            text: "The probability of all 4 seeds being green is 1/256."
            answer: true
            explanation: "The probability of a single seed being green is 1/4. For 4 independent green seeds: (1/4)^4 = 1/256. Only one combination gives all green."
          - letter: "Q46.2"
            text: "The probability of 3 round and 1 wrinkled seed is 1."
            answer: false
            explanation: "The probability of round is 3/4 and wrinkled is 1/4. For 3 round and 1 wrinkled: 4 x (3/4)^3 x (1/4)^1 = 4 x 27/256 = 108/256 = 27/64, not 1."
          - letter: "Q46.3"
            text: "The probability of 2 green and 2 yellow seeds is 27/128."
            answer: true
            explanation: "Green probability = 1/4, yellow = 3/4. Choose 2 of 4 positions for green: C(4,2) x (1/4)^2 x (3/4)^2 = 6 x 1/16 x 9/16 = 6 x 9/256 = 54/256 = 27/128."
          - letter: "Q46.4"
            text: "The probability of 4 different seed phenotypes in the pod is 243/8192."
            answer: true
            explanation: "The four phenotypes are: yellow round (9/16), yellow wrinkled (3/16), green round (3/16), green wrinkled (1/16). For all 4 different phenotypes in 4 seeds: 4! x 9/16 x 3/16 x 3/16 x 1/16 = 24 x 81/65536 = 1944/65536 = 243/8192."
          - letter: "Q46.5"
            text: "The probability of all 4 seeds having identical phenotypes for both traits is 1/32."
            answer: false
            explanation: "Sum of probabilities for all 4 seeds being the same phenotype: (9/16)^4 + (3/16)^4 + (3/16)^4 + (1/16)^4 = (6561 + 81 + 81 + 1)/65536 = 6724/65536, which does not equal 1/32."

      - id: q47
        number: "Q47"
        difficulty: "hard"
        name: "Neanderthal Ancient DNA and Gene Flow"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=82"
        subjects:
          - name: "Human Evolution & Hominid Phylogeny"
            link: "/resources/15-evolution/human-evolution-and-hominid-phylogeny/"
          - name: "Molecular Evolution & Neutral Theory"
            link: "/resources/15-evolution/molecular-evolution-and-neutral-theory/"
        statements:
          - letter: "Q47.1"
            text: "Neanderthal-like sequences in present-day humans, which result from gene flow, are on average shorter (fewer base pairs long) than those resulting from ILS."
            answer: false
            explanation: "Gene flow occurred ~50 kya, while the common ancestor for ILS sequences existed ~550-750 kya. Introgressed segments have had less time for recombination to break them down, so they are expected to be longer, not shorter."
          - letter: "Q47.2"
            text: "If branch length in tree b was proportional to the number of accumulated mutations, the branch leading to N2 would be expected to be shorter than the branch leading to N1."
            answer: true
            explanation: "N2 is 70 thousand years younger than N1 and thus had less time to accumulate mutations. Its branch would be shorter, proportionally to its younger age."
          - letter: "Q47.3"
            text: "A possible explanation for the difference between the mitochondrial and autosomal trees is a gene flow event from humans to Neanderthals between 400 and 120 thousand years ago, that resulted in human-like mitochondrial DNA being introduced into the gene pool of Neanderthals."
            answer: true
            explanation: "In the autosomal tree, Neanderthals are closer to Denisovans, but their mtDNA is closer to humans. Gene flow from an early human lineage into Neanderthals could replace their mtDNA while affecting only a small fraction of the nuclear genome."
          - letter: "Q47.4"
            text: "By combining Neanderthal-like sequence segments from many (>100) unrelated modern humans, one can only recover around 2-3% of the whole Neanderthal genome."
            answer: false
            explanation: "Although each individual has only 2-3% Neanderthal DNA, different individuals carry mostly non-overlapping segments. By combining many individuals, approximately 20% of the Neanderthal genome has been reconstructed."
          - letter: "Q47.5"
            text: "The maximum frequency of any Neanderthal allele in any present-day non-African population is 3%."
            answer: false
            explanation: "While the mean is 2-3%, individual Neanderthal alleles can reach much higher frequencies due to genetic drift and natural selection. Some segments exceed 10% or even 40% in certain populations."
          - letter: "Q47.6"
            text: "Neanderthal-like segments in present-day humans are expected to have identical sequences to the corresponding genome segments of the N1 specimen."
            answer: false
            explanation: "N1 may not be from the exact population that admixed with humans. Even within a population, genetic variation existed. Additionally, mutations have occurred in the human lineage since the introgression event."
          - letter: "Q47.7"
            text: "Present day Africans share no alleles in common with Neanderthals."
            answer: false
            explanation: "Humans and Neanderthals had a common ancestor and share a large portion of their gene pool through common ancestry (ILS). Africans share many alleles with Neanderthals despite not having received gene flow."

      - id: q48
        number: "Q48"
        difficulty: "easy"
        name: "Vascular Smooth Muscle and Atherosclerosis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=83"
        subjects:
          - name: "Cell Signaling & Communication"
            link: "/resources/1-cell-molecular/cell-signaling-communication/"
          - name: "Cardiovascular Physiology"
            link: "/resources/3-animal-physiology/cardiovascular-physiology/"
        statements:
          - letter: "Q48.1"
            text: "The oxLDL-induced over-proliferation of vascular smooth muscle cells involves MAPK signaling."
            answer: true
            explanation: "This can be directly deduced from the figure, which shows MAPKs (mitogen-activated protein kinases) as part of the signaling pathway triggered by oxLDL in vascular smooth muscle cells."
          - letter: "Q48.2"
            text: "Activatory phosphatases play a key role in the cell cycle regulation of vascular smooth muscle cells."
            answer: true
            explanation: "Based on understanding of cell cycle regulation, activatory phosphatases (such as CDC25 family) are essential for cell cycle progression by activating cyclin-dependent kinases."
          - letter: "Q48.3"
            text: "The inappropriate differentiation of vascular smooth muscle cells into chondrocytes or osteocytes is caused by FSEE."
            answer: false
            explanation: "The inappropriate differentiation into chondrocytes or osteocytes is triggered by oxidized LDL (oxLDL), not by FSEE. FSEE is being tested as a potential therapeutic agent against this pathological process."
          - letter: "Q48.4"
            text: "Only endothelial cells, not vascular smooth muscle cells, can proliferate and cause atherosclerosis."
            answer: false
            explanation: "The figure shows that vascular smooth muscle cells can proliferate and undergo inappropriate differentiation, directly contributing to atherosclerotic plaque formation."

      - id: q49
        number: "Q49"
        difficulty: "medium"
        name: "Lacandonia Flower ABC Model"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=85"
        subjects:
          - name: "Flower Anatomy & Reproductive Structures"
            link: "/resources/6-plant-anatomy/flower-anatomy-reproductive-structures/"
        statements:
          - letter: "Q49.1"
            text: "Lacandonia schismatica flower morphology could be explained by gene expression pattern I."
            answer: true
            explanation: "Pattern I shows an inversion of the B+C (stamen) and C-only (carpel) expression domains compared to normal flowers, matching the unusual Lacandonia morphology with central stamens and peripheral carpels reversed."
          - letter: "Q49.2"
            text: "Flowers of Lacandonia schismatica will lose both petals and carpels if flowers follow gene expression pattern II."
            answer: false
            explanation: "Under gene expression pattern II, the flower would lose only petals, not both petals and carpels. The carpel-specifying gene expression domain remains present."
          - letter: "Q49.3"
            text: "Flowers of Lacandonia schismatica will lose only petals if flowers follow gene expression pattern III."
            answer: false
            explanation: "Under gene expression pattern III, the flower would lose both petals and carpels, not only petals."
          - letter: "Q49.4"
            text: "Lacandonia flowers form typical berries after pollination and fruit ripening."
            answer: false
            explanation: "Lacandonia flowers have independent (free) carpels, so they cannot form a berry, which requires fused carpels. Instead, Lacandonia carpels develop into achenes."
          - letter: "Q49.5"
            text: "Tepals, like sepals, need only A gene expression."
            answer: true
            explanation: "This is clear from the gene expression schemes I through III, where tepals and sepals occupy the same outermost whorl position requiring only A-class gene expression."

      - id: q50
        number: "Q50"
        difficulty: "hard"
        name: "Phytochrome Thermosensing"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=87"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
          - name: "Tropisms & Nastic Movements"
            link: "/resources/5-plant-physiology/tropisms-nastic-movements/"
        statements:
          - letter: "Q50.1"
            text: "The proportion of the Pfr form in total phytochrome molecules at equilibrium is larger at higher temperatures."
            answer: false
            explanation: "Only the non-photochemical rate constant k3 (Pfr to Pr conversion) increases at higher temperatures, while k1 and k2 are unchanged. This means more Pfr is converted to Pr at higher temperatures, so the Pfr proportion decreases."
          - letter: "Q50.2"
            text: "The smaller proportion of Pfr at higher temperature causes greater elongation of the hypocotyl."
            answer: true
            explanation: "Pfr is the active form that suppresses elongation growth. With less Pfr at higher temperatures, the suppression is reduced, allowing greater hypocotyl elongation."
          - letter: "Q50.3"
            text: "Hypocotyl elongation in phytochrome-deficient mutant seedlings is expected to be similar to that of wild-type seedlings grown at low temperatures."
            answer: false
            explanation: "Phytochrome-deficient mutants lack Pfr at any temperature. At low temperatures, wild-type seedlings have high Pfr which suppresses elongation. Mutants behave more like wild-type at high temperatures, where Pfr is low."
          - letter: "Q50.4"
            text: "The effect of temperature on hypocotyl elongation is expected to diminish in total darkness."
            answer: false
            explanation: "In total darkness, only non-photochemical conversions occur, eventually converting all phytochrome to Pr regardless of temperature. Without Pfr, there is no temperature-dependent modulation of elongation through phytochrome."

      - id: q51
        number: "Q51"
        difficulty: "medium"
        name: "C3 vs C4 Photosynthesis"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=89"
        subjects:
          - name: "Calvin Cycle, Photorespiration, C4 & CAM"
            link: "/resources/5-plant-physiology/calvin-cycle-photorespiration-c4-cam/"
        statements:
          - letter: "Q51.1"
            text: "At ambient atmospheric CO2, plant number 1 has a higher net CO2 assimilation rate than plant number 2."
            answer: true
            explanation: "C4 plants (plant 1) have a lower CO2 compensation point (10-20 ppm vs 100 ppm for C3) and higher photosynthetic rates at ambient CO2 levels due to their CO2-concentrating mechanism."
          - letter: "Q51.2"
            text: "At 400 ppm Ci, net CO2 assimilation of plant number 1 is limited by carboxylation."
            answer: false
            explanation: "At 400 ppm Ci, plant 1 (C4) has already reached near-maximum assimilation rate and is not sensitive to further Ci increases, meaning it is NOT limited by carboxylation. Plant 2 (C3) is still limited by carboxylation at this concentration."
          - letter: "Q51.3"
            text: "At high CO2 concentrations, photosynthesis is limited by the capacity of the Calvin cycle to regenerate the acceptor molecule ribulose-1,5-bisphosphate."
            answer: true
            explanation: "At high CO2, Rubisco is saturated and the limiting factor becomes the rate of RuBP regeneration, which depends on electron transport rates providing ATP and NADPH for the Calvin cycle."
          - letter: "Q51.4"
            text: "At ambient atmospheric CO2, plant number 1 has greater photosynthetic water use efficiency than plant number 2."
            answer: true
            explanation: "Plant 1 (C4) achieves much higher photosynthesis rates at ambient CO2, so it fixes more carbon per unit of water lost through stomata, giving it superior water use efficiency."
          - letter: "Q51.5"
            text: "Reducing oxygen concentration from 20% to 2% would shift the Ci response curve of plant number 2 toward that of plant number 1."
            answer: true
            explanation: "Reducing O2 greatly decreases Rubisco's oxygenase activity (photorespiration) in C3 plants, improving their CO2 fixation efficiency and shifting their response curve toward C4-like performance."
          - letter: "Q51.6"
            text: "C3 photosynthesis is favored in high temperature environments, while C4 is favored in high CO2 environments."
            answer: false
            explanation: "The statement is reversed. C4 is favored at high temperatures (less photorespiration penalty), while C3 is favored at high CO2 (where Rubisco oxygenase activity is suppressed and the C4 CO2-concentrating mechanism provides little additional benefit)."

      - id: q52
        number: "Q52"
        difficulty: "medium"
        name: "Phloem Transport Under Water Stress"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=91"
        subjects:
          - name: "Phloem Transport & Translocation"
            link: "/resources/5-plant-physiology/phloem-transport-translocation/"
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "Q52.1"
            text: "Phloem transport of assimilates from source leaves is consistent with the Munch pressure flow theory."
            answer: true
            explanation: "The data showing osmotic pressure-driven movement of assimilates through the phloem is consistent with the Munch pressure flow hypothesis, where a turgor pressure gradient drives bulk flow from source to sink."
          - letter: "Q52.2"
            text: "The decreased consumption of assimilates in expanding sink leaves may increase translocation rate."
            answer: false
            explanation: "Decreased consumption of assimilates in sink leaves would reduce the sink strength, weakening the osmotic gradient driving phloem transport and thus reducing, not increasing, translocation rate."
          - letter: "Q52.3"
            text: "At a leaf water potential of -2.7 MPa, photosynthesis rate was approximately equal to translocation rate."
            answer: true
            explanation: "At -2.7 MPa, photosynthesis was about 25 umol/m2/s while translocation was about 20 umol/m2/s, showing they were approximately equal."
          - letter: "Q52.4"
            text: "At a leaf water potential of -2.0 MPa, translocation had not significantly changed while photosynthesis had already decreased."
            answer: true
            explanation: "Translocation shows no significant change at -2.0 MPa, while photosynthesis has already decreased by about 25%. Translocation is more resistant to mild water stress than photosynthesis."
          - letter: "Q52.5"
            text: "Preferential translocation to growing root tips in moist soil is a significant survival mechanism."
            answer: true
            explanation: "Directing assimilates to root tips growing in moist soil helps the plant access water more effectively, which is a critical survival strategy under water-limited conditions."

      - id: q53
        number: "Q53"
        difficulty: "medium"
        name: "Hydrogen Water and Banana Ripening"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=93"
        subjects:
          - name: "Plant Hormones"
            link: "/resources/5-plant-physiology/plant-hormones/"
        statements:
          - letter: "Q53.1"
            text: "Degreening is a physiological process associated with ripening or senescence of banana fruit."
            answer: true
            explanation: "Color change from green to yellow during banana ripening is degreening, a well-known physiological process associated with chlorophyll degradation during fruit ripening."
          - letter: "Q53.2"
            text: "The integrity of cell wall in HW-treated banana fruit is maintained through reduction in cell wall degradation."
            answer: true
            explanation: "Cell wall integrity can result from both reduced degradation and increased synthesis. The HW treatment helps maintain cell wall integrity."
          - letter: "Q53.3"
            text: "The ripening of control and HW-treated fruit mainly began differentiation after 10 days of storage."
            answer: false
            explanation: "The ripening mainly began differentiation after 19 days of storage, not 10 days, based on the data shown in Figure 1."
          - letter: "Q53.4"
            text: "HW treatment significantly reduced ethylene production and delayed fruit ripening."
            answer: true
            explanation: "HW treatment reduced ethylene production (Figure 1C), delayed color change from green to yellow, slowed fruit softening (reduced firmness loss), and delayed formation of flavor (TSS)."

      - id: q54
        number: "Q54"
        difficulty: "medium"
        name: "Climate Change Effects on Rapeseed Oil"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=94"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
        statements:
          - letter: "Q54.1"
            text: "Combined treatment with all three factors (O3 + CO2 + temperature) reduced the negative impacts on both total oil and polyunsaturated fatty acid content."
            answer: true
            explanation: "The combined treatment showed reduced negative impacts compared to individual factor treatments, suggesting interactive effects that partially offset the damage from each factor alone."
          - letter: "Q54.2"
            text: "Elevated CO2 alone was the single factor with the greatest detrimental effect on seed oil quality."
            answer: false
            explanation: "The CO2 increase of +260 ppm was actually the single factor with the lowest detrimental effect on oil quantity and polyunsaturated fatty acid content."
          - letter: "Q54.3"
            text: "All treatments significantly affected oil quality."
            answer: true
            explanation: "All five treatments showed statistically significant effects (marked with ** or ***), indicating that each combination of environmental factors significantly impacted oil quality."
          - letter: "Q54.4"
            text: "The results showed strong interactive effects of CO2, temperature and O3 on oil quality."
            answer: true
            explanation: "The combined effects were not simply additive; the interactions between CO2, temperature, and O3 produced distinct outcomes that differed from the sum of individual effects."

      - id: q55
        number: "Q55"
        difficulty: "medium"
        name: "Extrafloral Nectaries and Herbivory Defense"
        link: "/papers/ibo/2023/theoretical-2-exam.pdf#page=96"
        subjects:
          - name: "Plant Stress Physiology & Defense"
            link: "/resources/5-plant-physiology/plant-stress-physiology-defense/"
          - name: "Coevolution & Species Interactions"
            link: "/resources/15-evolution/coevolution-and-species-interactions/"
        statements:
          - letter: "Q55.1"
            text: "Plants with extrafloral nectaries (EFNs) suffered less herbivory than plants without EFNs."
            answer: true
            explanation: "Herbivory loss of plants without EFNs was approximately 3-fold greater than those with EFNs, showing that EFNs provide effective biotic defense against herbivores."
          - letter: "Q55.2"
            text: "Both H. umbellata and B. campestris invest in EFNs."
            answer: true
            explanation: "Both species are among those possessing extrafloral nectaries, as indicated in the data."
          - letter: "Q55.3"
            text: "All plants without EFNs had significantly lower SLA (specific leaf area) than plants with EFNs."
            answer: false

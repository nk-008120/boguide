      - id: q1
        number: "Q1"
        difficulty: "medium"
        name: "Protein Tertiary Structure Interactions"
        link: "/papers/inbo/2026/theory-exam.pdf#page=2"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "Q1"
            type: "mcq"
            text: "M, N, O and P in the tertiary structure diagram respectively represent:"
            options:
              - {key: "a", text: "ionic bond; disulphide bridge; hydrogen bond and hydrophobic interactions"}
              - {key: "b", text: "hydrophobic interactions; ionic bonds; disulphide bridge and hydrogen bond"}
              - {key: "c", text: "hydrogen bond; disulphide bridge; ionic bond and hydrogen bond"}
              - {key: "d", text: "ionic bond; disulphide bridge; hydrophobic interaction and hydrogen bond"}
            answer: "a"
            explanation: "In a protein's tertiary structure, the key stabilizing forces include ionic bonds (salt bridges between charged residues), disulphide bridges (covalent S-S bonds between cysteine residues), hydrogen bonds (between polar side chains), and hydrophobic interactions (clustering of nonpolar side chains in the interior). The diagram's labels M through P map to ionic bond, disulphide bridge, hydrogen bond, and hydrophobic interactions respectively."

      - id: q2
        number: "Q2"
        difficulty: "medium"
        name: "Plasmid Processing Enzyme (Gel Electrophoresis)"
        link: "/papers/inbo/2026/theory-exam.pdf#page=2"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology/"
        statements:
          - letter: "Q2"
            type: "mcq"
            text: "A purified pUC57 plasmid (P) was incubated with a DNA processing enzyme (E). Lane M is DNA ladder, Lane P is plasmid-only control, Lane P+E is plasmid incubated with the enzyme. The enzyme E most likely is:"
            options:
              - {key: "a", text: "blunt-end restriction endonuclease"}
              - {key: "b", text: "type I topoisomerase"}
              - {key: "c", text: "sequence-specific exonuclease"}
              - {key: "d", text: "nicking endonuclease"}
            answer: "d"
            explanation: "A supercoiled plasmid (compact, fast-migrating band in lane P) treated with a nicking endonuclease gets a single-strand break, converting it to an open-circular (relaxed) form that migrates more slowly on the gel. This produces the characteristic shift to a higher band without linearization or degradation. A restriction enzyme would linearize the plasmid (single band at the expected size); a topoisomerase would relax it but is not typically classified as a 'DNA processing enzyme' in this context; an exonuclease would degrade it."

      - id: q3
        number: "Q3"
        difficulty: "hard"
        name: "Membrane Fluidity and Gel-to-Fluid Transition"
        link: "/papers/inbo/2026/theory-exam.pdf#page=3"
        subjects:
          - name: "Lipids & Membrane Biochemistry"
            link: "/resources/1-cell-molecular/lipids-membrane-biochemistry/"
        statements:
          - letter: "Q3"
            type: "mcq"
            text: "Two figures depict the gel-to-fluid transition temperature (Tm) of three membrane types and the effect of chain length and double bonds on fatty acid Tm. Mark the correct statement."
            options:
              - {key: "a", text: "Animals living in sub-zero habitats most likely have fewer double bonds with a chain length of 10 C atoms or more."}
              - {key: "b", text: "Membranes with oleate enriched fatty acids are essential for homeotherms living in tropical climates."}
              - {key: "c", text: "Curves I and II represent membranes of terrestrial animals while III represents aquatic animals."}
              - {key: "d", text: "Membranes with higher stearate content are likely to be less fluidic than those with higher oleate content."}
            answer: "d"
            explanation: "Stearate (18:0) is a fully saturated 18-carbon fatty acid with a high melting point (~70 C), while oleate (18:1) has one double bond that introduces a kink, lowering the melting point (~13 C) and increasing fluidity. Membranes enriched in stearate pack more tightly (more van der Waals contacts between straight saturated chains), resulting in lower fluidity compared to oleate-enriched membranes. The other options contain factual errors regarding the relationship between double bonds, chain length, and habitat temperature."

      - id: q4
        number: "Q4"
        difficulty: "medium"
        name: "Conformational Entropy and Free Energy"
        link: "/papers/inbo/2026/theory-exam.pdf#page=3"
        subjects:
          - name: "Bioenergetics & Central Metabolism Overview"
            link: "/resources/1-cell-molecular/bioenergetics-central-metabolism/"
        statements:
          - letter: "Q4"
            type: "mcq"
            text: "A biomolecule of 100 atoms can exist in two structural states, O (2000 conformations) and P (5000 conformations), with identical energies at room temperature. Which statement is correct?"
            options:
              - {key: "a", text: "State O will have lower free energy than State P."}
              - {key: "b", text: "State O will have lower entropy than State P."}
              - {key: "c", text: "State P will have lower entropy than State O."}
              - {key: "d", text: "Both State P and State O will have the same entropy."}
            answer: "b"
            explanation: "Entropy is related to the number of microstates (conformations) by S = k_B ln(W). Since state P has 5000 conformations versus state O's 2000, state P has higher entropy (S_P = k_B ln(5000) > S_O = k_B ln(2000)). Therefore state O has lower entropy than state P. Since the energies are identical, the free energy difference (G = H - TS) is driven entirely by the entropy term, making state P the lower free energy state."

      - id: q5
        number: "Q5"
        difficulty: "hard"
        name: "Suppressor tRNA and Stop Codon Readthrough"
        link: "/papers/inbo/2026/theory-exam.pdf#page=3"
        subjects:
          - name: "Translation & The Genetic Code"
            link: "/resources/1-cell-molecular/translation-genetic-code/"
        statements:
          - letter: "Q5"
            type: "mcq"
            text: "A synthetic mRNA 5'-AUG UUA GGU UGG UAA-3' yields Met-Leu-Gly-Trp in wild-type E. coli but Met-Leu-Gly-Trp-Tyr in a mutant strain with a tRNA carrying tyrosine and anticodon AUU. Which interpretation best explains this?"
            options:
              - {key: "a", text: "i only"}
              - {key: "b", text: "iii only"}
              - {key: "c", text: "i and iii only"}
              - {key: "d", text: "i, ii and iii"}
            answer: "a"
            explanation: "The mutant tRNA has anticodon 3'-AUU-5', which pairs with codon 5'-UAA-3' (the stop codon). This tRNA inserts tyrosine at what would normally be a termination signal, producing the extended peptide Met-Leu-Gly-Trp-Tyr. This is a classic suppressor tRNA mechanism. Interpretation (i) alone explains the result. No frameshift occurred (the upstream peptide is unchanged), and the ribosome correctly recognizes AUG as the start codon."

      - id: q6
        number: "Q6"
        difficulty: "medium"
        name: "Gibberellic Acid and Light Effects on Hypocotyl Growth"
        link: "/papers/inbo/2026/theory-exam.pdf#page=4"
        subjects:
          - name: "Plant Hormones & Growth Regulators"
            link: "/resources/5-plant-physiology/plant-hormones-growth-regulators/"
        statements:
          - letter: "Q6"
            type: "mcq"
            text: "When the effect of gibberellic acid (GA3) and light was studied on hypocotyl growth of mustard seedlings, the following graph was obtained. Mark the correct statement."
            options:
              - {key: "a", text: "GA3 and light have a synergistic effect on hypocotyl length elongation."}
              - {key: "b", text: "GA3 alone is an essential factor for elongation of hypocotyl to occur."}
              - {key: "c", text: "GA3 cannot override the effects of light and lead to hypocotyl length stimulation."}
              - {key: "d", text: "Results are indicative of numerical additive inhibitory effect of Pfr and stimulating effect of GA3."}
            answer: "d"
            explanation: "In etiolated (dark-grown) seedlings, hypocotyls elongate significantly. Light (via phytochrome Pfr) inhibits hypocotyl elongation, while GA3 promotes it. The graph shows that the combined effect of light inhibition and GA3 stimulation is additive rather than synergistic -- the GA3-induced elongation in light equals the sum of GA3's stimulating effect minus light's inhibitory effect. GA3 is not essential (elongation occurs without it in the dark), and GA3 can partially override light's inhibitory effect."

      - id: q7
        number: "Q7"
        difficulty: "easy"
        name: "Apical Dominance and Auxiliary Bud Dormancy"
        link: "/papers/inbo/2026/theory-exam.pdf#page=5"
        subjects:
          - name: "Plant Hormones & Growth Regulators"
            link: "/resources/5-plant-physiology/plant-hormones-growth-regulators/"
        statements:
          - letter: "Q7"
            type: "mcq"
            text: "In a heavily shaded forest, many auxiliary buds remain dormant. This helps to:"
            options:
              - {key: "a", text: "prevent loss of water by excessive transpiration over a wider area."}
              - {key: "b", text: "prevent exchange of volatile signals from neighboring plants."}
              - {key: "c", text: "redirect resources to enhance vertical growth."}
              - {key: "d", text: "have better capillary pull of water to reach the ends of branches."}
            answer: "c"
            explanation: "In a heavily shaded forest understory, light is the limiting resource. By maintaining apical dominance and keeping auxiliary buds dormant, the plant channels its limited resources (photosynthates, nutrients) toward vertical (apical) growth to reach the canopy where light is available. This is a resource allocation strategy driven by auxin from the apical meristem, not primarily about water conservation or signaling."

      - id: q9
        number: "Q9"
        difficulty: "medium"
        name: "Phloem Sap Exudation and Light Dependence"
        link: "/papers/inbo/2026/theory-exam.pdf#page=5"
        subjects:
          - name: "Phloem Transport & Source-Sink Relations"
            link: "/resources/5-plant-physiology/phloem-transport-source-sink/"
        statements:
          - letter: "Q9"
            type: "mcq"
            text: "Phloem sap exudation from a severed aphid stylet decreases when the plant is kept in dark. The correct order of underlying processes is:"
            options:
              - {key: "a", text: "reduced water entry into sieve tubes -> less sucrose loaded into phloem -> osmotic potential less negative -> slower sap exudation -> lower turgor pressure."}
              - {key: "b", text: "less sucrose loaded into phloem -> osmotic potential more negative -> reduced water entry into sieve tubes -> slower sap exudation."}
              - {key: "c", text: "osmotic potential less negative -> reduced water entry into sieve tubes -> lower turgor pressure -> slower sap exudation."}
              - {key: "d", text: "less sucrose loaded into phloem -> osmotic potential less negative -> reduced water entry into sieve tubes -> lower turgor pressure -> slower sap exudation."}
            answer: "c"
            explanation: "In darkness, photosynthesis stops, reducing sucrose production and phloem loading. However, the question asks for the correct ORDER of the downstream processes. Starting from the immediate cause at the sieve tubes: with less sucrose being loaded, the osmotic potential of sieve tube sap becomes less negative, which reduces osmotic water entry from xylem, which lowers turgor pressure in the sieve tubes, which slows the pressure-driven mass flow of sap and thus exudation rate. Option (c) captures this downstream sequence correctly."

      - id: q10
        number: "Q10"
        difficulty: "easy"
        name: "Rigor Mortis and ATP Depletion"
        link: "/papers/inbo/2026/theory-exam.pdf#page=6"
        subjects:
          - name: "Muscle Physiology"
            link: "/resources/3-animal-physiology/muscle-physiology/"
        statements:
          - letter: "Q10"
            type: "mcq"
            text: "Approximately four hours after death, the body stiffens (Rigor mortis). The reason behind this phenomenon is:"
            options:
              - {key: "a", text: "Severe calcium deficiency in the skeletal muscles following death, leading to continuous contractile stimuli, as seen in the case of tetanus."}
              - {key: "b", text: "Progressive muscle fibrosis (a condition where extracellular matrix molecules, like collagen, deposits in muscles), which causes hardening of muscles."}
              - {key: "c", text: "Unavailability of ATP, which keeps the myosin head in 'lock' position with actin filaments."}
              - {key: "d", text: "Rapid degeneration of ligaments and tendons, which limits bone and muscle movement."}
            answer: "c"
            explanation: "After death, cellular metabolism ceases and ATP is no longer produced. ATP is required for the detachment of myosin heads from actin filaments during the cross-bridge cycle. Without ATP, myosin heads remain bound to actin in a rigid 'lock' state (the rigor configuration), causing the characteristic stiffness of rigor mortis. This is not due to calcium deficiency, fibrosis, or tendon degeneration."

      - id: q11
        number: "Q11"
        difficulty: "medium"
        name: "Homeotherm Heat Production and Loss"
        link: "/papers/inbo/2026/theory-exam.pdf#page=6"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "Q11"
            type: "mcq"
            text: "The relationship between heat production and heat loss as a function of ambient temperature for a homeotherm is shown. P, Q, and R respectively indicate:"
            options:
              - {key: "a", text: "Evaporative water loss, Peripheral blood flow, Oxygen consumption"}
              - {key: "b", text: "Oxygen consumption, Peripheral blood flow, Evaporative water loss"}
              - {key: "c", text: "Oxygen consumption, Evaporative water loss, Metabolic heat production"}
              - {key: "d", text: "Peripheral blood flow, Evaporative water loss, Oxygen consumption"}
            answer: "b"
            explanation: "In the classic homeotherm thermoregulation diagram: below the lower critical temperature (LCT), oxygen consumption (metabolic heat production) increases to compensate for heat loss -- this is curve P. Within the thermoneutral zone, peripheral blood flow (vasodilation/vasoconstriction) adjusts to regulate heat loss -- this is curve Q. Above the upper critical temperature (UCT), evaporative water loss (sweating/panting) becomes the primary cooling mechanism and increases sharply -- this is curve R."

      - id: q12
        number: "Q12"
        difficulty: "hard"
        name: "Bat Kidney Morphology and Diet"
        link: "/papers/inbo/2026/theory-exam.pdf#page=6"
        subjects:
          - name: "Comparative Osmoregulation & Excretion"
            link: "/resources/3-animal-physiology/comparative-osmoregulation-excretion/"
        statements:
          - letter: "Q12"
            type: "mcq"
            text: "Renal indices of three groups of bats with different diets are shown in scatter plots. The cortex handles initial filtration while the medulla produces concentrated urine. Groups I, II and III most likely represent:"
            options:
              - {key: "a", text: "Omnivores; Insectivores; Frugivores"}
              - {key: "b", text: "Frugivores; Omnivores; Carnivores"}
              - {key: "c", text: "Insectivores; Frugivores; Omnivores"}
              - {key: "d", text: "Insectivores; Omnivores; Nectarivores"}
            answer: "d"
            explanation: "Insectivorous bats consume protein-rich diets producing urea and uric acid, requiring a relatively thick medulla for urine concentration. Omnivorous bats have intermediate kidney morphology. Nectarivorous bats process large volumes of dilute nectar, requiring high filtration capacity (larger cortex relative to medulla) and producing dilute urine. The scatter plot data showing medulla-to-cortex ratios and kidney sizes would place insectivores (high concentration), omnivores (intermediate), and nectarivores (high volume, low concentration) in that order."

      - id: q13
        number: "Q13"
        difficulty: "medium"
        name: "lac Operon Regulation (Glucose and Lactose)"
        link: "/papers/inbo/2026/theory-exam.pdf#page=7"
        subjects:
          - name: "Gene Regulation: Prokaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-prokaryotic/"
        statements:
          - letter: "Q13"
            type: "mcq"
            text: "An E. coli culture was grown under four nutrient conditions and beta-galactosidase activity measured. Which statement most accurately explains the molecular basis for the observed results?"
            options:
              - {key: "a", text: "The presence of glucose prevents formation of CAP-cAMP complex limiting operon induction even when lactose is available."}
              - {key: "b", text: "Absence of glucose permits efficient uptake of lactose, but allolactose cannot inactivate the repressor unless cAMP is degraded, hence transcription remains low."}
              - {key: "c", text: "When both lactose and glucose are absent, the lac operon is repressed solely because CAP-cAMP complex binds strongly to the promoter, preventing RNA polymerase attachment."}
              - {key: "d", text: "Glucose enhances adenylate cyclase activity, producing high cAMP that represses lac operon transcription until lactose concentration falls below threshold."}
            answer: "a"
            explanation: "The lac operon requires both the absence of glucose (for high cAMP and CAP-cAMP activation) and the presence of lactose (for allolactose to inactivate the repressor). Glucose inhibits adenylate cyclase, keeping cAMP levels low and preventing CAP-cAMP complex formation. This is catabolite repression. Even when lactose is present (condition B), glucose keeps cAMP low, so CAP-cAMP cannot bind the promoter and transcription remains low. Only condition D (no glucose + lactose) gives high expression."

      - id: q14
        number: "Q14"
        difficulty: "hard"
        name: "Cytogenetic Analysis of Sex Chromosome Abnormalities"
        link: "/papers/inbo/2026/theory-exam.pdf#page=7"
        subjects:
          - name: "Cell Cycle, Mitosis & Meiosis"
            link: "/resources/1-cell-molecular/cell-cycle-mitosis-meiosis/"
        statements:
          - letter: "Q14"
            type: "mcq"
            text: "Two individuals P (45 chromosomes, 0 Barr bodies, no SRY, rudimentary gonads) and Q (47 chromosomes, 1 Barr body, SRY present, small testes with gynecomastia) were analyzed. Which interpretation best explains these findings?"
            options:
              - {key: "a", text: "P: Loss of one X chromosome after fertilization (post-zygotic nondisjunction) -> mosaic; Q: Gain of one Y chromosome -> abnormal testicular development"}
              - {key: "b", text: "P: 45,XY complement with SRY mutation -> defective testis differentiation; Q: 47,XYY -> enhanced spermatogenesis"}
              - {key: "c", text: "P: Loss of one sex chromosome during gametogenesis -> monosomy with female phenotype due to absence of SRY; Q: Gain of one sex chromosome during gametogenesis -> presence of Y initiates male development but extra X causes partial feminization"}
              - {key: "d", text: "P: Duplication of X chromosome -> overexpression; Q: Loss of one X -> male by default"}
            answer: "c"
            explanation: "Individual P has 45 chromosomes, 0 Barr bodies, and no SRY -- consistent with 45,X (Turner syndrome). The single X (no Barr body, since Barr bodies = number of X chromosomes minus 1) and absent SRY explain the female phenotype with rudimentary ovarian development. Individual Q has 47 chromosomes, 1 Barr body, and SRY present -- consistent with 47,XXY (Klinefelter syndrome). The Y chromosome's SRY gene drives male development, but the extra X (1 Barr body = 2 X chromosomes) causes dosage imbalance leading to gynecomastia and small testes. Option (c) correctly identifies nondisjunction during gametogenesis as the mechanism for both."

      - id: q15
        number: "Q15"
        difficulty: "medium"
        name: "Food Hoarding vs Fat Storage Under Uncertainty"
        link: "/papers/inbo/2026/theory-exam.pdf#page=8"
        subjects:
          - name: "Foraging Behavior & Optimal Strategies"
            link: "/resources/9-ethology/foraging-behavior-optimal-strategies/"
        statements:
          - letter: "Q15"
            type: "mcq"
            text: "Marsh tit birds were fed at uniform vs highly unpredictable times, and seed hoarding and body mass changes were measured. Mark the correct statement."
            options:
              - {key: "a", text: "Hoarding is directly and fat storage is inversely proportional to variability in food supply."}
              - {key: "b", text: "Birds prefer to store the extra energetic buffer as fat when there is scarcity of food."}
              - {key: "c", text: "It is likely that the storage of food as fat is energetically more demanding than hoarding."}
              - {key: "d", text: "The birds may be adopting a strategy of reduction in energy requirements through prolonged fat-storing torpor during times of reduced food resource availability."}
            answer: "c"
            explanation: "The data show that when food availability is unpredictable, birds increase hoarding behavior rather than increasing fat storage. This suggests that hoarding is the preferred buffer strategy under uncertainty. Fat storage is metabolically costly -- maintaining adipose tissue requires energy, increases predation risk (heavier body), and the conversion of food to fat and back is thermodynamically inefficient. Hoarding, by contrast, stores food externally with lower metabolic overhead, making it the less energetically demanding strategy."

      - id: q16
        number: "Q16"
        difficulty: "easy"
        name: "Navigation in Migratory Animals"
        link: "/papers/inno/2026/theory-exam.pdf#page=9"
        subjects:
          - name: "Migration & Navigation"
            link: "/resources/9-ethology/migration-navigation/"
        statements:
          - letter: "Q16"
            type: "mcq"
            text: "Which of the following is extensively used by migratory insects/birds/animals for navigation? (i) Foliage density, (ii) UV polarized rays of the sun, (iii) Earth's magnetic field, (iv) Humidity and air density."
            options:
              - {key: "a", text: "i and ii only"}
              - {key: "b", text: "ii, iii and iv"}
              - {key: "c", text: "ii and iii only"}
              - {key: "d", text: "iii and iv only"}
            answer: "c"
            explanation: "Migratory animals extensively use two major navigation cues: polarized light patterns from the sun (used by insects like monarch butterflies and many bird species for compass orientation) and Earth's magnetic field (magnetoreception, used by sea turtles, birds, and various other taxa for both compass and map information). Foliage density and humidity/air density are not established primary navigation cues for long-distance migration."

      - id: q17
        number: "Q17"
        difficulty: "hard"
        name: "Global Hydrological Cycle Turnover Times"
        link: "/papers/inbo/2026/theory-exam.pdf#page=9"
        subjects:
          - name: "Ecosystem Ecology & Biogeochemical Cycles"
            link: "/resources/8-ecology/ecosystem-ecology-biogeochemical-cycles/"
        statements:
          - letter: "Q17"
            type: "mcq"
            text: "Consider statements about the global hydrological cycle: (I) atmospheric turnover shorter than large lakes, (II) evapotranspiration flux > ocean-to-land moisture flux, (III) ice reservoir > groundwater, (IV) atmospheric reservoir > groundwater. Which combination is true?"
            options:
              - {key: "a", text: "I, II and III only"}
              - {key: "b", text: "I, III and IV only"}
              - {key: "c", text: "I and III only"}
              - {key: "d", text: "II and IV only"}
            answer: "a"
            explanation: "Statement I is true: atmospheric water turns over in about 9-10 days, while large lakes like Lake Victoria have turnover times of decades. Statement II is true: total evapotranspiration from land surfaces (~70,000 km3/yr) exceeds the net moisture transport from oceans to land (~40,000 km3/yr), because much of the evapotranspired water re-precipitates over land. Statement III is true: ice caps and glaciers (~26.4 million km3) hold more water than groundwater (~10.6 million km3). Statement IV is false: the atmospheric reservoir (~13,000 km3) is far smaller than groundwater."

      - id: q18
        number: "Q18"
        difficulty: "medium"
        name: "Carbon Cycle Flux Ranking"
        link: "/papers/inbo/2026/theory-exam.pdf#page=9"
        subjects:
          - name: "Ecosystem Ecology & Biogeochemical Cycles"
            link: "/resources/8-ecology/ecosystem-ecology-biogeochemical-cycles/"
        statements:
          - letter: "Q18"
            type: "mcq"
            text: "Which of the following represents the correct combination of the carbon cycle flux ranking?"
            options:
              - {key: "a", text: "The correct ranking as given in option a"}
              - {key: "b", text: "The ranking as given in option b"}
              - {key: "c", text: "The ranking as given in option c"}
              - {key: "d", text: "The ranking as given in option d"}
            answer: "a"
            explanation: "The global carbon cycle fluxes, from largest to smallest, follow the ordering presented in option (a). Ocean-atmosphere exchange and terrestrial photosynthesis/respiration represent the largest fluxes, followed by land-use change and fossil fuel emissions, with volcanic emissions being the smallest natural flux."

      - id: q19
        number: "Q19"
        difficulty: "medium"
        name: "Speckled Wood Butterfly Territorial Strategy"
        link: "/papers/inbo/2026/theory-exam.pdf#page=10"
        subjects:
          - name: "Aggression & Social Structure"
            link: "/resources/9-ethology/aggression-social-structure/"
        statements:
          - letter: "Q19"
            type: "mcq"
            text: "In speckled wood butterflies, territory owners (Q) and intruders (P) engage in spiral flights where the intruder always retreats. When male R is released into S's territory without either noticing, the strategy adopted by P, Q, R and S respectively is:"
            options:
              - {key: "a", text: "Dove, Hawk, Hawk, Hawk"}
              - {key: "b", text: "Hawk, Hawk, Hawk, Dove"}
              - {key: "c", text: "Dove, Hawk, Dove, Dove"}
              - {key: "d", text: "Hawk, Dove, Hawk, Dove"}
            answer: "a"
            explanation: "In the Hawk-Dove game framework: P (the intruder) always retreats after the spiral flight, adopting the Dove strategy. Q (the territory owner) holds the territory and the intruder always yields to it, so Q plays Hawk. In the second experiment, R is released into S's territory without either noticing the other. Since both R and S believe they are the rightful owner, both adopt the Hawk strategy (neither yields initially), leading to an escalated contest -- this is the key prediction when ownership is ambiguous."

      - id: q20
        number: "Q20"
        difficulty: "easy"
        name: "Migration Cost Minimization Strategies"
        link: "/papers/inbo/2026/theory-exam.pdf#page=10"
        subjects:
          - name: "Migration & Navigation"
            link: "/resources/9-ethology/migration-navigation/"
        statements:
          - letter: "Q20"
            type: "mcq"
            text: "Which of the following strategies will NOT always minimize cost in migratory organisms?"
            options:
              - {key: "a", text: "Increasing body weight prior to migration"}
              - {key: "b", text: "Formation of a V in migrating flocks"}
              - {key: "c", text: "Butterflies flying on less windy days."}
              - {key: "d", text: "Taking the shortest route"}
            answer: "d"
            explanation: "Taking the shortest route does not always minimize migration cost because the shortest geographic distance may cross unfavorable terrain (mountains, open water with no rest stops), face persistent headwinds, or lack refueling opportunities. Many migratory species take longer routes that follow coastlines, use prevailing tailwinds, or include stopover sites. The other strategies (fat loading for fuel, V-formation for aerodynamic drafting, and avoiding wind for small insects) are generally cost-reducing."

      - id: q21
        number: "Q21"
        difficulty: "easy"
        name: "Convergent Evolution in Desert Plants"
        link: "/papers/inbo/2026/theory-exam.pdf#page=10"
        subjects:
          - name: "Evidence for Evolution"
            link: "/resources/15-evolution/evidence-for-evolution/"
        statements:
          - letter: "Q21"
            type: "mcq"
            text: "Cacti spines are modified leaves whereas Euphorbia spines are modified shoots. Both evolved in desert environments. This is an example of:"
            options:
              - {key: "a", text: "Convergent evolution"}
              - {key: "b", text: "Divergent evolution"}
              - {key: "c", text: "Adaptive radiation"}
              - {key: "d", text: "Disruptive selection"}
            answer: "a"
            explanation: "Cacti (family Cactaceae) and Euphorbias (family Euphorbiaceae) are distantly related plant families that independently evolved similar morphological adaptations (succulent stems, spines, reduced leaves) in response to similar desert environmental pressures. The spines have different developmental origins (modified leaves vs modified shoots), confirming they are analogous structures, not homologous. This is the definition of convergent evolution."

      - id: q22
        number: "Q22"
        difficulty: "medium"
        name: "Cladogram Group Classification"
        link: "/papers/inbo/2026/theory-exam.pdf#page=11"
        subjects:
          - name: "Phylogenetic Trees & Cladistics"
            link: "/resources/4-biosystematics/phylogenetic-trees-cladistics/"
        statements:
          - letter: "Q22"
            type: "mcq"
            text: "A cladogram of plant specimens A-J is shown. Boxes indicated by solid line, dotted line, and dashed line respectively indicate:"
            options:
              - {key: "a", text: "Monophyletic group; paraphyletic group; polyphyletic group"}
              - {key: "b", text: "Paraphyletic group; polyphyletic group; monophyletic group"}
              - {key: "c", text: "Polyphyletic group; paraphyletic group; monophyletic group"}
              - {key: "d", text: "Monophyletic group; polyphyletic group; paraphyletic group"}
            answer: "b"
            explanation: "A paraphyletic group includes an ancestor and some but not all of its descendants (solid line box). A polyphyletic group includes members from different lineages without their common ancestor (dotted line box). A monophyletic group (clade) includes an ancestor and all of its descendants (dashed line box). The arrangement of specimens A-J on the cladogram and the three box types map to these definitions in the order given by option (b)."

      - id: q23
        number: "Q23"
        difficulty: "medium"
        name: "Gene Size, Introns and mRNA Analysis"
        link: "/papers/inbo/2026/theory-exam.pdf#page=12"
        subjects:
          - name: "Gene Expression & RNA Processing"
            link: "/resources/1-cell-molecular/gene-expression-rna-processing/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "The average size of introns is directly proportional to the size of the gene."
            answer: "false"
            explanation: "Comparing the genes: Collagen has (38-5)/50 = 0.66 kb avg intron size for 38 kbp gene, while Dystrophin has (2000-17)/50 = 39.7 kb avg intron for 2000 kbp. Insulin has (1.7-0.4)/2 = 0.65 kb for 1.7 kbp gene. The ratio of gene size to average intron size is not constant across genes, so the relationship is not directly proportional."
          - letter: "b"
            type: "true_false"
            text: "The dystrophin gene has the longest introns with an average size of about 40 kb."
            answer: "true"
            explanation: "Dystrophin gene: (2000 - 17) / 50 introns = 39.66 kb per intron on average, which is approximately 40 kb. This is by far the largest average intron size among the listed genes."
          - letter: "c"
            type: "true_false"
            text: "On translation, the albumin gene produces about 100 amino acids less than the phenylalanine hydroxylase gene."
            answer: "true"
            explanation: "Albumin mRNA is 2.1 kbp and Phenylalanine hydroxylase mRNA is 2.4 kbp. The difference in coding capacity is approximately (2400-2100)/3 = 100 codons, meaning about 100 fewer amino acids (accounting for UTRs, the approximation holds)."
          - letter: "d"
            type: "true_false"
            text: "The average intron size of collagen is about 25 times smaller than that of insulin."
            answer: "false"
            explanation: "Collagen avg intron: (38-5)/50 = 0.66 kb. Insulin avg intron: (1.7-0.4)/2 = 0.65 kb. These are almost identical in size, not 25 times different. The question reverses the comparison -- collagen introns are about the same size as insulin introns, not 25 times smaller."

      - id: q24
        number: "Q24"
        difficulty: "hard"
        name: "Transcription Factor Activation Pathway"
        link: "/papers/inbo/2026/theory-exam.pdf#page=12"
        subjects:
          - name: "Gene Regulation: Eukaryotic"
            link: "/resources/1-cell-molecular/gene-regulation-eukaryotic/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "When cells are treated with effector (E) and inhibitor of phosphatase, the transcription factor will be translocated into the nucleus, and there will be activation of genes regulated by the transcription factor."
            answer: "true"
            explanation: "Effector E phosphorylates I (leading to its degradation) and Y. A phosphatase inhibitor would maintain phosphorylation of both I and Y, keeping I degraded and Y phosphorylated. Phosphorylated Y + X translocates to the nucleus and activates transcription."
          - letter: "b"
            type: "true_false"
            text: "When cells are treated with effector (E) and inhibitor of ubiquitinylation, the transcription factor will be translocated into the nucleus, but there will be no activation of genes regulated by the transcription factor."
            answer: "false"
            explanation: "Effector E phosphorylates I and Y. Inhibiting ubiquitinylation prevents degradation of phosphorylated I, so I remains in the cytosol. However, the question states that phosphorylated I is ubiquitinylated and degraded -- if ubiquitinylation is blocked, phosphorylated I persists and could still sequester X-Y. But phosphorylated Y with X should still translocate. The net effect depends on whether phosphorylated I still binds the heterodimer; the official answer indicates this statement is false."
          - letter: "c"
            type: "true_false"
            text: "When cells are treated with effector (E) and inhibitor of deacetylase, the transcription factor will be translocated into the nucleus and there will be enhanced activation of genes regulated by the transcription factor."
            answer: "true"
            explanation: "Effector E activates the pathway normally, and inhibiting deacetylase maintains Y in the acetylated state. Since acetylation of Y augments gene activation, the combination of normal pathway activation plus enhanced acetylation leads to enhanced gene expression."
          - letter: "d"
            type: "true_false"
            text: "When cells are treated with effector (E) only, the transcription factor will not be translocated into the nucleus and there will be no activation of genes."
            answer: "false"
            explanation: "Effector E alone activates the full pathway: it phosphorylates I (leading to ubiquitinylation and degradation) and Y. Phosphorylated Y + X then translocates to the nucleus for gene activation. So effector E alone IS sufficient for nuclear translocation and gene activation."

      - id: q25
        number: "Q25"
        difficulty: "hard"
        name: "Degenerate Oligonucleotide Probe Design"
        link: "/papers/inbo/2026/theory-exam.pdf#page=13"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology/"
        statements:
          - letter: "Q25"
            type: "numeric"
            text: "If probes have to be designed separately for each region, how many total possible oligonucleotide probes would have to be synthesized?"
            expected: 32
            tolerance: 0
            explanation: "Each region contributes a number of possible sequences based on degeneracy: region 1 has 2^4 = 16 possibilities and region 2 has 2^4 = 16 possibilities. Total probes = 16 + 16 = 32 (since the probes are designed separately for each region, the totals are added, not multiplied)."

      - id: q26
        number: "Q26"
        difficulty: "hard"
        name: "Protein Molecules in a Hepatocyte"
        link: "/papers/inbo/2026/theory-exam.pdf#page=13"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "Q26"
            type: "numeric"
            text: "Calculate the number of protein molecules in a typical eukaryotic hepatocyte (cube with 15 um side, density 1.03 g/mL, 20% protein by weight, average MW 52700 g/mol)."
            expected: 7940000000.0
            tolerance: 120000000.0
            explanation: "Volume = (15 x 10^-4 cm)^3 = 3.375 x 10^-9 cm^3 = 3.375 x 10^-9 mL. Mass = 3.375 x 10^-9 x 1.03 = 3.476 x 10^-9 g. Protein mass = 0.20 x 3.476 x 10^-9 = 6.953 x 10^-10 g. Moles of protein = 6.953 x 10^-10 / 52700 = 1.319 x 10^-14 mol. Number = 1.319 x 10^-14 x 6.02 x 10^23 = 7.94 x 10^9 molecules."

      - id: q27
        number: "Q27"
        difficulty: "hard"
        name: "Restriction Enzyme Mapping"
        link: "/papers/inbo/2026/theory-exam.pdf#page=13"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology/"
        statements:
          - letter: "Q27"
            type: "free_response"
            text: "Based on the restriction digestion fragments, draw the restriction map indicating positions of P and Q cut sites and fragment lengths between sites."
            modelAnswer: "Linear map (21 kbp): 0--[P at 9]--[Q at 10.4]--[Q at 14.6]--[P at 17.6]--21. Fragments between sites: 9, 1.4, 4.2, 3.0, 3.4 kbp. The double digestion fragments (9, 1.4, 4.2, 3.0, 3.4) confirm the ordering of cut sites."
            explanation: "Working from single digests: P cuts at positions 9 and 16.2 (giving 9, 7.2, 4.8). Q cuts at positions 10.4 and 18 (giving 10.4, 7.6, 3). Double digestion confirms the interleaving of P and Q sites on the linear molecule."

      - id: q28
        number: "Q28"
        difficulty: "hard"
        name: "Gaucher Disease GCase Mutation Analysis"
        link: "/papers/inbo/2026/theory-exam.pdf#page=14"
        subjects:
          - name: "Protein Structure, Folding & Function"
            link: "/resources/1-cell-molecular/protein-structure-folding-function/"
        statements:
          - letter: "a"
            type: "mcq"
            text: "The mutation in GCase was not in the active site of the enzyme."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "inconclusive", text: "Inconclusive"}
            answer: "true"
            explanation: "The experiments show reduced protein levels (Western blot) that are rescued by proteasome inhibitor, indicating the mutation causes misfolding and proteasomal degradation. The reduced activity in Experiment A is due to reduced protein stability (misfolding), not a direct active-site mutation. A misfolded protein can have reduced catalytic efficiency without the mutation being in the active site."
          - letter: "b"
            type: "mcq"
            text: "The mutation affected the transcription and hence the translation of GCase gene."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "inconclusive", text: "Inconclusive"}
            answer: "inconclusive"
            explanation: "The experiments show reduced protein levels, but the proteasome inhibitor rescues protein levels. This proves that post-translational degradation contributes to reduced protein, but it does not rule out whether transcription or translation is also affected. The experiments do not directly measure mRNA levels, so the effect on transcription remains inconclusive."
          - letter: "c"
            type: "mcq"
            text: "The mutation occurred at a site that enhanced proteasomal degradation of the GCase protein."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "inconclusive", text: "Inconclusive"}
            answer: "true"
            explanation: "Experiment C directly demonstrates this: when proteasome inhibitor is added, GCase protein levels in GD cells increase, while control cells show no significant change. This proves the mutant GCase protein is being actively targeted for proteasomal degradation, and the mutation enhances this degradation."

      - id: q29
        number: "Q29"
        difficulty: "hard"
        name: "Proteolytic Enzyme Substrate Specificity"
        link: "/papers/inbo/2026/theory-exam.pdf#page=15"
        subjects:
          - name: "Enzyme Kinetics & Regulation"
            link: "/resources/1-cell-molecular/enzyme-kinetics-regulation/"
        statements:
          - letter: "a"
            type: "mcq"
            text: "Substrate 3 is cleaved most efficiently."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "cannot", text: "Cannot be deduced"}
            answer: "true"
            explanation: "Catalytic efficiency is measured by kcat/Km. Substrate 3: 18/0.5 = 36 mM^-1 s^-1. Substrate 1: 24/4.0 = 6. Substrate 2: 30/1.5 = 20. Substrate 4: 18/9.0 = 2. Substrate 5: 20/1.0 = 20. Substrate 3 has the highest kcat/Km ratio and is thus cleaved most efficiently."
          - letter: "b"
            type: "mcq"
            text: "Alanine is the most preferred amino acid on either side of the cleavage site."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "cannot", text: "Cannot be deduced"}
            answer: "false"
            explanation: "Comparing substrates 2 (Ala-Ala cleavage, kcat/Km = 20) with substrate 3 (Ala-Phe, kcat/Km = 36), having Phe on the right side is more efficient than Ala. The enzyme prefers an aromatic residue after the cleavage site rather than Ala on both sides."
          - letter: "c"
            type: "mcq"
            text: "The enzyme most efficiently cleaves the peptide bond between a small hydrophobic amino acid residue and a large, aromatic hydrophobic amino acid residue."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "cannot", text: "Cannot be deduced"}
            answer: "true"
            explanation: "Substrate 3 (Ala-Phe cleavage site, kcat/Km = 36) is the most efficient. Alanine is a small hydrophobic amino acid, and phenylalanine is a large aromatic hydrophobic amino acid. This supports the statement that the enzyme prefers cleaving between small hydrophobic and large aromatic hydrophobic residues."
          - letter: "d"
            type: "mcq"
            text: "A new substrate with a Km value of 0.3 would be more efficiently cleaved compared to the given substrates."
            options:
              - {key: "true", text: "True"}
              - {key: "false", text: "False"}
              - {key: "cannot", text: "Cannot be deduced"}
            answer: "cannot"
            explanation: "Catalytic efficiency depends on kcat/Km, not Km alone. A substrate with Km = 0.3 could have any kcat value. If kcat is very low (e.g., 5 s^-1), then kcat/Km = 5/0.3 = 16.7, which is less efficient than substrate 3. Without knowing kcat, we cannot determine efficiency."

      - id: q30
        number: "Q30"
        difficulty: "medium"
        name: "Plant Biomolecular Composition Matching"
        link: "/papers/inbo/2026/theory-exam.pdf#page=16"
        subjects:
          - name: "Plant Cell Structure & Tissues"
            link: "/resources/5-plant-physiology/plant-cell-structure-tissues/"
        statements:
          - letter: "P"
            type: "mcq"
            text: "Sample P (50% cellulose, 30% hemicellulose, 15% lignin, 1% pectin, 20% water) matches:"
            options:
              - {key: "I", text: "Fresh wood"}
              - {key: "II", text: "Decaying wood"}
              - {key: "III", text: "Fresh leaves"}
              - {key: "IV", text: "Fresh non-fibrous fruit"}
            answer: "I"
            explanation: "High cellulose (50%), high hemicellulose (30%), significant lignin (15%), low pectin and moderate water content are characteristic of fresh wood, which has heavily lignified secondary cell walls."
          - letter: "Q"
            type: "mcq"
            text: "Sample Q (15% cellulose, 10% hemicellulose, 1% lignin, 10% pectin, 70% water) matches:"
            options:
              - {key: "I", text: "Fresh wood"}
              - {key: "II", text: "Decaying wood"}
              - {key: "III", text: "Fresh leaves"}
              - {key: "IV", text: "Fresh non-fibrous fruit"}
            answer: "IV"
            explanation: "High water content (70%), high pectin (10%), very low lignin (1%), and moderate cellulose are characteristic of fresh non-fibrous fruit. Fruits are soft tissues with primary cell walls rich in pectin and high water content."
          - letter: "R"
            type: "mcq"
            text: "Sample R (20% cellulose, 9% hemicellulose, 55% lignin, 0.7% pectin, 10% water) matches:"
            options:
              - {key: "I", text: "Fresh wood"}
              - {key: "II", text: "Decaying wood"}
              - {key: "III", text: "Fresh leaves"}
              - {key: "IV", text: "Fresh non-fibrous fruit"}
            answer: "II"
            explanation: "Very high lignin (55%) relative to cellulose and hemicellulose, with low water content (10%), indicates decaying wood. During decomposition, cellulose and hemicellulose are preferentially degraded by microorganisms, leaving lignin (which is more recalcitrant) enriched in the remaining material."
          - letter: "S"
            type: "mcq"
            text: "Sample S (20% cellulose, 15% hemicellulose, 15% lignin, 2% pectin, 60% water) matches:"
            options:
              - {key: "I", text: "Fresh wood"}
              - {key: "II", text: "Decaying wood"}
              - {key: "III", text: "Fresh leaves"}
              - {key: "IV", text: "Fresh non-fibrous fruit"}
            answer: "III"
            explanation: "High water content (60%), moderate amounts of cellulose, hemicellulose, and lignin, with some pectin, are characteristic of fresh leaves. Leaves have both primary and secondary cell walls with significant water content from living mesophyll cells."

      - id: q31
        number: "Q31"
        difficulty: "hard"
        name: "Plant Cell Water Potential Components"
        link: "/papers/inbo/2026/theory-exam.pdf#page=16"
        subjects:
          - name: "Water Transport & Transpiration"
            link: "/resources/5-plant-physiology/water-transport-transpiration/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Turgor pressure changes with an initial 5% change in cell volume is comparable with the changes observed in the osmotic potential."
            answer: "false"
            explanation: "From the graph, the initial 5% volume change (100% to 95%) shows a steep drop in turgor pressure while osmotic potential changes relatively little. The turgor pressure change is much larger than the osmotic potential change in this range, so they are not comparable."
          - letter: "b"
            type: "true_false"
            text: "With a fall in cell volume from 90 to 80%, most of the change in water potential is due to a drop in turgor pressure and not as much due to osmotic pressure."
            answer: "false"
            explanation: "From the graph, between 90% and 80% relative volume, turgor pressure approaches zero (turgor loss point is near 85-90%). Below the turgor loss point, further decreases in water potential are driven primarily by changes in osmotic potential (which becomes more negative as solutes concentrate), not turgor pressure (which is already at or near zero)."
          - letter: "c"
            type: "true_false"
            text: "The elastic modulus of the cell is not constant but decreases as the cell loses turgor."
            answer: "true"
            explanation: "The elastic modulus (epsilon) relates pressure changes to volume changes. The graph shows that the turgor pressure curve is not linear -- it is steeper at higher volumes and flatter near turgor loss. This non-linear relationship indicates that the elastic modulus decreases as the cell loses turgor, meaning the cell wall becomes less rigid as turgor drops."
          - letter: "d"
            type: "true_false"
            text: "For leaf mesophyll cells of palm trees having relatively rigid cell walls, the volume change associated with turgor loss will be smaller than cells with extremely elastic walls."
            answer: "true"
            explanation: "Cells with rigid (high elastic modulus) walls experience large pressure changes per unit volume change. Therefore, turgor is lost with only a small decrease in volume. In contrast, cells with elastic walls must lose more volume before turgor drops to zero. Rigid-walled cells thus reach the turgor loss point with less volume change."

      - id: q32
        number: "Q32"
        difficulty: "hard"
        name: "Thermal Acclimation and Photosynthesis in Arctic Plants"
        link: "/papers/inbo/2026/theory-exam.pdf#page=17"
        subjects:
          - name: "Photosynthesis: Light & Dark Reactions"
            link: "/resources/5-plant-physiology/photosynthesis-light-dark-reactions/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Acclimation to higher temperature resulted in higher rate of net photosynthesis."
            answer: "false"
            explanation: "The graph shows that after acclimation to 20 C, the maximum rate of net photosynthesis did not increase -- in fact, it may have decreased or shifted its optimum. Acclimation shifted the temperature response curve but did not necessarily increase the peak rate."
          - letter: "b"
            type: "true_false"
            text: "There is a linear increase in rate of dark respiration only above 10 C in S. cernua grown at lower temperature."
            answer: "false"
            explanation: "Dark respiration typically increases exponentially (not linearly) with temperature due to the Q10 effect. The graph shows a curvilinear rather than linear increase in dark respiration across the temperature range."
          - letter: "c"
            type: "true_false"
            text: "Optimum temperature of gross photosynthesis increased to 12 C post acclimation."
            answer: "false"
            explanation: "The graph data shows that the optimum temperature of gross photosynthesis after acclimation to 20 C shifted to a temperature higher than 12 C, not to 12 C specifically."
          - letter: "d"
            type: "true_false"
            text: "The difference between temperature optima of net and gross photosynthesis is due to dark respiration."
            answer: "true"
            explanation: "Net photosynthesis = Gross photosynthesis - Dark respiration. Since dark respiration increases with temperature, it progressively subtracts more from gross photosynthesis at higher temperatures, shifting the net photosynthesis optimum to a lower temperature than the gross photosynthesis optimum."

      - id: q33
        number: "Q33"

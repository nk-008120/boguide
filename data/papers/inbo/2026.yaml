      - id: q34
        number: "Q34"
        difficulty: "medium"
        name: "Auxin-Mediated Phototropism Experiments"
        link: "/papers/inbo/2026/theory-exam.pdf#page=18"
        subjects:
          - name: "Plant Hormones & Growth Regulators"
            link: "/resources/5-plant-physiology/plant-hormones-growth-regulators/"
        statements:
          - letter: "T1"
            type: "mcq"
            text: "Treatment 1 (decapitated tip replaced back): the shoot will bend:"
            options:
              - {key: "towards", text: "Towards light"}
              - {key: "away", text: "Away from light"}
              - {key: "none", text: "No bending"}
            answer: "towards"
            explanation: "Replacing the decapitated tip restores auxin production and lateral transport. The tip perceives light direction and redistributes auxin to the shaded side, causing differential elongation and bending towards light (positive phototropism)."
          - letter: "T2"
            type: "mcq"
            text: "Treatment 2 (decapitated tip placed on gelatin block): the shoot will bend:"
            options:
              - {key: "towards", text: "Towards light"}
              - {key: "away", text: "Away from light"}
              - {key: "none", text: "No bending"}
            answer: "towards"
            explanation: "Gelatin is permeable to auxin. Auxin from the replaced tip diffuses through the gelatin block into the stump below, maintaining the asymmetric distribution caused by light. The shoot bends towards light normally."
          - letter: "T3"
            type: "mcq"
            text: "Treatment 3 (plastic strip inserted on illuminated side): the shoot will bend:"
            options:
              - {key: "towards", text: "Towards light"}
              - {key: "away", text: "Away from light"}
              - {key: "none", text: "No bending"}
            answer: "towards"
            explanation: "The plastic strip on the illuminated side blocks auxin transport on that side. Auxin flows preferentially down the shaded side (which is not blocked), causing greater elongation on the dark side. The shoot bends towards the light."
          - letter: "T4"
            type: "mcq"
            text: "Treatment 4 (plastic strip inserted on the dark side): the shoot will:"
            options:
              - {key: "towards", text: "Bend towards light"}
              - {key: "away", text: "Bend away from light"}
              - {key: "none", text: "Show no bending"}
            answer: "none"
            explanation: "Light causes auxin to move to the shaded side, but the plastic strip on the dark side blocks this lateral transport. Auxin remains on the illuminated side, and the strip prevents asymmetric distribution. Without differential auxin concentration, there is no differential growth and no bending."

      - id: q35
        number: "Q35"
        difficulty: "hard"
        name: "Calvin Cycle Intermediate Stoichiometry"
        link: "/papers/inbo/2026/theory-exam.pdf#page=19"
        subjects:
          - name: "Photosynthesis: Light & Dark Reactions"
            link: "/resources/5-plant-physiology/photosynthesis-light-dark-reactions/"
        statements:
          - letter: "I"
            type: "numeric"
            text: "Number of molecules of intermediate I (3-phosphoglycerate / 3-PGA) when 6 CO2 are fixed:"
            expected: 12
            tolerance: 0
            explanation: "Each CO2 fixation by RuBisCO produces 2 molecules of 3-PGA. For 6 CO2: 6 x 2 = 12 molecules of 3-PGA."
          - letter: "II"
            type: "numeric"
            text: "Number of molecules of intermediate II (1,3-bisphosphoglycerate) when 6 CO2 are fixed:"
            expected: 12
            tolerance: 0
            explanation: "Each 3-PGA is phosphorylated to 1,3-bisphosphoglycerate in a 1:1 ratio. 12 molecules of 3-PGA yield 12 molecules of 1,3-BPG."
          - letter: "III"
            type: "numeric"
            text: "Number of molecules of intermediate III (glyceraldehyde-3-phosphate / G3P) when 6 CO2 are fixed:"
            expected: 12
            tolerance: 0
            explanation: "Each 1,3-BPG is reduced to G3P in a 1:1 ratio. 12 molecules of 1,3-BPG yield 12 molecules of G3P."
          - letter: "IV"
            type: "numeric"
            text: "Number of molecules of intermediate IV (net G3P output) when 6 CO2 are fixed:"
            expected: 2
            tolerance: 0
            explanation: "Of the 12 G3P molecules produced, 10 are recycled to regenerate RuBP, and 2 are the net output used for glucose synthesis (2 G3P = 1 glucose via gluconeogenesis)."
          - letter: "V"
            type: "numeric"
            text: "Number of molecules of intermediate V (G3P recycled for RuBP regeneration) when 6 CO2 are fixed:"
            expected: 10
            tolerance: 0
            explanation: "12 total G3P minus 2 net output = 10 G3P molecules fed back into the regeneration phase to produce 6 RuBP molecules."
          - letter: "VI"
            type: "numeric"
            text: "Number of molecules of intermediate VI (ribulose-1,5-bisphosphate / RuBP) when 6 CO2 are fixed:"
            expected: 6
            tolerance: 0
            explanation: "The cycle regenerates 6 RuBP molecules from 10 G3P through a series of sugar rearrangements, ready to accept 6 new CO2 molecules."

      - id: q36
        number: "Q36"
        difficulty: "hard"
        name: "Mammalian Vision: Skull Morphology and Retinal Composition"
        link: "/papers/inbo/2026/theory-exam.pdf#page=19"
        subjects:
          - name: "Sensory Physiology"
            link: "/resources/3-animal-physiology/sensory-physiology/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "P and R most likely represent a diurnal mammal."
            answer: "false"
            explanation: "Based on the skull features (forward-facing eyes in P) and retinal composition (rod-dominant in R), P and R do not represent a diurnal mammal. Diurnal mammals have cone-rich retinas for color vision, not rod-dominant ones."
          - letter: "b"
            type: "true_false"
            text: "Retina of a mammal with composition as shown in S is less likely to have fovea in the retina."
            answer: "true"
            explanation: "The fovea is a cone-rich region responsible for high-acuity vision, found primarily in diurnal species. If S shows a rod-dominant retinal composition (nocturnal adaptation), the animal is less likely to have a well-developed fovea."
          - letter: "c"
            type: "true_false"
            text: "P and S most likely represent a mammal that is better adapted to nocturnal vision."
            answer: "true"
            explanation: "If P shows large eyes relative to skull (nocturnal adaptation) and S shows a rod-dominant retinal composition with high rod-to-cone ratio, this combination indicates a nocturnal mammal with enhanced sensitivity to low light levels."
          - letter: "d"
            type: "true_false"
            text: "Contrast sensitivity in both mammals is high giving them the ability to perceive finer details of objects."
            answer: "false"
            explanation: "Contrast sensitivity and acuity differ between diurnal and nocturnal mammals. Nocturnal mammals sacrifice spatial resolution for light sensitivity (summation of rod signals reduces contrast sensitivity and detail perception), while diurnal mammals with cone-rich foveas have higher contrast sensitivity and finer detail perception."

      - id: q37
        number: "Q37"
        difficulty: "medium"
        name: "Nernst Equation Membrane Potential"
        link: "/papers/inbo/2026/theory-exam.pdf#page=20"
        subjects:
          - name: "Neurophysiology"
            link: "/resources/3-animal-physiology/neurophysiology/"
        statements:
          - letter: "Q37"
            type: "numeric"
            text: "Using the Nernst equation Vm = 61.5 log10([ion]outside/[ion]inside), calculate the membrane potential due to potassium ions alone. M(outside)=5 mEq/L, M(inside)=140 mEq/L, N(outside)=142 mEq/L, N(inside)=14 mEq/L."
            expected: -89
            tolerance: 0.5
            explanation: "M represents potassium (K+) since it has low outside (5 mEq/L) and high inside (140 mEq/L) concentration, typical of K+. Vm = 61.5 x log10(5/140) = 61.5 x log10(0.0357) = 61.5 x (-1.447) = -89 mV."

      - id: q38
        number: "Q38"
        difficulty: "hard"
        name: "Corticotropin Releasing Hormone in Pregnancy and Amphibian Development"
        link: "/papers/inbo/2026/theory-exam.pdf#page=20"
        subjects:
          - name: "Endocrine Physiology"
            link: "/resources/3-animal-physiology/endocrine-physiology/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "In women who deliver prematurely, CRH levels show a steep rise towards the third trimester."
            answer: "true"
            explanation: "The graph shows that women who deliver prematurely have an accelerated rise in placental CRH levels, reaching high concentrations earlier than women who deliver at term. The steep rise precedes premature delivery."
          - letter: "b"
            type: "true_false"
            text: "High concentration of CRH at 30 weeks of pregnancy could indicate the need to induce labour."
            answer: "false"
            explanation: "High CRH at 30 weeks suggests the risk of premature delivery, not the need to induce labour. At 30 weeks, the fetus is premature and the clinical goal would be to prevent premature labour (e.g., with tocolytics), not to induce it."
          - letter: "c"
            type: "true_false"
            text: "CRH concentration of about 20 pmol/dm3 at mid-pregnancy may require provision of special incubator for likely premature birth."
            answer: "true"
            explanation: "From the graph, a CRH concentration of about 20 pmol/dm3 at mid-pregnancy corresponds to the trajectory of women who deliver prematurely. This would be a clinical indicator to prepare for premature birth, including having incubator facilities ready."
          - letter: "d"
            type: "true_false"
            text: "Condition II most likely represents the physiology of tadpoles in a pond that is shrinking due to lack of rain."
            answer: "true"
            explanation: "In a shrinking pond, environmental stress triggers increased CRH production, which elevates thyroxine levels and accelerates metamorphosis. This allows tadpoles to complete metamorphosis faster and escape the drying pond. Condition II (high CRH, accelerated development) matches this ecological scenario."

      - id: q39
        number: "Q39"
        difficulty: "medium"
        name: "Enterocyte Ion Transport and Oral Rehydration"
        link: "/papers/inbo/2026/theory-exam.pdf#page=21"
        subjects:
          - name: "Digestive Physiology"
            link: "/resources/3-animal-physiology/digestive-physiology/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "The region marked as P represents interstitial fluid."
            answer: "true"
            explanation: "In enterocyte diagrams, one side faces the intestinal lumen (apical/brush border) and the other faces the interstitial fluid/blood side (basolateral). The region P is on the basolateral side, representing interstitial fluid."
          - letter: "b"
            type: "true_false"
            text: "In case of severe diarrhoea, drinking solution containing Na+, K+ and HCO3- ions will help restore cellular functions."
            answer: "false"
            explanation: "While electrolyte replacement is important, the key to oral rehydration is the co-transport of glucose with sodium (SGLT1 transporter). A solution without glucose will not effectively drive sodium and water absorption across the enterocyte. Standard ORS contains glucose specifically to exploit this co-transport mechanism."
          - letter: "c"
            type: "true_false"
            text: "In case of severe dehydration, drinking saline glucose solution will restore cellular osmolarity."
            answer: "true"
            explanation: "Saline glucose solution (oral rehydration solution) exploits the SGLT1 Na+/glucose co-transporter on the apical membrane of enterocytes. The coupled transport of glucose and sodium draws water osmotically, restoring hydration and helping normalize cellular osmolarity."
          - letter: "d"
            type: "true_false"
            text: "In case of severe diarrhoea and vomiting, drinking hypertonic glucose solution will help restore cellular osmolarity."
            answer: "false"
            explanation: "Hypertonic solutions would initially draw water OUT of cells by osmosis, worsening dehydration. Effective oral rehydration requires a hypotonic or isotonic solution. Additionally, with active vomiting, oral intake may not be retained, and intravenous fluids may be needed."

      - id: q40
        number: "Q40"
        difficulty: "medium"
        name: "Organ Weight-Specific Basal Metabolic Rate"
        link: "/papers/inbo/2026/theory-exam.pdf#page=21"
        subjects:
          - name: "Comparative Thermoregulation"
            link: "/resources/3-animal-physiology/comparative-thermoregulation/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Weight-specific BMR is highest in Q and is likely to represent heart."
            answer: "true"
            explanation: "Q: weight = 0.37 kg, absolute BMR = 163. Weight-specific BMR = 163/0.37 = 440.5 (highest). The heart has a very high metabolic rate per unit mass due to continuous contractile activity. At ~0.37 kg, this matches human heart weight."
          - letter: "b"
            type: "true_false"
            text: "R likely represents skeletal muscles as its contribution to total BMR is much higher than its contribution to total body mass."
            answer: "false"
            explanation: "R: weight = 1.5 kg, 17% of total BMR. At 1.5 kg, this is too light for skeletal muscle (which is ~32 kg in an 80 kg person). R more likely represents the liver, which weighs about 1.5 kg and contributes approximately 17% of total BMR due to its high metabolic activity."
          - letter: "c"
            type: "true_false"
            text: "Weight-specific BMR is least in P and it likely represents adipose tissues."
            answer: "true"
            explanation: "P: weight = 12 kg, absolute BMR = 54. Weight-specific BMR = 54/12 = 4.5 (lowest). Adipose tissue has very low metabolic activity per unit mass (mostly triglyceride storage with few mitochondria). At 12 kg, this is a reasonable estimate for body fat in an 80 kg adult."
          - letter: "d"
            type: "true_false"
            text: "Since both absolute BMR and % of total BMR are largest in S, it is likely to represent brain."
            answer: "false"
            explanation: "S: weight = 32 kg, absolute BMR = 416, 23% of total BMR. At 32 kg, this is far too heavy for the brain (which is ~1.4 kg). S represents skeletal muscle, which constitutes about 40% of body mass (32 kg in 80 kg person) and has a large absolute BMR due to its sheer mass despite relatively low weight-specific metabolic rate."

      - id: q41
        number: "Q41"
        difficulty: "hard"
        name: "Bohr and Haldane Effects in Fetal-Maternal Gas Exchange"
        link: "/papers/inbo/2026/theory-exam.pdf#page=22"
        subjects:
          - name: "Respiratory Physiology"
            link: "/resources/3-animal-physiology/respiratory-physiology/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "As blood of fetal and maternal circulation juxtapose in placenta, curve R shifts to S and is called Bohr effect."
            answer: "true"
            explanation: "When maternal blood encounters the placenta, CO2 from fetal blood increases the acidity of maternal blood, shifting the maternal hemoglobin O2 dissociation curve to the right (R to S). This rightward shift due to increased CO2/decreased pH is the Bohr effect, facilitating oxygen release from maternal hemoglobin to the fetus."
          - letter: "b"
            type: "true_false"
            text: "As blood of fetal circulation comes in close vicinity of maternal blood, curve P shifts to Q and it is Haldane effect."
            answer: "false"
            explanation: "As fetal blood picks up O2 from maternal blood in the placenta, the increased O2 concentration reduces fetal hemoglobin affinity for CO2 (Haldane effect), facilitating CO2 release to maternal blood. However, curve P shifting to Q represents a leftward shift of the fetal O2 dissociation curve, which would be the reverse of what happens. The Haldane effect relates to CO2 binding, not the O2 dissociation curve shift described."
          - letter: "c"
            type: "true_false"
            text: "Curve P represents umbilical vein and Q represents umbilical artery."
            answer: "true"
            explanation: "The umbilical vein carries oxygenated blood from the placenta to the fetus (higher O2 saturation), while the umbilical artery carries deoxygenated blood from fetus to placenta (lower O2 saturation, higher CO2). Curve P (higher O2 affinity, left-shifted) represents the umbilical vein blood, and Q represents the umbilical artery blood."
          - letter: "d"
            type: "true_false"
            text: "Curve R represents maternal arterial blood and S represents maternal venous blood."
            answer: "true"
            explanation: "Maternal arterial blood (curve R) arrives at the placenta with high O2 and a left-shifted curve. After gas exchange, the blood has lost O2 and gained CO2, shifting the curve rightward (S), which represents the maternal venous blood leaving the placenta."

      - id: q42
        number: "Q42"
        difficulty: "medium"
        name: "Parthenogenesis in Whiptail Lizards"
        link: "/papers/inbo/2026/theory-exam.pdf#page=23"
        subjects:
          - name: "Reproductive Physiology"
            link: "/resources/3-animal-physiology/reproductive-physiology/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Ovulation is most likely to occur in mid A-B period of the ovarian cycle."
            answer: "false"
            explanation: "Based on the hormone profiles showing estrogen and progesterone changes, ovulation typically occurs at the transition between high estrogen and rising progesterone, not in the middle of the A-B period. The timing depends on the LH surge equivalent triggered by peak estrogen levels."
          - letter: "b"
            type: "true_false"
            text: "A given individual behaves as a male during D-E and as a female during A-B period in the cycle."
            answer: "true"
            explanation: "In parthenogenetic whiptail lizards, females alternate between male-like and female-like behavior based on their hormonal state. During the post-ovulatory phase (progesterone-dominant, D-E period), individuals exhibit male-like mounting behavior. During the pre-ovulatory phase (estrogen-dominant, A-B period), they exhibit female-like receptive behavior."
          - letter: "c"
            type: "true_false"
            text: "The act of copulation will trigger the release of eggs from the ovaries of the lizards."
            answer: "true"
            explanation: "In these parthenogenetic lizards, pseudocopulation (mating behavior between females) stimulates ovulation. The mounting behavior from the \"male-acting\" partner triggers hormonal responses that promote egg release, even though no actual fertilization occurs."
          - letter: "d"
            type: "true_false"
            text: "Compared to sexually reproducing species, this mode of reproduction is favoured when availability of resources is not a constraint."
            answer: "true"
            explanation: "Asexual reproduction (parthenogenesis) is advantageous when resources are abundant because every individual can produce offspring (no cost of males), leading to rapid population growth. However, it lacks genetic recombination, making it disadvantageous when environmental challenges require adaptive genetic diversity."

      - id: q43
        number: "Q43"
        difficulty: "hard"
        name: "Polygenic Inheritance of Plant Height"
        link: "/papers/inbo/2026/theory-exam.pdf#page=23"
        subjects:
          - name: "Quantitative & Population Genetics"
            link: "/resources/6-genetics/quantitative-population-genetics/"
        statements:
          - letter: "Q43"
            type: "free_response"
            text: "If 45 cm is the basal height and a gardener selfs plants with genotype M0M1 N0N2 O0O3 P0P4, what proportion of plants would be 65 cm tall?"
            modelAnswer: "1/256"
            explanation: "To reach 65 cm from a 45 cm base requires an additional 20 cm. The selfing parent contributes alleles summing to 0+1+0+2+0+3+0+4 = 10 cm per gamete pair. For exactly 20 cm additional height, the offspring needs allele combinations summing to 20. Each gene independently assorts with probability 1/4 for each homozygous class and 1/2 for heterozygous. The only way to get exactly 20 cm is the genotype M1M1 N2N2 O3O3 P4P4, each with probability 1/4. So (1/4)^4 = 1/256."

      - id: q44
        number: "Q44"
        difficulty: "hard"
        name: "RFLP Pedigree Analysis"
        link: "/papers/inbo/2026/theory-exam.pdf#page=23"
        subjects:
          - name: "Recombinant DNA & Biotechnology Techniques"
            link: "/resources/1-cell-molecular/recombinant-dna-biotechnology/"
        statements:
          - letter: "A"
            type: "free_response"
            text: "Indicate the lanes representing the RFLP pattern of individuals II-1 and II-2 (Parents)."
            modelAnswer: "II-1 = Lane L9, II-2 = Lane L5"
            explanation: "By tracing the alleles from generation I through the pedigree and matching them with the gel lane patterns, individual II-1 corresponds to lane L9 and II-2 to lane L5. The parents must carry allele combinations consistent with both their own parents (generation I) and their offspring (generation III)."
          - letter: "B"
            type: "free_response"
            text: "Indicate the number of individuals with their respective alleles for the progeny in generation III."
            modelAnswer: "2 individuals with alleles 1,2; 2 individuals with alleles 2,5; 2 individuals with alleles 5,7; 1 individual with alleles 1,7"
            explanation: "Analyzing the gel patterns of generation III individuals and cross-referencing with parental alleles (from II-1 and II-2), the 7 progeny segregate into four genotype classes based on which parental alleles they inherited."

      - id: q45
        number: "Q45"
        difficulty: "medium"
        name: "Multiple Alleles in Mallard Duck Plumage"
        link: "/papers/inbo/2026/theory-exam.pdf#page=24"
        subjects:
          - name: "Mendelian Genetics & Extensions"
            link: "/resources/6-genetics/mendelian-genetics-extensions/"
        statements:
          - letter: "Q45"
            type: "free_response"
            text: "If F1 progeny yield 50% restricted, 25% mallard, and 25% dusky ducks, what are the parental genotypes?"
            modelAnswer: "M^R m^d x M m^d"
            explanation: "The 50% restricted : 25% mallard : 25% dusky ratio requires one parent to be heterozygous restricted/dusky (M^R m^d) producing M^R and m^d gametes equally, and the other to be heterozygous mallard/dusky (M m^d). The cross gives: 1/4 M^R M (restricted), 1/4 M^R m^d (restricted), 1/4 M m^d (mallard, since M > m^d), 1/4 m^d m^d (dusky). This produces 50% restricted, 25% mallard, 25% dusky."

      - id: q46
        number: "Q46"
        difficulty: "hard"
        name: "Epistatic Coat Color in Rodents"
        link: "/papers/inbo/2026/theory-exam.pdf#page=24"
        subjects:
          - name: "Mendelian Genetics & Extensions"
            link: "/resources/6-genetics/mendelian-genetics-extensions/"
        statements:
          - letter: "A"
            type: "free_response"
            text: "If a true-breeding brown rodent (SSBB) is crossed with a completely recessive rodent (ssbb), what is the F2 phenotypic ratio?"
            modelAnswer: "9 brown : 3 black : 4 pale"
            explanation: "F1 from SSBB x ssbb = SsBb (all brown). F2 from SsBb selfing: 9 S_B_ (brown), 3 S_bb (black), 3 ssB_ (pale), 1 ssbb (pale). The ss genotype is epistatic to B/b (no pigment regardless of B allele), so 3 ssB_ + 1 ssbb = 4 pale. Final ratio: 9 brown : 3 black : 4 pale."
          - letter: "Bi"
            type: "free_response"
            text: "Cross (i): 7 brown : 7 pale offspring from brown female x ssbb male. Maternal genotype?"
            modelAnswer: "SsBB"
            explanation: "The 1:1 ratio of brown:pale indicates segregation at the S locus only (Ss x ss gives 1/2 Ss : 1/2 ss). All pigmented offspring are brown (no black), meaning the mother must be BB (all pigmented offspring get at least one B). Maternal genotype: SsBB."
          - letter: "Bii"
            type: "free_response"
            text: "Cross (ii): 8 brown : 9 black offspring from brown female x ssbb male. Maternal genotype?"
            modelAnswer: "SSBb"
            explanation: "All offspring are pigmented (no pale), meaning the mother is SS (all offspring get S). The 1:1 brown:black ratio indicates Bb x bb segregation. Maternal genotype: SSBb."
          - letter: "Biii"
            type: "free_response"
            text: "Cross (iii): 5 brown : 6 black : 12 pale offspring from brown female x ssbb male. Maternal genotype?"
            modelAnswer: "SsBb"
            explanation: "The overall ratio approximates 1 brown : 1 black : 2 pale. Mother is Ss (half pigmented, half pale) and Bb (among pigmented, half brown, half black). Ss x ss gives 1/2 S_ : 1/2 ss. Among the S_ offspring, Bb x bb gives 1/2 brown : 1/2 black. So 1/4 brown : 1/4 black : 1/2 pale. Maternal genotype: SsBb."

      - id: q47
        number: "Q47"
        difficulty: "hard"
        name: "X-linked Lesch-Nyhan Syndrome Probability"
        link: "/papers/inbo/2026/theory-exam.pdf#page=25"
        subjects:
          - name: "Mendelian Genetics & Extensions"
            link: "/resources/6-genetics/mendelian-genetics-extensions/"
        statements:
          - letter: "A"
            type: "free_response"
            text: "The probability that V-1 is a son affected with the disease is:"
            modelAnswer: "0"
            explanation: "Based on the pedigree, the father in generation IV is unaffected and hemizygous normal (X^A Y). Since sons inherit their X chromosome from their mother, and their Y from their father, the probability depends on the mother being a carrier. From the pedigree analysis, there is no path for the mother to be a carrier, making the probability of an affected son 0."
          - letter: "B"
            type: "free_response"
            text: "The probability that V-2 is a daughter and who is not a carrier for the trait is:"
            modelAnswer: "1/8"
            explanation: "The probability of being a daughter is 1/2. The probability of a daughter not being a carrier depends on the mother carrier status. From the pedigree, if the mother has a 3/4 probability of not being a carrier, then P(daughter and not carrier) = 1/2 x 1/4 = 1/8 (considering the specific pedigree relationships)."

      - id: q48
        number: "Q48"
        difficulty: "medium"
        name: "Genetic Drift Simulation in Small Populations"
        link: "/papers/inbo/2026/theory-exam.pdf#page=25"
        subjects:
          - name: "Quantitative & Population Genetics"
            link: "/resources/6-genetics/quantitative-population-genetics/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Population 1 has the largest number of individuals."
            answer: "false"
            explanation: "The simulation graphs show that population 1 has the most extreme fluctuations in allele frequency, with rapid fixation or loss of alleles. This pattern is characteristic of the smallest population, not the largest. Genetic drift is strongest in small populations."
          - letter: "b"
            type: "true_false"
            text: "The effect of drift is seen only in population 1 and 2, but not in population 3."
            answer: "false"
            explanation: "Genetic drift affects all finite populations, regardless of size. Population 3 shows smaller fluctuations but drift is still present -- allele frequencies still change randomly over generations. Drift is less pronounced but not absent in large populations."
          - letter: "c"
            type: "true_false"
            text: "Data from population 1 show that genetic drift does not distinguish between a recessive allele and a dominant allele."
            answer: "true"
            explanation: "Genetic drift is a random sampling process that operates on allele frequencies independently of dominance relationships. The assumption states no selection is acting, so whether an allele is dominant or recessive does not affect its probability of fixation or loss by drift. Both alleles drift equally."
          - letter: "d"
            type: "true_false"
            text: "The effect of random fluctuations in allele frequency tends to cancel each other in large population sizes."
            answer: "true"
            explanation: "In large populations, random fluctuations in allele frequency across generations are smaller in magnitude and tend to average out, keeping allele frequencies closer to their initial values. This is because larger sample sizes reduce sampling error (the basis of genetic drift)."

      - id: q49
        number: "Q49"
        difficulty: "medium"
        name: "Types of Natural Selection on Allele Frequency"
        link: "/papers/inbo/2026/theory-exam.pdf#page=26"
        subjects:
          - name: "Natural Selection & Adaptation"
            link: "/resources/15-evolution/natural-selection-adaptation/"
        statements:
          - letter: "a"
            type: "mcq"
            text: "Dominant selection where A2 is dominant over A1. Which graph (I, II, or III)?"
            options:
              - {key: "I", text: "Graph I"}
              - {key: "II", text: "Graph II"}
              - {key: "III", text: "Graph III"}
            answer: "II"
            explanation: "When A2 is dominant over A1 and is advantageous, selection is initially rapid when A2 is rare (heterozygotes express the dominant phenotype), but slows as A2 approaches fixation (recessive A1 alleles are hidden in heterozygotes). Graph II shows this fast-then-slow S-shaped curve."
          - letter: "b"
            type: "mcq"
            text: "Dominant selection where A1 is dominant over A2. Which graph (I, II, or III)?"
            options:
              - {key: "I", text: "Graph I"}
              - {key: "II", text: "Graph II"}
              - {key: "III", text: "Graph III"}
            answer: "III"
            explanation: "When A1 is dominant over A2, the advantageous A2 allele is recessive. Selection for a recessive advantageous allele is initially slow (A2 is hidden in heterozygotes when rare) but accelerates once A2 reaches higher frequencies. Graph III shows this slow-then-fast pattern."
          - letter: "c"
            type: "mcq"
            text: "Codominant selection. Which graph (I, II, or III)?"
            options:
              - {key: "I", text: "Graph I"}
              - {key: "II", text: "Graph II"}
              - {key: "III", text: "Graph III"}
            answer: "I"
            explanation: "Under codominant selection (additive/semi-dominant fitness), the heterozygote has intermediate fitness. Selection proceeds at a relatively constant rate throughout the frequency change, producing a symmetric S-shaped curve. Graph I shows this pattern."

      - id: q50
        number: "Q50"
        difficulty: "medium"
        name: "Tropical Seedling Shade Tolerance"
        link: "/papers/inbo/2026/theory-exam.pdf#page=27"
        subjects:
          - name: "Community Ecology & Species Interactions"
            link: "/resources/8-ecology/community-ecology-species-interactions/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Shaded condition drastically reduces the M. balsamum growth."
            answer: "false"
            explanation: "From the experimental data, M. balsamum shows reasonable growth under shaded conditions (under continuous canopy). This species is shade-tolerant and can maintain growth even with limited light, unlike shade-intolerant species."
          - letter: "b"
            type: "true_false"
            text: "Seedlings of M. balsamum are tolerant to high sunlight."
            answer: "true"
            explanation: "The data shows that M. balsamum grows well under both shaded and high sunlight conditions (gap openings). This indicates it is a generalist species tolerant of a range of light conditions, including high sunlight."
          - letter: "c"
            type: "true_false"
            text: "M. balsamum and C. pentandra are both shade intolerant species."
            answer: "false"
            explanation: "M. balsamum shows good growth under shade, indicating shade tolerance. While C. pentandra may be shade intolerant (performing better in gaps), M. balsamum is clearly shade tolerant. They do not share the same shade response."
          - letter: "d"
            type: "true_false"
            text: "M. balsamum is shade tolerant while C. pentandra is better suited for higher sunlight."
            answer: "true"
            explanation: "The data shows M. balsamum grows well in shade (shade tolerant) while C. pentandra shows better growth and survival in high sunlight conditions (gap openings). This represents the classic shade-tolerant vs. light-demanding species dichotomy in tropical forest ecology."

      - id: q51
        number: "Q51"
        difficulty: "hard"
        name: "Risk-Sensitive Foraging Under Energy Stress"
        link: "/papers/inbo/2026/theory-exam.pdf#page=27"
        subjects:
          - name: "Foraging Behavior & Optimal Strategies"
            link: "/resources/9-ethology/foraging-behavior-optimal-strategies/"
        statements:
          - letter: "Q51"
            type: "mcq"
            text: "A house sparrow has energy reserves marginally above survival threshold, predation risk increases non-linearly with travel frequency, and two patches are available: Patch 1 (high density, unpredictable) and Patch 2 (low density, stable). Which strategy is correct?"
            options:
              - {key: "a", text: "Choose Patch 1 for high expected gain despite higher travel risks."}
              - {key: "b", text: "Choose Patch 2 for stable returns reducing short-term shortfall risk with lower travel risk."}
              - {key: "c", text: "Alternate rapidly between both patches to overcome uncertainty."}
              - {key: "d", text: "Avoid both patches until reserves increase further."}
            answer: "b"
            explanation: "With energy reserves marginally above the survival threshold, the sparrow is risk-averse (cannot afford a shortfall). Patch 2 offers stable, predictable returns that minimize the risk of falling below the survival threshold. Although Patch 1 has higher expected returns, its unpredictability creates a dangerous variance when reserves are critically low. Additionally, non-linear predation risk with travel frequency makes multiple trips (options c) especially costly."

      - id: q52
        number: "Q52"
        difficulty: "medium"
        name: "Leaf Solar Tracking and Radiation"
        link: "/papers/inbo/2026/theory-exam.pdf#page=28"
        subjects:
          - name: "Community Ecology & Species Interactions"
            link: "/resources/8-ecology/community-ecology-species-interactions/"
        statements:
          - letter: "Q52"
            type: "mcq"
            text: "Match leaf orientations (paraheliotropic, diaheliotropic, horizontal, east-west vertical) to PPFD curves A-D."
            options:
              - {key: "a", text: "i-A, ii-B, iii-D, iv-C"}
              - {key: "b", text: "i-D, ii-A, iii-B, iv-C"}
              - {key: "c", text: "i-D, ii-C, iii-A, iv-B"}
              - {key: "d", text: "i-C, ii-A, iii-B, iv-D"}
            answer: "b"
            explanation: "Paraheliotropic leaves (parallel to sun rays, i) receive minimal direct radiation throughout the day (curve D, lowest). Diaheliotropic leaves (perpendicular to rays, ii) track the sun to maximize radiation (curve A, highest and flattest). Horizontal leaves (iii) peak at solar noon (curve B, midday peak). East-west vertical leaves (iv) receive maximum light at dawn and dusk when sun is at the horizon (curve C, bimodal twin peaks)."

      - id: q53
        number: "Q53"
        difficulty: "medium"
        name: "American Redstart Song Modes and Pairing"
        link: "/papers/inbo/2026/theory-exam.pdf#page=28"
        subjects:
          - name: "Communication & Signal Design"
            link: "/resources/9-ethology/communication-signal-design/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Unpaired males sang in repeat mode at significantly higher and less variable rates than did paired males."
            answer: "true"
            explanation: "The data shows that unpaired males consistently have higher repeat-song rates with less variance than paired males. Unpaired males use repetitive singing as a mate-attraction strategy, maintaining high consistent rates to maximize detectability."
          - letter: "b"
            type: "true_false"
            text: "The amount of overlap between the two samples of male birds decreased as the song duration decreased."
            answer: "false"
            explanation: "The graphs show that with longer recording durations (I < II < III), the overlap between paired and unpaired male distributions actually decreases (becomes more distinct). Shorter recordings show MORE overlap due to higher sampling variability, not less."
          - letter: "c"
            type: "true_false"
            text: "Unpaired males prefer to sing more types of songs than paired males."
            answer: "false"
            explanation: "The question describes repeat mode (one song type repeated) vs serial mode (alternating among multiple types). Unpaired males sing in REPEAT mode at higher rates, meaning they use FEWER song types more repetitively, not more types. Serial mode (more types) is used in different social contexts."
          - letter: "d"
            type: "true_false"
            text: "Repeat songs are more useful in attracting females while serial songs are more useful in pair-bonding behaviours."
            answer: "true"
            explanation: "Since unpaired males preferentially use repeat mode (to attract distant females) while paired males reduce repeat singing, repeat songs serve primarily for mate attraction. Serial songs, used in other social contexts, are more associated with territorial defense and maintaining pair bonds."

      - id: q54
        number: "Q54"
        difficulty: "medium"
        name: "Island vs Mainland Hare Population Dynamics"
        link: "/papers/inbo/2026/theory-exam.pdf#page=29"
        subjects:
          - name: "Population Ecology & Dynamics"
            link: "/resources/8-ecology/population-ecology-dynamics/"
        statements:
          - letter: "Q54"
            type: "mcq"
            text: "What could be the possible reason for the observed variations in the densities of the island and mainland hare populations?"
            options:
              - {key: "a", text: "Lack of predator pressure on island allows free reproduction and stable density."}
              - {key: "b", text: "Greater mainland predator pressure increases population cycle intensity."}
              - {key: "c", text: "Similar predator pressure from birds of prey explains density differences."}
              - {key: "d", text: "Higher predation success explains the dip in island population density."}
            answer: "b"
            explanation: "The mainland hare population shows classic population cycles with large amplitude oscillations (high peaks and deep troughs), characteristic of strong predator-prey interactions. The island population shows more stable densities because predator pressure is reduced (mammalian predators cannot easily access the island). The key distinction is that greater predator pressure on the mainland INCREASES the intensity (amplitude) of population cycles, which is the specific mechanism described in option (b)."

      - id: q55
        number: "Q55"
        difficulty: "hard"
        name: "Digger Bee Alternative Mating Strategies"
        link: "/papers/inbo/2026/theory-exam.pdf#page=30"
        subjects:
          - name: "Mating Systems & Sexual Selection"
            link: "/resources/9-ethology/mating-systems-sexual-selection/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Mate-location behavior exhibited by the bees can be predicted across the head widths studied."
            answer: "false"
            explanation: "The distribution graphs show overlap in head widths between hovering and patrolling males. While there is a general trend (larger males patrol, smaller males hover), there is no strict threshold that perfectly predicts behavior from head width alone."
          - letter: "b"
            type: "true_false"
            text: "Hovering males are unsuccessful in attaining mating success."
            answer: "false"
            explanation: "The copulating males distribution overlaps with both hovering and patrolling male distributions. While patrolling males may have higher mating success on average, hovering males do achieve some matings, particularly when they intercept emerging or foraging females."
          - letter: "c"
            type: "true_false"
            text: "Male bees with smaller head width generally hover rather than patrol, even though large males do most of the mating."
            answer: "true"
            explanation: "The data shows that the hovering male distribution is shifted toward smaller head widths, while the patrolling male distribution is shifted toward larger sizes. The copulating male distribution more closely matches the patrolling males, indicating that larger patrolling males achieve most matings. Smaller males make the best of their situation by adopting the hovering strategy."
          - letter: "d"
            type: "true_false"
            text: "Females who emerge when hovering males are fighting escape and fly off to flowering trees where they become potential mates for patrolling males."
            answer: "false"
            explanation: "The description states that PATROLLING males excavate emerging females and mate with them, while HOVERING males hover near emergence areas or flowering trees. The statement reverses the roles: it is patrolling males who find emerging females, not hovering males. And hovering males are the ones at flowering trees, not patrolling males."

      - id: q56
        number: "Q56"
        difficulty: "hard"
        name: "Cichlid Fish Agonistic Behavior and Weight Asymmetry"
        link: "/papers/inbo/2026/theory-exam.pdf#page=30"
        subjects:
          - name: "Aggression & Social Structure"
            link: "/resources/9-ethology/aggression-social-structure/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Two fish of similar weight do not expend energy in the act of circling."
            answer: "false"
            explanation: "The graph shows that circling frequency is actually highest when weight asymmetry is low (similar-sized fish). Circling is an assessment behavior used when neither opponent can quickly determine the other is larger, so similar-sized fish engage in more circling, not less."
          - letter: "b"
            type: "true_false"
            text: "Fish of similar size are likely to show tail beating as the preferred behaviour."
            answer: "false"
            explanation: "From the graph, at low weight asymmetry, multiple behaviors (circling, mouth wrestling) are more prominent. Tail beating is a display behavior whose frequency pattern from the graph does not indicate it as the preferred behavior at similar sizes."
          - letter: "c"
            type: "true_false"
            text: "The relative occurrence of biting is higher than mouth wrestling when the fish are of almost comparable weights."
            answer: "false"
            explanation: "When fish are of similar size, mouth wrestling (a prolonged grappling contest) is more common than biting. Mouth wrestling allows mutual assessment of strength when size cues are not decisive. Biting (a more aggressive, one-sided behavior) increases with greater weight asymmetry as the larger fish escalates."
          - letter: "d"
            type: "true_false"
            text: "One of the fish adopts the Dove strategy and retreats when the weights are almost similar, leading to reduced aggression."
            answer: "false"
            explanation: "When fish are of similar weight, neither can easily assess itself as the likely loser, so both are more likely to escalate (Hawk-Hawk) rather than one retreating (Dove). The graph shows high frequencies of assessment and fighting behaviors at low weight asymmetry. Dove strategy adoption (retreat by the smaller fish) is more common at HIGH weight asymmetry, where the size difference makes the outcome predictable."

      - id: q57
        number: "Q57"
        difficulty: "medium"
        name: "Adaptive Significance of Bird Behavioral Traits"
        link: "/papers/inbo/2026/theory-exam.pdf#page=31"
        subjects:
          - name: "Communication & Signal Design"
            link: "/resources/9-ethology/communication-signal-design/"
        statements:
          - letter: "i"
            type: "mcq"
            text: "Interpretation (i): Reflects importance of territory ownership by a male if he has to acquire a mate. Which trait?"
            options:
              - {key: "a", text: "Females are attracted to territory owners only."}
              - {key: "b", text: "Males give loud calls to announce territory ownership."}
              - {key: "c", text: "Courtship, mutual and contact displays."}
              - {key: "d", text: "Males are likely to attack females initially."}
            answer: "a"
            explanation: "If females are attracted only to territory owners, then territory ownership is essential for males to acquire mates. This directly reflects the importance of territory for mate acquisition."
          - letter: "ii"
            type: "mcq"
            text: "Interpretation (ii): Needs to attract distant females in areas with other related species. Which trait?"
            options:
              - {key: "a", text: "Females are attracted to territory owners only."}
              - {key: "b", text: "Males give loud calls to announce territory ownership."}
              - {key: "c", text: "Courtship, mutual and contact displays."}
              - {key: "d", text: "Males are likely to attack females initially."}
            answer: "b"
            explanation: "Loud calls serve as long-distance signals to attract females and also as species-specific identifiers that help females distinguish conspecific males from related species in the area."
          - letter: "iii"
            type: "mcq"
            text: "Interpretation (iii): High territorial aggressiveness leads to low threshold for attacking any intruder. Which trait?"
            options:
              - {key: "a", text: "Females are attracted to territory owners only."}
              - {key: "b", text: "Males give loud calls to announce territory ownership."}
              - {key: "c", text: "Courtship, mutual and contact displays."}
              - {key: "d", text: "Males are likely to attack females initially."}
            answer: "d"
            explanation: "Strong selection for territorial aggression results in males having a low threshold for attacking any intruder, including females. Males initially treat approaching females as potential rivals and may attack before recognizing them as potential mates."
          - letter: "iv"
            type: "mcq"
            text: "Interpretation (iv): Selection favors actions leading to reduced aggressiveness, physiological synchronization, and cooperation. Which trait?"
            options:
              - {key: "a", text: "Females are attracted to territory owners only."}
              - {key: "b", text: "Males give loud calls to announce territory ownership."}
              - {key: "c", text: "Courtship, mutual and contact displays."}
              - {key: "d", text: "Males are likely to attack females initially."}
            answer: "c"
            explanation: "Courtship, mutual displays, and contact displays serve to reduce aggression between potential mates, synchronize their reproductive physiology, and build cooperative pair bonds. These behaviors transform an initially hostile encounter into a cooperative breeding partnership."

      - id: q58
        number: "Q58"
        difficulty: "medium"
        name: "Mollusc Clade Feature Identification"
        link: "/papers/inbo/2026/theory-exam.pdf#page=32"
        subjects:
          - name: "Animal Diversity & Body Plans"
            link: "/resources/4-biosystematics/animal-diversity-body-plans/"
        statements:
          - letter: "a"
            type: "true_false"
            text: "Q could be gills."
            answer: "true"
            explanation: "Feature Q is present in all four clades (Chitons, Bivalves, Gastropods, Cephalopods). Gills (ctenidia) are present in all major mollusc clades in some form, making Q consistent with gills. All molluscs have evolved respiratory structures derived from ancestral ctenidia."
          - letter: "b"
            type: "true_false"
            text: "4 represents a gastropod."
            answer: "false"
            explanation: "Based on the feature table, Clade 4 has P modified into arms and tentacles, which is characteristic of Cephalopods (octopus, squid), not Gastropods. Gastropods typically retain the foot for locomotion without modification into arms."
          - letter: "c"
            type: "true_false"
            text: "R could be mantle."
            answer: "false"
            explanation: "Feature R is described as \"Feeding structure modified for scraping\" in Clade 1, but present without modification (+) in Clades 2-4. The mantle is not a feeding structure -- it is the tissue that secretes the shell and forms the mantle cavity. R is more consistent with the radula, which is a feeding structure modified for scraping in Chitons."
          - letter: "d"
            type: "true_false"
            text: "2 is a bivalve."
            answer: "true"
            explanation: "Clade 2 has P (foot) modified for burrowing, which is characteristic of Bivalves. Bivalves have a muscular foot adapted for burrowing into sediment. They also have gills (Q) modified for filter feeding, and the radula (R) is present (though reduced or absent in some species)."

      - id: q59
        number: "Q59"
        difficulty: "hard"
        name: "Animal Phylogeny Evolutionary Traits"
        link: "/papers/inbo/2026/theory-exam.pdf#page=32"
        subjects:
          - name: "Animal Diversity & Body Plans"
            link: "/resources/4-biosystematics/animal-diversity-body-plans/"
        statements:
          - letter: "M"
            type: "mcq"
            text: "Evolutionary trait M on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "e"
            explanation: "Trait M at the earliest branch point represents diploblasty, the ancestral body plan with only two germ layers (ectoderm and endoderm). This is the condition found in cnidarians (jellyfish, corals) that branched off before the evolution of triploblasty."
          - letter: "N"
            type: "mcq"
            text: "Evolutionary trait N on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "b"
            explanation: "Trait N represents radial symmetry, characteristic of cnidarians and ctenophores. These early-diverging animal lineages display radial body symmetry in contrast to the bilateral symmetry that evolved later in the Bilateria."
          - letter: "O"
            type: "mcq"
            text: "Evolutionary trait O on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "g"
            explanation: "Trait O represents protostomy, the developmental pattern where the blastopore becomes the mouth. This is the ancestral condition for the protostome clade (Lophotrochozoa + Ecdysozoa), which includes molluscs, annelids, arthropods, and nematodes."
          - letter: "P"
            type: "mcq"
            text: "Evolutionary trait P on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "a"
            explanation: "Trait P represents pseudocoelom, a body cavity not fully lined by mesoderm. This is characteristic of nematodes (roundworms) and rotifers, which are pseudocoelomates within the Ecdysozoa/Lophotrochozoa lineages."
          - letter: "Q"
            type: "mcq"
            text: "Evolutionary trait Q on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "c"
            explanation: "Trait Q represents true coelom (eucoelom), a body cavity completely lined by mesoderm-derived peritoneum. This evolved in the coelomate lineages including annelids, molluscs, arthropods, and deuterostomes."
          - letter: "R"
            type: "mcq"
            text: "Evolutionary trait R on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "d"
            explanation: "Trait R represents segmentation, the division of the body into repeated units (metameres). Segmentation evolved independently in annelids (within Lophotrochozoa), arthropods (within Ecdysozoa), and chordates (within Deuterostomia)."
          - letter: "S"
            type: "mcq"
            text: "Evolutionary trait S on the phylogenetic tree represents:"
            options:
              - {key: "a", text: "Pseudocoelom"}
              - {key: "b", text: "Radial symmetry"}
              - {key: "c", text: "True coelom"}
              - {key: "d", text: "Segmentation"}
              - {key: "e", text: "Diploblasty"}
              - {key: "f", text: "Deuterostomy"}
              - {key: "g", text: "Protostomy"}
            answer: "f"
            explanation: "Trait S represents deuterostomy, the developmental pattern where the blastopore becomes the anus and the mouth forms secondarily. This is the defining feature of deuterostomes (echinoderms, hemichordates, chordates)."

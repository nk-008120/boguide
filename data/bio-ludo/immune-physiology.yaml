topic: "immune-physiology"
topicName: "Immune Physiology"
source: "Campbell Biology, 11e (Urry et al.): Instructor Test Bank"
questions:
  - id: "immune-physiology-01"
    type: mcq
    difficulty: medium
    letter: "A"
    text: "A strain of fruit fly lacks the ability to produce Dicer-2 protein. You might expect this strain to be more susceptible to ________ infections."
    options:
      - key: "A"
        text: "viral"
      - key: "B"
        text: "bacterial"
      - key: "C"
        text: "fungal"
      - key: "D"
        text: "protozoan"
    answer: "A"
    explanation: "Dicer-2 is a core component of the RNA interference pathway that insects use as an innate antiviral defense mechanism (processing viral double-stranded RNA), so flies lacking it would be more vulnerable specifically to viral infections."
    sourceRef: "Campbell Biology 11e, Ch. 43 (The Immune System)"

  - id: "immune-physiology-02"
    type: mcq
    difficulty: easy
    letter: "A"
    text: "Innate immunity ________."
    options:
      - key: "A"
        text: "is the first, and most general, mechanism of protection against pathogens"
      - key: "B"
        text: "depends on an infected animal's previous exposure to a pathogen"
      - key: "C"
        text: "is based on recognition of antigens that are specific to a pathogen"
      - key: "D"
        text: "is found only in vertebrates"
    answer: "A"
    explanation: "Innate immunity is the body's first line of defense, responding immediately and nonspecifically to broad classes of pathogens without requiring prior exposure: unlike adaptive immunity, which is pathogen-specific and improves with repeated exposure."
    sourceRef: "Campbell Biology 11e, Ch. 43 (The Immune System)"

  - id: "immune-physiology-03"
    type: mcq
    difficulty: hard
    letter: "A"
    text: "Which of the following would not help a virus avoid triggering an adaptive immune response?"
    options:
      - key: "A"
        text: "having frequent mutations in genes for surface proteins"
      - key: "B"
        text: "infecting cells that produce very few MHC molecules"
      - key: "C"
        text: "producing proteins very similar to those of other viruses"
      - key: "D"
        text: "infecting and killing helper T cells"
    answer: "C"
    explanation: "Producing surface proteins that closely mimic other viruses would not help a virus evade the adaptive immune system, since a response already primed against those other viruses could still recognize and target the similar antigens: unlike mutating surface antigens, hiding from MHC presentation, or killing helper T cells, which all directly blunt the adaptive response."
    sourceRef: "Campbell Biology 11e, Ch. 43 (The Immune System)"

  - id: "immune-physiology-04"
    type: mcq
    difficulty: medium
    letter: "A"
    text: "Which of the following should be the same in identical twins?"
    options:
      - key: "A"
        text: "the set of antibodies produced"
      - key: "B"
        text: "the set of MHC molecules produced"
      - key: "C"
        text: "the set of T cell antigen receptors produced"
      - key: "D"
        text: "the set of immune cells eliminated as self-reactive"
    answer: "B"
    explanation: "MHC (major histocompatibility complex) genes are inherited, and because identical twins share 100% of their genome, they have identical sets of MHC molecules; antibody and T-cell-receptor repertoires, by contrast, are generated by random somatic gene rearrangement in each individual and so differ even between identical twins."
    sourceRef: "Campbell Biology 11e, Ch. 43 (The Immune System)"

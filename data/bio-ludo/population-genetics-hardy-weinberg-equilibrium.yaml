topic: "population-genetics-hardy-weinberg-equilibrium"
topicName: "Population Genetics & Hardy-Weinberg Equilibrium"
source: "Campbell Biology, 11e (Urry et al.): Instructor Test Bank"
questions:
  - id: "population-genetics-hardy-weinberg-equilibrium-01"
    type: mcq
    difficulty: medium
    letter: "A"
    text: "A fruit fly population has a gene with two alleles, A1 and A2. Tests show that 70% of the gametes produced in the population contain the A1 allele. If the population is in Hardy-Weinberg equilibrium, what proportion of the flies carry both A1 and A2?"
    options:
      - key: "A"
        text: "0.7"
      - key: "B"
        text: "0.49"
      - key: "C"
        text: "0.42"
      - key: "D"
        text: "0.21"
    answer: "C"
    explanation: "With p (frequency of A1) = 0.7 and q (frequency of A2) = 0.3, the heterozygote frequency under Hardy-Weinberg is 2pq = 2 × 0.7 × 0.3 = 0.42."
    sourceRef: "Campbell Biology 11e, Ch. 23 (The Evolution of Populations)"

  - id: "population-genetics-hardy-weinberg-equilibrium-02"
    type: mcq
    difficulty: easy
    letter: "A"
    text: "Natural selection changes allele frequencies because some ________ survive and reproduce better than others."
    options:
      - key: "A"
        text: "alleles"
      - key: "B"
        text: "loci"
      - key: "C"
        text: "species"
      - key: "D"
        text: "individuals"
    answer: "D"
    explanation: "Natural selection changes allele frequencies indirectly: it acts on individuals' survival and reproductive success, and only through differential reproduction of individuals do the allele frequencies of a population shift over generations."
    sourceRef: "Campbell Biology 11e, Ch. 23 (The Evolution of Populations)"

  - id: "population-genetics-hardy-weinberg-equilibrium-03"
    type: mcq
    difficulty: medium
    letter: "A"
    text: "Cystic fibrosis is a genetic disorder in homozygous recessives that causes death during the teenage years. If 9 in 10,000 newborn babies have the disease, what are the expected frequencies of the dominant (A1) and recessive (A2) alleles according to the Hardy-Weinberg equation?"
    options:
      - key: "A"
        text: "f(A1) = 0.9997, f(A2) = 0.0003"
      - key: "B"
        text: "f(A1) = 0.9800, f(A2) = 0.0200"
      - key: "C"
        text: "f(A1) = 0.9700, f(A2) = 0.0300"
      - key: "D"
        text: "f(A1) = 0.9604, f(A2) = 0.0392"
    answer: "C"
    explanation: "The recessive homozygote frequency q² = 9/10,000 = 0.0009, so q = √0.0009 = 0.03 and p = 1 − 0.03 = 0.97."
    sourceRef: "Campbell Biology 11e, Ch. 23 (The Evolution of Populations)"

  - id: "population-genetics-hardy-weinberg-equilibrium-04"
    type: mcq
    difficulty: medium
    letter: "A"
    text: "Which Hardy-Weinberg condition is affected by population size?"
    options:
      - key: "A"
        text: "selection"
      - key: "B"
        text: "genetic drift"
      - key: "C"
        text: "gene flow"
      - key: "D"
        text: "no mutation"
    answer: "B"
    explanation: "Genetic drift, the random fluctuation of allele frequencies due to chance sampling of gametes, has a much larger effect in small populations than large ones, making population size the Hardy-Weinberg-violating condition it depends on."
    sourceRef: "Campbell Biology 11e, Ch. 23 (The Evolution of Populations)"

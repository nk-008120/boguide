    question: |

      Due to dynamic phosphorylation-dephosphorylation process, almost all signalling pathways are reversible and in many cases phosphorylation activates the signalling. Which combination of following conditions will inhibit such a signalling pathway in operation? i. Application of kinase inhibitor.ii. Treatment with a phosphatase inhibitor.iii. Phosphorylated amino acid residue binder recruiting a phosphatase.iv. Binding of a phosphorylated amino acid residue recognizing kinase.v. An interaction stabilizing the half-life of the phosphorylated amino acid residue.

      A. Only i and iiiB. Only ii, iv, and vC. Only i, iii, and ivD. Only ii, iii, and v
  - id: 2
    difficulty: "medium"
    source: "INBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/cell-signaling-communication-q2-1.png)

      Signal transduction events through transmembrane receptors in cells often culminate in the activation of a transcription factor. One such example is the activation of NF-κB (Nuclear Factor Kappa B) by TNF-α (Tumor Necrosis Factor-alpha). NF-κB is a heterodimer of two subunits, p50 and p65, and it is retained in the cytoplasm by its inhibitor IκB-α. TNF signaling phosphorylates IκB-α leading to its degradation by ubiquitination. As a result, free NF-κB and its translocation into the nucleus, where it binds to a responsive promoter and activates gene expression. Activation of NF-κB by the TNF is transient in nature because one of the genes that NF-κB activates is the gene for IκB-α itself. In one experiment, activation of NF-κB by TNF was studied in a macrophage cell line. From the above experiment, cytoplasmic and nuclear extracts were prepared, proteins were separated on SDS-PAGE and Western blotting was performed using antibodies against p65 and IκB-α proteins. Also, antibodies against α-actin and lamin were used to demonstrate the purity of the cytoplasmic and nuclear fractions as well as loading control.
    solution: |

      Ans: A – Lamin, B – p65, C - IκB-α, D – α-actin
  - id: 3
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      G protein-coupled receptors (GPCRs) interact with G proteins that subsequently affect cell function through the generation of second messengers. Cyclic AMP (cAMP) generated by adenylyl cyclase controls cell functions via activation of protein kinases. GPCRs may either activate or inhibit the cyclase through the G proteins Gs and Gi, respectively. The difference between Gs and Gi resides in the 𝛼 subunit, which binds and hydrolyses GTP. The Gs protein cycle is illustrated below (Fig. 1).

      ![image](/CHALLENGEPICS/cell-signaling-communication-q3-1.png)

      A lab is working on a pair of newly identified GPCRs, “GPCR-A” and “GPCR-B”. Each binds the same small ligand with the same affinity but activates different G-proteins that act on adenylyl cyclase. When activated, GPCR-A causes an increase in adenylyl cyclase activity, while GPCR-B causes a decrease in adenylyl cyclase activity. They have a cell line that expresses both GPCR-A, GPCR-B, the corresponding G-proteins, and adenylyl cyclase. There is a basal level of adenylyl cyclase activity that produces a baseline cAMP concentration. A member of the lab studying a pathogenic bacterium has discovered that it secretes a toxin that interferes with the mentioned signalling pathway. To determine how this toxin acts, she did an experiment in which she looked at intracellular cAMP levels in untreated and toxin treated cells (the original ligand of the receptors was not added in either of the experiments).

      ![image](/CHALLENGEPICS/cell-signaling-communication-q3-2.png)

      (I) Indicate whether each of the following mutations increase (+), not changed (0) or decrease (-) the intracellular levels of cAMP upon ligand addition in the absence of the toxin? Both GPCR-A and GPCR-B bind the same ligand.

      A. A mutation in GPCR-A that prevents G protein activation.

      B. A mutation in GPCR-B that prevents G protein activation.

      C. A mutation in Gs that prevents release of bound GDP.

      D. A mutation in Gi that prevents release of bound GDP.

      E. A mutation in Gs that prevents GTP hydrolysis.F. A mutation in Gi that prevents GTP hydrolysis.
    solution: |

      Answer – A -> (-), B -> (+), C -> (-), D -> (+), E -> (+), F -> (-)

      (II) What is/are the possible explanation(s) for the mechanism in which the toxin in paragraph 3 affects adenylyl cyclase activity? Indicate if each the following statements are true (T) or false (F).

      A. The toxin inhibits activation of Gi in response to receptor stimulation.

      B. The toxin inhibits GTP hydrolysis in Gs.

      C. The toxin mimics GTP and causes persistent activation of all G proteins.

      D. The toxin is an inhibitor of GPCR-A receptor.

      E. The toxin is an activator of GPCR-B receptor.

      Answer – A – T, B – T, C – F, D – F, E – F
  - id: 4
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/cell-signaling-communication-q4.png)

      Two different mutant forms of a gene that encodes a cell surface receptor tyrosine kinase (RTK) are separately inserted into vectors. One mutant encodes a protein with a non-functional kinase domain, and the other lacks a functional ligand binding domain. Each vector is separately introduced into normal cells that can express wild type RTK from their endogenous genes.It is known that the cells used have a high capacity for RTK receptors on their surface, that ligands bind to monomeric forms of receptor proteins and that heterodimeric receptors are inactive in signalling. The diagrams below depict four cell types identified. Each diagram shows the only receptor forms observed on the respective cell types in the ratio that they were observed.The experiments were performed under non-saturating concentrations of ligand.

      Indicate if each of the following statements is true or false:A. In type 1 cells, the mutant receptor with the non-functional kinase domain will interfere with signalling by the cells’ normal RTK.

      B. In type 2 cells, the mutant RTK lacking functional ligand binding domain will be inactive for signalling, but will not interfere with normal signalling mediated by the cells’ own receptor tyrosine kinases.

      C. Equal levels of signalling will be achieved by type 3 and type 4 cells.

      D. The effects of mutant RTKs of cell type 2 and cell type 3 on levels of signalling by the cells’ own normal RTKs will be the same.
    solution: |

      Ans – A – T, B – T, C – F, D – F
  - id: 5
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/cell-signaling-communication-q5.png)

      Brown adipose tissue (BAT) activation through β-adrenergic signalling pathway is associated with expression of thermogenic genes and the process of thermogenesis. Glycogen synthase kinase-3 (GSK3) acts as a regulator of β-adrenergic signalling in brown adipocytes. ISO is also a chemical stimulator of BAT activation; its effect on GSK3 is shown by the Western blot below (p-GSK3 is phosphorylated form of GSK3). SB216763 is an inhibitor of GSK3. Effects of these two agents on the expression of thermogenic genes (Fgf21, Ucp1, Dio2, and Ppargc1a) are shown in the Figure below

      Indicate if each of the following statements is true or false:A. GSK3 acts as a negative regulator of β-adrenergic signalling in brown adipocytes.

      B. Phosphorylation of GSK3 causes decreased expression of Fgf21.

      C. SB216763 may prevent diet-induced obesity.

      D. Use of SB216763 and ISO together cause much higher increase in the number of Ppargc1a mRNA transcripts as compared to Fgf21 mRNA transcripts.
    solution: |

      Ans – A - T, B - F, C - T, D – F
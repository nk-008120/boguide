title: "Bioenergetics & Central Metabolism Overview"
questions:
  - id: 1
    difficulty: "easy"
    source: "USABO"
    contributor: "SM"
    question: |

      Comparing the effect of an inhibitor with an uncoupler of oxidative phosphorylation, the:
      A. inhibitor would allow electrons to pass through the electron transport chain
      B. inhibitor would increase the pumping of protons by the electron transport chain
      C. uncoupler would increase heat production by the mitochondria
      D. uncoupler would inhibit the reduction of oxygen by the electron transport chain
      E. uncoupler would stop the oxidation of NADH by the electron transport chain
    solution: |

      Answer – C

      Evaluating each statement,

      A - IncorrectSolution - 
      An ETC inhibitor blocks electron flow.

      B - IncorrectSolution
       - An inhibitor decreases/stops proton pumping.

      C - CorrectSolution
       - Uncoupling dissipates the proton gradient as heat.

      D - Incorrect
      Solution - Uncouplers can allow ETC electron flow and oxygen reduction to continue.

      E - IncorrectSolution
       - Uncouplers generally do not stop NADH oxidation; NADH oxidation may actually increase because the proton gradient no longer restricts ETC activity.
  - id: 2
    difficulty: "easy"
    source: "IBO"
    contributor: "SM"
    question: |

      Drugs that render the inner mitochondrial membrane permeable to H+ are called “uncouplers”. Indicate whether each of the following statements is 
      True or False:
      A. These drugs will increase oxygen consumption.
      B. These drugs will reduce body carbohydrate catabolism.
      C. These drugs will decrease body temperature.
      D. These drugs may cause death upon overdose because of severe weight loss.
      E. These drugs may cause death upon overdose because of severe ATP loss.
    solution: |

      Answer – A – True, B – False, C – False, D – False, E – True

      Evaluating each statement,

      A - True

      Solution –
      Uncouplers dissipate the H⁺ gradient, so the ETC keeps running rapidly to rebuild it. This increases electron flow and therefore O₂ consumption.

      B - False

      Solution - ATP production becomes inefficient, so the body increases fuel oxidation, including carbohydrate catabolism, to compensate for the energy deficit.

      C - False

      Solution - The proton gradient's energy is released as heat, so body temperature can rise dangerously.

      D - False

      Solution - Weight loss can occur, but it is not the primary lethal mechanism of uncoupler overdose.

      E - True

      Solution - H⁺ bypasses ATP synthase, so oxidative phosphorylation becomes uncoupled and ATP production falls severely. Vital cellular processes can fail.
  - id: 3
    difficulty: "medium"
    source: "INBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/bioenergetics-central-metabolism-q3-1.png)

      Seahorse XF analyzer is an instrument for assessment of mitochondrial health by measuring the oxygen consumption rate (OCR) in real time. The given graph depicts basal aerobic and anaerobic respiration of healthy and diseased cells of liver in culture. Dosing the cells with FCCP maximizes mitochondrial respiratory capacity whereas, Rotinone, blocks complex I causing inhibition of oxidative phosphorylation. Anaerobic respiration indicates the spare respiratory capacity of the liver cells.

      Based on this study, indicate whether each of the interpretations listed is True or False:
      A. Adding glucose to diseased liver cells shall proportionately increase oxygen consumption rate.
      B. Poor FCCP response in diseased cells suggests a stronger mitochondrial membrane potential.
      C. Less number of mitochondria could be the reason for poor FCCP response in diseased cells.
      D. Identical response of control and diseased cells to Rotinone suggests cessation of anaerobic respiration as well.
      E. Addition of glucose to diseased liver cells will improve spare respiratory capacity.
      F. Cessation of aerobic respiration could be the reason for identical response to Rotinone in control and diseased cells.
    solution: |

      A - False

      B - False

      C - True

      D - False

      E - True

      F - True
  - id: 4
    difficulty: "medium"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/bioenergetics-central-metabolism-q4.png)

      The figure 1 illustrated below shows oxygen consumption (respiration) in aqueous suspension of intact animal mitochondria with additions of ADP or chemical compounds (dinitrophenol (DNP) or N,N'- dicyclohexylcarbodiimide (DCCD)). The suspension already contains respiratory substrates, oxygen, and inorganic phosphate.

      Indicate whether each of the following statements is True or False:
      A. The mitochondria are able to incorporate exogenously added ADP.
      B. Before addition of chemical compounds, the mitochondria respire only when ATP can be produced.
      C. The reason why DNP stimulates oxygen consumption is that ATP synthesis is stimulated by DNP.
      D. DCCD inhibits ATP synthesis
    solution: |

      Answer – A - True, B - True, C - False, D – True

      Solution - From the graphs, intact mitochondria respire. The major role of the mitochondria is to produce ATP. The enhanced respiration by addition of ADP can be regarded as coupling of ATP synthesis and respiration in intact mitochondria. DNP, however, stimulated respiration in the absence of ATP synthesis, because ADP was fully consumed before the addition of DNP. On the other hand, DCCD stopped the respiration before ADP was fully consumed in the figure on the right. These interpretations can be inferred only from the graphs and do not require the knowledge of DNP and DCCD. As a side note, typical cellular membranes are impermeable to ions like ATP, but mitochondrial membranes possess ATP/ADP translocators. DNP, the uncoupler, acts as a transporter of H+ ion across the mitochondrial membrane, because both DNP and DNP/H+ are lipophilic. DCCD binds covalently to the H+ channel of the ATP synthase and blocks the ATP synthesis.
  - id: 5
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/bioenergetics-central-metabolism-q5.png)

      In mitochondria, ATP is synthesized using an electron transport chain containing four complexes (I–IV) and ATP synthase (complex V). Three NADH and one FADH2 molecules are produced by one turn of the Krebs cycle (citric acid cycle / TCA cycle). The efficiency of ATP synthase varies between different cell types, but assume that the flow of about 3.3 protons allows the synthesis of one ATP molecule. Metformin, which inhibits complex I, is used to treat type 2 diabetes. Metformin is believed to alter the usual cellular AMP:ADP:ATP ratio of 1:10:100, which produces a beneficial effect from AMP-activated protein kinase (AMPK).

      Indicate whether each of the following statements is True or False:A. The oxidation of one glucose molecule leads to the synthesis of approximately 11 ATP molecules.

      B. The number of ATP molecules synthesized by ATP synthase is reduced by metformin.

      C. Metformin directly increases the concentration of FADH
      2 in the mitochondrial matrix.

      D. Metformin indirectly activates AMPK by raising the amount of AMP relative to ATP.
    solution: |

      Answer – A - F, B – T, C – F, D - T

      Evaluating each statement,

      A – False

      Solution –
      Glycolysis and oxidative decarboxylation of pyruvate also produces NADH molecules. Moreover, one glucose molecule produces two acetyl-CoA molecules. Thus, about 34 ATP molecules are produced as a result of the oxidation of a single glucose molecule.

      B – True

      Solution –
      Metformin inhibits the complex I. Thus, the number of protons pumped into the intermembrane space decreases.

      C – False

      Solution –
      Metformin does not affect the turnover of FADH2 molecules.

      D – True

      Solution –
      If the amount of adenosine triphosphate is decreased, the amount of its diphosphates and monophosphates becomes higher. Thus, this metformin effect indirectly activates AMPK.
  - id: 6
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/bioenergetics-central-metabolism-q6.png)

      The transcription factor p53 is a protein that regulates a variety of pathways including cell proliferation, DNA repair, cell death and metabolism. In an experiment, hepatocytes isolated from a healthy donor were cultured in vitro and the gene encoding p53 (TP53) was deleted. The impact on glycolysis and gluconeogenesis was assessed by Real Time quantitative PCR (RT-qPCR), comparing the wild type cell line (wt) and the p53 deleted cell line (ko).

      Figure 1 - mRNA expression of different genes involved in glucose metabolism. Y – mRNA expression; X – Housekeeping genes. G6PC – glucose-6-phosphatase; FBP - fructose-1,6-bisphosphatase; PEPCK – PEP carboxylkinase; PC – pyruvate carboxylase; HK – hexokinase; PFK – phosphofructokinase; PK - pyruvate kinase.
      Indicate whether each of the following statements are True or False:
      A. Analysis of the graph suggests that p53 promotes glycolysis.
      B. Glucose-6-phosphatase expression is regulated by p53.
      C. In the absence of p53 gluconeogenesis is downregulated.
      D. There is no effect of TP53 deletion on either glycolysis or gluconeogenesis.
    solution: |

      Answer – A – False, B – True, C – True, D – False

      Evaluating each statement,

      A - False

      Solution –
      No significant upregulation or downregulation for any glycolytic enzyme (HK, PK and FBP) in absence of p53.

      B - True

      Solution
      – From graph, p53 expression increases G6PC expression significantly.

      C - True

      Solution
      – Gluconeogenetic flux is related to G6PC which is downregulated in absence of p53.

      D - False

      Solution
      – From analysis of above statements, there is effect of p53 absence on gluconeogenesis.

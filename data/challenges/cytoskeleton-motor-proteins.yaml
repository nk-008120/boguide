    question: |

      Frog melanophores contain pigment granules that can either be dispersed throughout the cytoplasm, causing the cell to appear darker, or aggregated near the centre of the cell, causing it to appear lighter.

      Pigment granules are transported along microtubules by motor proteins. The minus ends of microtubules are predominantly located near the cell centre, while the plus ends extend towards the cell periphery.

      A researcher treats melanophores with different substances and measures pigment distribution.

      (I) Which statement is most consistent with the role of microtubules in melanophore pigment transport?

      A. Inhibition of microtubule polymerization would increase pigment aggregation at the cell centre because additional microtubules are formed with their minus ends facing outward.

      B. A drug that stabilizes microtubules would necessarily prevent pigment granules from moving because motor proteins can only move along depolymerizing microtubules.
      C. If a motor protein transports pigment granules towards microtubule minus ends, increased activity of this motor would be expected to increase pigment aggregation near the centre of the melanophore.

      D. If pigment granules move towards the plus ends of microtubules, depolymerization at the plus ends would increase the distance over which the granules can be transported towards the cell periphery.

      (II) In a separate experiment, researchers measure the movement of pigment granules towards the centre of a melanophore following stimulation. The mean distance of pigment granules from the cell centre was measured at 10 time points:

      | Time (s) | Mean distance from cell centre (μm) |
      |---|---|
      | 0 | 24.00 |
      | 10 | 22.02 |
      | 20 | 20.00 |
      | 30 | 17.85 |
      | 40 | 15.96 |
      | 50 | 14.25 |
      | 60 | 12.06 |
      | 70 | 9.86 |
      | 80 | 8.00 |
      | 100 | 4.50 |

      (a) Calculate the mean rate of movement of pigment towards the centre (in μm/s) :
    solution: |

      Ans: 0.195-0.205

      (b) A second group of melanophores is treated with a drug that reduces the rate of microtubule-dependent transport by 35%. Calculate the expected mean rate of pigment movement in the treated cells.
      Ans: 0.126: 0.133

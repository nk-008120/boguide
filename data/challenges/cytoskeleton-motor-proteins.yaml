      Kinesin-5 motors are tetrameric motors that bind to anti-parallel microtubules and slide them apart. The microtubules in a mitotic spindle can be divided into three groups (1) kinetochore microtubules (ii) astral microtubules and (iii) interpolar microtubules as shown below.

      ![image](/CHALLENGEPICS/cytoskeleton-motor-proteins-q1.png)

      During mitosis, Kinesin-5 is most likely to be present on __________ microtubules and is expected to play a crucial role during _________. Choose the correct option to complete the given statement.

      A. kinetochore and prophase
      B. interpolar and anaphaseC. astral and anaphaseD. interpolar and metaphase

      Animal cells generally have three types of cytoskeletons: (1) microtubules, (2) actin filaments, and (3) intermediate filaments. Figure 1 shows the morphology of a cytoskeleton during the mitotic metaphase or in interphase. For each statement below A-E, indicate the corresponding type of cytoskeleton from 1 to 3 in the first box, and the schematic diagram from 1 to 6 in Figure in the second box.

      A. They are entangled inside interphase cells and exist in a meshwork. They enhance the elasticity of cells and provide a mechanically supportive structure. ()

      B. It is called a stress fiber. It builds a support beam inside cells and works to maintain the shape of the cell in interphase.

      C. This spindle-shaped structure is formed during cell division. It plays a role in separating replicated chromosomes accurately into daughter cells.

      D. After chromosomal segregation, it forms a ring structure and mechanically separates two daughter cells.

      E. Having radial distributions starting near the nucleus, the fibrous structure is assumed to have structural polarity or directionality.

      | Statement | Cytoskeleton Type | Schematic Diagram |
      |---|---|---|
      | A | 3 | 3 |
      | B | 2 | 1 |
      | C | 1 | 6 |
      | D | 2 | 5 |
      | E | 1 | 2 |
  - id: 5
    difficulty: "hard"
    source: "Unknown"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/cytoskeleton-motor-proteins-q5.jpg)

      Myosin V is a motor protein that transports cargo along actin filaments. It has two motor heads, which bind to actin and move in an alternating hand-over-hand pattern. Researchers investigated the movement of individual myosin V molecules along immobilized actin filaments. To observe movement with high spatial resolution, they attached a fluorescent label to the neck region of one myosin V head. The actin filament was fixed in position, and the position of the fluorescent label was recorded repeatedly over time using fluorescence microscopy. The results of the experiment is given below in the figure. The researchers found that the labelled neck region did not move continuously. Instead, its position remained relatively constant for short periods before changing abruptly, producing a step-like trace similar to that shown in the figure. When one myosin head remains attached to the actin filament, the other head can detach and move past it before binding to a new site. The moving head may therefore travel a greater distance than the displacement measured for the labelled region of the entire motor.

      Using the information provided and the figure, determine whether each statement is true or false:A. The step-like trace provides evidence that movement of myosin V along the actin filament occurs through discrete changes in position rather than at a constant continuous rate.

      B. If the fluorescent label records a displacement of approximately 36 nm, each individual myosin head must also have moved exactly 36 nm during that step.

      C. During hand-over-hand movement, one myosin head could move approximately 72 nm relative to its previous position while the overall position associated with the motor advances by approximately 36 nm.

      D. Because myosin V contains two heads, an observed 36 nm displacement of the labelled motor can be interpreted as each head moving 18 nm during the same step.

      Ans: A: T, B: F, C: T, D - F
    solution: |

      | A | True | The step-like trace shows periods of little or no displacement followed by abrupt changes in position, supporting discrete stepping rather than continuous movement. |
      |---|---|---|
      | B | False | A measured displacement of 36 nm for the labelled region does not mean that each myosin head moved exactly 36 nm. During a hand-over-hand step, the moving myosin head can move approximately 72 nm. |
      | C | True | In hand-over-hand movement, one head can move approximately 72 nm to pass the stationary head and bind to a new actin site, while the motor advances approximately 36 nm overall. |
      | D | False | The 36 nm displacement cannot simply be divided by two to conclude that each head moves 18 nm. The heads move alternately, not simultaneously by equal distances. |

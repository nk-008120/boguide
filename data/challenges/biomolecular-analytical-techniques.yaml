    question: |

      Which of the following principles is true of separating DNA by gel electrophoresis? Indicate whether each statement is True or False:A
      . DNA fragments are overall positively charged.B
      . The smaller DNA fragments move faster across the gel under the electric current.

      C.
       The smaller DNA fragments are lesser charged than the larger fragments hence they move faster across the gel.D
      . The relative density of the gel matrix affects how long the separation takes.E
      . The voltage applied to the electrophoresis is determined by how much DNA is loaded in the gel.
    solution: |

      Answer: A: F, B: T, C: F, D: T, E - F

      Evaluating each statement,

      A: False

      Solution: Due to addition of phosphate group to deoxyribose sugar backbone, DNA is overall negatively charged.

      B: True

      Solution: Smaller fragments face less drag and move easily across pores in the gel. Hence, their rate of movement is fast.

      C: False

      Solution: Charge per unit length of DNA is constant. So small fragments have smaller charge.

      D: True

      Solution: Relative density of gel is inversely related to pore size of gel. Hence, as relative density increases, pore size decreases and time taken for DNA fragments to move through the pores increases.

      E: False

      Solution: The voltage is determined by the desired resolution of DNA bands after electrophoresis. If sizes of bands are close to each other, resolution needed is more and voltage needed is less so separation can take more time.

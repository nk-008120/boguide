  - id: 6
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      Here is a mixture containing viruses, globular proteins, and cell nuclei, which are all assumed to have similar densities of approximately 1.3 g/mL. We would like to separate them by using three different centrifugation methods as shown in Figure 1. The first method entails centrifugation of the mixture (Mix) after placing it on the top of a medium (Med) that has a uniform density (Exp. A). The second method (Exp. B) entails centrifugation of the mixture using a medium that has a density gradient ranging from 1.0 to 1.6 g/mL (from the top to the bottom). The final method entails the use of a centrifuge tube with the same density gradient as that in Exp. B, but the mixture is placed at the bottom of the tube (Exp. C). g indicates the direction of centrifugal forces given to the specimens.

      ![image](/CHALLENGEPICS/biomolecular-analytical-techniques-q6-1.png)

      A. In Exp. A, how are viruses, globular proteins, and nuclei supposed to sediment? Choose the most appropriate diagram from I, II, III, IV in Figure 2 that shows the sedimentation time courses of specimens

      B. In Exp. A, choose appropriate lines from a, b, or c in the selected diagram that indicate the time courses of sedimentation of viruses, globular proteins and nuclei.

      C. In Exp. B, how are viruses, globular proteins, and nuclei supposed to sediment? Choose the most appropriate diagram from I, II, III, IV in Figure 2 that shows the sedimentation time courses of the specimens.

      D. In Exp. B, choose appropriate lines from a, b, or c in the selected diagram that indicate the time courses of sedimentation of viruses, globular proteins and nuclei.

      ![image](/CHALLENGEPICS/biomolecular-analytical-techniques-q6-2.png)

      E. In Exp. C, how are viruses, globular proteins, and nuclei supposed to float? Choose the most appropriate diagram from I, II, III, IV in Figure 3 that shows the sedimentation time courses of the specimens.

      ![image](/CHALLENGEPICS/biomolecular-analytical-techniques-q6-3.png)

      F. In Exp. C, choose appropriate lines from a, b, or c in the selected diagram that indicate the time courses of floating of viruses, globular proteins and nuclei.
    solution: |

      A: III
      B - Virus: b, globular proteins: a, nuclei: cSolution - 
      As the sedimentation speed of a specimen that has a similar density (1.3 g/mL) is dependent on size (nuclei>viruses>biomolecules), nuclei sedimentation is greatest with an almost constant speed as shown by the straight line, c, within diagram III of Figure 2. Viruses and biomolecules then follow nuclei.

      C: IID - 
      Virus: b, globular proteins: a, nuclei: cSolution - 
      As the sedimentation speed of a specimen that has a similar density (1.3 g/mL) is dependent on size (nuclei>viruses>biomolecules), nuclei sedimentation is greatest and stops when the medium density (1.0 to 1.6 g/mL) is equal to the specimen density (1.3 g/mL) as shown by the curve, c, of diagram II within Figure 2. Viruses and biomolecules then follow nuclei

      E: VIF
       - Virus: b, globular proteins: c, nuclei: aSolution - 
      Similar to the sedimentation speed, the floating speed of a specimen that has a similar density (1.3 g/mL) is dependent on size (nuclei>viruses>biomolecules), whereby nuclei float first and stop when the medium density (1.0 to 1.6 g/mL) is equal to the specimen density (1.3 g/mL) as shown by the curve, c, of diagram VI in Figure 3. Viruses and biomolecules then follow nuclei.

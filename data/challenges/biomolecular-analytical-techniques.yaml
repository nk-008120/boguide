    question: |

      ![image](/CHALLENGEPICS/biomolecular-analytical-techniques-q2.png)

      Biochemical purification of a protein from a cell extract often requires several purification steps involving various techniques. The purification process can be followed by gel electrophoresis of the starting protein mixture i.e. the cell homogenate and the fractions obtained from each subsequent purification step. Shown here are the schematic depictions of separation of proteins on a gel for the starting mixture of proteins (lane 1) and samples taken after each of the several purification steps.

      If lanes 1 and 2 indicate the separation of proteins from the crude cell homogenate and after salt fractionation respectively, then which of the techniques are represented in lanes 3, 4 and 5 respectively?A
      . Ion exchange chromatography; affinity chromatography and gel filtration chromatographyB
      . Gel filtration chromatography; ion exchange chromatography and affinity chromatographyC
      . Affinity chromatography; ion exchange chromatography and gel filtration chromatographyD
      . Ion exchange chromatography; gel filtration chromatography and affinity chromatography
    solution: |

      Answer: D

      Solution: For efficient purification, we move from least specific to most specific method. Among ion exchange, gel filtration and affinity chromatography, affinity chromatography is most specific while ion-exchange filtration is least specific. We can say that there are more proteins with same charge and different mass than there are proteins with same mass but different charge. Thus, ion exchange chromatography which separates on basis of charge is less specific than gel filtration chromatography which separates on basis of mass. Affinity chromatography is most specific because it uses ligands or antibodies specific for one particular protein only. Thus, order of steps is ion exchange chromatography followed by gel filtration chromatography followed by affinity chromatography
  - id: 3
    difficulty: "medium"
    source: "INBO"
    contributor: "SM"
    question: |

      A student was performing enzyme purification in the laboratory for the first time. She began with 1200 mg of crude protein extract containing an enzyme of interest. At the beginning as well as at every purification step, she determined:
      i. Total protein content
      ii. Total units of enzyme present (also known as Activity)
      iii. Specific activity of enzyme (Units/mg protein).

      A. In a very efficient purification process, which of the following is expected to happen? Choose the correct option
      I. i to increase, ii to remain constant, iii to increase.
      II. i and ii to increase, iii to remain constant.
      III. i to decrease, ii and iii to increase.
      IV. i, ii and iii to increase

      B. Data (protein content and activity) obtained by her during the process is given in the table. Complete the table by filling in the specific activity, % yield of activity and purification factor values.

      | Step | Protein (mg) | Activity (U) | Specific activity (U/mg) | % Yield of activity | Purification factor |
      |---|---|---|---|---|---|
      | 0 | 1200 | 800 | 0.67 | - | - |
      | 1 | 600 | 600 | 1.0 |  |  |
      | 2 | 200 | 180 | 0.9 |  |  |
      | 3 | 30 | 150 | 5.0 |  |  |
      | 4 | 20 | 148 | 7.4 |  |  |

      C. Which of the above is the least effective purification step?

      D. Which of the above is the most effective purification step?

      E. Which step is indicative that enzyme of interest is partially inactivated?
    solution: |

      A: ISolution: In such a process, total protein will decrease with each step since only enzyme is to be purified. However, some loss of enzyme will occur with each step since 100% yield is not possible practically. However, the specific activity increases since proportionally more protein is lost than enzyme.

      B:

      | Step | Protein (mg) | Activity (U) | Specific activity (U/mg) | % Yield of activity | Purification factor |
      |---|---|---|---|---|---|
      | 0 | 1200 | 800 | 0.67 | - | - |
      | 1 | 600 | 600 | 1.0 | 75 | 1.5 |
      | 2 | 200 | 180 | 0.9 | 30 | 0.9 |
      | 3 | 30 | 150 | 5.0 | 83.33 | 5.55 |
      | 4 | 20 | 148 | 7.4 | 98.67 | 1.48 |

      C: IISolution: Least effective purification process has lowest value of purification factor. Hence step 2 is least effective

      D: IIISolution - Most
       effective purification process has highest value of purification factor. Hence step 3 is least effective

      E: IISolution: From the values of % Yield of Activity, we see that step 2 is an outlier and this may be due to partial inactivation of enzyme
  - id: 4
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/biomolecular-analytical-techniques-q4.png)

      Plasmodium is a parasitic protozoan that is prevalent in tropical countries. Once the parasites invade host red blood cells, they multiply within 24 h. Fe2+ in red blood cell can react with free O2 as well as H2O2, causing formation of free radicals that can damage parasite cells. Unlike host cells, the parasites lack several enzymes of antioxidant defence systems. Scientists analysed the proteins from the parasite cytosol using two-dimensional gel electrophoresis (see image below). Then, using mass spectrometry and peptide mass fingerprinting, they identified 6 proteins (spots 1 to 6) corresponding to human peroxiredoxin, while one protein (spot 7) corresponding to Plasmodium peroxiredoxin.

      Indicate if each of the following statements is True or False:
      A. Based on the presented data, Plasmodium peroxiredoxin is a multimeric protein.
      B. All human peroxiredoxin proteins have a positive net charge at physiological pH.
      C. Gel filtration chromatography is suitable for separation and purification of the six human peroxiredoxin proteins.
      D. Immunoaffinity chromatography can be used for separation of Plasmodium peroxiredoxin from other Plasmodium cytosolic proteins.
    solution: |

      Answer: A: F, B: F, C: F, D - T

      Evaluating the statements,

      A - False

      Solution:
      It cannot be concluded from given 2D gel electrophoresis.

      B: False

      Solution: From the figure, we see that the
      pI of all the human peroxiredoxin proteins is below physiological pH of 7.2-7.4. This means, physiological pH is above pI for peroxiredoxin proteins and thus they acquire negative charge, not positive charge.

      C: False

      Solution: Gel filtration chromatography is not suitable for separation and purification of all 6 peroxiredoxin proteins since we can see 3 proteins of mass
      15 kDa (approx.) which will not be separated by it.

      D: True

      Solution: Immunoaffinity chromatography uses specific antibodies/ligands for the Plasmodium peroxiredoxin protein and can separate it from other Plasmodium cytosolic proteins.

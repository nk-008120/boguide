    question: |

      Chloroplasts, according to the theory of endosymbiosis, represent originally free-living prokaryotes that were taken inside eukaryotic cells and lost their ability to exist independently. Which of the following is least likely to be encoded by the chloroplast genome based on this theory?
      A. Chloroplast DNA PolymeraseB. Chloroplast RNA PolymeraseC. Chloroplast ribosomal subunitsD. Chloroplast tRNA

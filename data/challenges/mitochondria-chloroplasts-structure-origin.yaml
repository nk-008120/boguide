  - id: 3
    difficulty: "medium"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/mitochondria-chloroplasts-structure-origin-q3.png)

      When isolated mitochondria are suspended in a buffer containing ADP, Pi, and an oxidizable substrate, three easily measured processes occur: the substrate is oxidized; O2 is consumed; and ATP is synthesized. Cyanide (CN-) is an inhibitor of the passage of electrons to O2. Oligomycin inhibits ATP synthase by interacting with subunit F0. 2,4-dinitrophenol (DNP) can diffuse readily across mitochondrial membranes and release a proton into the matrix, thus dissipating the proton gradient.

      Indicate if each of the following statements is True or False.

      A. x is the oxidizable substrate.

      B. y is either oligomycin or CN
      -.

      C. z is DNP.

      D. If z is a mixture of oligomycin and DNP, the ATP synthesis will not level off.
    solution: |

      Ans – A - T, B - T, C - T, D – F

  - id: 5
    difficulty: "hard"
    source: "Unknown"
    contributor: "SM"
    question: |

      The table shows that human mitochondrial DNA (mtDNA) encodes some, but not all, of the protein subunits in the respiratory complexes.

      ![image](/CHALLENGEPICS/mitochondria-chloroplasts-structure-origin-q5.jpg)

      An aspiring biologist thinks there might be some error with some of the data in the table and proposes the following hypothesis:

      Hypothesis: All respiratory protein complexes contain at least one subunit synthesized using mitochondrial ribosomes.

      To test this hypothesis, isolated human cells are subjected to a pulse–chase experiment using a radioactive amino acid. During the pulse, cells are divided into two groups:

      Group 1: Cytoplasmic protein synthesis is inhibited, while mitochondrial protein synthesis can continue. Group 2: Mitochondrial protein synthesis is inhibited, while cytoplasmic protein synthesis can continue.

      After the pulse, cells are returned to normal conditions during the chase. The respiratory complexes are then isolated and tested for radioactive labelling of their protein subunits.

      Using the information in the table, determine whether each statement is true or false:

      A. Complex II should contain no radioactively labelled subunits in Group 1 because none of its four subunits are encoded by mtDNA.

      B. The fluorescence intensity of Complexes III, IV and V in Group 1 should be proportional to the total number of subunits in each complex, because each complex contains subunits encoded by mtDNA.

      C. The results for Complex II would contradict the student's hypothesis because Complex II can be assembled entirely from subunits synthesized from nuclear genes.

      D. If Complex IV shows radioactive labelling in both groups, this would support the conclusion that its subunits are encoded by both nuclear DNA and mtDNA.
    solution: |

      Ans – A - T, B - F, C - T, D - T
    question: |

      Catalysis of the cleavage of peptide bonds in a small peptide by a proteolytic enzyme is described in the following table (the arrow indicates site of cleavage):

      |  | Substrate | KM (mM) | Kcat (s-1) |
      |---|---|---|---|
      | 1 | Glu-Met-Thr-Ala↓Gly | 4.0 | 24 |
      | 2 | Glu-Met-Thr-Ala↓Ala | 1.5 | 30 |
      | 3 | Glu-Met-Thr-Ala↓Phe | 0.5 | 18 |
      | 4 | Glu-Met-Thr-Ile↓Phe | 9.0 | 18 |
      | 5 | Glu-Met-Thr-Gly↓Tyr | 1.0 | 20 |

      Read each of the following statements and fill in the table:A
      . Substrate 3 is cleaved most efficiently.B
      . Alanine is the most preferred amino acid on either side of the cleavage site.C
      . The enzyme most efficiently cleaves the peptide bond between a small hydrophobic amino acid residue and a large, aromatic hydrophobic amino acid residue.D
      . A new substrate with a Km value of 0.3 would be more efficiently cleaved compared to the given substrates.

      |  | A | B | C | D |
      |---|---|---|---|---|
      | True |  |  |  |  |
      | False |  |  |  |  |
      | Cannot be deduced |  |  |  |  |
    solution: |

      Answer –

      |  | A | B | C | D |
      |---|---|---|---|---|
      | True | ✔ |  | ✔ |  |
      | False |  | ✔ |  |  |
      | Cannot be deduced |  |  |  | ✔ |

      Solution –

      Make a table for catalytic efficiency (Kcat/KM) for each substrate:

      |  | Substrate | KM (mM) | Kcat (s-1) | Kcat/KM (mM s-1) |
      |---|---|---|---|---|
      | 1 | Glu-Met-Thr-Ala↓Gly | 4.0 | 24 | 6 |
      | 2 | Glu-Met-Thr-Ala↓Ala | 1.5 | 30 | 20 |
      | 3 | Glu-Met-Thr-Ala↓Phe | 0.5 | 18 | 36 |
      | 4 | Glu-Met-Thr-Ile↓Phe | 9.0 | 18 | 2 |
      | 5 | Glu-Met-Thr-Gly↓Tyr | 1.0 | 20 | 20 |

      Evaluating each option,

      A – True

      Solution – Substrate 3 shows highest value of catalytic
      efficiency, thus it is cleaved most efficiently.

      B – False

      Solution – Only in substrate 2, Ala is on either side of cleavage site.

      C – True

      Solution – Most efficiently cleaved substrate is substrate 3 where bond between Ala (small hydrophobic amino acid) and
      Phe (large aromatic amino acid) is cleaved

      D – Cannot be deducedSolution – Efficiency depends both on 
      Kcat and KM. So it is not necessarily true that an enzyme with low KM will have greater efficiency.

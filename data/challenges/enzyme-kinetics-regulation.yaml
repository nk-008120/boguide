      1) Vmax = 3 nmol/min/cell

      2) Km = 2 mM

      Solution – Identify two pointsPoint 1 => V = 1.5 nmol/min/cell and [S] = 2 mM
      Point 2 => V = 2.5 nmol/min/cell and [S] = 10mM

      3) A – True

      Solution -
      Calculated rates are 2.1, 0.71 and 0.74 [nmol/min/cell] for GLUT1, GLUT2 and GLUT4, respectively.

      3) B – True

      Solution – Normal glucose concentration in humans is above K
      m for GLUT1 and GLUT4 but is lower than Km for GLUT2. Thus, GLUT1 and GLUT4 are saturated but GLUT2 is still in the increasing part of the curve.

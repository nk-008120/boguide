      1) Find out the nearest integer value of Vmax (in nmol/min/cell):

      2) Find out the nearest integer value of KM (in mM):

      3) GLUT2 is a glucose transport protein expressed in hepatocytes in an insulin-independent manner, and Vmax and 𝐾M are 2 nmol/min/cell and 9 mM, respectively. GLUT4 is another transporter expressed in muscles or hepatocytes functioning in an insulin-dependent manner, and Vmax and 𝐾M are 0.85 nmol/min/cell and 0.8 mM, respectively. Indicate whether each of the following statements is True or False.

      A)
      Healthy humans that typically has 4 to 6 mM of blood glucose. The rate of glucose transport per molecule by GLUT2 is considered to be approximately equal to that by GLUT4.

      B)
      Although the transport rate of glucose by GLUT1 and GLUT4 is almost saturated in healthy humans, GLUT2 has an additional capacity to increase the transportation rate.

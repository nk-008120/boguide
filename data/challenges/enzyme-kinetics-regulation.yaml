  - id: 5
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      Carbon assimilation in photosynthesis begins when Ribulose-bisphosphate carboxylase/oxygenase (Rubisco) binds one molecule of CO2 to Ribulose 1,5-bisphosphate (RuBP) to form two molecules of 3-phosphoglycerate. Rubisco is considered to be one of the most important enzymes on the planet due to its ability to produce organic carbon compounds that support almost all organisms. O2 can bind to the active site of Rubisco instead of CO2, in which case one molecule of 3-phosphoglycerate and one molecule of 3-phosphoglycorate are formed. Thus, CO2 and O2 function as antagonists. The following values show the enzymatic properties of Rubisco of a seed plant and the environmental condition in vivo.

      (a) Kinetic characteristics of Rubisco (substrate concentration at 50% of saturation at 25°C)
      KM [X]: the affinity of the enzyme for substrate X.
      KM [CO2] = 9 μM, KM [O2] = 535 μM, KM [RuBP] = 28 μM

      (b) Maximum activity (number of repetitions of enzyme reaction per second)
      kcat [X]: the maximum reaction rate when the enzyme catalyzes the reaction of substrate X.
      kcat [CO2] = 3.3 /s, kcat [O2] = 2.4 /s

      (c) Concentration in water in equilibrium with air (assuming 0.035% CO2 and 21% O2) at 25°C
      CO2 = 11 μM, O2 = 253 μM
      RuBP concentration in chloroplast stroma is 4 to 10 mM.

      Which properties from (a) to (c) above are necessary to explain the following facts from A to D?

      A. The carboxylase activity of Rubisco increases as the oxygen concentration in the air decreases
      B. In the current global environment, the carboxylase activity of Rubisco is higher than the oxygenase activity
      C. Plants must have large amounts of Rubisco to maintain the full capacity of photosynthesis
      D. Increasing the concentration of CO2 in the air increases the carboxylase activity of Rubisco
    solution: |

      A – A and CSolution - F
      rom (a) and (c) conditions, the carboxylase activity of Rubisco is not in saturating situation in the air. Since oxygen molecule works as the competitive inhibitor against CO2, the carboxylase activity increases when O2 concentration in the air decreases.

      B – A, B and CSolution - 
      Addition to (a) and (c) conditions in the air, turnover rates of CO2 and O2 is found out from (b) condition. Thus, by using all conditions, it is supposed that the carboxylase activity of Rubisco is higher than the oxygenase activity.

      C – A, B and CSolution - 
      Turnover rate of CO2 in Rubisco is very low. Also, from (a) and (c) conditions, the carboxylase activity is low. Thus, to maintain the full capacity of photosynthesis, large amounts of Rubisco is necessary.

      D – A and CSolution - 
      From (a) and (c) conditions, the carboxylase activity of Rubisco is not in saturating situation in the air. The carboxylase activity increases when CO2 concentration in the air increases.

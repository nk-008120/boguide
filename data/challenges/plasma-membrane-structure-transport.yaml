title: "Plasma Membrane Structure & Transport"
questions:
  - id: 1
    difficulty: "easy"
    source: "INBO"
    contributor: "SM"
    question: |

      0.3 M sucrose and 0.3 M glycerol both show osmotic potential same as that found within a human erythrocyte. If RBCs are suspended in these solutions independently for about an hour, cells suspended in glycerol solution show haemolysis. Which of the following can be best deduced from this?

      A. Glycerol is more hydrophilic than sucrose.

      B. Water from the glycerol solution enters the cells leaving a hypertonic solution of glycerol outside.
      C. Glycerol has greater cell membrane permeability than sucrose.

      D. Sucrose being a disaccharide requires a specific carrier protein to pass through the erythrocyte membrane.
  - id: 2
    difficulty: "easy"
    source: "IBO"
    contributor: "SM"
    question: |

      A student was studying transport of a solute ‘X’ through the erythrocyte membrane in a laboratory. She obtained the following data:

      | Experiment | [X] outside (mM) | Rate of Entry of X (μmoles/min) |
      |---|---|---|
      | I | 0 | 0 |
      | II | 0.5 | 7 |
      | III | 1.0 | 14 |
      | IV | 2.0 | 26 |
      | V | 3.0 | 35 |
      | VI | 5.0 | 38 |

      Which of the following can be deduced from the observations? A. The experiments I – VI were carried out at successively increasing temperatures.

      B. The nature of solute must be highly non-polar.

      C. Increase of solute concentration outside has resulted in proportional increase in rate of entry of the solute into the cell.
      D. The major limiting factor for the rate of entry is the carrier protein transporter.
  - id: 3
    difficulty: "easy"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/plasma-membrane-structure-transport-q3.png)

      There are 3 arrows in the figure: X, Y, Z that show paths of movement of substances through the cell surface membrane. Using the figure, determine whether the following statements are true or false:A. Vitamin D can be transported through X.

      B. Sodium and potassium ions can be transported through X.

      C. Large native globular proteins can be transported through Y.

      D. Water can be transported through Z
    solution: |

      Ans – A - T, B - F, C - F, D – T
  - id: 4
    difficulty: "medium"
    source: "INBO"
    contributor: "SM"
    question: |

      The neurotransmitter acetylcholine is made in the cytosol and then transported into synaptic vesicles, where its concentration is more than 100-fold higher than in the cytosol. When synaptic vesicles are isolated from neurons, they can take up additional acetylcholine added to the solution in which they are suspended, but only when ATP is present. Na+ ions 3 are not required for acetylcholine uptake, but, curiously, raising the pH of the solution in which the synaptic vesicles are suspended increases the rate of acetylcholine uptake. Furthermore, transport is inhibited when drugs are added that make the membrane permeable to H+ ions. Which of the following set of statements are consistent with the observation?i. Acetylcholine is being transported into the vesicle by H+ -acetylcholine antiport system.ii. H + gradient that drives the uptake is generated by an ATP driven H+ pump.iii. Raising the pH of the solution surrounding the vesicles increases the H+ gradient.iv. Transport of acetylcholine into the vesicle is a secondary active transport process.

      A. i, ii and iii onlyB. ii and iv onlyC. i, ii and iv only
      D. i, ii, iii and iv
  - id: 5
    difficulty: "medium"
    source: "INBO"
    contributor: "SM"
    question: |

      Two biomolecules (P and Q) which can act as carbon sources were added to a bacterial culture. When their initial rates of entries into the bacterial cell were measured, the following data was obtained.

      | Carbon Source (mM) | Initial Rate of Transport (µmoles/min) |  |
      |---|---|---|
      |  | P | Q |
      | 0.1 | 2 | 18 |
      | 0.3 | 6 | 46 |
      | 1.0 | 20 | 100 |
      | 3.0 | 60 | 150 |
      | 10.0 | 200 | 162 |

      (I) What can be deduced from the data?
      A. P is transported by a channel protein while Q is transported by a carrier protein.

      B. P is transported by a carrier protein while Q is transported by passive diffusion.

      C. Both P and Q are transported by active transport.

      D. Both P and Q are transported by carrier proteins.

      (II) Which of the following can be correlated with the above deduction? Put a tick mark (√) in the appropriate box in the table.
      A. P: charged molecule Q: uncharged molecule.

      B. P: polar molecule Q: non-polar molecule.

      C. P and Q: both uncharged but Q is smaller than P.

      D. P and Q: both uncharged molecules but P is smaller than Q.
  - id: 6
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/plasma-membrane-structure-transport-q6.png)

      Ethanol inhibits microbial growth. Nevertheless, some strains of the yeast Saccharomyces cerevisiae can adapt to high concentrations of ethanol. Many studies have documented the alteration of cellular lipid composition in response to ethanol exposure. In this investigation, we systematically altered the fatty acid composition in S. cerevisiae by knocking out OLE1 gene coding for integral membrane desaturase, responsible for the formation of monosaturated palmitoleic acid (∆9-C16:1) and oleic acid (∆9-C18:1). The knockout strain was then: (1) reconstituted with OLE1 gene by transformation with YEpOLE1 plasmid; (2) transformed with YEp-∆9Hz, YEp-∆9Tn, YEp-∆11Hz or YEp-∆11Tn plasmid containing ∆9 or ∆11 desaturases of two lepidopteran insect (moths) Helicoverpa zea (Hz) or Trichoplusia ni (Tni). Fatty acid component and growth curves of each transformant were investigated and shown in table and figure below:

      Indicate if each of the following statements is True or False.

      A. The lag phase of transformant OLE1 in YPD medium is shorter than those of ∆
      9Hz, ∆9Tn, ∆11Hz and ∆11Tn due to the presence of native desaturase in yeast cells.

      B. Desaturases are equally active in all transformants.

      C. The content of mono-unsaturated fatty acids is a good indicator of the ethanol tolerance in S. cerevisiae.

      D. Higher ratio of ∆
      9-C18:1 to ∆9-C16:1 causes higher ethanol tolerance in S. cerevisiae.
    solution: |

      Ans – A – T, B – F, C – F, D - T
slug: "DNA-Repair-Recombination"
title: "DNA Repair & Recombination"
questions:
  - id: 1
    difficulty: "easy"
    source: "USABO"
    contributor: "SM"
    question: |

      Sharon Osburn and Angelina Jolie underwent an elective double mastectomy due to an inherited familial mutation in the gene BRCA1. What DNA repair pathway would likely be defective due to a mutation in this gene?
      A. Direct oxidative repair.
      B. Nucleotide excision repair.
      C. Base excision repair.
      D. Recombination repair.
      E. Nonhomologous end joining.
    solution: |

      Answer - D

      Solution - BRCA1 is a key tumor-suppressor protein involved in the repair of DNA double-strand breaks (DSBs), particularly through homologous recombination (HR). BRCA1 mutation causes defective homologous recombination. This causes accumulation of DNA double-strand breaks and genomic instability. Increased genomic instability contributes to the elevated risk of breast and ovarian cancers associated with inherited BRCA1 mutations.

      Evaluating the statements,

      A: IncorrectSolution - 
      Reverses specific DNA damage directly. No role of BRCA1.

      B - IncorrectSolution -
       Removes bulky lesions, e.g. thymine dimers. No role of BRCA1.

      C - IncorrectSolution -
       Removes damaged individual bases. No role of BRCA1.

      D - CorrectSolution -
       Repairs DSBs using homologous DNA. BRCA1 is involved.

      E - IncorrectSolution -
       Directly joins broken DNA ends. No role of BRCA1.
  - id: 2
    difficulty: "medium"
    source: "IBO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/dna-repair-recombination-q2.png)

      In recent years, a genome editing technology called the CRISPR-Cas9 method has been widely used for biology research. In the CRISPR-Cas9 method, an enzyme called Cas9 is guided to the target gene by forming a complex with a guide RNA with a sequence complementary to a part of the target gene. Then, Cas9 cleaves the double stranded DNA of the target gene specifically with its activity of cleaving double-stranded DNA. Cas9 recognizes a 3-base sequence (NGG) called PAM sequence and cuts the DNA strand 3 to 4 bases upstream of PAM. The cleaved DNA chain is repaired by the DNA repair system, but at that time, a few bases are frequently deleted or inserted. The CRISPR-Cas9 method was applied by targeting the region close to the translation start codon of the most upstream exon of a gene encoding enzyme A of a certain animal. The base sequence of the target region was determined for each of the four mutants obtained.

      Indicate whether each of the following statements is true or false.
      A. It is highly likely that the activity of enzyme A is retained in mutant 1.
      B. It is highly likely that the activity of enzyme A is retained in mutant 2.
      C. It is possible that the activity of enzyme A is retained in mutant 3.
      D. It is highly likely that the activity of enzyme A is lost in mutant 4.
    solution: |

      A. False

      Solution -
      Since the insertion of a single base causes a frameshift, it is considered that the function of the protein encoded by this gene is lost.

      B. False

      Solution -
       Since the deletion of one base causes a frameshift, it is considered that the function of the protein encoded by this gene is lost.

      C. True

      Solution -
       One amino acid is missing due to the deletion of 3 bases. If this amino acid is not critical for protein function, the function of the encoded protein may be conserved.

      D. False

      Solution -
       One codon is added by inserting three bases. Although no frameshift has occurred, it is considered that the function of the encoded protein is lost due to the appearance of the stop codon TAA.
  - id: 3
    difficulty: "medium"
    source: "USABO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/dna-repair-recombination-q3.png)

      You found the following karyotype structure shown below:

      This could be due to which of the following?
      A. Portions of non-homologous chromosomes have been translocated.
      B. The homologous chromosomes have each suffered a gene duplication.
      C. One of the two homologous chromosomes has undergone an inversion.
      D. Both of the two homologous chromosomes have undergone an inversion.
      E. One of a pair of homologous chromosomes has been lost via nondisjunction.
    solution: |

      Answer: A) Portions of non-homologous chromosomes have been translocated.

    question: |

      ![image](/CHALLENGEPICS/dna-repair-recombination-q4.png)

      When simultaneous deletion of two genes leads to cell death, deleting each gene individually does not. This is known as synthetic lethality. Synthetic lethal compounds have been screened in order to identify new drugs for cancer treatment, namely for breast cancer, where targeting different DNA repair pathways is a promising strategy for BRCA1/2 mutated tumors.

      Indicate whether each of the following statements are true or false:
      A. Synthetic lethality is not a promising strategy since treatment with the identified drug may cause death of both normal and tumor cells.
      B. Using an inhibitor against BRCA2 is not a successful strategy to target BRCA2- deficient tumors.
      C. Inhibiting RAD51 is a possible therapeutic approach to target BRCA2 deficient tumors.
      D. The use of PARP inhibitors is a synthetic lethal approach to target BRCA2 deficient tumors.
    solution: |

      A: FB: T
      C: F
      D: T
  - id: 5
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |

      DNA constantly accumulates mutations both during development and adult life, therefore several pathways exist which are meant to repair these damages. People with mutations in an autosomal gene encoding a DNA repair enzyme acquire more mutations in all chromosomes, including the X and Y chromosomes. However, the Y chromosome has fewer essential genes compared with the X chromosome. Three hypothetical couples are presented.
      Dr = homozygous mutant individuals, + = wild-type, M = male, F = female.

      Indicate the expected relative number of female (F) versus male (M) offspring these couples may have surviving into adulthood. Use the following symbols: (>, =, <)
    solution: |

      | Dr ♀, + ♂ | F | > | M |
      |---|---|---|---|
      | + ♀, + ♂ | F | = | M |
      | Dr ♀, Dr ♂ | F | > | M |

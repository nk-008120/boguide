  - id: 5
    difficulty: "hard"
    source: "USABO"
    contributor: "SM"
    question: |

      ![image](/CHALLENGEPICS/recombinant-dna-biotechnology-techniques-q5.png)

      YAC DNA (with its telomeres) is cleaved with HindIII, SacI, XhoI, or a combination of HindIII and SacI, HindIII and XhoI, or SacI and XhoI. After restriction digestion, the products of each reaction are loaded in separate wells of an agarose gel and separated by agarose-gel electrophoresis. The following fluorescence patterns are observed on the gel (Double line indicates that 2 fragments of similar size are generated by the digestion).

      Provide a restriction map for this YAC clone, and indicate on this map the distance between successive restriction sites.
    solution: |

      ![image](/CHALLENGEPICS/recombinant-dna-biotechnology-techniques-q5-sol.png)

      Answer -

      Solution: 
      Analyzing the fragments of single restriction enzyme digestion, we find out number of sites of each RE in YAC DNA, i.e., HindIII and XhoI has 2 sites while SacI has 1 site. RE map of 
      XhoI and SacI - Compare fragments of XhoI, SacI and XhoI+SacI digestion. 3 kb fragment is broken into 2.5 and 0.5 kb fragment and 4 kb fragment is broken into two 2 kb fragments. From here we can place SacI and XhoI sites in order.
      RE map of HindIII and SacI - Compare fragments of HindIII, SacI and HindIII + SacI digestion. 4.5 kb fragment is broken into 2 kb and 2.5 kb fragments and 3 kb fragment is broken into 0.5 kb and 2.5 kb fragments. From here we can place SacI and HindIII sites in order.Now, compare the two restriction maps obtained above to create final map of YAC DNA.

      Tip: To check if the map is correct or not, find the fragments made by HindIII + XhoI digestion and match it with fragments obtained in gel.

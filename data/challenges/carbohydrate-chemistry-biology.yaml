      ![image](/CHALLENGEPICS/carbohydrate-chemistry-biology-q4.png)

      The following is the structure of heparin, which is naturally produced by basophils and mast cells in the body and is also manufactured and distributed as the most widely used anticoagulant.

      A. Which class of macromolecules best describes heparin: (lipids/nucleic acids/carbohydrates/ proteins)

      B. Identify the circled covalent bonds as glycosidic/peptide/phosphodiester/ester bond and list the byproduct of the reaction that results in the formation of this covalent bond.

      C. Heparin is often used to purify nucleic acid (both DNA and RNA) binding proteins. Explain what the similarity between heparin and nucleic acids is that allows them to bind to these proteins.
    solution: |

      A: CarbohydratesSolution - 
      It is comprised of modified hexose monosaccharides linked to each other by glycosidic bond

      B: Glycosidic bond and H2O as by productSolution: Bonds between monosaccharides are called glycosidic bonds which form by dehydration reaction, 
      i.e, removal of water.

      C - Both heparin (due to SO3- groups) and nucleic acids (due to the PO43- of the sugar phosphate backbone) are negatively charged and therefore form ionic bonds with the nucleic acids binding proteins that are rich in amino acids with positively charged side chains

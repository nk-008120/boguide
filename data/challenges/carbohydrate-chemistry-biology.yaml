    question: |

      Read the following observations and some interpretations.
      Observations: 
      1. To preserve the sweet taste of a freshly picked corn, it is immersed in boiling water for a few minutes.
      2. The sweetness of honey decreases if it is heated.
      3. Commercial fructose cannot be used as a sweetener for hot drinks.

      Interpretations:
      I. The properties of sugar vary with temperature.
      II. Enzyme that converts starch to glucose is activated due to rise in temperature.
      III. Some sugars are thermostable hence their properties do not change with change in temperature.
      IV. Enzyme that converts glucose to starch is destroyed due to rise in temperature.

      Mark the correct interpretation against each observation.

      1 - _____________2 - 
      _____________3 - 
      _____________
    solution: |

      Answer - 1: IV, 2: I, 3: I

      Solution - 1 - 
      Fresh corn contains enzymes that convert sugars → starch, reducing sweetness. Boiling denatures these enzymes. Therefore, sugar is preserved and the corn remains sweet.

      2 - The sweetness of sugars can depend on temperature. Heating can alter the perceived sweetness of honey.

      3 - Fructose's perceived sweetness changes with temperature. At higher temperatures, its relative sweetness decreases, making it less effective as a sweetener in hot drinks.

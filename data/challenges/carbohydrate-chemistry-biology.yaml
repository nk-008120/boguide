    question: |

      ![image](/CHALLENGEPICS/carbohydrate-chemistry-biology-q5-1.png)

      Glycogen (and amylopectin) is a glucose polymer with some branching. Linear chains of these polymers consist of α(1→4) linkages and occasional branching is formed by α(1→6) linkage (Figure 1). For degradation in cells, glucose residues are released one-by-one from the end of the chains by phosphorylase up to the residue at the branching site. Then, the α(1→6) branching site is removed by a debranching enzyme.

      1) Given that a certain glycogen consisting of 10000 glucose residues is branched at every 10 residues, how many terminal chains are available for phosphorylase?

      A. A
      bout 10B. A
      bout 50C.
       About 100D.
       About 500E. A
      bout 1000F.
       About 5000

      2) For degradation of this glycogen by excess phosphorylase or by excess debranching enzyme, choose an appropriate graph for its breakdown from below. Assume that the phosphorylase releases all glucose residues from a linear chain without branching.

      ![image](/CHALLENGEPICS/carbohydrate-chemistry-biology-q5-2.png)

      3) Plant amylopectin is similar to glycogen but branching occurs much less frequently. Given that the branching of an amylopectin of similar size of glycogen is formed at every 25 residues, indicate the combination of correct descriptions about degradation of amylopectin by phosphorylase.

      A.
       Breakdown speed is slower than that of glycogenB.
       Breakdown speed is similar to that of glycogenC.
       Breakdown speed is faster than that of glycogenD.
       Final breakdown extent is smaller than that of glycogenE.
       Final breakdown extent is similar to that of glycogenF.
       Final breakdown extent is larger than that of glycogen
    solution: |

      1) Answer: D. About 500Solution - 
      10000 / 10 = 1000 → 1000 / 2 = 500 
      About half of linear chains can be exposed to phosphorylase.

      2) Answer: Phosphorylase - (3), Debranching enzyme - (1)Solution - 
      According to the figure 1 and Q1, phosphorylase degrades nearly half of total chains. The debranching enzyme only acts on the branching sites, which will be exposed by action of phosphorylase.

      3) Answer: A, ESolution - 
      Qualitatively, breakdown efficiency is dependent on the number of enzyme-accessible chains, which are smaller in amylopectin than glycogen because more branching produces more chains in glycogen than amylopectin. 10000 / 25 = 400. This means amylopectin of 10000 residues consists of 400 linear chains, half of which can be degraded by phosphorylase. Namely, number of phosphorylase-accessible linear chains in amylopectin (200), which corresponds to the speed of degradation, is less than half of that in glycogen (500).
      On the other hand, final breakdown extent of amylopectin (200 * 25 = 5000) is comparable to that of glycogen (500 * 10 = 5000).

    question: |

      ![image](/CHALLENGEPICS/carbohydrate-chemistry-biology-q3.png)

      The citric acid cycle is central to metabolism, for the supply energy and various key compounds. In citric acid cycle, the enzyme aconitase catalyzes the reversible conversion between citrate and isocitrate. In this reaction, OH group at C3 and H group at C4 of citrate are removed as water, thereafter a water molecule is added back in a reverse manner to generate isocitrate as given in figure. However, OH group is never added at C2.

      Indicate whether each of the following statements is True or False:
      A. Citrate has enantiomers
      B. Isocitrate has enantiomers
      C. Two:CH2COO- groups are stereochemically equivalent when citrate is free in solution
      D. Two:CH2COO- groups are stereochemically equivalent when citrate is bound to aconitase
    solution: |

      Answer: A: F, B: T, C: T, D: F

      Solution - Citrate is not chiral but stereochemically recognized by aconitase. The two -CH2COO- groups of enzyme-bound citrate can be distinguished by aconitase, because the substratebinding site of the enzyme is not symmetric. This was a critical issue when the citric acid cycle was proposed but later questioned by Krebs himself, and “TCA (tricarboxylic acid) cycle” was proposed instead of the “citric acid cycle”. Now we know the first product, citric acid, can be stereochemically recognized by aconitase.

    question: |

      ![image](/CHALLENGEPICS/cell-junctions-ecm-cell-death-q3.png)

      Hypoxia is a hallmark of solid tumors and plays a critical role in different steps of tumor progression. To develop an effective treatment against malignant tumors, it is important to understand how cancer cells that develop under hypoxic conditions, avoid apoptosis. The figure shows the mechanism of apoptosis.

      Using the information and figure, determine whether the following statement are true or false:A. Hypoxia in cancer cells suppresses apoptosis.

      B. Upon Bcl-2 overexpression, the integrity of the mitochondrial membranes is preserved, which in return prevents apoptosis.

      C. It is necessary to suppress p53 to ensure the apoptosis of cancer cells.

      D. Deficiency of Bax protein promotes apoptosis.
    solution: |

      Ans: A - F, B - T, C - T, D - F [Given]           A - T, B - T, C - F, D - F [personal]
  - id: 4
    difficulty: "medium"
    source: "IBO"
    contributor: "SM"
    question: |

      Sir Alastair Currie (1921-1994), Sir John Sulston (1942-present) and colleagues discovered how cells can commit controlled suicide (apoptosis). Apoptosis is executed by Caspase enzymes. Cyclohexamide (CH), which inhibits ribosomes, was used to induce apoptosis in cells treated with the hormone bone morphogenetic protein-9 (BMP9). To measure the number of apoptotic cells after treatment, inactive luciferase substrate, and the light-emitting enzyme luciferase, were added.

      ![image](/CHALLENGEPICS/cell-junctions-ecm-cell-death-q4.png)

      (I) Find reduction (in %) in the number of apoptotic cells when treated with CH + BMP9 compared to only CH treatment
    solution: |

      Ans: 66-68% [Value = 67.164%]

      (II) Indicate if each of the statements are true or false:A. BMP9 treatment causes an increase in apoptosis.

      B. A large excess of both inactive substrate and luciferase is required to give a linear luminescence signal in response to caspase activity.

      C. Caspase gene expression is increased during apoptosis.

      Ans: A: F, B: T, C - F

slug: "Amino-Acids-Protein-Chemistry"
title: "Amino Acids & Protein Chemistry Fundamentals"
questions:
  - id: 1
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |
      A scientist has isolated five different peptides (1 to 5) containing five amino acids (named A, B, C, D, E). He determined the mass and the sequence of each peptide. The data which he obtained is shown on the table below.

      | Peptide | Amino Acids Sequence | Mass (Da) |
      |---|---|---|
      | 1 | BCDACCDEDCB | 966 |
      | 2 | ABBCAEEDECB | 1099 |
      | 3 | BACDAEAEECA | 1357 |
      | 4 | CACADBACAEB | 1279 |
      | 5 | EDDCABBCCEE | 1014 |

      The mass of individual amino acids are shown in the table below:

      | Amino Acid | Mass (Da) | Amino Acid | Mass (Da) |
      |---|---|---|---|
      | Alanine | 89 | Leucine | 131 |
      | Arginine | 174 | Lysine | 146 |
      | Asparagine | 132 | Methionine | 149 |
      | Aspartic Acid | 133 | Phenylalanine | 165 |
      | Cysteine | 121 | Proline | 115 |
      | Glutamic Acid | 147 | Serine | 105 |
      | Glutamine | 146 | Threonine | 119 |
      | Glycine | 75 | Tryptophan | 204 |
      | Histidine | 155 | Tyrosine | 181 |
      | Isoleucine | 131 | Valine | 117 |

      Indicate if each of the following statements is True or False:

      A. Amino acid named C is serine

      B. Amino acid named A is tyrosine

      C. Amino acid named E is cysteine

      D. Amino acid named B is glycine
    solution: |
      **Answer: A – False, B – False, C – True, D – True**

      From the peptide masses and individual amino acid masses, the following linear equations can be made:

      1. A + 2B + 4C + 3D + E = 1146
      2. 2A + 3B + 2C + D + 3E = 1279
      3. 4A + B + 2C + D + 3E = 1537
      4. 4A + 2B + 3C + D + E = 1459
      5. A + 2B + 3C + 2D + 3E = 1194

      Eq. 3 − Eq. 2 → 2A − 2B = 258 → **A = Trp, B = Gly**

      Eq. 5 − Eq. 4 → D + 2E = 347 and 2×Eq. 2 − Eq. 1 → 5E − D = 500 → **D = Ser, E = Cys**

      From any equation → **C = Ala**

  - id: 2
    difficulty: "hard"
    source: "IBO"
    contributor: "SM"
    question: |
      The table below shows the chemical structure, pK₁, pK₂ and pK_R of some amino acids.

      ![Table of six amino acids (Gly, Ala, Ser, Asp, Glu, Lys) with structural formulas, pK1 (α-COOH), pK2 (α-NH2), and pKR (side chain) values](/CHALLENGEPICS/aa-q2-amino-acid-pka-table.png)

      A. Determine the predominant form (ionic or neutral) for heptapeptides A to C at pH 1, pH 7 and pH 12. Calculate their corresponding net charges (with an integer approximation) and fill in the table.

      B. Out of pH 1, pH 7 and pH 12, what is the best pH for the electrophoretic separation of these three peptides from each other?
    solution: |
      **General rule:** Species remain protonated below their pK and deprotonated above their pK. Do not take into account −COOH and −NH₂ groups of internal amino acids since they form peptide bonds. Only the −COOH group of the C-terminal amino acid, the −NH₂ group of the N-terminal amino acid, and side chains are relevant.

      **B. pH = 7** — at this pH the three peptides carry sufficiently different net charges for electrophoretic separation.

  - id: 3
    difficulty: "medium"
    source: "INBO"
    contributor: "SM"
    question: |
      The following is a cartoon depicting a protein structure, where C, S, N and Y represent Cysteine, Serine, Asparagine and Tyrosine respectively. The structure shows 5 transmembrane domains with cytosolic and extracellular regions.

      ![Cartoon of a transmembrane protein with 5 helical domains spanning the membrane, labeled residues C, S1, N, Y, S2 on the extracellular and cytosolic faces, NH3+ terminus at top and COO- terminus at bottom](/CHALLENGEPICS/aa-q3-transmembrane-protein-cartoon.png)

      Fill in the table below:

      | | C | S₁ | S₂ | N | Y |
      |---|---|---|---|---|---|
      | **Location** (Cytosolic / Transmembrane / Extracellular) | | | | | |
      | **Phosphorylation** (Yes/No) | | | | | |
      | **Glycosylation** (Yes/No) | | | | | |
    solution: |
      From the structure of the protein, we can see 5 transmembrane domains with 1 cytosolic and 1 extracellular domain.

      **Phosphorylation** occurs on Ser, Thr and Tyr residues by protein kinases present in the cytosol — so only residues on the cytosolic face are phosphorylated.

      **Glycosylation** occurs on Asn (N-linked) and Ser/Thr (O-linked) residues by enzymes in the ER and Golgi body — so only residues on the extracellular/luminal face are glycosylated.

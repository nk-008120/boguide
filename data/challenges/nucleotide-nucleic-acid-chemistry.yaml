    question: |

      Nucleic acids, a group of macromolecules, are characterized by distinctive structures and functions. Match the phrases on the left with the appropriate word or phrase on the right. [NOTE: Answers may be used more than once]

      | 1. Monomer of Nucleic Acids | a. Phosphate group |
      |---|---|
      | 2. A nucleotide is a sugar, a phosphate and a _________ | b. Deoxyribose |
      | 3. Sugar in DNA | C. RNA |
      | 4. Passed from parent to offspring | D. Nitrogenous base |
      | 5. Overall structure of DNA | E. A, T, C, G |
      | 6. Sugar of one nucleotide bonds to ________ of the next nucleotide | F. DNA |
      | 7. DNA is expressed through this intermediary | G. Ribose |
      | 8. Nitrogenous bases of DNA | H. Double Helix |
      | 9. Nitrogenous bases of RNA | I. Nucleotide |
      | 10. Sugar in RNA | J. A, U, C, G |
    solution: |

      Answer:

      1 - I

      2 - D

      3 - B

      4 - F

      5 - H

      6 - A

      7 - C

      8 - E

      9 - J

      10 - G

baseURL = "https://boguide.com/"
title = "BiOGuide for Biology Olympiads"
theme = "hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.katex]
    enable = true

[menu]
  [[menu.main]]
    name = "Resources"
    url = "/resources/"
    weight = 1
  [[menu.main]]
    name = "Papers"
    url = "/papers/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[params]
  [params.navbar]
    title = "BiOGuide for Biology Olympiads"
    [params.navbar.logo]
      path = "/logo.png"
      width = 40
      height = 40
      alt = "BioGuide Logo"
  [params.imageZoom]
    enable = true
  [params.footer]
    copyright = "© 2026 BioGuide for IBO Vilnius"
  toc = true
  
{{ partial "banner.html" . }}

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] });"></script>

<!-- Custom lightbox for images (works with tabs) -->
<style>
/* Lightbox overlay */
.lb-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  z-index: 10000;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
.lb-overlay img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  cursor: default;
}
.lb-overlay .close-hint {
  color: white;
  margin-top: 15px;
  font-size: 14px;
  opacity: 0.7;
}
</style>

<script>
(function() {
  // Create overlay once
  const overlay = document.createElement('div');
  overlay.className = 'lb-overlay';
  const overlayImg = document.createElement('img');
  const closeHint = document.createElement('div');
  closeHint.className = 'close-hint';
  closeHint.textContent = 'Click anywhere to close';
  overlay.appendChild(overlayImg);
  overlay.appendChild(closeHint);
  document.body.appendChild(overlay);

  // Close on click anywhere on overlay
  overlay.addEventListener('click', function(e) {
    // Don't close if clicking on the image itself (optional, but we close anyway)
    overlay.style.display = 'none';
  });

  // Function to attach click handlers to all images inside a container
  function enableLightbox(container) {
    const images = container.querySelectorAll('img');
    images.forEach(img => {
      // Avoid duplicate handlers
      if (img.hasAttribute('data-lb-enabled')) return;
      img.setAttribute('data-lb-enabled', 'true');
      img.style.cursor = 'pointer';
      img.addEventListener('click', function(e) {
        e.stopPropagation();
        overlayImg.src = this.src;
        overlay.style.display = 'flex';
      });
    });
  }

  // Initial enable on whole document
  enableLightbox(document);

  // Observe DOM changes to enable on dynamically added images (e.g., after tab switch)
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.nodeType === 1) { // Element node
          enableLightbox(node);
          // Also check inside the node
          if (node.querySelectorAll) {
            enableLightbox(node);
          }
        }
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // Also run when a tab becomes active (in case images load later)
  const tablist = document.querySelector('[role="tablist"]');
  if (tablist) {
    const tabObserver = new MutationObserver(function() {
      setTimeout(() => {
        const activePanel = document.querySelector('[role="tabpanel"]:not([style*="display: none"]), .tab-content.active');
        if (activePanel) enableLightbox(activePanel);
      }, 100);
    });
    tabObserver.observe(tablist, { attributes: true, childList: true, subtree: true });
  }
})();
</script>

name: Hugo build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Build site
        run: hugo --gc --minify

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install api/ dependencies (needed by the grading unit tests below)
        run: npm install

      - name: BiOLab RLS + submission-flow tests
        working-directory: tests/biolab
        run: |
          npm install
          npm test

      - name: General RLS hardening tests
        working-directory: tests/rls
        run: |
          npm install
          npm test

      - name: Grading logic unit tests
        working-directory: tests/grading
        run: npm test

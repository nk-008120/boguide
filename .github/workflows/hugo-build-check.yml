name: Hugo build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Check internal links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public --exclude-path public/papers 'public/**/*.html'
          fail: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install api/ dependencies (needed by the grading unit tests below)
        run: npm ci

      - name: BiOLab RLS + submission-flow tests
        working-directory: tests/biolab
        run: |
          npm ci
          npm test

      - name: General RLS hardening tests
        working-directory: tests/rls
        run: |
          npm ci
          npm test

      - name: Grading logic unit tests
        working-directory: tests/grading
        run: npm test

      - name: BiOClash paper vault tests
        working-directory: tests/vault
        run: npm test

      - name: API handler and redirect tests
        working-directory: tests/api
        run: npm test

      - name: Plaintext paper guard
        run: node scripts/bioclash-paper-vault.js guard

      - name: No admin pages in the published folder
        run: |
          if git ls-files static | grep -i admin; then
            echo "Admin pages must not be published from static/"
            exit 1
          fi

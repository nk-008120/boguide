name: Hugo build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Check internal links in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public --exclude-path public/papers 'public/**/*.html'
          fail: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Paths named in the documentation exist
        run: node scripts/check-doc-paths.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: No large files other than PDFs
        run: |
          large=$(git ls-files -z | xargs -0 du -b | awk -F'\t' '$1 > 2097152 && $2 !~ /^static\/papers\// && $2 !~ /\.pdf$/' || true)
          if [ -n "$large" ]; then
            echo "Files over 2 MB must be resized or kept out of the repository:"
            echo "$large"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install api/ dependencies (needed by the grading unit tests below)
        run: npm ci

      - name: BiOLab RLS + submission-flow tests
        working-directory: tests/biolab
        run: |
          npm ci
          npm test

      - name: General RLS hardening tests
        working-directory: tests/rls
        run: |
          npm ci
          npm test

      - name: Grading logic unit tests
        working-directory: tests/grading
        run: npm test

      - name: BiOClash paper vault tests
        working-directory: tests/vault
        run: npm test

      - name: API handler and redirect tests
        working-directory: tests/api
        run: npm test

      - name: Plaintext paper guard
        run: node scripts/bioclash-paper-vault.js guard

      - name: No admin pages in the published folder
        run: |
          if git ls-files static | grep -i admin; then
            echo "Admin pages must not be published from static/"
            exit 1
          fi
